name: CI

# PR 验证（不含部署）：lint + 构建 + 测试。Dependabot 与贡献者 PR 都走这里；
# main 分支的构建部署仍由 pages.yml 负责。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install "pytest>=7,<9"
        env:
          PYTHONUTF8: "1"
      - name: Lint (ruff check + format)
        run: |
          python -m pip install ruff
          ruff check scripts tests
          ruff format --check scripts tests
      - name: Build static site
        run: python scripts/build_all.py
      - name: Verify project
        run: python -m pytest tests/ -q

  browser:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build offline site
        run: python scripts/build_all.py
      - name: Verify learning records and coach handouts
        run: node --test tests/test_coach_model.cjs tests/quiz-records.cjs
      - name: Verify browser learning flow and offline upgrade
        run: |
          python tests/browser_server.py 8765 > /tmp/cfa-browser.log 2>&1 &
          python tests/browser_server.py 8876 > /tmp/cfa-offline.log 2>&1 &
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci open http://127.0.0.1:8765/quiz.html --browser=chrome
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_smoke.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_learning_audit.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_learning_recovery.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_favorite_labels.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_quiz_records.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_scale_quiz_history.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_interface.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_stats_rounds.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_case_citation.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_navigation.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_local_video.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_search_details.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_ifab_content.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_cheatsheet.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_learning_interop.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_favorite_tabs.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_rfef_media.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_exam_resume.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_quiz_backup.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_offline.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_compare.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_coach.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci close
