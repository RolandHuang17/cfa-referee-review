name: CI

# PR 验证（不含部署）：lint + 构建 + 测试。Dependabot 与贡献者 PR 都走这里；
# main 分支的构建部署仍由 pages.yml 负责。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install "pytest>=7,<9"
        env:
          PYTHONUTF8: "1"
      - name: Lint (ruff check + format)
        run: |
          python -m pip install ruff
          ruff check scripts tests
          ruff format --check scripts tests
      - name: Build static site
        run: python scripts/build_all.py
      - name: Verify project
        run: python -m pytest tests/ -q

  browser:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build offline site
        run: python scripts/build_all.py
      - name: Verify browser learning flow and offline upgrade
        run: |
          python tests/browser_server.py 8765 > /tmp/cfa-browser.log 2>&1 &
          python tests/browser_server.py 8876 > /tmp/cfa-offline.log 2>&1 &
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci open http://127.0.0.1:8765/quiz.html --browser=chrome
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_smoke.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename tests/browser_offline.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci close
