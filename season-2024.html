<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2024赛季中国足协裁判评议全集 · 新裁判教学合集</title>
<style>
:root{
  --bg:#eef2f7; --card:#fff; --ink:#1c2733; --muted:#5c6b7a; --line:#e3e9f0;
  --brand:#0b4c8c; --brand2:#1266b5;
  --red:#c0392b; --redbg:#fdeceb; --green:#1e7e34; --greenbg:#e9f6ec;
  --amber:#9a6700; --amberbg:#fff5e0; --bluebg:#eef4fb;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.7}

/* ---------- 顶栏(单行) ---------- */
.topbar{height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:linear-gradient(90deg,#0b3d73,#0b4c8c 60%,#1266b5);color:#fff;
  position:relative;z-index:40;overflow-x:auto;scrollbar-width:none}
.topbar::-webkit-scrollbar{display:none}
.topbar a.tbtn{text-decoration:none}
.topbar .tbtn.cur{background:rgba(255,255,255,.28);font-weight:700}
.topbar .brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.topbar .brand b{font-size:17px;letter-spacing:.5px}
.topbar .brand span{font-size:12.5px;color:#cfe2f5}
.topbar input[type=search]{flex:1;max-width:430px;min-width:120px;padding:7px 12px;
  border:1px solid #3a6ea8;border-radius:8px;background:rgba(255,255,255,.94);
  font-size:14px;color:var(--ink)}
.topbar select{padding:7px 8px;border:1px solid #3a6ea8;border-radius:8px;
  background:rgba(255,255,255,.94);font-size:13.5px;color:var(--ink);max-width:130px}
.tbtn{padding:7px 14px;border-radius:8px;border:1px solid #3a6ea8;cursor:pointer;
  background:rgba(255,255,255,.12);color:#e8f1fa;font-size:13.5px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.22)}
.tbtn.stat b{color:#ffd2cc}.tbtn.stat i{font-style:normal;color:#c9f0d2}

/* ---------- 三栏布局 ---------- */
.layout{display:grid;grid-template-columns:238px 336px 1fr;height:calc(100vh - 54px)}
body.sb-off .layout{grid-template-columns:0 336px 1fr}
body.sb-off .sidebar{display:none}

/* ---------- 侧栏 ---------- */
.sidebar{overflow-y:auto;background:#f8fafc;border-right:1px solid var(--line);
  padding:12px 10px 20px}
.side-h{font-size:12px;color:var(--muted);letter-spacing:1px;margin:14px 6px 6px;
  text-transform:uppercase}
.side-h:first-child{margin-top:2px}
.cat-item,.ver-item{display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  padding:7px 10px;border:none;background:none;border-radius:8px;cursor:pointer;
  font-size:13.8px;color:var(--ink);font-family:inherit}
.cat-item:hover,.ver-item:hover{background:#eef3f9}
.cat-item.on,.ver-item.on{background:var(--brand);color:#fff}
.cat-item.on small,.ver-item.on small{color:#cfe2f5}
.cat-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-item b,.ver-item b{font-weight:600;font-size:12.5px}
.cat-item small,.ver-item small{color:var(--muted);font-size:11.5px}
.ver-item .vdot{width:9px;height:9px;border-radius:50%;flex:none}
.side-link{display:block;margin:16px 6px 0;padding:8px 10px;border-radius:8px;
  background:var(--bluebg);color:var(--brand2);text-decoration:none;font-size:13px}
.side-link:hover{background:#dfeafa}
.sidebox{max-height:236px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;
  background:#fff;padding:4px}
.sidebox .cat-item{padding:5px 8px;font-size:13px}
.tav{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#e2e8f0;
  color:#475569;font-size:11px;align-items:center;justify-content:center;
  margin-right:3px;vertical-align:-4px;flex:none}
#compList .cat-item .nm, #teamList .cat-item .nm, #issueList .cat-item .nm{font-size:13px}

/* ---------- 播放列表 ---------- */
.plist{overflow-y:auto;background:#fff;border-right:1px solid var(--line)}
.plist-head{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);
  padding:8px 14px;font-size:12.5px;color:var(--muted)}
.ph{position:sticky;top:33px;z-index:4;padding:7px 14px 5px;font-size:13px;font-weight:700;
  color:var(--brand);background:#f4f8fc;border-bottom:1px solid var(--line)}
.ph b{color:var(--muted);font-weight:500;font-size:12px}
.prow{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;
  border-bottom:1px solid #f1f5f9}
.prow:hover{background:#f6f9fc}
.prow.sel{background:var(--bluebg);box-shadow:inset 3px 0 0 var(--brand2)}
.prow .dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.wrong{background:var(--red)}.dot.correct{background:#3a9d55}.dot.pending{background:#d9a514}
.prow .ptxt{flex:1;min-width:0}
.prow .ptxt b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.prow .ptxt i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .rv{flex:none;font-size:11px;border-radius:5px;padding:0 6px;
  background:var(--bluebg);color:var(--brand2)}
.prow .rv.bad{background:var(--redbg);color:var(--red)}
.prow .pmark{flex:none;font-size:12px}
.crest{width:auto;border-radius:3px;vertical-align:-3px;margin-right:3px;background:#fff}
.plist-empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* ---------- 详情区 ---------- */
.detail{overflow-y:auto;padding:18px 24px 40px}
.detail-empty{height:70vh;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:15px}
.d-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:18px 22px;box-shadow:0 1px 3px rgba(15,40,80,.05);max-width:1080px}
.d-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:4px}
.cid{color:var(--muted);font-size:13px;background:#f1f5f9;border-radius:6px;padding:2px 10px}
.d-head .match{flex-basis:100%;margin:2px 0 0;font-size:20px;font-weight:700;line-height:1.4}
.badge{padding:3px 13px;border-radius:16px;font-size:14px;font-weight:600;white-space:nowrap}
.b-wrong{background:var(--redbg);color:var(--red);border:1px solid #f2c4bf}
.b-correct{background:var(--greenbg);color:var(--green);border:1px solid #bfe3c8}
.b-pending{background:var(--amberbg);color:var(--amber);border:1px solid #ecd9a0}
.b-var{background:var(--bluebg);color:var(--brand2);border:1px solid #c9dcf2;font-weight:500}
.b-var.bad{background:var(--redbg);color:var(--red);border-color:#f2c4bf}
.d-video{margin:14px 0 4px}
.d-video video{width:100%;aspect-ratio:16/9;background:#0d1420;border-radius:10px;display:block}
.vsw-row{display:flex;gap:8px;margin:8px 0 2px}
.vsw{padding:3px 14px;border-radius:14px;border:1px solid #cbd5e1;background:#fff;
  cursor:pointer;font-size:13px;color:var(--muted)}
.vsw.on{background:var(--brand);border-color:var(--brand);color:#fff}
.d-note{font-size:13px;color:var(--muted);margin:6px 0 0}
.txt{font-size:15.5px;margin-top:10px}
.txt .lbl{color:var(--brand);font-weight:700}
.txt p{margin:8px 0;white-space:pre-wrap}
.txt .concl{background:#f6f9fc;border-left:3px solid var(--brand2);
  padding:10px 14px;border-radius:0 8px 8px 0}
.d-note-box{margin-top:12px;font-size:14px;background:#f6f9fc;border:1px solid var(--line);
  border-radius:8px;padding:8px 14px}
.d-note-box summary{cursor:pointer;color:var(--brand);font-weight:600;user-select:none}
.d-note-box div{margin-top:6px;color:#33475b}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:12.5px;color:var(--muted);background:#f1f5f9;border-radius:5px;padding:2px 9px}
.d-foot{font-size:13px;margin-top:12px}
.d-foot a{color:var(--brand2);text-decoration:none}
.d-foot a:hover{text-decoration:underline}
.d-nav{display:flex;gap:10px;margin-top:16px}
.d-nav button{flex:1;padding:10px;border-radius:9px;border:1px solid #cbd5e1;background:#fff;
  cursor:pointer;font-size:14.5px;color:var(--ink)}
.d-nav button:hover{border-color:var(--brand2);color:var(--brand2)}
.favbtn{padding:4px 16px;border-radius:16px;border:1px solid #cbd5e1;background:#fff;
  cursor:pointer;font-size:14px;color:var(--muted)}
.favbtn.on{background:#fff7d6;border-color:#e6c34a;color:#9a6700;font-weight:700}
.favtags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.ftag{padding:3px 12px;border-radius:14px;border:1px solid #cbd5e1;background:#fff;
  cursor:pointer;font-size:13px;color:var(--muted)}
.ftag.on{background:var(--brand);border-color:var(--brand);color:#fff}
.favtags input{padding:4px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:12.5px;width:110px}
.notewrap{margin-top:14px}
.notewrap textarea{width:100%;min-height:74px;padding:10px 12px;border:1px solid #cbd5e1;
  border-radius:9px;font-size:14px;font-family:inherit;resize:vertical;background:#fffdf5}
.notewrap .nstatus{font-size:12px;color:var(--muted)}
.kbd{font-size:11.5px;color:var(--muted);border:1px solid #cbd5e1;border-bottom-width:2px;
  border-radius:4px;padding:0 5px;margin:0 2px}

/* ---------- 弹层 ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(8,20,38,.55);z-index:90;
  display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:44px 16px}
.modal-mask.open{display:flex}
.modal{background:#fff;border-radius:14px;max-width:980px;width:100%;padding:22px 26px}
.modal h3{margin:0 0 12px;font-size:18px}
.modal .close{float:right;border:none;background:#f1f5f9;color:var(--muted);
  border-radius:8px;padding:4px 12px;cursor:pointer;font-size:13px}
.matrix table{border-collapse:collapse;width:100%;font-size:13.8px}
.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix tr:hover td{background:#f6f9fc}
.matrix .w{color:var(--red);font-weight:600}.matrix .g{color:var(--green);font-weight:600}
.matrix .p{color:var(--amber);font-weight:600}
.matrix tfoot td{font-weight:700;background:#f6f9fc}
.help p{margin:8px 0;font-size:14.5px}
.help b{color:var(--brand)}
.top-btn{position:fixed;right:22px;bottom:24px;background:var(--brand);color:#fff;
  border:none;border-radius:24px;padding:9px 18px;font-size:13.5px;cursor:pointer;z-index:30}

/* ---------- 响应式 ---------- */
@media (max-width:1180px){
  .layout{grid-template-columns:250px 1fr}
  .plist{grid-column:1 / 3}
  .detail{grid-column:1 / 3}
  body.detail-open .plist{display:none}
  body.detail-open .detail{grid-column:1 / 3}
}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  body{overflow:auto}
  .layout{height:auto}
  .sidebar{position:fixed;left:0;top:54px;bottom:0;width:260px;z-index:60;
    transform:translateX(-105%);transition:.15s;box-shadow:4px 0 14px rgba(0,0,0,.15)}
  body.sb-off .sidebar{display:block;transform:none}
  body.sb-off .layout{grid-template-columns:1fr}
  .plist{max-height:46vh}
  .topbar .brand span{display:none}
}
</style>
</head>

ideos":["2024/i02c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240403/1712140391520285.mp4"],"category":"goal_decision","tags":["进球无效","漏判攻方犯规"],"v":"wrong","var":"none"},{"seq":6,"issue":2,"no":3,"comp":"中甲联赛","round":"第4轮","home":"广西平果","away":"无锡吴钩","minute":"","match_info":"中甲第4轮广西平果哈嘹vs无锡吴钩，比赛第90+10分钟，进攻方队员在平果哈嘹队罚球区内与对方发生身体接触后倒地","desc":"判例三：中甲第4轮广西平果哈嘹vs无锡吴钩，比赛第90+10分钟，进攻方队员在平果哈嘹队罚球区内与对方发生身体接触后倒地。评议组一致认为，目前的视频不能清晰显示双方接触动作的细节，根据视频展现的内容以及评议原则，支持临场裁判员做出的不犯规的判罚决定。","appeal":"","conclusion":"","videos":["2024/i02c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240403/1712140407896375.mp4"],"category":"penalty_area","tags":["证据不足"],"v":"correct","var":"none"},{"seq":7,"issue":2,"no":4,"comp":"中甲联赛","round":"第4轮","home":"广西平果","away":"无锡吴钩","minute":"82","match_info":"中甲第4轮广西平果哈嘹vs无锡吴钩，比赛第82分钟，无锡吴钩队5号队员疑似用肘部击打对方队员","desc":"判例四：中甲第4轮广西平果哈嘹vs无锡吴钩，比赛第82分钟，无锡吴钩队5号队员疑似用肘部击打对方队员。评议组一致认为，无锡吴钩5号球员目的不在于争抢球，使用手臂故意击打广西平果哈嘹37号球员的面部，构成暴力行为，应予红牌罚令出场，临场裁判员漏判犯规、漏判红牌的决定属错误判罚。","appeal":"","conclusion":"","videos":["2024/i02c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240403/1712140465942927.mp4"],"category":"sfp_vc","tags":["漏判红牌","暴力行为","肘击"],"v":"wrong","var":"none"},{"seq":8,"issue":2,"no":5,"comp":"中乙联赛","round":"第2轮","home":"上海海港B队","away":"湖南湘涛","minute":"","match_info":"中乙第2轮上海海港B队vs湖南湘涛，比赛第90+11分钟，裁判员判罚湖南湘涛队25号队员手球犯规并判罚球点球","desc":"判例五：中乙第2轮上海海港B队vs湖南湘涛，比赛第90+11分钟，裁判员判罚湖南湘涛队25号队员手球犯规并判罚球点球。评议组大多数成员认为，视频角度不能完全反映球与队员手臂是否接触，根据队员手臂的位置和动作情况，即使与球有接触，也不构成手球犯规，临场裁判员判罚球点球属错误判罚。","appeal":"","conclusion":"","videos":["2024/i02c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240403/1712140509522870.mp4"],"category":"handball","tags":["错判点球","证据不足"],"v":"wrong","var":"none"},{"seq":9,"issue":3,"no":1,"comp":"中超联赛","round":"第4轮","home":"青岛海牛","away":"山东泰山","minute":"37","match_info":"中超第4轮青岛海牛VS山东泰山，比赛第37分钟，山东队进球后，经VAR介入和裁判员在场回看，判罚山东队在进攻发展阶段通过犯规获得球权，进球无效","desc":"判例一：中超第4轮青岛海牛VS山东泰山，比赛第37分钟，山东队进球后，经VAR介入和裁判员在场回看，判罚山东队在进攻发展阶段通过犯规获得球权，进球无效。评议组一致认为，在进攻发起初始阶段，山东泰山7号队员与青岛海牛10号队员争抢球并获得球权的动作属于犯规，并与随后的进球处于同一进攻发展阶段，经VAR介入，裁判员改判山东队进球无效的决定正确。另外，评议组部分成员认为，山东队进球的32号队员在与对方争抢球并获得球权时也存在犯规动作。","appeal":"","conclusion":"","videos":["2024/i03c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240417/1713343080554862.mp4"],"category":"goal_decision","tags":["VAR介入正确","进球无效","进攻发展阶段"],"v":"correct","var":"correct"},{"seq":10,"issue":3,"no":2,"comp":"中超联赛","round":"第5轮","home":"山东泰山","away":"河南俱乐部","minute":"22","match_info":"中超第5轮山东泰山VS河南俱乐部，比赛第22分钟，河南俱乐部20号队员起跳争抢空中球时肘部与对方队员头部有接触","desc":"判例二：中超第5轮山东泰山VS河南俱乐部，比赛第22分钟，河南俱乐部20号队员起跳争抢空中球时肘部与对方队员头部有接触。经VAR介入及裁判员在场回看，判罚河南俱乐部20号队员严重犯规，并向其出示红牌。对于此判例，评议组一致认为，河南俱乐部20号队员的动作属于严重犯规，经VAR介入，裁判员判罚其严重犯规并出示红牌罚令出场的决定正确。","appeal":"","conclusion":"","videos":["2024/i03c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240417/1713343271305907.mp4"],"category":"sfp_vc","tags":["红牌","严重犯规","VAR介入正确"],"v":"correct","var":"correct"},{"seq":11,"issue":3,"no":3,"comp":"中超联赛","round":"第5轮","home":"山东泰山","away":"河南俱乐部","minute":"69","match_info":"中超第5轮山东泰山VS河南俱乐部，比赛第69分钟，河南俱乐部27号队员在对方罚球区内与山东泰山2号队员争抢球时发生接触并倒地","desc":"判例三：中超第5轮山东泰山VS河南俱乐部，比赛第69分钟，河南俱乐部27号队员在对方罚球区内与山东泰山2号队员争抢球时发生接触并倒地。裁判员临场未判罚犯规，VAR未介入。对于此判例，评议组一致认为，山东队2号的动作属于争夺控球位置的正常、合理动作，裁判员临场作出的其不犯规的决定正确。","appeal":"","conclusion":"","videos":["2024/i03c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240417/1713343299307443.mp4"],"category":"penalty_area","tags":["正常接触"],"v":"correct","var":"none"},{"seq":12,"issue":3,"no":4,"comp":"中超联赛","round":"第5轮","home":"青岛西海岸","away":"天津津门虎","minute":"88","match_info":"中超第5轮青岛西海岸VS天津津门虎，比赛第88分钟，青岛西海岸10号队员与天津津门虎7号队员争抢球时，双方腿部发生接触","desc":"判例四：中超第5轮青岛西海岸VS天津津门虎，比赛第88分钟，青岛西海岸10号队员与天津津门虎7号队员争抢球时，双方腿部发生接触。裁判员临场出示红牌，VAR介入，裁判员在场回看后维持初始判罚。对于此判例，评议组一致认为，从青岛队10号队员与对方队员接触的情况看，其争抢动作属于鲁莽的犯规，不属于严重犯规，应出示黄牌警告，临场VAR介入正确，裁判员出示红牌以及回看后维持红牌的决定均为错误判罚。","appeal":"","conclusion":"","videos":["2024/i03c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240417/1713343333601081.mp4"],"category":"sfp_vc","tags":["红牌错误","鲁莽犯规"],"v":"wrong","var":"correct"},{"seq":13,"issue":3,"no":5,"comp":"中超联赛","round":"第6轮","home":"深圳新鹏城","away":"武汉三镇","minute":"6","match_info":"中超第6轮深圳新鹏城VS武汉三镇，比赛第6分钟，深圳新鹏城31号队员在本方罚球区内与武汉三镇19号队员争抢球时发生接触，后者随后倒地","desc":"判例五：中超第6轮深圳新鹏城VS武汉三镇，比赛第6分钟，深圳新鹏城31号队员在本方罚球区内与武汉三镇19号队员争抢球时发生接触，后者随后倒地。裁判员临场未判罚犯规，VAR未介入。对于此判例，评议组一致认为，双方的身体接触属于比赛正常范畴，武汉队19号队员借势倒地，深圳队31号队员不犯规，临场裁判员作出的不犯规的决定正确。","appeal":"","conclusion":"","videos":["2024/i03c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240417/1713343371444373.mp4"],"category":"penalty_area","tags":["正常接触"],"v":"correct","var":"none"},{"seq":14,"issue":3,"no":6,"comp":"中甲联赛","round":"第6轮","home":"大连英博","away":"辽宁铁人","minute":"80","match_info":"中甲第6轮大连英博VS辽宁铁人，比赛第80分钟，辽宁铁人7号队员带球进入对方罚球区，大连英博11号队员铲球，裁判员临场未作犯规判罚","desc":"判例六：中甲第6轮大连英博VS辽宁铁人，比赛第80分钟，辽宁铁人7号队员带球进入对方罚球区，大连英博11号队员铲球，裁判员临场未作犯规判罚。对于此判例，评议组多数成员认为，从现有视频呈现的情况看，防守队员铲球时先触及球，随后与对方队员的接触也不属于犯规动作，临场裁判员作出的不犯规的决定正确。","appeal":"","conclusion":"","videos":["2024/i03c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240417/1713343406965832.mp4"],"category":"penalty_area","tags":["铲球先触球"],"v":"correct","var":"none"},{"seq":15,"issue":3,"no":7,"comp":"中甲联赛","round":"第6轮","home":"黑龙江冰城","away":"江西庐山","minute":"5","match_info":"中甲第6轮黑龙江冰城VS江西庐山，比赛第5分钟，黑龙江冰城23号队员拦截对方传球时触球，裁判员临场判罚其不是手球犯规，比赛继续","desc":"判例七：中甲第6轮黑龙江冰城VS江西庐山，比赛第5分钟，黑龙江冰城23号队员拦截对方传球时触球，裁判员临场判罚其不是手球犯规，比赛继续。对于此判例，评议组一致认为，现有视频无法清晰展示队员与球接触的身体部位，以及队员手臂的位置和动作过程。多数成员认为，从队员总体动作情况判断，裁判员临场作出的不是手球犯规的决定，应予支持。","appeal":"","conclusion":"","videos":["2024/i03c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240417/1713343419905190.mp4"],"category":"handball","tags":["证据不足"],"v":"correct","var":"none"},{"seq":16,"issue":3,"no":8,"comp":"中乙联赛","round":"第4轮","home":"山东泰山金钢山","away":"廊坊荣耀之城","minute":"16","match_info":"中乙第4轮山东泰山金钢山VS廊坊荣耀之城，比赛第16分钟，廊坊队12号守门员在本方罚球区外防守山东泰山金钢山队46号队员进攻时，对方进攻球员倒地，裁判员临场判罚廊坊队守门员通过犯规破坏了对方明显的进球得分机会（DOGSO），并出示红牌将廊坊队12号守门员罚令出场","desc":"判例八：中乙第4轮山东泰山金钢山VS廊坊荣耀之城，比赛第16分钟，廊坊队12号守门员在本方罚球区外防守山东泰山金钢山队46号队员进攻时，对方进攻球员倒地，裁判员临场判罚廊坊队守门员通过犯规破坏了对方明显的进球得分机会（DOGSO），并出示红牌将廊坊队12号守门员罚令出场。对于此判例，评议组多数成员认为，廊坊队12号守门员的防守动作属于破坏了对方明显的进球得分机会的犯规；部分成员指出现有视频无法绝对清晰地展示双方身体接触情况，应支持和尊重临场裁判员判罚，因此评议组认定临场裁判员作出的以DOGSO为由出示红牌的决定正确。","appeal":"","conclusion":"","videos":["2024/i03c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240417/1713343501852284.mp4"],"category":"dogso","tags":["红牌","DOGSO","守门员"],"v":"correct","var":"none"},{"seq":17,"issue":4,"no":1,"comp":"中超联赛","round":"第7轮","home":"成都蓉城","away":"深圳新鹏城","minute":"53","match_info":"中超第7轮成都蓉城VS深圳新鹏城，比赛第53分钟，深圳新鹏城20号队员在本方罚球区内封堵对方射门时手臂触球","desc":"判例一：中超第7轮成都蓉城VS深圳新鹏城，比赛第53分钟，深圳新鹏城20号队员在本方罚球区内封堵对方射门时手臂触球。裁判员临场未判罚犯规，经VAR介入后，裁判员在场回看，改判深圳新鹏城20号队员手球犯规，判罚球点球并向其出示黄牌。对于此判例，评议组成员一致认为：深圳新鹏城20号队员肘部触球，身体有转身外展动作，手臂触球时扩大了身体面积，不属于正常位置，经VAR介入后，临场裁判员最终改判其手球犯规并判罚球点球的决定正确。犯规队员通过手球犯规阻挡了对方射向球门的球，守门员具有扑救的可能，裁判员以阻止对方有希望的进攻为由对其出示黄牌警告的决定正确。","appeal":"","conclusion":"","videos":["2024/i04c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240424/1713930044219307.mp4"],"category":"handball","tags":["点球","VAR介入正确","黄牌"],"v":"correct","var":"correct"},{"seq":18,"issue":4,"no":2,"comp":"中超联赛","round":"第7轮","home":"北京国安","away":"青岛西海岸","minute":"53","match_info":"中超第7轮北京国安VS青岛西海岸，比赛第53分钟，青岛西海岸33号队员与北京国安11号队员争抢球时相撞，裁判员临场判罚青岛西海岸队33号犯规，并出示红牌罚令出场，VAR随之介入，裁判员在场回看后维持红牌的决定","desc":"判例二：中超第7轮北京国安VS青岛西海岸，比赛第53分钟，青岛西海岸33号队员与北京国安11号队员争抢球时相撞，裁判员临场判罚青岛西海岸队33号犯规，并出示红牌罚令出场，VAR随之介入，裁判员在场回看后维持红牌的决定。对于此判例，评议组一致认为，青岛西海岸队33号队员的脚部接触对方队员腿部时未形成严重的踩踏或蹬踹，但其膝部与对方队员的接触严重危及对方队员安全，犯规动作的整体速度和强度达到了使用过分力量的严重程度，在比赛中不可接受。该犯规行为应属于严重犯规，临场裁判员最终维持红牌罚令出场的决定正确。视频助理裁判员在与裁判员沟通时，在判罚尺度、回看分析侧重点等方面出现偏差，介入错误。","appeal":"","conclusion":"","videos":["2024/i04c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240424/1713929943561110.mp4"],"category":"sfp_vc","tags":["红牌","严重犯规","VAR介入错误"],"v":"correct","var":"wrong"},{"seq":19,"issue":5,"no":1,"comp":"中超联赛","round":"第8轮","home":"浙江俱乐部绿城","away":"北京国安","minute":"82","match_info":"中超联赛第8轮浙江VS北京国安，比赛第82分钟，浙江队45号队员与北京国安队17号队员在后者罚球区内争抢时，双方发生身体接触并倒地","desc":"判例一：中超联赛第8轮浙江VS北京国安，比赛第82分钟，浙江队45号队员与北京国安队17号队员在后者罚球区内争抢时，双方发生身体接触并倒地。裁判员未判罚犯规，VAR介入，裁判员在场回看后，改判北京国安队17号队员犯规，并判罚球点球。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：浙江队45号队员在争抢时犯规在先，北京国安队17号队员随后的动作不应视为犯规，裁判员最终改判罚球点球的决定错误；VAR介入错误。","videos":["2024/i05c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240430/1714483430464670.mp4"],"category":"penalty_area","tags":["点球错误","VAR介入错误","攻方犯规在先"],"v":"wrong","var":"wrong"},{"seq":20,"issue":5,"no":2,"comp":"中超联赛","round":"第8轮","home":"上海海港","away":"上海申花","minute":"","match_info":"中超联赛第8轮上海海港VS上海申花，比赛第90+5分钟，上海申花队20号队员处于越位位置，并在其队友射门时做出躲避来球的动作","desc":"判例二：中超联赛第8轮上海海港VS上海申花，比赛第90+5分钟，上海申花队20号队员处于越位位置，并在其队友射门时做出躲避来球的动作。球打进球门后，第一助理裁判员举旗判罚越位犯规在先，裁判员判进球无效。VAR介入，裁判员在场回看后维持越位犯规进球无效的决定。","appeal":"","conclusion":"对于此判例，评议组成员一致认为：上海申花队20号队员在其队友射门触球时处于越位位置，躲避球的动作属于影响对方守门员处理球能力的明显举动，构成干扰对方队员的越位犯规，第一助理裁判员的越位判罚正确；裁判员判罚进球无效并在回看后维持判罚的决定正确；VAR介入错误。","videos":["2024/i05c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240430/1714483577453943.mp4"],"category":"offside","tags":["越位","干扰对方队员","VAR介入错误"],"v":"correct","var":"wrong"},{"seq":21,"issue":5,"no":3,"comp":"中乙联赛","round":"第6轮","home":"大连鲲城","away":"湖北青年星","minute":"3","match_info":"中乙联赛第6轮大连鲲城VS湖北青年星，比赛第3分钟，大连鲲城队前场任意球踢出后，该队13号队员在越位位置做出动作，之后经湖北青年星队守门员扑救以及大连鲲城队补射，球进入球门，裁判员判罚进球有效","desc":"判例三：中乙联赛第6轮大连鲲城VS湖北青年星，比赛第3分钟，大连鲲城队前场任意球踢出后，该队13号队员在越位位置做出动作，之后经湖北青年星队守门员扑救以及大连鲲城队补射，球进入球门，裁判员判罚进球有效。","appeal":"","conclusion":"对于此判例，评议组成员一致认为：大连鲲城队13号队员在其队友主罚任意球触球时处在越位位置，其后续动作影响了对方守门员处理球的能力，构成干扰对方队员的越位犯规，第二助理裁判员漏判越位犯规；裁判员判进球有效的决定错误。","videos":["2024/i05c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240430/1714483672708162.mp4"],"category":"offside","tags":["漏判越位","干扰对方队员","进球无效"],"v":"wrong","var":"none"},{"seq":22,"issue":5,"no":4,"comp":"女超联赛","round":"第5轮","home":"北京雨虹修缮女足","away":"长春 龙队7号出示红牌将其罚令出场。","appeal":"","conclusion":"对于此判例，评议组成员一致认为，上海嘉定汇龙队7号队员的行为不属于暴力行为，应以非体育行为对双方队员均出示黄牌警告。裁判员向黑龙江冰城队22号出示黄牌的决定正确，向上海嘉定队7号出示红牌的决定错误。","videos":["2024/i05c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240430/1714483841426729.mp4"],"category":"sfp_vc","tags":["红牌错误","非体育行为"],"v":"wrong","var":"none"},{"seq":26,"issue":5,"no":8,"comp":"中甲联赛","round":"第8轮","home":"黑龙江冰城","away":"上海嘉定汇龙","minute":"31","match_info":"中甲联赛第8轮黑龙江冰城VS上海嘉定汇龙，比赛第31分钟，上海嘉定汇龙队获得角球，角球发出后，上海嘉定汇龙7号倒钩射门，球接触到其身后的黑龙江冰城队队员身体后反弹到地面，裁判员未作判罚","desc":"判例八：中甲联赛第8轮黑龙江冰城VS上海嘉定汇龙，比赛第31分钟，上海嘉定汇龙队获得角球，角球发出后，上海嘉定汇龙7号倒钩射门，球接触到其身后的黑龙江冰城队队员身体后反弹到地面，裁判员未作判罚。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：现有视频没有呈现出球与黑龙江冰城队防守队员接触的详细情况，从现有情况看，黑龙江冰城队队员不构成手球犯规，裁判员做出的不犯规的决定应予支持。","videos":["2024/i05c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240430/1714483870647532.mp4"],"category":"handball","tags":["证据不足"],"v":"correct","var":"none"},{"seq":27,"issue":5,"no":9,"comp":"中甲联赛","round":"第8轮","home":"黑龙江冰城","away":"上海嘉定汇龙","minute":"23","match_info":"中甲联赛第8轮黑龙江冰城VS上海嘉定汇龙，比赛第23分钟，黑龙江冰城队获得角球，角球发出后，球落地反弹后与上海嘉定汇龙队10号队员身体有接触，裁判员判罚上海嘉定汇龙队10号手球犯规，并判罚球点球","desc":"判例九：中甲联赛第8轮黑龙江冰城VS上海嘉定汇龙，比赛第23分钟，黑龙江冰城队获得角球，角球发出后，球落地反弹后与上海嘉定汇龙队10号队员身体有接触，裁判员判罚上海嘉定汇龙队10号手球犯规，并判罚球点球。","appeal":"","conclusion":"对于此判例，评议组成员一致认为：从现有视频呈现的情况看，球并未接触上海嘉定汇龙10号队员的手臂，不构成手球犯规。裁判员临场做出的手球犯规和罚球点球的决定错误。","videos":["2024/i05c09-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240430/1714483894721145.mp4"],"category":"handball","tags":["错判点球","球未触手臂"],"v":"wrong","var":"none"},{"seq":28,"issue":5,"no":10,"comp":"中甲联赛","round":"第8轮","home":"黑龙江冰城","away":"上海嘉定汇龙","minute":"86","match_info":"中甲联赛第8轮黑龙江冰城VS上海嘉定汇龙，比赛第86分钟，上海嘉定汇龙队31号带球进入对方罚球区内，在与对方队员身体接触后倒地，上海嘉定汇龙队31号起身继续带球，随后与对方2号队员身体接触后倒地，裁判员未作犯规判罚","desc":"判例十：中甲联赛第8轮黑龙江冰城VS上海嘉定汇龙，比赛第86分钟，上海嘉定汇龙队31号带球进入对方罚球区内，在与对方队员身体接触后倒地，上海嘉定汇龙队31号起身继续带球，随后与对方2号队员身体接触后倒地，裁判员未作犯规判罚。","appeal":"","conclusion":"对于此判例，评议组成员一致认为，两次身体接触中黑龙江冰城队队员均不构成犯规，上海嘉定汇龙队31号第二次倒地的动作有故意夸大接触程度的成分，也并非对方的动作导致。裁判员做出的不犯规的决定正确。","videos":["2024/i05c10-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240430/1714483937977629.mp4"],"category":"penalty_area","tags":["正常接触","主动倒地"],"v":"correct","var":"none"},{"seq":29,"issue":6,"no":1,"comp":"中超联赛","round":"第9轮","home":"浙江俱乐部绿城","away":"河南俱乐部","minute":"21","match_info":"中超联赛第9轮浙江俱乐部VS河南俱乐部，比赛第21分钟，双方队员起跳争抢头球时，浙江队29号队员手臂与河南队20号队员有接触","desc":"判例一：中超联赛第9轮浙江俱乐部VS河南俱乐部，比赛第21分钟，双方队员起跳争抢头球时，浙江队29号队员手臂与河南队20号队员有接触。裁判员判浙江队29号队员犯规，并向其出示黄牌。","appeal":"","conclusion":"对于此判例，评议组一致认为：浙江队29号队员在争抢头球时不合理使用手臂并击打到对方队员，但并非将手臂作为武器攻击对方，从接触的动作和强度看，属于鲁莽犯规，应出示黄牌警告，不属于严重犯规，不应出示红牌。裁判员判浙江队29号犯规并出示黄牌的决定正确。","videos":["2024/i06c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240504/1714832615260791.mp4"],"category":"sfp_vc","tags":["黄牌","红牌不成立","挥臂"],"v":"correct","var":"none"},{"seq":30,"issue":6,"no":2,"comp":"中超联赛","round":"第9轮","home":"浙江俱乐部绿城","away":"河南俱乐部","minute":"","match_info":"中超联赛第9轮浙江俱乐部VS河南俱乐部，比赛第45+2分钟，双方队员在浙江队罚球区内起跳争抢球时，浙江队29号队员手臂与河南队20号队员有接触","desc":"判例二：中超联赛第9轮浙江俱乐部VS河南俱乐部，比赛第45+2分钟，双方队员在浙江队罚球区内起跳争抢球时，浙江队29号队员手臂与河南队20号队员有接触。裁判员未判罚犯规，VAR介入，裁判员经在场回看后，改判浙江队29号队员犯规并判罚球点球。","appeal":"","conclusion":"对于此判例，评议组一致认为：浙江队29号队员在争抢头球时不合理使用手臂并击打到对方队员，属于鲁莽犯规，不属于严重犯规，应出示黄牌警告。VAR介入正确，裁判员经在场回看后改判浙江队29号队员犯规并判罚球点球的最终决定正确，但漏判浙江队29号队员黄牌。","videos":["2024/i06c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240504/1714832734613075.mp4"],"category":"handball","tags":["点球","漏判黄牌","VAR介入正确"],"v":"wrong","var":"correct"},{"seq":31,"issue":6,"no":3,"comp":"中超联赛","round":"第9轮","home":"浙江俱乐部绿城","away":"河南俱乐部","minute":"13","match_info":"中超联赛第9轮浙江俱乐部VS河南俱乐部，比赛第13分钟，浙江队45号队员在对方罚球区内射门，球与河南队3号队员的手臂有接触","desc":"判例三：中超联赛第9轮浙江俱乐部VS河南俱乐部，比赛第13分钟，浙江队45号队员在对方罚球区内射门，球与河南队3号队员的手臂有接触。裁判员判罚河南队3号队员手球犯规并判罚球点球，VAR未介入。","appeal":"","conclusion":"对于此判例，评议组一致认为：河南队3号队员的动作属于封堵拦截对方的射门，手臂离开身体，即使是用于倒地支撑，按照竞赛规则以及本年度统一判罚尺度要求，应视为手球犯规，该手球犯规阻挡了对方射向球门的球，应以破坏有希望的进攻为由出示黄牌警告。另外，浙江队45号队员在射门前停球时手臂未触球，不存在手球犯规。裁判员判罚河南队3号队员手球犯规并判罚球点球的决定正确，但漏判河南队3号黄牌。","videos":["2024/i06c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240504/1714832841520002.mp4"],"category":"handball","tags":["点球","漏判黄牌","封堵射门"],"v":"wrong","var":"none"},{"seq":32,"issue":6,"no":4,"comp":"中超联赛","round":"第9轮","home":"浙江俱乐部绿城","away":"河南俱乐部","minute":"2","match_info":"中超联赛第9轮浙江俱乐部VS河南俱乐部，比赛第2分钟，河南队进球，裁判员判进球有效，VAR介入，裁判员经在场回看后，认定在该进球的进攻发起阶段，河南队13号队员在与浙江队17号队员争抢球时犯规，改判河南队进球无效","desc":"判例四：中超联赛第9轮浙江俱乐部VS河南俱乐部，比赛第2分钟，河南队进球，裁判员判进球有效，VAR介入，裁判员经在场回看后，认定在该进球的进攻发起阶段，河南队13号队员在与浙江队17号队员争抢球时犯规，改判河南队进球无效。","appeal":"","conclusion":"对于此判例，评议组一致认为：河南队13号队员在与浙江队17号队员争抢球时犯规，河南队控球后进攻直至进球，属于同一进攻发展阶段。VAR介入正确，裁判员经在场回看后改判河南队进球无效的最终决定正确。","videos":["2024/i06c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240504/1714832945628659.mp4"],"category":"goal_decision","tags":["VAR介入正确","进球无效","进攻发展阶段"],"v":"correct","var":"correct"},{"seq":33,"issue":6,"no":5,"comp":"中超联赛","round":"第9轮","home":"浙江俱乐部绿城","away":"河南俱乐部","minute":"36","match_info":"中超联赛第9轮浙江俱乐部VS河南俱乐部，比赛第36分钟，浙江队主罚角球，随后球被河南队36号队员头球解围出罚球区，争抢头球时浙江队2号与河南队36号有身体接触","desc":"判例五：中超联赛第9轮浙江俱乐部VS河南俱乐部，比赛第36分钟，浙江队主罚角球，随后球被河南队36号队员头球解围出罚球区，争抢头球时浙江队2号与河南队36号有身体接触。随后浙江队通过一系列传球和进攻发展，再次攻入河南队罚球区并取得进球。裁判员判进球有效。","appeal":"","conclusion":"对于此判例，评议组一致认为：河南队头球解围后，浙江队重新获得控球权，将球传至本方左路再次展开进攻，此时进攻发展阶段已经重置，随后的进球与此前双方在河南队罚球区内的头球争抢不属于同一进攻发展阶段，在形成进球的进攻过程中未发生犯规或违规行为，进球有效。另外，评议组多数成员认为，浙江队2号在角球开出后与对方队员的头球争抢，也属于可接受的身体接触，本身也不构成犯规。裁判员判罚进球有效的决定正确。","videos":["2024/i06c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240504/1714832988980827.mp4"],"category":"goal_decision","tags":["进攻发展阶段重置","进球有效"],"v":"correct","var":"none"},{"seq":34,"issue":6,"no":6,"comp":"中甲联赛","round":"第8轮","home":"无锡吴钩","away":"南京城市","minute":"85","match_info":"中甲联赛第8轮无锡吴钩VS南京城市，比赛第85分钟，无锡吴钩队进攻时将球传中至南京城市队罚球区内，无锡队19号队员将球顶向对方球门，无锡队18号队员与对方队员争抢后，球进入球门，裁判员判进球有效","desc":"判例六：中甲联赛第8轮无锡吴钩VS南京城市，比赛第85分钟，无锡吴钩队进攻时将球传中至南京城市队罚球区内，无锡队19号队员将球顶向对方球门，无锡队18号队员与对方队员争抢后，球进入球门，裁判员判进球有效。","appeal":"","conclusion":"对于此判例，评议组一致认为：在无锡吴钩队19号队员头顶球时，从现有视频的角度，无法清晰明显呈现无锡队18号队员是否较对方倒数第二名队员更接近球门线，是否处于越位位置，应支持临场裁判员的判断，后续无锡队18号与对方队员的争抢不存在犯规。裁判员做出的进球有效的决定应予支持。","videos":["2024/i06c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240504/1714833025749626.mp4"],"category":"offside","tags":["证据不足"],"v":"correct","var":"none"},{"seq":35,"issue":6,"no":7,"comp":"中甲联赛","round":"第8轮","home":"石家庄功夫","away":"大连英博","minute":"45","match_info":"中甲联赛第8轮石家庄功夫VS大连英博，比赛第45分钟，大连英博队29号队员带球进入对方罚球区内射门，球被石家庄功夫队守门员扑救反弹后，石家庄功夫队25号队员手臂与球有接触，裁判员判罚不是手球犯规，比赛继续","desc":"判例七：中甲联赛第8轮石家庄功夫VS大连英博，比赛第45分钟，大连英博队29号队员带球进入对方罚球区内射门，球被石家庄功夫队守门员扑救反弹后，石家庄功夫队25号队员手臂与球有接触，裁判员判罚不是手球犯规，比赛继续。","appeal":"","conclusion":"对于此判例，评议组一致认为：石家庄队25号队员手臂触球前，其腿部有主动处理球的动作并且接触球，球反弹后接触其手臂，手臂无主动触球的附加动作，按照竞赛规则以及本年度统一判罚尺度要求，不应视为手球犯规。裁判员临场做出的不是手球犯规的决定正确。","videos":["2024/i06c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240504/1714833097599636.mp4"],"category":"handball","tags":["腿部先触球"],"v":"correct","var":"none"},{"seq":36,"issue":6,"no":8,"comp":"中甲联赛","round":"第8轮","home":"石家庄功夫","away":"大连英博","minute":"46","match_info":"中甲联赛第8轮石家庄功夫VS大连英博，比赛第46分钟，大连英博队18号队员带球进入对方罚球区，石家庄功夫队2号队员与其争抢后，大连英博队18号倒地，裁判员临场判罚不犯规","desc":"判例八：中甲联赛第8轮石家庄功夫VS大连英博，比赛第46分钟，大连英博队18号队员带球进入对方罚球区，石家庄功夫队2号队员与其争抢后，大连英博队18号倒地，裁判员临场判罚不犯规。","appeal":"","conclusion":"对于此判例，评议组一致认为：从现有的视频呈现来看，石家庄队2号出脚争抢的动作，从与对方的接触和力度考虑，不构成犯规，大连英博队18号倒地动作存在夸大，但不构成佯装违规。裁判员临场判罚双方均不犯规的决定应予支持。\n另外，在中国足协公布上一期（20240429期）评议结果后，有媒体人士在社交媒体中指出，在认定上海海港队对上海申花队比赛中申花队越位犯规进球无效的判例中，从官方转播画面看，裁判员在进球后第一时间通过手势示意进球有效，后经VAR介入后改判为越位犯规进球无效，而中国足协公布的评议结果中认为裁判员初始判罚为越位犯规进球无效，经在场回看后维持进球无效的判罚，属于错误信息。对此，中国足协及其裁委会评议组做出澄清说明，在此判例中，裁判员在球进入球门的第一时间通过手势示意进球有效，随后第一助理裁判员举旗示意攻方越位犯规，裁判员随即改判进球无效，该改判符合竞赛规则规定的裁判员职责。但此时进球方队员已开始聚集庆祝进球，转播镜头未表现出助理裁判员和裁判员的判罚决定。裁判员通过耳麦向视频助理裁判员明确表示场上初始判罚是越位犯规进球无效，随后视频助理裁判员介入的原因是认为攻方不是越位犯规，进球有效。裁判员经在场回看后维持越位犯规进球无效的判罚。中国足协在该期评议中发布的信息准确无误，但在释疑解惑、回应大众关切方面还须继续改进。","videos":["2024/i06c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240504/1714833121589493.mp4"],"category":"penalty_area","tags":["佯装不成立","夸大接触"],"v":"correct","var":"none"},{"seq":37,"issue":7,"no":1,"comp":"中超联赛","round":"第10轮","home":"武汉三镇","away":"青岛海牛","minute":"17","match_info":"中超联赛第10轮武汉三镇VS青岛海牛，比赛第17分钟，青岛海牛3号队员在本方罚球区内防守武汉三镇7号队员时，双方发生接触，随后武汉三镇7号队员倒地","desc":"判例一：中超联赛第10轮武汉三镇VS青岛海牛，比赛第17分钟，青岛海牛3号队员在本方罚球区内防守武汉三镇7号队员时，双方发生接触，随后武汉三镇7号队员倒地。裁判员临场判罚青岛海牛3号队员犯规并判罚球点球，VAR未介入。","appeal":"","conclusion":"对于此判例，评议组一致认为：青岛海牛3号在对方队员射门后与对方的接触属于草率的犯规，应判罚犯规和罚球点球，无需出示红黄牌。裁判员判青岛海牛3号犯规并判罚球点球的决定正确。","videos":["2024/i07c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240508/1715161590436962.mp4"],"category":"penalty_area","tags":["点球","草率犯规"],"v":"correct","var":"none"},{"seq":38,"issue":7,"no":2,"comp":"中超联赛","round":"第10轮","home":"深圳新鹏城","away":"上海海港","minute":"77","match_info":"中超联赛第10轮深圳新鹏城VS上海海港，比赛第77分钟，上海海港8号队员射门，深圳新鹏城20号队员在本方罚球区内手臂与球有接触","desc":"判例二：中超联赛第10轮深圳新鹏城VS上海海港，比赛第77分钟，上海海港8号队员射门，深圳新鹏城20号队员在本方罚球区内手臂与球有接触。裁判员临场未判罚犯规，VAR介入。经在场回看后，裁判员改判深圳新鹏城20号队员手球犯规和罚球点球，并向其出示黄牌。","appeal":"","conclusion":"对于此判例，评议组一致认为：上海海港8号射门时，无论球是否经深圳新鹏城10号封堵接触，均未明显变向折射，深圳新鹏城队20号队员左手臂触球时，手臂位置使身体不自然地扩大，应视为手球犯规并判罚球点球。同时，因手球犯规阻挡了对方射向球门的球，应以阻止对方有希望的进攻为由出示黄牌。VAR介入正确，裁判员经在场回看后改判手球犯规和罚球点球并出示黄牌的最终决定正确。","videos":["2024/i07c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240508/1715161608293391.mp4"],"category":"handball","tags":["点球","VAR介入正确","黄牌"],"v":"correct","var":"correct"},{"seq":39,"issue":7,"no":3,"comp":"中超联赛","round":"第10轮","home":"北京国安","away":"成都蓉城","minute":"24","match_info":"中超联赛第10轮北京国安VS成都蓉城，比赛第24分钟，北京国安23号队员争抢球时与成都蓉城39号队员有接触，后者倒地","desc":"判例三：中超联赛第10轮北京国安VS成都蓉城，比赛第24分钟，北京国安23号队员争抢球时与成都蓉城39号队员有接触，后者倒地。裁判员判罚北京国安23号队员（已有一张黄牌）犯规，未出示红黄牌。","appeal":"","conclusion":"对于此判例，评议组一致认为：考虑北京国安23号争抢时犯规动作的意图、争抢方式、强度以及与对方接触的情况，应视为鲁莽的犯规，并出示黄牌。裁判员判罚北京国安23号犯规正确，但漏判黄牌。","videos":["2024/i07c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240508/1715161624142412.mp4"],"category":"freekick_foul","tags":["漏判黄牌","鲁莽犯规"],"v":"wrong","var":"none"},{"seq":40,"issue":7,"no":4,"comp":"中甲联赛","round":"第9轮","home":"延边龙鼎","away":"黑龙江冰城","minute":"3","match_info":"中甲联赛第9轮延边龙鼎VS黑龙江冰城，比赛第3分钟，黑龙江冰城18号队员在对方罚球区内与延边龙鼎12号守门员发生身体接触后倒地，裁判员未判罚犯规","desc":"判例四：中甲联赛第9轮延边龙鼎VS黑龙江冰城，比赛第3分钟，黑龙江冰城18号队员在对方罚球区内与延边龙鼎12号守门员发生身体接触后倒地，裁判员未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：现有视频不能完全清晰地证明双方接触的细节情况，但从接触的总体情形看，延边龙鼎12号守门员应视为犯规并判罚球点球。同时，该犯规符合破坏对方明显的进球得分机会的认定，但犯规队员以争抢球为目的并且被判罚球点球，故应对其出示黄牌。裁判员临场判罚错误，漏判罚球点球和黄牌。","videos":["2024/i07c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240508/1715161638926907.mp4"],"category":"penalty_area","tags":["漏判点球","漏判黄牌","DOGSO","守门员"],"v":"wrong","var":"none"},{"seq":41,"issue":7,"no":5,"comp":"中甲联赛","round":"第9轮","home":"延边龙鼎","away":"黑龙江冰城","minute":"19","match_info":"中甲联赛第9轮延边龙鼎VS黑龙江冰城，比赛第19分钟，延边龙鼎9号队员进球，进球前其与黑龙江冰城9号队员存在肢体接触，裁判员临场判进球有效","desc":"判例五：中甲联赛第9轮延边龙鼎VS黑龙江冰城，比赛第19分钟，延边龙鼎9号队员进球，进球前其与黑龙江冰城9号队员存在肢体接触，裁判员临场判进球有效。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：延边龙鼎9号在进球前，手臂有推黑龙江冰城9号的动作，使后者失去重心以及争抢球的防守能力，应视为犯规，进球无效。裁判员临场判进球有效的决定错误。","videos":["2024/i07c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240508/1715161654386299.mp4"],"category":"goal_decision","tags":["进球无效","漏判攻方犯规","推人"],"v":"wrong","var":"none"},{"seq":42,"issue":7,"no":6,"comp":"中甲联赛","round":"第9轮","home":"青岛红狮","away":"云南玉昆","minute":"90","match_info":"中甲联赛第9轮青岛红狮VS云南玉昆，比赛第90分钟，云南玉昆30号队员在本方罚球区内存在疑似手球情况，裁判员临场未判罚其手球犯规，判罚攻方青岛红狮队27号队员手球犯规","desc":"判例六：中甲联赛第9轮青岛红狮VS云南玉昆，比赛第90分钟，云南玉昆30号队员在本方罚球区内存在疑似手球情况，裁判员临场未判罚其手球犯规，判罚攻方青岛红狮队27号队员手球犯规。","appeal":"","conclusion":"对于此判例，评议组一致认为：云南玉昆30号的手臂与球发生接触，手臂位置使身体不自然扩大，无论其手臂触球之前头部是否蹭到球，结合球的运行路线，均属于手球犯规，应判罚球点球，不需要出示红黄牌。裁判员临场判罚错误，漏判云南玉昆30号手球犯规和罚球点球。","videos":["2024/i07c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240508/1715161666102833.mp4"],"category":"handball","tags":["漏判手球","错判攻方手球","手臂不自然扩大"],"v":"wrong","var":"none"},{"seq":43,"issue":7,"no":7,"comp":"中甲联赛","round":"第9轮","home":"大连英博","away":"广州俱乐部","minute":"","match_info":"中甲联赛第9轮大连英博VS广州俱乐部，比赛第90+12分钟，任意球恢复比赛前，大连英博17号守门员抬手触及广州俱乐部8号队员面部，裁判员出示黄牌警告大连英博17号守门员","desc":"判例七：中甲联赛第9轮大连英博VS广州俱乐部，比赛第90+12分钟，任意球恢复比赛前，大连英博17号守门员抬手触及广州俱乐部8号队员面部，裁判员出示黄牌警告大连英博17号守门员。","appeal":"","conclusion":"对于此判例，评议组一致认为：大连英博17号守门员在比赛停止时不以争抢球为目的，使用手臂故意击打对方队员面部，应视为暴力行为并出示红牌罚令出场。裁判员临场出示黄牌的决定错误，漏判红牌。","videos":["2024/i07c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240508/1715161679138763.mp4"],"category":"sfp_vc","tags":["漏判红牌","暴力行为","击打面部"],"v":"wrong","var":"none"},{"seq":44,"issue":7,"no":8,"comp":"中甲联赛","round":"第9轮","home":"大连英博","away":"广州俱乐部","minute":"","match_info":"中甲联赛第9轮大连英博VS广州俱乐部，比赛结束后，在比赛场地内，大连英博44号队员冲撞广州俱乐部守门员","desc":"判例八：中甲联赛第9轮大连英博VS广州俱乐部，比赛结束后，在比赛场地内，大连英博44号队员冲撞广州俱乐部守门员。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：大连英博44号从远处快速跑向对方守门员，并与对方发生身体接触，引发混乱场面，在此特定情形下，可以认定为暴力行为，并应出示红牌罚令出场。裁判员在比赛结束后离开比赛场地前均有权执行纪律措施（红黄牌），但本次事件发生在比赛结束后的群体混乱过程中，场地内人员众多，在此特殊条件下，裁判员对这一动作未作出处罚，不应视为漏判红牌。","videos":["2024/i07c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240508/1715161691403267.mp4"],"category":"sfp_vc","tags":["赛后冲突","特殊情形","暴力行为"],"v":"correct","var":"none"},{"seq":45,"issue":7,"no":9,"comp":"中乙联赛","round":"第7轮","home":"湖北青年星","away":"日照宇启","minute":"22","match_info":"中乙联赛第7轮湖北青年星VS日照宇启，比赛第22分钟，湖北青年星52号带球突破，日照宇启22号与其争抢，双方在日照宇启球门线外倒地后，日照宇启22号脚部与湖北青年星52号身体有接触，裁判员未作犯规判罚","desc":"判例九：中乙联赛第7轮湖北青年星VS日照宇启，比赛第22分钟，湖北青年星52号带球突破，日照宇启22号与其争抢，双方在日照宇启球门线外倒地后，日照宇启22号脚部与湖北青年星52号身体有接触，裁判员未作犯规判罚。","appeal":"","conclusion":"对于此判例，评议组一致认为：双方队员在球门线外倒地，属于争抢球后的意外接触，日照宇启22号失去重心摔倒，并非带有目的性或者具有附加动作踩踏对方队员，不应视为犯规或暴力行为。同时评议组大多数成员认为，双方摔倒前在比赛场地内的争抢动作，也均不构成犯规。裁判员临场做出的不犯规的决定正确。","videos":["2024/i07c09-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240508/1715161708621649.mp4"],"category":"sfp_vc","tags":["暴力行为不成立","意外接触"],"v":"correct","var":"none"},{"seq":46,"issue":7,"no":10,"comp":"中乙联赛","round":"第7轮","home":"赣州瑞狮","away":"广东广州豹","minute":"89","match_info":"中乙联赛第7轮赣州瑞狮VS广东广州豹，比赛第89分钟，赣州瑞狮10号射门，广东广州豹20号在本方罚球区内用脚封挡对方射门后，球接触该队员手臂，裁判员未判罚手球犯规","desc":"判例十：中乙联赛第7轮赣州瑞狮VS广东广州豹，比赛第89分钟，赣州瑞狮10号射门，广东广州豹20号在本方罚球区内用脚封挡对方射门后，球接触该队员手臂，裁判员未判罚手球犯规。","appeal":"","conclusion":"对于此判例，评议组一致认为：广东广州豹20号封挡对方射门后，球明显反弹变向后接触其手臂，手臂位置属于当前身体动作的合理结果，不应视为手球犯规。裁判员临场做出的不是手球犯规的决定正确。","videos":["2024/i07c10-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240508/1715161718630028.mp4"],"category":"handball","tags":["脚封挡后反弹","手臂合理位置"],"v":"correct","var":"none"},{"seq":47,"issue":7,"no":11,"comp":"女超联赛","round":"第6轮","home":"海南琼中女足","away":"山东体彩女足","minute":"54","match_info":"女超联赛第6轮，海南琼中女足VS山东体彩女足，比赛第54分钟，海南琼中24号带球向山东体彩罚球区内突破，与山东体彩2号接触后倒地","desc":"判例十一：女超联赛第6轮，海南琼中女足VS山东体彩女足，比赛第54分钟，海南琼中24号带球向山东体彩罚球区内突破，与山东体彩2号接触后倒地。裁判员未作判罚。","appeal":"","conclusion":"对于此判例，评议组一致认为：山东体彩2号在本方罚球区内拉扯对方进攻队员，应视为犯规并判罚球点球，该拉扯犯规符合破坏了对方明显进球得分机会的认定，应对犯规队员出示红牌罚令出场。临场裁判员判罚错误，漏判罚球点球和红牌。","videos":["2024/i07c11-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240508/1715161733732605.mp4"],"category":"penalty_area","tags":["漏判点球","漏判红牌","DOGSO","拉扯"],"v":"wrong","var":"none"},{"seq":48,"issue":8,"no":1,"comp":"中超联赛","round":"第11轮","home":"成都蓉城","away":"河南俱乐部","minute":"67","match_info":"中超联赛第11轮，成都蓉城VS河南俱乐部，比赛第67分钟，成都蓉城8号队员在本方罚球区内封挡对方射门时，球与其手臂有接触","desc":"判例一：中超联赛第11轮，成都蓉城VS河南俱乐部，比赛第67分钟，成都蓉城8号队员在本方罚球区内封挡对方射门时，球与其手臂有接触。裁判员临场未判罚手球犯规，VAR未介入。","appeal":"","conclusion":"对于此判例，评议组一致认为：从现有视频看，成都蓉城8号手臂与球有接触，但其手臂的位置并未使身体不自然变大，不应视为手球犯规，裁判员临场做出的不是手球犯规的决定正确。","videos":["2024/i08c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240515/1715767633867248.mp4"],"category":"handball","tags":["自然位置"],"v":"correct","var":"none"},{"seq":49,"issue":8,"no":2,"comp":"中超联赛","round":"第11轮","home":"成都蓉城","away":"河南俱乐部","minute":"71","match_info":"中超联赛第11轮，成都蓉城VS河南俱乐部，比赛第71分钟，成都蓉城23号队员在本方罚球区内接球时，球与其手臂有接触","desc":"判例二：中超联赛第11轮，成都蓉城VS河南俱乐部，比赛第71分钟，成都蓉城23号队员在本方罚球区内接球时，球与其手臂有接触。裁判员临场未判罚手球犯规，VAR未介入。","appeal":"","conclusion":"对于此判例，评议组一致认为：成都蓉城23号在胸部停球后手臂触球，手臂没有故意向球移动的动作，手臂的位置在此情形下应视为合理和自然的位置，不是手球犯规，裁判员临场做出的不是手球犯规的决定正确。","videos":["2024/i08c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240515/1715767647709173.mp4"],"category":"handball","tags":["自然位置"],"v":"correct","var":"none"},{"seq":50,"issue":8,"no":3,"comp":"中超联赛","round":"第11轮","home":"青岛海牛","away":"南通支云","minute":"16","match_info":"中超联赛第11轮，青岛海牛VS南通支云，比赛第16分钟，青岛海牛10号队员带球进入对方罚球区，南通支云5号队员防守时与其有接触，青岛海牛10号队员随后倒地","desc":"判例三：中超联赛第11轮，青岛海牛VS南通支云，比赛第16分钟，青岛海牛10号队员带球进入对方罚球区，南通支云5号队员防守时与其有接触，青岛海牛10号队员随后倒地。裁判员临场未判罚犯规，VAR未介入。","appeal":"","conclusion":"对于此判例，评议组一致认为：南通支云5号的防守动作属于封挡对方射门，触到了球并且未侵犯对方队员，后续双方身体接触属于惯性造成的不可避免的接触，不应视为犯规。临场裁判员做出的不犯规的决定正确。","videos":["2024/i08c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240515/1715767668151442.mp4"],"category":"penalty_area","tags":["封挡触球","惯性接触"],"v":"correct","var":"none"},{"seq":51,"issue":8,"no":4,"comp":"中超联赛","round":"第11轮","home":"青岛海牛","away":"南通支云","minute":"83","match_info":"中超联赛第11轮，青岛海牛VS南通支云，比赛第83分钟，南通支云10号队员带球，青岛海牛16号队员从其侧后方进行拦截，南通支云10号队员倒地","desc":"判例四：中超联赛第11轮，青岛海牛VS南通支云，比赛第83分钟，南通支云10号队员带球，青岛海牛16号队员从其侧后方进行拦截，南通支云10号队员倒地。裁判员临场判罚青岛海牛16号队员犯规，向其出示黄牌（该队员本场第2张黄牌），因犯规地点在罚球区外，判罚直接任意球，VAR未介入。","appeal":"","conclusion":"对于此判例，评议组一致认为：视频显示青岛海牛16号在铲球时，接触到南通支云10号左小腿，接触地点在罚球区外，应判罚青岛海牛16号犯规，并判直接任意球。同时该犯规情形符合阻止对方有希望的进攻的判定，应对犯规队员出示黄牌。裁判员临场判罚直接任意球并向青岛海牛16号出示黄牌的决定正确。","videos":["2024/i08c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240515/1715767691835464.mp4"],"category":"freekick_foul","tags":["直接任意球","黄牌","SPA","铲球"],"v":"correct","var":"none"},{"seq":52,"issue":8,"no":5,"comp":"中超联赛","round":"第11轮","home":"青岛海牛","away":"南通支云","minute":"90","match_info":"中超联赛第11轮，青岛海牛VS南通支云，比赛第90分钟，南通支云队进攻并向对方罚球区内传中，第一助理裁判员举旗示意球已在空中越过球门线，裁判员延迟鸣哨，随后南通支云队员完成头球射门，球在球门线附近被青岛海牛队员踢出解围后，裁判员鸣哨停止比赛并判给青岛海牛队踢球门球","desc":"判例五：中超联赛第11轮，青岛海牛VS南通支云，比赛第90分钟，南通支云队进攻并向对方罚球区内传中，第一助理裁判员举旗示意球已在空中越过球门线，裁判员延迟鸣哨，随后南通支云队员完成头球射门，球在球门线附近被青岛海牛队员踢出解围后，裁判员鸣哨停止比赛并判给青岛海牛队踢球门球。经VAR介入，并执行视频助理裁判回看分析后，裁判员改判南通支云队进球且进球有效。","appeal":"","conclusion":"对于此判例，评议组一致认为：球门线机位的视频清晰显示，南通支云队传中时，球在运行过程中未越过球门线，第一助理裁判员判断失误，但裁判 州雄狮14号守门员有身体接触，随后南通支云进球，裁判员临场判罚进球有效，VAR未介入","desc":"判例三：中超联赛第13轮，南通支云VS沧州雄狮，比赛第90+3分钟，南通支云9号队员在进攻争抢空中球时疑似与沧州雄狮14号守门员有身体接触，随后南通支云进球，裁判员临场判罚进球有效，VAR未介入。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：沧州雄狮14号守门员在已经完全用手控制球的情况下，南通支云9号在空中与其腿部发生接触，造成其失去重心，失衡落地后失去对球的控制，应判进攻方南通支云9号犯规在先，进球无效。裁判员做出的进球有效的决定错误，VAR未介入错误。","videos":["2024/i09c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240529/1716970556391884.mp4"],"category":"goal_decision","tags":["进球无效","守门员控球","VAR未介入错误"],"v":"wrong","var":"wrong"},{"seq":59,"issue":9,"no":4,"comp":"中国足协杯","round":"第3轮","home":"大连鲲城","away":"云南玉昆","minute":"36","match_info":"中国足协杯第3轮，大连鲲城VS云南玉昆，比赛第36分钟，大连鲲城17号队员在本方罚球区附近对云南玉昆14号队员犯规，裁判员判罚直接任意球，在与助理裁判员和第四官员沟通后，向大连鲲城17号出示红牌罚令出场","desc":"判例四：中国足协杯第3轮，大连鲲城VS云南玉昆，比赛第36分钟，大连鲲城17号队员在本方罚球区附近对云南玉昆14号队员犯规，裁判员判罚直接任意球，在与助理裁判员和第四官员沟通后，向大连鲲城17号出示红牌罚令出场。","appeal":"","conclusion":"对于此判例，评议组一致认为：犯规的发生地点在罚球区外，裁判员判罚直接任意球正确。同时，评议组多数成员认为：根据云南玉昆14号进攻得球时的位置、方向及控球情形来看，如果大连鲲城17号不实施犯规，周边的防守队员也无法及时形成有效防守。该犯规符合破坏对方明显的进球得分机会的认定标准。裁判员判罚直接任意球并向大连鲲城17号出示红牌罚令出场的决定正确。","videos":["2024/i09c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240529/1716970594244029.mp4"],"category":"dogso","tags":["红牌","DOGSO","直接任意球","足协杯"],"v":"correct","var":"none"},{"seq":60,"issue":9,"no":5,"comp":"女甲联赛","round":"第8轮","home":"辽宁沈北禾丰","away":"河北君乐宝","minute":"6","match_info":"女甲联赛第8轮，辽宁沈北禾丰VS河北君乐宝，比赛第6分钟，河北君乐宝10号队员带球进攻中远射，辽宁沈北禾丰守门员在罚球区外用手拦截该球","desc":"判例五：女甲联赛第8轮，辽宁沈北禾丰VS河北君乐宝，比赛第6分钟，河北君乐宝10号队员带球进攻中远射，辽宁沈北禾丰守门员在罚球区外用手拦截该球。裁判员未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组一致认为：辽宁沈北禾丰守门员在本方罚球区外通过手球犯规破坏了对方的进球，应判罚手球犯规、直接任意球，并出示红牌罚令出场。裁判员临场决定错误，漏判直接任意球，漏判红牌。","videos":["2024/i09c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240529/1716970631740725.mp4"],"category":"handball","tags":["漏判红牌","漏判任意球","手球","守门员"],"v":"wrong","var":"none"},{"seq":61,"issue":9,"no":6,"comp":"中乙联赛","round":"第9轮","home":"海门珂缔缘","away":"北京理工","minute":"22","match_info":"中乙联赛第9轮，海门珂缔缘VS北京理工，比赛第22分钟，北京理工1号守门员在本方罚球区外触球，裁判员临场未判罚手球犯规","desc":"判例六：中乙联赛第9轮，海门珂缔缘VS北京理工，比赛第22分钟，北京理工1号守门员在本方罚球区外触球，裁判员临场未判罚手球犯规。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：从现有视频上看，北京理工1号守门员在试图踢球未果后，手臂在罚球区外与球有接触，但其手臂位置属于该动作之下的合理位置，接触了近距离来球，不应视为手球犯规。裁判员临场未判罚手球犯规的决定正确。","videos":["2024/i09c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240529/1716970647566360.mp4"],"category":"handball","tags":["自然位置","守门员"],"v":"correct","var":"none"},{"seq":62,"issue":9,"no":7,"comp":"中乙联赛","round":"第9轮","home":"海门珂缔缘","away":"北京理工","minute":"","match_info":"中乙联赛第9轮，海门珂缔缘VS北京理工，比赛第90+4分钟，海门珂缔缘9号队员在对方罚球区内倒地，裁判员临场未判罚犯规","desc":"判例七：中乙联赛第9轮，海门珂缔缘VS北京理工，比赛第90+4分钟，海门珂缔缘9号队员在对方罚球区内倒地，裁判员临场未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组一致认为：该判例来自球队提出的申诉，但视频无法看到双方队员是否接触及接触的具体情况，裁判员临场未判罚犯规的决定应予支持。","videos":["2024/i09c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240529/1716970661706567.mp4"],"category":"penalty_area","tags":["证据不足"],"v":"correct","var":"none"},{"seq":63,"issue":9,"no":8,"comp":"中乙联赛","round":"第9轮","home":"海门珂缔缘","away":"北京理工","minute":"","match_info":"中乙联赛第9轮，海门珂缔缘VS北京理工，比赛第90+7分钟，海门珂缔缘45号队员和60号队员先后在对方罚球区内倒地，裁判员临场均未判罚犯规","desc":"判例八：中乙联赛第9轮，海门珂缔缘VS北京理工，比赛第90+7分钟，海门珂缔缘45号队员和60号队员先后在对方罚球区内倒地，裁判员临场均未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组一致认为：造成海门珂缔缘45号倒地的争抢是双方在接近同等机会下的正常争抢动作，之后海门珂缔缘60号带球进入对方罚球区，北京理工22号的铲球防守动作清晰触到了球，并且无其他犯规情况。两次进攻队员的倒地，防守队员均不犯规。裁判员临场决定正确。","videos":["2024/i09c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240529/1716970679406945.mp4"],"category":"penalty_area","tags":["铲球触球"],"v":"correct","var":"none"},{"seq":64,"issue":9,"no":9,"comp":"中乙联赛","round":"第9轮","home":"廊坊荣耀之城","away":"日照宇启","minute":"42","match_info":"中乙联赛第9轮，廊坊荣耀之城VS日照宇启，比赛第42分钟，日照宇启在前场左路踢任意球，双方在罚球区内争抢","desc":"判例九：中乙联赛第9轮，廊坊荣耀之城VS日照宇启，比赛第42分钟，日照宇启在前场左路踢任意球，双方在罚球区内争抢。球出球门线后，裁判员出示红牌将日照宇启5号队员罚令出场。","appeal":"","conclusion":"对于此判例，评议组一致认为：日照宇启5号在无球状态下，挥手击打对方头颈部，虽然视频不能清晰展示具体的接触情况，但应视为暴力行为。裁判员临场出示红牌的决定正确。","videos":["2024/i09c09-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240529/1716970702313242.mp4"],"category":"sfp_vc","tags":["红牌","暴力行为","无球状态"],"v":"correct","var":"none"},{"seq":65,"issue":9,"no":10,"comp":"中乙联赛","round":"第9轮","home":"广西蓝航","away":"赣州瑞狮","minute":"68","match_info":"中乙联赛第9轮，广西蓝航VS赣州瑞狮，比赛第68分钟，赣州瑞狮35号队员在中场边线附近区域犯规，裁判员临场判罚其犯规并出示红牌将其罚令出场","desc":"判例十：中乙联赛第9轮，广西蓝航VS赣州瑞狮，比赛第68分钟，赣州瑞狮35号队员在中场边线附近区域犯规，裁判员临场判罚其犯规并出示红牌将其罚令出场。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：赣州瑞狮35号的铲球动作属于草率的犯规，未达到鲁莽犯规（黄牌）或者严重犯规（红牌）的程度，但随后起身时抬腿的动作，除摆脱对方身体以外，也带有附加的挑衅成分，应以非体育行为对赣州瑞狮35号出示黄牌警告。裁判员临场出示红牌的决定错误。","videos":["2024/i09c10-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240529/1716970726276187.mp4"],"category":"sfp_vc","tags":["红牌错误","黄牌","非体育行为","挑衅"],"v":"wrong","var":"none"},{"seq":66,"issue":9,"no":11,"comp":"中乙联赛","round":"第9轮","home":"广西蓝航","away":"赣州瑞狮","minute":"72","match_info":"中乙联赛第9轮，广西蓝航VS赣州瑞狮，比赛第72分钟，赣州瑞狮54号队员在对方罚球区内与广西蓝航41号守门员发生身体接触，双方倒地，裁判员临场未判罚犯规","desc":"判例十一：中乙联赛第9轮，广西蓝航VS赣州瑞狮，比赛第72分钟，赣州瑞狮54号队员在对方罚球区内与广西蓝航41号守门员发生身体接触，双方倒地，裁判员临场未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：广西蓝航41号守门员出击后已经停下准备接球，赣州瑞狮54号抢先顶到球，之后双方正常身体接触。广西蓝航41号守门员手臂与对方的接触也不属于击打犯规。裁判员临场未判罚犯规的决定正确。","videos":["2024/i09c11-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240529/1716970743994930.mp4"],"category":"penalty_area","tags":["守门员","抢先触球"],"v":"correct","var":"none"},{"seq":67,"issue":10,"no":1,"comp":"中甲联赛","round":"第12轮","home":"江西庐山","away":"广州俱乐部","minute":"29","match_info":"中甲联赛第12轮，江西庐山VS广州俱乐部，比赛第29分钟，广州俱乐部9号队员在对方罚球区内与江西庐山19号守门员争抢球后倒地","desc":"判例一：中甲联赛第12轮，江西庐山VS广州俱乐部，比赛第29分钟，广州俱乐部9号队员在对方罚球区内与江西庐山19号守门员争抢球后倒地。裁判员临场判罚江西庐山19号守门员犯规，判罚球点球，并向其出示黄牌。","appeal":"","conclusion":"对于此判例，评议组成员一致认为：江西庐山19号守门员率先触及球，且没有附加的犯规动作，不应视为犯规，裁判员临场判罚犯规并判罚球点球及黄牌的决定错误。","videos":["2024/i10c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240612/1718199077533054.mp4"],"category":"penalty_area","tags":["错判点球","守门员","先触球"],"v":"wrong","var":"none"},{"seq":68,"issue":10,"no":2,"comp":"中乙联赛","round":"第10轮","home":"陕西联合","away":"湖北青年星","minute":"76","match_info":"中乙联赛第10轮，陕西联合VS湖北青年星，比赛第76分钟，湖北青年星进攻，陕西联合49号队员手球犯规，裁判临场判罚直接任意球并向其出示黄牌","desc":"判例二：中乙联赛第10轮，陕西联合VS湖北青年星，比赛第76分钟，湖北青年星进攻，陕西联合49号队员手球犯规，裁判临场判罚直接任意球并向其出示黄牌。","appeal":"","conclusion":"对于此判例，评议组一致认为：陕西联合49号手球犯规，阻止了对方有希望的进攻，应出示黄牌警告；考虑到进攻队员控球的可能性、犯规地点与球门的距离，以及中路其他防守队员做出有效防守的可能性等因素，该犯规不符合破坏对方明显的进球得分机会（DOGSO）的判定标准，不应出示红牌。裁判员临场做出的手球犯规、直接任意球及黄牌警告的决定正确。","videos":["2024/i10c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240612/1718199103855380.mp4"],"category":"handball","tags":["手球","黄牌","DOGSO不成立"],"v":"correct","var":"none"},{"seq":69,"issue":10,"no":3,"comp":"中乙联赛","round":"第11轮","home":"廊坊荣耀之城","away":"湖北青年星","minute":"44","match_info":"中乙联赛第11轮，廊坊荣耀之城VS湖北青年星，比赛第44分钟，湖北青年星51号队员在中场区域拉扯廊坊荣耀之城9号队员，裁判员鸣哨判罚犯规后，廊坊荣耀之城9号撞击湖北青年星51号，裁判员向廊坊荣耀之城9号出示红牌罚令出场，同时向湖北青年星队51号出示黄牌","desc":"判例三：中乙联赛第11轮，廊坊荣耀之城VS湖北青年星，比赛第44分钟，湖北青年星51号队员在中场区域拉扯廊坊荣耀之城9号队员，裁判员鸣哨判罚犯规后，廊坊荣耀之城9号撞击湖北青年星51号，裁判员向廊坊荣耀之城9号出示红牌罚令出场，同时向湖北青年星队51号出示黄牌。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：湖北青年星51号的拉扯行为，应以非体育行为为由予以黄牌警告。裁判员临场判罚犯规并出示黄牌警告的决定正确。廊坊荣耀之城9号撞击对方队员的行为，属于被对方侵犯之后的情绪宣泄，从撞击部位、力度以及对对方队员造成的危险等方面分析，不构成暴力行为，应以非体育行为为由予以黄牌警告，裁判员临场对其出示红牌罚令出场的决定错误。","videos":["2024/i10c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240612/1718199134457557.mp4"],"category":"sfp_vc","tags":["红牌错误","黄牌","非体育行为","情绪宣泄"],"v":"wrong","var":"none"},{"seq":70,"issue":11,"no":1,"comp":"中甲联赛","round":"第14轮","home":"大连英博","away":"云南玉昆","minute":"49","match_info":"中甲联赛第14轮，大连英博VS云南玉昆，比赛第49分钟，大连英博进攻中远射，球击中云南玉昆球门横梁后落地弹出","desc":"判例一：中甲联赛第14轮，大连英博VS云南玉昆，比赛第49分钟，大连英博进攻中远射，球击中云南玉昆球门横梁后落地弹出。裁判员临场决定为未进球，比赛继续。","appeal":"","conclusion":"对于此判例，评议组成员一致认为：大连英博射门后，球在击中横梁反弹至地面时，已经整体越过了球门线，应为进球得分。裁判组临场做出的未进球的决定错误，漏判进球。另外，评议组指出：在本判例中，大连英博进攻中在罚球区外起脚远射，球击中球门横梁弹下，触地后弹出，在此特定情形下，在未使用球门线技术或视频助理裁判的比赛中，助理裁判员尤其是裁判员几乎不可能及时到达能够准确判断球是否越过球门线的位置，是一次难度极大的判罚。","videos":["2024/i11c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240619/1718788738188230.mp4"],"category":"goa "none"},{"seq":102,"issue":15,"no":2,"comp":"中甲联赛","round":"第18轮","home":"广西平果","away":"大连英博","minute":"82","match_info":"中甲联赛第18轮，广西平果哈嘹VS大连英博，比赛第82分钟，广西平果哈嘹33号队员在与大连英博40号队员争抢球后倒地","desc":"判例二：中甲联赛第18轮，广西平果哈嘹VS大连英博，比赛第82分钟，广西平果哈嘹33号队员在与大连英博40号队员争抢球后倒地。裁判员未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组一致认为：大连英博40号故意使用手臂击打广西平果哈嘹33号面部，其手臂动作不属于为完成争抢球而做出的正常动作，应判大连英博40号暴力行为，并出示红牌罚令出场，裁判员临场漏判直接任意球和红牌。","videos":["2024/i15c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240725/1721880847876358.mp4"],"category":"sfp_vc","tags":["漏判红牌","漏判任意球","暴力行为","击打面部"],"v":"wrong","var":"none"},{"seq":103,"issue":15,"no":3,"comp":"中甲联赛","round":"第18轮","home":"石家庄功夫","away":"江西庐山","minute":"24","match_info":"中甲联赛第18轮，石家庄功夫VS江西庐山，比赛第24分钟，石家庄功夫28号队员在对方罚球区内倒地","desc":"判例三：中甲联赛第18轮，石家庄功夫VS江西庐山，比赛第24分钟，石家庄功夫28号队员在对方罚球区内倒地。裁判员未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组一致认为：江西庐山守门员出击动作不构成犯规，裁判员临场未判罚球点球的决定正确。另外评议组多数成员认为，石家庄功夫28号队员主动发起接触，佯装被犯规，应判其佯装（假摔）并出示黄牌警告，由江西庐山踢间接任意球恢复比赛。","videos":["2024/i15c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240725/1721880873760125.mp4"],"category":"penalty_area","tags":["守门员不犯规","佯装"],"v":"correct","var":"none"},{"seq":104,"issue":15,"no":4,"comp":"中甲联赛","round":"第18轮","home":"重庆铜梁龙","away":"青岛红狮","minute":"64","match_info":"中甲联赛第18轮，重庆铜梁龙VS青岛红狮，比赛第64分钟，重庆铜梁龙29号队员进球","desc":"判例四：中甲联赛第18轮，重庆铜梁龙VS青岛红狮，比赛第64分钟，重庆铜梁龙29号队员进球。裁判员判进球有效。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：从与越位线近似齐平的镜头画面看，重庆铜梁龙队员在对方球门区附近传球时，触球瞬间球的位置被其他队员遮挡，无绝对证据证明重庆铜梁龙29号队员和24号队员是否处于越位位置（是否较球及对方倒数第二名队员都更接近对方球门线），但从视频可基本判断出29号不处于越位位置，24号处于越位位置。而后续重庆铜梁龙24号的行为，不构成干扰对方队员的越位犯规。因此裁判员临场判进球有效的决定正确。","videos":["2024/i15c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240725/1721880900268040.mp4"],"category":"offside","tags":["证据不足","越位"],"v":"correct","var":"none"},{"seq":105,"issue":15,"no":5,"comp":"中甲联赛","round":"第18轮","home":"苏州东吴","away":"无锡吴钩","minute":"35","match_info":"中甲联赛第18轮，苏州东吴VS无锡吴钩，比赛第35分钟，无锡吴钩45号队员在对方罚球区内与苏州东吴35号队员争抢球后倒地","desc":"判例五：中甲联赛第18轮，苏州东吴VS无锡吴钩，比赛第35分钟，无锡吴钩45号队员在对方罚球区内与苏州东吴35号队员争抢球后倒地。裁判员未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组一致认为：根据现有视频以及球的运行线路判断，守方队员铲球触到了球，其动作也不构成犯规，裁判员临场做出的不犯规的决定应予支持。","videos":["2024/i15c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240725/1721880924601170.mp4"],"category":"penalty_area","tags":["铲球触球"],"v":"correct","var":"none"},{"seq":106,"issue":15,"no":6,"comp":"中甲联赛","round":"第18轮","home":"苏州东吴","away":"无锡吴钩","minute":"57","match_info":"中甲联赛第18轮，苏州东吴VS无锡吴钩，比赛第57分钟，无锡吴钩20号队员在对方罚球区内与苏州东吴5号队员发生身体接触后倒地","desc":"判例六：中甲联赛第18轮，苏州东吴VS无锡吴钩，比赛第57分钟，无锡吴钩20号队员在对方罚球区内与苏州东吴5号队员发生身体接触后倒地。裁判员未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组一致认为：无锡吴钩20号扣球变向后已经失去对球的完全控制，苏州东吴5号防守队员没有犯规动作，双方的身体接触属于比赛中的正常接触，裁判员临场做出的不犯规的决定正确。","videos":["2024/i15c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240725/1721880945907588.mp4"],"category":"penalty_area","tags":["正常接触","失去控制"],"v":"correct","var":"none"},{"seq":107,"issue":15,"no":7,"comp":"中甲联赛","round":"第18轮","home":"苏州东吴","away":"无锡吴钩","minute":"70","match_info":"中甲联赛第18轮，苏州东吴VS无锡吴钩，比赛第70分钟，苏州东吴31号队员在对方罚球区内与无锡吴钩36号队员发生身体接触后倒地","desc":"判例七：中甲联赛第18轮，苏州东吴VS无锡吴钩，比赛第70分钟，苏州东吴31号队员在对方罚球区内与无锡吴钩36号队员发生身体接触后倒地。裁判员判无锡吴钩36号防守犯规，判罚球点球，并向无锡吴钩36号出示黄牌。","appeal":"","conclusion":"对于此判例，评议组一致认为：苏州东吴31号带球突破，无锡吴钩36号在其身后有拉扯和推搡动作，但力度和程度不足以构成犯规，后续无锡吴钩36号腿部动作绊倒苏州东吴31号，属于草率犯规，接触地点在守方罚球区内，裁判员临场判守方犯规和罚球点球的决定正确。另外，评议组多数成员认为，该犯规动作不符合阻止对方有希望的进攻的判定标准，不应对无锡吴钩36号出示黄牌。\n判例对比一：中超联赛第18轮，上海申花vs山东泰山，比赛第26分钟，山东泰山队9号队员克雷桑犯规，裁判员向其出示黄牌（之后又因其他违规行为向其出示第二张黄牌并罚令出场）。\n判例对比二：中超联赛第24轮，武汉三镇vs成都蓉城，比赛第63分钟，成都蓉城队7号队员韦世豪犯规，裁判员向其出示红牌罚令出场。\n对于这两个判例，评议组一致认为：山东泰山队9号队员克雷桑的动作，属于在有触球可能性的情况下，使用过分力量和野蛮方式进行争抢，踢倒对方队员，按照竞赛规则，应定性为严重犯规，并直接出示红牌罚令出场，裁判员临场出示黄牌错误，漏判直接红牌。成都蓉城队7号队员韦世豪的动作，属于在球已经离开可争抢的范围，在没有触球可能性的情况下，不以触球为目的，故意踢对方队员，按照竞赛规则，应定性为暴力行为，并直接出示红牌罚令出场。两个判例中队员的犯规动作有相似之处，也都应直接出示红牌罚令出场，但因具体情形不同，在竞赛规则中应用的关于罚令出场的定性条款不同。\n中国足协纪律委员会对上述两个判例的后续纪律处罚也作出了如下解释：\n克雷桑犯规事件发生后，经研判，未提交违规违纪报告启动纪律处罚程序。\n韦世豪犯规事件发生后，依据相关规定对该暴力行为启动纪律处罚程序，最终由中国足协纪律委员会依据《中国足球协会纪律准则》第五十三条、第四十八条对成都蓉城7号球员本次违规违纪行为作出停赛4场、罚款4万元的纪律处罚决定。","videos":["2024/i15c07-1.mp4","2024/i15c07-2.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240725/1721880972116442.mp4","https://videooss.thecfa.cn/upload/video/20240725/1721881017973588.mp4"],"category":"penalty_area","tags":["点球正确","黄牌错误","判例对比"],"v":"wrong","var":"none"},{"seq":108,"issue":16,"no":1,"comp":"中乙联赛","round":"第18轮","home":"赣州瑞狮","away":"广西蓝航","minute":"","match_info":"中乙联赛第18轮，赣州瑞狮VS广西蓝航，比赛第45+2分钟，赣州瑞狮5号队员撞击广西蓝航16号队员，引起双方冲突","desc":"判例一：中乙联赛第18轮，赣州瑞狮VS广西蓝航，比赛第45+2分钟，赣州瑞狮5号队员撞击广西蓝航16号队员，引起双方冲突。裁判员出示红牌将赣州瑞狮5号罚令出场。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：赣州瑞狮5号在比赛停止时，从远处跑来，带有攻击性地撞击对方队员，引发后续群体冲突，在此情形下，应视为暴力行为，裁判员向其出示红牌罚令出场的决定正确。","videos":["2024/i16c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240731/1722422831665287.mp4"],"category":"sfp_vc","tags":["红牌","暴力行为","比赛停止时"],"v":"correct","var":"none"},{"seq":109,"issue":16,"no":2,"comp":"中乙联赛","round":"第18轮","home":"赣州瑞狮","away":"广西蓝航","minute":"54","match_info":"中乙联赛第18轮，赣州瑞狮VS广西蓝航，比赛第54分钟，赣州瑞狮进攻中将球长传至广西蓝航罚球区内，广西蓝航41号守门员在本方罚球区内与赣州瑞狮19号队员争抢空中球，随后双方队员发生碰撞并倒地","desc":"判例二：中乙联赛第18轮，赣州瑞狮VS广西蓝航，比赛第54分钟，赣州瑞狮进攻中将球长传至广西蓝航罚球区内，广西蓝航41号守门员在本方罚球区内与赣州瑞狮19号队员争抢空中球，随后双方队员发生碰撞并倒地。裁判员判广西蓝航守门员犯规、罚球点球，并向其出示黄牌警告。","appeal":"","conclusion":"对于此判例，评议组一致认为：从现有视频看，双方队员均有争抢该空中球的机会，守门员抢先用手触到球，并无附加犯规动作，双方的碰撞属于惯性导致的接触。双方均不犯规。裁判员判广西蓝航守门员犯规、罚球点球，以及向其出示黄牌的决定均为错误。","videos":["2024/i16c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240731/1722422898545863.mp4"],"category":"penalty_area","tags":["错判点球","错判黄牌","守门员先触球"],"v":"wrong","var":"none"},{"seq":110,"issue":16,"no":3,"comp":"中乙联赛","round":"第18轮","home":"赣州瑞狮","away":"广西蓝航","minute":"","match_info":"中乙联赛第18轮，赣州瑞狮VS广西蓝航，接判例2事件，赣州瑞狮罚球点球时，广西蓝航守门员未作出明显的防守行为，球罚进，裁判员判进球有效","desc":"判例三：中乙联赛第18轮，赣州瑞狮VS广西蓝航，接判例2事件，赣州瑞狮罚球点球时，广西蓝航守门员未作出明显的防守行为，球罚进，裁判员判进球有效。","appeal":"","conclusion":"对于此判例，评议组首先一致认为：在裁判员鸣哨示意执行罚球点球时，广西蓝航守门员双脚站在球门线上，面向主罚队员，并无其他违反竞赛规则的行为，场上队员的位置符合规则要求，裁判员示意执行罚球点球程序正确。在球被踢出时，广西蓝航守门员双脚均已离开球门线并处于球门线前方，属于违规行为，按照规则规定，如果球进门，则进球得分有效。因此裁判员临场执行罚球点球程序，以及判进球有效的决定均为正确。另外，评议组多数成员认为：广西蓝航守门员在对方踢罚球点球时表现出对比赛缺乏尊重，应以非体育行为对其出示黄牌警告。裁判员漏判黄牌。","videos":["2024/i16c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240731/1722422926363314.mp4"],"category":"penalty_area","tags":["点球程序","进球有效","漏判黄牌"],"v":"wrong","var":"none"},{"seq":111,"issue":16,"no":4,"comp":"中乙联赛","round":"第18轮","home":"西安崇德荣海","away":"泰安天贶","minute":"","match_info":"中乙联赛第18轮，西安崇德荣海VS泰安天贶，比赛第90+8分钟，泰安天贶掷前场界外球，西安崇德荣海防守队员在本方罚球区内与泰安天贶队员有接触，后者倒地，裁判员未判罚犯规","desc":"判例四：中乙联赛第18轮，西安崇德荣海VS泰安天贶，比赛第90+8分钟，泰安天贶掷前场界外球，西安崇德荣海防守队员在本方罚球区内与泰安天贶队员有接触，后者倒地，裁判员未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：从现有视频看，泰安天贶进攻队员在对方罚球区内，并非以踢球为目的，将腿伸向对方队员已经摆腿踢球的路线中，试图获得控球权或限制对方踢球，造成了双方的身体接触，西安崇德荣海防守队员不犯规，裁判员临场未判罚犯规的决定应予支持。","videos":["2024/i16c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240731/1722422949404450.mp4"],"category":"penalty_area","tags":["进攻队员主动伸腿"],"v":"correct","var":"none"},{"seq":112,"issue":17,"no":1,"comp":"中超联赛","round":"第21轮","home":"北京国安","away":"上海申花","minute":"48","match_info":"中超联赛第21轮，北京国安vs上海申花，比赛第48分钟，上海申花9号队员进球","desc":"判例一：中超联赛第21轮，北京国安vs上海申花，比赛第48分钟，上海申花9号队员进球。裁判员初始判进球有效，经VAR介入，裁判员改判上海申花9号越位犯规在先，进球无效。（见视频1）","appeal":"","conclusion":"","videos":["2024/i17c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240807/1723023415872610.mp4"],"category":"offside","tags":["VAR介入正确","3D划线","越位"],"v":"correct","var":"correct"},{"seq":113,"issue":17,"no":2,"comp":"中超联赛","round":"第21轮","home":"北京国安","away":"上海申花","minute":"","match_info":"中超联赛第21轮，北京国安vs上海申花，比赛第90+7分钟，北京国安20号队员进球","desc":"判例二：中超联赛第21轮，北京国安vs上海申花，比赛第90+7分钟，北京国安20号队员进球。裁判员判进球有效，VAR查看后未介入。（见视频3）","appeal":"","conclusion":"对于这两个判例，评议组经讨论后，做出说明如下：\n上海申花队进球事件，裁判员经VAR介入后改判上海申花9号越位犯规在先以及进球无效，最终决定正确，VAR介入正确。VAR操作间中可查看各个线路和十多个拍摄机位的画面，所有画面无论在比赛进行时、画面暂停时、回放检查时，在时间行进上都是严格同步的。在此类判例中，视频助理裁判员在查看时需先通过远景或适当的画面找到并确定进攻方传球或触球的瞬间，定格后再切换至适合的画面进行越位判断或3D划线操作，以严格确保传球瞬间和划线定格瞬间完全同步。在此判例中，视频助理裁判员的定格时刻选择（即传球瞬间和划线定格瞬间完全同步）、双方队员有效身体部位选择，以及越位线的比对程序均操作正确，得出了攻方队员明显处于越位位置的结论，并且正确介入，而且按照规定，对VAR介入的越位判罚向转播方作了推送，但推送画面只能包含3D划线画面，同一画面内无法包含攻方传球或触球瞬间的证据。（见视频2、截图1）\n\n而北京国安队进球事件，裁判员做出的不是越位犯规以及进球有效的决定正确，VAR未介入正确。在此判例中，视频助理裁判员按照与上述相同的操作原则和操作程序，经3D划线，判断攻守双方队员身体有效部位与守方球门线距离几乎相等，即几乎平行。在3D划线中，双方划线之间无缝隙，几乎重叠，按照中超联赛统一判罚尺度精神，攻方队员不处于越位位置，这与裁判员初始决定一致，无需介入。由于现行VAR操作规范中未要求此类VAR未介入事件必须向转播方推送划线画面，视频助理裁判员现场未推送，不违反VAR操作相关原则，因此转播方无法播出划线画面。（见视频4、截图2）\n但是在赛后复议中，在此判例中，视频助理裁判员在选择守方上海申花队倒数第二名防守队员时出现错误，应选择另一名更接近本方球门的防守队员（4号），如果正确选择4号队员及其有效身体部位（肩部），正确进行3D划线，将显示北京国安队进攻队员明显不处于越位位置，不存在越位犯规。（见视频5、截图3）","videos":["2024/i17c02-1.mp4","2024/i17c02-2.mp4","2024/i17c02-3.mp4","2024/i17c02-4.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240807/1723023561932453.mp4","https://videooss.thecfa.cn/upload/video/20240807/1723023635242338.mp4","https://videooss.thecfa.cn/upload/video/20240807/1723023708353741.mp4","https://videooss.thecfa.cn/upload/video/20240807/1723023747397797.mp4"],"category":"offside","tags":["VAR未介入正确","划线选择错误","赛后复议"],"v":"correct","var":"correct"},{"seq":114,"issue":18,"no":1,"comp":"中超联赛","round":"第23轮","home":"天津津门虎","away":"武汉三镇","minute":"","match_info":"中超联赛第23轮，天津津门虎VS武汉三镇，比赛第90+1分钟","desc":"判例一：中超联赛第23轮，天津津门虎VS武汉三镇，比赛第90+1分钟。天津津门虎9号队员在对方罚球区内与武汉三镇40号队员争抢球时倒地，裁判员临场未判罚犯规。经VAR介入，裁判员在场回看后，判罚武汉三镇40号对天津津门虎9号犯规，并判罚球点球。","appeal":"","conclusion":"对于此判例，评议组一致认为：武汉三镇40号在防守时使用手臂限制对方队员移动，属于拉扯犯规，因犯规发生在守方罚球区内，应判罚球点球，VAR介入正确，裁判员在场回看后改判罚球点球的最终决定正确。","videos":["2024/i18c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240821/1724242948154112.mp4"],"category":"penalty_area","tags":["点球","VAR介入正确","拉扯"],"v":"correct","var":"correct"},{"seq":115,"issue":18,"no":2,"comp":"中超联赛","round":"第23轮","home":"北京国安","away":"浙江俱乐部绿城","minute":"85","match_info":"中超联赛第23轮，北京国安VS浙江俱乐部，比赛第85分钟，浙江俱乐部4号队员在本方罚球区内与北京国安9号队员发生接触并倒地","desc":"判例二：中超联赛第23轮，北京国安VS浙江俱乐部，比赛第85分钟，浙江俱乐部4号队员在本方罚球区内与北京国安9号队员发生接触并倒地。裁判员初始判罚北京国安9号犯规，没有进行纪律处罚。经VAR介入，裁判员在场回看后，向北京国安9号出示红牌罚令出场。","appeal":"","conclusion":"对于此判例，评议组一致认为：北京国安9号在无球情况下，故意使用肘部击打对方面部，使用的力量并非轻微可忽略的。按照竞赛规则，应视为暴力行为并出示红牌。VAR介入正确，裁判员在场回看后向北京国安9号出示红牌罚令出场的最终决定正确。","videos":["2024/i18c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240821/1724243011935138.mp4"],"category":"sfp_vc","tags":["红牌","暴力行为","肘击面部","VAR介入正确"],"v":"correct","var":"correct"},{"seq":116,"issue":18,"no":3,"comp":"中超联赛","round":"第23轮","home":"北京国安","away":"浙江俱乐部绿城","minute":"90","match_info":"中超联赛第23轮，北京国安VS浙江俱乐部，比赛第90分钟，北京国安向对方罚球区传中，其17号队员跳起争抢球时与浙江俱乐部20号队员发生身体接触并倒地","desc":"判例三：中超联赛第23轮，北京国安VS浙江俱乐部，比赛第90分钟，北京国安向对方罚球区传中，其17号队员跳起争抢球时与浙江俱乐部20号队员发生身体接触并倒地。裁判员临场未判罚犯规，VAR未介入。","appeal":"","conclusion":"对于此判例，评议组一致认为：从现有视频来看，无法证明浙江俱乐部20号有明显的推搡或冲撞对方队员的犯规动作，双方的身体接触应视为正常接触，裁判员做出的不犯规的决定应予支持，VAR无需介入。","videos":["2024/i18c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240821/1724243058568939.mp4"],"category":"penalty_area","tags":["正常接触"],"v":"correct","var":"none"},{"seq":117,"issue":18,"no":4,"comp":"中超联赛","round":"第23轮","home":"青岛海牛","away":"深圳新鹏城","minute":"58","match_info":"中超联赛第23轮，青岛海牛VS深圳新鹏城，比赛第58分钟，深圳新鹏城12号队员在带球突破过程中与青岛海牛26号队员腿部有接触并在对方罚球区内倒地","desc":"判例四：中超联赛第23轮，青岛海牛VS深圳新鹏城，比赛第58分钟，深圳新鹏城12号队员在带球突破过程中与青岛海牛26号队员腿部有接触并在对方罚球区内倒地。裁判员临场未判罚犯规，VAR未介入。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：深圳新鹏城12号的带球突破属于连贯、正常的比赛动作，青岛海牛26号在防守时右腿与对方队员的接触造成对方队员倒地，属于草率犯规，由于犯规发生在守方罚球区内，应判罚球点球。在裁判员未判罚犯规的情况下，VAR应予介入。裁判员临场漏判犯规和罚球点球，VAR未介入错误。","videos":["2024/i18c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240821/1724243102812320.mp4"],"category":"penalty_area","tags":["漏判点球","VAR未介入错误","草率犯规"],"v":"wrong","var":"wrong"},{"seq":118,"issue":18,"no":5,"comp":"中超联赛","round":"第23轮","home":"上海申花","away":"上海海港","minute":"26","match_info":"中超联赛第23轮，上海申花VS上海海港，比赛第26分钟，上海申花18号队员带球进入对方罚球区内并传中，球在运行过程中疑似与上海海港3号队员的手臂发生接触","desc":"判例五：中超联赛第23轮，上海申花VS上海海港，比赛第26分钟，上海申花18号队员带球进入对方罚球区内并传中，球在运行过程中疑似与上海海港3号队员的手臂发生接触。裁判员临场未判罚手球犯规。经VAR介入，裁判员在场回看后，判罚上海海港3号手球犯规，并判罚球点球。","appeal":"","conclusion":"对于此判例，评议组一致认为：从不同角度的VAR视频来看，球接触了上海海港3号手臂部位，并且符合手球犯规判定标准，因手
