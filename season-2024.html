吴","away":"辽宁铁人","minute":"77","match_info":"中甲联赛第20轮，苏州东吴VS辽宁铁人，比赛第77分钟，在辽宁铁人队罚球区内，苏州东吴2号队员在与辽宁铁人2号队员接触后倒地，裁判员判辽宁铁人2号防守犯规，罚球点球","desc":"判例二：中甲联赛第20轮，苏州东吴VS辽宁铁人，比赛第77分钟，在辽宁铁人队罚球区内，苏州东吴2号队员在与辽宁铁人2号队员接触后倒地，裁判员判辽宁铁人2号防守犯规，罚球点球。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：从现有视频上看，辽宁铁人2号对苏州东吴2号的拉扯动作，阻止了后者争抢球并造成其倒地，裁判员判罚辽宁铁人2号犯规并判罚球点球的决定应予支持。","videos":["2024/i19c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240829/1724895551659727.mp4"],"category":"penalty_area","tags":["点球","拉扯"],"v":"correct","var":"none"},{"seq":126,"issue":19,"no":3,"comp":"中甲联赛","round":"第20轮","home":"黑龙江冰城","away":"南京城市","minute":"7","match_info":"中甲联赛第20轮，黑龙江冰城VS南京城市，比赛第7分钟，南京城市30号队员进球，裁判员判罚攻方越位犯规在先，进球无效","desc":"判例三：中甲联赛第20轮，黑龙江冰城VS南京城市，比赛第7分钟，南京城市30号队员进球，裁判员判罚攻方越位犯规在先，进球无效。","appeal":"","conclusion":"对于此判例，评议组一致认为：南京城市队进球的30号队员，在其同队队员触球时，处于越位位置，之后黑龙江冰城队员虽然触球，但来球突然，其没有时间调整身体动作，只是做出了本能的踢球动作，不符合竞赛规则中对于判断越位犯规时守方队员“有意触球”的判定标准，因此南京城市30号队员随后将球打进，仍属于在越位位置获利，属越位犯规，进球无效，裁判员临场判罚正确。","videos":["2024/i19c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240829/1724895583835640.mp4"],"category":"offside","tags":["越位获利","有意触球","本能触球"],"v":"correct","var":"none"},{"seq":127,"issue":20,"no":1,"comp":"中甲联赛","round":"第21轮","home":"江西庐山","away":"黑龙江冰城","minute":"79","match_info":"中甲联赛第21轮，江西庐山VS黑龙江冰城，比赛第79分钟，黑龙江冰城8号队员在进攻前插时与对方队员发生身体接触后，在对方罚球区内倒地","desc":"判例一：中甲联赛第21轮，江西庐山VS黑龙江冰城，比赛第79分钟，黑龙江冰城8号队员在进攻前插时与对方队员发生身体接触后，在对方罚球区内倒地。裁判员未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：守方江西庐山队队员从侧后方对黑龙江冰城8号有冲撞动作，造成后者倒地，从现有视频判断，应判罚犯规。另外从回放镜头来看，双方队员进入守方罚球区前，冲撞过程已完成，犯规地点应认定为罚球区外。同时，攻方队员有控球进攻的可能性，该犯规阻止了对方有希望的进攻，应对守方球员出示黄牌。综上，此判例应判罚守方江西庐山队在本方罚球区外犯规，并黄牌警告犯规队员，由黑龙江冰城踢直接任意球恢复比赛。临场裁判员决定错误，漏判犯规、直接任意球和黄牌。","videos":["2024/i20c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240904/1725458230484741.mp4"],"category":"freekick_foul","tags":["漏判犯规","漏判黄牌","犯规地点在罚球区外"],"v":"wrong","var":"none"},{"seq":128,"issue":20,"no":2,"comp":"中甲联赛","round":"第21轮","home":"辽宁铁人","away":"大连英博","minute":"6","match_info":"中甲联赛第21轮，辽宁铁人VS大连英博，比赛第6分钟，辽宁铁人5号队员在本方罚球区内存在疑似手球情况","desc":"判例二：中甲联赛第21轮，辽宁铁人VS大连英博，比赛第6分钟，辽宁铁人5号队员在本方罚球区内存在疑似手球情况。裁判员未判罚犯规，VAR未介入。","appeal":"","conclusion":"对于此判例，评议组首先一致认为，辽宁铁人5号手臂的位置使身体不自然变大，在此情况下，如果手臂接触到球，应视为手球犯规。在此前提下，评议组多数成员认为：从球的运行路线推断和掌握的视频分析来看，球应与手臂有接触，此判例可认定为手球犯规，应判罚球点球。临场裁判员决定错误，漏判手球犯规和罚球点球。然而，临场VAR当时能看到的视频角度有限，无法做出球是否接触手臂的准确判断，临场VAR未介入，不应视为错误。","videos":["2024/i20c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240904/1725458517982640.mp4"],"category":"handball","tags":["漏判手球","漏判点球","VAR角度限制"],"v":"wrong","var":"correct"},{"seq":129,"issue":20,"no":3,"comp":"中乙联赛","round":"第21轮","home":"湖北青年星","away":"海口名城","minute":"89","match_info":"中乙联赛第21轮，湖北青年星VS海口名城，比赛第89分钟，在湖北青年星罚球区内，海口名城17号队员与湖北青年星守门员有接触，裁判员判攻方海口名城17号队员犯规，未判罚湖北青年星守门员犯规","desc":"判例三：中乙联赛第21轮，湖北青年星VS海口名城，比赛第89分钟，在湖北青年星罚球区内，海口名城17号队员与湖北青年星守门员有接触，裁判员判攻方海口名城17号队员犯规，未判罚湖北青年星守门员犯规。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：现有视频无法看清海口名城17号在铲球时与对方守门员的接触中是否构成犯规，也无法看清守门员此后是否有犯规动作，裁判员临场观察角度优于转播镜头角度，支持裁判员临场决定。","videos":["2024/i20c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240904/1725458799262197.mp4"],"category":"penalty_area","tags":["证据不足","铲球"],"v":"correct","var":"none"},{"seq":130,"issue":20,"no":4,"comp":"中乙联赛","round":"第21轮","home":"湖北青年星","away":"海口名城","minute":"","match_info":"中乙联赛第21轮，湖北青年星VS海口名城，比赛第90+8分钟，湖北青年星53号队员接同队传球形成突破，被海口名城49号队员在本方罚球区外拉倒，裁判员判海口名城49号犯规并出示红牌将其罚令出场","desc":"判例四：中乙联赛第21轮，湖北青年星VS海口名城，比赛第90+8分钟，湖北青年星53号队员接同队传球形成突破，被海口名城49号队员在本方罚球区外拉倒，裁判员判海口名城49号犯规并出示红牌将其罚令出场。","appeal":"","conclusion":"对于此判例，评议组一致认为：守方的犯规满足了破坏对方明显的进球得分机会的判别条件，临场裁判员判罚犯规并出示红牌的决定正确。","videos":["2024/i20c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240904/1725459140956841.mp4"],"category":"dogso","tags":["红牌","DOGSO","拉倒"],"v":"correct","var":"none"},{"seq":131,"issue":20,"no":5,"comp":"中乙联赛","round":"第21轮","home":"北京理工","away":"广西蓝航","minute":"70","match_info":"中乙联赛第21轮，北京理工VS广西蓝航，比赛第70分钟，北京理工队员在对方罚球区内与广西蓝航守门员接触后倒地，裁判员未判罚犯规","desc":"判例五：中乙联赛第21轮，北京理工VS广西蓝航，比赛第70分钟，北京理工队员在对方罚球区内与广西蓝航守门员接触后倒地，裁判员未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组一致认为：广西蓝航守门员出击后无犯规动作，双方属于正常的身体接触，裁判员临场做出的不犯规的决定正确。","videos":["2024/i20c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240904/1725459211620869.mp4"],"category":"penalty_area","tags":["正常接触","守门员"],"v":"correct","var":"none"},{"seq":132,"issue":20,"no":6,"comp":"中乙联赛","round":"第21轮","home":"北京理工","away":"广西蓝航","minute":"","match_info":"中乙联赛第21轮，北京理工VS广西蓝航，比赛第90+4分钟，北京理工在前场踢任意球，球传至广西蓝航罚球区内，广西蓝航队员疑似手球，裁判未判罚；之后北理工队员又疑似被广西蓝航队员拉扯倒地，裁判员也未判罚犯规","desc":"判例六：中乙联赛第21轮，北京理工VS广西蓝航，比赛第90+4分钟，北京理工在前场踢任意球，球传至广西蓝航罚球区内，广西蓝航队员疑似手球，裁判未判罚；之后北理工队员又疑似被广西蓝航队员拉扯倒地，裁判员也未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组一致认为，广西蓝航队员疑似手球，但由于视频中接触点被遮挡，无法证明是否手球犯规，但之后广西蓝航队员明显拉扯对方队员，限制其移动和对球的争抢并造成其倒地，应判罚拉扯犯规，罚球点球。同时，因攻方队员有争抢球和射门的机会，还应以阻止对方有希望的进攻为由，向守方队员出示黄牌警告。临场裁判员决定错误，漏判罚球点球和黄牌。","videos":["2024/i20c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240904/1725459426971110.mp4"],"category":"penalty_area","tags":["漏判点球","漏判黄牌","拉扯犯规","手球无法证明"],"v":"wrong","var":"none"},{"seq":133,"issue":21,"no":1,"comp":"中甲联赛","round":"第22轮","home":"苏州东吴","away":"南京城市","minute":"6","match_info":"中甲联赛第22轮，苏州东吴VS南京城市，比赛第6分钟，苏州东吴10号队员在本方罚球区内存在疑似手球情况","desc":"判例一：中甲联赛第22轮，苏州东吴VS南京城市，比赛第6分钟，苏州东吴10号队员在本方罚球区内存在疑似手球情况。裁判员未判罚手球犯规。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：苏州东吴10号手臂有从自然位置向非自然位置移动的动作，但现有视频无法看清或证明球与苏州东吴10号手臂是否接触，以及与身体或手臂接触过程是否构成手球犯规。在没有清晰视频证据的情况下，对裁判员临场做出的不是手球犯规的决定应予支持。","videos":["2024/i21c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240912/1726148856673408.mp4"],"category":"handball","tags":["证据不足"],"v":"correct","var":"none"},{"seq":134,"issue":21,"no":2,"comp":"中乙联赛","round":"第22轮","home":"赣州瑞狮","away":"日照宇启","minute":"84","match_info":"中乙联赛第22轮，赣州瑞狮VS日照宇启，比赛第84分钟，日照宇启10号队员在与赣州瑞狮30号队员争抢球时，前者疑似用脚踩踏后者，裁判员出示红牌将日照宇启10号罚令出场","desc":"判例二：中乙联赛第22轮，赣州瑞狮VS日照宇启，比赛第84分钟，日照宇启10号队员在与赣州瑞狮30号队员争抢球时，前者疑似用脚踩踏后者，裁判员出示红牌将日照宇启10号罚令出场。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：赣州瑞狮30号在争抢球时进入日照宇启10号跑动路线，造成双方身体接触及倒地。从现有视频看，日照宇启10号在倒地过程中没有明显的附加动作或恶意踩踏对方队员的行为，不应认定为暴力行为，裁判员向其出示红牌罚令出场的决定错误。","videos":["2024/i21c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240912/1726148883570802.mp4"],"category":"sfp_vc","tags":["红牌错误","暴力行为不成立","无附加动作"],"v":"wrong","var":"none"},{"seq":135,"issue":21,"no":3,"comp":"中乙联赛","round":"第22轮","home":"泰安天贶","away":"江西黑马青年","minute":"","match_info":"中乙联赛第22轮，泰安天贶VS江西黑马青年，比赛第45+2分钟，江西黑马青年15号队员与泰安天贶48号队员在泰安天贶罚球区内争抢球，江西黑马青年15号从对方队员身后争抢试图触球，之后球疑似接触泰安天贶48号手臂，裁判员未判罚手球犯规","desc":"判例三：中乙联赛第22轮，泰安天贶VS江西黑马青年，比赛第45+2分钟，江西黑马青年15号队员与泰安天贶48号队员在泰安天贶罚球区内争抢球，江西黑马青年15号从对方队员身后争抢试图触球，之后球疑似接触泰安天贶48号手臂，裁判员未判罚手球犯规。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：江西黑马青年15号从泰安天贶48号身后争抢球，其争抢动作和身体接触造成了泰安天贶48号失去身体平衡，其手臂并非有意处于非自然位置拦截球，不应视为手球犯规。在现有视频角度下，裁判员临场做出的不是手球犯规的决定应予支持。","videos":["2024/i21c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240912/1726148905946043.mp4"],"category":"handball","tags":["证据不足","手臂非有意"],"v":"correct","var":"none"},{"seq":136,"issue":22,"no":1,"comp":"中甲联赛","round":"第23轮","home":"广州俱乐部","away":"苏州东吴","minute":"72","match_info":"中甲联赛第23轮，广州俱乐部VS苏州东吴，比赛第72分钟，广州俱乐部18号队员在苏州东吴罚球区内与对方35号队员争抢球时倒地，裁判员判守方苏州东吴35号犯规，并判罚球点球","desc":"判例一：中甲联赛第23轮，广州俱乐部VS苏州东吴，比赛第72分钟，广州俱乐部18号队员在苏州东吴罚球区内与对方35号队员争抢球时倒地，裁判员判守方苏州东吴35号犯规，并判罚球点球。","appeal":"","conclusion":"对于此判例，评议组一致认为：苏州东吴35号对对方队员有拉扯动作，影响了对方争抢球，应视为防守犯规，裁判员判苏州东吴35号犯规并判罚球点球的决定正确。","videos":["2024/i22c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240919/1726753480651409.mp4"],"category":"penalty_area","tags":["点球","拉扯"],"v":"correct","var":"none"},{"seq":137,"issue":22,"no":2,"comp":"中甲联赛","round":"第23轮","home":"南京城市","away":"无锡吴钩","minute":"49","match_info":"中甲联赛第23轮，南京城市VS无锡吴钩，比赛第49分钟，南京城市11号队员进球前疑似手球在先，裁判员判进球有效","desc":"判例二：中甲联赛第23轮，南京城市VS无锡吴钩，比赛第49分钟，南京城市11号队员进球前疑似手球在先，裁判员判进球有效。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：南京城市11号争抢高空球时手臂触球，其手臂处于当前动作下的正常和合理位置，在对方守门员争抢球并可能触球的情况下无法预知球的来路，手臂与球的接触属于意外手球，不应判罚手球犯规。之后守方无锡吴钩守门员将球踢进本方球门，应判进球有效。裁判员临场决定正确。","videos":["2024/i22c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240919/1726753507496596.mp4"],"category":"handball","tags":["意外手球","守门员","乌龙球"],"v":"correct","var":"none"},{"seq":138,"issue":22,"no":3,"comp":"中乙联赛","round":"第23轮","home":"北京理工","away":"赣州瑞狮","minute":"62","match_info":"中乙联赛第23轮，北京理工VS赣州瑞狮，比赛第62分钟，北京理工队射门，赣州瑞狮队员在本方罚球区疑似手球，裁判员未判罚手球犯规","desc":"判例三：中乙联赛第23轮，北京理工VS赣州瑞狮，比赛第62分钟，北京理工队射门，赣州瑞狮队员在本方罚球区疑似手球，裁判员未判罚手球犯规。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：从现有视频判断，球与守方赣州瑞狮队员的手臂应有接触，赣州瑞狮队员的手臂有向球的运行路线移动的动作，并且使身体不自然扩大，应判罚手球犯规，罚球点球。裁判员临场决定错误，漏判罚球点球。","videos":["2024/i22c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240919/1726753527829255.mp4"],"category":"handball","tags":["漏判手球","漏判点球","手臂不自然扩大"],"v":"wrong","var":"none"},{"seq":139,"issue":22,"no":4,"comp":"中乙联赛","round":"第23轮","home":"北京理工","away":"赣州瑞狮","minute":"85","match_info":"中乙联赛第23轮，北京理工VS赣州瑞狮，比赛第85分钟，双方队员在赣州瑞狮罚球区内争抢球并倒地，裁判员判攻方北京理工队员犯规，并出示黄牌警告攻方北京理工队员","desc":"判例四：中乙联赛第23轮，北京理工VS赣州瑞狮，比赛第85分钟，双方队员在赣州瑞狮罚球区内争抢球并倒地，裁判员判攻方北京理工队员犯规，并出示黄牌警告攻方北京理工队员。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：双方队员在赣州瑞狮罚球区内的连续两次争抢接触中，第一次接触，双方均不犯规，第二次接触，攻方北京理工队员抢先触球，守方赣州瑞狮队员因动作晚了而踢到对方队员，属于草率犯规，应判守方犯规、罚球点球。裁判员临场判攻方北京理工犯规的决定错误，漏判罚球点球，并且做出了反判。","videos":["2024/i22c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240919/1726753550629552.mp4"],"category":"penalty_area","tags":["错判犯规","漏判点球","反判","草率犯规"],"v":"wrong","var":"none"},{"seq":140,"issue":23,"no":1,"comp":"中超联赛","round":"第26轮","home":"山东泰山","away":"武汉三镇","minute":"28","match_info":"中超联赛第26轮，山东泰山VS武汉三镇，比赛第28分钟，武汉三镇28号队员在山东泰山罚球区内与对方13号队员发生身体接触后倒地，裁判员临场未判罚犯规，随后VAR介入比赛，裁判员在场回看后维持不判球点球判罚","desc":"判例一：中超联赛第26轮，山东泰山VS武汉三镇，比赛第28分钟，武汉三镇28号队员在山东泰山罚球区内与对方13号队员发生身体接触后倒地，裁判员临场未判罚犯规，随后VAR介入比赛，裁判员在场回看后维持不判球点球判罚。","appeal":"","conclusion":"对于此判例，评议组成员一致认为：山东泰山13号队员与武汉三镇28号队员的接触程度较轻微，未影响对方控制球权；28号队员倒地主因是右脚踩在了防守队员脚上，导致滑倒，不应视为对方防守犯规，裁判员临场未判罚球点球以及在VAR介入后维持最初判罚的决定正确，VAR介入错误。","videos":["2024/i23c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240925/1727272636224089.mp4"],"category":"penalty_area","tags":["维持原判","VAR介入错误","轻微接触"],"v":"correct","var":"wrong"},{"seq":141,"issue":23,"no":2,"comp":"中超联赛","round":"第26轮","home":"南通支云","away":"青岛海牛","minute":"","match_info":"中超联赛第26轮，南通支云VS青岛海牛，比赛第90+7分钟，青岛海牛3号队员与南通支云10号队员争抢球时发生身体接触后倒地，裁判员临场判罚南通支云10号队员犯规并出示黄牌对其警告","desc":"判例二：中超联赛第26轮，南通支云VS青岛海牛，比赛第90+7分钟，青岛海牛3号队员与南通支云10号队员争抢球时发生身体接触后倒地，裁判员临场判罚南通支云10号队员犯规并出示黄牌对其警告。","appeal":"","conclusion":"对于此判例，评议组成员一致认为：南通支云10号队员与青岛海牛3号队员争抢球产生身体接触前有一定的冲刺距离，南通支云10号队员在青岛海牛3号队员先接触球后仍直腿对其做出抢截动作，从使用的力量、犯规的程度、接触的部位来看此犯规是一个危及对方队员安全的抢截动作，应依据严重犯规条款，将南通支云10号队员红牌罚令出场。裁判员临场判罚错误，VAR未介入错误。","videos":["2024/i23c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240925/1727272661763514.mp4"],"category":"sfp_vc","tags":["漏判红牌","严重犯规","VAR未介入错误","危及安全"],"v":"wrong","var":"wrong"},{"seq":142,"issue":23,"no":3,"comp":"中超联赛","round":"第26轮","home":"南通支云","away":"青岛海牛","minute":"","match_info":"中超联赛第26轮，南通支云VS青岛海牛，比赛第90+13分钟，青岛海牛11号队员主罚球点球，在其罚失后由同队23号队员补射进球，经VAR提示，裁判员在线回看分析，认定攻方青岛海牛23号队员在球点球罚出之前进入罚球区违例，取消进球，由南通支云队罚间接任意球恢复比赛","desc":"判例三：中超联赛第26轮，南通支云VS青岛海牛，比赛第90+13分钟，青岛海牛11号队员主罚球点球，在其罚失后由同队23号队员补射进球，经VAR提示，裁判员在线回看分析，认定攻方青岛海牛23号队员在球点球罚出之前进入罚球区违例，取消进球，由南通支云队罚间接任意球恢复比赛。","appeal":"","conclusion":"对于此判例，评议组成员一致认为：在《2023-2024足球竞赛规则》及此前版本的竞赛规则是双方队员提前进入罚球区应重新踢罚球点球。但在2024年7月1日中国足协各级赛事开始执行的《2024-2025足球竞赛规则》相关条款已经作了更新，明确队员提前进入罚球区后分为影响比赛和未影响比赛两种情况，针对不同的情况将做出不同的判罚决定。此判例实际情况是在球点球罚出前，进攻方青岛海牛23号队员和防守方南通支云24号队员均提前进入罚球区，但是只有进攻方23号队员补射将球打进，直接影响到了比赛，而防守方24号队员的行为对比赛并未产生明显的影响。按照最新规则相关条款规定，球点球罚出后球未直接进门，攻方队员提前进入罚球区并影响了比赛，应判罚由守方踢间接任意球恢复比赛。裁判员最终判罚及VAR介入正确。","videos":["2024/i23c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240925/1727272686161316.mp4"],"category":"goal_decision","tags":["点球程序新规","VAR介入正确","提前进入罚球区"],"v":"correct","var":"correct"},{"seq":143,"issue":23,"no":4,"comp":"中甲联赛","round":"第24轮","home":"广西平果","away":"上海嘉定汇龙","minute":"87","match_info":"中甲联赛第24轮，广西平果哈嘹VS上海嘉定汇龙，比赛第87分钟，广西平果哈嘹37号队员运球进入上海嘉定汇龙罚球区并与其30号队员发生身体接触后倒地，裁判员临场未做出判罚","desc":"判例四：中甲联赛第24轮，广西平果哈嘹VS上海嘉定汇龙，比赛第87分钟，广西平果哈嘹37号队员运球进入上海嘉定汇龙罚球区并与其30号队员发生身体接触后倒地，裁判员临场未做出判罚。","appeal":"","conclusion":"对于此判例，评议组成员一致认为：广西平果哈嘹37号队员运球进入上海嘉定汇龙罚球区后，在继续带球靠近球门的过程中被上海嘉定汇龙30号队员从背后拉拽倒地，此次防守动作对进攻队员产生了干扰，属于草率犯规，应判守方犯规、罚球点球。裁判员临场判罚决定错误，漏判罚球点球。","videos":["2024/i23c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240925/1727272712586749.mp4"],"category":"penalty_area","tags":["漏判点球","草率犯规","背后拉拽"],"v":"wrong","var":"none"},{"seq":144,"issue":23,"no":5,"comp":"中乙联赛","round":"第24轮","home":"泰安天贶","away":"泉州亚新","minute":"76","match_info":"中乙联赛第24轮，泰安天贶VS泉州亚新，比赛第76分钟，泰安天贶11号队员接队员传球，随后与泉州亚新26号队员发生身体接触倒地，裁判员临场未做出判罚","desc":"判例五：中乙联赛第24轮，泰安天贶VS泉州亚新，比赛第76分钟，泰安天贶11号队员接队员传球，随后与泉州亚新26号队员发生身体接触倒地，裁判员临场未做出判罚。","appeal":"","conclusion":"对于此判例，评议组成员一致认为：在泰安天贶11号队员接队友传球向前过程中，被泉州亚新26号队员从侧向抢截犯规，首先裁判员临场应判罚防守队员犯规，其次从“破坏进球或者明显进球得分机会”的四个要素即犯规发生地点与球门间的距离、比赛发展的大致方向、继续控球或获得球权的可能性、防守队员的位置和人数来看，此次犯规完全满足这四个要素，应对防守队员出示红牌。裁判员临场决定错误。","videos":["2024/i23c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20240925/1727272733590160.mp4"],"category":"dogso","tags":["漏判红牌","DOGSO","四要素","抢截犯规"],"v":"wrong","var":"none"},{"seq":145,"issue":24,"no":1,"comp":"中国足协杯","round":"","home":"山东泰山","away":"成都蓉城","minute":"64","match_info":"2024中国足协杯赛半决赛，山东泰山VS成都蓉城，比赛第64分钟，成都蓉城31号队员在反击中与山东泰山21号队员发生身体接触，裁判员判攻方成都蓉城31号犯规","desc":"判例一：2024中国足协杯赛半决赛，山东泰山VS成都蓉城，比赛第64分钟，成都蓉城31号队员在反击中与山东泰山21号队员发生身体接触，裁判员判攻方成都蓉城31号犯规。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：攻方成都蓉城31号队员先使用右手臂接触对方队员肩部，但方式和力度属于双方争抢时的正常接触范畴，之后山东泰山21号倒地时对成都蓉城31号形成的干扰也是由双方正常身体接触造成，本次争抢过程中双方均不犯规，裁判员临场判罚攻方成都蓉城球员犯规的决定错误。","videos":["2024/i24c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20241009/1728474305667637.mp4"],"category":"penalty_area","tags":["错判犯规","正常接触","足协杯"],"v":"wrong","var":"none"},{"seq":146,"issue":24,"no":2,"comp":"中国足协杯","round":"","home":"山东泰山","away":"成都蓉城","minute":"90","match_info":"2024中国足协杯赛半决赛，山东泰山VS成都蓉城，比赛第90分钟，山东泰山5号队员进球得分，助理裁判员未示意越位，裁判员判进球有效，VAR查看后未介入","desc":"判例二：2024中国足协杯赛半决赛，山东泰山VS成都蓉城，比赛第90分钟，山东泰山5号队员进球得分，助理裁判员未示意越位，裁判员判进球有效，VAR查看后未介入。","appeal":"","conclusion":"对于此判例，评议组一致认为：山东泰山队传中时，本方队员均不处于越位位置；此判例最后进球得分的队员是否处于越位位置，取决于球在运行过程中，攻方山东泰山队两名队员在门前争抢时是否触到球，评议组查看视频后认为，无法证明球触及了上述两名队员；临场裁判员与VAR的沟通与查看操作符合相关流程和规范。裁判员最终判山东泰山5号进球得分有效的决定，应予支持；VAR未介入的决定正确。","videos":["2024/i24c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20241009/1728474365586197.mp4"],"category":"goal_decision","tags":["进球有效","VAR未介入正确","无法证明触球","足协杯"],"v":"correct","var":"correct"},{"seq":147,"issue":24,"no":3,"comp":"中超联赛","round":"第27轮","home":"成都蓉城","away":"梅州客家","minute":"13","match_info":"中超联赛第27轮，成都蓉城vs梅州客家，比赛第13分钟，成都蓉城队踢角球，随后形成进球，第一助理裁判员举旗示意球在空中出球门线，裁判员判球出界在先，由梅州客家队以球门球恢复比赛，VAR查看后认为球未出球门线，并介入，裁判员最终改判进球有效","desc":"判例三：中超联赛第27轮，成都蓉城vs梅州客家，比赛第13分钟，成都蓉城队踢角球，随后形成进球，第一助理裁判员举旗示意球在空中出球门线，裁判员判球出界在先，由梅州客家队以球门球恢复比赛，VAR查看后认为球未出球门线，并介入，裁判员最终改判进球有效。","appeal":"","conclusion":"对于此判例，评议组一致认为：此判例涉及球是否在空中越过球门线的客观事实。在使用VAR技术的比赛中，裁判员和VAR经过规范操作和查看后做出的最终决定，应予支持。此判例改判为进球有效的决定正确，VAR介入正确。","videos":["2024/i24c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20241009/1728474394761117.mp4"],"category":"goal_decision","tags":["进球有效","VAR介入正确","球门线"],"v":"correct","var":"correct"},{"seq":148,"issue":24,"no":4,"comp":"中甲联赛","round":"第26轮","home":"无锡吴钩","away":"辽宁铁人","minute":"17","match_info":"中甲联赛第26轮，无锡吴钩VS辽宁铁人，比赛第17分钟，无锡吴钩19号队员在对方罚球区内与守方24号队员争抢球后倒地","desc":"判例四：中甲联赛第26轮，无锡吴钩VS辽宁铁人，比赛第17分钟，无锡吴钩19号队员在对方罚球区内与守方24号队员争抢球后倒地。裁判员未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：守方辽宁铁人24号在争抢球时腿部和手臂均与攻方无锡吴钩19号有接触，腿部的接触属于双方争抢中的正常接触，手臂与对方身体的接触，发力和拉扯动作不明显，也不是造成攻方队员倒地的主要原因，攻方队员有继续前进后借助之前的接触主动倒地的动作成分，裁判员做出的辽宁铁人球员不犯规的决定应予支持。","videos":["2024/i24c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20241009/1728474420580844.mp4"],"category":"penalty_area","tags":["正常接触","主动倒地"],"v":"correct","var":"none"},{"seq":149,"issue":24,"no":5,"comp":"中甲联赛","round":"第26轮","home":"南京城市","away":"石家庄功夫","minute":"","match_info":"中甲联赛第26轮，南京城市VS石家庄功夫，比赛第90+6分钟，石家庄功夫28号队员进球，裁判员判进球有效","desc":"判例五：中甲联赛第26轮，南京城市VS石家庄功夫，比赛第90+6分钟，石家庄功夫28号队员进球，裁判员判进球有效。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：从现有视频的角度无法准确判断石家庄功夫队传球的瞬间，其28号队员是否处于越位位置，应支持裁判员临场做出的不越位（进球有效）的决定。","videos":["2024/i24c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20241009/1728474442258652.mp4"],"category":"offside","tags":["证据不足","越位"],"v":"correct","var":"none"},{"seq":150,"issue":24,"no":6,"comp":"中乙联赛","round":"第25轮","home":"泉州亚新","away":"北京理工","minute":"54","match_info":"中乙联赛第25轮，泉州亚新VS北京理工，比赛第54分钟，北京理工队守门员在本方罚球区内疑似绊倒泉州亚新队员，裁判员判罚球点球","desc":"判例六：中乙联赛第25轮，泉州亚新VS北京理工，比赛第54分钟，北京理工队守门员在本方罚球区内疑似绊倒泉州亚新队员，裁判员判罚球点球。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：北京理工守门员在铲球时清晰触到球，并且无附加或其他犯规动作，不应视为犯规，裁判员判北京理工守门员犯规并判罚球点球的决定错误。","videos":["2024/i24c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20241009/1728474465232810.mp4"],"category":"penalty_area","tags":["错判点球","守门员","铲球先触球"],"v":"wrong","var":"none"},{"seq":151,"issue":25,"no":1,"comp":"中超联赛","round":"第28轮","home":"武汉三镇","away":"浙江俱乐部绿城","minute":"","match_info":"中超联赛第28轮，武汉三镇VS浙江俱乐部，比赛第45+2分钟，武汉三镇23号队员在争抢球时踩踏浙江俱乐部45号队员脚踝，裁判员未判罚犯规","desc":"判例一：中超联赛第28轮，武汉三镇VS浙江俱乐部，比赛第45+2分钟，武汉三镇23号队员在争抢球时踩踏浙江俱乐部45号队员脚踝，裁判员未判罚犯规。VAR以应出示红牌为由介入。裁判员停止比赛，并进行在场回看后，向武汉三镇23号出示黄牌警告，并以坠球恢复比赛。","appeal":"","conclusion":"对于此判例，评议组一致认为：从武汉三镇23号队员的犯规意图、使用的部位、接触对方的部位、接触强度力度、给对方造成的伤害等方面，均构成严重犯规的认定条件，应对其出示红牌罚令出场。临场VAR介入正确，裁判员在场回看后出示黄牌警告的决定错误，漏判红牌。","videos":["2024/i25c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20241023/1729687513301775.mp4"],"category":"sfp_vc","tags":["漏判红牌","严重犯规","踩踏脚踝","VAR介入正确"],"v":"wrong","var":"correct"},{"seq":152,"issue":25,"no":2,"comp":"中超联赛","round":"第28轮","home":"沧州雄狮","away":"南通支云","minute":"78","match_info":"中超联赛第28轮，沧州雄狮VS南通支云，比赛第78分钟，裁判员判沧州雄狮7号队员在本方罚球区内手球犯规，并判罚球点球","desc":"判例二：中超联赛第28轮，沧州雄狮VS南通支云，比赛第78分钟，裁判员判沧州雄狮7号队员在本方罚球区内手球犯规，并判罚球点球。VAR介入，裁判员在场回看后改判为不是手球犯规，并以坠球恢复比赛。","appeal":"","conclusion":"对于此判例，评议组首先一致认为，从现有视频上看，球先接触了防守队员的身体肋部。部分评议组成员认为球反弹后有可能接触了队员手臂但无法最终判定。同时评议组一致认为，即使球接触了手臂，也属于球在队员身体反弹后的意外手球情形，不是手球犯规。临场VAR介入正确，裁判员在场回看后改判为不是手球犯规的决定正确。","videos":["2024/i25c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20241023/1729687602846289.mp4"],"category":"handball","tags":["VAR介入正确","意外手球","身体反弹"],"v":"correct","var":"correct"},{"seq":153,"issue":25,"no":3,"comp":"中甲联赛","round":"第27轮","home":"广州俱乐部","away":"江西庐山","minute":"","match_info":"中甲联赛第27轮，广州俱乐部VS江西庐山，比赛第90+4分钟，广州俱乐部9号队员在对方罚球区内与守方队员发生身体接触后倒地，裁判员未判罚犯规，VAR未介入","desc":"判例三：中甲联赛第27轮，广州俱乐部VS江西庐山，比赛第90+4分钟，广州俱乐部9号队员在对方罚球区内与守方队员发生身体接触后倒地，裁判员未判罚犯规，VAR未介入。","appeal":"","conclusion":"对于此判例，评议组一致认为：双方队员的接触属于相互的、正常的身体接触，守方队员没有明显的犯规动作，传球落点并不在该两名队员的争抢范围内，攻方队员有借助接触主动倒地的成分。裁判员未判罚犯规的决定正确，VAR未介入正确。","videos":["2024/i25c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20241023/1729687631218154.mp4"],"category":"penalty_area","tags":["正常接触","主动倒地","VAR未介入正确"],"v":"correct","var":"correct"},{"seq":154,"issue":25,"no":4,"comp":"中甲联赛","round":"第27轮","home":"广州俱乐部","away":"江西庐山","minute":"","match_info":"中甲联赛第27轮，广州俱乐部VS江西庐山，比赛第90+8分钟，广州队队员射门，球疑似接触江西庐山罚球区内的守方25号队员手臂，裁判未判罚手球犯规","desc":"判例四：中甲联赛第27轮，广州俱乐部VS江西庐山，比赛第90+8分钟，广州队队员射门，球疑似接触江西庐山罚球区内的守方25号队员手臂，裁判未判罚手球犯规。VAR未介入。","appeal":"","conclusion":"对于此判例，评议组一致认为：江西庐山25号队员的手臂处于自然位置，没有附加动作，即使球接触手臂，也不是手球犯规。裁判员未判罚手球犯规的决定正确，VAR未介入正确。","videos":["2024/i25c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20241023/1729687652730732.mp4"],"category":"handball","tags":["自然位置","VAR未介入正确"],"v":"correct","var":"correct"},{"seq":155,"issue":25,"no":5,"comp":"中乙联赛","round":"第27轮","home":"日照宇启","away":"赣州瑞狮","minute":"39","match_info":"中乙联赛第27轮，日照宇启VS赣州瑞狮，比赛第39分钟，裁判员判赣州瑞狮15号队员在本方罚球区内倒地后手球犯规，并判罚球点球","desc":"判例五：中乙联赛第27轮，日照宇启VS赣州瑞狮，比赛第39分钟，裁判员判赣州瑞狮15号队员在本方罚球区内倒地后手球犯规，并判罚球点球。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：赣州瑞狮15号队员在本方罚球区内试图处理球时与对方队员发生接触倒地，对方队员未犯规，赣州瑞狮15号倒地后手臂主动向球的方向移动触球，属于手球犯规，裁判员判其手球犯规并判罚球点球的决定正确。","videos":["2024/i25c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20241023/1729687679534810.mp4"],"category":"handball","tags":["手球","点球","倒地后主动触球"],"v":"correct","var":"none"},{"seq":156,"issue":25,"no":6,"comp":"中乙联赛","round":"第28轮","home":"赣州瑞狮","away":"北京理工","minute":"74","match_info":"中乙联赛第28轮，赣州瑞狮VS北京理工，比赛第74分钟，北京理工52号队员进球得分疑似越位犯规在先","desc":"判例六：中乙联赛第28轮，赣州瑞狮VS北京理工，比赛第74分钟，北京理工52号队员进球得分疑似越位犯规在先。第一助理裁判员未判罚越位犯规，裁判员判进球有效。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：攻方北京理工队员触球时，其52号队员处于越位位置，随后得球并射门得分，应判罚其越位犯规在先，进球无效。裁判员判进球有效的决定错误。","videos":["2024/i25c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20241023/1729687725868582.mp4"],"category":"offside","tags":["漏判越位","进球无效"],"v":"wrong","var":"none"},{"seq":157,"issue":26,"no":1,"comp":"中甲联赛","round":"第29轮","home":"上海嘉定汇龙","away":"石家庄功夫","minute":"25","match_info":"中甲联赛第29轮，上海嘉定汇龙vs石家庄功夫，比赛第25分钟，上海嘉定汇龙7号队员在对方罚球区内射门，球疑似接触守方石家庄功夫20号队员手臂，裁判员未判罚手球犯规","desc":"判例一：中甲联赛第29轮，上海嘉定汇龙vs石家庄功夫，比赛第25分钟，上海嘉定汇龙7号队员在对方罚球区内射门，球疑似接触守方石家庄功夫20号队员手臂，裁判员未判罚手球犯规。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：守方队员手臂处于自然位置，也没有附加的向球移动的动作，虽然球接触了手臂，但这不是手球犯规。裁判员做出的不是手球犯规的决定正确。","videos":["2024/i26c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20241030/1730282296239577.mp4"],"category":"handball","tags":["自然位置"],"v":"correct","var":"none"},{"seq":158,"issue":26,"no":2,"comp":"中甲联赛","round":"第29轮","home":"云南玉昆","away":"大连英博","minute":"83","match_info":"中甲联赛第29轮，云南玉昆vs大连英博，比赛第83分钟，大连英博进球，裁判员初始判进球有效，VAR介入，裁判员经在场回看后改判攻方大连英博40号队员进球前手球犯规在先，进球无效","desc":"判例二：中甲联赛第29轮，云南玉昆vs大连英博，比赛第83分钟，大连英博进球，裁判员初始判进球有效，VAR介入，裁判员经在场回看后改判攻方大连英博40号队员进球前手球犯规在先，进球无效。","appeal":"","conclusion":"对于此判例，评议组首先一致认为：VAR所查看的视频，其角度不能清晰证明球是否与攻方大连英博40号队员手臂有接触，不能证明裁判员的初始判罚（进球有效）出现了明显、清晰的错误，根据竞赛规则及VAR操作规范，VAR依据此视频介入属于错误介入。裁判员在场回看后，依据此视频做出改判也属于错误。\n同时，评议组多数成员认为，根据现有视频可以判断，球未接触攻方大连英博40号手臂，攻方不存在手球犯规，进球应为有效，裁判员改判为进球无效的最终决定错误。","videos":["2024/i26c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20241030/1730282396807059.mp4"],"category":"handball","tags":["VAR介入错误","改判错误","球未触手臂"],"v":"wrong","var":"wrong"},{"seq":159,"issue":27,"no":1,"comp":"三大球运动会","round":"第5轮","home":"河北","away":"湖北","minute":"41","match_info":"第一届全国青少年三大球运动会足球项目男子组决赛阶段第5轮，河北vs湖北，比赛第41分钟，湖北队19号队员在对方罚球区内与河北队1号守门员发生接触后倒地，裁判员判河北队1号守门员犯规并判罚球点球","desc":"判例一：第一届全国青少年三大球运动会足球项目男子组决赛阶段第5轮，河北vs湖北，比赛第41分钟，湖北队19号队员在对方罚球区内与河北队1号守门员发生接触后倒地，裁判员判河北队1号守门员犯规并判罚球点球。在比赛恢复前，经与助理裁判员和第四官员商议，裁判员改判由守方河北队踢间接任意球恢复比赛，并向湖北队19号和河北队1号守门员分别出示黄牌警告。","appeal":"","conclusion":"对于此判例，评议组一致认为：湖北队19号队员在河北队1号守门员已经用手控制球的情况下，干扰对方守门员发出球，属于违规行为，之后再次上前争抢干扰，河北队1号守门员抬起手臂，双方互相冲撞接触。从目前视频看，该接触是以肩臂部为主，不排除守门员可能与对方头面部有接触，但其程度和性质不属于故意使用手臂或肘部击打对方头面部，不应视为暴力行为。双方队员本次接触有相互挑衅的非体育行为成分，裁判员最终改判由守方河北队踢间接任意球恢复比赛，以及对湖北队19号和河北队1号守门员分别出示黄牌的决定正确。","videos":["2024/i27c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20241130/1732966024118418.mp4"],"category":"sfp_vc","tags":["黄牌","非体育行为","守门员控球","互相冲撞"],"v":"correct","var":"none"},{"seq":160,"issue":27,"no":2,"comp":"三大球运动会","round":"第5轮","home":"河北","away":"湖北","minute":"86","match_info":"第一届全国青少年三大球运动会足球项目男子组决赛阶段第5轮，河北vs湖北，比赛第86分钟，湖北队准备踢角球时，双方队员在河北队罚球区内争抢位置时发生接触，裁判员进行管理后，未做出处罚，仍以角球恢复比赛","desc":"判例二：第一届全国青少年三大球运动会足球项目男子组决赛阶段第5轮，河北vs湖北，比赛第86分钟，湖北队准备踢角球时，双方队员在河北队罚球区内争抢位置时发生接触，裁判员进行管理后，未做出处罚，仍以角球恢复比赛。","appeal":"","conclusion":"对于此判例，评议组首先一致认为：依照足球竞赛规则，在比赛停止时，即使发生违规行为或出示红黄牌，也不能改变比赛恢复的方式，因此裁判员仍以角球恢复比赛的决定正确。\n另外，评议组多数成员认为：在双方争抢位置过程中，攻方湖北队队员对守方河北队队员有推搡和踩脚的动作，之后河北队队员有企图报复的动作，但并未踢到，且其情绪和动作程度有所控制，湖北队队员做出了夸张的躲避动作。对于双方队员的非体育行为，认可裁判员的临场处置方式，但也有评议组成员认为对双方队员出示黄牌警告也是一种合适的处置方式。","videos":["2024/i27c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20241130/1732966103523140.mp4"],"category":"sfp_vc","tags":["非体育行为","比赛恢复方式","推搡"],"v":"correct","var":"none"}],"issues":{"1":{"title":"中国足协组织2024赛季首次裁判评议","date":"20240311","url":"https://www.thecfa.cn/zyls1/20240311/33847.html","expected":0,"summary":"新赛季伊始，中国足协对职业联赛中争议判罚的认定，以及俱乐部对裁判判罚的意见给予高度重视。3月11日，针对上海海港俱乐部和云南玉昆俱乐部提出的申诉及意见反映，中国足协组织了本赛季第一次裁判评议工作。本赛季评议工作采用评议成员集体讨论和单独发表意见相结合的形式，体现“评” /crests/jiading-huilong.png","苏州东吴":"assets/crests/suzhou-dongwu.png","深圳青年人":"assets/crests/shenzhen-qingnianren.png","佛山南狮":"assets/crests/foshan-nanshi.png","陕西联合":"assets/crests/shaanxi-lianhe.png","广西恒宸":"assets/crests/guangxi-hengchen.png","杭州临平吴越":"assets/crests/hangzhou-linpingwuyue.png","湖北青年星":"assets/crests/hubei-qingnianxing.png","温州俱乐部":"assets/crests/wenzhou.png","江西庐山":"assets/crests/jiangxi-lushan.png","深圳二零二八":"assets/crests/shenzhen-2028.png","北京理工":"assets/crests/beijing-ligong.png","山东泰山B队":"assets/crests/shandong-taishan.png","成都蓉城B队":"assets/crests/chengdu-rongcheng.png","武汉三镇B队":"assets/crests/wuhan-sanzhen.png","上海海港富盛经开":"assets/crests/shanghai-haigang.png"},"categories":[{"id":"handball","name":"手球犯规","icon":"✋"},{"id":"offside","name":"越位","icon":"🚩"},{"id":"penalty_area","name":"罚球区内判罚（点球）","icon":"⭕"},{"id":"freekick_foul","name":"罚球区外一般犯规","icon":"🦵"},{"id":"spa_tactical","name":"战术犯规与SPA","icon":"🧲"},{"id":"dogso","name":"破坏明显进球得分机会（DOGSO）","icon":"🎯"},{"id":"sfp_vc","name":"严重犯规与暴力行为","icon":"🟥"},{"id":"simulation","name":"假摔与欺骗行为","icon":"🎭"},{"id":"goal_decision","name":"进球判定与有利条款","icon":"🥅"},{"id":"other_program","name":"程序与其他","icon":"📐"}],"notes":{"handball":"统一尺度要点：①判定手球犯规的核心是「手臂是否使身体不自然扩大」以及「是否手向球移动」；手臂处于动作下的自然位置、近距离反弹、意外触球不构成犯规。②手臂范围以腋窝下沿为界。③守方在本方罚球区内手球→罚球点球；手球阻止对方射门（有希望的进攻）但非故意（手未向球移动）→点球且无需红黄牌；故意手球破坏进球或明显得分机会→红牌。④手球队员紧接着进球无效，但队友随后进球有效（手球未立即获益的意外手球不判罚）。","offside":"统一尺度要点：①越位位置以头、躯干（不含手臂）更接近对方球门线为准。②越位犯规三种情形：干扰比赛（触球）、干扰对方队员（明显影响对方处理球能力、阻挡视线、争抢中影响守门员）、利用越位位置获利。③守方「有意触球」后才重置越位——受限触球（来不及调整身体的解围）、折射不算有意触球，不重置。④每次攻方新的触球后越位判定重新计算（越位重置）。⑤VAR越位划线：关键帧选择→有效身体部位选择→落线比对，任一环节错误划线结论即不成立。","penalty_area":"统一尺度要点：①罚球区内点球判罚三问：有无犯规动作（绊摔、推、拉、踢、冲撞）？接触是否达到草率以上？是否属正常争抢/意外接触？②守方先触球且动作合理、轻微接触不影响控球、攻方主动倒地夸大接触→不判点球。③罚球区线属于罚球区内；犯规地点需有清晰证据支持改判。④判罚点球本身不附带红黄牌，除非同时构成SPA、DOGSO或严重犯规。⑤VAR回看改判取消点球后，若球未出界应以坠球恢复（而非角球）。","freekick_foul":"统一尺度要点：直接任意球犯规（踢、绊、推、拉、冲撞、跳向、铲球）按「草率—鲁莽—过分用力」三档把握纪律尺度：草率犯规不出示牌；鲁莽犯规黄牌警告；过分用力危及对方安全为严重犯规红牌。以危险方式比赛（如争抢高球时抬脚过高危及对方）判间接任意球。","spa_tactical":"统一尺度要点：破坏有希望的进攻（SPA）→黄牌。判断要素：犯规地点与对方球门的距离、进攻方向、控球或控球可能性、防守队员人数与位置。拉扯、抱拽、背后冲撞、鲁莽冲撞破坏快攻/突破均属典型战术犯规。","dogso":"统一尺度要点：破坏明显进球得分机会（DOGSO）四要素：①犯规地点与球门距离；②进攻大致朝向球门；③控球或可争得控球；④防守队员人数与位置（通常含守门员在内仅一名防守队员时成立）。以争抢球为目的且判罚球点球→黄牌；否则红牌。守门员在罚球区外犯规破坏明显得分机会→红牌。拉扯、推搡同样可构成DOGSO。","sfp_vc":"统一尺度要点：①严重犯规（SFP）：争抢球中使用过分力量或野蛮方式危及对方安全——鞋钉蹬踹、直腿踩踏小腿跟腱、飞铲、抬脚触头等。②暴力行为（VC）：非争抢球时（或球不在可争抢范围时）击打、挥拳、肘击头面部；比赛停止时的攻击性行为同样可罚；「试图击打」即使未触及也属暴力行为。③挥臂接触但未达过分力量的，按鲁莽犯规黄牌处理。④轻微触碰面部示意对方起身，不构成暴力行为。","simulation":"统一尺度要点：佯装被犯规（假摔）、夸大接触程度、挑衅与欺骗行为→以非体育行为黄牌警告。接触轻微且未影响平衡的主动倒地，既不判对方犯规，也应警示佯装行为。","goal_decision":"统一尺度要点：①进球前提：球整体越过球门线，且进球前攻方无犯规（推搡、拉扯、冲撞守门员等）；裁判员鸣哨停止比赛后的进球无效。②有利条款：被犯规方即将形成明显进球得分机会时，必须掌握有利让进攻完成后再处理犯规——不可提前鸣哨剥夺进球机会；守门员犯规球即将进门时同样先掌握有利。③球出界（整体离开比赛场地）判定：助理裁判员应延迟举旗、裁判员延迟鸣哨，给VAR保留介入空间。","other_program":"统一尺度要点：①VAR介入原则：仅限清晰明显的错漏判以及严重事件（红牌、点球、进球、认错人）；VAR查看≠介入，介入的标志是裁判员做出「电视信号」手势；VAR介入后裁判员可不回看而直接采纳结论，但仍须做出电视手势。②裁判员选位跑位影响判罚质量，虽不构成改判依据，但应持续改进。③耳麦通讯受干扰时，对讲机等备用通讯设备的使用符合VAR操作要求。④球队官员在技术区域外实施暴力行为可被红牌罚令出场。"},"issueNotes":{},"verdictNames":{"wrong":"错漏判","correct":"支持原判","pending":"不予认定"},"varNames":{"correct":"VAR正确","wrong":"VAR错误","none":""},"built":"2026-09-25"};
const CATS = DATA.categories;
const VN = {wrong:"错漏判", correct:"支持原判", pending:"不予认定"};
const VICON = {wrong:"❌", correct:"✅", pending:"⚪"};
const VCLS = {wrong:"b-wrong", correct:"b-correct", pending:"b-pending"};
const bySeq = {};
DATA.cases.forEach(c => bySeq[c.seq] = c);
// 必须在applyFilter的自动选中改写hash之前捕获初始锚点
const initialHashSeq = (location.hash.match(/^#case-(\d+)$/)||[])[1];

// ---------- 收藏与笔记（localStorage 持久化，键按赛季隔离） ----------
const CFG = DATA.cfg;
const FAV_KEY = CFG.favKey, NOTE_KEY = CFG.noteKey;
const TAG_PRESETS = ["精选", "有疑问", "尺度标杆", "易错点", "课堂讨论"];
let fav = {}, notes = {};
try { fav = JSON.parse(localStorage.getItem(FAV_KEY) || "{}") || {}; } catch(_) { fav = {}; }
try { notes = JSON.parse(localStorage.getItem(NOTE_KEY) || "{}") || {}; } catch(_) { notes = {}; }
function persistFav() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(fav));
        localStorage.setItem(NOTE_KEY, JSON.stringify(notes)); } catch(_) {}
}
function isFav(seq) { return !!fav[seq]; }
function hasNote(seq) { return !!(notes[seq] && notes[seq].text && notes[seq].text.trim()); }
function crest(team, h) {
  const f = DATA.crests[team];
  return f ? `<img class="crest" style="height:${h}px" src="${f}" alt="">` : "";
}

// 预聚合搜索串
for (const c of DATA.cases) {
  const match = [c.comp, c.round, (c.home&&c.away)?`${c.home} VS ${c.away}`:"", c.minute?`第${c.minute}分钟`:""]
    .filter(Boolean).join(" · ");
  c.search = (match+" "+c.desc+" "+c.appeal+" "+c.conclusion+" "+(c.tags||[]).join(" ")).toLowerCase();
}

// ---------- 侧栏 ----------
const catCount = {}, catWrong = {};
for (const c of DATA.cases) {
  catCount[c.category] = (catCount[c.category]||0)+1;
  if (c.v==="wrong") catWrong[c.category] = (catWrong[c.category]||0)+1;
}
const verCount = {all:DATA.cases.length, wrong:0, correct:0, pending:0};
for (const c of DATA.cases) verCount[c.v]++;

document.getElementById("totalBadge").textContent =
  `${DATA.cases.length}例 · 错漏判${verCount.wrong} · 支持原判${verCount.correct}`;
const badge = document.getElementById("totalBadge");
badge.style.cursor = "pointer";
badge.title = "点击查看分类统计总表";
badge.onclick = ()=>openModal("modalStats");
document.getElementById("catList").innerHTML =
  `<button class="cat-item on" data-cat=""><span class="nm">全部分类</span><b>${DATA.cases.length}</b></button>` +
  CATS.filter(k=>catCount[k.id]).map(k=>
    `<button class="cat-item" data-cat="${k.id}"><span class="nm">${k.icon} ${k.name}</span>` +

// ---------- 状态与筛选 ----------
const state = {cat:"", v:"", issue:"", q:"", sel:null, vIdx:0, fav:null,
               comp:"", team:""};
const fSearch = document.getElementById("fSearch");

const COMP_ORDER = [["中超联赛","中超"],["中甲联赛","中甲"],["中乙联赛","中乙"],
                    ["女超联赛","女超"],["女甲联赛","女甲"],["中国足协杯","足协杯"],
                    ["全运会","全运会"],["三大球运动会","三大球"]];
const COMP_SHORT = Object.fromEntries(COMP_ORDER);
const teamComps = {};
for (const c of DATA.cases) {
  for (const t of new Set([c.home, c.away].filter(Boolean))) {
    (teamComps[t] = teamComps[t] || new Set()).add(c.comp);
  }
}
function teamBadge(t){
  return DATA.crests[t] ? `<img class="crest" style="height:18px" src="${DATA.crests[t]}" alt="">`
                        : `<span class="tav">${esc(t[0]||"?")}</span>`;
}

// 除 skip 维度外的全部筛选（用于分面计数；skip 可为字符串或数组）
function baseMatch(c, skip){
  skip = Array.isArray(skip) ? skip : (skip ? [skip] : []);
  const sk = k => skip.includes(k);
  if (!sk("cat") && state.cat && c.category!==state.cat) return false;
  if (!sk("v") && state.v && c.v!==state.v) return false;
  if (!sk("issue") && state.issue && String(c.issue)!==state.issue) return false;
  if (!sk("comp") && state.comp && c.comp!==state.comp) return false;
  if (!sk("team") && state.team && c.home!==state.team && c.away!==state.team) return false;
  if (!sk("fav")){
    if (state.fav==="all" && !isFav(c.seq)) return false;
    if (state.fav==="note" && !hasNote(c.seq)) return false;
    if (state.fav && state.fav.startsWith("tag:")) {
      const t = state.fav.slice(4);
      if (!(fav[c.seq] && (fav[c.seq].tags||[]).includes(t))) return false;
    }
  }
  if (!sk("q")){ const q=state.q.trim().toLowerCase(); if(q && !c.search.includes(q)) return false; }
  return true;
}

function visibleCases(){
  return DATA.cases.filter(c => baseMatch(c, null));
}

// ---------- 侧栏：赛事/球队/期数（计数随其他筛选联动） ----------
function renderSidebar(){
  document.getElementById("compList").innerHTML =
    `<button class="cat-item ${state.comp===""?"on":""}" data-comp=""><span class="nm">全部赛事</span><b>${DATA.cases.filter(c=>baseMatch(c,["comp","team"])).length}</b></button>` +
    COMP_ORDER.map(([full,short])=>{
      const n = DATA.cases.filter(c=>baseMatch(c,["comp","team"]) && c.comp===full).length;
      return {full, short, n};
    }).filter(x=>x.n>0 || state.comp===x.full)
      .map(x=>`<button class="cat-item ${state.comp===x.full?"on":""}" data-comp="${x.full}"><span class="nm">${x.short}</span><b>${x.n}</b></button>`).join("");
  const teams = {};
  for (const c of DATA.cases) {
    if (!baseMatch(c,"team")) continue;
    if (state.comp && c.comp!==state.comp) continue;
    for (const t of new Set([c.home,c.away].filter(Boolean))) teams[t]=(teams[t]||0)+1;
  }
  document.getElementById("teamList").innerHTML =
    Object.entries(teams).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([t,n])=>
      `<button class="cat-item ${state.team===t?"on":""}" data-team="${esc(t)}">${teamBadge(t)}<span class="nm">${esc(t)}</span><b>${n}</b></button>`).join("") ||
    `<div style="font-size:12.5px;color:var(--muted);padding:6px 8px">该赛事下无判例</div>`;
  document.getElementById("issueList").innerHTML =
    Array.from({length:CFG.issueCount},(_,k)=>k+1).map(i=>{
      const n = DATA.cases.filter(c=>baseMatch(c,"issue") && String(c.issue)===String(i)).length;
      return `<button class="cat-item ${String(state.issue)===String(i)?"on":""}" data-issue="${i}"><span class="nm">第${i}期</span><b>${n}</b></button>`;
    }).join("");
}

// ---------- 选中判例 ----------
function select(seq, scrollRow=true){
  const c = bySeq[seq]; if (!c) return;
  state.sel = seq;
  const iss = DATA.issues[c.issue];
  document.getElementById("detailEmpty").style.display = "none";
  document.getElementById("dcard").style.display = "block";
  const match = [c.comp, c.round, (c.home&&c.away)?`${c.home} VS ${c.away}`:"", c.minute?`第${c.minute}分钟`:""]
    .filter(Boolean).join(" · ");
  const matchHTML = match
    .replace(c.home, `${crest(c.home,22)}${esc(c.home)}`)
    .replace(c.away, `${crest(c.away,22)}${esc(c.away)}`);
  const varBadge = c.var==="none" ? "" :
    `<span class="badge b-var ${c.var==="wrong"?"bad":""}">VAR${c.var==="wrong"?"错误":"正确"}</span>`;
  document.getElementById("dHead").innerHTML =
    `<span class="cid">第${c.issue}期 · 判例${c.no}</span>
     <span class="badge ${VCLS[c.v]}">${VICON[c.v]} ${VN[c.v]}</span>${varBadge}
     <button class="favbtn ${isFav(c.seq)?"on":""}" id="favBtn" title="收藏该判例">${isFav(c.seq)?"★ 已收藏":"☆ 收藏"}</button>
     <h2 class="match">${matchHTML}</h2>`;
  renderFavUI(c);
  renderNoteUI(c);
  // 视频（唯一播放器，切换即替换）
  state.vIdx = 0;
  const vid = document.getElementById("dvid");
  try{ vid.pause(); }catch(_){}
  vid.src = "videos/" + c.videos[0];
  const vsr = document.getElementById("vswRow");
  if (c.videos.length > 1) {
    vsr.style.display = "flex";
    vsr.innerHTML = c.videos.map((f,i)=>
      `<button class="vsw ${i===0?"on":""}" data-i="${i}">${/-(2|3)\.mp4$/.test(f)&&i>0?"补充角度":"视频"+(i+1)}</button>`).join("");
  } else { vsr.style.display = "none"; vsr.innerHTML = ""; }
  document.getElementById("dNote").textContent =
    c.videos.length>1 ? "同判例存在多个角度视频，可切换：" : "";
  // 正文
  document.getElementById("dText").innerHTML =
    `<p>${esc(c.desc.replace(/^判例[一二三四五六七八九十百]+[：:]/,"").trim())}</p>` +
    (c.appeal?`<p><span class="lbl">申诉意见：</span>${esc(c.appeal.replace(/^[^：]*申诉意见认为：/,"").trim())}</p>`:"") +
    `<p class="concl"><span class="lbl">评议组认定：</span>${esc(c.conclusion
      .replace(/^对于此判[例罚]，评议组[^：]*认为：/,"").trim())}</p>`;
  const catMeta = CATS.find(k=>k.id===c.category);
  document.getElementById("dCatNote").querySelector("summary").textContent =
    `📏 ${catMeta ? catMeta.name : ""} · 统一尺度要点`;
  document.getElementById("dCatNote").querySelector("div").textContent =
    DATA.notes[c.category] || "";
  document.getElementById("dTags").innerHTML =
    (c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  document.getElementById("dFoot").innerHTML =
    `来源：<a href="${iss.url}" target="_blank" rel="noopener">${esc(iss.title)}</a>（${iss.date.slice(0,4)}-${iss.date.slice(4,6)}-${iss.date.slice(6,8)}发布）`;
  document.getElementById("detail").scrollTop = 0;
  // 列表高亮
  document.querySelectorAll(".prow.sel").forEach(e=>e.classList.remove("sel"));
  const row = document.querySelector(`.prow[data-seq="${seq}"]`);
  if (row && scrollRow) row.scrollIntoView({block:"nearest"});
  if (row) row.classList.add("sel");
  history.replaceState(null, "", "#case-"+seq);
}

function step(dir){
  const list = visibleCases();
  if (!list.length) return;
  let i = list.findIndex(c=>c.seq===state.sel);
  i = i<0 ? 0 : Math.min(list.length-1, Math.max(0, i+dir));
  select(list[i].seq);
}

// ---------- 收藏与笔记 ----------
function toggleFav(seq){
  const c = bySeq[seq]; if(!c) return;
  if (isFav(seq)) delete fav[seq];
  else fav[seq] = {tags: [], ts: Date.now()};
  persistFav();
  renderFavUI(c); renderFavList();
  const row = document.querySelector(`.prow[data-seq="${seq}"] .pmark`);
  if (row) row.textContent = (isFav(seq)?"★":"") + (hasNote(seq)?"📝":"");
}
function renderFavUI(c){
  const btn = document.getElementById("favBtn");
  if (!btn) return;
  btn.classList.toggle("on", isFav(c.seq));
  btn.innerHTML = isFav(c.seq) ? "★ 已收藏" : "☆ 收藏";
  const box = document.getElementById("favTags");
  if (!isFav(c.seq)) { box.style.display = "none"; return; }
  box.style.display = "flex";
  const cur = (fav[c.seq].tags||[]);
  const customs = cur.filter(t=>!TAG_PRESETS.includes(t));
  box.innerHTML =
    `<span style="font-size:13px;color:var(--muted)">收藏标签:</span>` +
    TAG_PRESETS.map(t=>`<span class="ftag ${cur.includes(t)?"on":""}" data-tag="${t}">${t}</span>`).join("") +
    customs.map(t=>`<span class="ftag on" data-tag="${esc(t)}">${esc(t)} <b data-del="${esc(t)}" style="cursor:pointer">✕</b></span>`).join("") +
    `<input id="customTag" placeholder="自定义标签"><button class="ftag" id="addTag">添加</button>`;
}
document.getElementById("favTags").addEventListener("click", e=>{
  const del = e.target.closest("[data-del]");
  if (del) {
    const c = bySeq[state.sel]; if(!c) return;
    const arr = fav[c.seq]?.tags || [];
    fav[c.seq].tags = arr.filter(t=>t!==del.dataset.del);
    persistFav(); renderFavUI(c); renderFavList();
    return;
  }
  if (e.target.id === "addTag") {
    const c = bySeq[state.sel]; if(!c) return;
    const inp = document.getElementById("customTag");
    const t = (inp.value||"").trim();
    if (!t) return;
    if (!fav[c.seq]) fav[c.seq] = {tags:[], ts:Date.now()};
    fav[c.seq].tags = fav[c.seq].tags||[];
    if (!fav[c.seq].tags.includes(t)) fav[c.seq].tags.push(t);
    persistFav(); renderFavUI(c); renderFavList();
    return;
  }
  const chip = e.target.closest(".ftag[data-tag]");
  if (chip) {
    const c = bySeq[state.sel]; if(!c) return;
    if (!fav[c.seq]) fav[c.seq] = {tags:[], ts:Date.now()};
    fav[c.seq].tags = fav[c.seq].tags||[];
    const t = chip.dataset.tag;
    if (fav[c.seq].tags.includes(t)) fav[c.seq].tags = fav[c.seq].tags.filter(x=>x!==t);
    else fav[c.seq].tags.push(t);
    persistFav(); renderFavUI(c); renderFavList();
  }
});

function renderNoteUI(c){
  const wrap = document.getElementById("noteWrap");
  wrap.style.display = "block";
  document.getElementById("noteBox").value = (notes[c.seq]&&notes[c.seq].text)||"";

let noteTimer = null;
document.getElementById("noteBox").addEventListener("input", ()=>{
  const seq = state.sel; if(!seq) return;
  document.getElementById("noteStatus").textContent = "正在保存…";
  clearTimeout(noteTimer);
  noteTimer = setTimeout(()=>{
    const t = document.getElementById("noteBox").value;
    if (t.trim()) notes[seq] = {text: t, ts: Date.now()};
    else delete notes[seq];
    persistFav();
    const d = new Date();
    document.getElementById("noteStatus").textContent =
      "已保存 " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    renderFavList();
    const row = document.querySelector(`.prow[data-seq="${seq}"] .pmark`);
    if (row) row.textContent = (isFav(seq)?"★":"") + (hasNote(seq)?"📝":"");

function renderFavList(){
  const tags = {};
  for (const f of Object.values(fav)) for (const t of (f.tags||[])) tags[t]=(tags[t]||0)+1;
  const nAll = Object.keys(fav).length;
  const nNote = Object.values(notes).filter(n=>n.text&&n.text.trim()).length;
  const cur = state.fav;
  const item = (val, label, n) =>
    `<button class="ver-item ${cur===val?"on":""}" data-fav="${val}"><span class="nm">${label}</span><b>${n}</b></button>`;
  let h = item("all", "★ 全部收藏", nAll) + item("note", "📝 有笔记", nNote);
  for (const t of TAG_PRESETS) h += item("tag:"+t, t, tags[t]||0);
  for (const t of Object.keys(tags)) if (!TAG_PRESETS.includes(t)) h += item("tag:"+t, t, tags[t]);
  document.getElementById("favList").innerHTML = nAll||nNote ? h :
    `<div style="font-size:12.5px;color:var(--muted);padding:4px 10px">暂无收藏——在详情区点「☆ 收藏」试试</div>`;
}

  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);

          r=list.filter(c=>(c.tags||[]).includes("红牌")).length,
          pen=list.filter(c=>(c.tags||[]).includes("点球")).length;
    sW+=w;sG+=g;sP+=p;sV+=vw;sR+=r;sPen+=pen;
    rows += `<tr><td>${k.icon} ${k.name}</td><td class="w">${w}</td><td class="g">${g}</td>
      <td class="p">${p}</td><td>${list.length}</td><td>${vw}</td><td>${r}</td><td>${pen}</td></tr>`;
  }
  document.getElementById("mxBody").innerHTML = rows;
  document.getElementById("mxFoot").innerHTML =
    `<tr><td>合计</td><td class="w">${sW}</td><td class="g">${sG}</td><td class="p">${sP}</td>
     <td>${sW+sG+sP}</td><td>${sV}</td><td>${sR}</td><td>${sPen}</td></tr>`;
}

// ---------- 说明弹层 ----------
{
  const issNotes = Object.entries(DATA.issueNotes)
    .map(([k,v])=>`第${k}期：${v.replace(/。$/,"")}`).join("；");

// ---------- 初始化 ----------
applyFilter();
{ // 支持 #case-N 锚点（来自 stats.html 的跳转或刷新恢复）
  const target = initialHashSeq ? bySeq[+initialHashSeq] : null;
  if (target && !visibleCases().some(x=>x.seq===target.seq)) {
    // 目标判例被当前筛选挡住时，清空各筛选（锚点跳转优先）
    state.cat = target.category; state.v = ""; state.issue = ""; state.q = "";
    state.comp = ""; state.team = "";
    fSearch.value = "";
    document.querySelectorAll(".cat-item").forEach(x=>
      x.classList.toggle("on", x.dataset.cat===target.category));
    document.querySelectorAll(".ver-item").forEach(x=>
      x.classList.toggle("on", x.dataset.v===""));
    applyFilter();
  }
  const list = visibleCases();
  if (target && bySeq[target.seq]) {
    select(target.seq);
    const row = document.querySelector(`.prow[data-seq="${target.seq}"]`);
    if (row) row.scrollIntoView({block:"center"});
  } else if (list.length) {
    select(list[0].seq, false);
  }
}
// 同文档hash变化（如页面内跳转/前进后退）时同步选中
window.addEventListener("hashchange", () => {
  const m = location.hash.match(/^#case-(\d+)$/);
  if (m && bySeq[+m[1]] && state.sel !== +m[1]) select(+m[1]);
});
</script>
