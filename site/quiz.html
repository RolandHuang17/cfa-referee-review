省女足","away":"长春大众卓越女足","minute":"83","desc":"判例八：女超联赛第3轮，广东省女足VS长春大众卓越女足，比赛第83分钟，疑似处于越位位置的长春大众卓越女足10号队员在对方球门区附近接队友传球，后传球助攻队友得分。裁判员判进球有效。","appeal":"","concl":"对于此判例，评议组一致认为：长春大众卓越女足传中后，球被守方广东省女足队员触及，该队员在处理此空中球时，没有时间调整身体动作，属于受限的触球，依照规则第十一章，不属于守方有意触球的情况。裁判员和助理裁判员认为攻方传球后守方队员主动触球，因此判长春大众卓越10号不是越位犯规，后续进球有效，该决定错误。应判长春大众卓越10号在越位位置获利，越位犯规，后续进球无效。","v":"wrong","videos":["2025/i03c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250319/1742376828438624.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-14","t":"case","s":"2025","issue":4,"no":1,"seq":14,"comp":"中乙联赛","round":"第1轮","home":"北京理工","away":"无锡吴钩","minute":"","desc":"判例一：中乙联赛第1轮，北京理工VS无锡吴钩，比赛第90+1分钟，北京理工18号队员和10号队员先后在对方罚球区内倒地，裁判员均未判罚犯规。","appeal":"","concl":"对于此判例，评议组首先一致认为：在北京理工18号与对方队员的接触中，无锡吴钩防守队员更有机会触球，北京理工18号动作略晚，造成双方身体接触，双方均不犯规。之后北京理工10号与对方队员的接触，北京理工10号率先触球，无锡吴钩防守队员犯规，应判罚球点球。其次，评议组多数成员认为，该犯规不属于破坏对方明显进球得分机会的情况，在此情形下无需出示红黄牌。裁判员临场决定错误，漏判罚球点球。","v":"wrong","videos":["2025/i04c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250328/1743150335745525.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-15","t":"case","s":"2025","issue":4,"no":2,"seq":15,"comp":"女超联赛","round":"第4轮","home":"江苏无锡女足","away":"辽宁沈北禾丰女足","minute":"50","desc":"判例二：女超联赛第4轮，江苏无锡女足VS辽宁沈北禾丰女足，比赛第50分钟，江苏无锡女足12号队员带球至对方罚球区内，辽宁沈北禾丰女足20号队员上前争抢，江苏无锡女足12号倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：江苏无锡女足12号带球进入对方罚球区后，试图传球或射门时，辽宁沈北禾丰女足20号从背后对其冲撞接触其左腿，属于草率的犯规，应判罚球点球。另外，该犯规不属于破坏对方明显进球得分机会的情况，在此情形下无需出示红黄牌。裁判员临场决定错误，漏判罚球点球。","v":"wrong","videos":["2025/i04c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250328/1743150372958908.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-16","t":"case","s":"2025","issue":5,"no":1,"seq":16,"comp":"中甲联赛","round":"第2轮","home":"南通支云","away":"石家庄功夫","minute":"48","desc":"判例一：中甲联赛第2轮，南通支云VS石家庄功夫，比赛第48分钟，南通支云9号队员前插至对方罚球区附近，石家庄功夫36号队员在其身后与其有身体接触，南通支云9号倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：石家庄功夫36号双手拉扯南通支云9号并造成其倒地，应视为犯规。该拉扯犯规动作结束在罚球区内，应判罚球点球。同时，该犯规属于通过拉扯和拉拽的方式破坏对方明显的进球得分机会，应向石家庄功夫36号出示红牌罚令出场。裁判员决定错误，漏判罚球点球和红牌。","v":"wrong","videos":["2025/i05c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250402/1743602157329905.mp4"],"cat":"dogso","catname":"破坏明显进球得分机会（DOGSO）","ans":{"r":"penalty","c":"red"}},{"k":"2025-17","t":"case","s":"2025","issue":5,"no":2,"seq":17,"comp":"中甲联赛","round":"第2轮","home":"陕西联合","away":"定南赣联","minute":"","desc":"判例二：中甲联赛第2轮，陕西联合月亮泊VS定南赣联，比赛第45+1分钟，陕西联合月亮泊踢前场右侧任意球，球传至对方罚球区内，疑似与对方队员手臂或身体部位有接触，随后陕西联合月亮泊队进球，裁判员判罚进球有效，未判罚手球犯规。","appeal":"","concl":"对于此判例，评议组一致认为：通过现有视频，无法确定球接触了进攻队员手臂，裁判员做出的进球有效的决定应予支持。","v":"correct","videos":["2025/i05c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250402/1743602224817043.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-18","t":"case","s":"2025","issue":5,"no":3,"seq":18,"comp":"中甲联赛","round":"第2轮","home":"陕西联合","away":"定南赣联","minute":"49","desc":"判例三：中甲联赛第2轮，陕西联合月亮泊VS定南赣联，比赛第49分钟，陕西联合月亮泊从右侧进攻，球传至对方罚球区内，陕西联合月亮泊38号队员进球，助理裁判员未示意越位，裁判员判进球有效。","appeal":"","concl":"对于此判例，评议组一致认为：视频中无法证明陕西联合月亮泊在右路传中时其18号或38号队员处于越位位置，助理裁判员当时的位置较好，应能准确判断场上情形。因此，助理裁判员未示意陕西联合月亮泊球员越位，以及裁判员做出的进球有效的决定，应予支持。","v":"correct","videos":["2025/i05c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250402/1743602302424238.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-19","t":"case","s":"2025","issue":5,"no":4,"seq":19,"comp":"中甲联赛","round":"第2轮","home":"陕西联合","away":"定南赣联","minute":"55","desc":"判例四：中甲联赛第2轮，陕西联合月亮泊VS定南赣联，比赛第55分钟，定南赣联进攻中从右侧将球传至对方罚球区内，守方陕西联合月亮泊27号队员将球踢到对方18号队员身体后，球疑似反弹接触陕西联合月亮泊27号手臂。裁判员未判罚手球犯规。","appeal":"","concl":"对于此判例，评议组一致认为：陕西联合月亮泊27号试图解围，球踢出后从近距离处的对方队员反弹回来碰到自己，当时其手臂处于合理和自然的位置，不应视为手球犯规。裁判员决定正确。","v":"correct","videos":["2025/i05c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250402/1743602339512623.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2025-20","t":"case","s":"2025","issue":5,"no":5,"seq":20,"comp":"中甲联赛","round":"第2轮","home":"佛山南狮","away":"苏州东吴","minute":"4","desc":"判例五：中甲联赛第2轮，佛山南狮VS苏州东吴，比赛第4分钟，佛山南狮7号队员在对方罚球区内踢球，球接触守方苏州东吴26号队员手臂。裁判员未判罚手球犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：苏州东吴26号面向对方进攻队员，手臂从自然位置移动到使身体不自然扩大的位置，并被来球触及，应判罚手球犯规和罚球点球。另外该手球犯规不属于故意手球，在阻止了对方有希望的进攻并被判罚球点球的情形下，按照竞赛规则，无需出示红黄牌。裁判员决定错误，漏判手球犯规和罚球点球。","v":"wrong","videos":["2025/i05c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250402/1743602412478682.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2025-21","t":"case","s":"2025","issue":5,"no":6,"seq":21,"comp":"中乙联赛","round":"第2轮","home":"广东铭途","away":"成都蓉城B队","minute":"10","desc":"判例六：中乙联赛第2轮，广东铭途VS成都蓉城B队，比赛第10分钟，广东铭途56号队员在本方罚球区内用脚解围时疑似与成都蓉城B队22号队员有接触，裁判员判广东铭途56号犯规，并判罚球点球。","appeal":"","concl":"对于此判例，评议组多数成员认为：双方争抢时，球处于足球比赛中可以用头争抢和触及的高度。成都蓉城B队22号使用头球争抢，动作合理。广东铭途56号在此情况下使用脚踢球的方式争抢属于违规。该判例中裁判员观察位置较好，应可看清接触，支持裁判员做出的罚球点球的决定。","v":"correct","videos":["2025/i05c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250402/1743602475942445.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-22","t":"case","s":"2025","issue":5,"no":7,"seq":22,"comp":"中乙联赛","round":"第2轮","home":"广东铭途","away":"成都蓉城B队","minute":"56","desc":"判例七：中乙联赛第2轮，广东铭途VS成都蓉城B队，比赛第56分钟，成都蓉城B队28号队员与广东铭途队员争抢球后，广东铭途队员倒地，裁判员未判罚犯规，成都蓉城B队继续进攻并取得进球，裁判员判进球有效。","appeal":"","concl":"对于此判例，评议组多数成员认为：成都蓉城B队28号与对方队员的争抢应被判罚犯规。成都蓉城B队通过此次争抢获得球权，进攻并获得进球，应属无效。裁判员做出的进球有效的决定错误，漏判攻方犯规。","v":"wrong","videos":["2025/i05c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250402/1743602544608101.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-23","t":"case","s":"2025","issue":5,"no":8,"seq":23,"comp":"全运会","round":"","home":"陕西女足","away":"福建女足","minute":"24","desc":"判例八：全运会女子U18组资格赛D组漳州赛区，陕西女足VS福建女足，比赛第24分钟，福建女足12号队员在对方罚球区内接球，陕西女足28号队员上前争抢，双方队员有身体接触，福建女足12号倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：从现有视频上看守方陕西女足28号上抢动作属于合理的身体接触，也无其他附加犯规动作。裁判员做出的不犯规的决定，应予支持。","v":"correct","videos":["2025/i05c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250402/1743602576274482.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-24","t":"case","s":"2025","issue":5,"no":9,"seq":24,"comp":"全运会","round":"","home":"陕西女足","away":"福建女足","minute":"76","desc":"判例九：全运会女子U18组资格赛D组漳州赛区，陕西女足VS福建女足，比赛第76分钟，陕西女足11号队员带球突破至对方罚球区内，福建女足11号、2号队员上前争抢，双方队员有身体接触，陕西女足11号队员倒地，裁判员判守方福建女足11号犯规，并判罚球点球。","appeal":"","concl":"对于此判例，评议组多数成员认为：守方福建女足11号在争抢中右腿绊摔陕西女足11号，造成后者倒地，属于草率犯规，裁判员判罚福建女足11号犯规以及罚球点球的决定正确。","v":"correct","videos":["2025/i05c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250402/1743602614991461.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-25","t":"case","s":"2025","issue":6,"no":1,"seq":25,"comp":"中超联赛","round":"第4轮","home":"长春亚泰","away":"武汉三镇","minute":"34","desc":"判例一：中超联赛第4轮，长春亚泰VS武汉三镇，比赛第34分钟，武汉三镇9号队员在对方罚球区内与长春亚泰4号队员发生接触后倒地，裁判员未判罚犯规，VAR未介入。","appeal":"","concl":"对于此判例，评议组多数成员认为：从传球路线和双方队员身位来看，武汉三镇9号更有机会触球射门，长春亚泰4号在其身后推搡造成武汉三镇9号动作受限，身体失去平衡倒地，应判长春亚泰4号在本方罚球区内推搡犯规，并且破坏对方明显进球得分机会，判罚球点球，并向长春亚泰4号出示红牌罚令出场，VAR应介入。裁判员决定错误，漏判罚球点球、红牌，VAR未介入错误。","v":"wrong","videos":["2025/i06c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250409/1744201692458101.mp4"],"cat":"dogso","catname":"破坏明显进球得分机会（DOGSO）","ans":{"r":"penalty","c":"red"}},{"k":"2025-26","t":"case","s":"2025","issue":6,"no":2,"seq":26,"comp":"中超联赛","round":"第4轮","home":"长春亚泰","away":"武汉三镇","minute":"79","desc":"判例二：中超联赛第4轮，长春亚泰VS武汉三镇，比赛第79分钟，武汉三镇8号队员在对方罚球区内与长春亚泰15号队员发生接触后倒地，裁判员未判罚犯规，VAR未介入。","appeal":"","concl":"对于此判例，评议组多数成员认为：双方腿部发生接触造成倒地，守方长春亚泰15号处于正常向球移动过程中，武汉三镇8号右腿进入对方跑动路线，造成接触，从接触情况和力度来看，属于正常身体接触。裁判员未判罚长春亚泰15号犯规的决定正确，VAR未介入正确。","v":"correct","videos":["2025/i06c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250409/1744201736570639.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-27","t":"case","s":"2025","issue":6,"no":3,"seq":27,"comp":"中超联赛","round":"第4轮","home":"长春亚泰","away":"武汉三镇","minute":"87","desc":"判例三：中超联赛第4轮，长春亚泰VS武汉三镇，比赛第87分钟，长春亚泰9号队员手臂与武汉三镇2号队员发生接触，裁判员未判罚犯规，VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：长春亚泰9号已经观察到对方队员位置，属于争抢球时有意地、不合理地使用手臂，但接触部位并非完全是肘部，也无清晰击打对方头面部的动作，不应出示红牌，应视为鲁莽犯规并予以黄牌警告。裁判员临场决定错误，漏判攻方犯规和黄牌；因不属于红牌事件，VAR未介入正确。","v":"wrong","videos":["2025/i06c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250409/1744201782732441.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"yellow"}},{"k":"2025-28","t":"case","s":"2025","issue":6,"no":4,"seq":28,"comp":"中超联赛","round":"第4轮","home":"长春亚泰","away":"武汉三镇","minute":"","desc":"判例四：中超联赛第4轮，长春亚泰VS武汉三镇，比赛第90+1分钟，双方争抢球，长春亚泰11号队员脚部与武汉三镇28号队员腿部发生接触，裁判员未判罚犯规，VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：长春亚泰11号踢球动作合理，触球清晰，踢球后腿部摆动正常，无附加犯规动作。武汉三镇28号在争抢中腿部进入对方脚部之下的位置，双方在触球后极短的时间内发生接触，属于意外和不可避免的接触，双方均不犯规。裁判员决定正确，VAR未介入正确。","v":"correct","videos":["2025/i06c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250409/1744201820967917.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-29","t":"case","s":"2025","issue":6,"no":5,"seq":29,"comp":"中超联赛","round":"第4轮","home":"上海申花","away":"云南玉昆","minute":"77","desc":"判例五：中超联赛第4轮，上海申花VS云南玉昆，比赛第77分钟，上海申花23号队员铲球后，脚部与云南玉昆14号队员腿部发生接触，裁判员未判罚犯规，VAR未介入。","appeal":"","concl":"对于此判罚，评议组一致认为：上海申花23号将球铲出后接触对方腿部，剐蹭对方小腿球袜及护腿板，其力度和接触程度不构成严重犯规，不应出示红牌，应视为鲁莽犯规并出示黄牌警告。裁判员临场决定错误，漏判犯规和黄牌；因不属于红牌事件，VAR未介入正确。","v":"wrong","videos":["2025/i06c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250409/1744201873677432.mp4"],"cat":"freekick_foul","catname":"罚球区外一般犯规","ans":{"r":"directfk","c":"yellow"}},{"k":"2025-30","t":"case","s":"2025","issue":6,"no":6,"seq":30,"comp":"中超联赛","round":"第5轮","home":"上海海港","away":"上海申花","minute":"82","desc":"判例六：中超联赛第5轮，上海海港VS上海申花，比赛第82分钟，上海申花20号队员进球，裁判员判进球有效；VAR查看进球事件，经越位划线后确认进球有效。","appeal":"","concl":"对于此判例，评议组一致认为：在查看该进球时，VAR对于攻方传球或触球一瞬间关键帧的选择准确。之后在对双方队员进行划线判定时，身体部位选择正确，划线判断结果正确。根据竞赛规则和VAR操作规范，当双方队员划线重合或守方倒数第二名队员更接近于本方球门线时，均视为攻方队员不处于越位位置。此判例中VAR操作流程符合规范，操作方法和结果均正确。针对划线画面与球员传球或触球一瞬间是否同步的社会关切，评议组做出说明：在VAR选择传球或触球一瞬间关键帧后，会切换到适合划线的画面，此过程中各个角度和机位的画面严格同步，不会改变所选关键帧。此为VAR系统的基本条件和基本功能，中超联赛使用的VAR系统在每场比赛赛前，都会进行各个机位和画面的同步测试，确认无误后才会开始比赛。此判例裁判员决定正确，VAR操作正确。","v":"correct","videos":["2025/i06c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250409/1744202003417904.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-31","t":"case","s":"2025","issue":6,"no":7,"seq":31,"comp":"中乙联赛","round":"第3轮","home":"兰州陇原竞技","away":"山东泰山B队","minute":"63","desc":"判例七：中乙联赛第3轮，兰州陇原竞技VS山东泰山B队，比赛第63分钟，兰州陇原竞技前场掷界外球至对方罚球区内，双方队员争抢后兰州陇原竞技队员倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：从现有单一机位视频看，山东泰山B队两名防守队员包夹防守对方队员，其中内侧的防守队员有可能触到了球，攻方队员的倒地有可能与内外侧两名防守队员的接触有关，但从现有视频判断不足以构成犯规。支持裁判员做出的不犯规的判罚决定。","v":"correct","videos":["2025/i06c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250409/1744202048249679.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-32","t":"case","s":"2025","issue":6,"no":8,"seq":32,"comp":"中乙联赛","round":"第3轮","home":"泰安天贶","away":"长春喜都","minute":"33","desc":"判例八：中乙联赛第3轮，泰安天贶VS长春喜都，比赛第33分钟，泰安天贶进攻传中，9号队员在对方罚球区内头顶球，长春喜都8号队员脚踢球，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：在双方争抢时，球的高度已经处于可以用脚争抢的合理高度，从现有视频上看长春喜都8号踢球时脚未踢到泰安天贶9号头部，并且踢球后立即收腿，无附加犯规动作。支持裁判员做出的不犯规的决定。","v":"correct","videos":["2025/i06c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250409/1744202089122713.mp4"],"cat":"freekick_foul","catname":"罚球区外一般犯规","ans":{"r":"playon","c":"none"}},{"k":"2025-33","t":"case","s":"2025","issue":7,"no":1,"seq":33,"comp":"中甲联赛","round":"第4轮","home":"南京城市","away":"上海嘉定汇龙","minute":"","desc":"判例一：中甲联赛第4轮，南京城市VS上海嘉定汇龙，比赛第45+1分钟，上海嘉定汇龙9号队员在对方罚球区内跳起争抢头球，手臂疑似接触南京城市18号队员，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组首先一致认为：上海嘉定汇龙9号的动作不属于严重犯规或暴力行为，不应出示红牌。其次评议组多数成员认为：上海嘉定汇龙9号起跳争抢头球并且触到球，手臂伴随动作正常。现有视频无法证明其手臂有不合理的摆动，也无法看清其手臂与对方头面部的接触情况。支持裁判员做出的不犯规的决定。","v":"correct","videos":["2025/i07c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250416/1744810303497173.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"playon","c":"none"}},{"k":"2025-34","t":"case","s":"2025","issue":7,"no":2,"seq":34,"comp":"中甲联赛","round":"第4轮","home":"南京城市","away":"上海嘉定汇龙","minute":"78","desc":"判例二：中甲联赛第4轮，南京城市VS上海嘉定汇龙，比赛第78分钟，上海嘉定汇龙在前场右侧踢任意球，球传至南京城市罚球区前沿，上海嘉定汇龙9号队员争抢头球，手臂疑似接触南京城市24号队员，裁判员判上海嘉定汇龙9号犯规并出示黄牌警告。","appeal":"","concl":"对于此判例，评议组一致认为：上海嘉定汇龙9号争抢头球时，不合理使用手臂，触及对方，应视为鲁莽犯规并出示黄牌警告。其行为并非将手肘作为武器有意击打对方头面部，不应出示红牌。裁判员判罚上海嘉定汇龙9号犯规并出示黄牌警告的决定正确。","v":"correct","videos":["2025/i07c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250416/1744810354220065.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2025-35","t":"case","s":"2025","issue":7,"no":3,"seq":35,"comp":"中甲联赛","round":"第4轮","home":"南京城市","away":"上海嘉定汇龙","minute":"","desc":"判例三：中甲联赛第4轮，南京城市VS上海嘉定汇龙，比赛第90+3分钟，南京城市进攻中在对方罚球区内传中，球疑似接触上海嘉定汇龙14号队员手臂后出球门线，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：视频中看不清球与上海嘉定汇龙14号具体的接触情况，但上海嘉定汇龙14号触球时其手臂位置未使身体不自然变大，不应视为手球犯规。裁判员未判罚犯规的决定正确。","v":"correct","videos":["2025/i07c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250416/1744810409420518.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2025-36","t":"case","s":"2025","issue":7,"no":4,"seq":36,"comp":"中甲联赛","round":"第4轮","home":"南京城市","away":"上海嘉定汇龙","minute":"35","desc":"判例四：中甲联赛第4轮，南京城市VS上海嘉定汇龙，比赛第35分钟，上海嘉定汇龙22号队员在对方罚球区内疑似与南京城市4号队员接触后倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：上海嘉定汇龙22号先触到球，之后南京城市4号踩到其脚部，属于草率犯规，应判罚球点球，无需出示红黄牌。裁判员决定错误，漏判守方犯规和罚球点球。","v":"wrong","videos":["2025/i07c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250416/1744810438826791.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-37","t":"case","s":"2025","issue":7,"no":5,"seq":37,"comp":"中乙联赛","round":"第4轮","home":"山东泰山B队","away":"无锡吴钩","minute":"16","desc":"判例五：中乙联赛第4轮，山东泰山B队VS无锡吴钩，比赛第16分钟，山东泰山B队踢角球。经双方争抢后山东泰山B队再次传中，同队队员头球进球。第二助理裁判员举旗示意越位，裁判员在进球前鸣哨判罚越位犯规，进球无效。","appeal":"","concl":"对于此判例，评议组一致认为：山东泰山B队角球发出后，其57号队员触球时，同队队员处于越位位置，而后守方无锡吴钩10号队员触球，该触球属于受限的动作，按照规则第十一章有关条款，不应视为守方有意触球。因此，山东泰山B队先前处于越位位置的队员再次传中，仍属于在越位位置获利的越位犯规。助理裁判员举旗示意越位，以及裁判员判攻方越位犯规、进球无效的决定均正确。","v":"correct","videos":["2025/i07c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250416/1744810494739531.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-38","t":"case","s":"2025","issue":7,"no":6,"seq":38,"comp":"中乙联赛","round":"第4轮","home":"山东泰山B队","away":"无锡吴钩","minute":"80","desc":"判例六：中乙联赛第4轮，山东泰山B队VS无锡吴钩，比赛第80分钟，山东泰山B队进攻中传中，双方队员在无锡吴钩罚球区内疑似有接触后倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：山东泰山B队传中后，双方队员在罚球区内均有争抢球的机会，但均未争抢到球。守方无锡吴钩队员的身位略占优，且无犯规动作。裁判员未判罚犯规的决定正确。","v":"correct","videos":["2025/i07c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250416/1744810533371090.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-39","t":"case","s":"2025","issue":7,"no":7,"seq":39,"comp":"中乙联赛","round":"第4轮","home":"山东泰山B队","away":"无锡吴钩","minute":"","desc":"判例七：中乙联赛第4轮，山东泰山B队VS无锡吴钩，比赛第90+6分钟，山东泰山B队64号队员在对方罚球区内倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：双方争抢位置时的身体接触正常，并非造成山东泰山B队64号倒地的原因。山东泰山B队64号有借助接触主动倒地的成分，守方无锡吴钩队员无犯规动作。裁判员未判罚犯规的决定正确。","v":"correct","videos":["2025/i07c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250416/1744810573933505.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-40","t":"case","s":"2025","issue":7,"no":8,"seq":40,"comp":"中乙联赛","round":"第4轮","home":"广西恒宸","away":"成都蓉城B队","minute":"57","desc":"判例八：中乙联赛第4轮，广西恒宸VS成都蓉城B队，比赛第57分钟，成都蓉城B队58号队员带球突破至对方罚球区内，广西恒宸33号队员疑似拉扯成都蓉城B队58号球衣，后者倒地，裁判未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：成都蓉城B队58号带球突破时，身位明显占优并可控制球，广西恒宸33号对其进行拉扯的行为清晰明确，力度足以造成其失去控球权并倒地。应判罚广西恒宸33号犯规和罚球点球，无需出示红黄牌。裁判员决定错误，漏判守方犯规和罚球点球。","v":"wrong","videos":["2025/i07c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250416/1744810626398021.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-41","t":"case","s":"2025","issue":8,"no":1,"seq":41,"comp":"中超联赛","round":"第8轮","home":"青岛西海岸","away":"大连英博","minute":"57","desc":"判例一：中超联赛第8轮，青岛西海岸VS大连英博，比赛第57分钟，青岛西海岸队进攻中获得罚球点球。对方申诉攻方犯规在先，当时青岛西海岸11号队员与大连英博38号队员争抢，双方倒地，裁判员未判罚犯规。VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：按照竞赛规则和VAR操作手册，青岛西海岸11号的争抢并未影响大连英博38号头顶球动作，双方属于比赛中争抢球时的正常接触，双方均不犯规。之后青岛西海岸队进攻并获得罚球点球，裁判员决定正确，VAR未介入正确。","v":"correct","videos":["2025/i08c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250423/1745409210805602.mov"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-42","t":"case","s":"2025","issue":8,"no":2,"seq":42,"comp":"中超联赛","round":"第8轮","home":"北京国安","away":"山东泰山","minute":"37","desc":"判例二：中超联赛第8轮，北京国安VS山东泰山，比赛第37分钟，山东泰山队19号队员在争抢中脚部接触北京国安27号队员腿部。裁判员判山东泰山19号犯规并出示红牌将其罚令出场，VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：山东泰山19号采用不合理的争抢动作，使用脚底蹬踩对方队员脚踝至跟腱部位，力量和强度较大，造成对方队员踝关节变形，危及对方队员安全，应视为严重犯规并出示红牌罚令出场。裁判员决定正确，VAR未介入正确。","v":"correct","videos":["2025/i08c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250423/1745409236969096.mov"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"red"}},{"k":"2025-43","t":"case","s":"2025","issue":8,"no":3,"seq":43,"comp":"中超联赛","round":"第8轮","home":"上海申花","away":"武汉三镇","minute":"65","desc":"判例三：中超联赛第8轮，上海申花VS武汉三镇，比赛第65分钟，武汉三镇队进球，助理裁判示意越位；裁判员判武汉三镇队越位犯规在先，进球无效；VAR检查并划线后，确认越位。","appeal":"","concl":"对于此判例，评议组一致认为：VAR在进行越位位置查看过程中，攻方触球关键帧选择正确；在划线时，选择攻方队员的肩部、守方队员的膝部，部位选择正确，划线落位正确。VAR整个操作过程符合规范，判断结果正确。裁判员判武汉三镇队越位犯规在先、进球无效的决定正确。","v":"correct","videos":["2025/i08c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250423/1745409310298485.mov"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-44","t":"case","s":"2025","issue":8,"no":4,"seq":44,"comp":"中国足协杯","round":"第2轮","home":"重庆春蕾","away":"广州豹","minute":"16","desc":"判例四：中国足协杯赛第2轮，重庆春蕾VS广东广州豹，比赛第16分钟，广东广州豹队守门员出击并与对方进攻队员发生接触，裁判员判广东广州豹队守门员犯规并出示红牌罚令出场。","appeal":"","concl":"对于此判例，评议组多数成员认为：广东广州豹守门员以鲁莽的方式冲撞对方进攻队员。重庆春蕾进攻队员无犯规动作。重庆春蕾进攻队员完成挑球后，从控球可能性、广东广州豹防守队员人数及位置等因素考虑，不属于明显进球得分机会，无需向广东广州豹守门员出示红牌，应以阻止对方有希望的进攻为由，判广东广州豹守门员犯规并出示黄牌警告。裁判员出示红牌的决定错误。","v":"wrong","videos":["2025/i08c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250423/1745409358548703.mov"],"cat":"spa_tactical","catname":"战术犯规与SPA","ans":{"r":"directfk","c":"none"}},{"k":"2025-45","t":"case","s":"2025","issue":9,"no":1,"seq":45,"comp":"中超联赛","round":"第8轮","home":"上海海港","away":"成都蓉城","minute":"8","desc":"判例一：中超联赛第8轮，上海海港VS成都蓉城，比赛第8分钟，上海海港13号队员争抢球时踩踏到成都蓉城2号队员，裁判员判罚上海海港13号犯规，并出示黄牌。VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：上海海港13号队员在争抢球中使用鞋底踩踏到对方队员脚踝部位，犯规力度和强度中等，应视为鲁莽犯规并出示黄牌警告。裁判员决定正确，VAR未介入正确。","v":"correct","videos":["2025/i09c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250501/1746070918868143.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2025-46","t":"case","s":"2025","issue":9,"no":2,"seq":46,"comp":"中超联赛","round":"第8轮","home":"上海海港","away":"成都蓉城","minute":"28","desc":"判例二：中超联赛第8轮，上海海港VS成都蓉城，比赛第28分钟，上海海港40号队员倒地铲抢接触到成都蓉城9号队员，裁判员判罚上海海港40号犯规，并出示黄牌。VAR未介入。","appeal":"","concl":"对于此判例，评议组多数成员认为：上海上港40号争抢时铲球动作速度力量较大且未触球，但未明显蹬踹到对方队员，双方主要接触为腿部的冲撞，应视为鲁莽犯规并出示黄牌警告。裁判员决定正确，VAR未介入正确。","v":"correct","videos":["2025/i09c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250501/1746070952182869.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2025-47","t":"case","s":"2025","issue":9,"no":3,"seq":47,"comp":"中超联赛","round":"第9轮","home":"云南玉昆","away":"上海海港","minute":"15","desc":"判例三：中超联赛第9轮，云南玉昆VS上海海港，比赛第15分钟，云南玉昆进球，第一助理裁判员未判罚越位，裁判员初始决定为进球有效。VAR经检查并划线后，确认攻方处越位位置并进行介入，裁判员改判进球前云南玉昆25号越位犯规，进球无效。","appeal":"","concl":"对于此判例，评议组一致认为：VAR在进行越位位置查看过程中，攻方触球关键帧选择正确；但在划线中，在选择守方队员更靠近本方球门线的有效身体部位时，错误地把肘部作为划线的有效身体部位，造成越位划线偏差。在越位划线的操作流程中，VAR必须选择最适合划线的机位，选择正确的双方队员有效身体部位，并利用VAR系统功能，根据队员动作和身体姿态确定正确的落线位置，现场进行划线比对。此判例在VAR对有效身体部位的选择出现错误的情况下，评议组无法认定攻方队员是否处于越位位置，以及随后的进球是否有效。评议组只能判定VAR划线错误。\n另外，评议组作出说明：中超联赛使用的VAR系统功能中，仅有越位机位（该判例中VAR实际使用的机位）和球门线机位可进行划线，其他机位无法进行划线，因而VAR无法选择其他更好角度的机位进行划线。","v":"pending","videos":["2025/i09c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250501/1746071073480463.mp4"],"cat":"offside","catname":"越位"},{"k":"2025-48","t":"case","s":"2025","issue":9,"no":4,"seq":48,"comp":"中超联赛","round":"第7轮","home":"青岛西海岸","away":"山东泰山","minute":"60","desc":"判例四：中超第7轮，青岛西海岸VS山东泰山，比赛第60分钟，青岛西海岸56号队员脚部与山东泰山9号队员腿部有接触，裁判员判青岛西海岸56号犯规，无纪律处罚。VAR介入后，裁判员经在场回看，向青岛西海岸56号出示黄牌。","appeal":"","concl":"对于此判例，评议组多数成员认为：青岛西海岸56号在无触球可能性的情况下，使用鞋钉踩踏对方小腿及跟腱部位，速度力量中等偏上，有意向下踩踏，应视为严重犯规并出示红牌罚令出场。裁判员最初漏判犯规及红牌，VAR介入正确，裁判员在场回看后出示黄牌的决定错误，漏判红牌。","v":"wrong","videos":["2025/i09c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250501/1746071103523797.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2025-49","t":"case","s":"2025","issue":9,"no":5,"seq":49,"comp":"中超联赛","round":"第9轮","home":"深圳新鹏城","away":"大连英博","minute":"70","desc":"判例五：中超联赛第9轮，深圳新鹏城VS大连英博，比赛第70分钟，深圳新鹏城27号队员与大连英博4号队员疑似发生肢体接触，大连英博4号倒地。裁判员未判罚犯规，VAR未介入。","appeal":"","concl":"对于此判例，评议组首先一致认为：双方队员有互相使用手臂接触对方的动作，之后深圳新鹏城27号队员挥臂接触到大连英博4号队员，现有视频无清晰证据证明该动作击打到了队员头面部，应以鲁莽犯规为由，判深圳新鹏城27号犯规并出示黄牌警告。裁判员临场决定错误，漏判犯规和黄牌。另外评议组多数成员认为：VAR未介入正确。","v":"wrong","videos":["2025/i09c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250501/1746071137970273.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"yellow"}},{"k":"2025-50","t":"case","s":"2025","issue":9,"no":6,"seq":50,"comp":"中甲联赛","round":"第5轮","home":"南通支云","away":"重庆铜梁龙","minute":"71","desc":"判例六：中甲联赛第5轮，南通支云VS重庆铜梁龙，比赛第71分钟，重庆铜梁龙38号队员与南通支云33号队员在南通支云罚球区外头球争抢时发生身体接触。南通支云33号倒地。之后重庆铜梁龙40号队员射门进球。裁判员判进球有效。","appeal":"","concl":"对于此判例，评议组多数成员认为：南通支云33号队员率先争抢到头顶球，但双方队员属于在正常争抢范围内的合理接触。重庆铜梁龙38号不属于犯规，随后的进球有效。裁判员决定正确。","v":"correct","videos":["2025/i09c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250501/1746071180745506.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-51","t":"case","s":"2025","issue":9,"no":7,"seq":51,"comp":"中甲联赛","round":"第5轮","home":"南通支云","away":"重庆铜梁龙","minute":"74","desc":"判例七：中甲联赛第5轮，南通支云VS重庆铜梁龙，比赛第74分钟，南通支云26号进攻中向前传球给本方9号队员，第二助理裁判员示意越位，裁判员判罚越位犯规，此后重庆铜梁龙31号守门员与南通支云9号发生接触，随后南通支云37号进球。裁判员最终判罚越位犯规，进球无效。南通支云俱乐部申诉意见认为应向重庆铜梁龙31号守门员出示红牌罚令出场。","appeal":"","concl":"对于此判例，评议组多数成员认为：从现有视频看，南通支云26号传球时，其9号队员未处于越位位置，第二助理裁判员判断错误。裁判员判罚越位犯规后南通支云9号队员被犯规，按照竞赛规则，仍视为越位犯规在先。另外，重庆铜梁龙31号守门员不存在暴力行为或其他可出示红牌的违规行为。此判例评议组认定为：第二助理裁判员及裁判员判越位犯规的决定错误，重庆铜梁龙31号守门员不应被红牌罚令出场。在裁判员停止比赛后出现的进球不应进行讨论认定。","v":"wrong","videos":["2025/i09c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250501/1746071224785256.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-52","t":"case","s":"2025","issue":9,"no":8,"seq":52,"comp":"中甲联赛","round":"第5轮","home":"南通支云","away":"重庆铜梁龙","minute":"81","desc":"判例八：中甲联赛第5轮，南通支云VS重庆铜梁龙，比赛第81分钟，南通支云19号队员在对方罚球区内射门，重庆铜梁龙5号队员在本方罚球区内封堵，球疑似接触其手臂后出球门线，裁判员未判罚手球犯规。","appeal":"","concl":"对于此判例，评议组一致认为：现有视频基本可以确定球未接触重庆铜梁龙5号队员张开的左手臂，但是否与右手臂有接触，以及接触的具体过程、右手臂的位置等均无法确定。裁判员和助理裁判员的观察位置和角度较好，做出的不是手球犯规的决定应予支持。","v":"correct","videos":["2025/i09c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250501/1746071249134000.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2025-53","t":"case","s":"2025","issue":9,"no":9,"seq":53,"comp":"中甲联赛","round":"第6轮","home":"大连鲲城","away":"南通支云","minute":"25","desc":"判例九：中甲联赛第6轮，大连鲲城VS南通支云，比赛第25分钟，南通支云23号队员进攻中突破时在对方罚球区外与大连鲲城5号队员身体接触后倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：大连鲲城5号队员防守时的封堵动作合理，南通支云23号带球突破，双方队员距离近，大连鲲城5号无法及时改变身体姿态，双方的接触不属于犯规。裁判员未判罚犯规的决定正确。","v":"correct","videos":["2025/i09c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250501/1746071273648523.mp4"],"cat":"freekick_foul","catname":"罚球区外一般犯规","ans":{"r":"playon","c":"none"}},{"k":"2025-54","t":"case","s":"2025","issue":9,"no":10,"seq":54,"comp":"中甲联赛","round":"第6轮","home":"大连鲲城","away":"南通支云","minute":"79","desc":"判例十：中甲联赛第6轮，大连鲲城VS南通支云，比赛第79分钟，大连鲲城18号队员进攻中将球传中至对方罚球区内，南通支云5号队员头顶球，头顶球前大连鲲城17号队员疑似对其有推搡动作。之后大连鲲城30号队员进球。裁判员未判罚犯规，并判进球有效。","appeal":"","concl":"对于此判例，评议组多数成员认为：大连鲲城17号明显使用手臂不合理接触南通支云5号，虽然视频中不能确定推搡力度，但对于后者起跳头顶球造成了影响，应判大连鲲城17号犯规，后续进球无效。裁判员决定错误。","v":"wrong","videos":["2025/i09c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250501/1746071323857951.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-55","t":"case","s":"2025","issue":9,"no":11,"seq":55,"comp":"中甲联赛","round":"第6轮","home":"定南赣联","away":"广西平果","minute":"6","desc":"判例十一：中甲联赛第6轮，定南赣联vs广西平果，比赛第6分钟，定南赣联11号队员进攻中前插跑位时与广西平果7号队员发生身体接触后倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：定南赣联11号向传球方向跑动试图接球，广西平果7号对其进行拉扯犯规，由于定南赣联11号后续控球的可能性不明确，该犯规应视为阻止了对方有希望的进攻。应判罚广西平果7号犯规并出示黄牌警告。裁判员决定错误，漏判犯规和黄牌。","v":"wrong","videos":["2025/i09c11-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250501/1746071348626470.mp4"],"cat":"spa_tactical","catname":"战术犯规与SPA","ans":{"r":"directfk","c":"yellow"}},{"k":"2025-56","t":"case","s":"2025","issue":9,"no":12,"seq":56,"comp":"中甲联赛","round":"第6轮","home":"定南赣联","away":"广西平果","minute":"40","desc":"判例十二：中甲联赛第6轮，定南赣联vs广西平果，比赛第40分钟，定南赣联11号队员进攻中前插至对方罚球区内，并与广西平果5号队员发生身体接触后倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：双方队员具有同等的争抢球的位置和机会，守方广西平果5号率先触到球，并且无犯规动作。裁判员未判罚犯规的决定正确。","v":"correct","videos":["2025/i09c12-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250501/1746071390433504.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-57","t":"case","s":"2025","issue":9,"no":13,"seq":57,"comp":"中甲联赛","round":"第6轮","home":"定南赣联","away":"广西平果","minute":"43","desc":"判例十三：中甲联赛第6轮，定南赣联vs广西平果，比赛第43分钟，定南赣联进攻中将球传中至对方罚球区内，其11号队员在对方罚球区内争抢位置时，与广西平果5号队员发生身体接触后倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：双方队员在罚球区内争抢位置时，身体正常相互接触，广西平果5号卡住位置并且无明显犯规动作，也不是造成定南赣联11号倒地的主要原因。裁判员未判罚犯规的决定正确。","v":"correct","videos":["2025/i09c13-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250501/1746071440306264.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-58","t":"case","s":"2025","issue":10,"no":1,"seq":58,"comp":"中超联赛","round":"第10轮","home":"深圳新鹏城","away":"天津津门虎","minute":"48","desc":"判例一：中超联赛第10轮，深圳新鹏城VS天津津门虎，比赛第48分钟，天津津门虎37号队员在对方罚球区内与深圳新鹏城20号队员发生接触后倒地，裁判员未判罚犯规。VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：双方队员在向同方向移动争抢球过程中，深圳新鹏城20号有拉天津津门虎37号球衣的动作，但接触时间短，力量轻微，未明显影响后者争抢球的能力，也非后者倒地的主要原因。天津津门虎37号有借拉扯动作主动倒地的成分。裁判员未判罚犯规的决定，应予支持；VAR未介入正确。","v":"correct","videos":["2025/i10c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250507/1746619037302851.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-59","t":"case","s":"2025","issue":10,"no":2,"seq":59,"comp":"中超联赛","round":"第10轮","home":"深圳新鹏城","away":"天津津门虎","minute":"","desc":"判例二：中超联赛第10轮，深圳新鹏城VS天津津门虎，比赛第90+3分钟，天津津门虎9号队员在对方罚球区内与深圳新鹏城16号队员争抢球后倒地，裁判员初始判深圳新鹏城16号犯规，并判罚球点球。经VAR介入，裁判员在场回看后，改判为不犯规，取消罚球点球，并以角球恢复比赛。","appeal":"","concl":"对于此判例，评议组首先一致认为：深圳新鹏城16号防守中的封堵和试图破坏球的动作正常，且触到了球，无其他犯规动作，不应视为犯规。裁判员在场回看后取消罚球点球的决定正确，VAR介入正确。其次评议组多数成员认为，裁判员在做出初始判罚停止比赛时，球尚未离开比赛场地，在更改判罚取消罚球点球后，不应以角球恢复比赛，应以坠球恢复比赛。","v":"correct","videos":["2025/i10c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250507/1746619099977333.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-60","t":"case","s":"2025","issue":10,"no":3,"seq":60,"comp":"中甲联赛","round":"第7轮","home":"深圳青年人","away":"南京城市","minute":"40","desc":"判例三：中甲联赛第7轮，深圳青年人VS南京城市，比赛第40分钟，南京城市20号队员在对方罚球区内与深圳青年人7号队员争抢后倒地，裁判员在第二助理裁判员协助下判罚攻方南京城市20号犯规，由守方深圳青年人踢直接任意球恢复比赛。","appeal":"","concl":"对于此判例，评议组多数成员认为：双方队员在向球跑动过程中有互相拉扯的动作，南京城市20号对深圳青年人7号的拉扯造成后者失去重心和身体平衡，之后深圳青年人7号在本方罚球区内拉倒南京城市20号，回放慢动作镜头未能完整展现双方相互拉扯的全过程，第二助理裁判员位置和视角应能够清晰看到攻方对守方的拉扯情况，在此情况下，在第二助理裁判员协助后，裁判员做出的攻方犯规的决定，应予支持。","v":"correct","videos":["2025/i10c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250507/1746619148951327.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"c":"none"}},{"k":"2025-61","t":"case","s":"2025","issue":10,"no":4,"seq":61,"comp":"中甲联赛","round":"第7轮","home":"辽宁铁人","away":"陕西联合","minute":"55","desc":"判例四：中甲联赛第7轮，辽宁铁人vs陕西联合，比赛第55分钟，陕西联合33号队员进攻中接本方传中球，头球将球顶入对方球门，第一助理裁判员示意陕西联合33号越位，裁判员判陕西联合越位犯规在先，进球无效。","appeal":"","concl":"对于此判例，评议组一致认为：陕西联合33号在本方球员传中时明显未处于越位位置，第一助理裁判员出现明显的判断失误，裁判员判陕西联合越位犯规以及进球无效的决定错误。","v":"wrong","videos":["2025/i10c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250507/1746619216495549.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-62","t":"case","s":"2025","issue":10,"no":5,"seq":62,"comp":"中乙联赛","round":"第7轮","home":"广东铭途","away":"广西恒宸","minute":"60","desc":"判例五：中乙联赛第7轮，广东铭途VS广西恒宸，比赛第60分钟，广西恒宸7号队员进攻中带球突破至对方罚球区内后摔倒，裁判员判守方广东铭途5号队员犯规，判罚球点球，并向广东铭途5号出示黄牌。","appeal":"","concl":"对于此判例，评议组首先一致认为：广东铭途5号有使用手臂接触广西恒宸7号的动作，但接触较轻微，未影响后者继续前进和带球，不应视为犯规。广西恒宸7号有夸大接触和主动倒地的成分。其次评议组多数成员认为：广东铭途5号有对对方实施手部接触，无需判广西恒宸7号佯装（假摔）以及对其出示黄牌。裁判员判广东铭途5号犯规、判罚球点球以及出示黄牌的决定均为错误。","v":"wrong","videos":["2025/i10c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250507/1746619259181682.mp4"],"cat":"simulation","catname":"假摔与欺骗行为","ans":{"r":"playon","c":"none"}},{"k":"2025-63","t":"case","s":"2025","issue":10,"no":6,"seq":63,"comp":"中乙联赛","round":"第7轮","home":"贵州筑城竞技","away":"广州蒲公英","minute":"67","desc":"判例六：中乙联赛第7轮，贵州筑城竞技VS广州蒲公英，比赛第67分钟，贵州筑城竞技49号队员进攻中带球突破至对方罚球区，与广州蒲公英20号、47号队员争抢后倒地，裁判员判广州蒲公英队防守犯规，并判罚球点球。","appeal":"","concl":"对于此判例，评议组多数成员认为：广州蒲公英20号、47号队员夹防对方队员时未能及时占据有利位置，现有视频无法清晰展现双方队员接触情况，但在贵州筑城竞技49号突破时，广州蒲公英队员对其有挤靠和绊摔动作，裁判员的观察位置较好，做出的守方犯规和判罚球点球的决定，应予支持。","v":"correct","videos":["2025/i10c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250507/1746619306268115.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-64","t":"case","s":"2025","issue":10,"no":7,"seq":64,"comp":"中乙联赛","round":"第7轮","home":"贵州筑城竞技","away":"广州蒲公英","minute":"72","desc":"判例七：中乙联赛第7轮，贵州筑城竞技VS广州蒲公英，比赛第72分钟，广州蒲公英43号队员在对方罚球区内试图处理高空球时，贵州筑城竞技17号队员与其有接触，广州蒲公英43号倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组首先一致认为：球从高处下落时，处于广州蒲公英43号的控制范围，贵州筑城竞技17号从背后冲撞广州蒲公英43号，应视为犯规，并判罚球点球。其次评议组多数成员认为：贵州筑城竞技17号在争抢时膝关节抬起，从背后冲撞对方队员，未顾及可能对对方造成的危险，应视为鲁莽犯规并出示黄牌警告。裁判员决定错误，漏判守方犯规、罚球点球和黄牌。","v":"wrong","videos":["2025/i10c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250507/1746619330606836.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"yellow"}},{"k":"2025-65","t":"case","s":"2025","issue":11,"no":1,"seq":65,"comp":"中超联赛","round":"第11轮","home":"梅州客家","away":"上海申花","minute":"45","desc":"判例一：中超联赛第11轮，梅州客家VS上海申花，比赛第45分钟，梅州客家10号队员进攻中在对方罚球区内传球，球疑似接触上海申花5号队员手臂，裁判员未判罚手球犯规。VAR未介入。","appeal":"","concl":"对于此判例，评议组首先一致认为：视频中无法清晰证明球是否与上海申花5号手臂有接触。其次评议组多数成员认为，即使球与上海申花5号手臂有接触，但由于其手臂已经张开，且无法预期球从距离很近的同队队员脚下反弹变向而来，也不应视为手球犯规。评议组最终认定，支持和尊重裁判员未判罚犯规的决定以及VAR不介入的决定。","v":"correct","videos":["2025/i11c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250514/1747227107291616.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2025-66","t":"case","s":"2025","issue":11,"no":2,"seq":66,"comp":"中超联赛","round":"第11轮","home":"梅州客家","away":"上海申花","minute":"60","desc":"判例二：中超联赛第11轮，梅州客家VS上海申花，比赛第60分钟，上海申花队进球，裁判员判进球有效。VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：上海申花队踢出角球，之后4号队友头顶球时，上海申花27号队员处于越位位置，并且与对方队员持续进行拉扯，影响了对方队员处理球的能力，按照竞赛规则，应视为在越位位置干扰对方队员的越位犯规。上海申花队越位犯规在先，进球无效。VAR必须对此越位犯规进行查看和介入。裁判员判进球有效的决定错误，漏判越位犯规。VAR未介入错误。","v":"wrong","videos":["2025/i11c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250514/1747227155347492.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-67","t":"case","s":"2025","issue":11,"no":3,"seq":67,"comp":"中超联赛","round":"第11轮","home":"青岛西海岸","away":"深圳新鹏城","minute":"45","desc":"判例三：中超联赛第11轮，青岛西海岸VS深圳新鹏城，比赛第45分钟，深圳新鹏城9号队员做倒钩动作时接触到青岛西海岸6号队员，裁判员判深圳新鹏城9号犯规，并出示黄牌。VAR未介入。","appeal":"","concl":"对于此判例，评议组多数成员认为：双方队员均以试图触球为目的，青岛西海岸6号争抢到头顶球，深圳新鹏城9号未观察和顾及到对方队员，并做出倒钩动作踢到对方队员，应视为鲁莽犯规并出示黄牌警告，不应视为严重犯规，无需出示红牌。裁判员出示黄牌的决定正确，VAR未介入正确。","v":"correct","videos":["2025/i11c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250514/1747227192164755.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2025-68","t":"case","s":"2025","issue":11,"no":4,"seq":68,"comp":"中乙联赛","round":"第8轮","home":"广西蓝航","away":"成都蓉城B队","minute":"20","desc":"判例四：中乙联赛第8轮，广西蓝航VS成都蓉城B队，比赛第20分钟，广西蓝航9号队员在跑动中与对方队员有接触，裁判员出示红牌将广西蓝航9号罚令出场。","appeal":"","concl":"对于此判例，评议组一致认为：从现有视频上无法看清广西蓝航9号手臂与对方队员接触的具体动作和力度，但其手臂主动对对方队员颈部至头面部有击打，且力量不属于轻微可忽略的，此时球在空中运行过程中尚未处于双方可争抢和触球的范围内，按照竞赛规则，应视为暴力行为。裁判员向广西蓝航9号出示红牌罚令出场的决定，应予支持。","v":"correct","videos":["2025/i11c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250514/1747227236696315.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"red"}},{"k":"2025-69","t":"case","s":"2025","issue":11,"no":5,"seq":69,"comp":"中乙联赛","round":"第8轮","home":"温州俱乐部","away":"广东铭途","minute":"","desc":"判例五：中乙联赛第8轮，温州俱乐部VS广东铭途，广东铭途39号守门员在本方罚球区内与对方17号队员争抢球，后者倒地，裁判员判广东铭途39号守门员犯规，并判罚球点球","appeal":"","concl":"对于此判例，评议组一致认为：广东铭途39号守门员出击铲球，并且成功踢到了球，之后球从温州俱乐部17号腿部反弹后继续向前运行。广东铭途39号守门员无附加犯规动作，不应视为犯规。裁判员判广东铭途39号守门员犯规并判罚球点球的决定错误。","v":"wrong","videos":["2025/i11c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250514/1747227314108370.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-70","t":"case","s":"2025","issue":11,"no":6,"seq":70,"comp":"中乙联赛","round":"第9轮","home":"成都蓉城B队","away":"贵州筑城竞技","minute":"","desc":"判例六：中乙联赛第9轮，成都蓉城B队VS贵州筑城竞技，比赛第45+1分钟，贵州筑城竞技49号队员踢球后脚部接触成都蓉城B队59号队员，裁判员判贵州筑城竞技49号犯规并出示黄牌。","appeal":"","concl":"对于此判例，评议组一致认为：贵州筑城竞技49号在可观察和预判对方队员的情况下，仍然在踢出球后用鞋底蹬踹对方队员头颈部，使用了过分力量，危及对方队员安全，应视为严重犯规并出示红牌罚令出场。裁判员出示黄牌的决定错误，漏判红牌。","v":"wrong","videos":["2025/i11c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250514/1747227366461821.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2025-71","t":"case","s":"2025","issue":12,"no":1,"seq":71,"comp":"中超联赛","round":"第13轮","home":"大连英博","away":"上海申花","minute":"12","desc":"判例一：中超联赛第13轮，大连英博VS上海申花，比赛第12分钟，大连英博队在前场发出任意球，上海申花34号队员疑似在本方罚球区内手臂触球，裁判员未判罚手球犯规。VAR未介入。","appeal":"大连英博俱乐部申诉意见认为：应判上海申花34号手球犯规和罚球点球。","concl":"对于此判例，评议组多数成员认为：上海申花34号队员试图处理球时手臂意外触球，手臂处于该动作下的自然位置，不应视为手球犯规。裁判员未判罚犯规正确，VAR未介入正确。","v":"correct","videos":["2025/i12c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250521/1747835764698662.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2025-72","t":"case","s":"2025","issue":12,"no":2,"seq":72,"comp":"中甲联赛","round":"第9轮","home":"大连鲲城","away":"深圳青年人","minute":"67","desc":"判例二：中甲联赛第9轮，大连鲲城vs深圳青年人，比赛第67分钟，深圳青年人9号队员在大连鲲城罚球区内倒地，裁判员未判罚犯规。","appeal":"深圳青年人俱乐部申诉意见认为：应判大连鲲城队犯规并判罚球点球。","concl":"对于此判例，评议组一致认为：大连鲲城24号队员对深圳青年人9号实施明显的拉扯犯规，影响后者移动并使其倒地，应判大连鲲城24号犯规并判罚球点球。裁判员决定错误，漏判犯规和罚球点球。","v":"wrong","videos":["2025/i12c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250521/1747835822736065.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-73","t":"case","s":"2025","issue":12,"no":3,"seq":73,"comp":"中甲联赛","round":"第9轮","home":"大连鲲城","away":"深圳青年人","minute":"86","desc":"判例三：中甲联赛第9轮，大连鲲城vs深圳青年人，比赛第86分钟，深圳青年人38号队员在大连鲲城罚球区内带球进攻时与大连鲲城24号队员有接触并倒地，裁判员未判罚犯规。","appeal":"深圳青年人俱乐部申诉意见认为：应判大连鲲城队犯规并判罚球点球。","concl":"对于此判例，评议组一致认为：双方在争抢过程中均有使用手臂接触对方的动作，深圳青年人38号队员持有控球权，大连鲲城24号队员在本方罚球区内对对方队员实施拉扯和绊摔，应视为犯规，并判罚球点球。裁判员决定错误，漏判犯规和罚球点球。","v":"wrong","videos":["2025/i12c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250521/1747835881741261.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-74","t":"case","s":"2025","issue":12,"no":4,"seq":74,"comp":"中甲联赛","round":"第9轮","home":"大连鲲城","away":"深圳青年人","minute":"","desc":"判例四：中甲联赛第9轮，大连鲲城vs深圳青年人，比赛第90+6分钟，大连鲲城队在前场发出任意球并进球，裁判员判进球有效。","appeal":"深圳青年人俱乐部申诉意见认为：大连鲲城进球前越位犯规，进球无效。","concl":"对于此判例，评议组多数成员认为：从现有视频各机位角度看，无法清晰判断大连鲲城踢任意球触球时，其24号队员是否处于越位位置。助理裁判员未示意越位，以及裁判员判进球有效的决定，应予支持。","v":"correct","videos":["2025/i12c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250521/1747835972264102.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-75","t":"case","s":"2025","issue":12,"no":5,"seq":75,"comp":"中甲联赛","round":"第9轮","home":"陕西联合","away":"南通支云","minute":"","desc":"判例五：中甲联赛第9轮，陕西联合vs南通支云，比赛第90+2分钟，陕西联合22号队员在对方罚球区内带球，南通支云21号队员上前防守，陕西联合22号倒地，裁判员判南通支云21号犯规并判罚球点球。","appeal":"南通支云俱乐部申诉意见认为：本方队员未犯规，不应判罚球点球，并认为陕西联合22号故意摔倒。","concl":"对于此判例，评议组一致认为：视频中较为清晰地显示南通支云21号队员上前防守时绊摔对方队员，应视为草率的犯规。裁判员判罚犯规和罚球点球的决定正确。","v":"correct","videos":["2025/i12c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250521/1747836030559427.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-76","t":"case","s":"2025","issue":12,"no":6,"seq":76,"comp":"中甲联赛","round":"第9轮","home":"陕西联合","away":"南通支云","minute":"","desc":"判例六：中甲联赛第9轮，陕西联合vs南通支云，比赛第90+4分钟，陕西联合33号队员进球，裁判员判进球有效。","appeal":"南通支云俱乐部申诉意见认为：对方处于越位位置的队员进球，越位犯规进球无效。","concl":"对于此判例，评议组一致认为：通过视频判断，双方争顶头球时，守方南通支云队员顶到了球，攻方陕西联合队员未触球，因此陕西联合33号队员不属于越位犯规。助理裁判员未示意越位，以及裁判员判进球有效的决定正确。","v":"correct","videos":["2025/i12c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250521/1747836136423937.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-77","t":"case","s":"2025","issue":12,"no":7,"seq":77,"comp":"中甲联赛","round":"第9轮","home":"定南赣联","away":"辽宁铁人","minute":"71","desc":"判例七：中甲联赛第9轮，定南赣联vs辽宁铁人，比赛第71分钟，辽宁铁人9号队员在对方罚球区内倒地，裁判员未判罚犯规。","appeal":"辽宁铁人俱乐部申诉意见认为：应判定南赣联队队员犯规，且破坏明显进球得分机会，应判罚点球并出示红牌。","concl":"对于此判例，评议组一致认为：定南赣联3号防守时拉扯对方队员，其力度和对对方造成的影响，构成犯规，同时该犯规符合破坏对方明显进球得分机会的判断标准，应判定南赣联3号犯规和罚球点球，并出示红牌罚令出场。裁判员决定错误，漏判罚球点球和红牌。","v":"wrong","videos":["2025/i12c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250521/1747836173574828.mp4"],"cat":"dogso","catname":"破坏明显进球得分机会（DOGSO）","ans":{"r":"penalty","c":"red"}},{"k":"2025-78","t":"case","s":"2025","issue":12,"no":8,"seq":78,"comp":"中乙联赛","round":"第10轮","home":"兰州陇原竞技","away":"上海海港富盛经开","minute":"","desc":"判例八：中乙联赛第10轮，兰州陇原竞技VS上海海港富盛经开，比赛第90+4分钟，兰州陇原竞技11号队员在本方罚球区内争抢球时，脚与上海海港富盛经开9号队员头部疑似有接触，裁判员未判罚犯规。","appeal":"上海海港富盛经开队申诉意见认为：兰州陇原竞技11号抬脚过高并踢到上海海港富盛经开9号头部，应判犯规和罚球点球。","concl":"对于此判例，评议组首先一致认为：从现有视频判断，兰州陇原竞技11号未踢到对方队员，不应判罚球点球。其次评议组多数成员认为：兰州陇原竞技11号的动作构成以危险方式比赛的违规，应由上海海港富盛经开队以踢间接任意球的方式恢复比赛。","v":"correct","videos":["2025/i12c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250521/1747836217172904.mp4"],"cat":"freekick_foul","catname":"罚球区外一般犯规","ans":{"r":"indirectfk","c":"none"}},{"k":"2025-79","t":"case","s":"2025","issue":12,"no":9,"seq":79,"comp":"中乙联赛","round":"第10轮","home":"武汉三镇B队","away":"赣州瑞狮","minute":"74","desc":"判例九：中乙联赛第10轮，武汉三镇B队vs赣州瑞狮，比赛第74分钟，武汉三镇B队41号队员在对方罚球区内与赣州瑞狮守门员争抢球后倒地。裁判员判赣州瑞狮守门员犯规，并判罚点球和出示黄牌。","appeal":"赣州瑞狮俱乐部申诉意见认为：本方守门员不犯规，不应判罚球点球和出示黄牌。","concl":"对于此判例，评议组一致认为：赣州瑞狮守门员出击防守，扑到了球，并且无附加犯规动作，不应视为犯规。裁判员判赣州瑞狮守门员犯规、罚球点球以及黄牌的决定均为错误。","v":"wrong","videos":["2025/i12c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250521/1747836278435536.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-80","t":"case","s":"2025","issue":12,"no":10,"seq":80,"comp":"中乙联赛","round":"第10轮","home":"武汉三镇B队","away":"赣州瑞狮","minute":"84","desc":"判例十：中乙联赛第10轮，武汉三镇B队vs赣州瑞狮，比赛第84分钟，赣州瑞狮队4号队员在对方罚球区内倒地，裁判员未判罚犯规。","appeal":"赣州瑞狮俱乐部申诉意见认为：应判武汉三镇B队犯规，并判罚球点球和出示黄牌。","concl":"对于此判例，评议组一致认为：现有单一机位距离较远，无法清晰展示守方队员防守动作及倒地过程中是否有犯规情况，裁判员未判罚犯规的决定，应予支持。","v":"correct","videos":["2025/i12c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250521/1747836308267232.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-81","t":"case","s":"2025","issue":13,"no":1,"seq":81,"comp":"中甲联赛","round":"第10轮","home":"石家庄功夫","away":"南京城市","minute":"53","desc":"判例一：中甲联赛第10轮，石家庄功夫VS南京城市。比赛第53分钟，南京城市队踢角球，南京城市17号队员争抢位置时与对方队员发生接触并倒地，随后南京城市39号队员得球后，石家庄功夫33号队员上前防守，南京城市39号倒地。南京城市队员两次倒地均在石家庄功夫罚球区内，裁判员对于两次倒地均未判罚犯规。","appeal":"南京城市俱乐部申诉意见认为：双方第一次接触，应判石家庄功夫队犯规并判罚球点球，并向犯规队员出示红牌罚令出场；双方第二次接触，也应判石家庄功夫队犯规并判罚球点球。","concl":"对于此判例，评议组一致认为：双方队员的第一次接触中，南京城市17号队员主动做出后仰试图争抢球的动作，其倒地并非对方队员拉扯造成，仅从现有视频来看，未呈现出守方有犯规动作的清晰证据。双方队员的第二次接触中，视频中未清晰展现双方队员接触的情况，石家庄功夫33号队员上前防守时腿部先到达位置，无附加犯规动作，南京城市39号队员试图带球突破时造成双方接触。在该判例的两次接触中，裁判员做出的不犯规的决定，应予支持。","v":"correct","videos":["2025/i13c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250604/1749044085663629.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-82","t":"case","s":"2025","issue":13,"no":2,"seq":82,"comp":"中甲联赛","round":"第11轮","home":"南京城市","away":"广州豹","minute":"7","desc":"判例二：中甲联赛第11轮，南京城市VS广东广州豹，比赛第7分钟，南京城市10号队员进球，助理裁判员举旗示意越位，裁判员判南京城市10号越位犯规在先，进球无效。","appeal":"南京城市俱乐部申诉意见认为：本队10号队员在同队队员传球时不处在越位位置，进球应有效。","concl":"对于此判例，评议组一致认为：从现有视频角度来看，在南京城市队员传球的瞬间，守方广东广州豹倒数第二名队员较之攻方队员更接近本方球门线，南京城市10号队员不处于越位位置。助理裁判员举旗示意越位，以及裁判员判罚越位犯规的决定均为错误。","v":"wrong","videos":["2025/i13c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250604/1749044152987029.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-83","t":"case","s":"2025","issue":13,"no":3,"seq":83,"comp":"中甲联赛","round":"第11轮","home":"南通支云","away":"定南赣联","minute":"","desc":"判例三：中甲联赛第11轮，南通支云VS定南赣联，比赛第45+2分钟，定南赣联11号队员与南通支云5号队员在南通支云罚球区内争抢球后，定南赣联11号倒地，裁判员判守方犯规并判罚球点球。","appeal":"南通支云俱乐部申诉意见认为：本方防守队员不犯规，不应判罚球点球。","concl":"对于此判罚，评议组一致认为：守方南通支云5号队员先占据争抢球的有利位置，攻方定南赣联11号试图继续争抢球，手部对对方有接触，在定南赣联11号腾空和落地过程中双方可能有接触，南通支云5号无明显的可视为犯规的动作。双方的争抢属于比赛中的正常接触，双方均不犯规。裁判员判守方犯规以及罚球点球的决定均为错误。","v":"wrong","videos":["2025/i13c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250604/1749044197496624.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-84","t":"case","s":"2025","issue":13,"no":4,"seq":84,"comp":"全运会","round":"第一轮","home":"四川","away":"湖北","minute":"56","desc":"判例四：中华人民共和国第十五届运动会，女子足球U16组决赛阶段第一轮，四川VS湖北，比赛第56分钟，四川队38号队员在对方罚球区线附近，被湖北队8号队员犯规，裁判员判湖北队犯规并因犯规地点在罚球区外而判直接任意球。","appeal":"四川队申诉意见认为：该犯规地点在湖北队罚球区内，应判罚球点球。","concl":"对于此判例，评议组首先一致认为：湖北队8号队员对对方队员实施草率的绊摔，应判罚犯规。其次评议组多数成员认为：双方腿部的接触是主要的犯规接触点，现有视频的角度无法绝对证明接触点是否处于罚球区内或罚球区线上（线上也视为罚球区内），裁判员认为犯规地点处于罚球区外，并判罚直接任意球的决定，应予支持。","v":"correct","videos":["2025/i13c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250604/1749044264675969.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"directfk","c":"none"}},{"k":"2025-85","t":"case","s":"2025","issue":14,"no":1,"seq":85,"comp":"中超联赛","round":"第14轮","home":"浙江俱乐部绿城","away":"上海海港","minute":"","desc":"判例一：中超联赛第14轮，浙江俱乐部VS上海海港，比赛第90+1分钟，浙江队进球，裁判员初始决定为进球有效。VAR介入，裁判员经在场回看后，判进球前浙江队7号队员对上海海港32号队员犯规在先，取消进球，并以守方在犯规地点踢直接任意球恢复比赛。","appeal":"浙江俱乐部申诉意见认为：双方争抢未对本次进攻产生影响，VAR介入有误，进球应有效。","concl":"对于此判例，评议组多数成员认为：攻方违规行为发生时，比赛尚未恢复（未踢出角球），不属于VAR可介入的进攻发展阶段范畴。裁判员在比赛恢复前未做出管理。比赛恢复后（踢出角球后）攻方无违规行为，进球应有效。VAR介入错误（对不可介入时段的事件进行了介入），裁判员在场回看后取消进球的决定错误。","v":"wrong","videos":["2025/i14c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250618/1750259235266578.mov"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-86","t":"case","s":"2025","issue":14,"no":2,"seq":86,"comp":"中超联赛","round":"第14轮","home":"河南俱乐部","away":"成都蓉城","minute":"13","desc":"判例二：中超联赛第14轮，河南俱乐部VS成都蓉城，比赛第13分钟，河南俱乐部10号队员进攻中在对方罚球区内与成都蓉城26号队员接触后倒地。裁判员判罚球点球，并向成都蓉城26号出示黄牌。VAR未介入。","appeal":"成都蓉城俱乐部申诉意见认为：本方防守队员不犯规，不应被判罚球点球。","concl":"对于此判例，评议组一致认为：成都蓉城26号队员在争抢球时踢倒河南俱乐部10号队员，属于草率犯规，裁判员判罚球点球的主要决定正确，VAR未介入正确。另外评议组指出：该犯规未达到鲁莽的严重程度，从防守队员的人数、位置等因素来看，也不属于破坏明显进球得分机会的犯规，因此在判罚球点球的同时，无需出示红黄牌。","v":"correct","videos":["2025/i14c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250618/1750259268507012.mov"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-87","t":"case","s":"2025","issue":14,"no":3,"seq":87,"comp":"中超联赛","round":"第14轮","home":"河南俱乐部","away":"成都蓉城","minute":"27","desc":"判例三：中超联赛第14轮，河南俱乐部VS成都蓉城，比赛第27分钟，河南队进球，裁判员判进球有效。VAR未介入。","appeal":"成都蓉城俱乐部申诉意见认为：对方在边路接球并头顶球的11号队员越位犯规在先，后续进球应无效。","concl":"对于此判例，评议组一致认为：VAR查看进球事件时，对河南俱乐部11号队员是否处于越位位置进行了画线检查，从传球触球关键帧的确认，到攻防双方队员身体部位的选择，以及落线和画线比对等流程，均操作正确，判断结果正确。河南俱乐部11号不越位，裁判员判后续进球有效的决定正确，VAR查看进球后未介入正确。","v":"correct","videos":["2025/i14c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250618/1750259338574640.mov"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-88","t":"case","s":"2025","issue":14,"no":4,"seq":88,"comp":"中超联赛","round":"第14轮","home":"河南俱乐部","away":"成都蓉城","minute":"39","desc":"判例四：中超联赛第14轮，河南俱乐部VS成都蓉城，比赛第39分钟，河南队23号队员防守时对成都蓉城9号队员犯规，裁判员向河南队23号出示黄牌。VAR未介入。","appeal":"成都蓉城俱乐部申诉意见认为：本方9号队员已经形成明显单刀机会，对方犯规队员应被出示红牌罚令出场。","concl":"对于此判例，评议组一致认为：综合考量河南队23号队员犯规时，犯规地点距球门的距离，以及其他防守队员的位置和可能起到的防守作用，该犯规不符合破坏明显进球得分机会的判断标准，应视为阻止有希望的进攻的犯规并出示黄牌。裁判员判河南队23号犯规并向其出示黄牌警告的决定正确，VAR未介入正确。","v":"correct","videos":["2025/i14c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250618/1750259367588925.mov"],"cat":"spa_tactical","catname":"战术犯规与SPA","ans":{"c":"yellow"}},{"k":"2025-89","t":"case","s":"2025","issue":14,"no":5,"seq":89,"comp":"中甲联赛","round":"第12轮","home":"广西平果","away":"南通支云","minute":"51","desc":"判例五：中甲联赛第12轮，广西平果VS南通支云，比赛第51分钟，广西平果45号队员在本方罚球区内封挡对方射门时手臂触球，经助理裁判员协助后，裁判员判广西平果45号手球犯规，并判罚球点球。","appeal":"广西平果俱乐部申诉意见认为：本方队员手臂处于自然位置，不应被判罚手球犯规和罚球点球。","concl":"对于此判例，评议组一致认为：广西平果45号队员封堵对方射门，手臂触球时处于使身体不自然扩大的位置，应判手球犯规。另外，该手球犯规阻止了对方有希望的进攻（射门），但不属于故意手球（手向球移动），按照竞赛规则，判罚球点球的同时，无需出示红黄牌。裁判员在经助理裁判员协助后，判广西平果45号手球犯规并判罚球点球的决定正确。","v":"correct","videos":["2025/i14c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250618/1750259415140778.mov"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2025-90","t":"case","s":"2025","issue":14,"no":6,"seq":90,"comp":"中甲联赛","round":"第12轮","home":"广西平果","away":"南通支云","minute":"55","desc":"判例六：中甲联赛第12轮，广西平果VS南通支云，比赛第55分钟，广西平果8号队员在对方罚球区内与对方队员争抢球后倒地，裁判员未判罚犯规。","appeal":"广西平果俱乐部申诉意见认为：对方队员争抢球时犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：现有视频无法清晰展现双方队员争抢时的接触情况、触球情况以及守方队员是否有犯规动作发生，支持裁判员临场做出的未判罚犯规的决定。","v":"correct","videos":["2025/i14c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250618/1750259442540200.mov"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-91","t":"case","s":"2025","issue":14,"no":7,"seq":91,"comp":"中甲联赛","round":"第12轮","home":"广州豹","away":"苏州东吴","minute":"60","desc":"判例七：中甲联赛第12轮，广东广州豹VS苏州东吴，比赛第60分钟，广东广州豹球员在对方罚球区内倒钩射门，苏州东吴5号队员封堵时手臂触球，裁判员判苏州东吴5号手球犯规并判罚球点球。","appeal":"苏州东吴俱乐部申诉意见认为：球接触本方队员脸部后变向反弹接触手臂，本方不应被判手球犯规和罚球点球。","concl":"对于此判例，评议组多数成员认为：苏州东吴5号队员封堵对方射门时，球接触其脸部后反弹接触其手臂。手臂的位置并非此动作下的合理位置，队员将手臂抬起置于此位置，冒了手臂被球击中的风险，使身体不自然扩大，应判罚手球犯规。另外，该手球犯规阻止了对方有希望的进攻（射门），但不属于故意手球（手向球移动），按照竞赛规则，判罚球点球的同时，无需出示红黄牌。裁判员判苏州东吴5号手球犯规并判罚球点球的决定正确。","v":"correct","videos":["2025/i14c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250618/1750259488664641.mov"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2025-92","t":"case","s":"2025","issue":14,"no":8,"seq":92,"comp":"中乙联赛","round":"第13轮","home":"江西庐山","away":"杭州临平吴越","minute":"16","desc":"判例八：中乙联赛第13轮，江西庐山VS杭州临平吴越，比赛第16分钟，杭州临平吴越29号队员进球，裁判员经与助理裁判员和第四官员商议后，判进球有效。","appeal":"江西庐山俱乐部申诉意见认为：对方队员使用手臂进球，进球应无效。","concl":"对于此判例，评议组一致认为：现有视频的角度，无法证明球是否与杭州临平吴越29号队员手臂有接触，支持和尊重裁判员做出的进球有效的决定。","v":"correct","videos":["2025/i14c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250618/1750259532691027.mov"],"cat":"handball","catname":"手球犯规","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-93","t":"case","s":"2025","issue":14,"no":9,"seq":93,"comp":"女超联赛","round":"第9轮","home":"上海农商银行女足","away":"江苏无锡女足","minute":"74","desc":"判例九：女超联赛第9轮，上海农商银行女足VS江苏无锡女足，比赛第74分钟，上海农商银行女足16号队员在对方罚球区内带球转身突破，与对方队员发生接触后倒地，裁判员判江苏无锡女足队员犯规，并判罚球点球。","appeal":"江苏无锡女足申诉意见认为：本方队员不犯规，不应被判罚球点球。","concl":"对于此判例，评议组一致认为：江苏无锡女足27号和21号队员在本方罚球区内防守对方队员突破，从现有视频判断，其21号队员在争抢时对对方有绊摔犯规，同时破坏了对方明显的进球得分机会，应判罚球点球，并出示黄牌。裁判员判江苏无锡女足防守犯规并判罚球点球的主要决定正确。","v":"correct","videos":["2025/i14c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250618/1750259571181853.mov"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"yellow"}},{"k":"2025-94","t":"case","s":"2025","issue":14,"no":10,"seq":94,"comp":"女超联赛","round":"第9轮","home":"上海农商银行女足","away":"江苏无锡女足","minute":"81","desc":"判例十：女超联赛第9轮，上海农商银行女足VS江苏无锡女足，比赛第81分钟，江苏无锡女足发角球，角球发出后双方队员在上海农商银行罚球区内争抢并倒地，裁判员未判罚犯规。","appeal":"江苏无锡女足申诉意见认为：上海农商银行女足队员在无球状态下，拉拽江苏无锡女足21号队员，应判犯规并判罚球点球。","concl":"对于此判例，评议组多数成员认为：双方队员在罚球区内争抢位置时有互相拉扯的动作，但现有视频无法判断具体接触情况，支持和尊重裁判员临场做出的未判罚犯规的决定。","v":"correct","videos":["2025/i14c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250618/1750259615101990.mov"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-95","t":"case","s":"2025","issue":14,"no":11,"seq":95,"comp":"全运会","round":"","home":"广东","away":"江苏","minute":"47","desc":"判例十一：中华人民共和国第十五届运动会，女子足球U16组别比赛，广东VS江苏，比赛第47分钟，球进入广东队球门的同时被广东队队员解围踢出，裁判员确认球还未完全过球门线，未进球。","appeal":"江苏女足申诉意见认为：球已经完全过球门线，应判本方进球得分。","concl":"对于此判例，评议组一致认为：在判断球是否完全离开球门线时，斜方向角度的镜头，在空间位置上可能造成视觉差。根据现有各角度视频，无法清晰证明球已完全离开球门线（进入球门），且助理裁判位置较好，支持裁判员做出的未进球的决定。","v":"correct","videos":["2025/i14c11-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250618/1750259646157040.mov"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"c":"none"}},{"k":"2025-96","t":"case","s":"2025","issue":14,"no":12,"seq":96,"comp":"中超联赛","round":"第14轮","home":"武汉三镇","away":"青岛海牛","minute":"45","desc":"判例十二：中超联赛第14轮，武汉三镇VS青岛海牛，比赛第45分钟，青岛海牛7号队员与武汉三镇11号队员争抢球，裁判员判罚青岛海牛7号犯规，未出示红黄牌。VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：青岛海牛7号使用鞋钉，直腿蹬踹对方队员跟腱和小腿部位，并且使用了过分力量，应视为严重犯规，并出示红牌罚令出场。在裁判员未出示红牌的情况下，属于清晰明显的错误决定，VAR应该介入而未介入。裁判员决定错误，漏判红牌；VAR未介入错误。","v":"wrong","videos":["2025/i14c12-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250618/1750259668630267.mov"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2025-97","t":"case","s":"2025","issue":15,"no":1,"seq":97,"comp":"中超联赛","round":"第13轮","home":"深圳新鹏城","away":"武汉三镇","minute":"57","desc":"判例一：中超联赛第13轮，深圳新鹏城VS武汉三镇，比赛第57分钟，武汉三镇11号队员在对方罚球区内与深圳新鹏城22号队员发生身体接触后倒地，裁判员初始决定为不犯规，经VAR介入，裁判员在场回看后，改判深圳新鹏城22号犯规，并判罚球点球。","appeal":"深圳新鹏城俱乐部申诉意见认为：本方队员不犯规，不应被判罚球点球。","concl":"对于此判例，评议组一致认为：深圳新鹏城22号队员防守中对对方队员犯规，裁判员在场回看后改判罚球点球的最终判罚正确。另外裁判员初始未判罚犯规，属于清晰明显的错误，因此VAR介入正确。","v":"correct","videos":["2025/i15c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250625/1750864513357600.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-98","t":"case","s":"2025","issue":15,"no":2,"seq":98,"comp":"中甲联赛","round":"第13轮","home":"南通支云","away":"辽宁铁人","minute":"28","desc":"判例二：中甲联赛第13轮，南通支云VS辽宁铁人，比赛第28分钟，南通支云14号队员在对方罚球区内疑似手臂触球，随后南通支云其他队员将球射入对方球门，裁判员判进球有效。","appeal":"辽宁铁人俱乐部申诉意见认为：对方队员手球犯规在先，进球应无效。","concl":"对于此判例，评议组一致认为：几个角度的视频画面均无法完全证实球与南通支云14号手臂是否有接触，裁判员当时所处的位置和观察角度很好。支持裁判员未判罚手球犯规以及后续进球有效的决定。","v":"correct","videos":["2025/i15c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250625/1750864554774517.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-99","t":"case","s":"2025","issue":15,"no":3,"seq":99,"comp":"中甲联赛","round":"第13轮","home":"南通支云","away":"辽宁铁人","minute":"74","desc":"判例三：中甲联赛第13轮，南通支云vs辽宁铁人，比赛第74分钟，南通支云队员疑似在本方罚球区内手臂触球，裁判员未判罚手球犯规。","appeal":"辽宁铁人俱乐部申诉意见认为：对方队员手球犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：南通支云队员的手臂向球移动并接触球，属于手球犯规。裁判员决定错误，漏判手球犯规和罚球点球。","v":"wrong","videos":["2025/i15c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250625/1750864599395306.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2025-100","t":"case","s":"2025","issue":15,"no":4,"seq":100,"comp":"中甲联赛","round":"第13轮","home":"延边龙鼎","away":"广西平果","minute":"67","desc":"判例四：中甲联赛第13轮，延边龙鼎vs广西平果，比赛第67分钟，广西平果9号队员在对方罚球区内倒地，裁判员未判罚犯规。","appeal":"广西平果俱乐部申诉意见认为：对方队员防守犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：从现有视频判断，延边龙鼎队防守队员触到了球，且动作合理，无犯规动作。裁判员未判罚犯规的决定正确。","v":"correct","videos":["2025/i15c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250625/1750864623396143.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-101","t":"case","s":"2025","issue":15,"no":5,"seq":101,"comp":"中甲联赛","round":"第13轮","home":"延边龙鼎","away":"广西平果","minute":"77","desc":"判例五：中甲联赛第13轮，延边龙鼎vs广西平果，比赛第77分钟，延边龙鼎33号队员铲抢广西平果19号队员，裁判员与第四官员沟通后，判延边龙鼎33号犯规并出示黄牌。","appeal":"广西平果俱乐部申诉意见认为：对方队员实施暴力行为，应出示红牌。","concl":"对于此判例，评议组多数成员认为：延边龙鼎33号队员的犯规动作速度强度较高，使用了过分力量，冲撞对方腿部膝关节附近部位，危及对方安全，应视为严重犯规，并出示红牌罚令出场。裁判员出示黄牌的决定错误，漏判红牌。","v":"wrong","videos":["2025/i15c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250625/1750864657223703.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2025-102","t":"case","s":"2025","issue":15,"no":6,"seq":102,"comp":"全运会","round":"","home":"四川","away":"云南","minute":"6","desc":"判例六：中华人民共和国第十五届运动会男子足球U18组资格赛，四川VS云南，比赛第6分钟，云南队进球，裁判员判罚进球前云南队8号队员推人犯规，进球无效。","appeal":"云南队申诉意见认为：本方队员争抢时不犯规，进球应该有效。","concl":"对于此判例，评议组一致认为：双方队员在罚球区内争抢位置时相互有肢体动作接触，也未出现影响四川队守门员或其他队员争抢球的犯规动作。裁判员判罚攻方犯规以及取消进球的决定错误。","v":"wrong","videos":["2025/i15c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250625/1750864693791099.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-103","t":"case","s":"2025","issue":15,"no":7,"seq":103,"comp":"全运会","round":"","home":"四川","away":"云南","minute":"42","desc":"判例七：中华人民共和国第十五届运动会男子足球U18组资格赛，四川VS云南，比赛第42分钟，云南队队员在对方罚球区内倒地，裁判员未判罚犯规。","appeal":"云南队申诉意见认为：对方队员犯规，应判罚球点球。","concl":"对于此判例，评议组多数成员认为：四川队防守队员铲球时，拦截和接触到了球，但通过现有视频无法准确判断防守队员铲球时触球和接触进攻队员的先后顺序，以及接触进攻队员时的具体情况是否属于犯规。裁判员在该接触发生时所处的位置较远，评议组无法判断其做出的决定是否正确。在判断裁判员的决定正确与否的主要依据不足的情况下，评议组对此判例判罚是否正确不做认定。","v":"pending","videos":["2025/i15c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250625/1750864719294240.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）"},{"k":"2025-104","t":"case","s":"2025","issue":15,"no":8,"seq":104,"comp":"女超联赛","round":"第8轮","home":"江苏无锡女足","away":"广东省女足","minute":"73","desc":"判例八：女超联赛第8轮，江苏无锡女足VS广东省女足。比赛第73分钟，广东省女足远射，球进入球网后被球门后方的场外立柱反弹回场地，裁判员认为球未进门，示意比赛继续。","appeal":"广东省女足申诉意见认为：本队已进球。","concl":"对于此判例，评议组一致确认广东队已进球。裁判员决定错误。","v":"wrong","videos":["2025/i15c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250625/1750864756935806.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-105","t":"case","s":"2025","issue":15,"no":9,"seq":105,"comp":"女超联赛","round":"第10轮","home":"广东省女足","away":"辽宁沈北禾丰女足","minute":"","desc":"判例九：女超联赛第10轮，广东省女足VS辽宁沈北禾丰女足。比赛第90+4分钟，广东省女足在前场踢出任意球，球传至辽宁沈北禾丰女足罚球区内，广东省女足10号队员头顶球进球，助理裁判员举旗示意越位，裁判员判广东省女足越位犯规，进球无效。","appeal":"广东省女足申诉意见认为：本队队员不越位，进球应有效。","concl":"对于此判例，评议组一致认为：在任意球踢出的瞬间，广东省女足10号和11号队员是否处于越位位置，在现有视频的角度中无法准确判断。但助理裁判员的观察位置很好，支持助理裁判员做出的越位判断，以及裁判员做出的越位犯规、进球无效的决定。","v":"correct","videos":["2025/i15c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250625/1750864793216213.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-106","t":"case","s":"2025","issue":15,"no":10,"seq":106,"comp":"全运会","round":"","home":"广东","away":"浙江俱乐部绿城","minute":"19","desc":"判例十：中华人民共和国第十五届运动会女子足球U18组决赛阶段比赛，广东VS浙江，比赛第19分钟，广东队16号队员在对方罚球区内停球后向前进攻，与对方队员接触后倒地。裁判员未判罚犯规。","appeal":"广东队申诉意见认为：对方队员防守犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：浙江队3号队员抢截犯规，应判罚球点球。裁判员决定错误，漏判守方犯规和罚球点球。","v":"wrong","videos":["2025/i15c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250625/1750864825776380.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-107","t":"case","s":"2025","issue":15,"no":11,"seq":107,"comp":"全运会","round":"","home":"广东","away":"陕西","minute":"67","desc":"判例十一：中华人民共和国第十五届运动会女子足球U18组决赛阶段比赛，广东VS陕西，比赛第67分钟，广东队8号队员在对方罚球区内横向带球，与对方队员接触后倒地。裁判员未判罚犯规。","appeal":"广东队申诉意见认为：对方队员防守犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：从现有视频看，陕西队28号队员防守时未触到球，并且在本方罚球区内绊摔对方队员犯规，应判罚球点球。裁判员决定错误，漏判守方犯规和罚球点球。","v":"wrong","videos":["2025/i15c11-1.mp4"],"vurls":[ ,"minute":"65","desc":"判例四：中超联赛第15轮，上海申花VS天津津门虎，比赛第65分钟，上海申花9号队员在对方罚球区内与天津津门虎11号队员发生接触后倒地，裁判员未判罚犯规，VAR未介入。","appeal":"上海申花俱乐部申诉意见认为：对方队员犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：从现有视频的角度看，双方队员有相互争抢位置动作，但无法证明任何一方有明显的犯规行为。支持裁判员做出的不犯规的决定，VAR未介入正确。","v":"correct","videos":["2025/i16c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250703/1751544432194920.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-112","t":"case","s":"2025","issue":16,"no":5,"seq":112,"comp":"中甲联赛","round":"第14轮","home":"苏州东吴","away":"重庆铜梁龙","minute":"51","desc":"判例五：中甲联赛第14轮，苏州东吴vs重庆铜梁龙，比赛第51分钟，重庆铜梁龙队踢出角球后，同队队员头球进球，裁判员判进球有效。","appeal":"苏州东吴俱乐部申诉意见认为：对方处在越位位置的8号队员干扰本方队员，应构成越位犯规，进球无效。","concl":"对于此判例，评议组一致认为：重庆铜梁龙队员头顶球时，其8号队员处于越位位置，且争抢位置时的手部及身体动作影响了对方守门员处理球的能力，属于干扰对方队员的越位犯规情形。裁判员判进球有效的决定错误，漏判越位犯规。","v":"wrong","videos":["2025/i16c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250703/1751544495717839.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-113","t":"case","s":"2025","issue":16,"no":6,"seq":113,"comp":"中乙联赛","round":"第16轮","home":"广西恒宸","away":"深圳二零二八","minute":"63","desc":"判例六：中乙联赛第16轮，广西恒宸 vs深圳二零二八，比赛第63分钟，广西恒宸21号队员与深圳队55号队员争抢后倒地，深圳队55号倒地后疑似蹬踹对方队员，裁判判罚广西恒宸21号争抢球时犯规在先。","appeal":"广西恒宸俱乐部申诉意见认为：对方55号队员实施暴力行为，应被红牌罚令出场。","concl":"对于此判例，评议组首先一致认为：从现有视频来看，在双方队员倒地时，深圳二零二八55号有抬腿动作，但未构成过分或恶意蹬踹的程度，不应出示红牌。其次，评议组多数成员认为：此判例中裁判员对双方队员均未出示红黄牌的处理较为恰当，应予支持。","v":"correct","videos":["2025/i16c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250703/1751544550429580.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"none"}},{"k":"2025-114","t":"case","s":"2025","issue":16,"no":7,"seq":114,"comp":"中乙联赛","round":"第16轮","home":"广西恒宸","away":"深圳二零二八","minute":"","desc":"判例七：中乙联赛第16轮，广西恒宸 vs深圳二零二八，比赛第90+6分钟，广西恒宸42号队员在对方罚球区内与深圳队队员疑似有接触，随后广西恒宸42号倒地，裁判未判罚犯规。","appeal":"广西恒宸俱乐部申诉意见认为：对方队员犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：现有视频不能清晰展示广西恒宸42号队员向前突破时双方队员腿部的接触情况。目前判断接触较为轻微，广西恒宸42号倒地动作含夸张成分，裁判员未判罚犯规的决定应予支持。","v":"correct","videos":["2025/i16c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250703/1751544601987006.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-115","t":"case","s":"2025","issue":16,"no":8,"seq":115,"comp":"中乙联赛","round":"第16轮","home":"长春喜都","away":"山西崇德荣海","minute":"27","desc":"判例八：中乙联赛第16轮，长春喜都vs山西崇德荣海，比赛第27分钟，长春喜都队进攻中将球传中至对方罚球区内，长春喜都29号队员进球，裁判员判进球有效。","appeal":"山西崇德荣海俱乐部申诉意见认为：对方29号队员越位犯规，进球应无效。","concl":"对于此判例，评议组多数成员认为：从现有视频画面无法绝对判断长春喜都29号队员在同队队员传球时是否处于越位位置。支持裁判员做出的不是越位犯规的决定。","v":"correct","videos":["2025/i16c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250703/1751544644159718.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-116","t":"case","s":"2025","issue":17,"no":1,"seq":116,"comp":"中甲联赛","round":"第15轮","home":"南通支云","away":"广州豹","minute":"15","desc":"判例一：中甲联赛第15轮，南通支云vs广东广州豹，比赛第15分钟，南通支云10号队员进球。裁判员判南通支云10号争抢球时对广东广州豹15号队员犯规在先，进球无效。","appeal":"南通支云俱乐部申诉意见认为：本队队员争抢球时不犯规，进球应有效。","concl":"对于此判例，评议组多数成员认为：南通支云10号对广东广州豹15号身体接触时有推击动作，导致后者失去重心未能控球或争抢球。裁判员判南通支云10号犯规在先、进球无效的决定正确。","v":"correct","videos":["2025/i17c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250709/1752053589960964.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-117","t":"case","s":"2025","issue":17,"no":2,"seq":117,"comp":"中乙联赛","round":"第18轮","home":"赣州瑞狮","away":"温州俱乐部","minute":"69","desc":"判例二：中乙联赛第18轮，赣州瑞狮VS温州俱乐部中胤，比赛第69分钟，温州队10号队员进攻中在对方罚球区内与对方队员发生接触后倒地，裁判员判赣州瑞狮4号队员防守犯规，并判罚球点球。","appeal":"赣州瑞狮俱乐部申诉意见认为：本方队员不犯规，不应判罚球点球，同时认为对方队员假摔。","concl":"对于此判例，评议组多数成员认为：温州队10号球员伸脚触球动作合理，赣州瑞狮4号左腿跨入对方前进和触球路线，造成双方腿部接触和冲撞倒地，应视为犯规。支持裁判员判赣州瑞狮4号犯规并判罚球点球的决定。","v":"correct","videos":["2025/i17c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250709/1752053656607616.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-118","t":"case","s":"2025","issue":17,"no":3,"seq":118,"comp":"中乙联赛","round":"第18轮","home":"赣州瑞狮","away":"温州俱乐部","minute":"82","desc":"判例三：中乙联赛第18轮，赣州瑞狮VS温州俱乐部中胤，比赛第82分钟，温州队踢角球，随后由45号队员进球，裁判员判进球有效。","appeal":"赣州瑞狮俱乐部申诉意见认为：对方有队员越位犯规，进球应无效。","concl":"对于此判例，评议组一致认为：从现有视频判断，温州队45号队员射门触球时，其22号队员涉嫌越位，但并无绝对依据。更重要的是，温州队22号未符合干扰对方队员的认定条件，不属于越位犯规。裁判员判进球有效的决定正确。","v":"correct","videos":["2025/i17c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250709/1752053719194060.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-119","t":"case","s":"2025","issue":17,"no":4,"seq":119,"comp":"中乙联赛","round":"第18轮","home":"上海海港富盛经开","away":"湖北青年星","minute":"57","desc":"判例四：中乙联赛第18轮，上海海港富盛经开vs湖北青年星，比赛第57分钟，上海海港富盛经开52号队员射门，球击中湖北青年星球门立柱后，上海海港富盛经开7号队员补射进球，裁判员判进球有效。","appeal":"湖北青年星俱乐部申诉意见认为：对方52号射门时，裁判员移动路线阻挡了本方防守队员，间接导致对方随后进球。","concl":"对于此判例，评议组一致认为：裁判员的位置和移动客观上对湖北青年星队员形成了一定影响，但此情形不符合规则中裁判员必须停止比赛的条款，也并非导致该进球的决定性因素。此判例进球有效，但裁判员应提高自身选位跑位能力。","v":"correct","videos":["2025/i17c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250709/1752053782895082.mp4"],"cat":"other_program","catname":"程序与其他","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-120","t":"case","s":"2025","issue":17,"no":5,"seq":120,"comp":"中乙联赛","round":"第18轮","home":"上海海港富盛经开","away":"湖北青年星","minute":"83","desc":"判例五：中乙联赛第18轮，上海海港富盛经开vs湖北青年星，比赛第83分钟，湖北青年星队踢角球，随后在上海海港富盛经开罚球区内，守方队员疑似手臂接触球，裁判员未判罚手球犯规。","appeal":"湖北青年星俱乐部申诉意见认为：对方队员手球犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：现有视频无法清晰证明球是否接触了守方队员手臂，也无法确定手臂的具体动作和位置情况。裁判员临场的位置和观察角度好，支持裁判员做出的非手球犯规的决定。","v":"correct","videos":["2025/i17c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250709/1752053812578319.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2025-121","t":"case","s":"2025","issue":17,"no":6,"seq":121,"comp":"女甲联赛","round":"第7轮","home":"山西喜华女足","away":"福建南安成功女足","minute":"7","desc":"判例六：女甲联赛第7轮，山西喜华女足VS福建南安成功女足，比赛第7分钟，山西喜华6号队员进攻中带球进入对方罚球区，福建南安成功22号守门员出击，双方有接触，山西喜华6号倒地，裁判员未判罚犯规。","appeal":"山西喜华女足申诉意见认为：对方守门员恶意犯规，应判罚球点球并向其出示红牌罚令出场。","concl":"对于此判例，评议组一致认为：福建队守门员出击对对方队员犯规，破坏了对方明显进球得分机会。但该犯规不构成使用过分力量的严重犯规，且该犯规是以争抢球为目的，应判罚球点球并向守门员出示黄牌警告。裁判员决定错误，漏判罚球点球和黄牌。","v":"wrong","videos":["2025/i17c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250709/1752053839971693.mp4"],"cat":"dogso","catname":"破坏明显进球得分机会（DOGSO）","ans":{"r":"penalty","c":"yellow"}},{"k":"2025-122","t":"case","s":"2025","issue":17,"no":7,"seq":122,"comp":"女甲联赛","round":"第7轮","home":"山西喜华女足","away":"福建南安成功女足","minute":"51","desc":"判例七：女甲联赛第7轮，山西喜华女足VS福建南安成功女足，比赛第51分钟，山西喜华10号队员进球，裁判员判其越位犯规在先，进球无效。","appeal":"山西喜华俱乐部申诉意见认为：本方队员不越位。","concl":"对于此判例，评议组一致认为：从现有视频角度判断，山西喜华10号在同队队员传球时并未处于越位位置。助理裁判员示意越位，以及裁判员判罚越位犯规和进球无效的决定均为错误。","v":"wrong","videos":["2025/i17c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250709/1752053862734018.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-123","t":"case","s":"2025","issue":18,"no":1,"seq":123,"comp":"中乙联赛","round":"第12轮","home":"赣州瑞狮","away":"泉州亚新","minute":"80","desc":"判例一：中乙联赛第12轮（补赛），赣州瑞狮VS泉州亚新，比赛第80分钟，赣州瑞狮25号队员在对方罚球区内与泉州亚新3号队员争抢球，裁判员判泉州亚新3号手球犯规并判罚球点球。","appeal":"泉州亚新俱乐部申诉意见认为：对方25号队员在争抢球时对本方3号队员实施了鲁莽的犯规，应判罚犯规并给予黄牌警告，不应判本队3号队员的手球犯规以及罚球点球。","concl":"对于此判例，评议组多数成员认为：赣州瑞狮25号队员争抢球的动作合理，不属于犯规；泉州亚新3号队员手臂有向球移动的动作并触及球，应判罚手球犯规。裁判员判手球犯规、罚球点球的决定正确。","v":"correct","videos":["2025/i18c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250718/1752804089295778.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2025-124","t":"case","s":"2025","issue":18,"no":2,"seq":124,"comp":"中乙联赛","round":"第19轮","home":"广东铭途","away":"温州俱乐部","minute":"72","desc":"判例二：中乙联赛第19轮，广东铭途VS温州俱乐部中胤，比赛第72分钟，双方队员在温州队罚球区附近争抢球后，温州队得球并展开反击，球传至广东铭途罚球区内，广东铭途守门员出击并与对方队员发生接触，裁判员判广东铭途守门员犯规并判罚球点球。","appeal":"广东铭途俱乐部申诉意见认为：双方在温州队罚球区附近争抢球时，对方58号队员对本队42号队员犯规在先，裁判员未判罚，导致对方得球反击并获得罚球点球机会。","concl":"对于此判例，评议组一致认为：温州队58号队员的动作属于比赛中的正常争抢动作，并且触及球，不属于犯规。之后温州队进攻至广东铭途罚球区内，广东铭途守门员出击后绊摔对方队员犯规，裁判员判罚球点球的决定正确。","v":"correct","videos":["2025/i18c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250718/1752804245997124.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-125","t":"case","s":"2025","issue":18,"no":3,"seq":125,"comp":"中乙联赛","round":"第19轮","home":"广东铭途","away":"温州俱乐部","minute":"","desc":"判例三：中乙联赛第19轮，广东铭途VS温州俱乐部中胤，比赛第90+6分钟，广东铭途队踢角球，角球发出后，温州队37号守门员与广东铭途4号队员在罚球区内发生身体接触，裁判未判罚犯规。","appeal":"广东铭途俱乐部申诉意见认为：温州队守门员在未触及球的情况下击倒本方队员，本方应获得罚球点球，对方守门员应被出示红牌。","concl":"对于此判例，评议组一致认为：从现有视频判断，温州队守门员无犯规动作，裁判员未判罚其犯规的决定应予支持。","v":"correct","videos":["2025/i18c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250718/1752804407772656.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-126","t":"case","s":"2025","issue":18,"no":4,"seq":126,"comp":"中乙联赛","round":"第19轮","home":"山东泰山B队","away":"杭州临平吴越","minute":"23","desc":"判例四：中乙联赛第19轮，山东泰山B队VS杭州临平吴越，比赛第23分钟，杭州临平吴越27号队员在本方罚球区线附近对山东泰山B队72号队员实施犯规，裁判员认定犯规地点在杭州临平吴越罚球区内，并判罚球点球。","appeal":"","concl":"杭州临平吴越俱乐部在申诉中提及本队队员犯规地点在罚球区外。\n对于此判例，评议组一致认为：从现有视频看，该犯规发生的地点在罚球区外，应判罚直接任意球，裁判员判罚球点球的决定错误。","v":"wrong","videos":["2025/i18c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250718/1752804487824202.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"directfk","c":"none"}},{"k":"2025-127","t":"case","s":"2025","issue":18,"no":5,"seq":127,"comp":"中乙联赛","round":"第19轮","home":"山东泰山B队","away":"杭州临平吴越","minute":"33","desc":"判例五：中乙联赛第19轮，山东泰山B队VS杭州临平吴越，比赛第33分钟，杭州临平吴越29号队员进攻中接本队传球突入对方罚球区，山东泰山B队69号队员铲球，杭州临平吴越29号倒地，裁判员未判罚犯规。","appeal":"杭州临平吴越俱乐部申诉意见认为：对方犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：山东泰山B队69号队员铲球动作合理，从视频上看应为成功触到球，也无其他犯规动作。裁判员未判罚其犯规的决定正确。","v":"correct","videos":["2025/i18c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250718/1752804512811306.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-128","t":"case","s":"2025","issue":18,"no":6,"seq":128,"comp":"中乙联赛","round":"第19轮","home":"山东泰山B队","away":"杭州临平吴越","minute":"87","desc":"判例六：中乙联赛第19轮，山东泰山B队VS杭州临平吴越，比赛第87分钟，山东泰山B队49号队员进球，助理裁判员未示意越位，裁判员判进球有效。","appeal":"","concl":"杭州临平吴越俱乐部在申诉中提及对方49号队员在越位位置回接射门进球。\n对于此判例，评议组一致认为：从现有视频的角度看，基本可以判断山东泰山B队49号队员在本方队员传中时处于越位位置，随后射门得分，属于在越位位置干扰比赛的越位犯规，进球无效。裁判员判进球有效的决定错误，漏判攻方越位犯规。","v":"wrong","videos":["2025/i18c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250718/1752804562247253.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-129","t":"case","s":"2025","issue":18,"no":7,"seq":129,"comp":"女甲联赛","round":"第8轮","home":"同济海港女足","away":"天津圣德女足","minute":"32","desc":"判例七：女甲联赛第8轮，同济海港女足VS天津圣德女足，比赛第32分钟，天津圣德女足进攻中传中，本队队员头顶球进球，助理裁判员举旗示意越位，裁判员判进球队员越位犯规在先，进球无效。","appeal":"天津圣德女足申诉意见认为：本方队员不越位。","concl":"对于此判例，评议组一致认为：从现有视频角度无法准确判断天津圣德女足头球进球的队员在本方队员传球时是否处于越位位置。但助理裁判员当时的位置较好，对于其做出的越位判罚，以及裁判员做出的越位犯规进球无效的决定，应予支持。","v":"correct","videos":["2025/i18c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250718/1752804603392104.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-130","t":"case","s":"2025","issue":18,"no":8,"seq":130,"comp":"女甲联赛","round":"第8轮","home":"同济海港女足","away":"天津圣德女足","minute":"","desc":"判例八：女甲联赛第8轮，同济海港女足VS天津圣德女足，比赛第45+1分钟，天津圣德女足队员在向对方罚球区内突破时与对方发生接触后倒地，裁判员未判罚犯规。","appeal":"天津圣德女足申诉意见认为：对方队员在罚球区内犯规。","concl":"对于此判例，评议组一致认为：从现有视频无法看清双方队员的位置、控球、接触等情况，评议组对此判例不予评议认定。","v":"pending","videos":["2025/i18c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250718/1752804637130528.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）"},{"k":"2025-131","t":"case","s":"2025","issue":19,"no":1,"seq":131,"comp":"中甲联赛","round":"第17轮","home":"石家庄功夫","away":"南通支云","minute":"56","desc":"判例一：中甲联赛第17轮，石家庄功夫VS南通支云，比赛第56分钟，南通支云23号队员在本方罚球区内防守铲球时手臂触球，裁判员初始未判罚手球犯规，后经征询第四官员意见后，判罚南通支云23号手球犯规，由石家庄功夫队踢罚球点球。","appeal":"","concl":"南通支云俱乐部在申诉中质疑第四官员协助以及裁判员改判的结果。\n对于此判例，评议组一致认为：南通支云23号队员倒地铲球时手臂有不自然扩大的附加动作，构成手球犯规。裁判员在与第四官员商议后判罚手球犯规以及罚球点球的决定正确、合规。","v":"correct","videos":["2025/i19c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250724/1753317926805253.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2025-132","t":"case","s":"2025","issue":19,"no":2,"seq":132,"comp":"中甲联赛","round":"第17轮","home":"石家庄功夫","away":"南通支云","minute":"89","desc":"判例二：中甲联赛第17轮，石家庄功夫VS南通支云，比赛第89分钟，南通支云20号队员与对方守门员争抢球后射门进球，裁判员判其与守门员争抢球时犯规，进球无效。","appeal":"南通支云俱乐部申诉意见认为：本队20号队员与对方守门员争抢球时不犯规。","concl":"对于此判例，评议组多数成员认为：从现有视频画面判断，石家庄功夫队守门员双手触球时已构成用手控制球，南通支云20号队员与之争抢属于犯规。支持裁判员做出的南通支云20号犯规在先、进球无效的决定。","v":"correct","videos":["2025/i19c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250724/1753317964211990.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-133","t":"case","s":"2025","issue":19,"no":3,"seq":133,"comp":"中甲联赛","round":"第17轮","home":"苏州东吴","away":"佛山南狮","minute":"76","desc":"判例三：中甲联赛第17轮，苏州东吴VS佛山南狮，比赛第76分钟，佛山南狮24号队员在本方罚球区内疑似手球，裁判员未判罚手球犯规。","appeal":"苏州东吴俱乐部申诉意见认为：对方队员手球犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：佛山南狮24号队员在本方罚球区内跳起争抢球，手臂的扩张属于此情形下的正常动作和自然结果，苏州东吴队员头顶球后，球反弹至佛山南狮24号手臂，属于意外手球，不构成手球犯规。裁判员未判罚手球犯规的决定正确。","v":"correct","videos":["2025/i19c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250724/1753318005926905.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2025-134","t":"case","s":"2025","issue":19,"no":4,"seq":134,"comp":"中甲联赛","round":"第17轮","home":"南京城市","away":"广西平果","minute":"87","desc":"判例四：中甲联赛第17轮，南京城市VS广西平果，比赛第87分钟，南京城市进球，裁判员判进球有效。","appeal":"广西平果俱乐部申诉意见认为：对方5号队员头球后蹭后，对方10号队员触球时对方42号队员处于越位位置，进球应无效。","concl":"对于此判例，评议组一致认为：攻方南京城市5号队员头顶球时，攻方队员均未处于越位位置；随后，从现有各角度的视频判断，未显示出南京城市10号队员有触到球的迹象，后续南京城市42号队员进球，不存在越位犯规。支持裁判员做出的进球有效的决定。","v":"correct","videos":["2025/i19c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250724/1753318047675098.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-135","t":"case","s":"2025","issue":19,"no":5,"seq":135,"comp":"中乙联赛","round":"第20轮","home":"兰州陇原竞技","away":"山西崇德荣海","minute":"68","desc":"判例五：中乙联赛第20轮，兰州陇原竞技VS山西崇德荣海，比赛第68分钟，山西崇德荣海36号队员在本方罚球区疑似手球，裁判员未判罚手球犯规。","appeal":"兰州陇原竞技俱乐部申诉意见认为：对方队员手球犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：山西崇德荣海36号队员手臂展开使身体不自然变大，在对方队员头顶球后未及时回收躲避，其手臂接触球应视为手球犯规，并判罚球点球。裁判员决定错误，漏判手球犯规和罚球点球。","v":"wrong","videos":["2025/i19c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250724/1753318083665752.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2025-136","t":"case","s":"2025","issue":19,"no":6,"seq":136,"comp":"中乙联赛","round":"第20轮","home":"无锡吴钩","away":"长春喜都","minute":"32","desc":"判例六：中乙联赛第20轮，无锡吴钩VS长春喜都，比赛第32分钟，无锡吴钩30号队员在对方罚球区内争抢位置时与长春喜都29号队员接触后倒地，裁判员未判罚犯规。","appeal":"无锡吴钩俱乐部申诉意见认为：对方29号队员拉扯抱摔本队30号队员，应判罚球点球。","concl":"对于此判例，评议组多数成员认为：长春喜都29号队员在本方罚球区内防守对方30号队员时，进行了持续的环抱和拉扯并造成后者倒地，不属于正常争抢位置的防守动作，应视为拉扯犯规并判罚球点球。裁判员决定错误，漏判犯规和罚球点球。","v":"wrong","videos":["2025/i19c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250724/1753318122660478.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-137","t":"case","s":"2025","issue":19,"no":7,"seq":137,"comp":"女超联赛","round":"第11轮","home":"河南万仙山女足","away":"广东省女足","minute":"26","desc":"判例七：女超联赛第11轮，河南万仙山女足VS广东省女足，比赛第26分钟，河南万仙山女足29号队员在对方罚球区内接球，广东队17号队员倒地铲球，河南队29号倒地，裁判员判广东队17号犯规，并判罚球点球。","appeal":"广东省女足申诉意见认为：本队队员不犯规，裁判员错判罚球点球。","concl":"对于此判例，评议组一致认为：虽然河南万仙山女足29号队员接球时率先触球，但球仍处于对方可争抢的范围内，广东省女足17号队员防守时的铲球动作合理，先触到球后因惯性接触攻方队员，且无附加犯规动作，不构成犯规。裁判员决定错误，错判罚球点球。","v":"wrong","videos":["2025/i19c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250724/1753318157540849.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-138","t":"case","s":"2025","issue":20,"no":1,"seq":138,"comp":"中超联赛","round":"第18轮","home":"上海申花","away":"河南俱乐部","minute":"","desc":"判例一：中超联赛第18轮，上海申花VS河南俱乐部酒祖杜康，比赛第45+7分钟，上海申花队进球，进球前上海申花9号队员疑似手臂触球。裁判员判进球有效，VAR未介入。","appeal":"河南俱乐部申诉意见认为：对方9号队员手球犯规在先，后续进球应无效。","concl":"对于此判例，评议组一致认为：上海申花9号队员手臂触球，但属于手臂在自然位置的意外手球，随后上海申花同队队员进球，而非手球队员立即进球，按照竞赛规则，不构成手球犯规，后续进球有效。裁判员决定正确。VAR未介入正确。","v":"correct","videos":["2025/i20c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250730/1.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-139","t":"case","s":"2025","issue":20,"no":2,"seq":139,"comp":"中超联赛","round":"第18轮","home":"上海申花","away":"河南俱乐部","minute":"","desc":"判例二：中超联赛第18轮，上海申花VS河南俱乐部酒祖杜康，比赛第90+8分钟，河南俱乐部酒祖杜康队踢出角球后，助理裁判员示意球的整体已离开比赛场地（出界），裁判员鸣哨停止比赛，之后河南队队员将球踢进对方球门。","appeal":"河南俱乐部申诉意见认为：本队踢出的角球并未出界，助理裁判员举旗以及裁判员停止比赛的时机不正确，导致本队随后获得射门得分机会后，VAR无法介入。","concl":"对于此判例，评议组首先一致认为：从VAR视频镜头看，角球踢出后，球的整体已经在空中越过球门线离开比赛场地（出界），在此判例的判罚结果认定上，助理裁判员判断正确，裁判员决定正确，后续进球无效，VAR无需介入。另外，评议组指出：在类似情况下，助理裁判员应延迟举旗示意，裁判员应延迟鸣哨停止比赛，以便在VAR查看中如果发现出现清晰明显错误时可以介入。","v":"correct","videos":["2025/i20c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250730/2.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-140","t":"case","s":"2025","issue":20,"no":3,"seq":140,"comp":"中超联赛","round":"第18轮","home":"上海申花","away":"河南俱乐部","minute":"","desc":"判例三：中超联赛第18轮，上海申花VS河南俱乐部酒祖杜康，比赛第45+1分钟，上海申花13号队员在本方罚球区线附近对对方11号队员犯规，裁判员初始决定认为犯规地点在罚球区外，判直接任意球。VAR查看后认为犯规地点在罚球区内，并介入，裁判员直接改判为罚球点球。","appeal":"","concl":"此判例无俱乐部申诉，但围绕是否犯规、犯规地点是否在罚球区内、裁判员没有现场回看而作出处罚是否合规等引起较多关注，故评议组评议解读此判例。\n对于此判例，评议组多数成员认为：上海申花13号队员的动作构成犯规，且认为犯规地点在本方罚球区内（按照竞赛规则，罚球区线也视为罚球区内）。VAR查看后认为，裁判员对犯规地点的客观事实认定错误，应该介入。此类情况下，按照竞赛规则以及VAR操作规范的有关规定，在VAR介入后，裁判员可以不执行在场回看，而根据VAR回看分析提供的结果直接作出最终决定。此判例裁判员改判罚球点球的决定正确，VAR介入正确。\n另外，评议组指出：即使裁判员未进行在场回看，也应在做出最终决定前做出“电视示意信号”手势，以示意该最终决定是由VAR回看分析后做出的。此判例中裁判员遗漏了该手势。","v":"correct","videos":["2025/i20c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250730/3.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-141","t":"case","s":"2025","issue":20,"no":4,"seq":141,"comp":"中甲联赛","round":"第18轮","home":"南通支云","away":"南京城市","minute":"24","desc":"判例四：中甲联赛第18轮，南通支云VS南京城市，比赛第24分钟，南京城市队踢出角球后，南京城市队员与南通支云守门员有身体接触，随后球进门，裁判员判罚南京城市队员对对方守门员犯规在先，进球无效。","appeal":"南京城市俱乐部申诉意见认为：本队不犯规，进球应有效。","concl":"对于此判例，评议组一致认为：角球踢出时，南京城市队员与对方守门员尚有一定距离，且背对守门员，做出正常争抢球的动作。南通支云守门员向斜上方跳起争抢球，双方接触不属于犯规，后续进球有效。裁判员判攻方犯规、进球无效的决定均为错误。","v":"wrong","videos":["2025/i20c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250730/4.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-142","t":"case","s":"2025","issue":20,"no":5,"seq":142,"comp":"中甲联赛","round":"第18轮","home":"南通支云","away":"南京城市","minute":"","desc":"判例五：中甲联赛第18轮，南通支云VS南京城市，比赛第90+5分钟，南京城市19号队员对南通支云10号队员犯规，后者随后有试图击打前者的动作，裁判员以非体育行为为由对南通支云10号出示黄牌警告。","appeal":"南京城市俱乐部申诉意见认为：对方10号队员故意用手击打本方队员面部，属于暴力行为，应被红牌罚令出场。","concl":"对于此判例，评议组多数成员认为：南通支云10号队员被犯规后，企图击打对方队员，属于野蛮动作，按照竞赛规则，无论是否击打到对方队员，均应被视为暴力行为并被出示红牌罚令出场。另外，评议组指出：南京城市19号队员的犯规动作应以非体育行为为由予以黄牌警告。裁判员决定错误，漏判南京城市19号黄牌，漏判南通支云10号红牌。","v":"wrong","videos":["2025/i20c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250730/5.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2025-143","t":"case","s":"2025","issue":20,"no":6,"seq":143,"comp":"中乙联赛","round":"第21轮","home":"杭州临平吴越","away":"无锡吴钩","minute":"","desc":"判例六：中乙联赛第21轮，杭州临平吴越VS无锡吴钩，比赛第90+4分钟，杭州临平吴越队员进攻中下底传中，同队队员头球进球，助理裁判员示意传中过程中球的整体已离开比赛场地（出界），裁判员判进球无效。","appeal":"杭州临平吴越俱乐部申诉意见认为：本方传中时球并未出界，后续进球应有效。","concl":"对于此判例，评议组一致认为：现有视频角度无法证明球在空中运行过程中是否已经整体离开比赛场地（出界），助理裁判员在此时并未完全到达球门线齐平位置，做出的判断无说服力，评议组对此判例不予认定和评议。","v":"pending","videos":["2025/i20c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250730/6.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款"},{"k":"2025-144","t":"case","s":"2025","issue":20,"no":7,"seq":144,"comp":"中乙联赛","round":"第21轮","home":"湖北青年星","away":"江西庐山","minute":"74","desc":"判例七：中乙联赛第21轮，湖北青年星VS江西庐山，比赛第74分钟，湖北青年星46号队员与江西庐山29号队员在争抢球过程中发生身体接触。随后湖北青年星46号倒地，疑似被江西庐山29号踩踏，裁判员判江西庐山29号犯规，未出示红黄牌。","appeal":"湖北青年星俱乐部申诉意见认为：对方29号队员对本方46号队员有踩踏动作，属于暴力行为，应被出示红牌罚令出场。","concl":"对于此判例，评议组一致认为：现有视频的角度和距离，对于双方接触后落地的情况展现不清晰，不能证明江西庐山29号队员在犯规后有恶意或故意的踩踏动作或明显的附加动作。对裁判员未出示红黄牌的决定应予支持。","v":"correct","videos":["2025/i20c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250730/7.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2025-145","t":"case","s":"2025","issue":20,"no":8,"seq":145,"comp":"中乙联赛","round":"第21轮","home":"湖北青年星","away":"江西庐山","minute":"","desc":"判例八：中乙联赛第21轮，湖北青年星VS江西庐山，比赛第90+7分钟，湖北青年星3号队员在本方罚球区内防守江西庐山队4号队员时，后者倒地，裁判员判湖北青年星3号犯规并判罚球点球。","appeal":"湖北青年星俱乐部申诉意见认为：本方队员不犯规，不应被判罚球点球。","concl":"对于此判例，评议组一致认为：湖北青年星3号队员防守时与对方接触的力量和幅度有限，并非江西庐山队4号队员倒地的主要原因，属于比赛中可接受的接触，江西庐山队4号队员借助接触主动倒地。双方均不犯规。裁判员判守方犯规及罚球点球的决定错误。","v":"wrong","videos":["2025/i20c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250730/8.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-146","t":"case","s":"2025","issue":20,"no":9,"seq":146,"comp":"中乙联赛","round":"第21轮","home":"赣州瑞狮","away":"武汉三镇B队","minute":"74","desc":"判例九：中乙联赛第21轮，赣州瑞狮VS武汉三镇B队，比赛第74分钟，赣州瑞狮59号队员在对方罚球区内与武汉三镇B队守门员争抢球，守门员倒地后，赣州瑞狮队射门进球，裁判员判进球有效。","appeal":"武汉三镇俱乐部申诉意见认为：对方59号对本方守门员犯规在先，进球应无效。","concl":"对于此判例，评议组一致认为：武汉三镇B队守门员率先触球，赣州瑞狮59号队员的争抢动作未顾及可能对对方队员造成的危险，应视为鲁莽犯规，并出示黄牌，后续进球无效。裁判员判进球有效的决定错误，漏判赣州瑞狮59号犯规和黄牌。","v":"wrong","videos":["2025/i20c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250730/9.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_invalid","c":"yellow"}},{"k":"2025-147","t":"case","s":"2025","issue":20,"no":10,"seq":147,"comp":"中乙联赛","round":"第21轮","home":"赣州瑞狮","away":"武汉三镇B队","minute":"","desc":"判例十：中乙联赛第21轮，赣州瑞狮VS武汉三镇B队，比赛第90+3分钟，赣州瑞狮守门员在本方罚球区内争抢球时与对方队员有接触，裁判员判武汉三镇B队队员犯规。","appeal":"武汉三镇俱乐部申诉意见认为：对方守门员对本方队员犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：武汉三镇B队进攻队员正常做出争抢球动作，不构成犯规。赣州瑞狮守门员出击未触球并对对方队员实施草率的犯规。应判赣州瑞狮守门员犯规并判罚球点球。裁判员决定错误，错判武汉三镇B队队员犯规，漏判赣州瑞狮守门员犯规和罚球点球。","v":"wrong","videos":["2025/i20c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250730/10.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-148","t":"case","s":"2025","issue":20,"no":11,"seq":148,"comp":"中乙联赛","round":"第21轮","home":"广东铭途","away":"昆明城星","minute":"","desc":"判例十一：中乙联赛第21轮，广东铭途VS昆明城星，比赛第90+2分钟，广东铭途9号队员在对方罚球区内与对方守门员争抢球时有接触，裁判员判广东铭途9号犯规，随后广东铭途67号将球打进对方球门，裁判员判罚进球无效。","appeal":"广东铭途俱乐部申诉意见认为：本方9号不犯规，后续进球应有效。","concl":"对于此判例，评议组一致认为：昆明城星守门员出击并已经用手控球，广东铭途9号与其争抢犯规，后续进球无效。裁判员判广东铭途9号犯规以及后续进球无效的决定正确。","v":"correct","videos":["2025/i20c11-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250730/11.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-149","t":"case","s":"2025","issue":20,"no":12,"seq":149,"comp":"中乙联赛","round":"第21轮","home":"广东铭途","away":"昆明城星","minute":"","desc":"判例十二：中乙联赛第21轮，广东铭途VS昆明城星，比赛第90+6分钟，广东铭途队进攻中传中，昆明城星队员在本方罚球区内铲球防守时，疑似手臂接触球，裁判员未判罚手球犯规。","appeal":"广东铭途俱乐部申诉意见认为：对方队员手球犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：昆明城星队员在本方罚球区内铲球后，球接触其手臂，其手臂处于铲球时起支撑作用的自然张开状态，属于合理位置，不构成手球犯规。裁判员未判罚手球犯规的决定正确。","v":"correct","videos":["2025/i20c12-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250730/12.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2025-150","t":"case","s":"2025","issue":21,"no":1,"seq":150,"comp":"中超联赛","round":"第19轮","home":"青岛西海岸","away":"河南俱乐部","minute":"90","desc":"判例一：中超联赛第19轮，青岛西海岸VS河南酒祖杜康，比赛第90分钟，河南队15号队员在对方罚球区内与青岛西海岸6号队员发生接触后倒地。裁判员未判罚犯规。VAR未介入。","appeal":"河南俱乐部申诉意见认为：对方6号对本方15号犯规，并且破坏了本队一次极佳的得分机会。","concl":"对于此判例，评议组首先一致认为：青岛西海岸6号队员在防守时草率地踢人犯规，应判罚球点球。其次评议组多数成员认为：裁判员漏判罚球点球，VAR应该介入。此判例裁判员决定错误，漏判罚球点球。VAR未介入错误。","v":"wrong","videos":["2025/i21c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250806/1.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-151","t":"case","s":"2025","issue":21,"no":2,"seq":151,"comp":"中超联赛","round":"第19轮","home":"大连英博","away":"青岛海牛","minute":"31","desc":"判例二：中超联赛第19轮，大连英博海发VS青岛海牛，比赛第31分钟，大连英博海发队进球。裁判员判进球有效。VAR未介入。","appeal":"青岛海牛俱乐部申诉意见认为：对方11号队员在争抢球时对本方8号队员犯规，并获得控球权，导致之后发展为进球，应判对方11号犯规在先，进球无效。","concl":"对于此判例，
