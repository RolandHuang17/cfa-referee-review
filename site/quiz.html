评议组一致认为：大连英博海发11号队员在两次与对方队员争抢球的过程中均不构成犯规。之后的进球有效。裁判员决定正确。VAR未介入正确。","v":"correct","videos":["2025/i21c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250806/2.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-152","t":"case","s":"2025","issue":21,"no":3,"seq":152,"comp":"中超联赛","round":"第19轮","home":"大连英博","away":"青岛海牛","minute":"69","desc":"判例三：中超联赛第19轮，大连英博海发VS青岛海牛，比赛第69分钟，大连英博海发5号队员在本方罚球区内疑似手臂触球。裁判员未判罚手球犯规。VAR未介入。","appeal":"青岛海牛俱乐部申诉意见认为：对方5号手球犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：在青岛海牛队员踢球时，球触及近距离的大连英博海发5号队员手臂，当时其手臂处于自然位置，属于意外手球，不属于手球犯规。裁判员未判罚手球犯规的决定正确。VAR未介入正确。","v":"correct","videos":["2025/i21c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250806/3.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2025-153","t":"case","s":"2025","issue":21,"no":4,"seq":153,"comp":"中超联赛","round":"第19轮","home":"武汉三镇","away":"长春亚泰","minute":"","desc":"判例四：中超联赛第19轮，武汉三镇VS长春亚泰。比赛第45+7分钟，武汉三镇9号队员在对方罚球区内与长春亚泰2号队员发生接触后倒地。裁判员未判罚犯规。VAR未介入。","appeal":"武汉三镇俱乐部申诉意见认为：对方2号对本方9号犯规，应判罚球点球，并以破坏明显进球得分机会为由，向对方2号出示红牌罚令出场。","concl":"对于此判例，评议组多数成员认为：双方队员在罚球区内争抢位置时有互相对抗拉扯的动作，在此情形中均不构成犯规。裁判员未判罚犯规的决定正确。VAR未介入正确。","v":"correct","videos":["2025/i21c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250806/4.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-154","t":"case","s":"2025","issue":21,"no":5,"seq":154,"comp":"中超联赛","round":"第19轮","home":"武汉三镇","away":"长春亚泰","minute":"61","desc":"判例五：中超联赛第19轮，武汉三镇VS长春亚泰。比赛第61分钟，武汉三镇7号队员进攻中在对方罚球区内与长春亚泰17号队员发生接触后倒地。裁判员未判罚犯规。VAR未介入。","appeal":"武汉三镇俱乐部申诉意见认为：对方17号对本方7号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：长春亚泰17号队员的动作属于比赛中可接受程度的接触，武汉三镇7号队员也有借助该接触主动倒地的成分，守方不构成犯规。裁判员未判罚犯规的决定正确。VAR未介入正确。","v":"correct","videos":["2025/i21c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250806/5.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-155","t":"case","s":"2025","issue":21,"no":6,"seq":155,"comp":"中超联赛","round":"第19轮","home":"云南玉昆","away":"上海申花","minute":"77","desc":"判例六：中超联赛第19轮，云南玉昆VS上海申花，比赛第77分钟，上海申花队进球，裁判员判进球有效。VAR未介入。进球前上海申花队疑似有队员处于越位位置。","appeal":"","concl":"此判例无俱乐部申诉，但围绕上海申花队处于越位位置的队员是否构成越位犯规，以及随后进球是否有效的问题，引起较多关注，故评议组评议解读此判例。\n对于此判例，评议组多数成员认为：在上海申花队向对方罚球区传球的触球瞬间，其20号队员处于越位位置，但20号跑动路线与对方队员没有接触或者仅有轻微接触，未影响对方队员处理球或争抢球的能力，传球落点与二人也有一定距离，因此上海申花20号不构成越位犯规。之后上海申花10号队员在罚球区内再次传球时，对于越位的判定已经重置，此时无任何攻方队员处于越位位置，随后上海申花20号的进球有效。裁判员判进球有效的决定正确，VAR未介入正确。","v":"correct","videos":["2025/i21c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250806/6.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-156","t":"case","s":"2025","issue":21,"no":7,"seq":156,"comp":"中超联赛","round":"第19轮","home":"云南玉昆","away":"上海申花","minute":"79","desc":"判例七：中超联赛第19轮，云南玉昆VS上海申花，比赛第79分钟，上海申花9号队员在对方罚球区内头顶球后，与云南玉昆5号队员发生接触并倒地。裁判员判云南玉昆5号犯规并判罚球点球。VAR未介入。","appeal":"","concl":"此判例无俱乐部申诉，但在上海申花进攻队员头顶球完成的情况下，围绕云南玉昆防守队员因争抢球而无意冲撞到对方队员是否构成犯规的问题，引发较多关注与争议，故评议组评议解读此判例。\n对于此判例，评议组一致认为：上海申花9号队员正常头顶球，云南玉昆5号队员争抢头球但动作稍晚，因惯性撞倒对方队员，属于草率的冲撞犯规。评议组指出：在足球比赛中，一名队员无论在触球前、触球时或完成触球后，如果对方对其实施犯规动作，都应被判罚犯规。此判例中云南玉昆5号队员的动作构成竞赛规则条款中指出的缺乏预防措施和注意力的草率犯规。裁判员判罚球点球的决定正确。VAR未介入正确。","v":"correct","videos":["2025/i21c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250806/7.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-157","t":"case","s":"2025","issue":21,"no":8,"seq":157,"comp":"中超联赛","round":"第19轮","home":"成都蓉城","away":"山东泰山","minute":"56","desc":"判例八：中超联赛第19轮，成都蓉城VS山东泰山。比赛第56分钟，山东泰山14号守门员在本方罚球区外对成都蓉城9号队员犯规，裁判员判罚犯规并向山东泰山14号守门员出示黄牌。VAR介入，裁判员经在场回看后改判为向山东泰山14号守门员出示红牌罚令出场。","appeal":"","concl":"此判例无俱乐部申诉，但围绕山东泰山队守门员的犯规是否应出示红牌的问题，引发广泛关注，故评议组评议解读此判例。\n对于此判例，评议组一致认为：当山东泰山14号守门员实施犯规瞬间，山东泰山队仅有一名队员处于本方球门范围内防守，且并非守门员，另有两名队员回防尚未到位。山东泰山14号守门员构成破坏对方明显进球得分机会的犯规。裁判员经在场回看后，对山东泰山14号守门员出示红牌罚令出场的决定正确。VAR介入正确。","v":"correct","videos":["2025/i21c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250806/8.mp4"],"cat":"dogso","catname":"破坏明显进球得分机会（DOGSO）","ans":{"c":"red"}},{"k":"2025-158","t":"case","s":"2025","issue":21,"no":9,"seq":158,"comp":"中甲联赛","round":"第19轮","home":"辽宁铁人","away":"广州豹","minute":"","desc":"判例九：中甲联赛第19轮，辽宁铁人VS广东广州豹。比赛第90+16分钟，辽宁铁人2号队员与广东广州豹8号争抢球并获得球权，之后辽宁铁人队通过传球进攻射门得分，裁判员初始决定为进球有效。VAR介入，裁判员经在场回看后，最终维持进球有效的决定。","appeal":"广东广州豹俱乐部申诉意见认为：对方2号对本方8号犯规，并获得控球权，导致之后发展为进球，应判对方2号犯规在先，进球无效。","concl":"对于此判例，评议组多数成员认为：辽宁铁人2号队员在与广东广州豹8号队员争抢球过程中，无明显的犯规动作，随后发起的进攻，进球有效。裁判员判进球有效的最终决定正确。VAR介入错误。","v":"correct","videos":["2025/i21c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250806/9.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-159","t":"case","s":"2025","issue":21,"no":10,"seq":159,"comp":"中甲联赛","round":"第19轮","home":"上海嘉定汇龙","away":"南京城市","minute":"83","desc":"判例十：中甲联赛第19轮，上海嘉定汇龙VS南京城市。比赛第83分钟，上海嘉定汇龙9号队员在对方罚球区内与南京城市2号队员争抢高空球后倒地，裁判员判罚攻方上海嘉定汇龙9号犯规。","appeal":"上海嘉定汇龙俱乐部申诉意见认为：对方2号对本方9号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：双方争抢高空球的动作属于正常接触，上海嘉定汇龙9号队员未跳起争抢球，南京城市2号队员跳起头顶球，双方的接触均不属于犯规。裁判员未判罚球点球正确。另外，评议组认为也不应判攻方上海嘉定汇龙9号犯规。","v":"correct","videos":["2025/i21c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250806/10.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-160","t":"case","s":"2025","issue":21,"no":11,"seq":160,"comp":"中甲联赛","round":"第19轮","home":"延边龙鼎","away":"石家庄功夫","minute":"41","desc":"判例十一：中甲联赛第19轮，延边龙鼎VS石家庄功夫。比赛第41分钟，延边龙鼎队进攻传球，助理裁判员示意越位，裁判员鸣哨停止比赛，判延边龙鼎38号队员越位犯规。随后延边龙鼎38号将球射入对方球门。","appeal":"延边龙鼎俱乐部申诉意见认为：本方38号不处于越位位置，不是越位犯规。","concl":"对于此判例，评议组一致认为：延边龙鼎38号队员在本方传球的瞬间，不处于越位位置，不是越位犯规。助理裁判员判断错误，裁判员判越位犯规错误。","v":"wrong","videos":["2025/i21c11-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250806/11.mp4"],"cat":"offside","catname":"越位","ans":{"r":"playon","c":"none"}},{"k":"2025-161","t":"case","s":"2025","issue":21,"no":12,"seq":161,"comp":"中甲联赛","round":"第19轮","home":"延边龙鼎","away":"石家庄功夫","minute":"63","desc":"判例十二：中甲联赛第19轮，延边龙鼎VS石家庄功夫。比赛第63分钟，延边龙鼎29号队员进球，裁判员判双方争抢球时，延边龙鼎29号对石家庄功夫33号队员犯规，进球无效。","appeal":"延边龙鼎俱乐部申诉意见认为：本方29号不犯规，并且认为与之争抢的对方33号有假摔嫌疑。","concl":"对于此判例，评议组多数成员认为：延边龙鼎29号队员对对方队员有推搡和腿部接触动作，现有视频无法清晰展示具体接触情况和力度，裁判员观察位置和角度较好，支持裁判员做出的攻方犯规、进球无效的决定。","v":"correct","videos":["2025/i21c12-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250806/12.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-162","t":"case","s":"2025","issue":21,"no":13,"seq":162,"comp":"中乙联赛","round":"第22轮","home":"山西崇德荣海","away":"海门珂缔缘","minute":"1","desc":"判例十三：中乙联赛第22轮，山西崇德荣海VS海门珂缔缘。比赛第1分钟，山西崇德荣海36号队员进攻中在对方罚球区内与海门珂缔缘19号队员有接触并倒地，裁判员判海门珂缔缘19号犯规，并判罚球点球。","appeal":"海门珂缔缘俱乐部申诉意见认为：本方19号不犯规，不应被判罚球点球。","concl":"对于此判例，评议组一致认为：海门珂缔缘19号队员防守时先触球并且成功处理球，动作合理，随后山西崇德荣海36号队员与之发生接触，守方不犯规。裁判员判罚球点球的决定错误。","v":"wrong","videos":["2025/i21c13-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250806/13.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-163","t":"case","s":"2025","issue":22,"no":1,"seq":163,"comp":"中超联赛","round":"第20轮","home":"天津津门虎","away":"青岛西海岸","minute":"35","desc":"判例一：中超联赛第20轮，天津津门虎VS青岛西海岸，比赛第35分钟，天津津门虎踢角球，4号队员头球进球。裁判员初始判进球有效。VAR介入，裁判员经在场回看后，改判进球前天津津门虎6号队员推搡青岛西海岸15号队员犯规在先，进球无效。","appeal":"天津津门虎俱乐部申诉意见认为：本方6号不犯规，应判进球有效。","concl":"对于此判例，评议组一致认为：天津津门虎6号队员与青岛西海岸15号队员属于正常争抢中的身体接触，其程度不构成犯规，接触地点也不在空中球落点的争抢范围，此判例攻方不犯规，应判进球有效。裁判员判攻方犯规进球无效的最终决定错误。VAR介入错误。","v":"wrong","videos":["2025/i22c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250813/1.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-164","t":"case","s":"2025","issue":22,"no":2,"seq":164,"comp":"中超联赛","round":"第20轮","home":"浙江俱乐部绿城","away":"北京国安","minute":"59","desc":"判例二：中超联赛第20轮，浙江俱乐部绿城VS北京国安，比赛第59分钟，浙江俱乐部22号队员争抢球时踩踏到北京国安26号队员，裁判员初始未判罚犯规。VAR介入，裁判员经在场回看后，改判浙江俱乐部22号严重犯规，并出示红牌罚令出场。","appeal":"浙江俱乐部申诉意见认为：本队22号的犯规程度不构成严重犯规，不应被出示红牌。","concl":"对于此判例，评议组多数成员认为：根据浙江俱乐部22号队员踩踏对方队员时的接触部位、踩踏后的身体重心转移等情况，该判例构成严重犯规。裁判员在场回看后出示红牌的最终决定正确。在裁判员初始未判罚犯规的情况下，VAR以红牌事件介入正确。","v":"correct","videos":["2025/i22c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250813/2.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"playon","c":"red"}},{"k":"2025-165","t":"case","s":"2025","issue":23,"no":1,"seq":165,"comp":"中超联赛","round":"第21轮","home":"青岛西海岸","away":"北京国安","minute":"","desc":"判例一：中超联赛第21轮，青岛西海岸VS北京国安，比赛第90+2分钟，青岛西海岸队进球。裁判员经第二助理裁判员提示后，判青岛西海岸56号队员对北京国安34号守门员犯规在先，进球无效。VAR未介入。","appeal":"青岛西海岸俱乐部申诉意见认为：本方56号不犯规，应判进球有效。","concl":"对于此判例，评议组一致认为：北京国安34号守门员将球踢出后，青岛西海岸56号队员在争抢球后落地时踩踏到北京国安34号脚部，属于草率的犯规，后续进球无效。裁判员在得到助理裁判员协助后做出的攻方犯规进球无效的决定正确。VAR未介入正确。","v":"correct","videos":["2025/i23c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250820/1.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-166","t":"case","s":"2025","issue":23,"no":2,"seq":166,"comp":"中超联赛","round":"第21轮","home":"长春亚泰","away":"梅州客家","minute":"33","desc":"判例二：中超联赛第21轮，长春亚泰VS梅州客家，比赛第33分钟，梅州客家10号队员在对方罚球区内与长春亚泰31号队员接触后倒地。裁判员未判罚犯规，VAR未介入。","appeal":"梅州客家俱乐部申诉意见认为：对方31号对本方10号构成犯规。","concl":"对于此判例，评议组多数成员认为：长春亚泰31号队员在争抢球时手臂搭在梅州客家10号队员肩部，但接触力度较轻，并非梅州客家10号倒地的主要原因，属于可接受的接触动作。梅州客家10号在跑动变向过程中，有借助接触主动倒地的成分。裁判员未判罚犯规的决定正确。VAR未介入正确。","v":"correct","videos":["2025/i23c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250820/2.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-167","t":"case","s":"2025","issue":23,"no":3,"seq":167,"comp":"中甲联赛","round":"第21轮","home":"上海嘉定汇龙","away":"苏州东吴","minute":"","desc":"判例三：中甲联赛第21轮，上海嘉定汇龙vs苏州东吴，比赛第45+4分钟，苏州东吴23号队员在本方罚球区内与对方队员争顶时，手臂疑似触球，裁判员未判罚手球犯规。","appeal":"上海嘉定汇龙俱乐部申诉意见认为：对方23号构成手球犯规。","concl":"对于此判例，评议组多数成员认为：苏州东吴23号队员在与对方队员争抢头球时，身体因被对方队员手臂压制而失衡，导致球接触其张开的手臂，属于意外的手球，不构成手球犯规。裁判员未判罚手球犯规的决定正确。","v":"correct","videos":["2025/i23c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250820/3.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2025-168","t":"case","s":"2025","issue":23,"no":4,"seq":168,"comp":"中甲联赛","round":"第21轮","home":"广西平果","away":"定南赣联","minute":"22","desc":"判例四：中甲联赛第21轮，广西平果vs定南赣联，比赛第22分钟，广西平果43号队员在对方罚球区内对对方队员有冲撞。裁判员未判罚犯规。","appeal":"定南赣联俱乐部申诉意见认为：对方43号队员构成暴力行为，应出示红牌罚令出场。","concl":"对于此判例，评议组多数成员认为：广西平果43号队员故意冲撞对方队员，从接触部位、冲撞力度等因素考虑，未达到暴力行为程度，不应出示红牌，应视为鲁莽犯规，并出示黄牌警告。该判例中裁判员未出示红牌的决定正确，但漏判广西平果43号犯规和黄牌。","v":"wrong","videos":["2025/i23c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250820/4.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"yellow"}},{"k":"2025-169","t":"case","s":"2025","issue":23,"no":5,"seq":169,"comp":"中甲联赛","round":"第21轮","home":"广西平果","away":"定南赣联","minute":"37","desc":"判例五：中甲联赛第21轮，广西平果vs定南赣联，比赛第37分钟，定南赣联4号队员对广西平果11号队员犯规，随后定南赣联队4号脚踩踏到广西平果11号腹部，裁判员掌握有利让比赛继续进行。随后在比赛停止时，裁判员向定南赣联4号出示红牌罚令出场。","appeal":"定南赣联俱乐部申诉意见认为：本方4号队员因避免伤及对方队员要害部位，做出躲避动作造成踩踏，应被出示黄牌，裁判员错判红牌。","concl":"对于此判例，评议组首先一致认为：定南赣联队4号队员踩踏对方队员腹部，考虑动作力度和接触部位等因素，应出示红牌罚令出场。其次，评议组多数成员认为：定南赣联队4号的踩踏行为并非以争抢球为目的，且能够观察到对方队员倒地的位置，后续做出的跨步动作以及踩踏的结果并非不可避免，其犯规性质应视为暴力行为。裁判员出示红牌罚令出场的决定正确。另外，评议组指出：该判例中出现暴力行为，且广西平果未形成明显进球得分机会，故裁判员不应实施有利条款，应立即停止比赛并出示红牌。","v":"correct","videos":["2025/i23c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250820/5.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"playon","c":"red"}},{"k":"2025-170","t":"case","s":"2025","issue":24,"no":1,"seq":170,"comp":"中超联赛","round":"第22轮","home":"长春亚泰","away":"深圳新鹏城","minute":"","desc":"判例一：中超联赛第22轮，长春亚泰VS深圳新鹏城。比赛第45+2分钟，长春亚泰10号队员对深圳新鹏城4号队员犯规，之后长春亚泰10号疑似踩踏深圳新鹏城4号。裁判员判长春亚泰10号犯规，但未针对踩踏动作出示红黄牌。VAR未介入。","appeal":"深圳新鹏城俱乐部申诉意见认为：对方10号的踩踏动作构成严重犯规，应出示红牌。","concl":"对于此判例，评议组首先一致认为：长春亚泰10号队员的踩踏动作不构成严重犯规，不应出示红牌。其次评议组多数成员认为，长春亚泰10号右脚落地前有避免踩踏到对方的躲避动作，之后的踩踏属于意外接触，无需出示黄牌。裁判员仅判罚之前的草率犯规，而未针对踩踏动作做出出示红黄牌的决定正确。VAR未介入正确。","v":"correct","videos":["2025/i24c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250827/1756304632517077.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2025-171","t":"case","s":"2025","issue":24,"no":2,"seq":171,"comp":"中超联赛","round":"第22轮","home":"长春亚泰","away":"深圳新鹏城","minute":"50","desc":"判例二：中超联赛第22轮，长春亚泰VS深圳新鹏城。比赛第50分钟，长春亚泰队进球，裁判员判进球有效。VAR未介入。","appeal":"深圳新鹏城俱乐部申诉意见认为：对方2号队员在中场争顶头球时对本方7号队员犯规，对方得到控球权随后取得进球，应判对方犯规在先，进球无效。","concl":"对于此判例，评议组多数成员认为：双方在中场争顶头球时，空中来球的落点处于深圳新鹏城7号队员可触球的范围内，长春亚泰2号队员在争抢时，使用手臂限制对方队员动作，起跳后又使用身体压制对方队员，从而争抢到头球，属于犯规。在后续进攻过程中，虽然守方深圳新鹏城队员有触球，但仅为阻挡对方带球，并未控球或阻断对方本次进攻，因此之前双方争抢头球属于本次进攻发起阶段的起点。应判攻方犯规在先，进球无效，VAR应介入。裁判员判进球有效的决定错误，VAR未介入错误。","v":"wrong","videos":["2025/i24c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250827/1756304658619640.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-172","t":"case","s":"2025","issue":24,"no":3,"seq":172,"comp":"中超联赛","round":"第22轮","home":"长春亚泰","away":"深圳新鹏城","minute":"55","desc":"判例三：中超联赛第22轮，长春亚泰VS深圳新鹏城。比赛第55分钟，深圳新鹏城27号队员在对方罚球区内控球时倒地，助理裁判员示意越位，裁判员判深圳新鹏城27号越位犯规在先。VAR未介入。","appeal":"深圳新鹏城俱乐部申诉意见认为：本方27号并未处于越位位置，不应被判越位犯规，之后对方4号对本方27号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：VAR在检查越位位置操作时，传球瞬间的关键帧选取、双方队员身体部位选择、画线及比对等操作均正确，得出的攻方队员处于越位位置的结论正确。深圳新鹏城27号在球经对方队员折射后触球，构成越位犯规。助理裁判员判断正确，裁判员判深圳新鹏城27号越位犯规在先的决定正确。VAR未介入正确。","v":"correct","videos":["2025/i24c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250827/1756304688456014.mp4"],"cat":"offside","catname":"越位","ans":{"r":"indirectfk","c":"none"}},{"k":"2025-173","t":"case","s":"2025","issue":24,"no":4,"seq":173,"comp":"中超联赛","round":"第22轮","home":"长春亚泰","away":"深圳新鹏城","minute":"","desc":"判例四：中超联赛第22轮，长春亚泰VS深圳新鹏城。比赛第90+6分钟，深圳新鹏城9号队员在对方罚球区内与长春亚泰4号队员争抢高空球发生接触后倒地，裁判员未判罚犯规。VAR未介入。","appeal":"深圳新鹏城俱乐部申诉意见认为：对方4号对本方9号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：空中来球的落点属于双方均可争抢的范围，长春亚泰4号队员主动争抢并顶到球，双方属于正常争抢接触。支持裁判员未判罚犯规的决定，VAR未介入正确。","v":"correct","videos":["2025/i24c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250827/1756304704438779.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-174","t":"case","s":"2025","issue":24,"no":5,"seq":174,"comp":"中超联赛","round":"第23轮","home":"浙江俱乐部绿城","away":"天津津门虎","minute":"65","desc":"判例五：中超联赛第23轮（调赛），浙江俱乐部绿城VS天津津门虎。比赛第65分钟，浙江俱乐部20号队员手臂击打到天津津门虎4号队员头部，裁判员未判罚犯规，VAR未介入。","appeal":"天津津门虎俱乐部申诉意见认为：对方20号肘击本方4号，应出示红牌。","concl":"对于此判例，评议组在认定中未达成相对一致。经询国际足联裁判讲师意见，评议组同意将此判例认定为：浙江俱乐部20号队员手臂击打对方队员的动作属于严重犯规，应出示红牌，VAR应介入此事件。裁判员决定错误，漏判红牌。VAR未介入错误。","v":"wrong","videos":["2025/i24c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250827/1756304722887432.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2025-175","t":"case","s":"2025","issue":24,"no":6,"seq":175,"comp":"中超联赛","round":"第23轮","home":"浙江俱乐部绿城","away":"天津津门虎","minute":"","desc":"判例六：中超联赛第23轮（调赛），浙江俱乐部绿城VS天津津门虎。比赛第90+5分钟，浙江俱乐部进球，裁判员判进球有效。VAR未介入。","appeal":"天津津门虎俱乐部申诉意见认为：双方在争抢球权过程中，对方26号抬脚过高，浙江队得到控球权随后取得进球，应判对方犯规在先，进球无效。","concl":"对于此判例，评议组一致认为：双方争抢球权时，面对球所处的高度，使用脚争抢相对更为合理。天津津门虎队员使用头部全力争抢未成功，浙江俱乐部26号队员先触球后立即收脚避免了与对方头部的接触。浙江队26号不构成犯规。裁判员未判罚犯规的决定以及判后续进球有效的决定均正确，VAR未介入正确。","v":"correct","videos":["2025/i24c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250827/1756304741825316.mp4"],"cat":"freekick_foul","catname":"罚球区外一般犯规","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-176","t":"case","s":"2025","issue":24,"no":7,"seq":176,"comp":"中乙联赛","round":"第23轮","home":"海门珂缔缘","away":"广西恒宸","minute":"88","desc":"判例七：中乙联赛第23轮，海门珂缔缘VS广西恒宸。比赛第88分钟，海门珂缔缘57号队员接本方传球进攻至对方罚球区，广西恒宸21号队员铲球，随后海门珂缔缘57号倒地，裁判员未判罚犯规。","appeal":"海门珂缔缘俱乐部申诉意见认为：对方21号铲球犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：广西恒宸21号队员铲球试图拦截对方队员传球，并未对对方队员犯规或造成其倒地。海门珂缔缘57号扣球后腿部继续向前移动造成了双方的接触。裁判员未判罚犯规的决定正确。","v":"correct","videos":["2025/i24c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250827/1756304761697913.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-177","t":"case","s":"2025","issue":24,"no":8,"seq":177,"comp":"中乙联赛","round":"第23轮","home":"广州蒲公英","away":"湖北青年星","minute":"43","desc":"判例八：中乙联赛第23轮，广州蒲公英vs湖北青年星。比赛第43分钟，湖北青年星10号队员接本方传球进攻至对方罚球区，广州蒲公英16号队员与其发生接触，湖北青年星10号倒地，裁判员未判罚犯规。","appeal":"湖北青年星俱乐部申诉意见认为：对方16号对本方10号犯规，破坏了本方进攻机会和得分机会。","concl":"对于此判例，评议组多数成员认为：双方队员侧背部相互接触以争抢位置，接触力度可接受，且均有争抢球机会，不构成犯规。裁判员未判罚广州蒲公英球员犯规的决定正确。","v":"correct","videos":["2025/i24c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250827/1756304781652605.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-178","t":"case","s":"2025","issue":25,"no":1,"seq":178,"comp":"中超联赛","round":"第23轮","home":"云南玉昆","away":"长春亚泰","minute":"","desc":"判例一：中超联赛第23轮，云南玉昆VS长春亚泰。比赛第90+5分钟，云南玉昆14号队员在对方罚球区内与长春亚泰29号队员发生接触后倒地。裁判员认定长春亚泰29号犯规，并判罚球点球。VAR未介入。","appeal":"长春亚泰俱乐部申诉意见认为：本方29号不犯规，不应判罚球点球。","concl":"对于此判例，评议组一致认为：在云南玉昆14号队员摆腿射门时，长春亚泰29号队员在争抢时对其实施草率的绊人犯规，阻止了对方有希望的进攻，应判罚球点球，无需出示红黄牌。裁判员判罚球点球的决定正确。VAR未介入正确。","v":"correct","videos":["2025/i25c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250903/1756898261228524.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-179","t":"case","s":"2025","issue":25,"no":2,"seq":179,"comp":"中超联赛","round":"第23轮","home":"武汉三镇","away":"上海申花","minute":"40","desc":"判例二：中超联赛第23轮，武汉三镇VS上海申花。比赛第40分钟，上海申花10号队员右脚踩到武汉队倒地队员腿部，裁判员未判罚犯规。VAR介入。裁判员经在场回看后，判上海申花10号犯规，并出示黄牌警告。","appeal":"","concl":"此判例无俱乐部申诉，但因牵涉到判罚尺度统一问题而引起较多关注，因此评议组评议此判例。\n对于此判例，评议组一致认为：武汉三镇队队员率先将球铲出，上海申花队10号队员争抢球时使用鞋钉部位，直腿蹬出且未及时收脚，踩踏到对方队员小腿部位，危及对方安全。按照竞赛规则及本赛季统一判罚与评议尺度，应视为上海申花队10号队员严重犯规并出示红牌罚令其出场。VAR介入正确。裁判员经在场回看后改判黄牌的决定错误，漏判红牌。","v":"wrong","videos":["2025/i25c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250903/1756898342670424.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2025-180","t":"case","s":"2025","issue":25,"no":3,"seq":180,"comp":"中乙联赛","round":"第24轮","home":"广西恒宸","away":"山东泰山B队","minute":"","desc":"判例三：中乙联赛第24轮，广西恒宸vs山东泰山B队。比赛第90+9分钟，山东泰山B队62号在对方罚球区内与广西恒宸守门员争抢球后倒地，裁判员未判罚犯规。","appeal":"山东泰山俱乐部申诉意见认为：对方守门员犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：广西恒宸守门员争抢中手触到了球，从现有视频中看，没有明显证据展示其在争抢中有犯规情况。双方的争抢应视为正常接触。支持裁判员未判罚犯规的决定。","v":"correct","videos":["2025/i25c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250903/1756898455713155.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-181","t":"case","s":"2025","issue":25,"no":4,"seq":181,"comp":"中乙联赛","round":"第24轮","home":"昆明城星","away":"山西崇德荣海","minute":"79","desc":"判例四：中乙联赛第24轮，昆明城星VS山西崇德荣海。比赛第79分钟，昆明城星进球，裁判员判进球前山西崇德荣海守门员在本方罚球区外犯规并出示红牌将其罚令出场，进球无效，由昆明城星踢任意球恢复比赛。","appeal":"昆明城星俱乐部申诉意见认为：裁判员应掌握有利条款，本方进球应有效。","concl":"对于此判例，评议组一致认为：山西崇德荣海守门员犯规时，球即将进入山西崇德荣海球门，此时裁判员应掌握有利条款，使进球发生后判进球有效，之后再以非体育行为为由警告山西崇德荣海守门员。此判例中裁判员在球尚未进入球门前鸣哨停止了比赛，判罚守门员犯规，之后球进门，在此情况下裁判员无法再做出进球有效的决定，因此做出了进球无效、向山西崇德荣海守门员出示红牌并判罚直接任意球的决定。结合上述两点，评议组多数成员认为：在犯规发生时，裁判员应正确运用规则，并且做出对被犯规一方更有利的判罚决定，此判例应认定为裁判员判罚决定错误。","v":"wrong","videos":["2025/i25c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250903/1756898677734714.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"yellow"}},{"k":"2025-182","t":"case","s":"2025","issue":26,"no":1,"seq":182,"comp":"中超联赛","round":"第24轮","home":"成都蓉城","away":"长春亚泰","minute":"42","desc":"判例一：中超联赛第24轮，成都蓉城VS长春亚泰，比赛第42分钟，成都蓉城7号队员在对方罚球区内与长春亚泰2号队员接触后倒地，裁判员未判罚犯规，VAR未介入。","appeal":"成都蓉城俱乐部申诉意见认为：对方2号对本方7号犯规，应判罚球点球。","concl":"对于此判例，评议组多数成员认为：成都蓉城7号队员带球变向，造成双方腿部发生接触，长春亚泰2号队员无犯规动作。裁判员未判罚犯规的决定正确。VAR未介入正确。","v":"correct","videos":["2025/i26c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250917/1758121688675816.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-183","t":"case","s":"2025","issue":26,"no":2,"seq":183,"comp":"中超联赛","round":"第24轮","home":"上海申花","away":"山东泰山","minute":"7","desc":"判例二：中超联赛第24轮，上海申花VS山东泰山，比赛第7分钟，山东泰山11号队员进攻中传中，球疑似接触处在罚球区内的上海申花13号队员手臂。裁判员未判罚手球犯规，VAR未介入。","appeal":"山东泰山俱乐部申诉意见认为：对方13号手球犯规，并阻止了本方有希望的进攻，应判罚球点球并向对方13号出示黄牌。","concl":"对于此判例，评议组将在征求国际足联裁判专家意见后做出认定。\n【第27期补充认定】中超联赛第24轮，上海申花VS山东泰山，比赛第7分钟，山东泰山11号队员进攻中传中，球疑似接触处在罚球区内的上海申花13号队员手臂。裁判员未判罚手球犯规，VAR未介入。\n对于此判例，在参考国际足联裁判专家意见后，评议组认定：上海申花13号队员清晰地跳向球的运行路线，并且张开手臂，使身体不自然扩大。但视频无法证实球与队员身体的接触点是否处于规则规定的手臂范围（腋窝以下）。综上，评议组支持裁判员做出的不是手球犯规的决定，以及VAR不介入的决定。另外，评议组作出说明：现场转播画面中显示，裁判员做出了手指指向耳机的动作，表示裁判员正在与VAR进行沟通，该沟通属于查看潜在的介入事件时的正常操作程序，并不代表VAR对裁判员初始决定进行了介入。只有当VAR找到清晰证据证明裁判员的初始决定存在错误时，VAR将建议裁判员对该事件进行回看分析，此时，才意味着VAR进行了介入，而介入的标志就是裁判员比划“电视”手势。","v":"correct","videos":["2025/i26c02-1.mp4","2025/i26c02-2.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250917/1758121712340861.mp4","https://videooss.thecfa.cn/upload/video/20250924/1758720939937197.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2025-184","t":"case","s":"2025","issue":26,"no":3,"seq":184,"comp":"中超联赛","round":"第24轮","home":"上海申花","away":"山东泰山","minute":"18","desc":"判例三：中超联赛第24轮，上海申花VS山东泰山，比赛第18分钟，上海申花队踢角球并且进球。裁判员判进球有效，VAR未介入。","appeal":"山东泰山俱乐部申诉意见认为：对方23号队员在争抢位置中推搡本方守门员犯规，应判对方犯规在先进球无效。","concl":"对于此判例，评议组一致认为：山东泰山守门员争抢球时向后移动，与已经处于该位置的上海申花23号发生接触，后者做出正常保护动作，其性质和程度不构成犯规，后续进球有效。裁判员判进球有效的决定正确，VAR未介入正确。","v":"correct","videos":["2025/i26c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250917/1758121752270020.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-185","t":"case","s":"2025","issue":26,"no":4,"seq":185,"comp":"中超联赛","round":"第24轮","home":"大连英博","away":"深圳新鹏城","minute":"46","desc":"判例四：中超联赛第24轮，大连英博VS深圳新鹏城，比赛第46分钟，深圳新鹏城20号队员在本方罚球区内被球打到手臂。裁判员判其手球犯规并判罚球点球。VAR介入，裁判员经在场回看后，做出维持罚球点球的最终判罚。","appeal":"深圳新鹏城俱乐部申诉意见认为：本方20号手臂触球不构成犯规，不应被判罚球点球。","concl":"对于此判例，评议组多数成员认为：深圳新鹏城20号队员铲球防守并触球后，大连英博队员射门，球接触深圳新鹏城20号手臂，此时其手臂处于当前动作下的合理位置，且为近距离意外来球，不构成手球犯规。VAR介入正确。裁判员经在场回看后仍维持手球犯规并判罚球点球的最终决定错误。","v":"wrong","videos":["2025/i26c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250917/1758121788657914.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2025-186","t":"case","s":"2025","issue":26,"no":5,"seq":186,"comp":"中甲联赛","round":"第22轮","home":"广州豹","away":"石家庄功夫","minute":"67","desc":"判例五：中甲联赛第22轮，广东广州豹VS石家庄功夫，比赛第67分钟，石家庄功夫44号队员在对方罚球区内与广东广州豹5号队员接触后，双方倒地，裁判员未判罚犯规。","appeal":"石家庄功夫俱乐部申诉意见认为：对方5号对本方44号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：双方争抢过程中互有身体接触和干扰动作，现有视频不能证明广东广州豹5号队员有明显犯规。支持裁判员未判罚犯规的决定。","v":"correct","videos":["2025/i26c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250917/1758121835323885.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-187","t":"case","s":"2025","issue":26,"no":6,"seq":187,"comp":"中甲联赛","round":"第22轮","home":"广州豹","away":"石家庄功夫","minute":"57","desc":"判例六：中甲联赛第22轮，广东广州豹VS石家庄功夫，比赛第57分钟，广东广州豹队进攻中，其7号队员与石家庄功夫19号队员发生接触后倒地，裁判员未判罚犯规；之后石家庄功夫19号靠近倒地的广东广州豹7号示意其起身，双方互有手臂动作，石家庄功夫19号倒地不起；裁判员停止比赛，石家庄功夫36号队员靠近倒地的广东广州豹7号施压；在裁判员管理过程中，广东广州豹11号队员跑来，疑似与石家庄功夫36号有接触，石家庄功夫36号倒地翻滚后无法起身；裁判员经与助理裁判员及第四官员协商后，向广东广州豹7号、石家庄功夫36号以及石家庄功夫19号出示黄牌。","appeal":"石家庄功夫俱乐部申诉意见认为：对方11号对本方36号实施暴力行为，应被红牌罚令出场；对方7号对本方19号实施暴力行为，应被红牌罚令出场。","concl":"对于此判例，评议组一致认为：从现有视频展示的事件过程看，双方均无应被认定为暴力行为或出示红牌的队员。裁判员以挑衅、佯装和夸大被犯规程度等非体育行为原因，向广东广州豹7号、石家庄功夫36号以及石家庄功夫19号出示黄牌的决定正确。","v":"correct","videos":["2025/i26c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250917/1758121913347439.mp4"],"cat":"simulation","catname":"假摔与欺骗行为","ans":{"r":"playon","c":"yellow"}},{"k":"2025-188","t":"case","s":"2025","issue":26,"no":7,"seq":188,"comp":"中甲联赛","round":"第22轮","home":"广州豹","away":"石家庄功夫","minute":"69","desc":"判例七：中甲联赛第22轮，广东广州豹VS石家庄功夫，比赛第69分钟，石家庄功夫队踢角球，在比赛恢复前，广东广州豹7号队员在本方罚球区内与石家庄功夫14号头部疑似有接触，后者倒地，裁判员未出示红黄牌。","appeal":"石家庄功夫俱乐部申诉意见认为：对方7号使用头部恶意撞击本方14号，属于暴力行为，应被红牌罚令出场。","concl":"对于此判例，评议组将在征求国际足联裁判专家意见后做出认定。\n【第27期补充认定】中甲联赛第22轮，广东广州豹VS石家庄功夫，比赛第69分钟，石家庄功夫队踢角球，在比赛恢复前，广东广州豹7号队员在本方罚球区内与石家庄功夫14号头部疑似有接触，后者倒地，裁判员未出示红黄牌。\n对于此判例，在参考国际足联裁判专家意见后，评议组认定：在比赛停止时，广东广州豹7号队员使用头部撞击对方队员，应以暴力行为被红牌罚令出场。裁判员决定错误，漏判红牌。另外，石家庄功夫14号队员疑似有挑衅或还击行为，在此角度视频下无法清晰证实是否构成暴力行为，但至少应以非体育行为出示黄牌警告。","v":"wrong","videos":["2025/i26c07-1.mp4","2025/i26c07-2.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250917/1758121938254296.mp4","https://videooss.thecfa.cn/upload/video/20250924/1758720981945686.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"red"}},{"k":"2025-189","t":"case","s":"2025","issue":26,"no":8,"seq":189,"comp":"中甲联赛","round":"第22轮","home":"南通支云","away":"苏州东吴","minute":"85","desc":"判例八：中甲联赛第22轮，南通支云VS苏州东吴，比赛第85分钟，南通支云队进球。裁判员判进球有效。","appeal":"苏州东吴俱乐部申诉意见认为：对方远射被本方守门员扑出后，对方6号队员对本方23号队员犯规，本方23号倒地后，对方6号又踢本方23号，随后对方的进球应判为无效。","concl":"对于此判例，评议组一致认为：南通支云队远射后，苏州东吴守门员将球扑出，双方争抢球，现有视频未显示南通支云进攻队员有犯规；随后苏州东吴23号争抢中身体倒向对方队员，南通支云6号未犯规；苏州东吴23号倒地后手臂触球，之后南通支云6号的争抢未犯规，随即南通支云进球有效，因掌握有利，不必再判罚苏州东吴23号手球犯规。裁判员判进球有效的决定正确。","v":"correct","videos":["2025/i26c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250917/1758121993943265.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-190","t":"case","s":"2025","issue":26,"no":9,"seq":190,"comp":"中甲联赛","round":"第22轮","home":"南通支云","away":"苏州东吴","minute":"","desc":"判例九：中甲联赛第22轮，南通支云VS苏州东吴，比赛第90+2分钟，南通支云队进球。裁判员判进球有效。","appeal":"苏州东吴俱乐部申诉意见认为：对方20号队员在进攻过程中应被判罚手球犯规或越位犯规，随后对方的进球应判为无效。","concl":"对于此判例，评议组一致认为：南通支云20号倒地后，在同队队员后续触球时，南通支云20号处于越位位置，随后球先触及南通支云20号身体，应判罚南通支云20号越位犯规，后续进球无效。裁判员判进球有效的决定错误，漏判越位犯规。","v":"wrong","videos":["2025/i26c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250917/1758122046824016.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-191","t":"case","s":"2025","issue":26,"no":10,"seq":191,"comp":"中乙联赛","round":"第25轮","home":"昆明城星","away":"泰安天贶","minute":"","desc":"判例十：中乙联赛第25轮，昆明城星VS泰安天贶，比赛第90+8分钟，昆明城星14号队员铲抢泰安天贶16号队员，裁判员判昆明城星14号犯规，并出示黄牌。","appeal":"泰安天贶俱乐部申诉意见认为：对方14号队员铲球后的附加腿部动作，属于暴力行为，应出示红牌罚令出场。","concl":"对于此判例，评议组多数成员认为：根据昆明城星14号队员的犯规及附加动作的力量和方式，不构成严重犯规或暴力行为，应认定为鲁莽犯规并出示黄牌。裁判员判昆明城星14号犯规并出示黄牌的决定正确。","v":"correct","videos":["2025/i26c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250917/1758122080738843.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2025-192","t":"case","s":"2025","issue":26,"no":11,"seq":192,"comp":"女超联赛","round":"第15轮","home":"辽宁沈北禾丰女足","away":"山东体彩女足","minute":"71","desc":"判例十一：女超联赛第15轮，辽宁沈北禾丰女足VS山东体彩女足，比赛第71分钟，辽宁队踢角球，随后辽宁队队员头球将球顶入对方球门；在球进门前，裁判员鸣哨，判辽宁队其他队员在与对方争抢位置时犯规在先，进球无效。","appeal":"辽宁女足申诉意见认为：本方队员不犯规，进球应有效。","concl":"对于此判例，评议组一致认为：双方队员在罚球区内争抢位置时属于正常程度的接触，不构成犯规。裁判员判攻方犯规的决定错误。另外，评议组指出：球在裁判员鸣哨停止比赛后进入球门，按照规则，不能认定为进球有效。","v":"wrong","videos":["2025/i26c11-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250917/1758122140431790.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"playon","c":"none"}},{"k":"2025-193","t":"case","s":"2025","issue":26,"no":12,"seq":193,"comp":"女超联赛","round":"第15轮","home":"辽宁沈北禾丰女足","away":"山东体彩女足","minute":"6","desc":"判例十二：女超联赛第15轮，辽宁沈北禾丰女足VS山东体彩女足，比赛第6分钟，辽宁队30号队员进攻中带球进入对方罚球区后倒地，裁判员未判罚犯规。","appeal":"辽宁女足申诉意见认为：对方队员对本方30号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：现有视频无法证明山东队防守队员脚部与辽宁队30号队员是否发生接触以及是否构成犯规，裁判员临场观察距离和角度较好。支持裁判员做出的不犯规的决定。","v":"correct","videos":["2025/i26c12-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250917/1758122172513483.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-194","t":"case","s":"2025","issue":27,"no":1,"seq":194,"comp":"中乙联赛","round":"第26轮","home":"广东铭途","away":"湖北青年星","minute":"89","desc":"判例一：中乙联赛第26轮，广东铭途VS湖北青年星，比赛第89分钟，湖北青年星10号队员在本方罚球区附近防守带球进攻的广东铭途46号队员，后者倒地，裁判员未判罚犯规，VAR查看后未介入。","appeal":"广东铭途俱乐部申诉意见认为：对方10号对本方46号犯规，犯规地点在罚球区内，应判罚球点球。","concl":"对于此判例，评议组首先一致认为：视频显示，双方队员接触点处于罚球区外，不存在判罚球点球的可能。其次评议组多数成员认为：从现有视频看，湖北青年星10号对广东铭途46号的防守动作，接触程度较轻微，可视为比赛中的正常接触，不构成犯规。支持裁判员未判罚犯规的决定，VAR未介入正确。","v":"correct","videos":["2025/i27c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250924/1758720871199943.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-195","t":"case","s":"2025","issue":27,"no":2,"seq":195,"comp":"中乙联赛","round":"第26轮","home":"无锡吴钩","away":"广西恒宸","minute":"","desc":"判例二：中乙联赛第26轮，无锡吴钩VS广西恒宸，比赛进行至第18分钟，无锡吴钩进球，裁判员判进球有效。","appeal":"广西恒宸俱乐部申诉意见认为：对方进攻中最后一传时，传给了处于越位位置的队员，后续该队员射门进球，应判为越位犯规在先进球无效。","concl":"对于此判例，评议组一致认为：从视频回放角度看，无锡吴钩队最后一传的触球点存在被遮挡的情况，从现有角度无法证实其同队队员是否处于越位位置。遂尊重和支持助理裁判员的判断，以及裁判员做出的进球有效的决定。","v":"correct","videos":["2025/i27c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250924/1758720908920948.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-196","t":"case","s":"2025","issue":28,"no":1,"seq":196,"comp":"中甲联赛","round":"第24轮","home":"南通支云","away":"陕西联合","minute":"86","desc":"判例一：中甲联赛第24轮，南通支云vs陕西联合月亮泊。比赛第86分钟，南通支云15号队员与陕西联合月亮泊9号队员在无球状态下有接触，裁判员停止比赛，并在征求助理裁判员意见后，向上述双方队员各出示一张黄牌。","appeal":"陕西联合月亮泊俱乐部申诉意见认为：在无球状态下，对方15号对本方9号实施暴力行为。","concl":"对于此判例，评议组一致认为：从现有视频看，在无球状态下，南通支云15号队员挥拳击打对方队员，应被视为暴力行为并出示红牌罚令出场。裁判员向南通支云15号出示黄牌的决定错误，漏判红牌。","v":"wrong","videos":["2025/i28c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251001/1759321425877924.mov"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2025-197","t":"case","s":"2025","issue":28,"no":2,"seq":197,"comp":"中甲联赛","round":"第24轮","home":"佛山南狮","away":"广西平果","minute":"","desc":"判例二：中甲联赛第24轮，佛山南狮vs广西平果国晶。比赛第90+6分钟，双方队员争抢空中球时，佛山南狮25号队员脚部与广西平果国晶5号队员头部有接触，裁判员判佛山南狮25号犯规，并出示黄牌。VAR未介入。","appeal":"广西平果国晶俱乐部申诉意见认为：对方25号的犯规属于严重犯规，应被出示红牌罚令出场。","concl":"对于此判例，评议组多数成员认为：根据佛山南狮25号队员抬脚争抢球的高度，以及鞋或鞋钉与对方队员面部接触、危及对方安全的情况，该犯规应被视为严重犯规并出示红牌罚令出场。裁判员出示黄牌的决定错误，漏判红牌。VAR未介入错误。","v":"wrong","videos":["2025/i28c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251001/1759321457506931.mov"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2025-198","t":"case","s":"2025","issue":28,"no":3,"seq":198,"comp":"中甲联赛","round":"第24轮","home":"苏州东吴","away":"南京城市","minute":"48","desc":"判例三：中甲联赛第24轮，苏州东吴vs南京城市。比赛第48分钟，苏州东吴6号队员头球射门，南京城市守门员将球扑出，助理裁判员示意球的整体已经越过球门线，裁判员判苏州东吴队进球得分。","appeal":"南京城市俱乐部申诉意见认为：球的整体未完全越过球门线，不应判对方进球得分。","concl":"对于此判例，评议组一致认为：现有视频的角度无法准确判断球的整体是否已经越过了球门线，助理裁判员的观察位置不好，做出的判断无说服力。评议组对此判例不予认定。","v":"pending","videos":["2025/i28c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251001/1759321485660442.mov"],"cat":"goal_decision","catname":"进球判定与有利条款"},{"k":"2025-199","t":"case","s":"2025","issue":28,"no":4,"seq":199,"comp":"中甲联赛","round":"第24轮","home":"苏州东吴","away":"南京城市","minute":"74","desc":"判例四：中甲联赛第24轮，苏州东吴vs南京城市。比赛第74分钟，苏州东吴29队员犯规后倒地不起，南京城市2号队员过来用手接触苏州东吴29号面部，裁判员向南京城市2号出示红牌罚令出场。","appeal":"南京城市俱乐部申诉意见认为：本方2号队员用手接触对方29号面部，示意其尽快起身，接触力度轻微可忽略，不属于暴力行为，不应被红牌罚令出场。","concl":"对于此判例，评议组多数成员认为：南京城市2号队员的行为带有挑衅性质，但其接触对方的力度轻微，应视为非体育行为并出示黄牌。裁判员向南京城市2号出示红牌的决定错误。","v":"wrong","videos":["2025/i28c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251001/1759321551868350.mov"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"yellow"}},{"k":"2025-200","t":"case","s":"2025","issue":28,"no":5,"seq":200,"comp":"中甲联赛","round":"第24轮","home":"上海嘉定汇龙","away":"广州豹","minute":"","desc":"判例五：中甲联赛第24轮，上海嘉定汇龙vs广东广州豹。比赛第90+3分钟，上海嘉定汇龙踢后场任意球，广东广州豹有队员阻止对方快发任意球，上海嘉定汇龙23号大力将球踢向对方队员，裁判员向上海嘉定汇龙23号出示红牌罚令出场，并向广东广州豹42号出示黄牌。","appeal":"上海嘉定汇龙俱乐部申诉意见认为：本方发任意球时，对方队员未退出规定距离，之后本方23号队员踢任意球将球踢在对方未退出规定距离的队员身上，本方23号不应被出示红牌或黄牌。","concl":"对于此判例，评议组多数成员认为：上海嘉定汇龙23号队员故意将球踢向对方队员，且力度较大，裁判员依据暴力行为向其出示红牌罚令出场的决定应予支持；因延误比赛恢复为由向广东广州豹42号出示黄牌的决定正确。","v":"correct","videos":["2025/i28c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251001/1759321602266812.mov"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2025-201","t":"case","s":"2025","issue":28,"no":6,"seq":201,"comp":"女超联赛","round":"第22轮","home":"北京东方雨虹女足","away":"辽宁沈北禾丰女足","minute":"26","desc":"判例六：女超联赛第22轮，北京东方雨虹女足VS辽宁沈北禾丰女足。比赛第26分钟，辽宁沈北禾丰30号队员在进攻中在对方罚球区内与北京东方雨虹5号队员接触后倒地，裁判员未判罚犯规。","appeal":"辽宁沈北禾丰女足申诉意见认为：对方5号队员对本方30号队员犯规。","concl":"对于此判例，评议组多数成员认为：北京东方雨虹5号队员防守过程中以争抢球为目的，且无犯规动作，辽宁沈北禾丰30号队员触球后造成双方的接触。裁判员未判罚犯规的决定正确。","v":"correct","videos":["2025/i28c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251001/1759321635354232.mov"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-202","t":"case","s":"2025","issue":28,"no":7,"seq":202,"comp":"女超联赛","round":"第22轮","home":"北京东方雨虹女足","away":"辽宁沈北禾丰女足","minute":"29","desc":"判例七：女超联赛第22轮，北京东方雨虹女足VS辽宁沈北禾丰女足。比赛第29分钟，北京东方雨虹16号队员带球进入对方罚球区并与辽宁沈北禾丰14号队员接触后倒地，裁判员判辽宁队14号犯规，判罚球点球并出示黄牌警告辽宁队14号。","appeal":"辽宁沈北禾丰女足申诉意见认为：本方14号与对方16号接触地点在罚球区外，且为正常身体接触，不应被判罚球点球。","concl":"对于此判例，评议组一致认为：北京东方雨虹16号队员带球突破时，辽宁沈北禾丰14号队员对其实施了拉扯犯规，犯规地点处于罚球区内，并且阻止了对方有希望的进攻。裁判员判罚球点球并向辽宁队14号出示黄牌的决定正确。","v":"correct","videos":["2025/i28c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251001/1759321671750464.mov"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"yellow"}},{"k":"2025-203","t":"case","s":"2025","issue":28,"no":8,"seq":203,"comp":"女超联赛","round":"第22轮","home":"北京东方雨虹女足","away":"辽宁沈北禾丰女足","minute":"79","desc":"判例八：女超联赛第22轮，北京东方雨虹女足VS辽宁沈北禾丰女足。比赛第79分钟，北京东方雨虹进攻中传中，其6号队员在对方罚球区与辽宁沈北禾丰8号队员争抢，之后北京队另一名队员射门进球，裁判员判进球有效。","appeal":"辽宁沈北禾丰女足申诉意见认为：对方6号在拼抢时犯规，导致后续进球。","concl":"对于此判例，评议组一致认为：从现有视频看，北京东方雨虹6号队员与辽宁沈北禾丰8号队员属于比赛中正常争抢球动作，支持裁判员未判罚犯规以及后续进球有效的决定。","v":"correct","videos":["2025/i28c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251001/1759321721114936.mov"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-204","t":"case","s":"2025","issue":29,"no":1,"seq":204,"comp":"中超联赛","round":"第23轮","home":"大连英博","away":"青岛西海岸","minute":"61","desc":"判例一：中超联赛第23轮，大连英博VS青岛西海岸。比赛第61分钟，青岛西海岸5号队员在本方罚球区内争抢球时与大连英博2号队员发生接触，裁判员判青岛西海岸5号犯规并判罚球点球，VAR介入，裁判员经在场回看后，取消了罚球点球的判罚。","appeal":"大连英博俱乐部申诉意见认为：对方5号对本方2号犯规，应判罚球点球，裁判员不应改判取消点球判罚。","concl":"对于此判例，评议组一致认为：双方争抢空中球时，青岛西海岸5号队员手臂或腿部没有明显犯规动作，从双方接触程度来看，不构成犯规。在裁判员初始判罚球点球的情况下，VAR介入正确，裁判员经在场回看后取消罚球点球的最终决定正确。","v":"correct","videos":["2025/i29c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251008/1759888738793977.mov"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-205","t":"case","s":"2025","issue":29,"no":2,"seq":205,"comp":"中超联赛","round":"第23轮","home":"大连英博","away":"青岛西海岸","minute":"86","desc":"判例二：中超联赛第23轮，大连英博VS青岛西海岸。比赛第86分钟，大连英博16号队员在对方罚球区内带球进攻时与青岛西海岸36号队员发生接触并倒地。裁判员未判罚犯规，VAR介入，裁判员经在场回看后，维持不犯规的决定。","appeal":"大连英博俱乐部申诉意见认为：对方36号对本方16号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：青岛西海岸36号队员对大连英博16号队员实施拉扯犯规，应判罚球点球。在裁判员初始未判罚犯规的情况下，VAR介入正确。裁判员经在场回看后维持不犯规的最终决定错误。","v":"wrong","videos":["2025/i29c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251008/1759888826501915.mov"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-206","t":"case","s":"2025","issue":29,"no":3,"seq":206,"comp":"中甲联赛","round":"第25轮","home":"陕西联合","away":"上海嘉定汇龙","minute":"11","desc":"判例三：中甲联赛第25轮，陕西联合vs上海嘉定汇龙，比赛第11分钟，陕西联合35号队员在本方罚球区内疑似手球，裁判员未判罚手球犯规。","appeal":"上海嘉定汇龙俱乐部申诉意见认为：对方手球犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：陕西联合35号队员在本方罚球区内触球，触球的身体部位属于规则规定的手臂范围，且其手臂处于使身体不自然扩大的位置，应判罚手球犯规，并判罚球点球。裁判员决定错误，漏判罚球点球。","v":"wrong","videos":["2025/i29c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251008/1759888871770005.mov"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2025-207","t":"case","s":"2025","issue":29,"no":4,"seq":207,"comp":"中甲联赛","round":"第25轮","home":"广西平果","away":"重庆铜梁龙","minute":"60","desc":"判例四：中甲联赛第25轮，广西平果vs重庆铜梁龙，比赛第60分钟，广西平果17号队员在对方罚球区内与对方队员争抢球后倒地，裁判员未判罚犯规，随后VAR与裁判员沟通后未介入。","appeal":"广西平果俱乐部申诉意见认为：对方犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：从现有视频看，重庆铜梁龙防守队员踢球时先触到了球，随后接触到对方队员，无犯规动作，不构成犯规。裁判员未判罚犯规的决定正确。VAR未介入正确。另外，转播画面显示，裁判员使用了对讲机与VAR联络沟通，在场回看区域中的屏幕也未显示比赛画面。对此，评议组作出说明：本场比赛中裁判员耳麦通讯系统受到了比赛现场附近电磁环境影响和干扰，无法正常通讯，在此情况下使用对讲机等其他设备与其他比赛官员沟通，符合VAR操作有关要求，对讲机等通讯设备也属于使用VAR的比赛中必备的备用通讯设备。VAR在与裁判员建立通讯联络并沟通后，决定不介入该判罚（其标志为裁判员未作出“电视信号”手势），在此情况下在场回看区域中的屏幕不显示回看画面，仅显示赛事标识（并非有些报道所称“黑屏”），属于正常和正确情况，屏幕及画面信号并未出现故障。","v":"correct","videos":["2025/i29c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251008/1759889024190991.mov"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-208","t":"case","s":"2025","issue":29,"no":5,"seq":208,"comp":"中甲联赛","round":"第25轮","home":"广西平果","away":"重庆铜梁龙","minute":"50","desc":"判例五：中甲联赛第25轮，广西平果vs重庆铜梁龙，比赛第50分钟，重庆铜梁龙16号队员在边线附近对广西平果10号队员犯规，后者与场外LED广告展示设备接触后倒地，后被救护车送往医院。裁判员判重庆铜梁龙16号犯规并出示黄牌警告，VAR未介入。","appeal":"广西平果俱乐部申诉意见认为：对方队员实施了非体育行为导致本方队员受重伤。","concl":"对于此判例，评议组多数成员认为：重庆铜梁龙16号队员的犯规属于鲁莽犯规的程度，尚未达到严重犯规或暴力行为的程度，不应被出示红牌，广西平果10号队员受伤有意外成分。裁判员判重庆铜梁龙16号犯规并出示黄牌的决定正确。另外，经向中足联有关方面了解，本场比赛场外LED广告展示设备摆放的位置以及与比赛场地边线间的距离（3米），符合足球赛事的国际标准以及中甲联赛有关规程要求。","v":"correct","videos":["2025/i29c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251008/1759889061289433.mov"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2025-209","t":"case","s":"2025","issue":30,"no":1,"seq":209,"comp":"中超联赛","round":"第27轮","home":"青岛海牛","away":"上海海港","minute":"16","desc":"判例一：中超联赛第27轮，青岛海牛VS上海海港，比赛第16分钟，青岛海牛60号队员在对方罚球区内与上海上港1号守门员争抢后倒地，裁判员初始判上海海港1号守门员犯规，并判罚球点球。VAR随之介入。裁判员经在场回看后，取消罚球点球，改判青岛海牛队60号佯装（假摔），并向其出示黄牌警告。","appeal":"青岛海牛俱乐部申诉意见认为：对方守门员对本方60号犯规，应被判罚球点球；不应判本方60号假摔并出示黄牌。","concl":"对于此判例，评议组首先一致认为：从视频中看，双方脚部接触轻微，并非青岛海牛60号队员倒地的主要原因，上海海港1号守门员不构成犯规，裁判员在场回看后取消罚球点球的最终决定正确。其次评议组多数成员认为：青岛海牛60号在双方接触前已有主动曲腿的动作以及佯装被犯规的意图，支持裁判员以佯装（假摔）为由向其出示黄牌警告的决定。","v":"correct","videos":["2025/i30c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251022/1761140849941089.mp4"],"cat":"simulation","catname":"假摔与欺骗行为","ans":{"r":"playon","c":"yellow"}},{"k":"2025-210","t":"case","s":"2025","issue":30,"no":2,"seq":210,"comp":"中乙联赛","round":"第28轮","home":"杭州临平吴越","away":"广东铭途","minute":"76","desc":"判例二：中乙联赛第28轮，杭州临平吴越VS广东铭途。比赛第76分钟，广东铭途9号队员在对方罚球区内与对方队员争抢头球后倒地，裁判员示未判罚犯规。","appeal":"广东铭途俱乐部申诉意见认为：本方9号队员率先争抢到头球，对方队员对本方9号犯规，裁判员应判罚球点球。","concl":"对于此判例，评议组多数成员认为：广东铭途9号队员率先争抢到头球，杭州临平吴越队员构成跳向对方队员的草率犯规，应判罚球点球。裁判员决定错误，漏判犯规和罚球点球。","v":"wrong","videos":["2025/i30c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251022/1761140890346598.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-211","t":"case","s":"2025","issue":30,"no":3,"seq":211,"comp":"中乙联赛","round":"第28轮","home":"山西崇德荣海","away":"昆明城星","minute":"89","desc":"判例三：中乙联赛第28轮，山西崇德荣海VS昆明城星。比赛第89分钟，双方在边线附近争抢后，昆明城星42号队员在比赛场地外疑似被山西崇德荣海球队官员踩踏。裁判员出示红牌将山西崇德荣海球队官员罚令出场，并向昆明城星42号出示黄牌警告。","appeal":"山西崇德荣海俱乐部申诉意见认为：对方42号队员在球已经离开比赛场地的情况下做出飞铲动作铲到本方教练员。本方教练员随后踩踏到对方42号队员属于自然反应，并非恶意动作，不应被出示红牌罚令出场。","concl":"对于此判例，评议组首先一致认为：山西崇德荣海球队官员在技术区域外对对方场上队员实施暴力行为，裁判员对其出示红牌罚令出场的决定正确。其次评议组多数成员认为：昆明城星42号队员在裁判员已经停止比赛的情况下做出争抢球动作，延误比赛恢复，并带有挑衅意味，裁判员向其出示黄牌的决定正确。","v":"correct","videos":["2025/i30c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251022/1761140928127974.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2025-212","t":"case","s":"2025","issue":31,"no":1,"seq":212,"comp":"中超联赛","round":"第28轮","home":"上海申花","away":"大连英博","minute":"23","desc":"判例一：中超第28轮，上海申花VS大连英博，比赛第23分钟，大连英博16号队员进攻至前场，上海申花3号队员铲球，大连英博16号倒地，裁判员未判罚犯规。VAR未介入。","appeal":"大连英博俱乐部申诉意见认为：对方3号铲球犯规且破坏了本方明显的进球得分机会，应被出示红牌罚令出场。","concl":"对于此判例，评议组首先一致认为：上海申花3号队员的犯规，不构成严重犯规，也不符合破坏对方明显进球得分机会的判定标准，裁判员未出示红牌的主要决定正确。VAR未介入正确。其次，评议组一致认为：裁判员应判上海申花3号队员犯规，并以阻止对方有希望的进攻或鲁莽犯规为由，向其出示黄牌警告。","v":"correct","videos":["2025/i31c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251029/1761740751592440.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-213","t":"case","s":"2025","issue":31,"no":2,"seq":213,"comp":"中超联赛","round":"第28轮","home":"上海申花","away":"大连英博","minute":"","desc":"判例二：中超第28轮，上海申花VS大连英博，比赛第45+1分钟，大连英博踢角球，球传至上海申花罚球区内，大连英博2号队员头球，之后该队16号队员将球踢进对方球门，助理裁判员举旗示意越位，裁判员判大连英博越位犯规在先，进球无效。VAR未介入。","appeal":"大连英博俱乐部申诉意见认为：本方队员射门得分的队员不越位，进球应有效。","concl":"对于此判例，评议组一致认为：大连英博2号队员头顶球时，其15号队员处于越位位置，阻碍了上海申花守门员视线，并且做出试图触球的动作，影响了对方守门员处理球的能力，应判大连英博15号越位犯规，其队友后续进球无效。裁判员决定正确。VAR未介入正确。","v":"correct","videos":["2025/i31c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251029/1761740784262617.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-214","t":"case","s":"2025","issue":31,"no":3,"seq":214,"comp":"中超联赛","round":"第28轮","home":"上海申花","away":"大连英博","minute":"","desc":"判例三：中超第28轮，上海申花VS大连英博，比赛第90+6分钟，上海申花踢角球，球传至大连英博罚球区内，上海申花15号队员与大连英博36号队员争顶头球并发生接触后倒地。裁判员未判罚犯规。VAR介入。裁判员经在场回看后，改判大连英博36号犯规，判罚球点球并向其出示黄牌警告。","appeal":"大连英博俱乐部申诉意见认为：本方36号不犯规，裁判员不应改判罚球点球。","concl":"对于此判例，评议组首先一致认为：上海申花15号队员率先顶到球，大连英博36号队员使用头部顶撞对方，按照竞赛规则，构成犯规，裁判员在场回看后改判大连英博36号犯规并判罚球点球的最终决定正确。VAR介入正确。其次，评议组多数成员认为：大连英博36号犯规的严重程度属于鲁莽犯规，裁判员对其出示黄牌警告的决定正确。","v":"correct","videos":["2025/i31c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251029/1761740869432655.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"yellow"}},{"k":"2025-215","t":"case","s":"2025","issue":31,"no":4,"seq":215,"comp":"中超联赛","round":"第28轮","home":"上海申花","away":"大连英博","minute":"","desc":"判例四：中超第28轮，上海申花VS大连英博，比赛第90+16分钟，双方争抢球，裁判员鸣哨停止比赛后，上海申花10号队员疑似向倒地的大连英博40号队员有攻击性行为，裁判员未向上海申花10号出示红黄牌，VAR未介入。","appeal":"大连英博俱乐部申诉意见认为：对方10号向本方倒地的40号队员具有攻击性行为，并且吐口水，应被红牌罚令出场。","concl":"对于此判例，评议组首先一致认为：通过现有视频画面，无法证实上海申花10号队员对倒地的大连英博40号队员是否有辱骂、吐口水等应予以红牌罚令出场的行为，因此评议组对于上海申花10号是否应被出示红牌罚令出场不予认定。\n其次，评议组指出，在无法确定上海申花10号队员是否有辱骂、吐口水等应予以红牌罚令出场的行为的前提下，其动作也构成非体育行为，应予以黄牌警告。","v":"pending","videos":["2025/i31c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251029/1761740898927064.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为"},{"k":"2025-216","t":"case","s":"2025","issue":31,"no":5,"seq":216,"comp":"中超联赛","round":"第28轮","home":"青岛西海岸","away":"成都蓉城","minute":"6","desc":"判例五：中超第28轮，青岛西海岸VS成都蓉城，比赛第6分钟，成都蓉城16号队员对青岛西海岸17号队员铲球犯规，裁判员出示黄牌警告成都蓉城16号。VAR未介入。","appeal":"青岛西海岸俱乐部申诉意见认为：对方16号铲球犯规，属于暴力行为，应被红牌罚令出场。","concl":"对于此判例，评议组多数成员认为：成都蓉城16号队员铲球时先触及球，之后接触对方队员时已经曲腿，脚剐蹭对方腿部，不构成严重犯规，应视为未顾及对对方造成的后果的鲁莽犯规。裁判员判成都蓉城16号犯规并出示黄牌的决定正确。VAR未介入正确。","v":"correct","videos":["2025/i31c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251029/1761740938684871.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2025-217","t":"case","s":"2025","issue":31,"no":6,"seq":217,"comp":"中超联赛","round":"第28轮","home":"青岛西海岸","away":"成都蓉城","minute":"","desc":"判例六：中超第28轮，青岛西海岸VS成都蓉城，比赛第90+3分钟，青岛西海岸11号队员在角球区内控球，成都蓉城8号队员铲球，裁判员判成都蓉城8号犯规并出示黄牌警告。VAR未介入。","appeal":"青岛西海岸俱乐部申诉意见认为：对方8号铲球犯规应被出示红牌罚令出场。","concl":"对于此判例，评议组多数成员认为：从成都蓉城8号队员与对方队员接触的部位和力度看，不构成严重犯规，不应出示红牌，应视为鲁莽犯规并予以黄牌警告。裁判员判成都蓉城8号犯规并出示黄牌的决定正确。VAR未介入正确。","v":"correct","videos":["2025/i31c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251029/1761740965825938.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2025-218","t":"case","s":"2025","issue":31,"no":7,"seq":218,"comp":"中超联赛","round":"第28轮","home":"青岛西海岸","away":"成都蓉城","minute":"","desc":"判例七：中超第28轮，青岛西海岸VS成都蓉城，比赛第90+10分钟，成都蓉城进球，裁判员判进球有效。VAR未介入。","appeal":"青岛西海岸俱乐部申诉意见认为：在对方将球传入本方罚球区时，对方9号对本方23号犯规，后续对方进球应无效。","concl":"对于此判例，评议组一致认为：球传入罚球区的过程中，成都蓉城9号队员与青岛西海岸23号队员的接触，应视为比赛中双方队员相互争抢位置的正常身体对抗，不构成犯规。裁判员未判罚犯规以及判后续判进球有效的决定均正确。VAR未介入正确。","v":"correct","videos":["2025/i31c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251029/1761741024887013.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-219","t":"case","s":"2025","issue":31,"no":8,"seq":219,"comp":"中超联赛","round":"第28轮","home":"武汉三镇","away":"深圳新鹏城","minute":"43","desc":"判例八：中超第28轮，武汉三镇VS深圳新鹏城，比赛第43分钟，深圳新鹏城23号队员手臂接触武汉三镇22号队员头部，裁判员向深圳新鹏城23号出示红牌罚令出场。VAR未介入。","appeal":"深圳新鹏城俱乐部申诉意见认为：本方23号手臂接触到对方队员头部，属于护球时的意外接触，不属于严重犯规或暴力行为，不应被出示红牌。","concl":"对于此判例，评议组一致认为：深圳新鹏城23号队员手臂明显挥动发力击打到对方队员面部，并非正常护球动作，应视为严重犯规。裁判员向深圳新鹏城23号出示红牌罚令出场的决定正确。VAR未介入正确。","v":"correct","videos":["2025/i31c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251029/1761741063795646.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"red"}},{"k":"2025-220","t":"case","s":"2025","issue":31,"no":9,"seq":220,"comp":"全运会","round":"","home":"浙江俱乐部绿城","away":"山东","minute":"55","desc":"判例九：中华人民共和国第十五届运动会足球项目男子U18组决赛阶段，浙江VS山东，比赛第55分钟，浙江队踢角球，之后传中至对方罚球区内并头球射门进球，助理裁判员举旗示意越位，裁判员判浙江队越位犯规在先，进球无效。","appeal":"浙江队申诉意见认为该越位判罚为错判。","concl":"对于此判例，评议组一致认为：浙江队头球进球的球员，在本队传中触球时并未处于越位位置，不是越位犯规，进球应有效。助理裁判员越位判断错误，裁判员判浙江队越位犯规、进球无效的决定错误。","v":"wrong","videos":["2025/i31c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251029/1761741097532129.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2025-221","t":"case","s":"2025","issue":31,"no":10,"seq":221,"comp":"全运会","round":"","home":"浙江俱乐部绿城","away":"山东","minute":"87","desc":"判例十：中华人民共和国第十五届运动会足球项目男子U18组决赛阶段，浙江VS山东，比赛第87分钟，浙江队在前场掷界外球，之后浙江队50号队员在对方罚球区内争抢头球并与对方队员接触后倒地，裁判员未判罚犯规。","appeal":"浙江队申诉意见认为：对方队员犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：在浙江队50号队员即将头顶球时，山东队队员从侧面对其实施冲撞犯规，导致其失去重心倒地，应判山东队犯规并判罚球点球。裁判员决定错误，漏判犯规和罚球点球。","v":"wrong","videos":["2025/i31c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251029/1761741120499615.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-222","t":"case","s":"2025","issue":32,"no":1,"seq":222,"comp":"中超联赛","round":"第29轮","home":"成都蓉城","away":"河南俱乐部","minute":"15","desc":"判例一：中超联赛第29轮，成都蓉城VS河南俱乐部。比赛第15分钟，双方队员在河南队罚球区附近争抢头球后，裁判员判河南队队员手球犯规，随后成都蓉城进球。裁判员判进球无效，由成都蓉城踢直接任意球恢复比赛，VAR未介入。","appeal":"成都蓉城俱乐部申诉意见认为：裁判员鸣哨时间晚于本方射门时间，应判进球有效。","concl":"对于此判例，评议组一致认为：在双方队员争抢头球时，成都蓉城队队员率先起跳并争抢到头球，其手臂与对方队员的接触不构成犯规。之后球接触了河南俱乐部队员张开并高于肩部的手臂，应视为手球犯规，但随即成都蓉城队获得了很好的射门得分机会，此时裁判员应掌握有利条款，使比赛继续进行，不应判罚手球犯规。此判例中，裁判员在进球前已经鸣哨停止比赛，不能再判进球有效，因此做出了由成都蓉城踢任意球恢复比赛的决定。另外，此情况不符合规则规定的介入原则，因此VAR无法介入。此球评议组认定为裁判员判罚决定错误，VAR不介入正确。","v":"wrong","videos":["2025/i32c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251105/1762353385647450.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"playon","c":"none"}},{"k":"2025-223","t":"case","s":"2025","issue":32,"no":2,"seq":223,"comp":"中超联赛","round":"第29轮","home":"成都蓉城","away":"河南俱乐部","minute":"48","desc":"判例二：中超联赛第29轮，成都蓉城VS河南俱乐部。比赛第48分钟，成都蓉城队传中，球疑似接触河南俱乐部11号队员臂部，裁判员未判罚手球犯规，VAR未介入。","appeal":"成都蓉城俱乐部申诉意见认为：对方11号手球犯规。","concl":"对于此判例，评议组多数成员认为：成都蓉城队传中时，河南俱乐部11号手臂从身体背后的位置，向球运行的方向移动至非自然位置，且从现有视频画面中判断，球接触了河南俱乐部11号手臂，因此应视为手球犯规，并判罚球点球。VAR应介入。裁判员决定错误，漏判手球犯规和罚球点球。VAR未介入错误。","v":"wrong","videos":["2025/i32c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251105/1762353420483565.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2025-224","t":"case","s":"2025","issue":32,"no":3,"seq":224,"comp":"中甲联赛","round":"第29轮","home":"广西平果","away":"上海嘉定汇龙","minute":"59","desc":"判例三：中甲联赛第29轮，广西平果VS上海嘉定汇龙。比赛第59分钟，上海嘉定汇龙队员射门，广西平果守门员在本方球门内的球门线附近将球踢出，裁判员未判进球，VAR未介入。","appeal":"上海嘉定汇龙俱乐部申诉意见认为：本方射门后球已越过球门线，应为进球得分。","concl":"对于此判例，评议组多数成员认为：从现有视频无法判断球是否整体越过了球门线，评议组对此判例不予认定。","v":"pending","videos":["2025/i32c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251105/1762353453358645.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款"},{"k":"2025-225","t":"case","s":"2025","issue":32,"no":4,"seq":225,"comp":"中甲联赛","round":"第29轮","home":"广西平果","away":"上海嘉定汇龙","minute":"78","desc":"判例四：中甲联赛第29轮，广西平果VS上海嘉定汇龙。比赛第78分钟，广西平果5号队员与上海嘉定汇龙9号队员在中场区域争抢，双方倒地，上海嘉定汇龙9号使用手臂接触广西平果队5号。裁判员初始未判罚犯规，VAR介入，裁判员经在场回看后，向上海嘉定汇龙9号出示红牌罚令出场。","appeal":"上海嘉定汇龙俱乐部申诉意见认为：本方9号起身时无意击打到对方队员，不应被出示红牌。","concl":"对于此判例，首先，评议组多数成员认为：双方队员起身过程中相互距离很近，上海嘉定汇龙9号队员有主动挥臂的动作，但综合其动作的力度和接触情况看，不构成暴力行为，不应出示红牌，应视为非体育行为并出示黄牌警告。其次，评议组一致认为：广西平果5号队员在争抢和倒地过程中持续拉扯抱摔对方队员，也应因非体育行为被出示黄牌警告。裁判员决定错误，错判上海嘉定汇龙9号红牌，漏判广西平果5号黄牌。VAR介入错误。","v":"wrong","videos":["2025/i32c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251105/1762353480944268.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"yellow"}},{"k":"2025-226","t":"case","s":"2025","issue":32,"no":5,"seq":226,"comp":"全运会","round":"","home":"新疆","away":"山东","minute":"54","desc":"判例五：中华人民共和国第十五届运动会男子足球项目U20组决赛阶段，新疆VS山东。比赛第54分钟，山东队进攻中从左路传中，处在新疆队罚球区内的山东队9号队员跳起争抢，未触球，随后山东队32号队员射门进球。裁判员在与助理裁判员沟通后，判进球有效。","appeal":"新疆代表队申诉意见认为：对方传中时其9号队员处于越位位置，之后干扰了本方守门员，应判对方9号越位犯规，后续进球无效。","concl":"对于此判例，评议组多数成员认为：山东队传中瞬间，其9号队员处于越位位置，并试图触球，影响了对方守门员对球的判断和反应，应视为处于越位位置并干扰对方队员的越位犯规。另外，国际足联裁判专家也对该判例给出了相同的认定意见。综上，评议组认定此判例为越位犯规，进球无效。裁判员判进球有效的决定错误。","v":"wrong","videos":["2025/i32c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251105/1762353502823138.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-227","t":"case","s":"2025","issue":32,"no":6,"seq":227,"comp":"全运会","round":"","home":"云南","away":"河北","minute":"55","desc":"判例六：中华人民共和国第十五届运动会男子足球项目U20组决赛阶段，云南VS河北。比赛第55分钟，河北队进攻中向前传球至云南队罚球区附近，双方队员争抢球，河北队队员倒地，裁判员未判罚犯规。","appeal":"河北代表队申诉意见认为：在对方罚球区内，对方队员对本方队员犯规，应判罚球点球。","concl":"对于此判例，评议组多数成员认为：从现有视频看，双方应为正常身体接触。裁判员、助理裁判员、附加助理裁判员观察位置较好，支持裁判员未判罚犯规的决定。","v":"correct","videos":["2025/i32c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20251105/1762353522982740.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-19","t":"case","s":"2024","issue":5,"no":1,"seq":19,"comp":"中超联赛","round":"第8轮","home":"浙江俱乐部绿城","away":"北京国安","minute":"82","desc":"判例一：中超联赛第8轮浙江VS北京国安，比赛第82分钟，浙江队45号队员与北京国安队17号队员在后者罚球区内争抢时，双方发生身体接触并倒地。裁判员未判罚犯规，VAR介入，裁判员在场回看后，改判北京国安队17号队员犯规，并判罚球点球。","appeal":"","concl":"对于此判例，评议组多数成员认为：浙江队45号队员在争抢时犯规在先，北京国安队17号队员随后的动作不应视为犯规，裁判员最终改判罚球点球的决定错误；VAR介入错误。","v":"wrong","videos":["2024/i05c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240430/1714483430464670.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-20","t":"case","s":"2024","issue":5,"no":2,"seq":20,"comp":"中超联赛","round":"第8轮","home":"上海海港","away":"上海申花","minute":"","desc":"判例二：中超联赛第8轮上海海港VS上海申花，比赛第90+5分钟，上海申花队20号队员处于越位位置，并在其队友射门时做出躲避来球的动作。球打进球门后，第一助理裁判员举旗判罚越位犯规在先，裁判员判进球无效。VAR介入，裁判员在场回看后维持越位犯规进球无效的决定。","appeal":"","concl":"对于此判例，评议组成员一致认为：上海申花队20号队员在其队友射门触球时处于越位位置，躲避球的动作属于影响对方守门员处理球能力的明显举动，构成干扰对方队员的越位犯规，第一助理裁判员的越位判罚正确；裁判员判罚进球无效并在回看后维持判罚的决定正确；VAR介入错误。","v":"correct","videos":["2024/i05c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240430/1714483577453943.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2024-21","t":"case","s":"2024","issue":5,"no":3,"seq":21,"comp":"中乙联赛","round":"第6轮","home":"大连鲲城","away":"湖北青年星","minute":"3","desc":"判例三：中乙联赛第6轮大连鲲城VS湖北青年星，比赛第3分钟，大连鲲城队前场任意球踢出后，该队13号队员在越位位置做出动作，之后经湖北青年星队守门员扑救以及大连鲲城队补射，球进入球门，裁判员判罚进球有效。","appeal":"","concl":"对于此判例，评议组成员一致认为：大连鲲城队13号队员在其队友主罚任意球触球时处在越位位置，其后续动作影响了对方守门员处理球的能力，构成干扰对方队员的越位犯规，第二助理裁判员漏判越位犯规；裁判员判进球有效的决定错误。","v":"wrong","videos":["2024/i05c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240430/1714483672708162.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2024-22","t":"case","s":"2024","issue":5,"no":4,"seq":22,"comp":"女超联赛","round":"第5轮","home":"北京雨虹修缮女足","away":"长春大众卓越女足","minute":"41","desc":"判例四：女超联赛第5轮北京雨虹修缮女足VS长春大众卓越女足，比赛第41分钟，北京队16号队员带球向对方罚球区突破，长春队3号队员铲球，双方倒地，裁判员未作判罚。","appeal":"","concl":"对于此判例，评议组成员一致认为：从现有视频呈现的情况看，双方接触发生在罚球区外，长春队3号的防守动作无犯规的证据，且裁判员当时的位置和观察角度很好，其判罚应予支持。因此裁判员做出的不犯规的决定正确。","v":"correct","videos":["2024/i05c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240430/1714483696788338.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-23","t":"case","s":"2024","issue":5,"no":5,"seq":23,"comp":"女超联赛","round":"第5轮","home":"北京雨虹修缮女足","away":"长春大众卓越女足","minute":"82","desc":"判例五：女超联赛第5轮北京雨虹修缮女足VS长春大众卓越女足，比赛第82分钟，长春队2号队员在本方罚球区内手臂触球。裁判员未作判罚。","appeal":"","concl":"对于此判例，评议组成员一致认为：长春队2号队员主动踢球后，球经反弹触碰其手臂，其手臂处于当前身体动作下的合理位置，不是手球犯规。裁判员做出的不犯规的决定正确。","v":"correct","videos":["2024/i05c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240430/1714483752446032.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2024-24","t":"case","s":"2024","issue":5,"no":6,"seq":24,"comp":"女超联赛","round":"第5轮","home":"北京雨虹修缮女足","away":"长春大众卓越女足","minute":"","desc":"判例六：女超联赛第5轮北京雨虹修缮女足VS长春大众卓越女足，比赛第90+5分钟，长春队25号队员和北京队24号队员在长春队罚球区内争抢并倒地。裁判员未作判罚。","appeal":"","concl":"对于此判例，评议组成员多数成员认为：从现有视频呈现的情况看，双方争抢时的身体接触属于正常范畴，长春队防守队员的动作不构成犯规。裁判员做出的不犯规的决定正确。","v":"correct","videos":["2024/i05c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240430/1714483797806725.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-25","t":"case","s":"2024","issue":5,"no":7,"seq":25,"comp":"中甲联赛","round":"第8轮","home":"黑龙江冰城","away":"上海嘉定汇龙","minute":"69","desc":"判例七：中甲联赛第8轮黑龙江冰城VS上海嘉定汇龙，比赛第69分钟，黑龙江冰城队22号队员对上海嘉定汇龙队7号队员犯规，上海嘉定汇龙队7号随后有击打黑龙江队22号的动作，裁判员判罚黑龙江队22号犯规并向其出示黄牌，另因暴力行为向上海嘉定汇龙队7号出示红牌将其罚令出场。","appeal":"","concl":"对于此判例，评议组成员一致认为，上海嘉定汇龙队7号队员的行为不属于暴力行为，应以非体育行为对双方队员均出示黄牌警告。裁判员向黑龙江冰城队22号出示黄牌的决定正确，向上海嘉定队7号出示红牌的决定错误。","v":"wrong","videos":["2024/i05c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240430/1714483841426729.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"yellow"}},{"k":"2024-26","t":"case","s":"2024","issue":5,"no":8,"seq":26,"comp":"中甲联赛","round":"第8轮","home":"黑龙江冰城","away":"上海嘉定汇龙","minute":"31","desc":"判例八：中甲联赛第8轮黑龙江冰城VS上海嘉定汇龙，比赛第31分钟，上海嘉定汇龙队获得角球，角球发出后，上海嘉定汇龙7号倒钩射门，球接触到其身后的黑龙江冰城队队员身体后反弹到地面，裁判员未作判罚。","appeal":"","concl":"对于此判例，评议组多数成员认为：现有视频没有呈现出球与黑龙江冰城队防守队员接触的详细情况，从现有情况看，黑龙江冰城队队员不构成手球犯规，裁判员做出的不犯规的决定应予支持。","v":"correct","videos":["2024/i05c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240430/1714483870647532.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2024-27","t":"case","s":"2024","issue":5,"no":9,"seq":27,"comp":"中甲联赛","round":"第8轮","home":"黑龙江冰城","away":"上海嘉定汇龙","minute":"23","desc":"判例九：中甲联赛第8轮黑龙江冰城VS上海嘉定汇龙，比赛第23分钟，黑龙江冰城队获得角球，角球发出后，球落地反弹后与上海嘉定汇龙队10号队员身体有接触，裁判员判罚上海嘉定汇龙队10号手球犯规，并判罚球点球。","appeal":"","concl":"对于此判例，评议组成员一致认为：从现有视频呈现的情况看，球并未接触上海嘉定汇龙10号队员的手臂，不构成手球犯规。裁判员临场做出的手球犯规和罚球点球的决定错误。","v":"wrong","videos":["2024/i05c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240430/1714483894721145.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2024-28","t":"case","s":"2024","issue":5,"no":10,"seq":28,"comp":"中甲联赛","round":"第8轮","home":"黑龙江冰城","away":"上海嘉定汇龙","minute":"86","desc":"判例十：中甲联赛第8轮黑龙江冰城VS上海嘉定汇龙，比赛第86分钟，上海嘉定汇龙队31号带球进入对方罚球区内，在与对方队员身体接触后倒地，上海嘉定汇龙队31号起身继续带球，随后与对方2号队员身体接触后倒地，裁判员未作犯规判罚。","appeal":"","concl":"对于此判例，评议组成员一致认为，两次身体接触中黑龙江冰城队队员均不构成犯规，上海嘉定汇龙队31号第二次倒地的动作有故意夸大接触程度的成分，也并非对方的动作导致。裁判员做出的不犯规的决定正确。","v":"correct","videos":["2024/i05c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240430/1714483937977629.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-29","t":"case","s":"2024","issue":6,"no":1,"seq":29,"comp":"中超联赛","round":"第9轮","home":"浙江俱乐部绿城","away":"河南俱乐部","minute":"21","desc":"判例一：中超联赛第9轮浙江俱乐部VS河南俱乐部，比赛第21分钟，双方队员起跳争抢头球时，浙江队29号队员手臂与河南队20号队员有接触。裁判员判浙江队29号队员犯规，并向其出示黄牌。","appeal":"","concl":"对于此判例，评议组一致认为：浙江队29号队员在争抢头球时不合理使用手臂并击打到对方队员，但并非将手臂作为武器攻击对方，从接触的动作和强度看，属于鲁莽犯规，应出示黄牌警告，不属于严重犯规，不应出示红牌。裁判员判浙江队29号犯规并出示黄牌的决定正确。","v":"correct","videos":["2024/i06c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240504/1714832615260791.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2024-30","t":"case","s":"2024","issue":6,"no":2,"seq":30,"comp":"中超联赛","round":"第9轮","home":"浙江俱乐部绿城","away":"河南俱乐部","minute":"","desc":"判例二：中超联赛第9轮浙江俱乐部VS河南俱乐部，比赛第45+2分钟，双方队员在浙江队罚球区内起跳争抢球时，浙江队29号队员手臂与河南队20号队员有接触。裁判员未判罚犯规，VAR介入，裁判员经在场回看后，改判浙江队29号队员犯规并判罚球点球。","appeal":"","concl":"对于此判例，评议组一致认为：浙江队29号队员在争抢头球时不合理使用手臂并击打到对方队员，属于鲁莽犯规，不属于严重犯规，应出示黄牌警告。VAR介入正确，裁判员经在场回看后改判浙江队29号队员犯规并判罚球点球的最终决定正确，但漏判浙江队29号队员黄牌。","v":"wrong","videos":["2024/i06c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240504/1714832734613075.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"yellow"}},{"k":"2024-31","t":"case","s":"2024","issue":6,"no":3,"seq":31,"comp":"中超联赛","round":"第9轮","home":"浙江俱乐部绿城","away":"河南俱乐部","minute":"13","desc":"判例三：中超联赛第9轮浙江俱乐部VS河南俱乐部，比赛第13分钟，浙江队45号队员在对方罚球区内射门，球与河南队3号队员的手臂有接触。裁判员判罚河南队3号队员手球犯规并判罚球点球，VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：河南队3号队员的动作属于封堵拦截对方的射门，手臂离开身体，即使是用于倒地支撑，按照竞赛规则以及本年度统一判罚尺度要求，应视为手球犯规，该手球犯规阻挡了对方射向球门的球，应以破坏有希望的进攻为由出示黄牌警告。另外，浙江队45号队员在射门前停球时手臂未触球，不存在手球犯规。裁判员判罚河南队3号队员手球犯规并判罚球点球的决定正确，但漏判河南队3号黄牌。","v":"wrong","videos":["2024/i06c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240504/1714832841520002.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"yellow"}},{"k":"2024-32","t":"case","s":"2024","issue":6,"no":4,"seq":32,"comp":"中超联赛","round":"第9轮","home":"浙江俱乐部绿城","away":"河南俱乐部","minute":"2","desc":"判例四：中超联赛第9轮浙江俱乐部VS河南俱乐部，比赛第2分钟，河南队进球，裁判员判进球有效，VAR介入，裁判员经在场回看后，认定在该进球的进攻发起阶段，河南队13号队员在与浙江队17号队员争抢球时犯规，改判河南队进球无效。","appeal":"","concl":"对于此判例，评议组一致认为：河南队13号队员在与浙江队17号队员争抢球时犯规，河南队控球后进攻直至进球，属于同一进攻发展阶段。VAR介入正确，裁判员经在场回看后改判河南队进球无效的最终决定正确。","v":"correct","videos":["2024/i06c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240504/1714832945628659.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_invalid","c":"none"}},{"k":"2024-33","t":"case","s":"2024","issue":6,"no":5,"seq":33,"comp":"中超联赛","round":"第9轮","home":"浙江俱乐部绿城","away":"河南俱乐部","minute":"36","desc":"判例五：中超联赛第9轮浙江俱乐部VS河南俱乐部，比赛第36分钟，浙江队主罚角球，随后球被河南队36号队员头球解围出罚球区，争抢头球时浙江队2号与河南队36号有身体接触。随后浙江队通过一系列传球和进攻发展，再次攻入河南队罚球区并取得进球。裁判员判进球有效。","appeal":"","concl":"对于此判例，评议组一致认为：河南队头球解围后，浙江队重新获得控球权，将球传至本方左路再次展开进攻，此时进攻发展阶段已经重置，随后的进球与此前双方在河南队罚球区内的头球争抢不属于同一进攻发展阶段，在形成进球的进攻过程中未发生犯规或违规行为，进球有效。另外，评议组多数成员认为，浙江队2号在角球开出后与对方队员的头球争抢，也属于可接受的身体接触，本身也不构成犯规。裁判员判罚进球有效的决定正确。","v":"correct","videos":["2024/i06c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240504/1714832988980827.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2024-34","t":"case","s":"2024","issue":6,"no":6,"seq":34,"comp":"中甲联赛","round":"第8轮","home":"无锡吴钩","away":"南京城市","minute":"85","desc":"判例六：中甲联赛第8轮无锡吴钩VS南京城市，比赛第85分钟，无锡吴钩队进攻时将球传中至南京城市队罚球区内，无锡队19号队员将球顶向对方球门，无锡队18号队员与对方队员争抢后，球进入球门，裁判员判进球有效。","appeal":"","concl":"对于此判例，评议组一致认为：在无锡吴钩队19号队员头顶球时，从现有视频的角度，无法清晰明显呈现无锡队18号队员是否较对方倒数第二名队员更接近球门线，是否处于越位位置，应支持临场裁判员的判断，后续无锡队18号与对方队员的争抢不存在犯规。裁判员做出的进球有效的决定应予支持。","v":"correct","videos":["2024/i06c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240504/1714833025749626.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2024-35","t":"case","s":"2024","issue":6,"no":7,"seq":35,"comp":"中甲联赛","round":"第8轮","home":"石家庄功夫","away":"大连英博","minute":"45","desc":"判例七：中甲联赛第8轮石家庄功夫VS大连英博，比赛第45分钟，大连英博队29号队员带球进入对方罚球区内射门，球被石家庄功夫队守门员扑救反弹后，石家庄功夫队25号队员手臂与球有接触，裁判员判罚不是手球犯规，比赛继续。","appeal":"","concl":"对于此判例，评议组一致认为：石家庄队25号队员手臂触球前，其腿部有主动处理球的动作并且接触球，球反弹后接触其手臂，手臂无主动触球的附加动作，按照竞赛规则以及本年度统一判罚尺度要求，不应视为手球犯规。裁判员临场做出的不是手球犯规的决定正确。","v":"correct","videos":["2024/i06c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240504/1714833097599636.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2024-36","t":"case","s":"2024","issue":6,"no":8,"seq":36,"comp":"中甲联赛","round":"第8轮","home":"石家庄功夫","away":"大连英博","minute":"46","desc":"判例八：中甲联赛第8轮石家庄功夫VS大连英博，比赛第46分钟，大连英博队18号队员带球进入对方罚球区，石家庄功夫队2号队员与其争抢后，大连英博队18号倒地，裁判员临场判罚不犯规。","appeal":"","concl":"对于此判例，评议组一致认为：从现有的视频呈现来看，石家庄队2号出脚争抢的动作，从与对方的接触和力度考虑，不构成犯规，大连英博队18号倒地动作存在夸大，但不构成佯装违规。裁判员临场判罚双方均不犯规的决定应予支持。\n另外，在中国足协公布上一期（20240429期）评议结果后，有媒体人士在社交媒体中指出，在认定上海海港队对上海申花队比赛中申花队越位犯规进球无效的判例中，从官方转播画面看，裁判员在进球后第一时间通过手势示意进球有效，后经VAR介入后改判为越位犯规进球无效，而中国足协公布的评议结果中认为裁判员初始判罚为越位犯规进球无效，经在场回看后维持进球无效的判罚，属于错误信息。对此，中国足协及其裁委会评议组做出澄清说明，在此判例中，裁判员在球进入球门的第一时间通过手势示意进球有效，随后第一助理裁判员举旗示意攻方越位犯规，裁判员随即改判进球无效，该改判符合竞赛规则规定的裁判员职责。但此时进球方队员已开始聚集庆祝进球，转播镜头未表现出助理裁判员和裁判员的判罚决定。裁判员通过耳麦向视频助理裁判员明确表示场上初始判罚是越位犯规进球无效，随后视频助理裁判员介入的原因是认为攻方不是越位犯规，进球有效。裁判员经在场回看后维持越位犯规进球无效的判罚。中国足协在该期评议中发布的信息准确无误，但在释疑解惑、回应大众关切方面还须继续改进。","v":"correct","videos":["2024/i06c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240504/1714833121589493.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"goal_invalid","c":"none"}},{"k":"2024-37","t":"case","s":"2024","issue":7,"no":1,"seq":37,"comp":"中超联赛","round":"第10轮","home":"武汉三镇","away":"青岛海牛","minute":"17","desc":"判例一：中超联赛第10轮武汉三镇VS青岛海牛，比赛第17分钟，青岛海牛3号队员在本方罚球区内防守武汉三镇7号队员时，双方发生接触，随后武汉三镇7号队员倒地。裁判员临场判罚青岛海牛3号队员犯规并判罚球点球，VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：青岛海牛3号在对方队员射门后与对方的接触属于草率的犯规，应判罚犯规和罚球点球，无需出示红黄牌。裁判员判青岛海牛3号犯规并判罚球点球的决定正确。","v":"correct","videos":["2024/i07c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240508/1715161590436962.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2024-38","t":"case","s":"2024","issue":7,"no":2,"seq":38,"comp":"中超联赛","round":"第10轮","home":"深圳新鹏城","away":"上海海港","minute":"77","desc":"判例二：中超联赛第10轮深圳新鹏城VS上海海港，比赛第77分钟，上海海港8号队员射门，深圳新鹏城20号队员在本方罚球区内手臂与球有接触。裁判员临场未判罚犯规，VAR介入。经在场回看后，裁判员改判深圳新鹏城20号队员手球犯规和罚球点球，并向其出示黄牌。","appeal":"","concl":"对于此判例，评议组一致认为：上海海港8号射门时，无论球是否经深圳新鹏城10号封堵接触，均未明显变向折射，深圳新鹏城队20号队员左手臂触球时，手臂位置使身体不自然地扩大，应视为手球犯规并判罚球点球。同时，因手球犯规阻挡了对方射向球门的球，应以阻止对方有希望的进攻为由出示黄牌。VAR介入正确，裁判员经在场回看后改判手球犯规和罚球点球并出示黄牌的最终决定正确。","v":"correct","videos":["2024/i07c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240508/1715161608293391.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"yellow"}},{"k":"2024-39","t":"case","s":"2024","issue":7,"no":3,"seq":39,"comp":"中超联赛","round":"第10轮","home":"北京国安","away":"成都蓉城","minute":"24","desc":"判例三：中超联赛第10轮北京国安VS成都蓉城，比赛第24分钟，北京国安23号队员争抢球时与成都蓉城39号队员有接触，后者倒地。裁判员判罚北京国安23号队员（已有一张黄牌）犯规，未出示红黄牌。","appeal":"","concl":"对于此判例，评议组一致认为：考虑北京国安23号争抢时犯规动作的意图、争抢方式、强度以及与对方接触的情况，应视为鲁莽的犯规，并出示黄牌。裁判员判罚北京国安23号犯规正确，但漏判黄牌。","v":"wrong","videos":["2024/i07c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240508/1715161624142412.mp4"],"cat":"freekick_foul","catname":"罚球区外一般犯规","ans":{"r":"directfk","c":"yellow"}},{"k":"2024-40","t":"case","s":"2024","issue":7,"no":4,"seq":40,"comp":"中甲联赛","round":"第9轮","home":"延边龙鼎","away":"黑龙江冰城","minute":"3","desc":"判例四：中甲联赛第9轮延边龙鼎VS黑龙江冰城，比赛第3分钟，黑龙江冰城18号队员在对方罚球区内与延边龙鼎12号守门员发生身体接触后倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：现有视频不能完全清晰地证明双方接触的细节情况，但从接触的总体情形看，延边龙鼎12号守门员应视为犯规并判罚球点球。同时，该犯规符合破坏对方明显的进球得分机会的认定，但犯规队员以争抢球为目的并且被判罚球点球，故应对其出示黄牌。裁判员临场判罚错误，漏判罚球点球和黄牌。","v":"wrong","videos":["2024/i07c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240508/1715161638926907.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"yellow"}},{"k":"2024-41","t":"case","s":"2024","issue":7,"no":5,"seq":41,"comp":"中甲联赛","round":"第9轮","home":"延边龙鼎","away":"黑龙江冰城","minute":"19","desc":"判例五：中甲联赛第9轮延边龙鼎VS黑龙江冰城，比赛第19分钟，延边龙鼎9号队员进球，进球前其与黑龙江冰城9号队员存在肢体接触，裁判员临场判进球有效。","appeal":"","concl":"对于此判例，评议组多数成员认为：延边龙鼎9号在进球前，手臂有推黑龙江冰城9号的动作，使后者失去重心以及争抢球的防守能力，应视为犯规，进球无效。裁判员临场判进球有效的决定错误。","v":"wrong","videos":["2024/i07c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240508/1715161654386299.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_invalid","c":"none"}},{"k":"2024-42","t":"case","s":"2024","issue":7,"no":6,"seq":42,"comp":"中甲联赛","round":"第9轮","home":"青岛红狮","away":"云南玉昆","minute":"90","desc":"判例六：中甲联赛第9轮青岛红狮VS云南玉昆，比赛第90分钟，云南玉昆30号队员在本方罚球区内存在疑似手球情况，裁判员临场未判罚其手球犯规，判罚攻方青岛红狮队27号队员手球犯规。","appeal":"","concl":"对于此判例，评议组一致认为：云南玉昆30号的手臂与球发生接触，手臂位置使身体不自然扩大，无论其手臂触球之前头部是否蹭到球，结合球的运行路线，均属于手球犯规，应判罚球点球，不需要出示红黄牌。裁判员临场判罚错误，漏判云南玉昆30号手球犯规和罚球点球。","v":"wrong","videos":["2024/i07c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240508/1715161666102833.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"yellow"}},{"k":"2024-43","t":"case","s":"2024","issue":7,"no":7,"seq":43,"comp":"中甲联赛","round":"第9轮","home":"大连英博","away":"广州俱乐部","minute":"","desc":"判例七：中甲联赛第9轮大连英博VS广州俱乐部，比赛第90+12分钟，任意球恢复比赛前，大连英博17号守门员抬手触及广州俱乐部8号队员面部，裁判员出示黄牌警告大连英博17号守门员。","appeal":"","concl":"对于此判例，评议组一致认为：大连英博17号守门员在比赛停止时不以争抢球为目的，使用手臂故意击打对方队员面部，应视为暴力行为并出示红牌罚令出场。裁判员临场出示黄牌的决定错误，漏判红牌。","v":"wrong","videos":["2024/i07c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240508/1715161679138763.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2024-44","t":"case","s":"2024","issue":7,"no":8,"seq":44,"comp":"中甲联赛","round":"第9轮","home":"大连英博","away":"广州俱乐部","minute":"","desc":"判例八：中甲联赛第9轮大连英博VS广州俱乐部，比赛结束后，在比赛场地内，大连英博44号队员冲撞广州俱乐部守门员。","appeal":"","concl":"对于此判例，评议组多数成员认为：大连英博44号从远处快速跑向对方守门员，并与对方发生身体接触，引发混乱场面，在此特定情形下，可以认定为暴力行为，并应出示红牌罚令出场。裁判员在比赛结束后离开比赛场地前均有权执行纪律措施（红黄牌），但本次事件发生在比赛结束后的群体混乱过程中，场地内人员众多，在此特殊条件下，裁判员对这一动作未作出处罚，不应视为漏判红牌。","v":"correct","videos":["2024/i07c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240508/1715161691403267.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"red"}},{"k":"2024-45","t":"case","s":"2024","issue":7,"no":9,"seq":45,"comp":"中乙联赛","round":"第7轮","home":"湖北青年星","away":"日照宇启","minute":"22","desc":"判例九：中乙联赛第7轮湖北青年星VS日照宇启，比赛第22分钟，湖北青年星52号带球突破，日照宇启22号与其争抢，双方在日照宇启球门线外倒地后，日照宇启22号脚部与湖北青年星52号身体有接触，裁判员未作犯规判罚。","appeal":"","concl":"对于此判例，评议组一致认为：双方队员在球门线外倒地，属于争抢球后的意外接触，日照宇启22号失去重心摔倒，并非带有目的性或者具有附加动作踩踏对方队员，不应视为犯规或暴力行为。同时评议组大多数成员认为，双方摔倒前在比赛场地内的争抢动作，也均不构成犯规。裁判员临场做出的不犯规的决定正确。","v":"correct","videos":["2024/i07c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240508/1715161708621649.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"playon","c":"none"}},{"k":"2024-46","t":"case","s":"2024","issue":7,"no":10,"seq":46,"comp":"中乙联赛","round":"第7轮","home":"赣州瑞狮","away":"广州豹","minute":"89","desc":"判例十：中乙联赛第7轮赣州瑞狮VS广东广州豹，比赛第89分钟，赣州瑞狮10号射门，广东广州豹20号在本方罚球区内用脚封挡对方射门后，球接触该队员手臂，裁判员未判罚手球犯规。","appeal":"","concl":"对于此判例，评议组一致认为：广东广州豹20号封挡对方射门后，球明显反弹变向后接触其手臂，手臂位置属于当前身体动作的合理结果，不应视为手球犯规。裁判员临场做出的不是手球犯规的决定正确。","v":"correct","videos":["2024/i07c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240508/1715161718630028.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2024-47","t":"case","s":"2024","issue":7,"no":11,"seq":47,"comp":"女超联赛","round":"第6轮","home":"海南琼中女足","away":"山东体彩女足","minute":"54","desc":"判例十一：女超联赛第6轮，海南琼中女足VS山东体彩女足，比赛第54分钟，海南琼中24号带球向山东体彩罚球区内突破，与山东体彩2号接触后倒地。裁判员未作判罚。","appeal":"","concl":"对于此判例，评议组一致认为：山东体彩2号在本方罚球区内拉扯对方进攻队员，应视为犯规并判罚球点球，该拉扯犯规符合破坏了对方明显进球得分机会的认定，应对犯规队员出示红牌罚令出场。临场裁判员判罚错误，漏判罚球点球和红牌。","v":"wrong","videos":["2024/i07c11-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240508/1715161733732605.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"red"}},{"k":"2024-48","t":"case","s":"2024","issue":8,"no":1,"seq":48,"comp":"中超联赛","round":"第11轮","home":"成都蓉城","away":"河南俱乐部","minute":"67","desc":"判例一：中超联赛第11轮，成都蓉城VS河南俱乐部，比赛第67分钟，成都蓉城8号队员在本方罚球区内封挡对方射门时，球与其手臂有接触。裁判员临场未判罚手球犯规，VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：从现有视频看，成都蓉城8号手臂与球有接触，但其手臂的位置并未使身体不自然变大，不应视为手球犯规，裁判员临场做出的不是手球犯规的决定正确。","v":"correct","videos":["2024/i08c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240515/1715767633867248.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2024-49","t":"case","s":"2024","issue":8,"no":2,"seq":49,"comp":"中超联赛","round":"第11轮","home":"成都蓉城","away":"河南俱乐部","minute":"71","desc":"判例二：中超联赛第11轮，成都蓉城VS河南俱乐部，比赛第71分钟，成都蓉城23号队员在本方罚球区内接球时，球与其手臂有接触。裁判员临场未判罚手球犯规，VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：成都蓉城23号在胸部停球后手臂触球，手臂没有故意向球移动的动作，手臂的位置在此情形下应视为合理和自然的位置，不是手球犯规，裁判员临场做出的不是手球犯规的决定正确。","v":"correct","videos":["2024/i08c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240515/1715767647709173.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2024-50","t":"case","s":"2024","issue":8,"no":3,"seq":50,"comp":"中超联赛","round":"第11轮","home":"青岛海牛","away":"南通支云","minute":"16","desc":"判例三：中超联赛第11轮，青岛海牛VS南通支云，比赛第16分钟，青岛海牛10号队员带球进入对方罚球区，南通支云5号队员防守时与其有接触，青岛海牛10号队员随后倒地。裁判员临场未判罚犯规，VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：南通支云5号的防守动作属于封挡对方射门，触到了球并且未侵犯对方队员，后续双方身体接触属于惯性造成的不可避免的接触，不应视为犯规。临场裁判员做出的不犯规的决定正确。","v":"correct","videos":["2024/i08c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240515/1715767668151442.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-51","t":"case","s":"2024","issue":8,"no":4,"seq":51,"comp":"中超联赛","round":"第11轮","home":"青岛海牛","away":"南通支云","minute":"83","desc":"判例四：中超联赛第11轮，青岛海牛VS南通支云，比赛第83分钟，南通支云10号队员带球，青岛海牛16号队员从其侧后方进行拦截，南通支云10号队员倒地。裁判员临场判罚青岛海牛16号队员犯规，向其出示黄牌（该队员本场第2张黄牌），因犯规地点在罚球区外，判罚直接任意球，VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：视频显示青岛海牛16号在铲球时，接触到南通支云10号左小腿，接触地点在罚球区外，应判罚青岛海牛16号犯规，并判直接任意球。同时该犯规情形符合阻止对方有希望的进攻的判定，应对犯规队员出示黄牌。裁判员临场判罚直接任意球并向青岛海牛16号出示黄牌的决定正确。","v":"correct","videos":["2024/i08c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240515/1715767691835464.mp4"],"cat":"freekick_foul","catname":"罚球区外一般犯规","ans":{"r":"directfk","c":"yellow"}},{"k":"2024-52","t":"case","s":"2024","issue":8,"no":5,"seq":52,"comp":"中超联赛","round":"第11轮","home":"青岛海牛","away":"南通支云","minute":"90","desc":"判例五：中超联赛第11轮，青岛海牛VS南通支云，比赛第90分钟，南通支云队进攻并向对方罚球区内传中，第一助理裁判员举旗示意球已在空中越过球门线，裁判员延迟鸣哨，随后南通支云队员完成头球射门，球在球门线附近被青岛海牛队员踢出解围后，裁判员鸣哨停止比赛并判给青岛海牛队踢球门球。经VAR介入，并执行视频助理裁判回看分析后，裁判员改判南通支云队进球且进球有效。","appeal":"","concl":"对于此判例，评议组一致认为：球门线机位的视频清晰显示，南通支云队传中时，球在运行过程中未越过球门线，第一助理裁判员判断失误，但裁判员运用了延迟鸣哨的方式使比赛继续进行，随后南通支云队头球射门，球在被青岛海牛队解围之前，已经整体越过了球门线进入球门，裁判组在VAR操作方面运用正确，VAR介入正确，裁判员改判进球有效正确，但第一助理裁判员的相关判罚属错判。","v":"correct","videos":["2024/i08c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240515/1715767736371292.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2024-53","t":"case","s":"2024","issue":8,"no":6,"seq":53,"comp":"中甲联赛","round":"第10轮","home":"南京城市","away":"重庆铜梁龙","minute":"85","desc":"判例六：中甲联赛第10轮，南京城市VS重庆铜梁龙，比赛第85分钟，重庆铜梁龙10号队员前插进入对方罚球区内接球，南京城市1号守门员出击防守，重庆铜梁龙10号队员摔倒，裁判员临场判罚南京城市1号守门员犯规，并判罚球点球。","appeal":"","concl":"对于此判例，评议组一致认为：现有视频不能清晰地呈现双方队员是否有身体接触，但重庆铜梁龙10号在双方可能的身体接触之前已经做出将要主动倒地的动作，南京城市1号守门员的出击无犯规动作，双方即使有接触，也是由攻方队员主动发起。攻方队员带有佯装被犯规并获得罚球点球的意图，应判攻方重庆铜梁龙10号违规（佯装），并向其出示黄牌，由南京城市队踢间接任意球恢复比赛。裁判员临场判罚南京城市1号守门员犯规并判罚球点球的决定错误。","v":"wrong","videos":["2024/i08c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240515/1715767753102846.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"indirectfk","c":"yellow"}},{"k":"2024-54","t":"case","s":"2024","issue":8,"no":7,"seq":54,"comp":"中乙联赛","round":"第8轮","home":"北京理工","away":"湖北青年星","minute":"98","desc":"判例七：中乙联赛第8轮，北京理工VS湖北青年星，比赛第98分钟，北京理工5号在进攻中被湖北青年星60号守门员犯规，裁判员先判罚犯规地点在罚球区外，并判罚直接任意球，经与助理裁判员沟通后，在比赛恢复前，改判为罚球点球，并向湖北青年星60号守门员出示黄牌。","appeal":"","concl":"对于此判例，评议组一致认为，湖北青年星60号守门员的犯规符合破坏对方明显的进球得分机会的认定，应被出示红牌罚令出场。对于犯规地点的认定，多数成员认为，湖北青年星60号守门员出击时在罚球区外对北京理工5号犯规，应判罚直接任意球。裁判员临场判罚球点球的决定错误，出示黄牌的决定错误。此判例也征求了国际裁判界权威专家的意见，其观点也认为应判罚罚球区外的犯规动作，并且出示红牌。","v":"wrong","videos":["2024/i08c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240515/1715767783335274.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"directfk","c":"red"}},{"k":"2024-55","t":"case","s":"2024","issue":8,"no":8,"seq":55,"comp":"女超联赛","round":"第7轮","home":"海南琼中女足","away":"上海农商银行女足","minute":"52","desc":"判例八：女超联赛第7轮，海南琼中女足VS上海农商银行女足，比赛第52分钟，上海农商银行女足39号队员带球向对方罚球区前进，海南琼中女足23号队员防守犯规。裁判员先判罚犯规地点在罚球区外，故判罚直接任意球，经助理裁判员提示，并与助理裁判员沟通后，裁判员改判为罚球点球，未出示红黄牌。","appeal":"","concl":"对于此判例，评议组多数成员认为，海南琼中女足23号在本方罚球区外对上海农商银行女足39号实施的犯规，是造成后者倒地的主要原因，应对此犯规动作判罚直接任意球。另外该犯规符合破坏对方明显的进球得分机会的认定，应向犯规队员出示红牌罚令出场。裁判员临场判罚球点球的决定错误，并且漏判红牌。","v":"wrong","videos":["2024/i08c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240515/1715767868615265.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"directfk","c":"red"}},{"k":"2024-56","t":"case","s":"2024","issue":9,"no":1,"seq":56,"comp":"中超联赛","round":"第13轮","home":"青岛海牛","away":"北京国安","minute":"72","desc":"判例一：中超联赛第13轮，青岛海牛VS北京国安，比赛第72分钟，青岛海牛11号队员在对方罚球区内争抢头球并取得进球，争抢头球时与北京国安5号队员有接触。裁判员临场判罚进球有效，VAR未介入。","appeal":"","concl":"对于此判例，评议组多数成员认为：青岛海牛11号起跳动作是自主完成的，并未借助手臂下压等动作来协助自身起跳或压制限制对方做出争抢动作，随后其手臂及身体与对方5号的接触属于双方争抢后的自然情况，不应视为犯规，裁判员临场做出的进球有效的决定正确。","v":"correct","videos":["2024/i09c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240529/1716970506516266.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"goal_valid","c":"none"}},{"k":"2024-57","t":"case","s":"2024","issue":9,"no":2,"seq":57,"comp":"中超联赛","round":"第13轮","home":"青岛海牛","away":"北京国安","minute":"87","desc":"判例二：中超联赛第13轮，青岛海牛VS北京国安，比赛第87分钟，北京国安29号队员在对方罚球区内争抢位置时与青岛海牛防守队员发生身体接触，随后北京国安29号倒地。裁判员临场未判罚犯规，VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：北京国安29号在争抢位置时造成了与对方的接触，青岛海牛队员无明显的推搡或其他犯规动作，双方的接触属于正常范畴，不犯规。裁判员临场未判罚犯规的决定正确。","v":"correct","videos":["2024/i09c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240529/1716970534917505.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-58","t":"case","s":"2024","issue":9,"no":3,"seq":58,"comp":"中超联赛","round":"第13轮","home":"南通支云","away":"沧州雄狮","minute":"","desc":"判例三：中超联赛第13轮，南通支云VS沧州雄狮，比赛第90+3分钟，南通支云9号队员在进攻争抢空中球时疑似与沧州雄狮14号守门员有身体接触，随后南通支云进球，裁判员临场判罚进球有效，VAR未介入。","appeal":"","concl":"对于此判例，评议组多数成员认为：沧州雄狮14号守门员在已经完全用手控制球的情况下，南通支云9号在空中与其腿部发生接触，造成其失去重心，失衡落地后失去对球的控制，应判进攻方南通支云9号犯规在先，进球无效。裁判员做出的进球有效的决定错误，VAR未介入错误。","v":"wrong","videos":["2024/i09c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240529/1716970556391884.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_invalid","c":"none"}},{"k":"2024-59","t":"case","s":"2024","issue":9,"no":4,"seq":59,"comp":"中国足协杯","round":"第3轮","home":"大连鲲城","away":"云南玉昆","minute":"36","desc":"判例四：中国足协杯第3轮，大连鲲城VS云南玉昆，比赛第36分钟，大连鲲城17号队员在本方罚球区附近对云南玉昆14号队员犯规，裁判员判罚直接任意球，在与助理裁判员和第四官员沟通后，向大连鲲城17号出示红牌罚令出场。","appeal":"","concl":"对于此判例，评议组一致认为：犯规的发生地点在罚球区外，裁判员判罚直接任意球正确。同时，评议组多数成员认为：根据云南玉昆14号进攻得球时的位置、方向及控球情形来看，如果大连鲲城17号不实施犯规，周边的防守队员也无法及时形成有效防守。该犯规符合破坏对方明显的进球得分机会的认定标准。裁判员判罚直接任意球并向大连鲲城17号出示红牌罚令出场的决定正确。","v":"correct","videos":["2024/i09c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240529/1716970594244029.mp4"],"cat":"dogso","catname":"破坏明显进球得分机会（DOGSO）","ans":{"r":"directfk","c":"red"}},{"k":"2024-60","t":"case","s":"2024","issue":9,"no":5,"seq":60,"comp":"女甲联赛","round":"第8轮","home":"辽宁沈北禾丰","away":"河北君乐宝","minute":"6","desc":"判例五：女甲联赛第8轮，辽宁沈北禾丰VS河北君乐宝，比赛第6分钟，河北君乐宝10号队员带球进攻中远射，辽宁沈北禾丰守门员在罚球区外用手拦截该球。裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：辽宁沈北禾丰守门员在本方罚球区外通过手球犯规破坏了对方的进球，应判罚手球犯规、直接任意球，并出示红牌罚令出场。裁判员临场决定错误，漏判直接任意球，漏判红牌。","v":"wrong","videos":["2024/i09c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240529/1716970631740725.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"directfk","c":"red"}},{"k":"2024-61","t":"case","s":"2024","issue":9,"no":6,"seq":61,"comp":"中乙联赛","round":"第9轮","home":"海门珂缔缘","away":"北京理工","minute":"22","desc":"判例六：中乙联赛第9轮，海门珂缔缘VS北京理工，比赛第22分钟，北京理工1号守门员在本方罚球区外触球，裁判员临场未判罚手球犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：从现有视频上看，北京理工1号守门员在试图踢球未果后，手臂在罚球区外与球有接触，但其手臂位置属于该动作之下的合理位置，接触了近距离来球，不应视为手球犯规。裁判员临场未判罚手球犯规的决定正确。","v":"correct","videos":["2024/i09c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240529/1716970647566360.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2024-62","t":"case","s":"2024","issue":9,"no":7,"seq":62,"comp":"中乙联赛","round":"第9轮","home":"海门珂缔缘","away":"北京理工","minute":"","desc":"判例七：中乙联赛第9轮，海门珂缔缘VS北京理工，比赛第90+4分钟，海门珂缔缘9号队员在对方罚球区内倒地，裁判员临场未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：该判例来自球队提出的申诉，但视频无法看到双方队员是否接触及接触的具体情况，裁判员临场未判罚犯规的决定应予支持。","v":"correct","videos":["2024/i09c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240529/1716970661706567.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-63","t":"case","s":"2024","issue":9,"no":8,"seq":63,"comp":"中乙联赛","round":"第9轮","home":"海门珂缔缘","away":"北京理工","minute":"","desc":"判例八：中乙联赛第9轮，海门珂缔缘VS北京理工，比赛第90+7分钟，海门珂缔缘45号队员和60号队员先后在对方罚球区内倒地，裁判员临场均未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：造成海门珂缔缘45号倒地的争抢是双方在接近同等机会下的正常争抢动作，之后海门珂缔缘60号带球进入对方罚球区，北京理工22号的铲球防守动作清晰触到了球，并且无其他犯规情况。两次进攻队员的倒地，防守队员均不犯规。裁判员临场决定正确。","v":"correct","videos":["2024/i09c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240529/1716970679406945.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-64","t":"case","s":"2024","issue":9,"no":9,"seq":64,"comp":"中乙联赛","round":"第9轮","home":"廊坊荣耀之城","away":"日照宇启","minute":"42","desc":"判例九：中乙联赛第9轮，廊坊荣耀之城VS日照宇启，比赛第42分钟，日照宇启在前场左路踢任意球，双方在罚球区内争抢。球出球门线后，裁判员出示红牌将日照宇启5号队员罚令出场。","appeal":"","concl":"对于此判例，评议组一致认为：日照宇启5号在无球状态下，挥手击打对方头颈部，虽然视频不能清晰展示具体的接触情况，但应视为暴力行为。裁判员临场出示红牌的决定正确。","v":"correct","videos":["2024/i09c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240529/1716970702313242.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"red"}},{"k":"2024-65","t":"case","s":"2024","issue":9,"no":10,"seq":65,"comp":"中乙联赛","round":"第9轮","home":"广西蓝航","away":"赣州瑞狮","minute":"68","desc":"判例十：中乙联赛第9轮，广西蓝航VS赣州瑞狮，比赛第68分钟，赣州瑞狮35号队员在中场边线附近区域犯规，裁判员临场判罚其犯规并出示红牌将其罚令出场。","appeal":"","concl":"对于此判例，评议组多数成员认为：赣州瑞狮35号的铲球动作属于草率的犯规，未达到鲁莽犯规（黄牌）或者严重犯规（红牌）的程度，但随后起身时抬腿的动作，除摆脱对方身体以外，也带有附加的挑衅成分，应以非体育行为对赣州瑞狮35号出示黄牌警告。裁判员临场出示红牌的决定错误。","v":"wrong","videos":["2024/i09c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240529/1716970726276187.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"yellow"}},{"k":"2024-66","t":"case","s":"2024","issue":9,"no":11,"seq":66,"comp":"中乙联赛","round":"第9轮","home":"广西蓝航","away":"赣州瑞狮","minute":"72","desc":"判例十一：中乙联赛第9轮，广西蓝航VS赣州瑞狮，比赛第72分钟，赣州瑞狮54号队员在对方罚球区内与广西蓝航41号守门员发生身体接触，双方倒地，裁判员临场未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：广西蓝航41号守门员出击后已经停下准备接球，赣州瑞狮54号抢先顶到球，之后双方正常身体接触。广西蓝航41号守门员手臂与对方的接触也不属于击打犯规。裁判员临场未判罚犯规的决定正确。","v":"correct","videos":["2024/i09c11-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240529/1716970743994930.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-67","t":"case","s":"2024","issue":10,"no":1,"seq":67,"comp":"中甲联赛","round":"第12轮","home":"江西庐山","away":"广州俱乐部","minute":"29","desc":"判例一：中甲联赛第12轮，江西庐山VS广州俱乐部，比赛第29分钟，广州俱乐部9号队员在对方罚球区内与江西庐山19号守门员争抢球后倒地。裁判员临场判罚江西庐山19号守门员犯规，判罚球点球，并向其出示黄牌。","appeal":"","concl":"对于此判例，评议组成员一致认为：江西庐山19号守门员率先触及球，且没有附加的犯规动作，不应视为犯规，裁判员临场判罚犯规并判罚球点球及黄牌的决定错误。","v":"wrong","videos":["2024/i10c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240612/1718199077533054.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-68","t":"case","s":"2024","issue":10,"no":2,"seq":68,"comp":"中乙联赛","round":"第10轮","home":"陕西联合","away":"湖北青年星","minute":"76","desc":"判例二：中乙联赛第10轮，陕西联合VS湖北青年星，比赛第76分钟，湖北青年星进攻，陕西联合49号队员手球犯规，裁判临场判罚直接任意球并向其出示黄牌。","appeal":"","concl":"对于此判例，评议组一致认为：陕西联合49号手球犯规，阻止了对方有希望的进攻，应出示黄牌警告；考虑到进攻队员控球的可能性、犯规地点与球门的距离，以及中路其他防守队员做出有效防守的可能性等因素，该犯规不符合破坏对方明显的进球得分机会（DOGSO）的判定标准，不应出示红牌。裁判员临场做出的手球犯规、直接任意球及黄牌警告的决定正确。","v":"correct","videos":["2024/i10c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240612/1718199103855380.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"directfk","c":"yellow"}},{"k":"2024-69","t":"case","s":"2024","issue":10,"no":3,"seq":69,"comp":"中乙联赛","round":"第11轮","home":"廊坊荣耀之城","away":"湖北青年星","minute":"44","desc":"判例三：中乙联赛第11轮，廊坊荣耀之城VS湖北青年星，比赛第44分钟，湖北青年星51号队员在中场区域拉扯廊坊荣耀之城9号队员，裁判员鸣哨判罚犯规后，廊坊荣耀之城9号撞击湖北青年星51号，裁判员向廊坊荣耀之城9号出示红牌罚令出场，同时向湖北青年星队51号出示黄牌。","appeal":"","concl":"对于此判例，评议组多数成员认为：湖北青年星51号的拉扯行为，应以非体育行为为由予以黄牌警告。裁判员临场判罚犯规并出示黄牌警告的决定正确。廊坊荣耀之城9号撞击对方队员的行为，属于被对方侵犯之后的情绪宣泄，从撞击部位、力度以及对对方队员造成的危险等方面分析，不构成暴力行为，应以非体育行为为由予以黄牌警告，裁判员临场对其出示红牌罚令出场的决定错误。","v":"wrong","videos":["2024/i10c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240612/1718199134457557.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"yellow"}},{"k":"2024-70","t":"case","s":"2024","issue":11,"no":1,"seq":70,"comp":"中甲联赛","round":"第14轮","home":"大连英博","away":"云南玉昆","minute":"49","desc":"判例一：中甲联赛第14轮，大连英博VS云南玉昆，比赛第49分钟，大连英博进攻中远射，球击中云南玉昆球门横梁后落地弹出。裁判员临场决定为未进球，比赛继续。","appeal":"","concl":"对于此判例，评议组成员一致认为：大连英博射门后，球在击中横梁反弹至地面时，已经整体越过了球门线，应为进球得分。裁判组临场做出的未进球的决定错误，漏判进球。另外，评议组指出：在本判例中，大连英博进攻中在罚球区外起脚远射，球击中球门横梁弹下，触地后弹出，在此特定情形下，在未使用球门线技术或视频助理裁判的比赛中，助理裁判员尤其是裁判员几乎不可能及时到达能够准确判断球是否越过球门线的位置，是一次难度极大的判罚。","v":"wrong","videos":["2024/i11c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240619/1718788738188230.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2024-71","t":"case","s":"2024","issue":11,"no":2,"seq":71,"comp":"中甲联赛","round":"第14轮","home":"石家庄功夫","away":"上海嘉定汇龙","minute":"64","desc":"判例二：中甲联赛第14轮，石家庄功夫VS上海嘉定汇龙，比赛第64分钟，石家庄功夫8号队员在对方罚球区内倒地，裁判员临场未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：上海嘉定汇龙几名防守队员与对方进攻队员的身体接触以及铲球解围，均属于比赛中正常和可接受的范畴，不构成犯规。裁判员临场未判罚犯规的决定正确。","v":"correct","videos":["2024/i11c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240619/17187
