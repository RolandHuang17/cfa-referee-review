:"2026","issue":9,"no":3,"seq":106,"comp":"中超联赛","round":"第15轮","home":"重庆铜梁龙","away":"北京国安","minute":"85","desc":"判例三：中超联赛第15轮，重庆铜梁龙VS北京国安。比赛第85分钟，北京国安进球。裁判员判进球有效，VAR未介入。","appeal":"重庆铜梁龙俱乐部申诉意见认为：对方9号队员冲撞本方守门员犯规在先，后续进球应判无效。","concl":"对于此判例，评议组多数成员认为：双方队员相向移动争抢高空球，北京国安9号正常起跳，并未跳向冲撞重庆铜梁龙队员，并且在起跳后受到同样跳起争抢的重庆铜梁龙32号队员接触挤靠后与守门员发生接触，守门员当时并未用手控制球，双方队员属于正常接触，不构成犯规。随后北京国安29号的进球有效。裁判员判北京国安进球有效的决定正确。VAR未介入正确。","v":"correct","videos":["2026/i09c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260604/1780553244737056.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2026-107","t":"case","s":"2026","issue":9,"no":4,"seq":107,"comp":"中甲联赛","round":"第10轮","home":"大连鲲城","away":"石家庄功夫","minute":"1","desc":"判例四：中甲联赛第10轮，大连鲲城VS石家庄功夫。比赛第1分钟，石家庄功夫队进攻传中，中路队员抢点射门，球疑似接触大连鲲城13号队员手臂，裁判员未判罚手球犯规。","appeal":"石家庄功夫俱乐部申诉意见认为：对方13号手球犯规，应判罚球点球。","concl":"对于此判例，评议组多数成员认为：从现有视频看，大连鲲城13号手臂在对方射门时处于正常位置，球经地面反弹变向后接触其手臂，应视为意外手球，不构成犯规。裁判员未判罚手球犯规的决定正确。","v":"correct","videos":["2026/i09c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260604/1780553263345646.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2026-108","t":"case","s":"2026","issue":9,"no":5,"seq":108,"comp":"中甲联赛","round":"第10轮","home":"广西恒宸","away":"佛山南狮","minute":"","desc":"判例五：中甲联赛第10轮，广西恒宸VS佛山南狮，比赛第90+4分钟，广西恒宸10号队员在对方罚球区内带球进攻时倒地，裁判员判其佯装（假摔）违规，并向其出示黄牌，由佛山南狮踢间接任意球恢复比赛。","appeal":"广西恒宸俱乐部申诉意见认为：本方10号带球突破过程中，对方13号、12号先后犯规，均应判罚球点球。","concl":"对于此判例，评议组一致认为：广西恒宸10号带球突破过程中，佛山南狮13号与其身体接触程度可接受，不构成犯规；佛山南狮12号争抢时伸脚与广西恒宸10号腿部无接触或仅有轻微可忽略的接触。广西恒宸10号主动夸张倒地，属于佯装（假摔）。裁判员判广西恒宸10号佯装（假摔）违规并出示黄牌的决定正确。","v":"correct","videos":["2026/i09c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260604/1780553295861383.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"yellow"}},{"k":"2026-109","t":"case","s":"2026","issue":9,"no":6,"seq":109,"comp":"中甲联赛","round":"第10轮","home":"梅州客家犀旺","away":"定南赣联","minute":"72","desc":"判例六：中甲联赛第10轮，梅州客家犀旺VS定南赣联，比赛第72分钟，梅州客家犀旺22号队员在对方罚球区内与定南赣联7号队员接触后倒地，裁判员未判罚犯规。","appeal":"梅州客家犀旺俱乐部申诉意见认为：对方7号对本方22号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：梅州客家犀旺22号占据身位即将控球，定南赣联7号从其身后实施了具有一定力度的冲撞，应视为犯规，并判罚球点球。裁判员决定错误，漏判罚球点球。","v":"wrong","videos":["2026/i09c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260604/1780553326857530.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2026-110","t":"case","s":"2026","issue":9,"no":7,"seq":110,"comp":"中甲联赛","round":"第10轮","home":"梅州客家犀旺","away":"定南赣联","minute":"77","desc":"判例七：中甲联赛第10轮，梅州客家犀旺VS定南赣联，比赛第77分钟，双方队员在定南赣联罚球区内争抢球后，梅州客家犀旺18号倒地。裁判员未判罚犯规。","appeal":"梅州客家犀旺俱乐部申诉意见认为：对方队员踢倒本方18号犯规，应判罚球点球。","concl":"对于此判例，评议组多数成员认为：梅州客家犀旺18号伸腿试图触球，但并未明显将球踢出，定南赣联8号清晰地将球踢出，双方的接触不构成犯规。裁判员未判罚犯规的决定正确。","v":"correct","videos":["2026/i09c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260604/1780553353460116.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-111","t":"case","s":"2026","issue":9,"no":8,"seq":111,"comp":"中甲联赛","round":"第10轮","home":"梅州客家犀旺","away":"定南赣联","minute":"","desc":"判例八：中甲联赛第10轮，梅州客家犀旺VS定南赣联，比赛第90+3分钟，裁判员判定南赣联28号队员对梅州客家犀旺18号队员犯规，并出示黄牌。","appeal":"梅州客家犀旺俱乐部申诉意见认为：对方28号应被出示红牌罚令出场。","concl":"对于此判例，评议组一致认为：从现有视频看，定南赣联28号犯规时脚外侧接触对方腿部，随即滑下，构成鲁莽犯规，未构成严重犯规。支持裁判员向定南赣联28号出示黄牌的决定。","v":"correct","videos":["2026/i09c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260604/1780553378899875.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2026-112","t":"case","s":"2026","issue":9,"no":9,"seq":112,"comp":"中乙联赛","round":"第10轮","home":"山西崇德荣海","away":"青岛红狮","minute":"33","desc":"判例九：中乙联赛第10轮，山西崇德荣海VS青岛红狮，比赛第33分钟，山西崇德荣海38号队员与青岛红狮4号队员争抢球后，双方队员发生聚集冲突，裁判员向山西崇德荣海38号、青岛红狮4号出示红牌罚令出场。","appeal":"","concl":"此判例涉及双方各1名队员的违规判罚。对于山西崇德荣海38号队员，评议组多数成员认为，在俱乐部申诉的主要问题（罚令出场）上，裁判员决定正确，应罚令出场，但罚令出场的理由有所不同：评议组部分成员认为，山西崇德荣海38号在争抢高空球时鲁莽犯规，并且在比赛停止后实施非体育行为，应两次被出示黄牌从而罚令出场；另一部分评议组成员认为，山西崇德荣海38号在比赛停止后踢青岛红狮队员4号，构成暴力行为，应直接红牌罚令出场。对于青岛红狮4号队员，评议组多数成员认为：从现有视频看，青岛红狮4号在试图起身过程中，手臂动作并非故意击打对方队员头面部，应视为非体育行为并出示黄牌，并非暴力行为，不应出示红牌。此判例裁判员将山西崇德荣海38号罚令出场的决定结果正确；向青岛红狮4号出示红牌的决定错误。","v":"wrong","videos":["2026/i09c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260604/1780553443323390.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"red"}},{"k":"2026-113","t":"case","s":"2026","issue":9,"no":10,"seq":113,"comp":"中乙联赛","round":"第10轮","home":"山西崇德荣海","away":"青岛红狮","minute":"85","desc":"判例十：中乙联赛第10轮，山西崇德荣海VS青岛红狮，比赛第85分钟，青岛红狮14号队员前场试图抢断球后倒地，裁判员判山西崇德荣海11号队员犯规，并出示红牌。","appeal":"山西崇德荣海俱乐部申诉意见认为：本方11号不犯规，不应被出示红牌，应判对方14号犯规。","concl":"对于此判例，评议组一致认为：从现有视频看，在青岛红狮14号抢断球后，应为山西崇德荣海11号对青岛红狮14号犯规，并且符合破坏明显进球得分机会的判断标准。裁判员判山西崇德荣海11号犯规并出示红牌的决定正确。","v":"correct","videos":["2026/i09c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260604/1780558640442251.mp4"],"cat":"dogso","catname":"破坏明显进球得分机会（DOGSO）","ans":{"c":"red"}},{"k":"2026-114","t":"case","s":"2026","issue":9,"no":11,"seq":114,"comp":"中乙联赛","round":"第10轮","home":"长春喜都","away":"北京理工","minute":"11","desc":"判例十一：中乙联赛第10轮，长春喜都VS北京理工，比赛第11分钟，长春喜都19号队员进球，裁判员判其在进球前手球犯规，进球无效。","appeal":"长春喜都俱乐部申诉意见认为：本方19号不犯规，进球应有效。","concl":"对于此判例，评议组一致认为：从现有视频看，长春喜都19号手臂触球并构成犯规，后续进球无效。裁判员判长春喜都19号手球犯规、进球无效的决定正确。","v":"correct","videos":["2026/i09c11-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260604/1780553517875625.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"goal_invalid","c":"none"}},{"k":"2026-115","t":"case","s":"2026","issue":9,"no":12,"seq":115,"comp":"中乙联赛","round":"第10轮","home":"广州蒲公英","away":"赣州瑞狮","minute":"35","desc":"判例十二：中乙联赛第10轮，广州蒲公英VS赣州瑞狮，比赛第35分钟，裁判员判罚赣州瑞狮3号队员在本方罚球区内犯规，并判罚球点球。","appeal":"赣州瑞狮俱乐部申诉意见认为：本方队员不犯规，不应被判罚球点球。应判对方队员假摔并出示黄牌。","concl":"对于此判例，评议组一致认为：双方正常争抢接触，赣州瑞狮3号未犯规，广州蒲公英队员也未构成佯装（假摔）。裁判员判赣州瑞狮3号犯规并判罚球点球的决定错误。","v":"wrong","videos":["2026/i09c12-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260604/1780553544112617.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-116","t":"case","s":"2026","issue":9,"no":13,"seq":116,"comp":"中乙联赛","round":"第10轮","home":"海门珂缔缘","away":"上海赛更达","minute":"31","desc":"判例十三：中乙联赛第10轮，海门珂缔缘VS上海赛更达，比赛第31分钟，海门珂缔缘8号队员在对方罚球区线附近争抢球后倒地，裁判员未判罚犯规。","appeal":"海门珂缔缘俱乐部申诉意见认为：对方35号队员对本方8号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：从现有视频的拍摄距离和角度看，上海赛更达防守队员与海门珂缔缘8号的接触较为轻微，没有致使后者倒地。支持裁判员作出的不犯规的决定。","v":"correct","videos":["2026/i09c13-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260604/1780553564443394.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-117","t":"case","s":"2026","issue":9,"no":14,"seq":117,"comp":"中乙联赛","round":"第10轮","home":"海门珂缔缘","away":"上海赛更达","minute":"42","desc":"判例十四：中乙联赛第10轮，海门珂缔缘VS上海赛更达，比赛第42分钟，上海赛更达进球，裁判员判进球有效。","appeal":"海门珂缔缘俱乐部申诉意见认为：对方传中时，对方29号队员处于越位位置并且干扰了本方队员，越位犯规在先，之后对方另一名队员进球，应为无效。","concl":"对于此判例，评议组一致认为：现有视频无法准确判断上海赛更达传球时，其29号队员是否处于越位位置。且上海赛更达29号未触球也未构成干扰对方队员，即使处于越位位置，也不是越位犯规。裁判员判上海赛更达进球有效的决定正确。","v":"correct","videos":["2026/i09c14-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260604/1780553589357152.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2026-118","t":"case","s":"2026","issue":10,"no":1,"seq":118,"comp":"中甲联赛","round":"第11轮","home":"南京城市","away":"宁波俱乐部","minute":"34","desc":"判例一：中甲联赛第11轮，南京城市VS宁波俱乐部。比赛第34分钟，在宁波俱乐部罚球区内，南京城市10号队员与宁波俱乐部38号守门员争抢时发生接触，后者倒地，随后南京城市9号队员补射进球，裁判员判南京城市10号对对方守门员犯规在先，进球无效。","appeal":"南京城市俱乐部申诉意见认为：本方10号并未对对方守门员犯规，后续进球应有效。","concl":"对于此判例，评议组多数成员认为：南京城市10号率先触球，宁波俱乐部38号守门员出击，双方队员在触球后发生不可避免的接触，双方均不犯规，后续进球有效。裁判员判南京城市10号犯规并判进球无效的决定错误。","v":"wrong","videos":["2026/i10c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260618/1781744293554592.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2026-119","t":"case","s":"2026","issue":10,"no":2,"seq":119,"comp":"中甲联赛","round":"第11轮","home":"南京城市","away":"宁波俱乐部","minute":"77","desc":"判例二：中甲联赛第11轮，南京城市VS宁波俱乐部。比赛第77分钟，南京城市进攻中传中至对方罚球区内，南京城市9号队员倒地，裁判员未判罚犯规。","appeal":"南京城市俱乐部申诉意见认为：对方11号对本方9号犯规，本方应获得罚球点球。","concl":"对于此判例，评议组一致认为：宁波俱乐部11号手臂与南京城市9号有接触，但力度轻微，未达到犯规程度，南京城市9号也有借此接触主动倒地的成分。裁判员未判罚犯规的决定正确。","v":"correct","videos":["2026/i10c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260618/1781744320572435.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-120","t":"case","s":"2026","issue":10,"no":3,"seq":120,"comp":"中甲联赛","round":"第11轮","home":"南京城市","away":"宁波俱乐部","minute":"","desc":"判例三：中甲联赛第11轮，南京城市VS宁波俱乐部。比赛第90+4分钟，南京城市队进攻中传中至对方罚球区内，南京城市20号队员倒地，裁判员未判罚犯规。","appeal":"南京城市俱乐部申诉意见认为：对方2号推搡本方20号犯规；之前对方5号拉拽本方9号犯规，本方应获得罚球点球。","concl":"对于此判例，评议组一致认为：南京城市9号未向球的落点方向争抢，宁波俱乐部5号对其的拉拽动作不构成犯规。随后宁波俱乐部2号手臂与南京城市20号有接触，但没有发力推搡，其程度也不构成犯规。裁判员未判罚犯规的决定正确。","v":"correct","videos":["2026/i10c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260618/1781744350631706.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-121","t":"case","s":"2026","issue":10,"no":4,"seq":121,"comp":"中乙联赛","round":"第9轮","home":"兰州陇原竞技","away":"大连可为","minute":"20","desc":"判例四：中乙联赛第9轮，兰州陇原竞技VS大连可为。比赛第20分钟，大连可为27号队员在本方罚球区内疑似手球，裁判员未判罚手球犯规。","appeal":"兰州陇原竞技俱乐部申诉意见认为：对方27号手球犯规，本方应获得罚球点球。","concl":"对于此判例，评议组一致认为：大连可为27号在本方罚球区内手臂上扬并触球，应判手球犯规和罚球点球。裁判员决定错误，漏判手球犯规，漏判罚球点球。","v":"wrong","videos":["2026/i10c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260618/1781744386534255.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2026-122","t":"case","s":"2026","issue":10,"no":5,"seq":122,"comp":"中乙联赛","round":"第9轮","home":"兰州陇原竞技","away":"大连可为","minute":"48","desc":"判例五：中乙联赛第9轮，兰州陇原竞技VS大连可为。比赛第48分钟，兰州陇原竞技踢角球，球传至大连可为罚球区内，兰州陇原竞技队员头顶球后，大连可为队员疑似手球，裁判员未判罚手球犯规。","appeal":"兰州陇原竞技俱乐部申诉意见认为：对方队员手球犯规，本方应获得罚球点球。","concl":"对于此判例，评议组一致认为：现有视频无法清晰展示球是否接触大连可为队员手臂以及接触的具体情况；裁判员临场观察位置较好，支持裁判员作出的不是手球犯规的决定。","v":"correct","videos":["2026/i10c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260618/1781744444859354.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2026-123","t":"case","s":"2026","issue":10,"no":6,"seq":123,"comp":"中乙联赛","round":"第11轮","home":"山东泰山B队","away":"海门珂缔缘","minute":"18","desc":"判例六：中乙联赛第11轮，山东泰山B队VS海门珂缔缘。比赛第18分钟，山东泰山B队踢角球，球传至海门珂缔缘罚球区内，双方争抢后，球进入球门，裁判员判山东泰山B队23号队员与海门珂缔缘22号守门员争抢高空球时犯规，后续进球无效。","appeal":"山东泰山俱乐部申诉意见认为：本方23号未犯规，后续本方进球应有效。","concl":"对于此判例，评议组一致认为：山东泰山B队23号率先正常起跳争抢高空球，未对海门珂缔缘22号守门员做出犯规动作。但因裁判员在球进入球门前已经鸣哨停止比赛，评议组仅认定裁判员判山东泰山B队23号犯规的决定错误。","v":"wrong","videos":["2026/i10c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260618/1781744480801757.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"playon","c":"none"}},{"k":"2026-124","t":"case","s":"2026","issue":10,"no":7,"seq":124,"comp":"中乙联赛","round":"第11轮","home":"广东铭途","away":"杭州临平吴越","minute":"","desc":"判例七：中乙联赛第11轮，广东铭途VS杭州临平吴越。比赛第90+4分钟，裁判员判广东铭途14号守门员在本方罚球区外手球犯规，并出示红牌。","appeal":"广东铭途俱乐部申诉意见认为：本方14号守门员未手球犯规，不应被出示红牌。","concl":"对于此判例，评议组一致认为：广东铭途14号守门员左手臂位置收拢于身体，且没有附加手球犯规动作，右手臂未触球，不构成手球犯规。裁判员判广东铭途14号守门员手球犯规，以及出示红牌的决定均为错误。","v":"wrong","videos":["2026/i10c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260618/1781744518120182.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2026-125","t":"case","s":"2026","issue":10,"no":8,"seq":125,"comp":"中乙联赛","round":"第11轮","home":"温州俱乐部","away":"厦门飞鹭","minute":"21","desc":"判例八：中乙联赛第11轮，温州俱乐部VS厦门飞鹭。比赛第21分钟，裁判员判温州俱乐部28号队员对厦门飞鹭5号队员犯规，并出示黄牌。","appeal":"厦门飞鹭俱乐部申诉意见认为：对方8号队员也对本方5号实施了犯规，并且属于恶意严重犯规，应向对方8号出示红牌。","concl":"对于此判例，首先评议组多数成员认为：现有视频不能清晰证明温州俱乐部8号与厦门飞鹭5号的接触部位和力度，从视频上看应视为鲁莽犯规并出示黄牌，不应出示红牌。在俱乐部申诉的核心问题（红牌）上，裁判员决定正确，不是红牌。但裁判员漏判温州俱乐部8号黄牌。其次评议组多数成员认为：温州俱乐部28号对厦门飞鹭5号的拉扯不构成阻止对方有希望的进攻的犯规，不应出示黄牌，裁判员向温州俱乐部28号出示黄牌的决定错误。","v":"wrong","videos":["2026/i10c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260618/1781744552947499.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk"}},{"k":"2026-126","t":"case","s":"2026","issue":10,"no":9,"seq":126,"comp":"中乙联赛","round":"第11轮","home":"温州俱乐部","away":"厦门飞鹭","minute":"46","desc":"判例九：中乙联赛第11轮，温州俱乐部VS厦门飞鹭。比赛第46分钟，裁判员判厦门飞鹭7号队员与温州俱乐部6号队员争抢时严重犯规，并出示红牌。","appeal":"厦门飞鹭俱乐部申诉意见认为：本方7号不构成严重犯规，不应被出示红牌。","concl":"对于此判例，评议组一致认为：厦门飞鹭7号非法使用手臂与对方接触争抢球，属于鲁莽犯规，应出示黄牌；但不属于使用手臂作为武器击打对方队员头面部，不应出示红牌。裁判员向厦门飞鹭7号出示红牌的决定错误。","v":"wrong","videos":["2026/i10c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260618/1781744637247384.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"yellow"}},{"k":"2026-127","t":"case","s":"2026","issue":11,"no":1,"seq":127,"comp":"中超联赛","round":"第16轮","home":"重庆铜梁龙","away":"天津津门虎","minute":"90","desc":"判例一：中超联赛第16轮，重庆铜梁龙VS天津津门虎。比赛第90分钟，天津津门虎8号队员进球。助理裁判员示意天津津门虎7号队员越位犯规，裁判员判天津津门虎7号越位犯规在先，进球无效。随后裁判员主动发起在场回看，经在场回看后，最终判定越位犯规在先，进球无效。","appeal":"天津津门虎俱乐部申诉意见认为：本方7号未阻挡守门员视线及影响扑救动作，不应视为越位犯规，进球应有效。","concl":"对于此判例，评议组一致认为：处于越位位置的天津津门虎7号队员虽未触及球，但其做出的明显举动对重庆铜梁龙守门员处理球能力造成了影响，应视为干扰对方队员的越位犯规。裁判员经在场回看确认后，判定天津津门虎7号越位犯规在先、进球无效的决定正确。","v":"correct","videos":["2026/i11c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260701/1782903580495482.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2026-128","t":"case","s":"2026","issue":11,"no":2,"seq":128,"comp":"中超联赛","round":"第16轮","home":"北京国安","away":"武汉三镇","minute":"52","desc":"判例二：中超联赛第16轮，北京国安VS武汉三镇。比赛第52分钟，武汉三镇7号队员在对方罚球区线附近与北京国安8号队员接触后倒地。裁判员判北京国安8号在本方罚球区内犯规，并判罚球点球。VAR介入后，裁判员最终认定犯规地点在罚球区外，改判由武汉三镇队踢直接任意球。","appeal":"武汉三镇俱乐部申诉意见认为：对方8号犯规接触点在罚球区内，应判罚球点球。","concl":"对于此判例，评议组一致认为：从VAR检查视频中的相关画面看，北京国安8号犯规的接触点在罚球区外，不构成罚球点球。经VAR介入后，裁判员判由武汉三镇队踢直接任意球的决定正确。VAR介入正确。","v":"correct","videos":["2026/i11c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260701/1782903603881328.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2026-129","t":"case","s":"2026","issue":11,"no":3,"seq":129,"comp":"中超联赛","round":"第16轮","home":"北京国安","away":"武汉三镇","minute":"","desc":"判例三：中超联赛第16轮，北京国安VS武汉三镇。比赛第90+4分钟，武汉三镇队员进攻中将球传至北京国安罚球区内，球接触北京国安7号队员身体后弹到距离较近的北京国安8号队员手臂上。裁判员未判罚手球犯规，VAR未介入。","appeal":"武汉三镇俱乐部申诉意见认为：对方8号手臂不在自然位置，应判手球犯规和罚球点球。","concl":"对于此判例，评议组一致认为：球经北京国安队7号身体近距离折射后意外接触北京国安8号手臂，其手臂位置不属于使身体不自然扩大并冒手球犯规风险的情形，不构成手球犯规。裁判员未判罚手球犯规正确。VAR未介入正确。","v":"correct","videos":["2026/i11c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260701/1782903628471252.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2026-130","t":"case","s":"2026","issue":11,"no":4,"seq":130,"comp":"中超联赛","round":"第16轮","home":"大连英博","away":"上海申花","minute":"19","desc":"判例四：中超联赛第16轮，大连英博海发VS上海申花。比赛第19分钟，上海申花19号队员在对方罚球区内与大连英博海发6号队员接触后倒地，裁判员未判罚犯规，VAR介入，裁判员经在场回看后，判大连英博海发6号犯规并判罚球点球。","appeal":"大连英博海发俱乐部申诉意见认为：本方6号不犯规，不应被判罚球点球，应判罚对方19号亮鞋钉危险动作违规。","concl":"对于此判例，评议组多数成员认为：上海申花19号在争抢中率先触球，且属于合理动作。大连英博海发6号试图踢球时踢到上海申花19号，并具有一定力度，属于草率踢人犯规。裁判员经在场回看后判大连英博海发6号犯规并判罚球点球的最终决定正确。VAR介入正确。","v":"correct","videos":["2026/i11c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260701/1782903647929826.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2026-131","t":"case","s":"2026","issue":11,"no":5,"seq":131,"comp":"中甲联赛","round":"第12轮","home":"石家庄功夫","away":"南京城市","minute":"16","desc":"判例五：中甲联赛第12轮，石家庄功夫VS南京城市。比赛第16分钟，裁判员判罚石家庄功夫16号队员在防守时对南京城市39号队员犯规，并判定犯规地点在罚球区外，由南京城市踢直接任意球恢复比赛。","appeal":"南京城市俱乐部申诉意见认为：对方16号犯规地点在罚球区内，应判罚球点球。","concl":"对于此判例，评议组多数成员认为：南京城市39号率先触球，石家庄功夫16号争抢动作晚到，并构成草率踢人犯规，犯规发生地点在罚球区内。应判石家庄功夫16号犯规并判罚球点球。裁判员决定错误，漏判罚球点球。","v":"wrong","videos":["2026/i11c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260701/1782903672872647.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2026-132","t":"case","s":"2026","issue":11,"no":6,"seq":132,"comp":"中甲联赛","round":"第12轮","home":"石家庄功夫","away":"南京城市","minute":"44","desc":"判例六：中甲联赛第12轮，石家庄功夫VS南京城市。比赛第44分钟，石家庄功夫10号队员进球，裁判员判进球有效。","appeal":"南京城市俱乐部申诉意见认为：对方15号头顶球时，对方10号处于越位位置，随后的进球属于越位犯规在先，进球无效。","concl":"对于此判例，评议组一致认为：从现有视频看，石家庄功夫15号队员争抢头顶球时触到了球，此时石家庄功夫10号处于越位位置，随后触球构成越位犯规，进球无效。另外，石家庄功夫15号争抢头球时，南京城市队员与其身体接触属于正常争抢，其程度未构成犯规。裁判员判石家庄功夫进球有效的决定错误，漏判越位犯规。","v":"wrong","videos":["2026/i11c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260701/1782903714809911.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2026-133","t":"case","s":"2026","issue":11,"no":7,"seq":133,"comp":"中甲联赛","round":"第12轮","home":"定南赣联","away":"无锡吴钩","minute":"89","desc":"判例七：中甲联赛第12轮，定南赣联VS无锡吴钩。比赛第89分钟，在比赛停止状态下，裁判员判定南赣联10号队员手臂使用过分力量击打无锡吴钩队5号队员脸部，构成暴力行为，并向定南赣联10号出示红牌罚令出场。","appeal":"定南赣联俱乐部申诉意见认为：对方5号先击打本方10号面部，应被红牌罚令出场；本方10号随后的动作应被出示黄牌，不应被出示红牌。","concl":"对于此判例，评议组一致认为：定南赣联10号故意挥臂击打无锡吴钩5号头面部，构成暴力行为，应予红牌罚令出场。另外，从现有视频看，无锡吴钩5号的手部动作不构成暴力行为，但其故意将球踢走，延误比赛恢复，应出示黄牌予以警告。在俱乐部申诉的主要问题（红牌）上，裁判员决定正确，即无锡吴钩5号不构成红牌，定南赣联10号构成红牌。但裁判员漏判无锡吴钩5号黄牌。","v":"wrong","videos":["2026/i11c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260701/1782903735543895.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"red"}},{"k":"2026-134","t":"case","s":"2026","issue":11,"no":8,"seq":134,"comp":"中乙联赛","round":"第13轮","home":"山西崇德荣海","away":"泰安天贶","minute":"54","desc":"判例八：中乙联赛第13轮，山西崇德荣海VS泰安天贶。比赛第54分钟，双方队员争抢过程中，山西崇德荣海16号队员倒地时踩到泰安天贶21号队员身体，裁判员未判罚犯规。","appeal":"泰安天贶俱乐部申诉意见认为：对方16号踩踏本方21号，构成暴力行为，应被出示红牌罚令出场。","concl":"对于此判例，评议组成员得出多数意见，并经国际足联裁判讲师确认，认定评议结论如下：双方争抢过程中，泰安天贶21号在争抢中对山西崇德荣海16号草率犯规。随后山西崇德荣海16号使用鞋钉部位和过分力量踩踏泰安天贶21号腹部，构成暴力行为，应向山西崇德荣海16号出示红牌罚令出场。裁判员决定错误，漏判红牌。","v":"wrong","videos":["2026/i11c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260701/1782903759663725.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2026-135","t":"case","s":"2026","issue":11,"no":9,"seq":135,"comp":"中乙联赛","round":"第14轮","home":"温州俱乐部","away":"赣州瑞狮","minute":"","desc":"判例九：中乙联赛第14轮，温州俱乐部VS赣州瑞狮。比赛第90+1分钟，赣州瑞狮22号队员疑似在本方罚球区内手臂触球。裁判员未判罚手球犯规。","appeal":"温州俱乐部申诉意见认为：对方22号手球犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：就现有视频看，赣州瑞狮22号手臂触球时处于自然位置，并未使身体不自然扩大，不构成手球犯规。支持裁判员未判罚手球犯规的决定。","v":"correct","videos":["2026/i11c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260701/1782903780550015.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2026-136","t":"case","s":"2026","issue":11,"no":10,"seq":136,"comp":"中乙联赛","round":"第14轮","home":"北京理工","away":"泰安天贶","minute":"71","desc":"判例十：中乙联赛第14轮，北京理工VS泰安天贶。比赛第71分钟，泰安天贶34号队员在对方罚球区内倒地，裁判员未判罚犯规。","appeal":"泰安天贶俱乐部申诉意见认为：对方54号从背后冲撞本方34号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：泰安天贶34号接空中传球时，北京理工54号从其背后实施跳向及冲撞犯规，应判北京理工54号犯规并判罚球点球。裁判员决定错误，漏判罚球点球。","v":"wrong","videos":["2026/i11c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260701/1782903798740853.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2026-137","t":"case","s":"2026","issue":11,"no":11,"seq":137,"comp":"女超联赛","round":"第8轮","home":"山东体彩女足","away":"浙江杭州银行女足","minute":"29","desc":"判例十一：女超联赛第8轮，山东体彩女足VS浙江杭州银行女足。比赛第29分钟，山东体彩女足35号队员带球至对方罚球区内，浙江杭州银行女足4号队员倒地铲抢，裁判员判浙江杭州银行女足4号犯规并判罚球点球。","appeal":"浙江杭州银行女足申诉意见认为：本方4号不构成犯规，不应被判罚球点球。","concl":"对于此判例，评议组多数成员认为：从现有视频看，浙江杭州银行女足4号铲球时左腿与山东体彩女足35号接触程度轻微，随后右腿未与对方接触。总体接触程度不构成犯规。裁判员判浙江杭州银行女足4号犯规并判罚球点球的决定错误。","v":"wrong","videos":["2026/i11c11-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260701/1782903832546829.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-138","t":"case","s":"2026","issue":12,"no":1,"seq":138,"comp":"中超联赛","round":"第17轮","home":"北京国安","away":"山东泰山","minute":"20","desc":"判例一：中超联赛第17轮，北京国安VS山东泰山。比赛第20分钟，山东泰山5号队员在本方罚球区外对北京国安20号队员犯规。裁判员判直接任意球，并向山东泰山队5号出示黄牌，VAR以红牌事件介入，裁判员经在场回看后，最终决定向山东泰山队5号出示红牌。","appeal":"山东泰山俱乐部申诉意见认为：本方5号的犯规不应视为破坏明显进球得分机会，不应被出示红牌。","concl":"对于此判例，评议组一致认为：山东泰山5号队员的犯规地点在罚球区外，且从犯规地点距离球门的距离、球运行的大致方向、攻防双方队员的人数和位置、攻方队员控球的可能性（结合球的运行和守门员的位置）等方面看，均符合破坏明显进球得分机会的判断标准，裁判员向山东泰山5号出示红牌的最终决定正确。VAR介入正确。","v":"correct","videos":["2026/i12c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260708/1783506326550124.mp4"],"cat":"dogso","catname":"破坏明显进球得分机会（DOGSO）","ans":{"c":"red"}},{"k":"2026-139","t":"case","s":"2026","issue":12,"no":2,"seq":139,"comp":"中超联赛","round":"第17轮","home":"青岛海牛","away":"成都蓉城","minute":"85","desc":"判例二：中超联赛第17轮，青岛海牛VS成都蓉城。比赛第85分钟，青岛海牛进球。裁判员判进球有效。VAR以越位事件介入，裁判员经在场回看后，维持进球有效的决定。","appeal":"成都蓉城俱乐部申诉意见认为：对方最后一次射门时，处在越位位置的6号队员干扰了本方守门员，应判对方越位犯规，进球无效。","concl":"对于此判例，评议组成员得出多数意见，并经国际足联裁判讲师确认，认定评议结论如下：青岛海牛6号队员在同队队员射门时处于越位位置，但并未遮挡成都蓉城守门员视线；同时，与第十一期评议中天津津门虎队7号队员越位犯规的情形不同，青岛海牛6号未试图触球或做出明显的举动对成都蓉城守门员处理球造成干扰，其转身动作是在球已经经过之后随球做出的；成都蓉城守门员全程可以看到球的运行路线，移动选位和做出扑救动作的能力未受影响。因此青岛海牛6号不构成越位犯规，进球应有效。此判例裁判员维持进球有效的决定正确。VAR介入错误。","v":"correct","videos":["2026/i12c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260708/1783506363945378.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2026-140","t":"case","s":"2026","issue":12,"no":3,"seq":140,"comp":"中甲联赛","round":"第13轮","home":"延边龙鼎","away":"定南赣联","minute":"75","desc":"判例三：中甲联赛第13轮，延边龙鼎VS定南赣联。比赛第75分钟，延边龙鼎进球，裁判员判进球有效。","appeal":"定南赣联俱乐部申诉意见认为：对方进攻中向边路传球时，对方30号队员处于越位位置，应判其越位犯规，后续进球无效。","concl":"对于此判例，评议组一致认为：现有视频无法证明，延边龙鼎向边路传球时，其30号队员是否处于越位位置。裁判员临场未判罚越位以及判后续进球有效的决定，应予支持。","v":"correct","videos":["2026/i12c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260708/1783506431888943.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2026-141","t":"case","s":"2026","issue":12,"no":4,"seq":141,"comp":"中甲联赛","round":"第13轮","home":"延边龙鼎","away":"定南赣联","minute":"90","desc":"判例四：中甲联赛第13轮，延边龙鼎VS定南赣联。比赛第90分钟，延边龙鼎37号队员带球进入对方罚球区后倒地，裁判员判定南赣联23号防守时犯规，并判罚球点球。","appeal":"定南赣联俱乐部申诉意见认为：本方队员不犯规，不应被判罚球点球；对方队员假摔，应被黄牌警告。","concl":"对于此判例，评议组一致认为：通过现有视频难以完全看清定南赣联23号防守时脚部与对方队员的接触情况，裁判员临场观察位置较好。支持裁判员判罚球点球的决定。","v":"correct","videos":["2026/i12c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260708/1783506483961558.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2026-142","t":"case","s":"2026","issue":12,"no":5,"seq":142,"comp":"中甲联赛","round":"第13轮","home":"宁波俱乐部","away":"石家庄功夫","minute":"68","desc":"判例五：中甲联赛第13轮，宁波俱乐部VS石家庄功夫。比赛第68分钟，宁波俱乐部10号队员射门，球接触石家庄功夫18号队员手臂，裁判员判手球犯规并判罚球点球。","appeal":"石家庄功夫俱乐部申诉意见认为：本方队员不构成手球犯规，不应被判罚球点球。","concl":"对于此判例，评议组一致认为：石家庄功夫18号手臂紧贴身体，在此情况下属于自然位置，球击中其手臂，不属于手球犯规。裁判员判手球犯规并判罚球点球的决定均为错误。","v":"wrong","videos":["2026/i12c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260708/1783506514925965.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2026-143","t":"case","s":"2026","issue":12,"no":6,"seq":143,"comp":"女超联赛","round":"第9轮","home":"上海盛丽女足","away":"四川女足","minute":"32","desc":"判例六：女超联赛第9轮，上海盛丽女足vs四川女足。比赛第32分钟，上海盛丽女足17号队员带球突破至对方罚球区内，四川女足6号队员上前防守，上海盛丽女足17号倒地，裁判员未判罚犯规。","appeal":"上海盛丽女足申诉意见认为：对方6号对本方17号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：现有视频角度均无法看清四川女足6号的防守动作与对方的接触情况。裁判员临场观察角度较好，支持其未判罚犯规的决定。","v":"correct","videos":["2026/i12c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260708/1783506542825744.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-144","t":"case","s":"2026","issue":12,"no":7,"seq":144,"comp":"女超联赛","round":"第9轮","home":"上海盛丽女足","away":"四川女足","minute":"45","desc":"判例七：女超联赛第9轮，上海盛丽女足vs四川女足。比赛第45分钟，上海盛丽女足14号队员在对方罚球区内倒地，裁判员未判罚犯规。","appeal":"上海盛丽女足申诉意见认为：对方队员对本方14号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：从现有视频无法看清四川女足防守队员腿部动作与上海盛丽女足14号接触的具体情况。裁判员临场观察角度较好，支持其未判罚犯规的决定。","v":"correct","videos":["2026/i12c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260708/1783506575566881.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-145","t":"case","s":"2026","issue":12,"no":8,"seq":145,"comp":"女超联赛","round":"第9轮","home":"上海盛丽女足","away":"四川女足","minute":"51","desc":"判例八：女超联赛第9轮，上海盛丽女足vs四川女足。比赛第51分钟，上海盛丽女足21号队员在对方罚球区内倒地，裁判员未判罚犯规。","appeal":"上海盛丽女足申诉意见认为：对方4号对本方21号铲球犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：从现有视频看，四川女足4号的铲球动作与上海盛丽女足21号的接触程度较为轻微。裁判员临场观察角度较好，支持其未判罚犯规的决定。","v":"correct","videos":["2026/i12c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260708/1783506606492789.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-146","t":"case","s":"2026","issue":12,"no":9,"seq":146,"comp":"女超联赛","round":"第9轮","home":"上海盛丽女足","away":"四川女足","minute":"","desc":"判例九：女超联赛第9轮，上海盛丽女足vs四川女足。比赛第90+1分钟，上海盛丽女足33号队员在对方罚球区内起脚射门时倒地，裁判员未判罚犯规。","appeal":"上海盛丽女足申诉意见认为：对方队员对本方33号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：上海盛丽女足33号接本方传球时，与四川女足16号互有一定程度的拉扯。上海盛丽女足33号完成射门，四川女足16号腿部动作未影响对方射门或形成犯规。裁判员未判罚犯规的决定正确。","v":"correct","videos":["2026/i12c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260708/1783506639800884.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-147","t":"case","s":"2026","issue":13,"no":1,"seq":147,"comp":"中超联赛","round":"第18轮","home":"成都蓉城","away":"重庆铜梁龙","minute":"24","desc":"判例一：中超联赛第18轮，成都蓉城VS重庆铜梁龙。比赛第24分钟，成都蓉城9号队员在对方罚球区内与重庆铜梁龙3号队员接触后倒地。裁判员未判罚犯规，VAR未介入。","appeal":"成都蓉城俱乐部申诉意见认为：对方3号拉拽本方9号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：双方队员争抢位置时互有一定程度的推拉动作，并因此造成双方失去重心倒地，属于比赛中可接受的相互接触，不构成犯规。裁判员未判罚犯规的决定正确。VAR未介入正确。","v":"correct","videos":["2026/i13c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260716/1784161794767892.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-148","t":"case","s":"2026","issue":13,"no":2,"seq":148,"comp":"中超联赛","round":"第18轮","home":"成都蓉城","away":"重庆铜梁龙","minute":"25","desc":"判例二：中超联赛第18轮，成都蓉城VS重庆铜梁龙。比赛第25分钟，成都蓉城18号队员在与重庆铜梁龙11号队员接触后倒地。裁判员未判罚犯规，VAR未介入。","appeal":"成都蓉城俱乐部申诉意见认为：对方11号队员踩踏本方18号队员，属于暴力行为，应予出示红牌。","concl":"对于此判例，评议组一致认为：成都蓉城18号在未争抢球的情况下主动走向重庆铜梁龙队11号，后者对前者有手臂和脚部的轻微接触，在比赛可管理的场景下，该情形不构成犯规，也不属于暴力行为。裁判员未判罚犯规的决定正确。VAR未介入正确。","v":"correct","videos":["2026/i13c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260716/1784161832371439.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"playon","c":"none"}},{"k":"2026-149","t":"case","s":"2026","issue":13,"no":3,"seq":149,"comp":"中超联赛","round":"第18轮","home":"成都蓉城","away":"重庆铜梁龙","minute":"","desc":"判例三：中超联赛第18轮，成都蓉城VS重庆铜梁龙。比赛第45+1分钟，成都蓉城发角球，角球踢出后，成都蓉城9号队员在对方罚球区内与重庆铜梁龙3号队员接触后倒地。裁判员未判罚犯规，VAR未介入。","appeal":"成都蓉城俱乐部申诉意见认为：对方3号拉扯本方9号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：重庆铜梁龙3号手臂与成都蓉城9号接触，但接触程度并未明显限制后者移动和争抢。从成都蓉城9号倒地的情况看，也有借接触顺势倒地的成分。裁判员未判罚重庆铜梁龙3号犯规的决定正确。VAR未介入正确。","v":"correct","videos":["2026/i13c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260716/1784161863174514.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-150","t":"case","s":"2026","issue":13,"no":4,"seq":150,"comp":"中超联赛","round":"第18轮","home":"成都蓉城","away":"重庆铜梁龙","minute":"49","desc":"判例四：中超联赛第18轮，成都蓉城VS重庆铜梁龙。比赛第49分钟，重庆铜梁龙队11号队员进球。裁判员判进球有效，VAR未介入。","appeal":"成都蓉城俱乐部申诉意见认为：对方11号在进球前拉拽本方18号队员，应判其犯规在先，进球无效。","concl":"对于此判例，评议组多数成员认为：重庆铜梁龙11号手臂与成都蓉城18号背部有接触，但并未明显阻碍或影响后者起跳争抢球，不应视为犯规，后续进球有效。裁判员判进球有效的决定正确。VAR未介入正确。","v":"correct","videos":["2026/i13c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260716/1784161905761146.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2026-151","t":"case","s":"2026","issue":13,"no":5,"seq":151,"comp":"中甲联赛","round":"第14轮","home":"陕西联合","away":"梅州客家","minute":"33","desc":"判例五：中甲联赛第14轮，陕西联合VS梅州客家。比赛第33分钟，陕西联合21号队员进球，裁判员判进球有效。","appeal":"梅州客家俱乐部申诉意见认为：对方21号在抢断本方17号时犯规在先，后续进球应无效。","concl":"对于此判例，评议组一致认为：梅州客家17号控球转身时动作失误造成重心不稳，陕西联合21号正常贴近争抢，接触较轻微未达到犯规程度，梅州客家17号借助接触倒地。裁判员未判罚陕西联合21号犯规以及判后续进球有效的决定均为正确。","v":"correct","videos":["2026/i13c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260716/1784161959428058.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2026-152","t":"case","s":"2026","issue":13,"no":6,"seq":152,"comp":"中甲联赛","round":"第14轮","home":"陕西联合","away":"梅州客家","minute":"57","desc":"判例六：中甲联赛第14轮，陕西联合VS梅州客家。比赛第57分钟，陕西联合38号队员带球突破至对方罚球区时，梅州客家22号队员对其犯规，裁判员判罚球点球。","appeal":"梅州客家俱乐部申诉意见认为：本方22号拉拽对方38号犯规，但犯规地点在罚球区外，不应判罚球点球。","concl":"对于此判例，评议组指出：竞赛规则规定，如果防守队员在罚球区外开始拉扯对方队员，并持续至罚球区内，必须判罚球点球。因此评议组一致认为：梅州客家22号对陕西联合38号的拉拽持续至罚球区内，并造成后者倒地，应判犯规和罚球点球。裁判员判罚球点球的决定正确。","v":"correct","videos":["2026/i13c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260716/1784162020916601.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2026-153","t":"case","s":"2026","issue":13,"no":7,"seq":153,"comp":"中甲联赛","round":"第14轮","home":"陕西联合","away":"梅州客家","minute":"58","desc":"判例七：中甲联赛第14轮，陕西联合VS梅州客家。比赛第58分钟，陕西联合9号队员踢罚球点球，梅州客家守门员将球扑出，随后陕西联合9号补射进球。裁判员判进球有效。","appeal":"梅州客家俱乐部申诉意见认为：对方补射进球的9号队员越位犯规，进球应无效。","concl":"对于此判例，评议组一致认为：陕西联合9号踢罚球点球时，双方均有队员提前进入罚球区，守门员将球扑出后，双方提前进入罚球区的队员均参与了争抢球，按照竞赛规则，应重新踢罚球点球。裁判员判进球有效的决定错误。","v":"wrong","videos":["2026/i13c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260716/1784162086484144.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"retake","c":"none"}},{"k":"2026-154","t":"case","s":"2026","issue":13,"no":8,"seq":154,"comp":"中乙联赛","round":"第12轮","home":"杭州临平吴越","away":"江西庐山","minute":"29","desc":"判例八：中乙联赛第12轮，杭州临平吴越VS江西庐山。比赛第29分钟，江西庐山进球。裁判员与助理裁判员商议后，判江西庐山越位犯规，进球无效。","appeal":"江西庐山俱乐部申诉意见认为：本方进球应有效。","concl":"对于此判例，评议组一致认为：江西庐山踢任意球时，其18号队员处于越位位置，但随后并未形成干扰比赛或干扰对方队员，不构成越位犯规。杭州临平吴越守门员接球脱手，江西庐山队员不犯规。随后江西庐山两名队员之间可能存在传递关系，但均未处于越位位置，随后的进球应有效。裁判员判江西庐山越位犯规进球无效的决定错误。","v":"wrong","videos":["2026/i13c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260716/1784162140758325.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2026-155","t":"case","s":"2026","issue":13,"no":9,"seq":155,"comp":"中乙联赛","round":"第12轮","home":"大连可为","away":"上海赛更达","minute":"39","desc":"判例九：中乙联赛第12轮，大连可为VS上海赛更达。比赛第39分钟，上海赛更达36号队员带球突破至对方罚球区内倒地，裁判员判大连可为14号队员铲球犯规，并判罚球点球。","appeal":"大连可为俱乐部申诉意见认为：本方队员不犯规，不应判罚球点球。","concl":"对于此判例，评议组一致认为：大连可为14号铲球动作合理，未接触上海赛更达36号，随后大连可为35号抢先将球踢出，均不构成犯规。裁判员判罚球点球的决定错误。","v":"wrong","videos":["2026/i13c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260716/1784162236256781.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-156","t":"case","s":"2026","issue":13,"no":10,"seq":156,"comp":"中乙联赛","round":"第12轮","home":"大连可为","away":"上海赛更达","minute":"47","desc":"判例十：中乙联赛第12轮，大连可为VS上海赛更达。比赛第47分钟，大连可为19号队员带球突破至对方罚球区内倒地，裁判员未判罚犯规。","appeal":"大连可为俱乐部申诉意见认为：对方11号队员铲球时对本方19号犯规，应判罚球点球并向对方11号出示黄牌。","concl":"对于此判例，评议组首先一致认为：上海赛更达11号铲球并未触球，而是踢到大连可为19号，具有一定力度并造成后者倒地，应判上海赛更达11号犯规并判罚球点球。裁判员决定错误，漏判罚球点球。其次评议组多数成员认为：该犯规未达到鲁莽的严重程度，无需出示红黄牌。","v":"wrong","videos":["2026/i13c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260716/1784162287237092.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2026-157","t":"case","s":"2026","issue":13,"no":11,"seq":157,"comp":"中乙联赛","round":"第12轮","home":"大连可为","away":"上海赛更达","minute":"49","desc":"判例十一：中乙联赛第12轮，大连可为VS上海赛更达。比赛第49分钟，大连可为19号队员在对方罚球区内倒地，裁判员未判罚犯规。","appeal":"大连可为俱乐部申诉意见认为：对方15号队员踩踏本方19号犯规，应判罚球点球并向对方15号出示黄牌。","concl":"对于此判例，评议组一致认为：大连可为19号率先触球，上海赛更达15号使用鞋钉踩到大连可为19号脚踝及脚面部位，构成鲁莽犯规，应判罚球点球并出示黄牌警告。裁判员决定错误，漏判罚球点球和黄牌。","v":"wrong","videos":["2026/i13c11-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260716/1784162367950445.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"yellow"}},{"k":"2026-158","t":"case","s":"2026","issue":13,"no":12,"seq":158,"comp":"中乙联赛","round":"第12轮","home":"大连可为","away":"上海赛更达","minute":"51","desc":"判例十二：中乙联赛第12轮，大连可为VS上海赛更达。比赛第51分钟，大连可为进攻中将球传至对方罚球区内，经过双方数次争抢后，大连可为36号队员与上海赛更达35号队员争抢后倒地。裁判员未判罚犯规。","appeal":"大连可为俱乐部申诉意见认为：对方35号对本方36号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：球传至上海赛更达罚球区内，双方的第二次头球争抢中，大连可为队员顶到球，此时其29号队员处于越位位置，随后该队员射门，构成干扰比赛的越位犯规。应判大连可为29号越位犯规。在俱乐部申诉的主要问题（罚球点球）上，裁判员判罚正确，不应罚球点球。","v":"wrong","videos":["2026/i13c12-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260716/1784162345513926.mp4"],"cat":"offside","catname":"越位","ans":{"r":"indirectfk","c":"none"}},{"k":"2026-159","t":"case","s":"2026","issue":14,"no":1,"seq":159,"comp":"中甲联赛","round":"第15轮","home":"石家庄功夫","away":"延边龙鼎","minute":"6","desc":"判例一：中甲联赛第15轮，石家庄功夫VS延边龙鼎。比赛第6分钟，延边龙鼎37号队员击打石家庄功夫12号队员手臂，裁判员向延边龙鼎37号出示黄牌。","appeal":"石家庄功夫俱乐部申诉意见认为：对方37号应被出示红牌。","concl":"对于此判例，评议组一致认为：延边龙鼎37号队员不以争抢球为目的，拉住石家庄功夫12号队员手臂并故意击打，做出野蛮动作，应视为暴力行为并出示红牌罚令出场。裁判员向延边龙鼎37号出示黄牌的决定错误，漏判红牌。","v":"wrong","videos":["2026/i14c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260722/1784708727686453.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2026-160","t":"case","s":"2026","issue":14,"no":2,"seq":160,"comp":"中甲联赛","round":"第15轮","home":"石家庄功夫","away":"延边龙鼎","minute":"77","desc":"判例二：中甲联赛第15轮，石家庄功夫VS延边龙鼎。比赛第77分钟，延边龙鼎20号队员疑似在本方罚球区内手臂触球。裁判员未判罚手球犯规。","appeal":"石家庄功夫俱乐部申诉意见认为：对方20号手球犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：延边龙鼎20号队员踢球解围，球经石家庄功夫31号身体以及地面的反弹后，意外接触延边龙鼎20号手臂，手臂属于此动作和情形下的合理位置，不构成手球犯规。裁判员未判罚手球犯规的决定正确。","v":"correct","videos":["2026/i14c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260722/1784708760246790.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2026-161","t":"case","s":"2026","issue":14,"no":3,"seq":161,"comp":"中甲联赛","round":"第15轮","home":"定南赣联","away":"宁波俱乐部","minute":"83","desc":"判例三：中甲联赛第15轮，定南赣联VS宁波俱乐部。比赛第83分钟，宁波俱乐部进攻中将球传入对方罚球区内，定南赣联 4号队员疑似手臂触球。裁判员判定南赣联4号手球犯规并判罚球点球。","appeal":"定南赣联俱乐部申诉意见认为：本方4号的手臂触球不构成手球犯规，不应判罚球点球。","concl":"对于此判例，评议组多数成员认为：定南赣联4号的手臂在接触球前有上抬打开的动作，支持裁判员判定南赣联4号手球犯规以及罚球点球的决定。","v":"correct","videos":["2026/i14c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260722/1784708804452552.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2026-162","t":"case","s":"2026","issue":14,"no":4,"seq":162,"comp":"中甲联赛","round":"第15轮","home":"定南赣联","away":"宁波俱乐部","minute":"","desc":"判例四：中甲联赛第15轮，定南赣联VS宁波俱乐部。比赛第90+5分钟，定南赣联4号队员在与宁波俱乐部5号队员争抢高空球后倒地，裁判员认为宁波俱乐部5号草率犯规，并掌握有利，比赛继续进行。","appeal":"定南赣联俱乐部申诉意见认为：对方5号使用手肘击打本方4号头部，应向对方5号出示红牌。","concl":"对于此判例，评议组首先一致认为：从现有视频看，宁波俱乐部5号跳起争抢头球时违规使用手臂接触对方队员，但并非以手臂作为武器故意击打对方队员头面部，不属于严重犯规或暴力行为。在俱乐部申诉的主要问题（红牌）上，裁判员决定正确，并非红牌。其次评议组多数成员认为：在掌握有利完成后，应以鲁莽犯规原因，向宁波俱乐部5号出示黄牌。","v":"wrong","videos":["2026/i14c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260722/1784708855505336.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"playon","c":"yellow"}},{"k":"2026-163","t":"case","s":"2026","issue":14,"no":5,"seq":163,"comp":"中甲联赛","round":"第15轮","home":"定南赣联","away":"宁波俱乐部","minute":"","desc":"判例五：中甲联赛第15轮，定南赣联VS宁波俱乐部。比赛第90+7分钟，定南赣联进攻中将球传中至对方罚球区内，定南赣联11号在与宁波俱乐部16号争抢位置时倒地。裁判员未判罚犯规。","appeal":"定南赣联俱乐部申诉意见认为：对方16号拉扯本方11号并致其倒地，应判罚球点球。","concl":"对于此判例，评议组一致认为：双方队员的接触属于比赛中移动和争抢位置时的正常接触，球也并未传至双方队员争抢范围内，双方均不犯规。裁判员未判罚犯规的决定正确。","v":"correct","videos":["2026/i14c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260722/1784708881236370.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-164","t":"case","s":"2026","issue":14,"no":6,"seq":164,"comp":"女超联赛","round":"第11轮","home":"山东体彩女足","away":"北京城建女足","minute":"","desc":"判例六：女超联赛第11轮，山东体彩女足VS北京城建女足。比赛第90+5分钟，北京城建27号队员前插跑动至对方罚球区内，与山东体彩队员发生接触后倒地。裁判员未判罚犯规。","appeal":"北京城建女足申诉意见认为：对方队员拉扯本方27号并致其倒地，应判罚球点球。","concl":"对于此判例，评议组一致认为：北京城建27号前插跑位时，山东体彩6号队员试图使用手臂阻拦未果，之后在罚球区内对北京城建27号实施拉扯犯规，并阻止了对方有希望的进攻。应判山东体彩6号犯规、判罚球点球并出示黄牌警告。裁判员决定错误，漏判罚球点球和黄牌。","v":"wrong","videos":["2026/i14c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260722/1784708908935833.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"yellow"}},{"k":"2026-165","t":"case","s":"2026","issue":15,"no":1,"seq":165,"comp":"中超联赛","round":"第20轮","home":"云南玉昆","away":"深圳新鹏城","minute":"37","desc":"判例一：中超联赛第20轮，云南玉昆VS深圳新鹏城。比赛第37分钟，云南玉昆队进球。裁判员判进球有效。VAR介入，裁判员在场回看后，维持进球有效的决定。","appeal":"深圳新鹏城俱乐部申诉意见认为：对方9号队员处在越位位置且干扰到了本方守门员，应判对方越位犯规在先，进球无效。","concl":"对于此判例，评议组一致认为：云南玉昆队射门时，其9号队员处于越位位置，并有向球运行方向的跑动和躲避动作，影响了深圳新鹏城守门员的判断和扑救，构成干扰对方的越位犯规。应判云南玉昆9号越位犯规，进球无效。裁判员经在场回看后维持进球有效的决定错误。VAR介入正确。","v":"wrong","videos":["2026/i15c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260729/1785315320265397.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2026-166","t":"case","s":"2026","issue":15,"no":2,"seq":166,"comp":"中超联赛","round":"第20轮","home":"云南玉昆","away":"深圳新鹏城","minute":"73","desc":"判例二：中超联赛第20轮，云南玉昆VS深圳新鹏城。比赛第73分钟，云南玉昆34号队员铲抢深圳新鹏城19号队员。裁判员判云南玉昆34号犯规，并出示黄牌，VAR未介入。","appeal":"深圳新鹏城俱乐部申诉意见认为：对方34号的犯规应被出示红牌。","concl":"对于此判例，评议组一致认为：云南玉昆34号左腿铲抢动作较为危险，但仅与深圳新鹏城19号腿部刮擦接触，后续云南玉昆34号右腿与对方的接触是致使其倒地的主要原因，就接触结果和程度看，应视为鲁莽犯规，并出示黄牌，未构成严重犯规，不应出示红牌。裁判员判云南玉昆34号犯规并出示黄牌的决定正确。VAR未介入正确。","v":"correct","videos":["2026/i15c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260729/1785315348678006.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2026-167","t":"case","s":"2026","issue":15,"no":3,"seq":167,"comp":"中甲联赛","round":"第16轮","home":"石家庄功夫","away":"南通支云","minute":"18","desc":"判例三：中甲联赛第16轮，石家庄功夫VS南通支云。比赛第18分钟，石家庄功夫31号队员进球，裁判员判其越位犯规在先，进球无效。","appeal":"石家庄功夫俱乐部申诉意见认为：本方队员未处于越位位置，不构成越位犯规，进球应有效。","concl":"对于此判例，评议组一致认为：从现有视频看，石家庄功夫队踢任意球时，无任何队员处于越位位置，裁判员判石家庄功夫队越位犯规的决定错误。由于裁判员在球进门之前鸣哨停止了比赛，此判例无法认定后续进球是否有效。","v":"wrong","videos":["2026/i15c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260729/1785315379469572.mp4"],"cat":"offside","catname":"越位","ans":{"r":"playon","c":"none"}},{"k":"2026-168","t":"case","s":"2026","issue":15,"no":4,"seq":168,"comp":"中甲联赛","round":"第16轮","home":"石家庄功夫","away":"南通支云","minute":"","desc":"判例四：中甲联赛第16轮，石家庄功夫VS南通支云。比赛第45+4分钟，石家庄功夫31号队员进球，裁判员判其进球前争顶头球时犯规在先，进球无效。","appeal":"石家庄功夫俱乐部申诉意见认为：本方进球应有效。","concl":"对于此判例，评议组一致认为：双方队员争抢头球时的相互接触，属于比赛中的正常接触，不构成犯规。裁判员判石家庄功夫31号犯规在先的决定错误。由于裁判员在球进门之前鸣哨停止了比赛，此判例无法认定后续进球是否有效。","v":"wrong","videos":["2026/i15c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260729/1785315422389510.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"playon","c":"none"}},{"k":"2026-169","t":"case","s":"2026","issue":15,"no":5,"seq":169,"comp":"中甲联赛","round":"第16轮","home":"延边龙鼎","away":"梅州客家犀旺","minute":"23","desc":"判例五：中甲联赛第16轮，延边龙鼎可喜安VS梅州客家犀旺。比赛第23分钟，延边龙鼎10号队员进球，裁判员判进球有效。","appeal":"梅州客家犀旺俱乐部申诉意见认为：对方10号进球前对本方5号队员犯规，随后进球应无效。","concl":"对于此判例，评议组一致认为：延边龙鼎10号与梅州客家5号在争抢位置时，均有使用手臂主动与对方接触的动作，双方均未构成犯规。随后延边龙鼎10号进球有效。裁判员判进球有效的决定正确。","v":"correct","videos":["2026/i15c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260729/1785315460559543.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2026-170","t":"case","s":"2026","issue":15,"no":6,"seq":170,"comp":"中乙联赛","round":"第18轮","home":"大连可为","away":"大连英博B队","minute":"30","desc":"判例六：中乙联赛第18轮，大连可为VS大连英博B队。比赛第30分钟，大连英博B队45号队员在对方罚球区内倒地，裁判员判其倒地时手球犯规。","appeal":"大连英博俱乐部申诉意见认为：对方35号队员对本方45号犯规，应判罚球点球。","concl":"对于此判例，评议组成员得出多数意见，并经国际足联裁判讲师确认，认定评议结论如下：双方争抢球时，大连英博B队45号率先触球，大连可为35号试图触球时踢倒大连英博B队45号，构成草率犯规，应判罚球点球。裁判员判大连英博B队45号手球犯规的决定错误，漏判大连可为35号犯规，漏判罚球点球。","v":"wrong","videos":["2026/i15c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260729/1785315490619053.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2026-171","t":"case","s":"2026","issue":15,"no":7,"seq":171,"comp":"中乙联赛","round":"第18轮","home":"兰州陇原竞技","away":"上海赛更达","minute":"","desc":"判例七：中乙联赛第18轮，兰州陇原竞技VS上海赛更达。比赛第90+5分钟，裁判员判上海赛更达21号守门员在本方罚球区外手臂控制球，手球犯规，并由兰州陇原竞技踢直接任意球恢复比赛。","appeal":"兰州陇原竞技俱乐部申诉意见认为：对方守门员的手球犯规破坏了本方明显的进球得分机会，应予出示红牌。","concl":"对于此判例，首先评议组多数成员认为：从现有视频看，无法确认上海赛更达21号守门员是否在本方罚球区外手臂控制球，对于其是否构成手球犯规，评议组不予认定。其次，评议组一致认为：即使上海赛更达21号守门员在罚球区外手球犯规，根据球的位置和向球门线运行的大致方向，以及攻方队员对该空中球的控球可能性，并不满足破坏明显进球得分机会的判定标准。在俱乐部申诉的核心问题（红牌）上，裁判员决定正确，不是红牌。","v":"pending","videos":["2026/i15c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260729/1785315528665855.mp4"],"cat":"handball","catname":"手球犯规"},{"k":"2026-172","t":"case","s":"2026","issue":15,"no":8,"seq":172,"comp":"中乙联赛","round":"第18轮","home":"厦门飞鹭","away":"杭州临平吴越","minute":"75","desc":"判例八：中乙联赛第18轮，厦门飞鹭VS杭州临平吴越。比赛第75分钟，杭州临平吴越33号队员在对方罚球区内倒地，裁判员判厦门飞鹭8号队员对杭州临平吴越33号犯规，并判罚球点球。","appeal":"厦门飞鹭俱乐部申诉意见认为：本方8号与对方33号接触的力量不足以使后者倒地，且接触地点在罚球区外，不应被判罚球点球。","concl":"对于此判例，评议组一致认为：杭州临平吴越33号停球时将球停至身体右侧，双方均有争抢球机会，杭州临平吴越33号向右变向，双方正常接触，厦门飞鹭8号手臂与杭州临平吴越33号接触的力度未达到犯规程度，不应判犯规和罚球点球。裁判员判厦门飞鹭8号犯规并判罚球点球的决定错误。","v":"wrong","videos":["2026/i15c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260729/1785315560678014.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-173","t":"case","s":"2026","issue":16,"no":1,"seq":173,"comp":"中超联赛","round":"第21轮","home":"河南俱乐部","away":"大连英博","minute":"78","desc":"判例一：中超联赛第21轮，河南俱乐部VS大连英博海发。比赛第78分钟，河南俱乐部8号队员在对方罚球区内与大连英博海发22号队员发生接触后倒地。裁判员未判罚犯规，VAR未介入。","appeal":"河南俱乐部申诉意见认为：对方22号对本方8号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：大连英博海发22号正常向球方向移动争抢，河南俱乐部8号控球前进时减速卡位制造了双方接触，大连英博海发22号手臂与对方接触的力度也未构成犯规。裁判员未判罚犯规的决定正确。VAR未介入正确。","v":"correct","videos":["2026/i16c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260806/1785977295425179.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-174","t":"case","s":"2026","issue":16,"no":2,"seq":174,"comp":"中超联赛","round":"第21轮","home":"河南俱乐部","away":"大连英博","minute":"84","desc":"判例二：中超联赛第21轮，河南俱乐部VS大连英博海发。比赛第84分钟，河南俱乐部7号队员在对方罚球区内与大连英博海发38号队员发生接触后倒地。裁判员未判罚犯规，VAR未介入。","appeal":"河南俱乐部申诉意见认为：对方38号对本方7号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：河南俱乐部7号从大连英博海发38号身后移动至身前争抢高球，双方属于争抢空间时的正常接触，河南俱乐部7号也有夸大接触程度的成分。大连英博海发38号不犯规。裁判员未判罚犯规的决定正确。VAR未介入正确。","v":"correct","videos":["2026/i16c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260806/1785977323959727.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-175","t":"case","s":"2026","issue":16,"no":3,"seq":175,"comp":"中超联赛","round":"第21轮","home":"成都蓉城","away":"武汉三镇","minute":"87","desc":"判例三：中超联赛第21轮，成都蓉城VS武汉三镇。比赛第87分钟，成都蓉城9号队员在对方罚球区内与武汉三镇11号队员发生接触后倒地。裁判员判武汉三镇11号犯规，并判罚球点球。VAR未介入。","appeal":"武汉三镇俱乐部申诉意见认为：本方11号正常争抢动作，没有犯规，不应判罚球点球。","concl":"对于此判例，评议组一致认为：武汉三镇11号手臂搭在成都蓉城9号肩部并实施拉扯，造成后者身体扭转无法完成射门动作，构成拉扯犯规。裁判员判武汉三镇11号犯规并判罚球点球的决定正确。VAR未介入正确。","v":"correct","videos":["2026/i16c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260806/1785977366161560.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2026-176","t":"case","s":"2026","issue":16,"no":4,"seq":176,"comp":"中甲联赛","round":"第17轮","home":"大连鲲城","away":"陕西联合","minute":"31","desc":"判例四：中甲联赛第17轮，大连鲲城VS陕西联合。比赛第31分钟，陕西联合20号队员进球，助理裁判示意越位，裁判员判陕西联合20号越位犯规在先，进球无效。","appeal":"陕西联合俱乐部申诉意见认为：本方20不越位，进球应有效。","concl":"对于此判例：评议组一致认为：陕西联合20号在同队队员头顶球传球瞬间并未处于越位位置，不存在越位犯规，后续进球应有效。助理裁判员判断错误。裁判员判陕西联合20号越位犯规进球无效的决定错误。","v":"wrong","videos":["2026/i16c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260806/1785977422339159.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2026-177","t":"case","s":"2026","issue":16,"no":5,"seq":177,"comp":"中甲联赛","round":"第17轮","home":"大连鲲城","away":"陕西联合","minute":"85","desc":"判例五：中甲联赛第17轮，大连鲲城VS陕西联合。比赛第85分钟，陕西联合踢任意球，球传至对方罚球区内，陕西联合17号队员与大连鲲城13号队员接触后倒地。裁判员未判罚犯规。","appeal":"陕西联合俱乐部申诉意见认为：对方13号对本方17号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：大连鲲城13号手臂环绕陕西联合17号颈部，并实施拉扯犯规，应判大连鲲城13号犯规并判罚球点球。裁判员决定错误，漏判大连鲲城13号犯规，漏判罚球点球。","v":"wrong","videos":["2026/i16c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260806/1785977453483925.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2026-178","t":"case","s":"2026","issue":16,"no":6,"seq":178,"comp":"中甲联赛","round":"第17轮","home":"宁波俱乐部","away":"广西恒宸","minute":"49","desc":"判例六：中甲联赛第17轮，宁波俱乐部VS广西恒宸。比赛第49分钟，广西恒宸36号队员进球，裁判员判进球有效。","appeal":"宁波俱乐部申诉意见认为：对方36号争抢球时对本方30号犯规，后续进球应无效。","concl":"对于此判例，评议组一致认为：双方队员正常身体对抗，力度和程度属于合理范畴，广西恒宸36号不犯规，后续进球有效。裁判员未判罚犯规，以及判进球有效的决定，均为正确。","v":"correct","videos":["2026/i16c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260806/1785977511920580.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2026-179","t":"case","s":"2026","issue":16,"no":7,"seq":179,"comp":"中甲联赛","round":"第17轮","home":"延边龙鼎","away":"南京城市","minute":"35","desc":"判例七：中甲联赛第17轮，延边龙鼎可喜安VS南京城市。比赛第35分钟，延边龙鼎队远射时，处于南京城市罚球区内的双方队员发生接触，裁判员判延边龙鼎10号队员对南京城市20号队员犯规，未出示红黄牌。","appeal":"南京城市俱乐部申诉意见认为：对方10号肘击本方20号，属于暴力行为，应予红牌罚令出场。","concl":"对于此判例，评议组一致认为：延边龙鼎10号队员目的不是争抢球，且使用了野蛮动作，主动挥臂发力击打对方队员头部，应视为暴力行为，并予以红牌罚令出场。裁判员决定错误，漏判红牌。","v":"wrong","videos":["2026/i16c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260806/1785977553733823.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2026-180","t":"case","s":"2026","issue":16,"no":8,"seq":180,"comp":"中甲联赛","round":"第17轮","home":"延边龙鼎","away":"南京城市","minute":"12","desc":"判例八：中甲联赛第17轮，延边龙鼎可喜安VS南京城市。比赛第12分钟，南京城市10号队员与延边龙鼎15号队员争抢高空球。裁判员判南京城市10号犯规，未出示红黄牌。","appeal":"延边龙鼎俱乐部申诉意见认为：对方10号犯规动作属于恶意，应予红牌罚令出场。","concl":"对于此判例，评议组首先一致认为：南京城市10号争抢高球时，手臂无明显的挥击动作，与对方的接触并非有意击打对方头部，不构成严重犯规，不应出示红牌。其次评议组多数成员认为：该动作属于草率犯规，未达到鲁莽犯规程度，也无需出示黄牌。裁判员判南京城市10号犯规且未出示红黄牌的决定正确。","v":"correct","videos":["2026/i16c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260806/1785977590807499.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2026-181","t":"case","s":"2026","issue":16,"no":9,"seq":181,"comp":"中甲联赛","round":"第17轮","home":"延边龙鼎","away":"南京城市","minute":"13","desc":"判例九：中甲联赛第17轮，延边龙鼎可喜安VS南京城市。比赛第13分钟，南京城市队向前直传。南京城市9号队员与延边龙鼎15号队员疑似有接触，后者倒地。裁判员未判罚犯规。","appeal":"延边龙鼎俱乐部申诉意见认为：对方9号故意击打本方15号面部，属于恶意，应予红牌罚令出场。","concl":"对于此判例，评议组一致认为：从现有视频看，双方共同争抢球时，南京城市9号张开手臂试图控球，并接触延边龙鼎15号，属于违规使用手臂，应视为鲁莽犯规并出示黄牌。不属于严重犯规，不应出示红牌。在俱乐部申诉的核心问题（红牌）上，裁判员决定正确，并非红牌。但裁判员漏判南京城市9号犯规及黄牌。","v":"wrong","videos":["2026/i16c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260806/1785977642249099.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"yellow"}},{"k":"2026-182","t":"case","s":"2026","issue":16,"no":10,"seq":182,"comp":"中甲联赛","round":"第17轮","home":"延边龙鼎","away":"南京城市","minute":"82","desc":"判例十：中甲联赛第17轮，延边龙鼎可喜安VS南京城市。比赛第82分钟，南京城市22号队员对延边龙鼎11号队员铲球犯规，裁判员掌握有利，之后向南京城市22号出示黄牌。","appeal":"延边龙鼎俱乐部申诉意见认为：对方22号对本方11号的犯规属于恶意，应予红牌罚令出场。","concl":"对于此判例，评议组一致认为：从南京城市22号铲抢时的接触部位、力度等方面来看，均不构成严重犯规，不应出示红牌，应视为鲁莽犯规并出示黄牌。裁判员判南京城市22号犯规并出示黄牌的决定正确。","v":"correct","videos":["2026/i16c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260806/1785977739864154.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2026-183","t":"case","s":"2026","issue":16,"no":11,"seq":183,"comp":"中乙联赛","round":"第16轮","home":"兰州陇原竞技","away":"泰安天贶","minute":"6","desc":"判例十一：中乙联赛第16轮，兰州陇原竞技VS泰安天贶。比赛第6分钟，兰州陇原竞技踢前场任意球，球传至对方罚球区内，兰州陇原竞技队员头顶球，球疑似接触泰安天贶29号队员手臂，裁判员未判罚手球犯规。","appeal":"兰州陇原竞技俱乐部申诉意见认为：对方29号手球犯规，应判罚球点球。","concl":"对于此判例，评议组多数成员认为：现有视频无法看清球与泰安天贶29号接触的具体情况。评议组对此判例不予认定。","v":"pending","videos":["2026/i16c11-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260806/1785977771839603.mp4"],"cat":"handball","catname":"手球犯规"},{"k":"2026-184","t":"case","s":"2026","issue":16,"no":12,"seq":184,"comp":"中乙联赛","round":"第16轮","home":"兰州陇原竞技","away":"泰安天贶","minute":"79","desc":"判例十二：中乙联赛第16轮，兰州陇原竞技VS泰安天贶。比赛第79分钟，兰州陇原竞技踢前场任意球，球传至对方罚球区内，泰安天贶1号守门员与兰州陇原竞技47号队员发生接触，裁判员未判罚犯规。","appeal":"兰州陇原竞技俱乐部申诉意见认为：对方犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：从现有视频看，泰安天贶1号守门员与兰州陇原竞技47号共同抢点发生碰撞，并未出现击打或其他犯规，属于比赛中正常接触。支持裁判员未判罚犯规的决定。","v":"correct","videos":["2026/i16c12-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260806/1785977829399103.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-185","t":"case","s":"2026","issue":16,"no":13,"seq":185,"comp":"中乙联赛","round":"第16轮","home":"兰州陇原竞技","away":"泰安天贶","minute":"53","desc":"判例十三：中乙联赛第16轮，兰州陇原竞技VS泰安天贶。比赛第53分钟，泰安天贶20号队员带球进入对方罚球区，兰州陇原竞技39号队员与其有接触，泰安天贶20号倒地。裁判员未判罚犯规。","appeal":"泰安天贶俱乐部申诉意见认为：对方39号推倒本方20号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：球未在兰州陇原竞技39号争抢范围，兰州陇原竞技39号手臂与对方队员的接触并非合理动作，推人动作使对方队员失去对球的控制并倒地，应视为犯规并判罚球点球，并以阻止有希望进攻为由，予以黄牌警告。裁判员决定错误，漏判犯规，漏判罚球点球，漏判黄牌。","v":"wrong","videos":["2026/i16c13-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260806/1785977871315613.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"yellow"}},{"k":"2026-186","t":"case","s":"2026","issue":16,"no":14,"seq":186,"comp":"中乙联赛","round":"第16轮","home":"兰州陇原竞技","away":"泰安天贶","minute":"","desc":"判例十四：中乙联赛第16轮，兰州陇原竞技VS泰安天贶。比赛第90+4分钟，在兰州陇原竞技罚球区内，泰安天贶28号队员与兰州陇原竞技8号队员接触后倒地。裁判员未判罚犯规。","appeal":"泰安天贶俱乐部申诉意见认为：对方8号撞倒本方28号犯规，应判罚球点球。","concl":"对于此判例，经国际足联讲师确认，评议组认定为：泰安天贶28号头顶球后，兰州陇原竞技8号移动并造成了双方的接触，其程度属于足球比赛中的正常争抢接触，未构成犯规。裁判员未判罚犯规的决定正确。","v":"correct","videos":["2026/i16c14-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260806/1785977905603464.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-187","t":"case","s":"2026","issue":17,"no":1,"seq":187,"comp":"中超联赛","round":"第22轮","home":"青岛海牛","away":"上海申花","minute":"","desc":"判例一：中超联赛第22轮，青岛海牛VS上海申花。比赛第90+5分钟，在上海申花罚球区内，青岛海牛19号队员与上海申花6号队员争顶头球后，上海申花6号疑似手臂触球。裁判员未判罚手球犯规。VAR未介入。","appeal":"青岛海牛俱乐部申诉意见认为：对方6号手球犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：各个角度的视频均无法清晰证明球与上海申花6号手臂是否有接触。支持裁判员未判罚手球犯规的决定。VAR未介入正确。","v":"correct","videos":["2026/i17c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260812/1786536487801381.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2026-188","t":"case","s":"2026","issue":17,"no":2,"seq":188,"comp":"中超联赛","round":"第22轮","home":"大连英博","away":"辽宁铁人","minute":"8","desc":"判例二：中超联赛第22轮，大连英博海发VS辽宁铁人楠波湾。比赛第8分钟，大连英博海发踢出角球后，在辽宁铁人楠波湾罚球区内，大连英博海发11号队员与辽宁铁人楠波湾3号队员接触后倒地。裁判员未判罚犯规，VAR未介入。","appeal":"大连英博海发俱乐部申诉意见认为：对方3号对本方11号实施暴力行为，应予红牌罚令出场，并判罚球点球。","concl":"对于此判例，评议组一致认为：双方队员正常争抢位置，现有视频未显示有暴力行为。支持裁判员未判罚犯规的决定。VAR未介入正确。","v":"correct","videos":["2026/i17c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260812/1786536504172132.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"playon","c":"none"}},{"k":"2026-189","t":"case","s":"2026","issue":17,"no":3,"seq":189,"comp":"中超联赛","round":"第22轮","home":"大连英博","away":"辽宁铁人","minute":"19","desc":"判例三：中超联赛第22轮，大连英博海发VS辽宁铁人楠波湾。比赛第19分钟，大连英博海发踢前场任意球，随后进球。裁判员初始判进球有效，VAR介入，裁判员改判大连英博海发24号队员越位犯规，进球无效。","appeal":"大连英博海发俱乐部申诉意见认为：本方24号队员未处在越位位置，后续进球应有效。","concl":"对于此判例，评议组一致认为：VAR对于大连英博海发传球瞬间定帧的选择、操作流程和画线结果均正确，得出的越位位置结论正确。球传入罚球区后，辽宁铁人楠波湾防守队员的触球属于受限触球，不属于主动处理球范畴，按照规则，大连英博海发24号构成在越位位置获利的越位犯规，进球无效。裁判员改判大连英博海发越位犯规进球无效的最终决定正确。VAR介入正确。","v":"correct","videos":["2026/i17c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260812/1786536526975323.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2026-190","t":"case","s":"2026","issue":17,"no":4,"seq":190,"comp":"中超联赛","round":"第22轮","home":"大连英博","away":"辽宁铁人","minute":"33","desc":"判例四：中超联赛第22轮，大连英博海发VS辽宁铁人楠波湾。比赛第33分钟，大连英博海发30号队员前插至对方罚球区内接队友传球时，与辽宁铁人楠波湾26号队员接触后倒地。裁判员未判罚犯规。VAR未介入。","appeal":"大连英博海发俱乐部申诉意见认为：对方26号对本方30号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：双方争抢过程中，大连英博海发30号率先触球，但辽宁铁人楠波湾26号防守中已站定位置，大连英博海发30号继续前进造成双方接触，双方属于正常身体对抗，不构成犯规。裁判员未判罚犯规正确。VAR未介入正确。","v":"correct","videos":["2026/i17c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260812/1786536546757933.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-191","t":"case","s":"2026","issue":17,"no":5,"seq":191,"comp":"中超联赛","round":"第22轮","home":"大连英博","away":"辽宁铁人","minute":"47","desc":"判例五：中超联赛第22轮，大连英博海发VS辽宁铁人楠波湾。比赛第47分钟，大连英博海发进球。裁判员判大连英博海发进球的30号队员越位犯规在先，进球无效。VAR未介入。","appeal":"大连英博海发俱乐部申诉意见认为：本方30号队员不越位，进球应有效。","concl":"对于此判例，评议组一致认为：VAR对于大连英博海发传球瞬间定帧的选择、操作流程和画线结果均正确，得出的越位位置结论正确。处于越位位置的大连英博海发30号随后接球并射门进球，构成在越位位置干扰比赛的越位犯规，进球无效。裁判员判大连英博海发30号越位犯规进球无效的决定正确。VAR未介入正确。","v":"correct","videos":["2026/i17c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260812/1786536570817393.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2026-192","t":"case","s":"2026","issue":17,"no":6,"seq":192,"comp":"中超联赛","round":"第22轮","home":"大连英博","away":"辽宁铁人","minute":"77","desc":"判例六：中超联赛第22轮，大连英博海发VS辽宁铁人楠波湾。比赛第77分钟，双方队员在边线附近争抢后，辽宁铁人楠波湾3号队员与大连英博海发11号队员有接触。随后辽宁铁人楠波湾18号队员与助理裁判员有接触。裁判员向辽宁铁人楠波湾3号和大连英博海发11号出示黄牌，VAR未介入。","appeal":"大连英博海发俱乐部申诉意见认为：对方18号队员推搡助理裁判员，应红牌罚令出场。","concl":"对于此判例，评议组一致认为：辽宁铁人楠波湾3号队员与大连英博海发11号均出现非体育行为，裁判员向上述2名队员出示黄牌的决定正确。VAR未介入正确。辽宁铁人楠波湾18号与裁判员的接触，未构成需红牌罚令出场的行为，在俱乐部申诉的核心问题（红牌）上，裁判员决定正确，并非红牌。同时评议组指出，比赛中队员不应与裁判员或其他比赛官员进行肢体接触。","v":"correct","videos":["2026/i17c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260812/1786536605578037.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2026-193","t":"case","s":"2026","issue":17,"no":7,"seq":193,"comp":"中超联赛","round":"第22轮","home":"重庆铜梁龙","away":"上海海港","minute":"90","desc":"判例七：中超联赛第22轮，重庆铜梁龙VS上海海港。比赛第90分钟，重庆铜梁龙27号队员与上海海港10号队员争抢时发生接触。裁判员判重庆铜梁龙27号犯规并向其出示黄牌。VAR未介入。","appeal":"上海海港俱乐部申诉意见认为：对方27号对本方10号严重犯规，应出示红牌。","concl":"对于此判例，评议组一致认为：重庆铜梁龙27号在争抢高空球时，使用了正常踢球动作，未注意到上海海港10号的位置，接触对方队员时使用了脚背部位，屈膝收腿，无额外发力，属于未顾及对方队员安全的情形，构成鲁莽犯规，应被出示黄牌；未使用过分力量，不构成严重犯规，不应被出示红牌。裁判员向重庆铜梁龙27号出示黄牌的决定正确。VAR未介入正确。","v":"correct","videos":["2026/i17c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260812/1786536633621382.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2026-195","t":"case","s":"2026","issue":17,"no":9,"seq":195,"comp":"中超联赛","round":"","home":"山东泰山","away":"天津津门虎","minute":"","desc":"判例九：天津津门虎俱乐部申诉意见认为：在判例八的事件中，对方9号队员在进球前踩踏到本方11号队员，应判对方9号犯规在先，进球无效。","appeal":"","concl":"对于此判例，评议组一致认为：山东泰山9号正常带球前进，天津津门虎10号在其背后使用手臂实施接触，山东泰山9号试图扣球过人，无犯规动作，在维持身体平衡过程中与天津津门虎11号的接触不构成犯规，后续进球有效。裁判员未判罚犯规，以及判进球有效的决定正确。VAR未介入正确。","v":"correct","videos":["2026/i17c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260812/1786536702873444.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-196","t":"case","s":"2026","issue":17,"no":10,"seq":196,"comp":"中甲联赛","round":"第18轮","home":"石家庄功夫","away":"陕西联合","minute":"64","desc":"判例十：中甲联赛第18轮，石家庄功夫VS陕西联合。比赛第64分钟，裁判员判罚陕西联合25号队员对石家庄功夫10号队员严重犯规，并出示红牌。经VAR介入，裁判员在场回看后，维持红牌的决定。","appeal":"陕西联合俱乐部申诉意见认为：本方25号并非严重犯规，不应被出示红牌。","concl":"对于此判例，评议组多数成员认为：石家庄功夫10号扣球变向后，陕西联合25号伸脚无触球的可能，争抢时使用鞋钉部位接触对方膝关节附近部位，危及对方安全。裁判员观察位置好，评议组支持裁判员向陕西联合25号出示红牌的决定。VAR介入错误。","v":"correct","videos":["2026/i17c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260812/1786536735397408.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"red"}},{"k":"2026-197","t":"case","s":"2026","issue":17,"no":11,"seq":197,"comp":"中甲联赛","round":"第18轮","home":"石家庄功夫","away":"陕西联合","minute":"","desc":"判例十一：中甲联赛第18轮，石家庄功夫VS陕西联合。比赛第90+9分钟，陕西联合7号队员在对方罚球区内与石家庄功夫39号队员争抢后倒地。裁判员未判罚犯规。经VAR介入（点球事件），裁判员在场回看后，维持不犯规的决定。","appeal":"陕西联合俱乐部申诉意见认为：对方39号对本方7号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：石家庄功夫39号左脚先到达位置，获得领先身位并正常摆腿试图踢球。陕西联合7号争抢时左腿进入对方摆腿路线，且未触球，造成了双方接触，随后球才接触陕西联合7号。石家庄功夫39号不构成犯规。裁判员维持不犯规的最终决定正确。VAR介入错误。","v":"correct","videos":["2026/i17c11-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260812/1786536774478093.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-198","t":"case","s":"2026","issue":17,"no":12,"seq":198,"comp":"中甲联赛","round":"第18轮","home":"延边龙鼎","away":"深圳青年人","minute":"29","desc":"判例十二：中甲联赛第18轮，延边龙鼎可喜安vs深圳青年人。比赛第29分钟，裁判员判罚延边龙鼎可喜安20号队员对深圳青年人28号队员犯规且犯规地点在延边龙鼎罚球区内，判罚球点球。后经过与助理裁判员、第四官员的沟通，维持罚球点球的决定。","appeal":"延边龙鼎俱乐部申诉意见认为：裁判员与其他比赛官员沟通不当，不应判罚球点球。","concl":"对于此判例，评议组首先一致认为：从现有视频看，延边龙鼎可喜安20号犯规时与对方队员接触点在罚球区内。裁判员判延边龙鼎可喜安20号犯规并判罚球点球的决定正确。同时评议组指出：对于此犯规发生的位置，助理裁判员、第四官员的观察角度均无绝对的说服力，裁判员最终判罚正确，但裁判组在本次判罚中的沟通配合表现不佳。","v":"correct","videos":["2026/i17c12-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260812/1786536975747683.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2026-199","t":"case","s":"2026","issue":17,"no":13,"seq":199,"comp":"中乙联赛","round":"第20轮","home":"泰安天贶","away":"大连英博B队","minute":"","desc":"判例十三：中乙联赛第20轮，泰安天贶VS大连英博B队。比赛第90+4分钟，泰安天贶39号队员铲抢大连英博B队16号队员，裁判员掌握有利，并在随后比赛停止时向泰安天贶39号出示黄牌。","appeal":"大连英博俱乐部申诉意见认为：对方39号构成严重犯规，应予出示红牌罚令出场。","concl":"对于此判例，评议组一致认为：泰安天贶39号铲抢时速度和力度较快较强，且使用直腿动作，但现有视频无法清晰证明双方接触的具体部位和接触情况，泰安天贶39号铲球接触后立即屈腿收脚。支持裁判员将泰安天贶39号的动作视为鲁莽犯规并出示黄牌的决定。","v":"correct","videos":["2026/i17c13-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260812/1786537006193206.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2026-200","t":"case","s":"2026","issue":17,"no":14,"seq":200,"comp":"中乙联赛","round":"第20轮","home":"厦门飞鹭","away":"广州蒲公英","minute":"87","desc":"判例十四：中乙联赛第20轮，厦门飞鹭VS广州蒲公英。比赛第87分钟，广州蒲公英进攻时将球传中至对方罚球区内， 厦门飞鹭59号队员疑似手臂触球。裁判员未判罚手球犯规。","appeal":"广州蒲公英俱乐部申诉意见认为：对方59号手球犯规，应判罚球点球。","concl":"对于此判例，评议组首先一致认为：通过现有视频无法看清球是否接触厦门飞鹭59号的手臂，以及接触的具体情形。其次，评议组多数成员支持裁判员未判罚手球犯规的决定。","v":"correct","videos":["2026/i17c14-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260812/1786537025197279.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2026-201","t":"case","s":"2026","issue":18,"no":1,"seq":201,"comp":"中超联赛","round":"第23轮","home":"云南玉昆","away":"大连英博","minute":"72","desc":"判例一：中超联赛第23轮，云南玉昆VS大连英博海发。比赛第72分钟，云南玉昆踢角球，随后由9号队员进球。裁判员判进球有效，VAR未介入。","appeal":"大连英博海发俱乐部申诉意见认为：对方34号队员处在越位位置，干扰了本方守门员，应判罚越位犯规，进球无效。","concl":"对于此判例，评议组多数成员认为：云南玉昆9号头顶球时，云南玉昆34号处于越位位置，但并未遮挡大连英博海发守门员视线，也未做出试图触球、争抢球或影响对方处理球能力的明显举动，不构成越位犯规。裁判员判进球有效的决定正确。VAR未介入正确。","v":"correct","videos":["2026/i18c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260819/1787142146676661.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2026-202","t":"case","s":"2026","issue":18,"no":2,"seq":202,"comp":"中超联赛","round":"第23轮","home":"云南玉昆","away":"大连英博","minute":"75","desc":"判例二：中超联赛第23轮，云南玉昆VS大连英博海发。比赛第75分钟，大连英博海发38号队员在对方罚球区内与云南玉昆19号队员接触后倒地。裁判员未判罚犯规，VAR未介入。","appeal":"大连英博海发俱乐部申诉意见认为：对方19号肘击本方38号面部，应判罚球点球并因暴力行为将对方19号红牌罚令出场。","concl":"对于此判例，评议组首先一致认为：云南玉昆19号不存在用手臂主动发力击打大连英博海发38号头部的情况，不构成严重犯规或暴力行为，在俱乐部申诉的核心问题之一（红牌）上，裁判员决定正确，并非红牌。其次，评议组多数成员认为：双方队员均有使用手臂争抢有利位置的动作，云南玉昆19号在争抢位置时，手臂与大连英博海发38号肩颈部有接触，以及后续对对方有轻微拉扯，均力度轻微，并非造成大连英博海发38号倒地或失去控球权的主要原因，未构成犯规。评议组支持裁判员未判罚犯规的决定。VAR未介入正确。","v":"correct","videos":["2026/i18c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260819/1787142167280123.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"playon","c":"none"}},{"k":"2026-203","t":"case","s":"2026","issue":18,"no":3,"seq":203,"comp":"中超联赛","round":"第23轮","home":"云南玉昆","away":"大连英博","minute":"43","desc":"判例三：中超联赛第23轮，云南玉昆VS大连英博海发。比赛第43分钟，大连英博海发30号队员在与云南玉昆8号队员接触后倒地。裁判员判罚云南玉昆8号犯规，未出示红黄牌。VAR未介入。","appeal":"大连英博海发俱乐部申诉意见认为：对方8号踩踏本方30号，应予以红牌罚令出场。","concl":"对于此判例，评议组首先一致认为：云南玉昆8号的犯规不构成严重犯规或暴力行为，在俱乐部申诉的核心问题（红牌）上，裁判员决定正确，并非红牌。其次，评议组多数成员认为：云南玉昆8号在正常跑动过程中，意外踩中大连英博海发30号脚背，并很快刮擦脱离，无故意犯规意图，应视为草率犯规，不应出示黄牌。裁判员判云南玉昆8号犯规以及未出示红黄牌的决定正确。VAR未介入正确。","v":"correct","videos":["2026/i18c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260819/1787142193515697.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"yellow"}},{"k":"2026-204","t":"case","s":"2026","issue":18,"no":4,"seq":204,"comp":"中超联赛","round":"第23轮","home":"浙江俱乐部绿城","away":"成都蓉城","minute":"45","desc":"判例四：中超联赛第23轮，浙江俱乐部绿城VS成都蓉城。比赛第45分钟，成都蓉城踢角球，并由9号队员进球。裁判员初始判进球有效，经VAR介入，裁判员在场回看后，最终判罚成都蓉城20号队员处在越位位置并干扰对方守门员，构成越位犯规，进球无效。","appeal":"","concl":"此判例无参赛队申诉，但部分媒体和观众对于竞赛规则中关于越位位置认定的理解存在误区，简单认为“发角球时无越位犯规”。评议组特此作出说明：按照竞赛规则，队员直接接本方角球时，不存在越位犯规；但在此判例中，成都蓉城20号在本方9号头顶球时处于越位位置，不属于直接接本方角球的情况。成都蓉城20号当时作出与浙江俱乐部守门员接触的明显举动，影响了后者处理球的能力，构成了干扰对方队员的越位犯规。经VAR介入，裁判员判成都蓉城越位犯规进球无效的决定正确。VAR介入正确。","v":"correct","videos":["2026/i18c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260819/1787142214268978.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2026-205","t":"case","s":"2026","issue":18,"no":5,"seq":205,"comp":"中乙联赛","round":"第21轮","home":"江西庐山","away":"厦门飞鹭","minute":"66","desc":"判例五：中乙联赛第21轮，江西庐山VS厦门飞鹭。比赛第66分钟，厦门飞鹭踢前场任意球，随后由10号队员进球，裁判员判进球有效。","appeal":"江西庐山俱乐部申诉意见认为：对方头球射门时，其7号队员处于越位位置，本方守门员扑出射门后，对方7号得球并传球助攻10号队友进球，应判对方7号越位犯规，进球无效。","concl":"对于此判例，评议组一致认为：厦门飞鹭11号队员头球射门时，其7号队员处于越位位置，并在对方守门员救球后得球并传球，构成在越位位置获利的越位犯规，后续进球无效。裁判员判进球有效的决定错误，漏判越位犯规。","v":"wrong","videos":["2026/i18c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260819/1787142258855882.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2026-206","t":"case","s":"2026","issue":18,"no":6,"seq":206,"comp":"中乙联赛","round":"第21轮","home":"江西庐山","away":"厦门飞鹭","minute":"80","desc":"判例六：中乙联赛第21轮，江西庐山VS厦门飞鹭。比赛第80分钟，江西庐山27号队员在对方罚球区内与厦门飞鹭17号队员接触后倒地，裁判员未判罚犯规。","appeal":"江西庐山俱乐部申诉意见认为：对方17号对本方27号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：从现有视频看，双方队员腿部接触较为轻微，但视频无法清晰证明具体接触情况以及是否存在犯规，评议组支持裁判员未判罚犯规的决定。","v":"correct","videos":["2026/i18c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260819/1787142287180881.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-207","t":"case","s":"2026","issue":19,"no":1,"seq":207,"comp":"中甲联赛","round":"第20轮","home":"宁波俱乐部","away":"延边龙鼎","minute":"60","desc":"判例一：中甲联赛第20轮，宁波俱乐部VS延边龙鼎可喜安。比赛第60分钟，延边龙鼎可喜安进球，裁判员判进球有效。","appeal":"宁波俱乐部申诉意见认为：对方向前直传时，其30号队员处于越位位置，随后得球传中，对方37号进球。应判对方30号越位犯规，后续进球无效。","concl":"对于此判例，评议组一致认为：从现有视频看，可能存在由于拍摄角度和空间透视关系造成的视觉误差，无法完全证明延边龙鼎可喜安向前传球时，其30号队员是否处于越位位置。视频中也未显示出助理裁判员处于具有说服力的观察位置。评议组对此判例不予认定。","v":"pending","videos":["2026/i19c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260826/1787737493324060.mp4"],"cat":"offside","catname":"越位"},{"k":"2026-208","t":"case","s":"2026","issue":19,"no":2,"seq":208,"comp":"中甲联赛","round":"第20轮","home":"定南赣联","away":"石家庄功夫","minute":"39","desc":"判例二：中甲联赛第20轮，定南赣联VS石家庄功夫。比赛第39分钟，裁判员判定南赣联16号队员在争抢高球时对石家庄功夫12号队员犯规，并出示黄牌。","appeal":"石家庄功夫俱乐部申诉意见认为：对方16号动作属于暴力行为，应予红牌罚令出场。","concl":"对于此判例，评议组一致认为：定南赣联16号能够观察到石家庄功夫12号的位置，其争抢高球的同时，发力蹬踹对方队员胸腹部，属于用野蛮方式的附加犯规动作，危及对方安全，应视为严重犯规并予以红牌罚令出场。裁判员向定南赣联16号出示黄牌的决定错误，漏判红牌。","v":"wrong","videos":["2026/i19c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260826/1787737546336401.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2026-209","t":"case","s":"2026","issue":19,"no":3,"seq":209,"comp":"中甲联赛","round":"第20轮","home":"定南赣联","away":"石家庄功夫","minute":"","desc":"判例三：中甲联赛第20轮，定南赣联VS石家庄功夫。比赛第90+3分钟，定南赣联进攻时，石家庄功夫队队员在本方罚球区内倒地，裁判员未判罚犯规。","appeal":"石家庄功夫俱乐部申诉意见认为：对方队员在非争抢球情况下故意踢本方队员，属于暴力行为，应予红牌罚令出场。","concl":"对于此判例，评议组一致认为：石家庄功夫队员在本方罚球区内防守时，无犯规动作。定南赣联进攻队员在非争抢球的情况下，故意向后撩踹对方队员，并且具有一定力度，应视为暴力行为并给予红牌罚令出场。裁判员决定错误，漏判定南赣联队员红牌。","v":"wrong","videos":["2026/i19c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260826/1787737564923682.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2026-210","t":"case","s":"2026","issue":19,"no":4,"seq":210,"comp":"中乙联赛","round":"第22轮","home":"海门珂缔缘","away":"山东泰山B队","minute":"40","desc":"判例四：中乙联赛第22轮，海门珂缔缘VS山东泰山B队。比赛第40分钟，山东泰山B队43号队员进球，助理裁判员示意越位，裁判员判山东泰山B队43号越位犯规，进球无效。","appeal":"山东泰山俱乐部申诉意见认为：本方43号不越位。","concl":"对于此判例，评议组一致认为：现有视频的拍摄角度无法清晰证明山东泰山B队43号在本方传球时是否处于越位位置。视频中能够看到助理裁判员的临场观察位置较好。评议组支持助理裁判员的判断，以及裁判员作出的山东泰山B队43号越位犯规进球无效的决定。","v":"correct","videos":["2026/i19c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260826/1787737581556123.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2026-211","t":"case","s":"2026","issue":19,"no":5,"seq":211,"comp":"中乙联赛","round":"第22轮","home":"海门珂缔缘","away":"山东泰山B队","minute":"76","desc":"判例五：中乙联赛第22轮，海门珂缔缘VS山东泰山B队。比赛第76分钟，海门珂缔缘16号队员在对方罚球区内与山东泰山B队5号接触后倒地。裁判员最终判山东泰山B队5号犯规，判罚球点球，并出示黄牌警告山东泰山B队5号。","appeal":"山东泰山俱乐部申诉意见认为：裁判员在作出决定的过程中存在改判，改判程序不符合规则规定。","concl":"对于此判例，评议组多数成员认为：山东泰山B队5号防守时伸腿绊摔海门珂缔缘16号并造成后者倒地，裁判员判山东泰山B队5号犯规并判罚球点球的主要决定正确，但无需向山东泰山B队5号出示黄牌。另外，评议组指出：根据竞赛规则，在比赛恢复前，裁判员可以更改判罚（包括在其他比赛官员的协助下），并作出最终的判罚决定。此判例中裁判员最终判罚球点球，符合判罚程序。","v":"wrong","videos":["2026/i19c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260826/1787737708331586.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2026-212","t":"case","s":"2026","issue":19,"no":6,"seq":212,"comp":"中乙联赛","round":"第22轮","home":"广州蒲公英","away":"贵州贵阳竞技","minute":"17","desc":"判例六：中乙联赛第22轮，广州蒲公英VS贵州贵阳竞技。比赛第17分钟，贵州贵阳竞技踢角球，双方队员在广州蒲公英罚球区内争抢位置时倒地。裁判员未判罚犯规。","appeal":"贵州贵阳竞技俱乐部申诉意见认为：在无球状态下，对方22号挥拳击打本方35号并致其倒地，属于暴力行为，应向对方22号出示红牌罚令出场，并应判罚球点球。\n广州蒲公英俱乐部申诉意见认为：在无球状态下，对方35号肘击并挥拳击打本方22号，导致本方22号作出过激行为。对方35号属于暴力犯规。","concl":"对于此判例，评议组首先一致认为：广州蒲公英22号挥臂故意击打贵州贵阳竞技35号头部，属于暴力行为，应给予红牌罚令出场。其次，评议组多数成员认为：贵州贵阳竞技35号手臂有击打广州蒲公英22号的犯规动作，但现有视频无法看到具体接触情况，无法认定是否应给予贵州贵阳竞技35号红黄牌处罚。由于贵州贵阳竞技35号存在犯规，且发生于广州蒲公英22号的暴力行为之前，因此不应判罚球点球。综上，评议组认定：贵州贵阳竞技35号犯规，但是否构成红牌或者黄牌不予认定；广州蒲公英22号暴力行为，应予红牌罚令出场；比赛应以广州蒲公英队踢直接任意球恢复。在贵州贵阳竞技俱乐部申诉的核心问题（红牌及罚球点球）上，裁判员漏判红牌，但未漏判罚球点球；在广州蒲公英俱乐部申诉的核心问题（红牌）上，评议组不予认定。","v":"wrong","videos":["2026/i19c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260826/1787737746522043.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk"}},{"k":"2026-213","t":"case","s":"2026","issue":19,"no":7,"seq":213,"comp":"中超联赛","round":"第24轮","home":"深圳新鹏城","away":"浙江俱乐部绿城","minute":"80","desc":"判例七：中超联赛第24轮，深圳新鹏城vs浙江俱乐部绿城。比赛第80分钟，深圳新鹏城替换队员，因替换下场的11号队员未在10秒内离场，造成替换上场的17号队员暂时不能上场，之后深圳新鹏城15号队员受伤下场，未能作出替换。随后比赛恢复，深圳新鹏城场上队员暂时为9人，深圳新鹏城踢直接任意球恢复比赛后，浙江俱乐部绿城队得到控球权，发起进攻并取得进球。裁判员判进球有效。","appeal":"深圳新鹏城俱乐部申诉意见认为：本队在队员受伤后，已提交换人申请，但第四官员拒绝执行换人程序，导致本方在只有9名场上队员的情况下，被对方进球。","concl":"对于此判例，经调查和了解现场情况，评议组作出如下认定和说明：\n第一，深圳新鹏城17号替换11号时，因后者未能在10秒限时内离开比赛场地，按照竞赛规则，替换上场的17号暂时不能上场，需在比赛恢复后再经过1分钟，之后的首次比赛停止时，得到裁判员的示意，方可上场。\n第二，在比赛恢复前，深圳新鹏城15号受伤倒地，随后由担架抬出场地。在此过程中，深圳新鹏城再次提出替换申请，由6号和25号，替换场上的2号和受伤的15号。第四官员未执行替换前的有关检查。此时比赛具备恢复条件，裁判员决定恢复比赛，该程序并不违反竞赛规则。球队提出替换申请，并不意味着替换程序即刻开始，第四官员必须先进行一系列检查核对程序（包括检查核对替换单据、换人牌、本场报名名单、确认队员号码和参赛资格、检查替补队员装备等），所有程序就绪后，才可通知裁判员，并在比赛停止时进行替换。在上述检查完成前，如果比赛具备继续或恢复的条件，裁判员应先允许比赛继续或恢复。\n第三，此判例中，在深圳新鹏城15号受伤倒地时，比赛已具备恢复条件。但裁判员因深圳新鹏城15号受伤而延迟比赛恢复，此时如果球队提出替换申请，并且递交资料齐备，从管理角度出发，第四官员应优先启动替换前的检查程序（无论是否能够在比赛恢复前完成替换），其次再兼顾（或由其他比赛官员兼顾）暂不允许上场的深圳新鹏城17号的管理与计时（如果比赛恢复）。\n综上，此判例中，比赛在深圳新鹏城场上暂时只有9名队员时恢复，符合竞赛规则。但裁判组在比赛管理和工作程序处理上存在不足。","v":"correct","videos":["2026/i19c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260826/1787737900340738.mp4"],"cat":"other_program","catname":"程序与其他","ans":{"r":"goal_valid","c":"none"}},{"k":"2026-214","t":"case","s":"2026","issue":20,"no":1,"seq":214,"comp":"中甲联赛","round":"第21轮","home":"佛山南狮","away":"深圳青年人","minute":"83","desc":"中甲联赛第21轮，佛山南狮VS深圳青年人。比赛第83分钟，佛山南狮将球传至对方罚球区内，佛山南狮24号队员与深圳青年人33号队员争抢后倒地，裁判员未判罚犯规，VAR未介入。","appeal":"佛山南狮俱乐部申诉意见认为：对方33号对本方24号犯规，应判罚球点球。","concl":"对于此判例，评议组多数成员认为：双方队员争抢球机会基本均等，佛山南狮24号勉强先触球，但身体重心靠后，难以继续控球；深圳青年人33号争抢球动作合理，与对方脚部的接触较为轻微，并非摆腿踢倒对方。该接触属于比赛中可以接受的程度，不构成犯规。裁判员未判罚犯规正确。VAR未介入正确。","v":"correct","videos":["2026/i20c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260909/1788939422605105.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-215","t":"case","s":"2026","issue":20,"no":2,"seq":215,"comp":"中国足协杯","round":"第6轮","home":"山东泰山","away":"上海海港","minute":"3","desc":"判例二：中国足协杯赛第6轮，山东泰山vs上海海港。比赛第3分钟，山东泰山8号队员在对方罚球区线附近位置与上海海港10号接触后倒地，裁判员未判罚犯规，VAR未介入。","appeal":"山东泰山俱乐部申诉意见认为：对方10号对本方8号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：山东泰山8号右脚扣球变向，手臂与对方队员身体有接触，且左脚支撑脚落地地点与对方双脚缠在一起，造成双方倒地。上海海港10号的防守和封堵动作合理，并未踢或绊摔对方队员。双方均为合理动作，不构成犯规。裁判员未判罚犯规正确。VAR未介入正确。","v":"correct","videos":["2026/i20c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260909/1788939445784267.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-216","t":"case","s":"2026","issue":21,"no":1,"seq":216,"comp":"中甲联赛","round":"第23轮","home":"广西恒宸","away":"延边龙鼎","minute":"41","desc":"判例一：中甲联赛第23轮，广西恒宸VS延边龙鼎。比赛第41分钟，广西恒宸36号队员进球，裁判员判进球有效。","appeal":"延边龙鼎俱乐部申诉意见认为：对方36号进球前手球犯规，进球应无效。","concl":"对于此判例，评议组一致认为：广西恒宸36号队员手臂触球后立即进球，按照竞赛规则，应判手球犯规，进球无效。裁判员判进球有效的决定错误，漏判攻方手球犯规。","v":"wrong","videos":["2026/i21c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260916/1789549200416028.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"goal_invalid","c":"none"}},{"k":"2026-217","t":"case","s":"2026","issue":21,"no":2,"seq":217,"comp":"中甲联赛","round":"第23轮","home":"石家庄功夫","away":"深圳青年人","minute":"22","desc":"判例二：中甲联赛第23轮，石家庄功夫VS深圳青年人。比赛第22分钟，石家庄功夫踢前场任意球，之后由31号队员头球进球。助理裁判员示意越位，裁判员判石家庄功夫31号越位犯规，进球无效。","appeal":"石家庄功夫俱乐部申诉意见认为：本方31号不越位，进球应有效。","concl":"对于此判例，评议组一致认为：石家庄功夫进攻过程中无队员处于越位位置，不存在越位犯规，进球应有效。助理裁判员判断错误，裁判员判石家庄功夫31号越位犯规在先、进球无效的决定均为错误。","v":"wrong","videos":["2026/i21c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260916/1789549249980849.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2026-218","t":"case","s":"2026","issue":21,"no":3,"seq":218,"comp":"中甲联赛","round":"第23轮","home":"石家庄功夫","away":"深圳青年人","minute":"46","desc":"判例三：中甲联赛第23轮，石家庄功夫VS深圳青年人。比赛第46分钟，石家庄功夫7号队员在对方罚球区内与深圳青年人37号队员接触后倒地，裁判员未判罚犯规。","appeal":"石家庄功夫俱乐部申诉意见认为：对方37号对本方7号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：双方跑动过程中，石家庄功夫7号和深圳青年人37号先后使用手臂与对方接触和对抗，以争抢有利位置，接触程度均未构成犯规。裁判员未判罚犯规的决定正确。","v":"correct","videos":["2026/i21c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260916/1789549296428649.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-219","t":"case","s":"2026","issue":21,"no":4,"seq":219,"comp":"中甲联赛","round":"第23轮","home":"石家庄功夫","away":"深圳青年人","minute":"77","desc":"判例四：中甲联赛第23轮，石家庄功夫VS深圳青年人。比赛第77分钟，石家庄功夫31号队员在对方罚球区内与深圳青年人20号队员接触后倒地，裁判员未判罚犯规。","appeal":"石家庄功夫俱乐部申诉意见认为：对方20号对本方31号犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：石家庄功夫31号与深圳青年人20号在争夺位置时互相拉扯对方球衣。之后深圳青年人20号手臂接触石家庄功夫31号肩部，未达到犯规程度；石家庄功夫31号触球后已无法控球，有主动倒地夸大接触程度的成分。裁判员未判罚犯规的决定正确。","v":"correct","videos":["2026/i21c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260916/1789549336716587.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2026-220","t":"case","s":"2026","issue":21,"no":5,"seq":220,"comp":"中乙联赛","round":"第23轮","home":"上海海港富盛经开","away":"江西庐山","minute":"54","desc":"判例五：中乙联赛第23轮，上海海港富盛经开VS江西庐山。比赛第54分钟，上海海港富盛经开14号队员疑似在本方罚球区内手臂触球，裁判员未判罚手球犯规。","appeal":"江西庐山俱乐部申诉意见认为：对方14号手球犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：江西庐山队员脚跟磕球，球经上海海港富盛经开队员脚部近距离阻挡变线后，意外接触上海海港富盛经开14号手臂，其手臂位置靠近身体，不构成手球犯规。裁判员未判罚手球犯规的决定正确。","v":"correct","videos":["2026/i21c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260916/1789549393180991.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2026-221","t":"case","s":"2026","issue":22,"no":1,"seq":221,"comp":"中甲联赛","round":"第24轮","home":"南通支云","away":"广西恒宸","minute":"55","desc":"判例一：中甲联赛第24轮，南通支云VS广西恒宸。比赛第55分钟，在广西恒宸罚球区内，南通支云19号队员传中，广西恒宸6号疑似手臂触球。裁判员未判罚手球犯规。VAR未介入。","appeal":"南通支云俱乐部申诉意见认为：对方6号手球犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：广西恒宸6号队员在倒地封堵传球时，球击中置于身后作为合理支撑且未扩大防守面积的手臂，不构成手球犯规。裁判员未判罚手球犯规的决定正确。VAR未介入正确。","v":"correct","videos":["2026/i22c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260923/1790166625268107.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2026-222","t":"case","s":"2026","issue":22,"no":2,"seq":222,"comp":"中甲联赛","round":"第24轮","home":"南通支云","away":"广西恒宸","minute":"66","desc":"判例二：中甲联赛第24轮，南通支云VS广西恒宸。比赛第66分钟，南通支云10号队员将球传中至对方罚球区内，广西恒宸3号疑似手臂触球。裁判员未判罚手球犯规。VAR未介入。","appeal":"南通支云俱乐部申诉意见认为：对方3号手球犯规，应判罚球点球。","concl":"对于此判例，评议组一致认为：现有视频无法清晰展现球与手臂的接触点，结合球员身体与手臂位置、助理裁判的观察视角及动作分析，广西恒宸3号队员为手臂紧贴身体，支持裁判员未判罚其手球犯规的决定。VAR未介入正确。","v":"correct","videos":["2026/i22c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260923/1790166674673098.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2026-223","t":"case","s":"2026","issue":22,"no":3,"seq":223,"comp":"中甲联赛","round":"第24轮","home":"南通支云","away":"广西恒宸","minute":"11","desc":"判例三：中甲联赛第24轮，南通支云VS广西恒宸。比赛第11分钟，广西恒宸18号队员在与南通支云10号队员争抢时发生接触。裁判员未判罚犯规。VAR未介入。","appeal":"南通支云足球俱乐部申诉意见认为：对方18号队员构成严重犯规，应予以红牌罚令出场。","concl":"对于此判例，评议组一致认为：广西恒宸18号队员在与南通支云10号队员争抢空中球时脚底触碰对方，随后立即屈膝收腿，属于剐蹭动作，未达到严重犯规强度，应出示黄牌警告。在南通支云足球俱乐部申诉的核心问题（红牌）上，裁判员决定正确，但未判罚犯规错误，漏判犯规和黄牌。VAR未介入正确。","v":"wrong","videos":["2026/i22c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260923/1790166706524262.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"yellow"}},{"k":"2026-224","t":"case","s":"2026","issue":22,"no":4,"seq":224,"comp":"中甲联赛","round":"第24轮","home":"南京城市","away":"无锡吴钩","minute":"9","desc":"判例四：中甲联赛第24轮，南京城市VS无锡吴钩。比赛第9分钟，南京城市罚球区内，南京城市20号队员在与无锡吴钩7号队员争抢时发生接触。裁判员判南京城市20号队员犯规并向其出示黄牌，判罚球点球。","appeal":"南京城市俱乐部申诉意见认为：本方20号不构成犯规，不应判罚球点球。","concl":"对于此判例，评议组多数成员认为：在进攻方拥有明显进球得分机会的情况下，双方争抢球时，南京城市20号队员的左脚绊到无锡吴钩7号队员的右脚并造成对方倒地，构成草率绊摔犯规。按照竞赛规则，在罚球区内针对此类犯规的纪律处罚应当降格为黄牌，应当判罚球点球。裁判员判罚球点球并出示黄牌的决定正确。","v":"correct","videos":["2026/i22c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260923/1790166751284501.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"yellow"}},{"k":"2026-225","t":"case","s":"2026","issue":22,"no":5,"seq":225,"comp":"中乙联赛","round":"第24轮","home":"杭州临平吴越","away":"上海海港B队","minute":"32","desc":"判例五：中乙联赛第24轮，杭州临平吴越VS上海海港B队。比赛第32分钟，杭州临平吴越56号队员进攻时与上海海港B队53号队员争抢时发生接触。裁判员判56号队员进攻犯规。","appeal":"杭州临平吴越俱乐部申诉意见认为：对方53号对本方56号恶意犯规，且破坏本方明显进球得分机会，应出示红牌罚令出场。","concl":"对于此判例，评议组一致认为：双方队员均以争抢球的目的争抢高空来球，且都未顶到球，随后发生正常的身体碰撞，期间无任何附加动作，属于不可避免的接触，双方队员均不构成犯规。在杭州临平吴越俱乐部申诉的核心问题（红牌）上，裁判员决定正确，但裁判员判罚攻方犯规的决定错误。","v":"wrong","videos":["2026/i22c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20260923/1790166792132604.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-1","t":"case","s":"2025","issue":1,"no":1,"seq":1,"comp":"中超联赛","round":"第一轮","home":"上海申花","away":"长春亚泰","minute":"","desc":"判例一：中超联赛第一轮，上海申花vs长春亚泰，比赛第90+1分钟，上海申花4号队员在对方罚球区内争抢球时踩踏到长春亚泰23号守门员腿部，裁判员初始未判罚犯规，VAR介入。裁判员经在场回看后，判上海申花4号犯规，并出示黄牌警告。","appeal":"","concl":"对于此判例，评议组多数成员认为：上海申花4号队员试图射门，未踢到球，落地时鞋钉部位踩踏到长春亚泰23号守门员小腿侧部，犯规动作及接触力量危及对方队员安全，应视为严重犯规并出示红牌罚令出场。VAR介入正确。裁判员在进行在场回看后向上海申花4号出示黄牌的决定错误，漏判红牌。","v":"wrong","videos":["2025/i01c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250227/1740620528802847.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2025-2","t":"case","s":"2025","issue":1,"no":2,"seq":2,"comp":"中超联赛","round":"第一轮","home":"山东泰山","away":"河南俱乐部","minute":"20","desc":"判例二：中超联赛第一轮，山东泰山vs河南俱乐部酒祖杜康，比赛第20分钟，山东泰山14号守门员出击至本方罚球区外，踢到河南俱乐部30号队员，裁判员先掌握有利，之后在比赛停止时向山东泰山14号守门员出示黄牌警告。VAR介入，裁判员经在场回看后，取消黄牌，并出示红牌将山东泰山14号守门员罚令出场。","appeal":"","concl":"对于此判例，评议组多数成员认为：山东泰山14号守门员出击至本方罚球区外，抬腿试图踢球未果，脚踢到河南俱乐部30号队员肋部，速度较快，冲击力较大，未采取预防措施，危及对方队员安全，应视为严重犯规并出示红牌。VAR介入正确，裁判员在场回看后向山东泰山14号守门员出示红牌罚令出场的最终决定正确。","v":"correct","videos":["2025/i01c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250227/1740620600481333.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"red"}},{"k":"2025-3","t":"case","s":"2025","issue":2,"no":1,"seq":3,"comp":"中超联赛","round":"第2轮","home":"上海申花","away":"北京国安","minute":"89","desc":"判例一：中超联赛第2轮，上海申花VS北京国安，比赛第89分钟，北京国安9号队员在对方罚球区内与上海申花32号队员争抢球后倒地，裁判员未判罚犯规，VAR未介入。","appeal":"","concl":"对于此判例，评议组多数成员认为：上海申花32号以争抢球为目的，并且率先触球解围，动作合理，由于触球点在空中，触球后因惯性与北京国安9号腿部发生接触，属于不可避免的意外接触，接触后立即收腿避免造成伤害。上海申花32号不构成犯规，裁判员决定正确，VAR未介入正确。","v":"correct","videos":["2025/i02c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250305/1741180321578914.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-4","t":"case","s":"2025","issue":2,"no":2,"seq":4,"comp":"中超联赛","round":"第2轮","home":"成都蓉城","away":"天津津门虎","minute":"","desc":"判例二：中超联赛第2轮，成都蓉城VS天津津门虎，比赛第45+3分钟，成都蓉城8号队员在争抢球时疑似踩踏天津津门虎8号队员，裁判员未判罚犯规，VAR介入，裁判员经在场回看后，判罚成都蓉城8号队员严重犯规，并向其出示红牌罚令出场。","appeal":"","concl":"对于此判例，评议组多数成员认为：成都蓉城8号以争抢球为目的，且有触球机会，因动作晚到而踩踏到对方队员，难以预见和躲避，有屈膝避免造成进一步伤害的动作，该犯规未达到使用过分力量或野蛮方式的程度，不构成严重犯规，不应出示红牌。应以鲁莽犯规为由，向成都蓉城8号出示黄牌。VAR介入错误，裁判员在场回看后向成都蓉城8号出示红牌罚令出场的决定错误。","v":"wrong","videos":["2025/i02c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250305/1741180359524515.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"yellow"}},{"k":"2025-5","t":"case","s":"2025","issue":2,"no":3,"seq":5,"comp":"中超联赛","round":"第2轮","home":"成都蓉城","away":"天津津门虎","minute":"84","desc":"判例三：中超联赛第2轮，成都蓉城VS天津津门虎，比赛第84分钟，天津津门虎4号队员在争抢球时疑似踩踏成都蓉城47号队员，裁判员判罚天津津门虎4号犯规，未出示红黄牌，VAR未介入。","appeal":"","concl":"对于此判例，评议组多数成员认为：双方队员跑动过程中都有争抢球的机会，成都蓉城47号抬腿动作不合理，超出了护球动作的范畴，造成了双方的接触。天津津门虎4号在向球跑动争抢过程中无犯规动作。双方身体接触失去平衡后，成都蓉城47号先倒地，天津津门虎4号试图踢球，双方腿部接触，倒地过程中踩到成都蓉城47号，属于意外接触，也无多余力量或动作。双方均不犯规。VAR未介入正确，裁判员判天津津门虎4号犯规的决定错误。","v":"wrong","videos":["2025/i02c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250305/1741180389292363.mp4"],"cat":"freekick_foul","catname":"罚球区外一般犯规","ans":{"r":"playon","c":"none"}},{"k":"2025-6","t":"case","s":"2025","issue":3,"no":1,"seq":6,"comp":"中甲联赛","round":"第1轮","home":"南通支云","away":"上海嘉定汇龙","minute":"84","desc":"判例一：中甲联赛第1轮，南通支云VS上海嘉定汇龙，比赛第84分钟，南通支云33号队员疑似在本方罚球区内手臂触球，裁判员未判罚手球犯规。","appeal":"","concl":"对于此判例，评议组一致认为：南通支云33号队员手臂触球，其手臂抬起并处于使身体不自然变大的位置，应判罚其手球犯规，并判罚球点球。裁判员临场决定错误，漏判手球犯规和罚球点球。","v":"wrong","videos":["2025/i03c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250319/1742376510181562.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2025-7","t":"case","s":"2025","issue":3,"no":2,"seq":7,"comp":"中甲联赛","round":"第1轮","home":"深圳青年人","away":"佛山南狮","minute":"26","desc":"判例二：中甲联赛第1轮，深圳青年人VS佛山南狮，比赛第26分钟，佛山南狮10号队员带球进入深圳青年人罚球区后疑似被对方队员绊倒，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：佛山南狮10号带球向内变向，视频中未明确显示深圳青年人17号有犯规动作。双方即使有轻微接触，接触后佛山南狮10号仍可控制身体重心并控球，裁判员临场作出的深圳青年人17号不犯规的决定正确。","v":"correct","videos":["2025/i03c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250319/1742376590142595.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2025-8","t":"case","s":"2025","issue":3,"no":3,"seq":8,"comp":"中甲联赛","round":"第1轮","home":"深圳青年人","away":"佛山南狮","minute":"27","desc":"判例三：中甲联赛第1轮，深圳青年人VS佛山南狮，比赛第27分钟，佛山南狮队17号队员接本方开出的角球将球顶进对方球门。裁判判罚攻方犯规在先，进球无效。","appeal":"","concl":"对于此判例，评议组一致认为：佛山南狮26号队员在争抢位置过程中，拉扯对方防守队员，使其无法移动或争抢球，应视为犯规，裁判员在佛山南狮17号头球攻门前已经判罚犯规并鸣哨停止比赛。裁判员判攻方佛山南狮26号犯规在先、17号进球无效的决定正确。","v":"correct","videos":["2025/i03c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250319/1742376630574014.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_invalid","c":"none"}},{"k":"2025-9","t":"case","s":"2025","issue":3,"no":4,"seq":9,"comp":"中甲联赛","round":"第1轮","home":"深圳青年人","away":"佛山南狮","minute":"50","desc":"判例四：中甲联赛第1轮，深圳青年人VS佛山南狮，比赛第50分钟，佛山南狮队从右路发起进攻并传中，佛山南狮26号队员在对方罚球区内倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：深圳青年人26号防守队员对佛山南狮26号两次实施拉扯，第一次并未明显影响后者的移动和争抢球，但第二次深圳青年人26号不以争抢球为目的，对佛山南狮26号实施拉扯并将身体挂靠在后者身上，使后者无法争抢球，破坏了佛山南狮26号明显的进球得分机会。应判深圳青年人26号犯规，罚球点球，并出示红牌罚令出场。裁判员临场决定错误，漏判罚球点球和红牌。","v":"wrong","videos":["2025/i03c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250319/1742376679275488.mp4"],"cat":"dogso","catname":"破坏明显进球得分机会（DOGSO）","ans":{"r":"penalty","c":"red"}},{"k":"2025-10","t":"case","s":"2025","issue":3,"no":5,"seq":10,"comp":"中甲联赛","round":"第1轮","home":"南京城市","away":"大连鲲城","minute":"13","desc":"判例五：中甲联赛第1轮，南京城市VS大连鲲城，比赛第13分钟，大连鲲城26号队员在争抢时对南京城市38号队员犯规，裁判员判罚直接任意球并出示黄牌警告大连鲲城26号。","appeal":"","concl":"对于此判例，评议组多数成员认为：大连鲲城26号在球已离开自身控制范围的情况下，使用腾空飞铲的争抢动作，左腿争抢球的同时，右腿鞋钉朝向对方队员蹬踹，冲撞速度较快，力量较大，已构成危及对方队员安全的严重犯规，应出示红牌将大连鲲城26号罚令出场。裁判员临场出示黄牌的决定错误，漏判红牌。","v":"wrong","videos":["2025/i03c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250319/1742376719746463.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2025-11","t":"case","s":"2025","issue":3,"no":6,"seq":11,"comp":"中甲联赛","round":"第1轮","home":"南京城市","away":"大连鲲城","minute":"55","desc":"判例六：中甲联赛第1轮，南京城市-大连鲲城，比赛第55分钟，大连鲲城39号队员疑似在本方罚球区内手臂触球，裁判员未判罚手球犯规。","appeal":"","concl":"对于此判例，评议组一致认为：南京城市队射门后，球接触了大连鲲城39号手臂，其手臂处于此情形下合理和自然的位置，不应视为手球犯规，裁判员临场决定正确。","v":"correct","videos":["2025/i03c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250319/1742376753640236.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2025-12","t":"case","s":"2025","issue":3,"no":7,"seq":12,"comp":"女超联赛","round":"第2轮","home":"永川茶山竹海橙狮女足","away":"山东体彩女足","minute":"60","desc":"判例七：女超联赛第2轮，永川茶山竹海澄狮女足VS山东体彩女足，比赛第60分钟，永川茶山竹海澄狮女足11号队员在对方罚球区内接队友传球，与对方队员身体接触后倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：永川茶山竹海澄狮女足11号在接队友传球后，试图继续控球，山东体彩女足32号防守时对其实施绊摔，应视为草率犯规，判罚山东体彩女足32号犯规并判罚球点球。裁判员临场决定错误，漏判罚球点球。","v":"wrong","videos":["2025/i03c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20250319/1742376783563200.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2025-13","t":"case","s":"2025","issue":3,"no":8,"seq":13,"comp":"女超联赛","round":"第3轮","home":"广东
