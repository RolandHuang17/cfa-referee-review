88752957927.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-72","t":"case","s":"2024","issue":11,"no":3,"seq":72,"comp":"中甲联赛","round":"第14轮","home":"石家庄功夫","away":"上海嘉定汇龙","minute":"86","desc":"判例三：中甲联赛第14轮，石家庄功夫VS上海嘉定汇龙，比赛第86分钟，石家庄功夫11号队员在对方罚球区内倒地，裁判员临场未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：双方队员在上海嘉定汇龙队罚球区内的接触，属于比赛中的正常身体对抗，不构成犯规。裁判员临场未判罚犯规的决定正确。","v":"correct","videos":["2024/i11c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240619/1718788770711663.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-73","t":"case","s":"2024","issue":11,"no":4,"seq":73,"comp":"中甲联赛","round":"第14轮","home":"延边龙鼎","away":"广州俱乐部","minute":"9","desc":"判例四：中甲联赛第14轮，延边龙鼎VS广州俱乐部，比赛第9分钟，延边龙鼎2号队员在对方罚球区内倒地。裁判员临场判守方犯规和罚球点球。","appeal":"","concl":"对于此判例，评议组一致认为：延边龙鼎2号主动摔倒的动作属于明显而典型的佯装（假摔），应判延边龙鼎2号违规（佯装），并对其出示黄牌警告，裁判员临场判守方犯规和罚球点球的决定错误。","v":"wrong","videos":["2024/i11c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240619/1718788786872933.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"indirectfk","c":"yellow"}},{"k":"2024-74","t":"case","s":"2024","issue":11,"no":5,"seq":74,"comp":"中甲联赛","round":"第14轮","home":"延边龙鼎","away":"广州俱乐部","minute":"57","desc":"判例五：中甲联赛第14轮，延边龙鼎VS广州俱乐部，比赛第57分钟，广州俱乐部14号队员在对方罚球区内倒地。裁判员临场未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：延边龙鼎防守队员在争抢时使用单臂，从近侧接触广州俱乐部14号身体，根据其动作方式、力度，以及对对方造成的影响，按照本年度统一判罚尺度要求，不构成犯规。裁判员临场未判罚犯规的决定正确。","v":"correct","videos":["2024/i11c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240619/1718788801621591.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-75","t":"case","s":"2024","issue":11,"no":6,"seq":75,"comp":"中乙联赛","round":"第12轮","home":"泰安天贶","away":"廊坊荣耀之城","minute":"45","desc":"判例六：中乙联赛第12轮，泰安天贶VS廊坊荣耀之城，比赛第45分钟，廊坊荣耀之城21号队员进攻前插至对方罚球区内，泰安天贶2号队员倒地铲球，廊坊荣耀之城21号倒地，裁判判罚临场未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：现有视频无法清晰展现守方队员铲球时触球的情况，裁判员临场的观察角度良好，未判罚犯规的决定应予支持。","v":"correct","videos":["2024/i11c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240619/1718788818797202.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-76","t":"case","s":"2024","issue":11,"no":7,"seq":76,"comp":"中乙联赛","round":"第12轮","home":"泰安天贶","away":"廊坊荣耀之城","minute":"50","desc":"判例七：中乙联赛第12轮，泰安天贶VS廊坊荣耀之城，比赛第50分钟，廊坊荣耀之城2号队员在本方罚球区内疑似手球，裁判员判罚其手球犯规并判罚球点球。","appeal":"","concl":"对于此判例，评议组多数成员认为：现有视频无法清晰展现廊坊荣耀之城2号身体与球的接触，以及失去重心后后续与球接触的全过程，裁判员临场的位置和观察角度更好，做出的手球犯规和罚球点球的决定应予支持。","v":"correct","videos":["2024/i11c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240619/1718788839381243.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2024-77","t":"case","s":"2024","issue":11,"no":8,"seq":77,"comp":"中乙联赛","round":"第12轮","home":"泰安天贶","away":"廊坊荣耀之城","minute":"87","desc":"判例八：中乙联赛第12轮，泰安天贶VS廊坊荣耀之城，比赛第87分钟，泰安天贶49号队员在球门线外疑似蹬踹廊坊荣耀之城7号队员，裁判临场未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：视频无法展现当时场上的比赛气氛，以及双方队员的相互动作性质，从总体情况以及廊坊荣耀之城7号的反应来看，泰安天贶49号的行为不属于暴力行为，如果裁判员认为双方不存在明显的对立情绪和相互挑衅行为，则临场未判罚犯规的决定应予支持。","v":"correct","videos":["2024/i11c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240619/1718788865531898.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"playon","c":"none"}},{"k":"2024-78","t":"case","s":"2024","issue":12,"no":1,"seq":78,"comp":"中超联赛","round":"第7轮","home":"梅州客家","away":"上海海港","minute":"54","desc":"判例一：中超联赛第7轮补赛，梅州客家VS上海海港，比赛第54分钟，上海海港18号队员进球，进球前其手臂疑似与球有接触。裁判员临场判罚进球有效，VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：从可供VAR查看的相关视频画面看，无法准确证明上海海港18号在进球得分前，其手臂与球是否有接触。在评议过程中，评议组查看评议了来自其他渠道和角度拍摄的慢速回放视频，确定了上海海港18号在进球得分前手臂与球有接触的客观事实。由于该队员手臂触球后立即进球得分，按照规则应判罚其手球犯规，进球无效。裁判员临场判进球有效的决定错误。另由于上述情况，VAR在无法看到可以清晰证明海港队员手臂与球接触的画面的情况下，未介入，不应视为错误。","v":"wrong","videos":["2024/i12c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240703/1720006997677339.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"goal_invalid","c":"none"}},{"k":"2024-79","t":"case","s":"2024","issue":12,"no":2,"seq":79,"comp":"中超联赛","round":"第7轮","home":"梅州客家","away":"上海海港","minute":"67","desc":"判例二：中超联赛第7轮补赛，梅州客家VS上海海港，比赛第67分钟，上海海港3号队员与梅州客家15号队员在争抢位置时发生身体接触，随后上海海港7号队员进球。裁判员临场判罚进球有效，VAR未介入。","appeal":"","concl":"对于此判例，评议组多数成员认为：在进球前，上海海港3号在与对方队员争抢位置时拉扯犯规，犯规行为影响和限制了对方队员的行动，应判其犯规在先，随后7号队员的进球无效。裁判员临场判进球有效的决定错误，VAR未介入错误。","v":"wrong","videos":["2024/i12c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240703/1720007013597508.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_invalid","c":"none"}},{"k":"2024-80","t":"case","s":"2024","issue":12,"no":3,"seq":80,"comp":"中超联赛","round":"第16轮","home":"武汉三镇","away":"上海海港","minute":"29","desc":"判例三：中超联赛第16轮，武汉三镇VS上海海港，比赛第29分钟，上海海港19号队员防守武汉三镇11号队员时，双方发生身体接触后倒地。裁判员临场未判罚犯规，VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：上海海港19号正面踢人犯规，其动作未顾及到可能对对方造成的危险，从接触的力度、部位等因素看，属于鲁莽犯规，应判罚直接任意球并出示黄牌警告。裁判员临场决定错误，漏判犯规和黄牌。另外，该犯规不属于使用过分力量的严重犯规，不应出示红牌，VAR未介入正确。","v":"wrong","videos":["2024/i12c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240703/1720007027967682.mp4"],"cat":"freekick_foul","catname":"罚球区外一般犯规","ans":{"r":"directfk","c":"yellow"}},{"k":"2024-81","t":"case","s":"2024","issue":12,"no":4,"seq":81,"comp":"中甲联赛","round":"第15轮","home":"广西平果","away":"重庆铜梁龙","minute":"","desc":"判例四：中甲联赛第15轮，广西平果哈嘹VS重庆铜梁龙，比赛第90+5分钟，重庆铜梁龙队进球，裁判员临场判进球有效。","appeal":"","concl":"对于此判例，评议组一致认为：重庆铜梁龙31号在同队16号传中触球时，处于越位位置，并随后参与头球争抢，应判其越位犯规，随后的进球应判为无效。第一助理裁判员漏判越位犯规，裁判员临场判进球有效的决定错误。","v":"wrong","videos":["2024/i12c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240703/1720007049873283.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2024-82","t":"case","s":"2024","issue":12,"no":5,"seq":82,"comp":"中甲联赛","round":"第15轮","home":"苏州东吴","away":"石家庄功夫","minute":"7","desc":"判例五：中甲联赛第15轮，苏州东吴VS石家庄功夫，比赛第7分钟，石家庄功夫8号队员在对方罚球区内与守方队员出现身体接触后倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：从现有视频来看，守方队员手臂与对方队员的接触，不足以造成对方倒地，裁判员临场观察位置好，做出的不犯规的决定应予以尊重和支持。","v":"correct","videos":["2024/i12c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240703/1720007062468372.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-83","t":"case","s":"2024","issue":12,"no":6,"seq":83,"comp":"中甲联赛","round":"第15轮","home":"苏州东吴","away":"石家庄功夫","minute":"","desc":"判例六：中甲联赛第15轮，苏州东吴VS石家庄功夫，比赛第90+9分钟，石家庄功夫9号队员在对方罚球区内与守方队员出现身体接触后倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：苏州东吴2号在防守对方9号时有拉扯动作，但没有明显限制对方的行动和完成射门动作。裁判员临场做出的不犯规的决定应予以支持。","v":"correct","videos":["2024/i12c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240703/1720007077154685.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-84","t":"case","s":"2024","issue":12,"no":7,"seq":84,"comp":"中乙联赛","round":"第14轮","home":"日照宇启","away":"大连鲲城","minute":"","desc":"判例七：中乙联赛第14轮日照宇启VS大连鲲城，比赛第90+8分钟，大连鲲城队准备踢前场的直接任意球时，日照宇启华信28号队员与大连鲲城2号队员争抢有利位置发生接触，经第二助理裁判员协助，裁判员以暴力行为为由，出示红牌将大连鲲城2号罚令出场。","appeal":"","concl":"对于此判例，评议组一致认为：大连鲲城2号在比赛停止状态下，争抢位置时故意踢对方队员，性质上属于暴力行为，裁判员临场未看到该行为，在助理裁判员提示后对大连鲲城2号出示红牌罚令出场的最终决定正确。","v":"correct","videos":["2024/i12c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240703/1720007095396467.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"red"}},{"k":"2024-85","t":"case","s":"2024","issue":12,"no":8,"seq":85,"comp":"中乙联赛","round":"第14轮","home":"湖南湘涛","away":"江西黑马青年","minute":"90","desc":"判例八：中乙联赛第14轮，湖南湘涛VS江西黑马青年，比赛第90分钟，江西黑马青年2号队员带球至对方罚球区内，湖南湘涛16号对其防守，江西黑马青年2号倒地，裁判员临场未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：双方身体接触主要是由于江西黑马青年2号队员向内侧变线到对方跑动路线导致的双方腿部接触，属于双方正常的身体接触。不应视为守方犯规。裁判员临场做出的不犯规的决定正确。","v":"correct","videos":["2024/i12c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240703/1720007108609677.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-86","t":"case","s":"2024","issue":12,"no":9,"seq":86,"comp":"中乙联赛","round":"第14轮","home":"泉州亚新","away":"广西恒宸","minute":"87","desc":"判例九：中乙联赛第14轮，泉州亚新VS广西恒宸，比赛第87分钟，广西恒宸11号队员在比赛停止时疑似用头撞击对方队员，裁判员以暴力行为为由，出示红牌将广西恒宸11号罚令出场。","appeal":"","concl":"对于此判例，评议组一致认为：广西恒宸11号用头部故意撞击对方队员面部，力度不可忽略，性质上属于暴力行为，裁判员出示红牌将其罚令出场的决定正确。","v":"correct","videos":["2024/i12c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240703/1720007125151420.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"red"}},{"k":"2024-87","t":"case","s":"2024","issue":12,"no":10,"seq":87,"comp":"中乙联赛","round":"第14轮","home":"赣州瑞狮","away":"上海海港B队","minute":"32","desc":"判例十：中乙联赛第14轮，赣州瑞狮VS上海海港B队，比赛第32分钟，赣州瑞狮10号队员在对方罚球区内射门，上海海港B队60号队员试图阻挡射门，球疑似与其手臂有接触，裁判员临场未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：上海上港B队60号手臂触球，并且手臂位置使身体不自然扩大，应被判罚手球犯规和罚球点球。同时，按照本场比赛进行时中乙联赛执行的竞赛规则版本，手球犯规阻挡了对方射向球门的球，应以阻止了对方有希望的进攻为由，予以黄牌警告。临场裁判员决定错误，漏判手球犯规、罚球点球和黄牌。","v":"wrong","videos":["2024/i12c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240703/1720007138204641.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"yellow"}},{"k":"2024-88","t":"case","s":"2024","issue":12,"no":11,"seq":88,"comp":"女超联赛","round":"第12轮","home":"江苏无锡女足","away":"永川茶山竹海橙狮女足","minute":"63","desc":"判例十一：女超联赛第12轮，江苏无锡女足VS永川茶山竹海橙狮女足，比赛第63分钟，永川女足11号队员前场抢断，随后江苏无锡女足5号队员对其进行防守时，双方发生身体接触，重庆女足11号倒地。裁判员判罚直接任意球，并在与助理裁判员及第四官员沟通后，出示红牌将江苏无锡女足21号队员罚令出场。","appeal":"","concl":"对于此判例，首先评议组一致认定：犯规队员应为江苏无锡女足5号，裁判员对江苏无锡女足21号实施纪律处罚，处罚对象错误，经与助理裁判及第四官员沟通后也未能识别正确的处罚对象。另外，对于江苏无锡女足5号的犯规应给予的纪律处罚，评议组成员意见存在分歧。多数成员认为，实施犯规时，江苏无锡女足27号队员已经高速回防，在距离球门较远的情况下，后续存在对攻方队员形成有效防守或干扰的可能性，不完全符合破坏明显进球得分机会的判定标准（此情形下应出示红牌），应以阻止对方有希望的进攻为由，黄牌警告江苏无锡女足5号队员。裁判员出示红牌罚令出场的决定错误。","v":"wrong","videos":["2024/i12c11-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240703/1720007154475312.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"yellow"}},{"k":"2024-89","t":"case","s":"2024","issue":13,"no":1,"seq":89,"comp":"中超联赛","round":"第18轮","home":"天津津门虎","away":"长春亚泰","minute":"81","desc":"判例一：中超联赛第18轮，天津津门虎VS长春亚泰，比赛第81分钟，长春亚泰9号队员进球前与天津津门虎5号队员有身体接触。裁判员临场判罚进球有效，VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：从现有视频看，天津津门虎5号防守队员有拉扯长春亚泰9号进攻队员的动作，后者手部与前者的接触不构成犯规，也不是造成前者倒地的主要原因，裁判员临场做出的不犯规的决定正确，应予支持。","v":"correct","videos":["2024/i13c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240710/1720621877188327.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"goal_valid","c":"none"}},{"k":"2024-90","t":"case","s":"2024","issue":13,"no":2,"seq":90,"comp":"中乙联赛","round":"第15轮","home":"湖北青年星","away":"大连鲲城","minute":"","desc":"判例二：中乙联赛第15轮，湖北青年星VS大连鲲城，比赛第90+7分钟，湖北青年星队在前场踢任意球，之后经一系列发展，湖北青年星41号队员传中，随后湖北青年星70号队员射门，球疑似和大连鲲城23号队员手臂有接触，裁判员临场未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：湖北青年星70号射门时，大连鲲城23号手臂触球的动作本身应视为手球犯规。但结合不同角度的视频分析，在此之前，当湖北青年星队踢任意球时，其41号队员处于越位位置，随后与对方队员争抢球，属于在越位位置干扰对方的越位犯规。故此判例最终应认定为湖北青年星41号越位犯规在先，裁判组临场漏判攻方越位犯规。","v":"wrong","videos":["2024/i13c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240710/1720621973364123.mp4"],"cat":"offside","catname":"越位","ans":{"r":"indirectfk","c":"none"}},{"k":"2024-91","t":"case","s":"2024","issue":13,"no":3,"seq":91,"comp":"中乙联赛","round":"第15轮","home":"西安崇德荣海","away":"日照宇启","minute":"4","desc":"判例三：中乙联赛第15轮，西安崇德荣海VS日照宇启，比赛第4分钟，日照宇启33号队员在与西安崇德荣海7号队员争抢高空球后，西安崇德荣海7号手臂疑似接触对方队员面部或颈部，裁判员临场未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：西安崇德荣海7号在试图护球的转身动作中，手臂触及对方队员，后续没有明显的发力或击打动作，属于比赛中可以接受的身体接触。裁判员临场未判罚犯规的决定正确。","v":"correct","videos":["2024/i13c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240710/1720622018840858.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"playon","c":"none"}},{"k":"2024-92","t":"case","s":"2024","issue":13,"no":4,"seq":92,"comp":"中国足协杯","round":"","home":"北京雨虹修缮女足","away":"青岛西海岸女足","minute":"37","desc":"判例四：2024中国足协杯赛（女子）第一阶段，北京雨虹修缮女足vs青岛西海岸女足，比赛第37分钟，青岛西海岸女足在对方罚球区内传中，北京雨虹修缮女足防守队员疑似手球，裁判员临场未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：尽管现有视频不够清晰，但仍可判断出北京雨虹修缮女足防守队员在本方罚球区内拦截对方的传中球时，手臂张开，使身体不自然扩大，手臂与球有接触，应判罚北京雨虹修缮女足防守队员手球犯规，并判罚球点球。裁判员临场决定错误，漏判手球犯规和罚球点球。","v":"wrong","videos":["2024/i13c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240710/1720622048642643.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2024-93","t":"case","s":"2024","issue":14,"no":1,"seq":93,"comp":"中甲联赛","round":"第17轮","home":"大连英博","away":"苏州东吴","minute":"69","desc":"判例一：中甲联赛第17轮，大连英博VS苏州东吴，比赛第69分钟，苏州东吴射门，球击中罚球区内的大连英博防守队员。裁判员示意比赛继续。","appeal":"","concl":"对于此判例，评议组一致认为：从现有视频判断，球未触及大连英博防守队员手臂，裁判员临场做出的不是手球犯规的决定，应予支持。","v":"correct","videos":["2024/i14c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240717/1721212281738821.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2024-94","t":"case","s":"2024","issue":14,"no":2,"seq":94,"comp":"中甲联赛","round":"第17轮","home":"黑龙江冰城","away":"重庆铜梁龙","minute":"26","desc":"判例二：中甲联赛第17轮，黑龙江冰城VS重庆铜梁龙，比赛第26分钟，重庆铜梁龙守门员在本方罚球区外手球，裁判员判罚其手球犯规、直接任意球，并出示黄牌。","appeal":"","concl":"对于此判例，评议组多数成员认为：重庆铜梁龙守门员在本方罚球区外手球犯规，但从黑龙江冰城队员射门使用的动作、球速以及防守队员后续可能对球的阻止等因素来看，不应对重庆铜梁龙守门员的动作视为破坏一个明显的进球（红牌），而应以通过手球干扰或阻止对方有希望的进攻为由，对重庆铜梁龙守门员出示黄牌。裁判员临场做出的手球犯规、直接任意球和黄牌的决定正确。","v":"correct","videos":["2024/i14c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240717/1721212333198748.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"directfk","c":"yellow"}},{"k":"2024-95","t":"case","s":"2024","issue":14,"no":3,"seq":95,"comp":"中乙联赛","round":"第16轮","home":"北京理工","away":"泰安天贶","minute":"54","desc":"判例三：中乙联赛第16轮，北京理工VS泰安天贶，比赛第54分钟，北京理工60号队员倒地时，泰安天贶11号队员疑似踢北京理工60号小腿，裁判员判北京理工60号危险方式比赛（双腿夹球），由泰安天贶踢间接任意球，同时向泰安天贶11号出示黄牌警告。","appeal":"","concl":"对于此判例，评议组一致认为：北京理工60号试图护球，动作因倒地受到一定影响，尚未形成双腿夹球的危险比赛方式，不应视为违规。同时评议组多数成员认为：泰安天贶11号使用过分力量，并带有恶意踢对方倒地队员腿部，该行为几乎与裁判员停止比赛的哨音同时做出，应视为严重犯规并对其出示红牌罚令出场，由北京理工踢直接任意球恢复比赛。裁判员临场判罚北京理工60号以危险方式比赛、由泰安天贶踢间接任意球，以及向泰安天贶11号出示黄牌的决定均为错误。","v":"wrong","videos":["2024/i14c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240717/1721212383691193.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2024-96","t":"case","s":"2024","issue":14,"no":4,"seq":96,"comp":"中乙联赛","round":"第16轮","home":"湖南湘涛","away":"海口名城","minute":"31","desc":"判例四：中乙联赛第16轮，湖南湘涛VS海口名城，比赛第31分钟，海口名城60号队员在回追防守时将湖南湘涛2号队员铲倒，裁判员判海口名城60号铲球犯规并出示黄牌，湖南湘涛踢直接任意球，同时以非体育行为对湖南湘涛2号出示黄牌警告。","appeal":"","concl":"对于此判例，评议组一致认为：海口名城60号铲球属于鲁莽犯规，应对其出示黄牌，不属于严重犯规（红牌）。随后湖南湘涛2号有违规行为，支持裁判员临场判罚。因此，裁判员临场判罚海口名城60号犯规并出示黄牌、由湖南湘涛踢直接任意球恢复比赛，以及以非体育行为对湖南湘涛2号出示黄牌的决定均为正确。","v":"correct","videos":["2024/i14c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240717/1721212429790505.mp4"],"cat":"freekick_foul","catname":"罚球区外一般犯规","ans":{"r":"directfk","c":"yellow"}},{"k":"2024-97","t":"case","s":"2024","issue":14,"no":5,"seq":97,"comp":"中乙联赛","round":"第16轮","home":"湖南湘涛","away":"海口名城","minute":"36","desc":"判例五：中乙联赛第16轮，湖南湘涛VS海口名城，比赛第36分钟，海口名城20号队员在本方罚球区内与湖南湘涛22号队员发生身体接触，湖南湘涛22号倒地，裁判员未判罚犯规，随后湖南湘涛53号对海口名城20号铲球犯规，裁判员判湖南湘涛53号犯规并出示黄牌警告。","appeal":"","concl":"对于此判例，评议组多数成员认为：湖南湘涛队将球传中至对方罚球区内，湖南湘涛22号试图接球并先触到球，海口名城20号跨步动作形成了绊摔对方的犯规，应判罚海口名城20号犯规，并判罚球点球。另外，评议组一致认为，在裁判员临场未判罚球点球的情况下，随后湖南湘涛53号的铲球动作属于鲁莽犯规，应出示黄牌警告。按照事件发生的先后顺序，此判例应认定为裁判员漏判海口名城20号在本方罚球区内犯规，漏判罚球点球。","v":"wrong","videos":["2024/i14c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240717/1721212455676910.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"yellow"}},{"k":"2024-98","t":"case","s":"2024","issue":14,"no":6,"seq":98,"comp":"中乙联赛","round":"第16轮","home":"大连鲲城","away":"海门珂缔缘","minute":"5","desc":"判例六：中乙联赛第16轮，大连鲲城VS海门珂缔缘，比赛第5分钟，大连鲲城进攻将球传至对方罚球区内，海门珂缔缘2号队员与大连鲲城21号队员有身体接触，裁判员判海门珂缔缘2号犯规，并判罚球点球。","appeal":"","concl":"对于此判例，评议组首先一致认为，球传至海门珂缔缘罚球区内后，双方的第一次争抢接触属于比赛中可接受的争抢动作，双方均不犯规。从现有视频推断，守方海门珂缔缘队员触到了球，因此处在越位位置的大连鲲城21号不存在越位犯规。同时评议组多数成员认为：海门珂缔缘2号对大连鲲城21号存在拉拽动作，但并不是后者倒地的主要原因，不应视为犯规，大连鲲城21号也有借对方拉拽主动倒地的成分。裁判员临场判罚海门珂缔缘2号犯规并判罚球点球的决定错误。","v":"wrong","videos":["2024/i14c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240717/1721212496871012.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-99","t":"case","s":"2024","issue":14,"no":7,"seq":99,"comp":"中乙联赛","round":"第16轮","home":"大连鲲城","away":"海门珂缔缘","minute":"72","desc":"判例七：中乙联赛第16轮，大连鲲城VS海门珂缔缘，比赛第72分钟，海门珂缔缘29号队员传中时，球与大连鲲城18号队员有接触，经第一助理裁判员协助后，裁判员判大连鲲城18号手球犯规，并认为犯规地点在罚球区外，故判罚直接任意球。","appeal":"","concl":"对于此判例，评议组首先一致认为，球与大连鲲城18号手臂接触，且接触点处于大连鲲城罚球区内，但评议组多数成员认为：大连鲲城18号手臂动作是跟随身体而动的正当结果，处于合理位置，且有躲避与球接触的动作，不应视为手球犯规。裁判员临场判罚手球犯规错误，接触地点判断错误。","v":"wrong","videos":["2024/i14c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240717/1721212545616825.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2024-100","t":"case","s":"2024","issue":14,"no":8,"seq":100,"comp":"中乙联赛","round":"第16轮","home":"大连鲲城","away":"海门珂缔缘","minute":"86","desc":"判例八：中乙联赛第16轮，大连鲲城VS海门珂缔缘，比赛第86分钟，海门珂缔缘连续射门，球击中球门横梁反弹后，海门珂缔缘17号队员在对方罚球区内与大连鲲城6号队员有身体接触，海门珂缔缘17号倒地，裁判员判攻方海门珂缔缘17号犯规，由守方大连鲲城踢直接任意球。","appeal":"","concl":"对于此判例，评议组一致认为：球从球门横梁反弹后，大连鲲城6号先触球并试图控球，其动作不存在犯规。海门珂缔缘17号上前争抢并未触到球，双方发生接触，临场裁判员观察位置较好，做出的犯规判罚应予支持。因此，裁判员临场做出的守方不犯规、攻方犯规的决定正确。","v":"correct","videos":["2024/i14c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240717/1721212577757863.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-101","t":"case","s":"2024","issue":15,"no":1,"seq":101,"comp":"中甲联赛","round":"第18轮","home":"延边龙鼎","away":"南京城市","minute":"61","desc":"判例一：中甲联赛第18轮，延边龙鼎VS南京城市，比赛第61分钟，南京城市17号队员在对方罚球区内与延边龙鼎37号队员争抢球后倒地。裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：延边龙鼎37号在防守中踢倒南京城市17号，属于草率的犯规，犯规接触点发生在延边龙鼎罚球区内，应判守方犯规和罚球点球。裁判员临场漏判罚球点球。","v":"wrong","videos":["2024/i15c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240725/1721880818777355.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2024-102","t":"case","s":"2024","issue":15,"no":2,"seq":102,"comp":"中甲联赛","round":"第18轮","home":"广西平果","away":"大连英博","minute":"82","desc":"判例二：中甲联赛第18轮，广西平果哈嘹VS大连英博，比赛第82分钟，广西平果哈嘹33号队员在与大连英博40号队员争抢球后倒地。裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：大连英博40号故意使用手臂击打广西平果哈嘹33号面部，其手臂动作不属于为完成争抢球而做出的正常动作，应判大连英博40号暴力行为，并出示红牌罚令出场，裁判员临场漏判直接任意球和红牌。","v":"wrong","videos":["2024/i15c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240725/1721880847876358.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"red"}},{"k":"2024-103","t":"case","s":"2024","issue":15,"no":3,"seq":103,"comp":"中甲联赛","round":"第18轮","home":"石家庄功夫","away":"江西庐山","minute":"24","desc":"判例三：中甲联赛第18轮，石家庄功夫VS江西庐山，比赛第24分钟，石家庄功夫28号队员在对方罚球区内倒地。裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：江西庐山守门员出击动作不构成犯规，裁判员临场未判罚球点球的决定正确。另外评议组多数成员认为，石家庄功夫28号队员主动发起接触，佯装被犯规，应判其佯装（假摔）并出示黄牌警告，由江西庐山踢间接任意球恢复比赛。","v":"correct","videos":["2024/i15c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240725/1721880873760125.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"indirectfk","c":"yellow"}},{"k":"2024-104","t":"case","s":"2024","issue":15,"no":4,"seq":104,"comp":"中甲联赛","round":"第18轮","home":"重庆铜梁龙","away":"青岛红狮","minute":"64","desc":"判例四：中甲联赛第18轮，重庆铜梁龙VS青岛红狮，比赛第64分钟，重庆铜梁龙29号队员进球。裁判员判进球有效。","appeal":"","concl":"对于此判例，评议组多数成员认为：从与越位线近似齐平的镜头画面看，重庆铜梁龙队员在对方球门区附近传球时，触球瞬间球的位置被其他队员遮挡，无绝对证据证明重庆铜梁龙29号队员和24号队员是否处于越位位置（是否较球及对方倒数第二名队员都更接近对方球门线），但从视频可基本判断出29号不处于越位位置，24号处于越位位置。而后续重庆铜梁龙24号的行为，不构成干扰对方队员的越位犯规。因此裁判员临场判进球有效的决定正确。","v":"correct","videos":["2024/i15c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240725/1721880900268040.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2024-105","t":"case","s":"2024","issue":15,"no":5,"seq":105,"comp":"中甲联赛","round":"第18轮","home":"苏州东吴","away":"无锡吴钩","minute":"35","desc":"判例五：中甲联赛第18轮，苏州东吴VS无锡吴钩，比赛第35分钟，无锡吴钩45号队员在对方罚球区内与苏州东吴35号队员争抢球后倒地。裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：根据现有视频以及球的运行线路判断，守方队员铲球触到了球，其动作也不构成犯规，裁判员临场做出的不犯规的决定应予支持。","v":"correct","videos":["2024/i15c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240725/1721880924601170.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-106","t":"case","s":"2024","issue":15,"no":6,"seq":106,"comp":"中甲联赛","round":"第18轮","home":"苏州东吴","away":"无锡吴钩","minute":"57","desc":"判例六：中甲联赛第18轮，苏州东吴VS无锡吴钩，比赛第57分钟，无锡吴钩20号队员在对方罚球区内与苏州东吴5号队员发生身体接触后倒地。裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：无锡吴钩20号扣球变向后已经失去对球的完全控制，苏州东吴5号防守队员没有犯规动作，双方的身体接触属于比赛中的正常接触，裁判员临场做出的不犯规的决定正确。","v":"correct","videos":["2024/i15c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240725/1721880945907588.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-107","t":"case","s":"2024","issue":15,"no":7,"seq":107,"comp":"中甲联赛","round":"第18轮","home":"苏州东吴","away":"无锡吴钩","minute":"70","desc":"判例七：中甲联赛第18轮，苏州东吴VS无锡吴钩，比赛第70分钟，苏州东吴31号队员在对方罚球区内与无锡吴钩36号队员发生身体接触后倒地。裁判员判无锡吴钩36号防守犯规，判罚球点球，并向无锡吴钩36号出示黄牌。","appeal":"","concl":"对于此判例，评议组一致认为：苏州东吴31号带球突破，无锡吴钩36号在其身后有拉扯和推搡动作，但力度和程度不足以构成犯规，后续无锡吴钩36号腿部动作绊倒苏州东吴31号，属于草率犯规，接触地点在守方罚球区内，裁判员临场判守方犯规和罚球点球的决定正确。另外，评议组多数成员认为，该犯规动作不符合阻止对方有希望的进攻的判定标准，不应对无锡吴钩36号出示黄牌。\n判例对比一：中超联赛第18轮，上海申花vs山东泰山，比赛第26分钟，山东泰山队9号队员克雷桑犯规，裁判员向其出示黄牌（之后又因其他违规行为向其出示第二张黄牌并罚令出场）。\n判例对比二：中超联赛第24轮，武汉三镇vs成都蓉城，比赛第63分钟，成都蓉城队7号队员韦世豪犯规，裁判员向其出示红牌罚令出场。\n对于这两个判例，评议组一致认为：山东泰山队9号队员克雷桑的动作，属于在有触球可能性的情况下，使用过分力量和野蛮方式进行争抢，踢倒对方队员，按照竞赛规则，应定性为严重犯规，并直接出示红牌罚令出场，裁判员临场出示黄牌错误，漏判直接红牌。成都蓉城队7号队员韦世豪的动作，属于在球已经离开可争抢的范围，在没有触球可能性的情况下，不以触球为目的，故意踢对方队员，按照竞赛规则，应定性为暴力行为，并直接出示红牌罚令出场。两个判例中队员的犯规动作有相似之处，也都应直接出示红牌罚令出场，但因具体情形不同，在竞赛规则中应用的关于罚令出场的定性条款不同。\n中国足协纪律委员会对上述两个判例的后续纪律处罚也作出了如下解释：\n克雷桑犯规事件发生后，经研判，未提交违规违纪报告启动纪律处罚程序。\n韦世豪犯规事件发生后，依据相关规定对该暴力行为启动纪律处罚程序，最终由中国足协纪律委员会依据《中国足球协会纪律准则》第五十三条、第四十八条对成都蓉城7号球员本次违规违纪行为作出停赛4场、罚款4万元的纪律处罚决定。","v":"wrong","videos":["2024/i15c07-1.mp4","2024/i15c07-2.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240725/1721880972116442.mp4","https://videooss.thecfa.cn/upload/video/20240725/1721881017973588.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2024-108","t":"case","s":"2024","issue":16,"no":1,"seq":108,"comp":"中乙联赛","round":"第18轮","home":"赣州瑞狮","away":"广西蓝航","minute":"","desc":"判例一：中乙联赛第18轮，赣州瑞狮VS广西蓝航，比赛第45+2分钟，赣州瑞狮5号队员撞击广西蓝航16号队员，引起双方冲突。裁判员出示红牌将赣州瑞狮5号罚令出场。","appeal":"","concl":"对于此判例，评议组多数成员认为：赣州瑞狮5号在比赛停止时，从远处跑来，带有攻击性地撞击对方队员，引发后续群体冲突，在此情形下，应视为暴力行为，裁判员向其出示红牌罚令出场的决定正确。","v":"correct","videos":["2024/i16c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240731/1722422831665287.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"red"}},{"k":"2024-109","t":"case","s":"2024","issue":16,"no":2,"seq":109,"comp":"中乙联赛","round":"第18轮","home":"赣州瑞狮","away":"广西蓝航","minute":"54","desc":"判例二：中乙联赛第18轮，赣州瑞狮VS广西蓝航，比赛第54分钟，赣州瑞狮进攻中将球长传至广西蓝航罚球区内，广西蓝航41号守门员在本方罚球区内与赣州瑞狮19号队员争抢空中球，随后双方队员发生碰撞并倒地。裁判员判广西蓝航守门员犯规、罚球点球，并向其出示黄牌警告。","appeal":"","concl":"对于此判例，评议组一致认为：从现有视频看，双方队员均有争抢该空中球的机会，守门员抢先用手触到球，并无附加犯规动作，双方的碰撞属于惯性导致的接触。双方均不犯规。裁判员判广西蓝航守门员犯规、罚球点球，以及向其出示黄牌的决定均为错误。","v":"wrong","videos":["2024/i16c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240731/1722422898545863.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2024-110","t":"case","s":"2024","issue":16,"no":3,"seq":110,"comp":"中乙联赛","round":"第18轮","home":"赣州瑞狮","away":"广西蓝航","minute":"","desc":"判例三：中乙联赛第18轮，赣州瑞狮VS广西蓝航，接判例2事件，赣州瑞狮罚球点球时，广西蓝航守门员未作出明显的防守行为，球罚进，裁判员判进球有效。","appeal":"","concl":"对于此判例，评议组首先一致认为：在裁判员鸣哨示意执行罚球点球时，广西蓝航守门员双脚站在球门线上，面向主罚队员，并无其他违反竞赛规则的行为，场上队员的位置符合规则要求，裁判员示意执行罚球点球程序正确。在球被踢出时，广西蓝航守门员双脚均已离开球门线并处于球门线前方，属于违规行为，按照规则规定，如果球进门，则进球得分有效。因此裁判员临场执行罚球点球程序，以及判进球有效的决定均为正确。另外，评议组多数成员认为：广西蓝航守门员在对方踢罚球点球时表现出对比赛缺乏尊重，应以非体育行为对其出示黄牌警告。裁判员漏判黄牌。","v":"wrong","videos":["2024/i16c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240731/1722422926363314.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"goal_valid","c":"yellow"}},{"k":"2024-111","t":"case","s":"2024","issue":16,"no":4,"seq":111,"comp":"中乙联赛","round":"第18轮","home":"西安崇德荣海","away":"泰安天贶","minute":"","desc":"判例四：中乙联赛第18轮，西安崇德荣海VS泰安天贶，比赛第90+8分钟，泰安天贶掷前场界外球，西安崇德荣海防守队员在本方罚球区内与泰安天贶队员有接触，后者倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：从现有视频看，泰安天贶进攻队员在对方罚球区内，并非以踢球为目的，将腿伸向对方队员已经摆腿踢球的路线中，试图获得控球权或限制对方踢球，造成了双方的身体接触，西安崇德荣海防守队员不犯规，裁判员临场未判罚犯规的决定应予支持。","v":"correct","videos":["2024/i16c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240731/1722422949404450.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-113","t":"case","s":"2024","issue":17,"no":2,"seq":113,"comp":"中超联赛","round":"第21轮","home":"北京国安","away":"上海申花","minute":"","desc":"判例二：中超联赛第21轮，北京国安vs上海申花，比赛第90+7分钟，北京国安20号队员进球。裁判员判进球有效，VAR查看后未介入。（见视频3）","appeal":"","concl":"对于这两个判例，评议组经讨论后，做出说明如下：\n上海申花队进球事件，裁判员经VAR介入后改判上海申花9号越位犯规在先以及进球无效，最终决定正确，VAR介入正确。VAR操作间中可查看各个线路和十多个拍摄机位的画面，所有画面无论在比赛进行时、画面暂停时、回放检查时，在时间行进上都是严格同步的。在此类判例中，视频助理裁判员在查看时需先通过远景或适当的画面找到并确定进攻方传球或触球的瞬间，定格后再切换至适合的画面进行越位判断或3D划线操作，以严格确保传球瞬间和划线定格瞬间完全同步。在此判例中，视频助理裁判员的定格时刻选择（即传球瞬间和划线定格瞬间完全同步）、双方队员有效身体部位选择，以及越位线的比对程序均操作正确，得出了攻方队员明显处于越位位置的结论，并且正确介入，而且按照规定，对VAR介入的越位判罚向转播方作了推送，但推送画面只能包含3D划线画面，同一画面内无法包含攻方传球或触球瞬间的证据。（见视频2、截图1）\n\n而北京国安队进球事件，裁判员做出的不是越位犯规以及进球有效的决定正确，VAR未介入正确。在此判例中，视频助理裁判员按照与上述相同的操作原则和操作程序，经3D划线，判断攻守双方队员身体有效部位与守方球门线距离几乎相等，即几乎平行。在3D划线中，双方划线之间无缝隙，几乎重叠，按照中超联赛统一判罚尺度精神，攻方队员不处于越位位置，这与裁判员初始决定一致，无需介入。由于现行VAR操作规范中未要求此类VAR未介入事件必须向转播方推送划线画面，视频助理裁判员现场未推送，不违反VAR操作相关原则，因此转播方无法播出划线画面。（见视频4、截图2）\n但是在赛后复议中，在此判例中，视频助理裁判员在选择守方上海申花队倒数第二名防守队员时出现错误，应选择另一名更接近本方球门的防守队员（4号），如果正确选择4号队员及其有效身体部位（肩部），正确进行3D划线，将显示北京国安队进攻队员明显不处于越位位置，不存在越位犯规。（见视频5、截图3）","v":"correct","videos":["2024/i17c02-1.mp4","2024/i17c02-2.mp4","2024/i17c02-3.mp4","2024/i17c02-4.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240807/1723023561932453.mp4","https://videooss.thecfa.cn/upload/video/20240807/1723023635242338.mp4","https://videooss.thecfa.cn/upload/video/20240807/1723023708353741.mp4","https://videooss.thecfa.cn/upload/video/20240807/1723023747397797.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2024-114","t":"case","s":"2024","issue":18,"no":1,"seq":114,"comp":"中超联赛","round":"第23轮","home":"天津津门虎","away":"武汉三镇","minute":"","desc":"判例一：中超联赛第23轮，天津津门虎VS武汉三镇，比赛第90+1分钟。天津津门虎9号队员在对方罚球区内与武汉三镇40号队员争抢球时倒地，裁判员临场未判罚犯规。经VAR介入，裁判员在场回看后，判罚武汉三镇40号对天津津门虎9号犯规，并判罚球点球。","appeal":"","concl":"对于此判例，评议组一致认为：武汉三镇40号在防守时使用手臂限制对方队员移动，属于拉扯犯规，因犯规发生在守方罚球区内，应判罚球点球，VAR介入正确，裁判员在场回看后改判罚球点球的最终决定正确。","v":"correct","videos":["2024/i18c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240821/1724242948154112.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2024-115","t":"case","s":"2024","issue":18,"no":2,"seq":115,"comp":"中超联赛","round":"第23轮","home":"北京国安","away":"浙江俱乐部绿城","minute":"85","desc":"判例二：中超联赛第23轮，北京国安VS浙江俱乐部，比赛第85分钟，浙江俱乐部4号队员在本方罚球区内与北京国安9号队员发生接触并倒地。裁判员初始判罚北京国安9号犯规，没有进行纪律处罚。经VAR介入，裁判员在场回看后，向北京国安9号出示红牌罚令出场。","appeal":"","concl":"对于此判例，评议组一致认为：北京国安9号在无球情况下，故意使用肘部击打对方面部，使用的力量并非轻微可忽略的。按照竞赛规则，应视为暴力行为并出示红牌。VAR介入正确，裁判员在场回看后向北京国安9号出示红牌罚令出场的最终决定正确。","v":"correct","videos":["2024/i18c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240821/1724243011935138.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"red"}},{"k":"2024-116","t":"case","s":"2024","issue":18,"no":3,"seq":116,"comp":"中超联赛","round":"第23轮","home":"北京国安","away":"浙江俱乐部绿城","minute":"90","desc":"判例三：中超联赛第23轮，北京国安VS浙江俱乐部，比赛第90分钟，北京国安向对方罚球区传中，其17号队员跳起争抢球时与浙江俱乐部20号队员发生身体接触并倒地。裁判员临场未判罚犯规，VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：从现有视频来看，无法证明浙江俱乐部20号有明显的推搡或冲撞对方队员的犯规动作，双方的身体接触应视为正常接触，裁判员做出的不犯规的决定应予支持，VAR无需介入。","v":"correct","videos":["2024/i18c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240821/1724243058568939.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-117","t":"case","s":"2024","issue":18,"no":4,"seq":117,"comp":"中超联赛","round":"第23轮","home":"青岛海牛","away":"深圳新鹏城","minute":"58","desc":"判例四：中超联赛第23轮，青岛海牛VS深圳新鹏城，比赛第58分钟，深圳新鹏城12号队员在带球突破过程中与青岛海牛26号队员腿部有接触并在对方罚球区内倒地。裁判员临场未判罚犯规，VAR未介入。","appeal":"","concl":"对于此判例，评议组多数成员认为：深圳新鹏城12号的带球突破属于连贯、正常的比赛动作，青岛海牛26号在防守时右腿与对方队员的接触造成对方队员倒地，属于草率犯规，由于犯规发生在守方罚球区内，应判罚球点球。在裁判员未判罚犯规的情况下，VAR应予介入。裁判员临场漏判犯规和罚球点球，VAR未介入错误。","v":"wrong","videos":["2024/i18c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240821/1724243102812320.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2024-118","t":"case","s":"2024","issue":18,"no":5,"seq":118,"comp":"中超联赛","round":"第23轮","home":"上海申花","away":"上海海港","minute":"26","desc":"判例五：中超联赛第23轮，上海申花VS上海海港，比赛第26分钟，上海申花18号队员带球进入对方罚球区内并传中，球在运行过程中疑似与上海海港3号队员的手臂发生接触。裁判员临场未判罚手球犯规。经VAR介入，裁判员在场回看后，判罚上海海港3号手球犯规，并判罚球点球。","appeal":"","concl":"对于此判例，评议组一致认为：从不同角度的VAR视频来看，球接触了上海海港3号手臂部位，并且符合手球犯规判定标准，因手球犯规发生在守方罚球区内，应判罚球点球，VAR介入正确，裁判员经在场回看后改判上海海港3号手球犯规以及罚球点球的最终决定正确。","v":"correct","videos":["2024/i18c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240821/1724243163146721.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2024-119","t":"case","s":"2024","issue":18,"no":6,"seq":119,"comp":"中超联赛","round":"第23轮","home":"上海申花","away":"上海海港","minute":"","desc":"判例六：中超联赛第23轮，上海申花VS上海海港，比赛第45+11分钟，上海海港7号队员在前插跑位时与上海申花4号队员有身体接触并倒地。裁判员临场未判罚犯规，VAR未介入。","appeal":"","concl":"对于此判例，评议组多数成员认为：上海申花4号手臂与上海海港7号身体有接触，但没有明显的发力或推搡的犯规动作，双方腿部的接触也属于双方争夺位置时的正常接触，不应视为犯规，裁判员做出的不犯规的决定正确，VAR无需介入。","v":"correct","videos":["2024/i18c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240821/1724243189358794.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-120","t":"case","s":"2024","issue":18,"no":7,"seq":120,"comp":"中超联赛","round":"第22轮","home":"深圳新鹏城","away":"成都蓉城","minute":"45","desc":"判例七：中超联赛第22轮，深圳新鹏城VS成都蓉城，比赛第45分钟，双方在中场争抢球时疑似发生身体接触，成都蓉城队获得控球权后向前传球进攻，之后进球。裁判员临场判进球有效，VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：成都蓉城39号在中场争抢球时，抢先触到球，随后与对方队员的接触属于正常接触，没有附加犯规动作，不应视为犯规，随后成都蓉城发起进攻并进球得分，应视为有效。临场裁判员决定正确，VAR无需介入。","v":"correct","videos":["2024/i18c07-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240821/1724243225656157.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2024-121","t":"case","s":"2024","issue":18,"no":8,"seq":121,"comp":"中甲联赛","round":"第19轮","home":"云南玉昆","away":"广州俱乐部","minute":"71","desc":"判例八：中甲联赛第19轮，云南玉昆VS广州俱乐部，比赛第71分钟，云南玉昆30号队员进球，裁判员判进球有效。","appeal":"","concl":"对于此判例，评议组多数成员认为：此判例的认定取决于云南玉昆30号在本方传球瞬间是否处于越位位置这一客观事实，在现有视频条件下，难以作出准确判断。对此判例评议组不予认定结果。","v":"pending","videos":["2024/i18c08-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240821/1724243253423094.mp4"],"cat":"offside","catname":"越位"},{"k":"2024-122","t":"case","s":"2024","issue":18,"no":9,"seq":122,"comp":"中甲联赛","round":"第19轮","home":"佛山南狮","away":"苏州东吴","minute":"57","desc":"判例九：中甲联赛第19轮，佛山南狮VS苏州东吴，比赛第57分钟，佛山南狮30号队员在带球突破时与苏州东吴42号队员发生身体接触并倒地，裁判员判苏州东吴42号在本方罚球区内犯规，并判罚球点球。","appeal":"","concl":"对于此判例，评议组一致认为：佛山南狮30号在带球突破时已经占据有利位置，苏州东吴42号对其有犯规动作。评议组多数成员认为，裁判员临场判罚球点球的决定应予支持。","v":"correct","videos":["2024/i18c09-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240821/1724243280904288.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2024-123","t":"case","s":"2024","issue":18,"no":10,"seq":123,"comp":"女超联赛","round":"第16轮","home":"河南万仙山女足","away":"永川茶山竹海橙狮女足","minute":"19","desc":"判例十：女超联赛第16轮，河南万仙山女足VS永川茶山竹海澄狮女足，比赛第19分钟，河南女足进攻将球传至对方罚球区内，永川队守门员出击绊到河南队10号队员，裁判员判永川队守门员犯规，并判罚球点球，并向永川队守门员出示黄牌警告。在此之前河南队传中时，其20号队员与队员有身体接触，双方争抢后倒地。","appeal":"","concl":"对于此判例，评议组多数成员认为：现有视频无法清晰证明河南女足传中时，攻方20号队员试图触球未果后，与永川队21号的身体接触是否存在犯规。裁判员临场未判罚犯规，以及后续判罚永川队守门员对河南队10号犯规并判罚球点球的决定，应予支持。","v":"correct","videos":["2024/i18c10-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240821/1724243305415631.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"yellow"}},{"k":"2024-124","t":"case","s":"2024","issue":19,"no":1,"seq":124,"comp":"中国足协杯","round":"第6轮","home":"南京城市","away":"成都蓉城","minute":"5","desc":"判例一：中国足协杯第6轮，南京城市VS成都蓉城，比赛第5分钟，南京城市20号队员在对方罚球区内倒地，裁判员未判罚犯规，VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：成都蓉城守门员做出正常的试图触球的动作，无附加犯规动作，也不是造成南京城市20号倒地的主要原因，不应视为犯规，裁判员临场未判罚犯规的决定正确，VAR未介入正确。","v":"correct","videos":["2024/i19c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240829/1724895509359210.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-125","t":"case","s":"2024","issue":19,"no":2,"seq":125,"comp":"中甲联赛","round":"第20轮","home":"苏州东吴","away":"辽宁铁人","minute":"77","desc":"判例二：中甲联赛第20轮，苏州东吴VS辽宁铁人，比赛第77分钟，在辽宁铁人队罚球区内，苏州东吴2号队员在与辽宁铁人2号队员接触后倒地，裁判员判辽宁铁人2号防守犯规，罚球点球。","appeal":"","concl":"对于此判例，评议组多数成员认为：从现有视频上看，辽宁铁人2号对苏州东吴2号的拉扯动作，阻止了后者争抢球并造成其倒地，裁判员判罚辽宁铁人2号犯规并判罚球点球的决定应予支持。","v":"correct","videos":["2024/i19c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240829/1724895551659727.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2024-126","t":"case","s":"2024","issue":19,"no":3,"seq":126,"comp":"中甲联赛","round":"第20轮","home":"黑龙江冰城","away":"南京城市","minute":"7","desc":"判例三：中甲联赛第20轮，黑龙江冰城VS南京城市，比赛第7分钟，南京城市30号队员进球，裁判员判罚攻方越位犯规在先，进球无效。","appeal":"","concl":"对于此判例，评议组一致认为：南京城市队进球的30号队员，在其同队队员触球时，处于越位位置，之后黑龙江冰城队员虽然触球，但来球突然，其没有时间调整身体动作，只是做出了本能的踢球动作，不符合竞赛规则中对于判断越位犯规时守方队员“有意触球”的判定标准，因此南京城市30号队员随后将球打进，仍属于在越位位置获利，属越位犯规，进球无效，裁判员临场判罚正确。","v":"correct","videos":["2024/i19c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240829/1724895583835640.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2024-127","t":"case","s":"2024","issue":20,"no":1,"seq":127,"comp":"中甲联赛","round":"第21轮","home":"江西庐山","away":"黑龙江冰城","minute":"79","desc":"判例一：中甲联赛第21轮，江西庐山VS黑龙江冰城，比赛第79分钟，黑龙江冰城8号队员在进攻前插时与对方队员发生身体接触后，在对方罚球区内倒地。裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：守方江西庐山队队员从侧后方对黑龙江冰城8号有冲撞动作，造成后者倒地，从现有视频判断，应判罚犯规。另外从回放镜头来看，双方队员进入守方罚球区前，冲撞过程已完成，犯规地点应认定为罚球区外。同时，攻方队员有控球进攻的可能性，该犯规阻止了对方有希望的进攻，应对守方球员出示黄牌。综上，此判例应判罚守方江西庐山队在本方罚球区外犯规，并黄牌警告犯规队员，由黑龙江冰城踢直接任意球恢复比赛。临场裁判员决定错误，漏判犯规、直接任意球和黄牌。","v":"wrong","videos":["2024/i20c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240904/1725458230484741.mp4"],"cat":"freekick_foul","catname":"罚球区外一般犯规","ans":{"r":"directfk","c":"yellow"}},{"k":"2024-128","t":"case","s":"2024","issue":20,"no":2,"seq":128,"comp":"中甲联赛","round":"第21轮","home":"辽宁铁人","away":"大连英博","minute":"6","desc":"判例二：中甲联赛第21轮，辽宁铁人VS大连英博，比赛第6分钟，辽宁铁人5号队员在本方罚球区内存在疑似手球情况。裁判员未判罚犯规，VAR未介入。","appeal":"","concl":"对于此判例，评议组首先一致认为，辽宁铁人5号手臂的位置使身体不自然变大，在此情况下，如果手臂接触到球，应视为手球犯规。在此前提下，评议组多数成员认为：从球的运行路线推断和掌握的视频分析来看，球应与手臂有接触，此判例可认定为手球犯规，应判罚球点球。临场裁判员决定错误，漏判手球犯规和罚球点球。然而，临场VAR当时能看到的视频角度有限，无法做出球是否接触手臂的准确判断，临场VAR未介入，不应视为错误。","v":"wrong","videos":["2024/i20c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240904/1725458517982640.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2024-129","t":"case","s":"2024","issue":20,"no":3,"seq":129,"comp":"中乙联赛","round":"第21轮","home":"湖北青年星","away":"海口名城","minute":"89","desc":"判例三：中乙联赛第21轮，湖北青年星VS海口名城，比赛第89分钟，在湖北青年星罚球区内，海口名城17号队员与湖北青年星守门员有接触，裁判员判攻方海口名城17号队员犯规，未判罚湖北青年星守门员犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：现有视频无法看清海口名城17号在铲球时与对方守门员的接触中是否构成犯规，也无法看清守门员此后是否有犯规动作，裁判员临场观察角度优于转播镜头角度，支持裁判员临场决定。","v":"correct","videos":["2024/i20c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240904/1725458799262197.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"c":"none"}},{"k":"2024-130","t":"case","s":"2024","issue":20,"no":4,"seq":130,"comp":"中乙联赛","round":"第21轮","home":"湖北青年星","away":"海口名城","minute":"","desc":"判例四：中乙联赛第21轮，湖北青年星VS海口名城，比赛第90+8分钟，湖北青年星53号队员接同队传球形成突破，被海口名城49号队员在本方罚球区外拉倒，裁判员判海口名城49号犯规并出示红牌将其罚令出场。","appeal":"","concl":"对于此判例，评议组一致认为：守方的犯规满足了破坏对方明显的进球得分机会的判别条件，临场裁判员判罚犯规并出示红牌的决定正确。","v":"correct","videos":["2024/i20c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240904/1725459140956841.mp4"],"cat":"dogso","catname":"破坏明显进球得分机会（DOGSO）","ans":{"c":"red"}},{"k":"2024-131","t":"case","s":"2024","issue":20,"no":5,"seq":131,"comp":"中乙联赛","round":"第21轮","home":"北京理工","away":"广西蓝航","minute":"70","desc":"判例五：中乙联赛第21轮，北京理工VS广西蓝航，比赛第70分钟，北京理工队员在对方罚球区内与广西蓝航守门员接触后倒地，裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为：广西蓝航守门员出击后无犯规动作，双方属于正常的身体接触，裁判员临场做出的不犯规的决定正确。","v":"correct","videos":["2024/i20c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240904/1725459211620869.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-132","t":"case","s":"2024","issue":20,"no":6,"seq":132,"comp":"中乙联赛","round":"第21轮","home":"北京理工","away":"广西蓝航","minute":"","desc":"判例六：中乙联赛第21轮，北京理工VS广西蓝航，比赛第90+4分钟，北京理工在前场踢任意球，球传至广西蓝航罚球区内，广西蓝航队员疑似手球，裁判未判罚；之后北理工队员又疑似被广西蓝航队员拉扯倒地，裁判员也未判罚犯规。","appeal":"","concl":"对于此判例，评议组一致认为，广西蓝航队员疑似手球，但由于视频中接触点被遮挡，无法证明是否手球犯规，但之后广西蓝航队员明显拉扯对方队员，限制其移动和对球的争抢并造成其倒地，应判罚拉扯犯规，罚球点球。同时，因攻方队员有争抢球和射门的机会，还应以阻止对方有希望的进攻为由，向守方队员出示黄牌警告。临场裁判员决定错误，漏判罚球点球和黄牌。","v":"wrong","videos":["2024/i20c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240904/1725459426971110.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"yellow"}},{"k":"2024-133","t":"case","s":"2024","issue":21,"no":1,"seq":133,"comp":"中甲联赛","round":"第22轮","home":"苏州东吴","away":"南京城市","minute":"6","desc":"判例一：中甲联赛第22轮，苏州东吴VS南京城市，比赛第6分钟，苏州东吴10号队员在本方罚球区内存在疑似手球情况。裁判员未判罚手球犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：苏州东吴10号手臂有从自然位置向非自然位置移动的动作，但现有视频无法看清或证明球与苏州东吴10号手臂是否接触，以及与身体或手臂接触过程是否构成手球犯规。在没有清晰视频证据的情况下，对裁判员临场做出的不是手球犯规的决定应予支持。","v":"correct","videos":["2024/i21c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240912/1726148856673408.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2024-134","t":"case","s":"2024","issue":21,"no":2,"seq":134,"comp":"中乙联赛","round":"第22轮","home":"赣州瑞狮","away":"日照宇启","minute":"84","desc":"判例二：中乙联赛第22轮，赣州瑞狮VS日照宇启，比赛第84分钟，日照宇启10号队员在与赣州瑞狮30号队员争抢球时，前者疑似用脚踩踏后者，裁判员出示红牌将日照宇启10号罚令出场。","appeal":"","concl":"对于此判例，评议组多数成员认为：赣州瑞狮30号在争抢球时进入日照宇启10号跑动路线，造成双方身体接触及倒地。从现有视频看，日照宇启10号在倒地过程中没有明显的附加动作或恶意踩踏对方队员的行为，不应认定为暴力行为，裁判员向其出示红牌罚令出场的决定错误。","v":"wrong","videos":["2024/i21c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240912/1726148883570802.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk"}},{"k":"2024-135","t":"case","s":"2024","issue":21,"no":3,"seq":135,"comp":"中乙联赛","round":"第22轮","home":"泰安天贶","away":"江西黑马青年","minute":"","desc":"判例三：中乙联赛第22轮，泰安天贶VS江西黑马青年，比赛第45+2分钟，江西黑马青年15号队员与泰安天贶48号队员在泰安天贶罚球区内争抢球，江西黑马青年15号从对方队员身后争抢试图触球，之后球疑似接触泰安天贶48号手臂，裁判员未判罚手球犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：江西黑马青年15号从泰安天贶48号身后争抢球，其争抢动作和身体接触造成了泰安天贶48号失去身体平衡，其手臂并非有意处于非自然位置拦截球，不应视为手球犯规。在现有视频角度下，裁判员临场做出的不是手球犯规的决定应予支持。","v":"correct","videos":["2024/i21c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240912/1726148905946043.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2024-136","t":"case","s":"2024","issue":22,"no":1,"seq":136,"comp":"中甲联赛","round":"第23轮","home":"广州俱乐部","away":"苏州东吴","minute":"72","desc":"判例一：中甲联赛第23轮，广州俱乐部VS苏州东吴，比赛第72分钟，广州俱乐部18号队员在苏州东吴罚球区内与对方35号队员争抢球时倒地，裁判员判守方苏州东吴35号犯规，并判罚球点球。","appeal":"","concl":"对于此判例，评议组一致认为：苏州东吴35号对对方队员有拉扯动作，影响了对方争抢球，应视为防守犯规，裁判员判苏州东吴35号犯规并判罚球点球的决定正确。","v":"correct","videos":["2024/i22c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240919/1726753480651409.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2024-137","t":"case","s":"2024","issue":22,"no":2,"seq":137,"comp":"中甲联赛","round":"第23轮","home":"南京城市","away":"无锡吴钩","minute":"49","desc":"判例二：中甲联赛第23轮，南京城市VS无锡吴钩，比赛第49分钟，南京城市11号队员进球前疑似手球在先，裁判员判进球有效。","appeal":"","concl":"对于此判例，评议组多数成员认为：南京城市11号争抢高空球时手臂触球，其手臂处于当前动作下的正常和合理位置，在对方守门员争抢球并可能触球的情况下无法预知球的来路，手臂与球的接触属于意外手球，不应判罚手球犯规。之后守方无锡吴钩守门员将球踢进本方球门，应判进球有效。裁判员临场决定正确。","v":"correct","videos":["2024/i22c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240919/1726753507496596.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"goal_valid","c":"none"}},{"k":"2024-138","t":"case","s":"2024","issue":22,"no":3,"seq":138,"comp":"中乙联赛","round":"第23轮","home":"北京理工","away":"赣州瑞狮","minute":"62","desc":"判例三：中乙联赛第23轮，北京理工VS赣州瑞狮，比赛第62分钟，北京理工队射门，赣州瑞狮队员在本方罚球区疑似手球，裁判员未判罚手球犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：从现有视频判断，球与守方赣州瑞狮队员的手臂应有接触，赣州瑞狮队员的手臂有向球的运行路线移动的动作，并且使身体不自然扩大，应判罚手球犯规，罚球点球。裁判员临场决定错误，漏判罚球点球。","v":"wrong","videos":["2024/i22c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240919/1726753527829255.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2024-139","t":"case","s":"2024","issue":22,"no":4,"seq":139,"comp":"中乙联赛","round":"第23轮","home":"北京理工","away":"赣州瑞狮","minute":"85","desc":"判例四：中乙联赛第23轮，北京理工VS赣州瑞狮，比赛第85分钟，双方队员在赣州瑞狮罚球区内争抢球并倒地，裁判员判攻方北京理工队员犯规，并出示黄牌警告攻方北京理工队员。","appeal":"","concl":"对于此判例，评议组多数成员认为：双方队员在赣州瑞狮罚球区内的连续两次争抢接触中，第一次接触，双方均不犯规，第二次接触，攻方北京理工队员抢先触球，守方赣州瑞狮队员因动作晚了而踢到对方队员，属于草率犯规，应判守方犯规、罚球点球。裁判员临场判攻方北京理工犯规的决定错误，漏判罚球点球，并且做出了反判。","v":"wrong","videos":["2024/i22c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240919/1726753550629552.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2024-140","t":"case","s":"2024","issue":23,"no":1,"seq":140,"comp":"中超联赛","round":"第26轮","home":"山东泰山","away":"武汉三镇","minute":"28","desc":"判例一：中超联赛第26轮，山东泰山VS武汉三镇，比赛第28分钟，武汉三镇28号队员在山东泰山罚球区内与对方13号队员发生身体接触后倒地，裁判员临场未判罚犯规，随后VAR介入比赛，裁判员在场回看后维持不判球点球判罚。","appeal":"","concl":"对于此判例，评议组成员一致认为：山东泰山13号队员与武汉三镇28号队员的接触程度较轻微，未影响对方控制球权；28号队员倒地主因是右脚踩在了防守队员脚上，导致滑倒，不应视为对方防守犯规，裁判员临场未判罚球点球以及在VAR介入后维持最初判罚的决定正确，VAR介入错误。","v":"correct","videos":["2024/i23c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240925/1727272636224089.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-141","t":"case","s":"2024","issue":23,"no":2,"seq":141,"comp":"中超联赛","round":"第26轮","home":"南通支云","away":"青岛海牛","minute":"","desc":"判例二：中超联赛第26轮，南通支云VS青岛海牛，比赛第90+7分钟，青岛海牛3号队员与南通支云10号队员争抢球时发生身体接触后倒地，裁判员临场判罚南通支云10号队员犯规并出示黄牌对其警告。","appeal":"","concl":"对于此判例，评议组成员一致认为：南通支云10号队员与青岛海牛3号队员争抢球产生身体接触前有一定的冲刺距离，南通支云10号队员在青岛海牛3号队员先接触球后仍直腿对其做出抢截动作，从使用的力量、犯规的程度、接触的部位来看此犯规是一个危及对方队员安全的抢截动作，应依据严重犯规条款，将南通支云10号队员红牌罚令出场。裁判员临场判罚错误，VAR未介入错误。","v":"wrong","videos":["2024/i23c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240925/1727272661763514.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"directfk","c":"none"}},{"k":"2024-142","t":"case","s":"2024","issue":23,"no":3,"seq":142,"comp":"中超联赛","round":"第26轮","home":"南通支云","away":"青岛海牛","minute":"","desc":"判例三：中超联赛第26轮，南通支云VS青岛海牛，比赛第90+13分钟，青岛海牛11号队员主罚球点球，在其罚失后由同队23号队员补射进球，经VAR提示，裁判员在线回看分析，认定攻方青岛海牛23号队员在球点球罚出之前进入罚球区违例，取消进球，由南通支云队罚间接任意球恢复比赛。","appeal":"","concl":"对于此判例，评议组成员一致认为：在《2023-2024足球竞赛规则》及此前版本的竞赛规则是双方队员提前进入罚球区应重新踢罚球点球。但在2024年7月1日中国足协各级赛事开始执行的《2024-2025足球竞赛规则》相关条款已经作了更新，明确队员提前进入罚球区后分为影响比赛和未影响比赛两种情况，针对不同的情况将做出不同的判罚决定。此判例实际情况是在球点球罚出前，进攻方青岛海牛23号队员和防守方南通支云24号队员均提前进入罚球区，但是只有进攻方23号队员补射将球打进，直接影响到了比赛，而防守方24号队员的行为对比赛并未产生明显的影响。按照最新规则相关条款规定，球点球罚出后球未直接进门，攻方队员提前进入罚球区并影响了比赛，应判罚由守方踢间接任意球恢复比赛。裁判员最终判罚及VAR介入正确。","v":"correct","videos":["2024/i23c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240925/1727272686161316.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"retake","c":"none"}},{"k":"2024-143","t":"case","s":"2024","issue":23,"no":4,"seq":143,"comp":"中甲联赛","round":"第24轮","home":"广西平果","away":"上海嘉定汇龙","minute":"87","desc":"判例四：中甲联赛第24轮，广西平果哈嘹VS上海嘉定汇龙，比赛第87分钟，广西平果哈嘹37号队员运球进入上海嘉定汇龙罚球区并与其30号队员发生身体接触后倒地，裁判员临场未做出判罚。","appeal":"","concl":"对于此判例，评议组成员一致认为：广西平果哈嘹37号队员运球进入上海嘉定汇龙罚球区后，在继续带球靠近球门的过程中被上海嘉定汇龙30号队员从背后拉拽倒地，此次防守动作对进攻队员产生了干扰，属于草率犯规，应判守方犯规、罚球点球。裁判员临场判罚决定错误，漏判罚球点球。","v":"wrong","videos":["2024/i23c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240925/1727272712586749.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"penalty","c":"none"}},{"k":"2024-144","t":"case","s":"2024","issue":23,"no":5,"seq":144,"comp":"中乙联赛","round":"第24轮","home":"泰安天贶","away":"泉州亚新","minute":"76","desc":"判例五：中乙联赛第24轮，泰安天贶VS泉州亚新，比赛第76分钟，泰安天贶11号队员接队员传球，随后与泉州亚新26号队员发生身体接触倒地，裁判员临场未做出判罚。","appeal":"","concl":"对于此判例，评议组成员一致认为：在泰安天贶11号队员接队友传球向前过程中，被泉州亚新26号队员从侧向抢截犯规，首先裁判员临场应判罚防守队员犯规，其次从“破坏进球或者明显进球得分机会”的四个要素即犯规发生地点与球门间的距离、比赛发展的大致方向、继续控球或获得球权的可能性、防守队员的位置和人数来看，此次犯规完全满足这四个要素，应对防守队员出示红牌。裁判员临场决定错误。","v":"wrong","videos":["2024/i23c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20240925/1727272733590160.mp4"],"cat":"dogso","catname":"破坏明显进球得分机会（DOGSO）","ans":{"c":"red"}},{"k":"2024-145","t":"case","s":"2024","issue":24,"no":1,"seq":145,"comp":"中国足协杯","round":"","home":"山东泰山","away":"成都蓉城","minute":"64","desc":"判例一：2024中国足协杯赛半决赛，山东泰山VS成都蓉城，比赛第64分钟，成都蓉城31号队员在反击中与山东泰山21号队员发生身体接触，裁判员判攻方成都蓉城31号犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：攻方成都蓉城31号队员先使用右手臂接触对方队员肩部，但方式和力度属于双方争抢时的正常接触范畴，之后山东泰山21号倒地时对成都蓉城31号形成的干扰也是由双方正常身体接触造成，本次争抢过程中双方均不犯规，裁判员临场判罚攻方成都蓉城球员犯规的决定错误。","v":"wrong","videos":["2024/i24c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20241009/1728474305667637.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-146","t":"case","s":"2024","issue":24,"no":2,"seq":146,"comp":"中国足协杯","round":"","home":"山东泰山","away":"成都蓉城","minute":"90","desc":"判例二：2024中国足协杯赛半决赛，山东泰山VS成都蓉城，比赛第90分钟，山东泰山5号队员进球得分，助理裁判员未示意越位，裁判员判进球有效，VAR查看后未介入。","appeal":"","concl":"对于此判例，评议组一致认为：山东泰山队传中时，本方队员均不处于越位位置；此判例最后进球得分的队员是否处于越位位置，取决于球在运行过程中，攻方山东泰山队两名队员在门前争抢时是否触到球，评议组查看视频后认为，无法证明球触及了上述两名队员；临场裁判员与VAR的沟通与查看操作符合相关流程和规范。裁判员最终判山东泰山5号进球得分有效的决定，应予支持；VAR未介入的决定正确。","v":"correct","videos":["2024/i24c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20241009/1728474365586197.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2024-147","t":"case","s":"2024","issue":24,"no":3,"seq":147,"comp":"中超联赛","round":"第27轮","home":"成都蓉城","away":"梅州客家","minute":"13","desc":"判例三：中超联赛第27轮，成都蓉城vs梅州客家，比赛第13分钟，成都蓉城队踢角球，随后形成进球，第一助理裁判员举旗示意球在空中出球门线，裁判员判球出界在先，由梅州客家队以球门球恢复比赛，VAR查看后认为球未出球门线，并介入，裁判员最终改判进球有效。","appeal":"","concl":"对于此判例，评议组一致认为：此判例涉及球是否在空中越过球门线的客观事实。在使用VAR技术的比赛中，裁判员和VAR经过规范操作和查看后做出的最终决定，应予支持。此判例改判为进球有效的决定正确，VAR介入正确。","v":"correct","videos":["2024/i24c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20241009/1728474394761117.mp4"],"cat":"goal_decision","catname":"进球判定与有利条款","ans":{"r":"goal_valid","c":"none"}},{"k":"2024-148","t":"case","s":"2024","issue":24,"no":4,"seq":148,"comp":"中甲联赛","round":"第26轮","home":"无锡吴钩","away":"辽宁铁人","minute":"17","desc":"判例四：中甲联赛第26轮，无锡吴钩VS辽宁铁人，比赛第17分钟，无锡吴钩19号队员在对方罚球区内与守方24号队员争抢球后倒地。裁判员未判罚犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：守方辽宁铁人24号在争抢球时腿部和手臂均与攻方无锡吴钩19号有接触，腿部的接触属于双方争抢中的正常接触，手臂与对方身体的接触，发力和拉扯动作不明显，也不是造成攻方队员倒地的主要原因，攻方队员有继续前进后借助之前的接触主动倒地的动作成分，裁判员做出的辽宁铁人球员不犯规的决定应予支持。","v":"correct","videos":["2024/i24c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20241009/1728474420580844.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-149","t":"case","s":"2024","issue":24,"no":5,"seq":149,"comp":"中甲联赛","round":"第26轮","home":"南京城市","away":"石家庄功夫","minute":"","desc":"判例五：中甲联赛第26轮，南京城市VS石家庄功夫，比赛第90+6分钟，石家庄功夫28号队员进球，裁判员判进球有效。","appeal":"","concl":"对于此判例，评议组多数成员认为：从现有视频的角度无法准确判断石家庄功夫队传球的瞬间，其28号队员是否处于越位位置，应支持裁判员临场做出的不越位（进球有效）的决定。","v":"correct","videos":["2024/i24c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20241009/1728474442258652.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_valid","c":"none"}},{"k":"2024-150","t":"case","s":"2024","issue":24,"no":6,"seq":150,"comp":"中乙联赛","round":"第25轮","home":"泉州亚新","away":"北京理工","minute":"54","desc":"判例六：中乙联赛第25轮，泉州亚新VS北京理工，比赛第54分钟，北京理工队守门员在本方罚球区内疑似绊倒泉州亚新队员，裁判员判罚球点球。","appeal":"","concl":"对于此判例，评议组多数成员认为：北京理工守门员在铲球时清晰触到球，并且无附加或其他犯规动作，不应视为犯规，裁判员判北京理工守门员犯规并判罚球点球的决定错误。","v":"wrong","videos":["2024/i24c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20241009/1728474465232810.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-151","t":"case","s":"2024","issue":25,"no":1,"seq":151,"comp":"中超联赛","round":"第28轮","home":"武汉三镇","away":"浙江俱乐部绿城","minute":"","desc":"判例一：中超联赛第28轮，武汉三镇VS浙江俱乐部，比赛第45+2分钟，武汉三镇23号队员在争抢球时踩踏浙江俱乐部45号队员脚踝，裁判员未判罚犯规。VAR以应出示红牌为由介入。裁判员停止比赛，并进行在场回看后，向武汉三镇23号出示黄牌警告，并以坠球恢复比赛。","appeal":"","concl":"对于此判例，评议组一致认为：从武汉三镇23号队员的犯规意图、使用的部位、接触对方的部位、接触强度力度、给对方造成的伤害等方面，均构成严重犯规的认定条件，应对其出示红牌罚令出场。临场VAR介入正确，裁判员在场回看后出示黄牌警告的决定错误，漏判红牌。","v":"wrong","videos":["2024/i25c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20241023/1729687513301775.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"red"}},{"k":"2024-152","t":"case","s":"2024","issue":25,"no":2,"seq":152,"comp":"中超联赛","round":"第28轮","home":"沧州雄狮","away":"南通支云","minute":"78","desc":"判例二：中超联赛第28轮，沧州雄狮VS南通支云，比赛第78分钟，裁判员判沧州雄狮7号队员在本方罚球区内手球犯规，并判罚球点球。VAR介入，裁判员在场回看后改判为不是手球犯规，并以坠球恢复比赛。","appeal":"","concl":"对于此判例，评议组首先一致认为，从现有视频上看，球先接触了防守队员的身体肋部。部分评议组成员认为球反弹后有可能接触了队员手臂但无法最终判定。同时评议组一致认为，即使球接触了手臂，也属于球在队员身体反弹后的意外手球情形，不是手球犯规。临场VAR介入正确，裁判员在场回看后改判为不是手球犯规的决定正确。","v":"correct","videos":["2024/i25c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20241023/1729687602846289.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2024-153","t":"case","s":"2024","issue":25,"no":3,"seq":153,"comp":"中甲联赛","round":"第27轮","home":"广州俱乐部","away":"江西庐山","minute":"","desc":"判例三：中甲联赛第27轮，广州俱乐部VS江西庐山，比赛第90+4分钟，广州俱乐部9号队员在对方罚球区内与守方队员发生身体接触后倒地，裁判员未判罚犯规，VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：双方队员的接触属于相互的、正常的身体接触，守方队员没有明显的犯规动作，传球落点并不在该两名队员的争抢范围内，攻方队员有借助接触主动倒地的成分。裁判员未判罚犯规的决定正确，VAR未介入正确。","v":"correct","videos":["2024/i25c03-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20241023/1729687631218154.mp4"],"cat":"penalty_area","catname":"罚球区内判罚（点球）","ans":{"r":"playon","c":"none"}},{"k":"2024-154","t":"case","s":"2024","issue":25,"no":4,"seq":154,"comp":"中甲联赛","round":"第27轮","home":"广州俱乐部","away":"江西庐山","minute":"","desc":"判例四：中甲联赛第27轮，广州俱乐部VS江西庐山，比赛第90+8分钟，广州队队员射门，球疑似接触江西庐山罚球区内的守方25号队员手臂，裁判未判罚手球犯规。VAR未介入。","appeal":"","concl":"对于此判例，评议组一致认为：江西庐山25号队员的手臂处于自然位置，没有附加动作，即使球接触手臂，也不是手球犯规。裁判员未判罚手球犯规的决定正确，VAR未介入正确。","v":"correct","videos":["2024/i25c04-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20241023/1729687652730732.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2024-155","t":"case","s":"2024","issue":25,"no":5,"seq":155,"comp":"中乙联赛","round":"第27轮","home":"日照宇启","away":"赣州瑞狮","minute":"39","desc":"判例五：中乙联赛第27轮，日照宇启VS赣州瑞狮，比赛第39分钟，裁判员判赣州瑞狮15号队员在本方罚球区内倒地后手球犯规，并判罚球点球。","appeal":"","concl":"对于此判例，评议组多数成员认为：赣州瑞狮15号队员在本方罚球区内试图处理球时与对方队员发生接触倒地，对方队员未犯规，赣州瑞狮15号倒地后手臂主动向球的方向移动触球，属于手球犯规，裁判员判其手球犯规并判罚球点球的决定正确。","v":"correct","videos":["2024/i25c05-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20241023/1729687679534810.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"penalty","c":"none"}},{"k":"2024-156","t":"case","s":"2024","issue":25,"no":6,"seq":156,"comp":"中乙联赛","round":"第28轮","home":"赣州瑞狮","away":"北京理工","minute":"74","desc":"判例六：中乙联赛第28轮，赣州瑞狮VS北京理工，比赛第74分钟，北京理工52号队员进球得分疑似越位犯规在先。第一助理裁判员未判罚越位犯规，裁判员判进球有效。","appeal":"","concl":"对于此判例，评议组多数成员认为：攻方北京理工队员触球时，其52号队员处于越位位置，随后得球并射门得分，应判罚其越位犯规在先，进球无效。裁判员判进球有效的决定错误。","v":"wrong","videos":["2024/i25c06-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20241023/1729687725868582.mp4"],"cat":"offside","catname":"越位","ans":{"r":"goal_invalid","c":"none"}},{"k":"2024-157","t":"case","s":"2024","issue":26,"no":1,"seq":157,"comp":"中甲联赛","round":"第29轮","home":"上海嘉定汇龙","away":"石家庄功夫","minute":"25","desc":"判例一：中甲联赛第29轮，上海嘉定汇龙vs石家庄功夫，比赛第25分钟，上海嘉定汇龙7号队员在对方罚球区内射门，球疑似接触守方石家庄功夫20号队员手臂，裁判员未判罚手球犯规。","appeal":"","concl":"对于此判例，评议组多数成员认为：守方队员手臂处于自然位置，也没有附加的向球移动的动作，虽然球接触了手臂，但这不是手球犯规。裁判员做出的不是手球犯规的决定正确。","v":"correct","videos":["2024/i26c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20241030/1730282296239577.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"playon","c":"none"}},{"k":"2024-158","t":"case","s":"2024","issue":26,"no":2,"seq":158,"comp":"中甲联赛","round":"第29轮","home":"云南玉昆","away":"大连英博","minute":"83","desc":"判例二：中甲联赛第29轮，云南玉昆vs大连英博，比赛第83分钟，大连英博进球，裁判员初始判进球有效，VAR介入，裁判员经在场回看后改判攻方大连英博40号队员进球前手球犯规在先，进球无效。","appeal":"","concl":"对于此判例，评议组首先一致认为：VAR所查看的视频，其角度不能清晰证明球是否与攻方大连英博40号队员手臂有接触，不能证明裁判员的初始判罚（进球有效）出现了明显、清晰的错误，根据竞赛规则及VAR操作规范，VAR依据此视频介入属于错误介入。裁判员在场回看后，依据此视频做出改判也属于错误。\n同时，评议组多数成员认为，根据现有视频可以判断，球未接触攻方大连英博40号手臂，攻方不存在手球犯规，进球应为有效，裁判员改判为进球无效的最终决定错误。","v":"wrong","videos":["2024/i26c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20241030/1730282396807059.mp4"],"cat":"handball","catname":"手球犯规","ans":{"r":"goal_valid","c":"none"}},{"k":"2024-159","t":"case","s":"2024","issue":27,"no":1,"seq":159,"comp":"三大球运动会","round":"第5轮","home":"河北","away":"湖北","minute":"41","desc":"判例一：第一届全国青少年三大球运动会足球项目男子组决赛阶段第5轮，河北vs湖北，比赛第41分钟，湖北队19号队员在对方罚球区内与河北队1号守门员发生接触后倒地，裁判员判河北队1号守门员犯规并判罚球点球。在比赛恢复前，经与助理裁判员和第四官员商议，裁判员改判由守方河北队踢间接任意球恢复比赛，并向湖北队19号和河北队1号守门员分别出示黄牌警告。","appeal":"","concl":"对于此判例，评议组一致认为：湖北队19号队员在河北队1号守门员已经用手控制球的情况下，干扰对方守门员发出球，属于违规行为，之后再次上前争抢干扰，河北队1号守门员抬起手臂，双方互相冲撞接触。从目前视频看，该接触是以肩臂部为主，不排除守门员可能与对方头面部有接触，但其程度和性质不属于故意使用手臂或肘部击打对方头面部，不应视为暴力行为。双方队员本次接触有相互挑衅的非体育行为成分，裁判员最终改判由守方河北队踢间接任意球恢复比赛，以及对湖北队19号和河北队1号守门员分别出示黄牌的决定正确。","v":"correct","videos":["2024/i27c01-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20241130/1732966024118418.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"r":"penalty","c":"yellow"}},{"k":"2024-160","t":"case","s":"2024","issue":27,"no":2,"seq":160,"comp":"三大球运动会","round":"第5轮","home":"河北","away":"湖北","minute":"86","desc":"判例二：第一届全国青少年三大球运动会足球项目男子组决赛阶段第5轮，河北vs湖北，比赛第86分钟，湖北队准备踢角球时，双方队员在河北队罚球区内争抢位置时发生接触，裁判员进行管理后，未做出处罚，仍以角球恢复比赛。","appeal":"","concl":"对于此判例，评议组首先一致认为：依照足球竞赛规则，在比赛停止时，即使发生违规行为或出示红黄牌，也不能改变比赛恢复的方式，因此裁判员仍以角球恢复比赛的决定正确。\n另外，评议组多数成员认为：在双方争抢位置过程中，攻方湖北队队员对守方河北队队员有推搡和踩脚的动作，之后河北队队员有企图报复的动作，但并未踢到，且其情绪和动作程度有所控制，湖北队队员做出了夸张的躲避动作。对于双方队员的非体育行为，认可裁判员的临场处置方式，但也有评议组成员认为对双方队员出示黄牌警告也是一种合适的处置方式。","v":"correct","videos":["2024/i27c02-1.mp4"],"vurls":["https://videooss.thecfa.cn/upload/video/20241130/1732966103523140.mp4"],"cat":"sfp_vc","catname":"严重犯规与暴力行为","ans":{"c":"none"}},{"k":"sc-2026-A1","t":"scale","s":"2026","id":"A1","series":"highlights","title":"争抢","group":"争抢","note":"双方队员的身体接触属于合理的身体对抗，不犯规。","reason":"Fair Challenge","varrule":"","video":"videos/scale/2026/highlights-A1.mp4","poster":"assets/scale/2026-fouls-misconduct-highlights-A1.png","dec":[{"label":"不犯规","active":true},{"label":"间接任意球","active":false},{"label":"直接任意球","active":false},{"label":"罚球点球","active":false},{"label":"不出牌","active":true},{"label":"黄牌","active":false},{"label":"红牌","active":false}]},{"k":"sc-2026-A2","t":"scale","s":"2026","id":"A2","series":"highlights","title":"争抢","group":"争抢","note":"绿队35号队员使用合理的铲球动作踢到球，在触球后没有附加动作，同时双腿有回收和躲避对方的行为，该情况不构成犯规。","reason":"Fair Challenge","varrule":"","video":"videos/scale/2026/highlights-A2.mp4","poster":"assets/scale/2026-fouls-misconduct-highlights-A2.png","dec":[{"label":"不犯规","active":true},{"label":"间接任意球","active":false},{"label":"直接任意球","active":false},{"label":"罚球点球","active":false},{"label":"不出牌","active":true},{"label":"黄牌","active":false},{"label":"红牌","active":false}]},{"k":"sc-2026-A3","t":"scale","s":"2026","id":"A3","series":"highlights","title":"争抢","group":"争抢","note":"紫队１９号队员在争抢球过程中试图去踢球，但缺乏注意力和对对方的考虑。踢球时冒着一定的风险，在对方将球踢出后踢到对方，属于草率地踢对方犯规，应判直接任意球，没有纪律处罚。","reason":"Fair Challenge","varrule":"","video":"videos/scale/2026/highlights-A3.mp4","poster":"assets/scale/2026-fouls-misconduct-highlights-A3.png","dec":[{"label":"不犯规","active":false},{"label":"间接任意球","active":false},{"label":"直接任意球","active":true},{"label":"罚球点球","active":false},{"label":"不出牌","active":true},{"label":"黄牌","active":false},{"label":"红牌","active":false}]},{"k":"sc-2026-A4","t":"scale","s":"2026","id":"A4","series":"highlights","title":"争抢","group":"争抢","note":"绿队31号队员在与对方争抢球过程中，使用鞋钉踩踏到对方的踝关节及以下部位。但是，其右脚跟支撑在地面，减轻了接触的力量，并且接触的强度和速度都是中等，属于鲁莽地抢截对方，应判直接任意球，黄牌警告。","reason":"Fair Challenge","varrule":"","video":"videos/scale/2026/highlights-A4.mp4","poster":"assets/scale/2026-fouls-misconduct-highlights-A4.png","dec":[{"label":"不犯规","active":false},{"label":"间接任意球","active":false},{"label":"直接任意球","active":true},{"label":"罚球点球","active":false},{"label":"不出牌","active":false},{"label":"黄牌","active":true},{"label":"红牌","active":false}]},{"k":"sc-2026-A5","t":"scale","s":"2026","id":"A5","series":"highlights","title":"争抢","group":"争抢","note":"绿队2号队员在与对方争抢球过程中，将腿伸直用鞋钉使用过分的力量蹬踹对方膝关节和小腿部位，危及对方安全，属于使用过分的力量抢截对方，应判直接任意球，并出示红牌罚令出场。 在使用VAR技术的比赛中，如果裁判员未出示红牌，则视频助理裁判员需要介入，并建议裁判员在场回看。","re function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function crest(team, h, mark){
  const item = DATA.teams && DATA.teams[team];
  if (!item) return `<span class="team-badge" title="${esc(team)}：未登记">?</span>`;
  if (item.status === "verified" && item.path)
    return `<img class="crest" style="height:${h}px" src="${item.path}" alt="${esc(team)}队徽">`;
  if (mark)
    return `<span class="team-dot" style="width:${h}px;height:${h}px;background:${item.bg};border:1px solid ${item.fg}" title="${esc(team)}：队徽待核验"></span>`;
  const scale = Math.max(16, h);
  return `<span class="team-badge" style="width:${scale}px;height:${scale}px;--badge-fg:${item.fg};--badge-bg:${item.bg}" title="${esc(team)}：文字徽章（队徽待核验）">${esc(item.initials)}</span>`;
}

// ---------- 错题本 ----------
let wrong = {};
try { wrong = JSON.parse(localStorage.getItem(CFG.wrongKey) || "{}") || {}; } catch(_) { wrong = {}; }
function persistWrong(){ try { localStorage.setItem(CFG.wrongKey, JSON.stringify(wrong)); } catch(_) {} }
function recordWrong(q, your, score){
  const e = wrong[q.k] || {t:q.t, s:q.s, star:false, wrong:0};
  // 记下正确答案文本，错题本才能对照复盘（旧版本条目无此字段，渲染时兼容）
  e.correct = score && score.detail
    ? score.detail.map(d=>d.right).join(q.t==="case" ? " + " : "、") : "";
  e.t = q.t; e.s = q.s; e.your = your;
  e.wrong = (e.wrong||0) + 1; e.last = Date.now(); e.done = false;
  wrong[q.k] = e; persistWrong();
}
function qTitle(q){
  if (q.t === "case")
    return `${esc(q.comp)}${q.round?esc(q.round):""}${q.minute?" · 第"+q.minute+"分钟":""} · ${q.s}赛季第${q.issue}期-判例${q.no}`;
  return `尺度场景 ${esc(q.id)} · ${esc(q.title)}（${q.s}）`;
}
function qLink(q){
  return q.t === "case" ? `season-${q.s}.html#case-${q.seq}`
                        : `scale.html#h${q.s}-${q.series}-${q.id}`;
}

function pool(){
  let list = DATA.bank;
  if (sel.src !== "all") list = list.filter(q=>q.t===sel.src);
  if (sel.seasons.size) list = list.filter(q=>sel.seasons.has(q.s));
  if (sel.range === "wrong") list = list.filter(q=>wrong[q.k]);
  if (sel.range === "star") list = list.filter(q=>wrong[q.k] && wrong[q.k].star);
  return list;
}

  const n = Object.keys(wrong).length;

function renderWbList(){
  const entries = Object.entries(wrong);
  document.getElementById("wbList").innerHTML = entries.length ? entries.map(([k,e])=>{
    const q = BANK[k]; if (!q) return "";
    const yourTxt = e.t==="case" ? axisText(e.your) : (e.your||[]).join("、") || "（未作答）";
    const corrTxt = e.t==="case" ? (e.correct||"") : (e.correct&&e.correct.join ? e.correct.join("、") : (e.correct||""));
    return `<div class="wbitem">
      <div class="wbm"><div>${qTitle(q)}</div>
      <div class="wbyour">上次错选：${esc(yourTxt)}${corrTxt?` · 正确：${esc(corrTxt)}`:""}${e.done?" · 已掌握":""}</div></div>
      <button class="btn wbbtn" data-star="${k}">${e.star?"★":"☆"}</button>
      <button class="btn wbbtn" data-del="${k}">移除</button>
      <a class="btn wbbtn" href="${qLink(q)}">查看</a>
    </div>`;
  }).join("") : `<p style="color:var(--muted);font-size:13px">错题本为空——完成一轮答题后，未得满分的题会自动记入。</p>`;
}
function axisText(y){
  if (!y) return "（未作答）";
  const parts = [];
  if (y.v) parts.push(VNAME[y.v]||y.v);
  if (y.r) parts.push(RNAME[y.r]||y.r);
  if (y.c) parts.push(CNAME[y.c]||y.c);
  return parts.join(" + ") || "（未作答）";
}

let round = null;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startRound(list){
  let qs = shuffle(list.slice());
  if (sel.count > 0) qs = qs.slice(0, sel.count);
  round = {qs, i:0, mode:sel.mode, answers:qs.map(()=>null), scores:qs.map(()=>null), locked:false};
  showScreen("quiz");
  renderQuestion();
}
function showScreen(name){
  document.getElementById("scrStart").style.display = name==="start"?"":"none";
  document.getElementById("scrQuiz").style.display = name==="quiz"?"":"none";
  document.getElementById("scrResult").style.display = name==="result"?"":"none";
  document.getElementById("scroll").scrollTop = 0;
}
function stopVideo(){
  const v = document.getElementById("qvid");
  if (!v) return;
  try { v.pause(); } catch(_){}
  v.removeAttribute("src"); v.load();
}

function renderQuestion(){
  const q = round.qs[round.i];
  round.locked = false;
  const done = round.scores[round.i] != null;
  document.getElementById("qProgress").textContent = `第 ${round.i+1} / ${round.qs.length} 题`;

      .filter(Boolean).join(" · ");
    head = `<span class="badge info">判例</span><h2 class="match">${match}</h2>
      <span class="qmeta">${q.s}赛季第${q.issue}期-判例${q.no}${q.catname?" · "+esc(q.catname):""}</span>`;
  } else {
    head = `<span class="badge info">尺度场景</span><h2 class="match">${esc(q.title)}</h2>

  }

    vidHtml = `<div class="qvideo"><video id="qvid" controls preload="metadata" playsinline referrerpolicy="no-referrer"${poster}></video></div>

  } else {
    const links = q.t==="case"

  }
  // 题面
  const text = q.t==="case"
    ? `<p class="qtext">${esc(q.desc.replace(/^判例[一二三四五六七八九十百]+[：:]/,"").trim())}</p>`
    : `<p class="qtext">${esc(q.note)}</p>`;
  const appeal = (q.t==="case" && q.appeal)
    ? `<details class="qappeal"><summary>查看申诉方主张（提示）</summary><p>${esc(q.appeal.replace(/^[^：]*申诉意见认为：/,"").trim())}</p></details>` : "";
  document.getElementById("qCard").innerHTML = `<div class="qhead">${head}</div>${vidHtml}${text}${appeal}`;
  // 视频接线（本地 404 → 官方直链）
  if (!LITE){
    const v = document.getElementById("qvid");
    const tip = document.getElementById("vidTip");
    if (q.t==="case" && vidsMissing && (q.vurls||[])[0]){
      v.dataset.oss = "1";
      v.src = q.vurls[0];
      if (tip){ tip.textContent = "本地视频缺失，已自动改用官方直链在线播放。"; tip.style.display = ""; }
    }
    else if (q.t==="case") v.src = "videos/"+q.videos[0];
    else v.src = q.video;
  }
  // 表单（已作答且练习已提交时还原为锁定态）
  const saved = round.answers[round.i];
  if (q.t === "case"){
    const axes = [`<div class="axis"><div class="ah">① 评议组复核结论 <small>必答 · 1分</small></div><div class="optrow">` +
      V_OPTS.map(([v,n])=>`<button class="chip opt ${saved&&saved.v===v?"on":""}" data-axis="v" data-v="${v}">${n}</button>`).join("") + `</div></div>`];
    if (q.ans && q.ans.r)
      axes.push(`<div class="axis"><div class="ah">② 正确的判罚决定 <small>1分</small></div><div class="optrow">` +

  fb.classList.remove("on"); fb.innerHTML = "";
  if (done){ round.locked = true; renderFeedback(q, saved); }
  syncButtons();
}
function currentAnswer(){
  const q = round.qs[round.i];

    const a = {v:null, r:null, c:null};
    document.querySelectorAll("#qForm .opt.on").forEach(b=>{
      a[b.dataset.axis] = b.dataset.v;
    });
    return a;
  }
  return Array.from(document.querySelectorAll("#qForm .opt.on")).map(b=>b.dataset.dec);

function syncButtons(){
  const done = round.scores[round.i] != null && round.mode==="practice";
  document.getElementById("btnPrev").disabled = round.i===0;
  document.getElementById("btnSkip").style.display = done ? "none" : "";
  const submit = document.getElementById("btnSubmit");
  if (round.mode === "practice"){
    submit.textContent = done ? (round.i===round.qs.length-1 ? "查看结果" : "下一题")
                              : (round.i===round.qs.length-1 ? "提交并查看结果" : "提交答案");
  } else {
    submit.textContent = round.i===round.qs.length-1 ? "交卷查看结果" : "下一题";
  }
}

function scoreCase(q, a){
  const detail = [];
  let max = 1, got = 0;
  detail.push({name:"复核结论", ok:a.v===q.v, yours:a.v?VNAME[a.v]:"（未答）", right:VNAME[q.v]});
  if (a.v===q.v) got++;
  if (q.ans && q.ans.r){ max++;
    detail.push({name:"判罚决定", ok:a.r===q.ans.r, yours:a.r?RNAME[a.r]:"（未答）", right:RNAME[q.ans.r]});
    if (a.r===q.ans.r) got++;
  }
  if (q.ans && q.ans.c){ max++;
    detail.push({name:"纪律处分", ok:a.c===q.ans.c, yours:a.c?CNAME[a.c]:"（未答）", right:CNAME[q.ans.c]});
    if (a.c===q.ans.c) got++;
  }
  return {got, max, detail};
}
function scoreScale(q, selArr){
  const active = q.dec.filter(d=>d.active).map(d=>d.label);
  const fp = selArr.filter(x=>!active.includes(x));
  const miss = active.filter(x=>!selArr.includes(x));
  const got = (!fp.length && !miss.length) ? 2 : (!fp.length ? 1 : 0);
  return {got, max:2, detail:[
    {name:"判罚决定", ok:got===2, yours:selArr.length?selArr.join("、"):"（未答）", right:active.join("、")||"（无）"},
    {name:"错选/漏选", ok:!fp.length, yours:fp.length?("错选 "+fp.join("、")):"无错选", right:miss.length?("漏选 "+miss.join("、")):"无漏选"}
  ]};
}
function renderFeedback(q, a){
  const s = round.scores[round.i];
  const allOk = s.got === s.max;
  let h = `<div class="verdict"><span class="badge ${allOk?"correct":s.got>0?"pending":"wrong"}">${allOk?"完全正确":s.got>0?"部分正确":"错误"}</span>
    <b style="margin-left:8px">得分 ${s.got} / ${s.max}</b></div>`;
  h += s.detail.map(d=>`<div class="fitem"><span class="${d.ok?"ok":"bad"}">${d.ok?"✓":"✗"} ${d.name}</span>
    <span>你的答案：${esc(d.yours)}</span>${d.ok?"":`<span>正确：${esc(d.right)}</span>`}</div>`).join("");
  if (q.t === "case"){
    h += `<div class="concl"><b>评议组认定：</b>${esc(q.concl.replace(/^对于此判[例罚]，评议组[^：]*认为：/,"").trim())}</div>`;
  } else {
    if (q.reason) h += `<div class="concl"><b>Reason：</b>${esc(q.reason)}</div>`;
    if (q.varrule) h += `<div class="concl"><b>⚖ VAR 介入：</b>${esc(q.varrule)}</div>`;
  }
  const e = wrong[q.k];
  h += `<div class="srclinks">
    <button class="btn" id="fbStar">${e&&e.star?IC["star-f"]+" 已收藏":IC.star+" 收藏错题"}</button>
    <a class="btn" href="${qLink(q)}" target="_blank">${IC.external} 查看原判例</a>
    ${wrong[q.k]&&wrong[q.k].wrong>1?`<span style="font-size:12px;color:var(--muted)">已错 ${wrong[q.k].wrong} 次</span>`:""}
  </div>`;
  const fb = document.getElementById("qFb");
  fb.classList.remove("fb-ok", "fb-part", "fb-miss");
  fb.innerHTML = h;
  fb.classList.add("on", s.got===s.max ? "fb-ok" : s.got>0 ? "fb-part" : "fb-miss");
  document.getElementById("fbStar").onclick = ()=>toggleStar(q.k);
}
function toggleStar(k){
  if (!wrong[k]) return;
  wrong[k].star = !wrong[k].star; persistWrong(); renderWbStats();
  const btn = document.getElementById("fbStar");
  if (btn) btn.innerHTML = wrong[k].star ? IC["star-f"]+" 已收藏" : IC.star+" 收藏错题";
}

// ---------- 提交与导航 ----------
function submitAnswer(){
  const q = round.qs[round.i];
  if (round.mode === "practice"){
    const done = round.scores[round.i] != null;
    if (!done){
      const a = currentAnswer();
      const s = q.t==="case" ? scoreCase(q, a) : scoreScale(q, a);
      round.answers[round.i] = a; round.scores[round.i] = s;
      if (s.got < s.max) recordWrong(q, a, s);
      else if (wrong[q.k]){ wrong[q.k].done = true; persistWrong(); }
      round.locked = true;
      renderFeedback(q, a);
      syncButtons();
      return;
    }
    if (round.i < round.qs.length-1){ round.i++; renderQuestion(); }
    else showResult();
    return;
  }
  // 考试模式：只记录答案，可返回修改，交卷时统一判分与记错题
  round.answers[round.i] = currentAnswer();
  if (round.i < round.qs.length-1){ round.i++; renderQuestion(); }
  else finishExam();
}
function finishExam(){
  round.qs.forEach((q,i)=>{
    const a = round.answers[i] || (q.t==="case" ? {v:null,r:null,c:null} : []);
    const s = q.t==="case" ? scoreCase(q, a) : scoreScale(q, a);
    round.scores[i] = s;
    if (s.got < s.max) recordWrong(q, a, s);
    else if (wrong[q.k]){ wrong[q.k].done = true; }
  });
  persistWrong();
  showResult();
}
function gotoPrev(){
  if (round.i>0){
    // 暂存当前作答再离开：考试模式来回查看、练习模式未提交返回都不丢
    if (round.scores[round.i] == null) round.answers[round.i] = currentAnswer();
    round.i--; renderQuestion();
  }
}
function skipQuestion(){
  const q = round.qs[round.i];
  const a = q.t==="case" ? {v:null,r:null,c:null} : [];
  const s = q.t==="case" ? scoreCase(q, a) : scoreScale(q, a);
  round.answers[round.i] = a; round.scores[round.i] = s;
  recordWrong(q, a, s);
  if (round.i < round.qs.length-1){ round.i++; renderQuestion(); }
  else showResult();
}
function countUp(el, got, max){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return; // 文本已是终值
  const t0 = performance.now(), dur = 700;
  (function tick(t){
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = `${Math.round(got * e)} / ${max}`;
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}
function showResult(){
  stopVideo();
  const totalGot = round.scores.reduce((s,x)=>s+(x?x.got:0),0);
  const totalMax = round.scores.reduce((s,x)=>s+(x?x.max:0),0);
  const pct = totalMax ? Math.round(totalGot/totalMax*100) : 0;
  document.getElementById("rScore").textContent = `${totalGot} / ${totalMax}`;
  countUp(document.getElementById("rScore"), totalGot, totalMax);
  document.getElementById("rPct").textContent = `得分率 ${pct}%`;
  document.getElementById("rRate").textContent =
    pct>=90 ? "优秀——尺度把握扎实，继续保持！" :
    pct>=75 ? "良好——注意复盘错题，堵上薄弱点。" :
    pct>=60 ? "及格——建议把错题加入收藏反复练习。" :
              "还需要加油——先从错题重练开始，逐类攻克。";
  document.getElementById("rList").innerHTML = round.qs.map((q,i)=>{
    const s = round.scores[i] || {got:0, max:0, detail:[]};
    const a = round.answers[i];
    const allOk = s.got===s.max;
    const missTxt = s.detail.filter(d=>!d.ok).map(d=>`${d.name}：正确 ${d.right}`).join("；");
    return `<div class="rrow" style="--i:${Math.min(i,12)}"><span class="rmark ${allOk?"hit":"miss"}">${allOk?"✓":s.got>0?"△":"✗"}</span>
      <div class="rmain"><div>${qTitle(q)}</div>
      <div class="rt">你的答案：${esc(q.t==="case"?axisText(a):(a||[]).join("、")||"（未答）")} ｜ 得分 ${s.got}/${s.max}${!allOk&&missTxt?` ｜ <span class="miss">${esc(missTxt)}</span>`:""}</div></div>
      <a class="btn wbbtn" href="${qLink(q)}">查看</a></div>`;
  }).join("");
  renderWbStats();
  showScreen("result");
}

// ---------- 事件绑定 ----------
document.querySelectorAll(".seg").forEach(seg=>{
  seg.addEventListener("click", e=>{
    const b = e.target.closest("button"); if (!b) return;
    seg.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
    const id = seg.id;
    if (id==="segMode") sel.mode = b.dataset.v;
    if (id==="segCount") sel.count = +b.dataset.v;
    if (id==="segSrc") sel.src = b.dataset.v;
    if (id==="segRange") sel.range = b.dataset.v;
    updatePoolTip();
  });
});
document.getElementById("seasonChips").addEventListener("click", e=>{
  const b = e.target.closest("[data-s]"); if (!b) return;
  const s = b.dataset.s;
  if (!s){ sel.seasons.clear(); }
  else if (sel.seasons.has(s)) sel.seasons.delete(s);
  else sel.seasons.add(s);
  // 高亮跟随 sel.seasons 状态（多选可同时亮多个），不能只亮最后点击的一个
  document.querySelectorAll("#seasonChips .chip").forEach(x=>
    x.classList.toggle("on", (!x.dataset.s && !sel.seasons.size) || sel.seasons.has(x.dataset.s)));
  updatePoolTip();
});
document.getElementById("btnStart").onclick = ()=>startRound(pool());
document.getElementById("btnWb").onclick = ()=>{
  const box = document.getElementById("wbBox");
  box.style.display = box.style.display==="none" ? "" : "none";
  renderWbList();
};
document.getElementById("btnWbClear").onclick = ()=>{
  if (!Object.keys(wrong).length) return;
  if (confirm("确定清空整个错题本？此操作不可恢复。")){ wrong = {}; persistWrong(); renderWbStats(); renderWbList(); }
};
document.getElementById("wbList").addEventListener("click", e=>{
  const st = e.target.closest("[data-star]");
  if (st){ const k = st.dataset.star; wrong[k].star = !wrong[k].star; persistWrong(); renderWbStats(); renderWbList(); return; }
  const del = e.target.closest("[data-del]");
  if (del){ delete wrong[del.dataset.del]; persistWrong(); renderWbStats(); renderWbList(); }
});
document.getElementById("btnExport").onclick = ()=>{
  const blob = new Blob([JSON.stringify({wrong, exported:new Date().toISOString(), app:"cfa-referee-quiz"}, null, 1)],
    {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "考题错题本.json";
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById("btnImport").onclick = ()=>document.getElementById("importFile").click();
document.getElementById("importFile").addEventListener("change", e=>{
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try {
      const d = JSON.parse(rd.result);
      let n = 0;
      for (const [k, v] of Object.entries(d.wrong||{})){
        if (!BANK[k]) continue;
        if (!wrong[k] || (v.last||0) >= (wrong[k].last||0)){ wrong[k] = v; n++; }
      }
      persistWrong(); renderWbStats();
      if (document.getElementById("wbBox").style.display !== "none") renderWbList();
      alert(`导入完成：合并了 ${n} 条错题记录`);
    } catch(err){ alert("导入失败：文件不是有效的错题本 JSON"); }
  };
  rd.readAsText(f, "utf-8");
  e.target.value = "";
});
// 答题表单：单选/多选 chips
document.getElementById("qForm").addEventListener("click", e=>{
  const b = e.target.closest(".opt"); if (!b || round.locked) return;
  const q = round.qs[round.i];
  if (q.t === "case"){
    const axis = b.dataset.axis;
    document.querySelectorAll(`#qForm .opt[data-axis="${axis}"]`).forEach(x=>x.classList.toggle("on", x===b));
  } else {
    b.classList.toggle("on");
  }
});
document.getElementById("btnSubmit").onclick = submitAnswer;
document.getElementById("btnSkip").onclick = skipQuestion;
document.getElementById("btnPrev").onclick = gotoPrev;
document.getElementById("btnAgain").onclick = ()=>startRound(round.qs);
document.getElementById("btnWrongRedo").onclick = ()=>{
  const list = round.qs.filter(q=>wrong[q.k]);
  if (list.length) startRound(list); else startRound(round.qs);
};
document.getElementById("btnBack").onclick = ()=>{ renderWbStats(); updatePoolTip(); showScreen("start"); };
document.getElementById("btnTop").onclick = ()=>document.getElementById("scroll").scrollTo({top:0,behavior:"smooth"});

// 视频两级回退（本地缺失 → 官方直链）
let vidsMissing = false;
document.getElementById("qCard").addEventListener("error", e=>{
  if (e.target.id !== "qvid") return;
  const q = round && round.qs[round.i];
  if (!q || q.t !== "case") return;
  const url = (q.vurls||[])[0];
  const v = document.getElementById("qvid");
  const tip = document.getElementById("vidTip");
  if (url && v.dataset.oss !== "1"){
    v.dataset.oss = "1"; vidsMissing = true;
    v.src = url;
    if (tip){ tip.textContent = "本地视频缺失，已自动改用官方直链在线播放。"; tip.style.display = ""; }
  } else if (v.dataset.oss === "1" && tip){
    // 官方直链也失败：不再无提示地静默卡死
    tip.textContent = "官方直链播放失败，可从判例页打开官方评议页观看。";
    tip.style.display = "";
  }
}, true);

// ---------- 初始化 ----------
document.addEventListener("cfa:lite", ()=>{
  LITE = document.documentElement.dataset.lite==="1";
  // 答题中途切轻量版：暂存当前作答并重渲染，让视频窗口按新模式显隐
  if (round && document.getElementById("scrQuiz").style.display !== "none"){
    if (round.scores[round.i] == null) round.answers[round.i] = currentAnswer();
    renderQuestion();
  }
});
renderSeasonChips(); renderWbStats(); updatePoolTip();
