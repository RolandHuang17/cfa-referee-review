const DATA = {"season":"2026/27","sections":[{"id":"intro","title":"引言","pages":"11-16","html":"<p>足球是世上最受欢迎的运动。各大洲乃至每个国家都进行不同级别的足球运动。事实上，无论是世界杯足球赛决赛或是偏远小村儿童之间的足球比赛，全球的足球运动都遵守同一个足球竞赛规则，而这具有相当的力量，并为了造福全球足球发展，此必须持续加以利用。</p>\n<p>为了维持比赛公平，足球赛需要一套规则，这是精彩球赛的重要基础，同时是比赛精神的一个重要特质。最精彩的比赛是毋需裁判员多次介入，尤其球员之间互相尊重，同时亦尊重比赛官员和球例。</p>\n<p>相对于其他大部分的团队运动，足球竞赛规则相对简单易明。然而，大部分情况的看法都是主观的，加上比赛官员身为人，无可避免会做出错误判决或引起争议和讨论。对部分人员而言，讨论亦是球赛的乐趣和吸引力，但是，无论判决是对或错，比赛精神是应该对裁判员做出的决定给予尊重。至于权威人员，尤其是教练和领队，更有责任带头对比赛官员及其决定表示尊重。</p>\n<p>因规则无法顾及每一种可能发生情况，如规则中没有提及直接处理的方法时，国际足球协会委员会期望裁判员能根据比赛精神和规则做出判决。这种情况就引出了一个问题：「足球其实要求/_期望什么判决？」参与者的不正当行为，以及蓄意拖延时间以打断比赛流畅度的问题，仍然是我们关注的两大重点。继成功实施「仅限队长」指引及守门员持球超过八秒即判罚角球予对方的新措施后，我们已采取进一步措施，以应对故意扰乱比赛节奏及浪费时间的行为。裁判员现已获授予更大权力，以打击在处理界外球、球门球、球员受伤及替换球员等情况下的各种拖延时间策略。</p>\n<p>规则也必须促进球员的安全和福利，国际足球总会理事会有责采取迅速恰当的回应，透过规则支持比赛参与者。</p>\n<p>因此，竞赛组织可选择使用「额外永久替换脑震荡球员」，让球队优先处理实际或疑似出现脑震荡球员，避免球员人数不足的情况。</p>\n<p>虽然意外无法避免，规则力求维持比赛安全、平衡球员的福利及运动的公平性。为此，裁判员需要利用规则严格处理作出过于激烈或危险动作的球员。规则中的纪律内容，如「鲁莽拦截」、「危害对方的安全」或「过度使用力量」已表明在比赛中出现这些危险行为是不被接受的。</p>\n<p>为加深公众对规则的理解，国际足球协会委员会推出《足球规则-简化版足球竞赛规则》，特别针对年轻人、有潜力成为或新晋合资格裁判员、业余成年裁判员、球员、教练、观众及媒体，让他们更容易理解规则。</p>\n<p>请浏览www.footballrules.com查阅或下载《足球规则》，并可按字母或类别快速搜索。</p>\n<p>《足球竞赛规则》声音版本载于：www.theifab.com。</p>\n<p>足球必须维持对球员、比赛官员、教练以至于观众、球迷和行政人员具有吸引力，并为他们带来乐趣，这与年龄、性别、种族、宗教、文化、民族、性取向或残疾无关。</p>\n<p>维持足球竞赛规则「普及统一」亦同样重要，让年轻球员在电视上观赏比赛，并落场重现比赛风采。因此，任何规则修订必须更有利于足球比赛，而有关变更提议通常需要接受测试及/或试验。</p>\n<p>对于每一项提出的变更，我们都会注重其公平性、整体性、尊重、安全性、参与者和观众能否乐在其中，以及如何使用合适的科技令球赛受益。</p>\n<p>国际足球协会委员会将继续与咨询小组合作并广泛咨询持份者，以确保规则的变更能使各个层面和全球各地的足球发展带来益处，确保比赛的完整性、规则本身和比赛官员受到尊重、重视和保护。</p>\n<p>国际足球协会委员会非常重视与来自全球的人员互动，并欢迎接受各种关于足球竞赛规则的建议或提问。我们欢迎您继续将想法、建议和问题发送至：lawenquiries@theifab.com.有关《足球竞赛规则》的过往及目前发展（包括试验）详情，请浏览我们的网站：www.theifab.com。</p>"},{"id":"overview","title":"规则概述·须知事项及修订","pages":"17-27","html":"<p>官方语言国际足球协会委员会以英语、法语、德语和西班牙语发布规则。在措辞上如有分歧，以英文文本为准。</p>\n<p>其他语言各国足球协会可透过info@theifab.com联络国际足球协会委员会，以获取2026/27年修订版本的足球竞赛规则范本设计作翻译用途。</p>\n<p>国际足球协会委员会欢迎各地足球总会将使用此范本翻译之译本传送至本会(在封面上明确说明是国家足球总会的官方翻译)。译本将于本会网站刊登，供其他使用者阅读。</p>\n<p>度量衡如果公制单位与英制单位之间出现分歧，则以公制单位为准。</p>\n<p>规则的应用所有规则于不同联盟、国家、地区或村落均为一致。除了国际足球协会委员会允许的修订外(参阅「可更改之规则」)，如未获得国际足球协会委员会批准，所有其他规则均不得修改或变更。</p>\n<p>培训裁判员或其他参与者时，应强调：</p>\n<ul>\n<li>裁判员执行规则时应考虑比赛精神，以营造公平安全的比赛环境</li>\n</ul>\n<ul>\n<li>所有人应明白裁判员身为人，有时也会犯错，所以必须尊重裁判员及他们的决定球员肩负维护球赛形象的重大责任，而球队队长则应发挥重要作用，确保规则及裁判员的决定获得尊重。</li>\n</ul>\n<p>重点规则的主要变更字句下有黄色划线，并在边界空白处强调此变更。</p>\n<p>编辑修改有下划线。</p>\n<p>YC = 黄牌 (警告)； RC = 红牌 (罚令出场)。</p>\n<p>在世界各地及各水平比赛中所采用的规则应是一致的，亦应能营造一个公平和安全的比赛环境，鼓励更多人员参与及享受足球运动。</p>\n<p>国际足球协会委员会早前已经准许各国足球总会在特定界别足球赛事有弹性地修改「组织性」条例。国际足球协会委员深信，如修订更有利各足球总会发展其足球，各足球总会应可修改部分其「组织性」条例。</p>\n<p>从偏远村落进行的小童足球比赛以至世界杯足球赛决赛的赛事，应用于足球比赛的规则应是一致的。然而，因应各国自身足球的需要，有必要让他们自行制订比赛时间、多少球员可参与球赛及如何处罚一些不正当行为。</p>\n<p>各国足球总会（及洲际足球协会和国际足球协会）负责的赛事可根据其意愿选择更改全部或部分以下「组织性」规则：</p>\n<p>于所有级别赛事：</p>\n<ul>\n<li>除青少年或足球总会、洲际足球协会或国际足球协会已订明最多替换球员名额的赛事外，允许球队可使用最多五名*替换球员名额</li>\n</ul>\n<ul>\n<li>使用额外永久替换脑震荡球员（国际足球协会委员会协定应用）</li>\n</ul>\n<ul>\n<li>实行「仅限队长」指引（将自2027年7月1日起对所有赛事强制实行）</li>\n</ul>\n<p class=\"fn\">*至于适用于加时比赛相关规则及换人机会限制之详情，可参</p>\n<p>阅规则第3章。</p>\n<p>于青少年、老年、残疾人员及草根足球赛事中可更改的规则：</p>\n<ul>\n<li>比赛场地的大小</li>\n</ul>\n<ul>\n<li>球的尺寸、重量及物料</li>\n</ul>\n<ul>\n<li>两球门柱之间阔度及由地面至球门横梁底的高度</li>\n</ul>\n<ul>\n<li>上下半场(相同时间)比赛时间(及相同加时上下半场时间)</li>\n</ul>\n<ul>\n<li>球员人数</li>\n</ul>\n<ul>\n<li>重返替换</li>\n</ul>\n<ul>\n<li>采用暂时罚令出场(短暂离场区域)代替部分/所有黄牌警告</li>\n</ul>\n<ul>\n<li>队长必须佩戴队长的具体要求</li>\n</ul>\n<p>另外，为协助及发展本地足球，准许各足总有更大的自由度为各「类别」足球更改以下相关规则：</p>\n<ul>\n<li>各国足球总会、洲际足球协会及国际足球协会有自由度为青少年及老年足球赛事订定年龄限制</li>\n</ul>\n<ul>\n<li>各国足球总会可自行更改哪一最低级别足球赛事为「草根」足球</li>\n</ul>\n<p>国际足球协会委员会试验在某些情况下，规则变更提议需要接受测试或试验，以评估其可能对比赛产生的预期和意外影响。</p>\n<p>洲际足球协会、各国足球总会及竞赛组织必须获得国际足球协会委员会的许可，才能参加任何此类试验。</p>\n<p>在 2026/27 年度，国际足球协会委员会将主要集中处理因守门员受伤造成延误的相关试验，并会继续研究其他可行的越位概念。</p>\n<p>有关所有试验的详情及协定，请浏览www.theifab.com（「试验」部分）。</p>\n<p>如欲申请参加任何试验，可透过以下方式联络国际足球协会委员会：trials@theifab.com。</p>\n<p>简介此协定关乎第3章，规定被换下的球员须在十秒内离开比赛场地，以防止浪费时间及打乱比赛节奏。</p>\n<p>程序</p>\n<ul>\n<li>当替换讯号板被展示后，或在没有替换讯号板的情况下，当裁判员发出替换球员讯号后*，被换下的球员必须离开比赛场地：</li>\n</ul>\n<ul>\n<li class=\"l2\">于十秒内</li>\n</ul>\n<ul>\n<li class=\"l2\">从最近的界线离开比赛场地，除非裁判员另有指示</li>\n</ul>\n<p class=\"fn\">*如果裁判员在中场线检查替补队员的装备，十秒倒计时将于检查完</p>\n<p>成并裁判员发出替换球员讯号后开始。</p>\n<ul>\n<li>裁判员可举手示意倒计时最后五秒；在适当情况下，此倒计时可伴随口头倒计时。</li>\n</ul>\n<ul>\n<li>如果被换下的球员未能在十秒内离开比赛场地：</li>\n</ul>\n<ul>\n<li class=\"l2\">他们仍须尽快离开比赛场地</li>\n</ul>\n<ul>\n<li class=\"l2\">替补队员不准进入比赛场地</li>\n</ul>\n<ul>\n<li class=\"l2\">比赛重新开始</li>\n</ul>\n<ul>\n<li class=\"l2\">该换人决定不得取消，而替补队员亦不得更改。</li>\n</ul>\n<ul>\n<li class=\"l2\">替补队员只可在重新开始比赛一分钟届满后的首次比赛暂停时，并在收到裁判员的讯号后方可进场</li>\n</ul>\n<ul>\n<li>该一分钟的计时将持续进行，并由裁判员决定；其他赛事执法人员可从旁协助。</li>\n</ul>\n<ul>\n<li>如果在一次比赛暂停期间进行多于一次替换球员，所有被换下的球员必须在最后一次换人的替换讯号板举起/讯号发出后的十秒内离场；在同一次比赛暂停期间进行的各次替换球员之间，不应延迟举牌/发出讯号。</li>\n</ul>\n<ul>\n<li>如果超过十秒时限而导致替补队员无法进场，则被换下的球员只有在过度拖延情况时，才会被黄牌警告。</li>\n</ul>\n<ul>\n<li>裁判员可决定不应用此十秒时限，情况包括：</li>\n</ul>\n<ul>\n<li class=\"l2\">球员的伤势明显使其无法在该时限内离场</li>\n</ul>\n<ul>\n<li class=\"l2\">基于安全/保安理由，球员无法从最近的界点离场</li>\n</ul>\n<p>由于倒计时的目的是透过防止浪费时间以维持比赛节奏，因此如果在裁判员完成倒计时时，被换下的球员已非常接近或正在跨越界线，则应容许替补队员进场。</p>\n<p>简介此协定关乎第5章的规定，即在场其他球员在比赛场地内接受评估及/或治理*，或因其伤势导致比赛暂停后，必须离开比赛场地，并在重新开始比赛后留在场外一分钟。</p>\n<p class=\"fn\">*第5章仅在特定情况下允许在比赛场地内治理（见下文）。</p>\n<p>其目的在于给予医疗人员在场外必要的时间，以评估球员的伤势并决定他们是否应继续比赛，同时亦为减少打乱比赛节奏。</p>\n<p>程序离开比赛场地一分钟的规定</p>\n<ul>\n<li>在下列一种或多种情况下，场上非守门员球员须在重新开始比赛后离开场地一分钟：</li>\n</ul>\n<ul>\n<li class=\"l2\">比赛因球员实际或怀疑受伤而暂停</li>\n</ul>\n<ul>\n<li class=\"l2\">裁判员已发出讯号让医疗人员进入比赛场地</li>\n</ul>\n<ul>\n<li class=\"l2\">裁判员询问球员是否需要在比赛场地内接受医疗协助，而球员已提出要求</li>\n</ul>\n<ul>\n<li>应给予医疗人员足够时间在比赛场地内进行初步评估，但除非伤势严重，否则不应在比赛场地内为球员治理。</li>\n</ul>\n<ul>\n<li>完成任何初步评估后，球员必须离开比赛场地（下文列出的情况除外），并一直留在比赛场地外，直至比赛重新开始及一分钟（持续计时）届满为止。离开比赛场地一分钟的时段</li>\n</ul>\n<ul>\n<li>离开比赛场地一分钟的时段由比赛重新开始时计起。</li>\n</ul>\n<ul>\n<li>该一分钟的计时将持续进行，并由裁判员决定；其他赛事执法人员可从旁协助。</li>\n</ul>\n<ul>\n<li>球员只有在获得裁判员的准许后方可重返比赛场地。</li>\n</ul>\n<ul>\n<li>如比赛进行时，受伤球员必须于边线再次进入比赛场地。如比赛暂停时，受伤球员可从任何界线再次进入比赛场地。</li>\n</ul>\n<ul>\n<li>如果受伤球员被换下，换人程序不受延误。</li>\n</ul>\n<ul>\n<li>如果上半场在一分钟届满前结束，该球员可自下半场开始时重返比赛场地；此原则适用于：</li>\n</ul>\n<ul>\n<li class=\"l2\">正常比赛时间结束至加时比赛开始之间的时段</li>\n</ul>\n<ul>\n<li class=\"l2\">加时比赛的中场休息</li>\n</ul>\n<ul>\n<li class=\"l2\">加时比赛结束至点球（射点球决胜）之间的时段</li>\n</ul>\n<p>在下列情况下，球员毋须离开比赛场地一分钟：</p>\n<ul>\n<li>球员：</li>\n</ul>\n<ul>\n<li class=\"l2\">表示他们不需要医疗协助，除非比赛是因其伤势而暂停；或</li>\n</ul>\n<ul>\n<li class=\"l2\">在比赛进行中或暂停期间自愿离开比赛场地，前提是此举没有拖延重新开始比赛</li>\n</ul>\n<ul>\n<li>伤势属于第5章准许在比赛场地内治疗的情况：</li>\n</ul>\n<ul>\n<li class=\"l2\">守门员受伤</li>\n</ul>\n<ul>\n<li class=\"l2\">守门员与在场其他球员互相碰撞而同时都需要即时治理</li>\n</ul>\n<ul>\n<li class=\"l2\">同队球员互相相撞受伤而同时都需要即时治理</li>\n</ul>\n<ul>\n<li class=\"l2\">发生严重受伤情况，特别是头部受伤（例如脑震荡）、心脏问题或危及生命的事件（例如癫痫发作、窒息等）</li>\n</ul>\n<ul>\n<li class=\"l2\">如球员因被对方侵犯受伤，犯规球员因此而被黄牌警告或红牌罚令出场（例如鲁莽拦截或严重犯规）</li>\n</ul>\n<ul>\n<li class=\"l2\">该受伤球员为即将主射点球的球员简介此协定关乎第15章及第16章中的五秒倒计时，以防止在掷界外球及开球门球时浪费时间，以及避免打乱比赛节奏。如超过时限，将由对方球队重新开始比赛。</li>\n</ul>\n<p>程序当裁判员判断负责重新开始比赛的球队故意拖延掷界外球/开球门球时：</p>\n<ul>\n<li>裁判员可使用哨子及/或声音，示意球员加快速度/不要拖延重新开始比赛。</li>\n</ul>\n<ul>\n<li>为开始五秒倒计时（此倒计时可在没有上述提示下开始），裁判员将会：</li>\n</ul>\n<ul>\n<li class=\"l2\">鸣哨</li>\n</ul>\n<ul>\n<li class=\"l2\">用手/手臂清晰发出重新开始比赛的信号</li>\n</ul>\n<ul>\n<li class=\"l2\">举手示意倒计时五秒；在适当情况下，此倒计时可伴随口头倒计时</li>\n</ul>\n<ul>\n<li>若五秒倒计时结束时比赛仍未开始，裁判员将会：</li>\n</ul>\n<ul>\n<li class=\"l2\">将界外球判给对方球队，并于原来的位置掷出；或</li>\n</ul>\n<ul>\n<li class=\"l2\">将角球判给对方球队，并于最接近原球门球位置的一边开出</li>\n</ul>\n<ul>\n<li>当重新开始比赛权被判给对方时，只有在拖延情况过度或持续犯规的情况下，该犯规球员或其队友才会被黄牌警告。若该球员或其队友接著过度拖延对方重新开始比赛，他们将被黄牌警告。</li>\n</ul>\n<p>裁判员毋须等待球员持球，即可开始五秒倒计时。如果球员透过以下方式蓄意造成延误，倒计时亦可开始：</p>\n<ul>\n<li>缓慢地取回球</li>\n</ul>\n<ul>\n<li>于掷界外球时站在不正确的位置</li>\n</ul>\n<ul>\n<li>于开球门球时将球放于不正确位置</li>\n</ul>\n<p>由于倒计时的目的是防止在掷界外球和开球门球时浪费时间，以维持比赛节奏，因此如果裁判员完成倒计时时，球员正在执行掷球/踢球的动作，则不应被处罚。</p>"},{"id":"captain","title":"「仅限队长」指引","pages":"28-32","html":"<p>这些指引将自2027年7月1日或之后成为所有比赛的强制性协定简介尊重和公平是足球的核心价值观，但裁判员和其他比赛官员作出判决时经常会遭到言语及/或肢体上的抗议。在极端情况下，球员有时会冲向裁判员，包围或围堵他们，这表明对裁判员欠缺尊重，有损比赛形象，并且可能具有恐吓性和令人不安。</p>\n<p>裁判和队长之间加强合作有助培养公平和相互尊重。为此，为了让裁判员能够解释关键判决，只有队长才能接近裁判员，但前提是队长保持尊重态度，并且行为举止得体。同时，每位队长都有责任确保其队友与裁判员保持合理的距离，并且不 得干扰裁判员和球队队长之间的互动。</p>\n<p>以下简单的指引可协助期望应用「仅限队长」原则的竞赛组织。</p>\n<p>指引</p>\n<ul>\n<li>允许球员和裁判员之间正常互动，这一点仍然很重要（有助提高透明度并避免出现困扰和冲突）</li>\n</ul>\n<ul>\n<li>任何以言语或行动表示不满的球员（包括队长）将被黄牌警告</li>\n</ul>\n<ul>\n<li>裁判员将在适当的情况下向队长及/或涉及事件的球员解释重要判决</li>\n</ul>\n<ul>\n<li>为防止球员在重大情况下及在关键事件或判罚后围堵或包围裁判员：</li>\n</ul>\n<ul>\n<li class=\"l2\">每队只有一名球员（通常为队长）允许接近裁判员，并且在互动中必须一直保持尊重的态度</li>\n</ul>\n<ul>\n<li class=\"l2\">裁判员可以（口头或手势）指示/呼吁球员不要接近自己</li>\n</ul>\n<ul>\n<li class=\"l2\">球队队长有责任帮助引导队友远离裁判员</li>\n</ul>\n<ul>\n<li class=\"l2\">未经允许接近/包围裁判员的球员可能会被黄牌警告</li>\n</ul>\n<ul>\n<li class=\"l2\">在适当的情况下，裁判员可以延迟重新开始比赛，让队长有时间与队友交谈，以解释判决、要求守规矩等等。</li>\n</ul>\n<ul>\n<li>除队长以外的任何球员与裁判员的互动或接近裁判员由裁判员自行决定，例如，如果该球员犯规、被侵犯及/或受伤当队长是守门员的情况下</li>\n</ul>\n<ul>\n<li>如果守门员是队长，则必须在开始比赛前掷毫时或之前，通知裁判员谁是获指定的球员定代替守门员接近裁判员</li>\n</ul>\n<ul>\n<li>只有守门员或指定的球员其中一位可以接近裁判员</li>\n</ul>\n<ul>\n<li>如果指定的球员被替换或被罚令出场，则必须指定另一名球员接近裁判员</li>\n</ul>\n<p>青少年、老年、残疾人员及草根足球赛事的选项以下指引仅适用于青少年、老年、残疾人员及草根足球赛事：</p>\n<ul>\n<li>裁判员可以透过鸣哨并使用以下信号动用「仅限队长」指引：</li>\n</ul>\n<ul>\n<li class=\"l2\">将双臂举过头顶，并在手腕处交叉相叠</li>\n</ul>\n<ul>\n<li class=\"l2\">双臂分开，并将手掌张开向前推动，表示球员不得靠近</li>\n</ul>\n<ul>\n<li>此时，裁判员周围 4 米（4.5 码）的范围将成为「队长专用」区</li>\n</ul>\n<ul>\n<li>在适当的情况下，裁判员可以远离球员以划出「队长专用」区</li>\n</ul>\n<ul>\n<li>除每队的队长（应佩戴识别臂章）外，任何球员都不得进入「队长专用」区</li>\n</ul>\n<ul>\n<li>队长有责任鼓励队友尊重「队长专用」区，并与裁判员保持至少4 米（4.5 码）的距离</li>\n</ul>\n<ul>\n<li>如果除队长以外的一名球员进入「队长专用」区，该犯规人员应视作以行动表示不满而被黄牌警告</li>\n</ul>\n<ul>\n<li>如果球队多于一名球员进入「队长专用」区，则必须至少黄牌警告一名球员 - 这通常是第一个未经授权进入「队长专用」区的球员，或以最激烈的方式接近裁判员的球员</li>\n</ul>\n<ul>\n<li>任何球队多于一名未经授权球员进入「队长专用」区的事件都必须在赛后向相关部门汇报*</li>\n</ul>\n<p class=\"fn\">*强烈建议竞赛组织制定处罚措施，以处理球队多名球员进入「队</p>\n<p>长专用」区的情况。</p>\n<p>简介青少年、老年、残障及草根足球赛事采用暂时罚令出场（暂时离场区域）方式处理全部/部分黄牌警告，唯必须经举办赛事的足球总会、洲际足球协会或国际足球协会批准。</p>\n<p>第138届国际足球协会委员会年度大会批准「暂时罚令出场（暂时离场区域）指引」的修订版。</p>\n<p>暂时罚令出场的提述载于以下内文：</p>\n<p>第5章–裁判员</p>\n<h3>5.3 权力和职责 - 纪律行动</h3>\n<p>裁判员由进进球场开始直至比赛完结后，有权向球员出示黄牌或红牌，另外在竞赛规程准许下，亦有权判罚球员暂时离场，包括在中场休息时、加时比赛进行中及点球（射点球决胜）期间。</p>\n<p>暂时罚令出场的意思是当球员触犯一项应被黄牌警告的犯规时，该球员会被判罚即时「停止」参与继后比赛的部分时间。此「即时惩罚」哲理对于犯规球员与犯规球员之球队的行为，潜意识上能带来有效及即时正面的影响。</p>\n<p>各国足球总会、洲际足球协会及国际足球协会，应根据通过的暂时罚令出场协定（在赛事规则内公布）的指引进行：</p>\n<p>只适用于球员</p>\n<ul>\n<li>暂时罚令出场条例适用于全部球员（包括守门员），但当替补队员或已被换下球员触犯应被黄牌警告的犯规时，此条例并不适用</li>\n</ul>"},{"id":"overview2","title":"规则概述续编与换人协定","pages":"33-44","html":"<p>裁判员讯号</p>\n<ul>\n<li>当运用暂时罚令出场条例时，在出示黄牌后，接著裁判员会以双臂清晰指向暂时离场区域（通常是球员的技术指导区域）</li>\n</ul>\n<p>暂时罚令出场时段</p>\n<ul>\n<li>所有犯规的暂时罚令出场时间均相同</li>\n</ul>\n<ul>\n<li>暂时罚令出场时间应是全部比赛时间的百分之十至百分之十五之间（例如：90分钟赛事需离场10分钟；80分钟赛事需离场8分钟）</li>\n</ul>\n<ul>\n<li>在球员离开比赛场地后，当重新开始比赛时，暂时罚令出场时段便开始</li>\n</ul>\n<ul>\n<li>在暂时罚令出场时段出现「消耗时间」之停顿（例如：球员替换、受伤、庆祝进球等），这些所消耗的时间将会在半场完结时补回，裁判员亦应将这消耗的时间加在暂时罚令出场时段内</li>\n</ul>\n<ul>\n<li>竞赛组织必须决定由谁人协助裁判员计算暂时离场时间 - 这职责可由赛事代表人员、后备官员或中立助理裁判员负责；甚至可由球队官员负责对方球员的计时</li>\n</ul>\n<ul>\n<li>一旦暂时罚令出场时段完毕，在紧接的下一个比赛暂停时，球员在获得裁判员批准后，可经边线返回比赛场地</li>\n</ul>\n<ul>\n<li>裁判员有最终决定权何时让球员返回比赛场地</li>\n</ul>\n<ul>\n<li>被暂时罚令出场的球员仅可在暂时离场时段完毕后（并且该球队尚未使用所有允许的换人名额及/或换人机会（如适用））才可被替换。</li>\n</ul>\n<ul>\n<li>如暂时离场时段在上半场比赛完毕时仍未完成，余下之部分暂时离场时段将于下半场比赛开始时继续执行，这亦适用于加时比赛</li>\n</ul>\n<ul>\n<li>如暂时离场时段在下半场比赛完毕后需要加时比赛时仍未完成，余下之部分暂时离场时段将于加时比赛开始时继续执行</li>\n</ul>\n<ul>\n<li>由于暂时罚令出场不适用于点球（射点球决胜）阶段，在比赛完结时仍然处于暂时离场时段的球员，可以参与点球（射点球决胜）</li>\n</ul>\n<ul>\n<li>暂时离场区域</li>\n</ul>\n<ul>\n<li>被暂时罚令出场的球员应停留在技术指导区域范围内（如有提供）或与球队教练/技术指导人员一起，除非需要进行「热身」准备（条件与在规则管辖下的替补队员一样）</li>\n</ul>\n<p>发生在暂时罚令出场时段的犯规</p>\n<ul>\n<li>被暂时罚令出场的球员在暂时离场时段中触犯应被黄牌警告或红牌罚令出场的犯规，将不能参与余下的比赛时间，亦不可被代替或替换</li>\n</ul>\n<p>进一步的纪律行动</p>\n<ul>\n<li>竞赛组织/国家足球总会可自行决定是否需要就暂时罚令出场事件报告向相关机构报告，以及是否需要采取进一步的纪律行动，例如像「一般」黄牌警告一样，因累积多次暂时离场记录而被判罚停赛</li>\n</ul>\n<p>暂时罚令出场处理机制竞赛组织可采用以下任何一项暂时罚令出场的机制：</p>\n<ul>\n<li>机制A-适用于全部黄牌警告犯规</li>\n</ul>\n<ul>\n<li>机制B–适用部分黄牌警告犯规</li>\n</ul>\n<p>机制A–适用全部黄牌警告的暂时罚令出场</p>\n<ul>\n<li>所有应被黄牌警告之犯规均需被判罚暂时罚令出场</li>\n</ul>\n<ul>\n<li>球员在同一场比赛中第二次被黄牌警告：</li>\n</ul>\n<ul>\n<li>被判罚第二次暂时罚令出场，之后不能参与同场余下的比赛</li>\n</ul>\n<ul>\n<li>当第二次暂时罚令出场时段完毕后，假如该球员球队的换人名额及/或机会（如适用）仍未用完，他可被替补队员代替（原因是该球队已经被「惩罚」在缺少该球员两次被罚暂时离场的时间下比赛）</li>\n</ul>\n<p>机制B–适用部分黄牌警告的暂时罚令出场*</p>\n<ul>\n<li>预先制定一系列将被判罚暂时罚令出场的黄牌犯规名单</li>\n</ul>\n<ul>\n<li>余下其他应被黄牌警告之犯规均仍需被黄牌警告，但无需被暂时罚令出场</li>\n</ul>\n<ul>\n<li>球员在同一场比赛中第二次被黄牌警告时，即使其中一次/两次警告是属于暂时罚令出场犯规，球员仍需被罚令出场</li>\n</ul>\n<p class=\"fn\">*在某些赛事中，只有一些与「不适当」行为有关的犯规，才值得采</p>\n<p>用暂时罚令出场方式，例如：</p>\n<ul>\n<li>伪装行为</li>\n</ul>\n<ul>\n<li>蓄意拖延对方重新开始比赛</li>\n</ul>\n<ul>\n<li>表示不满、作出口头评论或摆出不满姿势</li>\n</ul>\n<ul>\n<li>触犯拉扯对方、拉对方、推对方或蓄意手球的犯规而破坏或干扰一明显进攻机会</li>\n</ul>\n<ul>\n<li>主射球员在射点球时使用不合法假动作随著在2017年3月3日在伦敦举行的第131届国际足球协会委员会年度大会批准，足球竞赛规则现时容许在青少年、老年、残障及草根足球比赛采用重返替换条例，条例须由国际足球协会、洲际足球协会或各国家足球总会批准（以适用者为准）。</li>\n</ul>\n<p>重返替换的提述载于以下内文：</p>\n<p>第3章 － 球员</p>\n<h3>3.2 替换球员人数 - 重返替换</h3>\n<p>只容许在青少年、老年、残障及草根足球比赛采用重返替换条例，国际足球协会、洲际足球协会或各国家足球总会可自行考虑是否同意采用。</p>\n<p>「重返替换球员」是一名在比赛中先前被换下的球员(已被换下球员)，在稍后时间可替换另一名球员而重返比赛。</p>\n<p>除条例容许一名已被换下球员可重返比赛外，所有在规则第3章的条文及足球竞赛规则条文都适用于该名重返比赛的球员。其中，规则第3章的替换程序必须遵从。</p>\n<p>简介经2025年3月2日在苏格兰举行的第138届国际足球协会委员会周年大会批准，足球竞赛规则容许竞赛组织批准使用额外永久替换脑震荡球员。</p>\n<p>在执行额外永久替换脑震荡球员时，当实际或疑似出现脑震荡的球员被换下后，不能再参与余下比赛时。此替换不算作「正常」允许的替换球员（或换人机会（如适用））。</p>\n<p>额外永久替换脑震荡球员的提述载于以下内文：</p>\n<p>第3章–球员</p>\n<h3>3.2 替换球员人数–额外永久替换脑震荡球员</h3>\n<p>比赛可根据「须知事项及修订」中列出的协定使用永久替换脑震荡球员。</p>\n<p>注意：虽然两种不同方案处于试用阶段，但国际足球协会委员会周年大会批准单一方案（见下文），并且必须完整使用。</p>\n<p>原则</p>\n<ul>\n<li>每队在比赛中最多可使用一次「替换脑震荡球员」。</li>\n</ul>\n<ul>\n<li>不论已使用换人的名额，球队都可以使用「替换脑震荡球员」。</li>\n</ul>\n<ul>\n<li>如在一些比赛中，登记在名单内的替补队员人数与最多可使用的「正常替换球员」名额相同，「替换脑震荡球员」可为之前被换下场的球员，并且可随时使用，不受已使用换人名额限制。</li>\n</ul>\n<ul>\n<li>当使用「替换脑震荡球员」时，对方球队可选择以任何理由使用一次「额外替换球员名额」。程序</li>\n</ul>\n<ul>\n<li>替换程序按照第3章－球员的规定（下文另有规定者除外）执行。</li>\n</ul>\n<ul>\n<li>替换脑震荡球员」可在以下情况使用：</li>\n</ul>\n<ul>\n<li class=\"l2\">发生或怀疑发生脑震荡时立即使用；</li>\n</ul>\n<ul>\n<li class=\"l2\">经现场评估后及/或场外评估后使用；或</li>\n</ul>\n<ul>\n<li class=\"l2\">发生或怀疑发生脑震荡时的任何其他时间使用，包括已接受过评估并被认为可重新返回比赛场地作赛的球员。</li>\n</ul>\n<ul>\n<li>如果球队决定使用「替换脑震荡球员」，应通知裁判员/后备裁判员，最好使用不同颜色的换人卡/形式。</li>\n</ul>\n<ul>\n<li>出现脑震荡或疑似脑震荡的球员不得再继续比赛，包括点球（射点球决胜），并应尽可能在陪同下前往更衣室及/或医疗设施。</li>\n</ul>\n<ul>\n<li>裁判员/后备官员将通知对方可选择使用一次「额外替换球员名额」及一次「额外替换球员」机会，两者可在球队使用「替换脑震荡球员」的同时使用，或者在其后任何时候使用（足球竞赛规则另有规定者除外）。</li>\n</ul>\n<p>换人机会</p>\n<ul>\n<li>使用「替换脑震荡球员」与「正常替换球员」机会次数无关。</li>\n</ul>\n<ul>\n<li>然而，如果球队使用「替换脑震荡球员」的同时使用「正常替换球员」，则算作已使用一次「正常替换球员」机会。</li>\n</ul>\n<ul>\n<li>当球队使用所有「正常替换球员」机会后，则不可利用「替换脑震荡球员」同时进行「正常替换球员」。</li>\n</ul>\n<ul>\n<li>当球队使用「替换脑震荡球员」时，对方可使用一次「额外替换球员名额」，并获获得一个次「额外替换球员」机会。此额外机会只适用于「额外替换球员名额」，不能用作「正常替换球员」。</li>\n</ul>\n<p>比赛官员</p>\n<ul>\n<li>裁判员及其他比赛官员，特别是后备官员：</li>\n</ul>\n<ul>\n<li>不参与球队替换球员的决策过程，亦不参与应否使用「正常替换球员」或「替换脑震荡球员」替换球员的决策过程；</li>\n</ul>\n<ul>\n<li>不得决定实际或疑似受伤是否符合使用「替换脑震荡球员」的条件；</li>\n</ul>\n<ul>\n<li>在球员实际或疑似受伤时，应提供适当的支援，包括在怀疑球员需要接受评估及/或治疗时通知队长、教练及/或医务人员；</li>\n</ul>\n<ul>\n<li>应支持队长、教练及/或医务人员作出受伤球员无法继续比赛的决定，当中可能需要裁判员延迟重新开始比赛，直至该球员离开比赛场地后；</li>\n</ul>\n<ul>\n<li>如怀疑「替换脑震荡球员」有不恰当地被使用，必须通知相关机构。</li>\n</ul>"},{"id":"law-1","title":"第一章 比赛场地","law":1,"pages":"44-53","html":"<h3>1. 场地表面</h3>\n<p>根据竞赛规程，球赛只可于全天然草地或全仿真草地上进行。经竞赛规则批准使用仿真草与真草混合的比赛场地(混合系统)则除外。</p>\n<p>仿真草场地颜色必须为绿色。</p>\n<p>除非得到国际足球协会委员会特别豁免，否则在使用仿真草场地进行之国际足球协会属会国家代表队比赛或球会之间的国际赛事，有关的草地必须达到国际足球协会之足球草地品质条例中的要求。</p>\n<h3>2. 场地界线</h3>\n<p>比赛场地必须为长方形及划上连续的界线，界线不能构成危险；在不构成危险情况下，可在天然草地上使用仿真草作为场地界线之用。界线是属于比赛场地的一部分。</p>\n<p>只有在规则第1章列明的场地界线可在作赛比赛场地划上。仿真草足球场地容许存在其他界线，但这些界线颜色与足球场地界线必须不同及可以被清晰分辨。</p>\n<p>比赛场地两边较长的界线为边线，两边较短的界线为球门线。</p>\n<p>中场线将比赛场地分为两个面积相等的半场，中场线连接两则边线的中心点。</p>\n<p>中场线的中央作一记号，并以此点为圆心，画一个9.15米(10码)为半径的圆圈。</p>\n<p>球门线最短 45 米(50 码) / 最长 90 米 (100 码)角球区域角球旗杆(必须)7.32 米 (8 码)球门区域罚球点罚球区最短 90 米(100 码) / 最长 120 米(130 码)点球弧线中线旗杆(附加)半径9.15 米(10 码)中心点中场线中圈边线9.15 米(10 码)9.15 米 (10 码)附加标记16.5 米5.5 米11 米(18 码)(6 码)(12 码)16.5 米 (18 码)5.5 米 (6 码)9.15 米 (10 码)半径 1 米 (1 码)</p>\n<ul>\n<li>因界线是球场的一部分，所有尺寸均由界线最外部分起量度。</li>\n</ul>\n<ul>\n<li>罚球点是由中心起量度至球门线最外部分为止。每边球门线及边线外距离角球区域9.15米(10码)处可作一记号。所有场地界线阔度必须相同，而界线的阔度不能超过12厘米(5吋)。球门线阔度必须与门柱及横梁阔度相等。若球员在比赛场地上划出非认可的记号，应以欠缺体育精神行为黄牌警告该球员。若裁判员在比赛进行期间发觉，应在比赛紧接的下一个暂停时，才以欠缺体育精神行为黄牌警告该球员。</li>\n</ul>\n<h3>3. 场地幅度</h3>\n<p>比赛场地之边线必须较球门线长。</p>\n<ul>\n<li>长度(边线)：</li>\n</ul>\n<ul>\n<li class=\"l2\">阔度(球门线)：最短90米(100码)最短45米(50码)最长120米(130码)最长90米(100码)</li>\n</ul>\n<p>竞赛组织可自行在上述球场幅度内决定球门线及边线之长度。</p>\n<h3>4. 国际比赛场地幅度</h3>\n<ul>\n<li>长度(边线):</li>\n</ul>\n<ul>\n<li class=\"l2\">阔度(球门线):最短100米(110码)最短64米(70码)最长110米(120码)最长75米(80码)</li>\n</ul>\n<p>竞赛组织可自行在上述球场幅度内决定球门线及边线之长度。</p>\n<h3>5. 球门区域</h3>\n<p>在比赛场地两端距各门柱内侧5.5米(6码)处，在场内各画一条长5.5米(6码)的线与球门线相接成一直角，此两线的末端由另一条与球门线平行的线连接。此三线与球门线内之区域为球门区域。</p>\n<h3>6. 罚球区</h3>\n<p>在比赛场地两端距各门柱内侧16.5米(18码)处，在场内各画一条长16.5米(18码)的线与球门线相接成一直角，此两线的末端由一条与球门线平行的线连接起来。此三线与球门线内之地区域为点球区域。</p>\n<p>每个罚球区内有一个罚球点球记号，在距两门柱之中央垂直对入场内11米(12码)处，作一罚球点。</p>\n<p>用罚球点中心为圆心及9.15米(10码)为半径，在罚球区外画一条弧线(娥媚月)。</p>\n<h3>7. 角球区域</h3>\n<p>以角球旗杆为圆心，以1米(1码)为半径，在场内画一个四分一的弧圈。</p>\n<p>角球旗杆为必须装置而其高度不少于 1.5 米(5 呎), 顶部不能是尖的角球区域界线阔度不能半径 1 米 (1 码)超过 12 厘米 (5 吋)阔</p>\n<h3>8. 旗杆</h3>\n<p>于比赛场地四个角落各设置一支角球旗，每支不能低于1.5米(5呎)，其顶部不能是尖的。</p>\n<p>另于中场线的两边，距离边线不少1米(1码)处，每边可竖立一中场旗。</p>\n<h3>9. 技术指导区域</h3>\n<p>比赛场地应根据下列各项规定划上一个技术指导区域，让球队职员、替补队员及已被换下球员坐在指定的座位观看球赛：</p>\n<ul>\n<li>技术指导区域的范围，包括在指定座位的两侧向外量度1米(1码)及向前伸展直至距离边线1米(1码)位</li>\n</ul>\n<ul>\n<li>利用界线划出技术指导区域的范围</li>\n</ul>\n<ul>\n<li>根据竞赛规程，在比赛前协定后备席球员及职员人数</li>\n</ul>\n<ul>\n<li>在技术指导区域内人员：</li>\n</ul>\n<ul>\n<li class=\"l2\">身份必须根据竞赛规程在比赛开始前确认</li>\n</ul>\n<ul>\n<li class=\"l2\">行为必须自律</li>\n</ul>\n<ul>\n<li class=\"l2\">其他职员必须留在技术指导区域的范围内。除特殊情况下，例如在得到裁判员的准许，球队医疗人员才能进场视察受伤球员的伤势</li>\n</ul>\n<ul>\n<li>每次只可准许一名人员在技术指导区域内作出战术上的指示</li>\n</ul>\n<h3>10.球门</h3>\n<p>每一球门线的中央必须设一球门。</p>\n<p>球门需具有两直竖的门柱，上架一条横梁，每一门柱至角球旗杆的距离应相等。门柱及横梁必须使用获批准的物料制造，双方球门的门柱及横梁必须是相同的形状，例如方形、矩形、圆形、椭圆形或以上形状组合而成，并确保不会对球员构成危险。</p>\n<p>国际足球协会或洲际足球协会举办的正式赛事中使用的所有球门都必须符合国际足球协会对球赛的品质标准。</p>\n<p>两门柱内侧相距7.32米(8码)及横梁的底部离地面2.44 米(8呎)。</p>\n<p>门柱在球门线上的位置必须符合以下图像显示。</p>\n<p>两门柱及横梁之阔度及深度应平均相等，以及不得超过12厘米(即5吋)。</p>\n<p>若球门横梁移位或折断，应暂停比赛直至横梁修好或更换妥当为止。修理后以坠球重新开始比赛。如不能及时修好的话，则应腰斩赛事。不容许使用绳来代替横梁。</p>\n<p>可附加球门网将球门及球门后的场地连接，唯必须适当支撑起来而不妨碍守门员。</p>\n<p>安全守则所有球门(包括可移动的球门)都要坚固安装在地面上。</p>\n<h3>11.球门线科技 (GLT)</h3>\n<p>球门线科技可用作确定射进球门的球是否为有效进球来支持裁判员作出的决定。</p>\n<p>采用球门线科技必须在竞赛规程列明。</p>\n<figure class=\"pg\"><img src=\"assets/rules/p51.png\" alt=\"图示\" loading=\"lazy\"></figure>\n<p>球门线科技的原则球门线科技只可应用于球门线上及只能用作裁定进球是否有效。</p>\n<p>球门线科技系统必须能迅速及自动于一秒钟内 （透过裁判员的腕表发出震动及视觉讯号，及/或透过裁判员的耳机/听筒）仅向赛事比赛官员指示进球是否有效；指示同时亦可以发送至视像控制室(VOR)。</p>\n<p>球门线科技要求和规范如在任何赛事使用球门线科技，竞赛组织必须确定其系统（包括任何可能就球门架或应用于球的科技获准作出的变动）达到国际足球协会对球门线科技品质的要求。</p>\n<p>使用球门线科技时，裁判员必须在比赛前按照测试指引对科技的功能进行测试。如此系统不能依据测试指引下正常运作，裁判员不可使用此系统及必须向相关机构报告。</p>\n<h3>12.商业广告</h3>\n<p>从双方球队进入比赛场地直至上半场完结及双方下半场再次进入比赛场地至比赛结束，不能展示任何商业广告，无论是实物或字句，限制范围包括球门网及其所属的范围、技术指导区域内、裁判员覆检区域(RRA)或比赛场地边界线外1米(1码)范围。禁止在球门、球门网、角球旗杆、旗帜及任何附加物(例如摄影机、收音器具等)附加任何宣传物品。</p>\n<p>另外，竖立的广告必须最少：</p>\n<ul>\n<li>离开边线1米(1码)外</li>\n</ul>\n<ul>\n<li>与球门线及球门网深度间的距离一致</li>\n</ul>\n<ul>\n<li>离开球门网1米外(1码)</li>\n</ul>\n<h3>13.标语及标志</h3>\n<p>在比赛期间，不论是实体或虚拟，禁止在比赛场地上、球门网或场地所属的范围、球门及旗杆出现国际足球协会、洲际足球协会、国家足球总会、竞赛组织、球会或其他机构之徽章/设计，但准许其在球场旗杆的旗帜上出现。</p>\n<h3>14.视频助理裁判员 (VARs)</h3>\n<p>在使用视频助理裁判员(VARs)协助执法的比赛中，必须有一个视像控制室(VOR)及最少一个裁判员覆检区域(RRA)。</p>\n<p>视像控制室 (VOR)视像控制室是视频助理裁判员(VAR)，副视频助理裁判员(AVAR)及重播操作员(RO)工作的地方。可设于在比赛场馆内/附近或较远离的地点。在比赛期间只准许有授权的人员进入视像控制室(VOR)或与VAR、AVAR及重播操作员(RO)沟通。</p>\n<p>球员、替补队员、已被换下球员或球队官员进入视像控制室(VOR)会被罚令出场。</p>\n<p>裁判员覆检区域 (RRA)在使用视频助理裁判员的比赛中，比赛场地内必须设置最少一个裁判员覆检区域(RRA)，让裁判员可作「现场覆检」(OFR)。而该裁判员覆检区域(RRA)必须是：</p>\n<ul>\n<li>在比赛场地外而又在可见的位置上</li>\n</ul>\n<ul>\n<li>被清楚划出球员、替补队员、已被换下球员或球队官员进入裁判员覆检区域(RRA)内会被黄牌警告。</li>\n</ul>"},{"id":"law-2","title":"第二章 球","law":2,"pages":"54-57","html":"<h3>1. 品质及规格</h3>\n<p>球必须是：</p>\n<ul>\n<li>圆形</li>\n</ul>\n<ul>\n<li>用适合的质料制成</li>\n</ul>\n<ul>\n<li>其圆周在68厘米(27吋)及70厘米(28吋)之间</li>\n</ul>\n<ul>\n<li>在比赛开始时其重量在410克(14安士)及450克(16安士)之间</li>\n</ul>\n<ul>\n<li>在海平面气压应于0.6－1.1大气压力(每平方厘米约600－1100克)(每平方公吋约8.5磅至15.6磅)</li>\n</ul>\n<p>在国际足球协会或洲际足球协会认可正式赛事所使用的球必须达到标准，并印有任何一个国际足球协会的球品质认证标志。</p>\n<p>若球上印有以上标志，表示该球已通过测试合格及符合规则第2章所规定的标准及已得到国际足球协会委员会的批准。</p>\n<p>国家足球总会所举办之赛事，可使用印有上述认可标志的球。</p>\n<p>在国际足球协会、洲际足球协会或国家足球总会支持下举办的正式比赛，除了该赛事、赛事主办机构及授权之制造商注册商标的标志/赛事图案外，任何形式的商业广告不准许在球上出现。竞赛规则可限制制造商注册商标的大小和数量。</p>\n<h3>2.\t替换破损球</h3>\n<p>如在比赛进行中发现球有破损时，应：</p>\n<ul>\n<li>暂停比赛及</li>\n</ul>\n<ul>\n<li>以坠球方式重新开始比赛</li>\n</ul>\n<p>如球破损发生在中圈开球、球门球、角球、任意球、点球或掷界外球暂停之际，应根据规则重新开始比赛。</p>\n<p>如在射点球或点球（射点球决胜）时，球在向前移动时破损，而过程中球并未触及任何球员、门柱或门楣，应重射点球。</p>\n<p>未经裁判员准许，不得在比赛进行时更换球。</p>\n<h3>3.\t备用球</h3>\n<p>可在比赛场地外周边摆放备用球，但要确保所有球符合规则第2章的规定及在裁判员控制下使用。</p>"},{"id":"law-3","title":"第三章 队员","law":3,"pages":"58-65","html":"<h3>1.\t球员人数</h3>\n<p>比赛应由两队比赛，每队人数不得超过十一人，其中一人必须为守门员，任何一队人数少于七人时，比赛不得开始或继续进行。</p>\n<p>如球队因一名或多名球员在比赛进行中蓄意离开比赛场地，以致该队在比赛场地上少于七人时，裁判员不必停止比赛，可运用有利让比赛继续。在此情况下，当在比赛暂停后，该队仍不足七人时，裁判员不应让比赛继续。</p>\n<p>如竞赛规程列明所有球员和替补队员的名字必须在比赛开始前登记在比赛名单内，而球队在比赛开始时少于十一人，只有比赛前已登记在名单内的球员及替补队员到达后可参与比赛。</p>\n<h3>2.\t替换球员人数</h3>\n<p>正式比赛所有由国际足球协会、洲际足球协会或各国家足球总会所举办的正式赛事，球队可替换不超过五名球员。在男、女子最高级别球会一队及国际最高级别代表队「A」级赛事，在竞赛规程容许下，最多可替换五名球员，每队：</p>\n<ul>\n<li>最多可有三次换人机会*</li>\n</ul>\n<ul>\n<li>中场休息时可有额外换人机会</li>\n</ul>\n<p class=\"fn\">*如果双方球队同时替换球员，各队均被视为使用了一次替换球员</p>\n<p>机会。球队在同一次比赛暂停期间替换多名球员（及提出要求）仅算作使用了一次换人机会。</p>\n<p>加时比赛</p>\n<ul>\n<li>如果球队尚未用尽其替换球员名额及/或机会，则余下的后备球员名额和换人机会均可在加时比赛使用</li>\n</ul>\n<ul>\n<li>若竞赛规程容许球队在加时比赛使用一名额外的球员替换名额，各队将有一次额外的换人机会</li>\n</ul>\n<ul>\n<li>球员替换可以在全场完结后和加时比赛开始前之间及加时比赛的中场休息时进行，而不会被视为已使用换人机会</li>\n</ul>\n<p>竞赛规程必须列明：</p>\n<ul>\n<li>每场赛事中可列多少名替补队员在比赛名单内，数量由三名起至最多十五名</li>\n</ul>\n<ul>\n<li>当赛事进入加时比赛时，便可多加一名额外替补队员换人名额(无论球队是否已用尽在正式比赛时间的法定换人名额)</li>\n</ul>\n<p>其他比赛在国际最高级别代表队「A」级赛事，最多可列十五名替补队员在比赛名单内，而最多可替换八名球员；除非两队同意使用更多人数，则最多可替换十一名球员，此情况下必须在比赛前通知裁判员。官方比赛中需采用换人机会的限制及程序。</p>\n<p>其他所有赛事，只要符合以下条件，则可采用更多的换人名额：</p>\n<ul>\n<li>比赛双方同意最多的换人名额</li>\n</ul>\n<ul>\n<li>在比赛前通知执法裁判员</li>\n</ul>\n<p>如在赛前没有通知执法裁判员，或比赛双方没有达成协议，则最多可替换六名球员。</p>\n<p>重返替换国际足球协会、洲际足球协会或各国家足球总会可自行考虑采用重返替换条例与否，但只限用于青少年、老年、残障及草根足球赛事。</p>\n<p>额外永久替换脑震荡球员比赛可根据「须知事项及修订」中列出的协定使用额外永久替换脑震荡球员</p>\n<h3>3.\t替换程序</h3>\n<p>替补队员名单必须在开赛比赛开始前交给裁判员。没有被列于后备球员名单内的球员不能参加比赛。要换入一名替补队员，需依照「须知事项及修订」下的「限时替换球员协定」及以下程序进行：</p>\n<ul>\n<li>替换前必须知会裁判员</li>\n</ul>\n<ul>\n<li>即将被换下的球员：</li>\n</ul>\n<ul>\n<li class=\"l2\">除非球员已身处比赛场地外，否则需得到裁判员准许及必须在最近的边线离开比赛场地；但如裁判员示意该球员可直接快速地从中场线或特定地点(例如，因安全/保安或受伤情况下)离开则作别论</li>\n</ul>\n<ul>\n<li class=\"l2\">须在替换讯号板展示后的十秒内离开比赛场地，或在没有替换讯号板时，从裁判员发出替换讯号起计十秒内离开比赛场地，除非因安全/保安或受伤而无法做到</li>\n</ul>\n<ul>\n<li class=\"l2\">须立刻返回技术指导区域或更衣室，并且不能再参与余下的比赛时间，除非比赛已获批准采用重返替换条例如在同一次暂停期间替换多名球员，所有被换下的球员必须在示意最后一次替换后的十秒内离开比赛场地。</li>\n</ul>\n<ul>\n<li>如即将被换下的球员拒绝离开比赛场地，比赛应继续</li>\n</ul>\n<p>替补队员只能在以下情况下进入比赛场地：</p>\n<ul>\n<li>必须在比赛暂停时</li>\n</ul>\n<ul>\n<li>在中场线处</li>\n</ul>\n<ul>\n<li>被换下的球员离场后</li>\n</ul>\n<ul>\n<li>得到裁判员的讯号才可入场</li>\n</ul>\n<p>当该替补队员进入比赛场地后，换人手续便完成；由该一刻起，被替代的球员变成已被换下球员而该替补队员则成为参赛球员及可开出球重新开始比赛。</p>\n<p>所有替补队员及已被换下球员不论是否正在参与比赛，都在规则赋予判员的权力之管辖范围之内。</p>\n<h3>4.\t替换守门员</h3>\n<p>任何一名参赛球员都可以与守门员交换位置，只要遵照下列的程序：</p>\n<ul>\n<li>在交换位置前通知裁判员</li>\n</ul>\n<ul>\n<li>交换位置必须在比赛暂停时进行</li>\n</ul>\n<h3>5.\t触犯规则及罚则</h3>\n<p>如一名登记在出场名单上的替补队员于球赛开始时在没有通知裁判员下替代一名在名单上的球员开始比赛：裁判员容许该出场名单上的替补队员继续比赛</p>\n<ul>\n<li>毋须对该替补队员采取纪律行动</li>\n</ul>\n<ul>\n<li>原先在名单上的球员可成为名单上的替补队员</li>\n</ul>\n<ul>\n<li>换人名额不需减少</li>\n</ul>\n<ul>\n<li>裁判员应就事件向相关机构作出报</li>\n</ul>\n<p>如球队在半场休息时间或加时之前作出替换球员，所有换人程序必须在重新开始比赛前完成。如没有通知裁判员，裁判员可容许该名在出场名单上的替补队员继续比赛，不需采取纪律行动，只需事后就有关事件向相关机构作出报告。</p>\n<p>如球员与守门员在没有得到裁判员准许下交换位置：</p>\n<ul>\n<li>裁判员应让比赛继续</li>\n</ul>\n<ul>\n<li>裁判员在事件发生后紧接的下一个暂停时，黄牌警告相关球员。但如替换发生在半场(包括加时比赛的半场)休息时间内，或在完场后加时作赛前的时段或发生于点球（射点球决胜）之时段，则毋须采取纪律行动</li>\n</ul>\n<p>除非因安全/保安或受伤而无法在十秒内离开比赛场地，如被换下的球员未能在规定的十秒内离开比赛场地：</p>\n<ul>\n<li>该被换下的球员仍须离开比赛场地；当他们在十秒后仍过度延误比赛重新开始时，会被黄牌警告</li>\n</ul>\n<ul>\n<li>替补队员不可进入比赛场地</li>\n</ul>\n<ul>\n<li>比赛重新开始</li>\n</ul>\n<ul>\n<li>该换人决定不可取消，亦不可更换另一名替补队员。</li>\n</ul>\n<ul>\n<li>替补队员仅可在比赛重新开始一分钟后的首次暂停期间，得到裁判员许可后方可进入比赛场地</li>\n</ul>\n<p>触犯本章其他犯规：</p>\n<ul>\n<li>黄牌警告相关球员</li>\n</ul>\n<ul>\n<li>应由对方在比赛暂停时球所在地开出一间接任意球来重新开始比赛</li>\n</ul>\n<h3>6.\t已被罚令出场球员及替补队员</h3>\n<p>已被罚令出场的球员：</p>\n<ul>\n<li>在递交球队名单前发生，此球员将不得在球队名单任何职能位置出现</li>\n</ul>\n<ul>\n<li>一名已登记在球队名单的球员若在比赛开始前已被罚令出场，可由登记在替补队员名单中选出一人替换，但此替代之后备球员的名额则不能填补。唯替换球员次数则不变</li>\n</ul>\n<ul>\n<li>在比赛开始后才被罚令出场则不能有任何替补</li>\n</ul>\n<p>如登记在后备名单上的替补队员被罚令出场，不论在比赛开始前或后，均不得填补。比赛场地内的额外人员球队教练及其他登记在球队名单中的职员(球员及替补队员除外)都被视作为球队官员。任何没有登记在球队名单中的球员、后备球员或球队官员将被视为外来物体。</p>\n<p>如球队官员、替补队员、已被换下球员或已被罚令出场球员及外来物体进入比赛场地，裁判员必须：</p>\n<ul>\n<li>只在比赛有被干扰情况下才需要暂停比</li>\n</ul>\n<ul>\n<li>将此人赶离比赛场地</li>\n</ul>\n<ul>\n<li>采取适当纪律行动</li>\n</ul>\n<p>如裁判员因以下干扰情况而将比赛暂停：</p>\n<ul>\n<li>球队官员、替补队员、已被换下球员或已被罚令出场球员，比赛应以直接任意球或点球重开</li>\n</ul>\n<ul>\n<li>外来物体，球赛应以坠球重开当球正成为进球时遇到干扰，如该干扰没有妨碍守方球员处理球，而球最终仍成为进球，应判进球有效(在过程中球虽然有被触碰)；除非干扰是由攻方球队造成。</li>\n</ul>\n<h3>8.\t在比赛场地以外的球员</h3>\n<p>如在比赛场地外而应要得到裁判员准许才可再次进入比赛场地的球员，在没有裁判员准许下擅自入场，裁判员必须：</p>\n<ul>\n<li>暂停比赛(如球员没有干扰比赛、比赛官员或裁判员正运用有利条例时，则毋须立即暂停比赛)</li>\n</ul>\n<ul>\n<li>以未经准许进入比赛场地黄牌警告该球员</li>\n</ul>\n<p>如裁判员暂停比赛，必须用以下方式重新开始比赛：</p>\n<ul>\n<li>在干扰地点判罚一直接任意球</li>\n</ul>\n<ul>\n<li>如没有干扰比赛，于比赛暂停时球所在地点判罚一间接自由球</li>\n</ul>\n<p>球员因正常移动时越过比赛场地边界不应被视为擅自离开比赛场地犯规。进球时比赛场地内有额外人员如在比赛进球后重新开始比赛前，裁判员发觉到进球时，有一名额外人员在比赛场地上 ，而此人员干扰了比赛：</p>\n<ul>\n<li>如额外人员是属于以下情况，裁判员须判进球无效：</li>\n</ul>\n<ul>\n<li class=\"l2\">为进球球队的一名球员、替补队员、已被换下球员、已被驱逐离场球员或相关球队官员，在该额外人员所在地点用一直接任意球重新开始比赛</li>\n</ul>\n<ul>\n<li class=\"l2\">是一名外来物体并有干扰比赛，除上述「比赛场地内的额外人员」之进球情况外，球赛应以坠球重新开始比赛</li>\n</ul>\n<ul>\n<li>如额外人员是以下情况，裁判员须判进球有效：</li>\n</ul>\n<ul>\n<li class=\"l2\">为被进球球队的一名球员、替补队员、已被换下球员、已被罚令出场球员或相关球队官员</li>\n</ul>\n<ul>\n<li class=\"l2\">是一名外来物体，但没有干扰比赛在任何情况下，裁判员必须将额外人员赶离比赛场地。</li>\n</ul>\n<p>如在进球后已经重新开始比赛，裁判员才发觉在比赛场地上有额外人员，进球不能被取消。如额外人员仍在比赛场地上，裁判员必须：</p>\n<ul>\n<li>暂停比赛</li>\n</ul>\n<ul>\n<li>将额外人员赶离比赛场地</li>\n</ul>\n<ul>\n<li>因应规则以坠球或任意球重新开始比赛</li>\n</ul>\n<p>裁判员必须就事件向相关机构报告。</p>\n<h3>10.\t球队队长</h3>\n<p>每队必须有一名队长在比赛场地，其必须佩戴识别臂章。球队队长没有特定地位及特权，唯在某程度上需负责球队行为。</p>\n<p>竞赛组织可以采取「须知事项及修订」下列出的「仅限队长」指引。</p>"},{"id":"law-4","title":"第四章 队员装备","law":4,"pages":"66-71","html":"<h3>1.\t安全守则</h3>\n<p>球员不能佩戴或穿著会构成危险的装备或物件。</p>\n<p>只要配件不会构成危险，并被安全及稳固覆盖，则可允许佩戴。危险物件必须移除，不准用胶布黏贴或覆盖。</p>\n<p>球员必须在比赛开始前和替换进场前经过检查。如在比赛进行中发现有球员穿戴未经许可/会构成危险的装备或配件时，裁判员必须指令球员：</p>\n<ul>\n<li>移除相关物件</li>\n</ul>\n<ul>\n<li>如因未能或不愿意移除相关物件，应在紧接的下一个暂停时离开比赛场地处理</li>\n</ul>\n<p>如球员拒绝移除相关物品或被发现再次佩戴该物品，该球员必须被黄牌警告。</p>\n<h3>2.\t必须装备</h3>\n<p>球员的必须装备包括以下各项目：</p>\n<ul>\n<li>有衣袖运动衫</li>\n</ul>\n<ul>\n<li>短裤</li>\n</ul>\n<ul>\n<li>长袜-如使用胶贴或其他物料捆扎或穿于长袜外，其颜色必须与长袜被捆扎及被覆盖部分颜色相同</li>\n</ul>\n<ul>\n<li>护胫-由合适物质制成，大小适中而具有一定的保护作用，整个护胫必须被长袜覆盖。球员有责任确保护胫的大小适中和是否适用</li>\n</ul>\n<ul>\n<li>球鞋队长必须佩戴相关竞赛组织派发或授权的臂章，或带有「队长」字样或字母「C」或其译文的单色臂章，该臂章亦应为单色（另见「一般修订」）。</li>\n</ul>\n<p>当一名球员的球鞋或护胫意外松脱，必须尽快及于下一个比赛暂停前将其穿回；如该名球员于调整前处理球及/或射球入网，应判入球有效。</p>\n<h3>3.\t颜色</h3>\n<ul>\n<li>两队球队所穿著的颜色，必须有别于对方及比赛官员</li>\n</ul>\n<ul>\n<li>每队守门员穿著的颜色，必须有别于其他球员、及比赛官员</li>\n</ul>\n<ul>\n<li>当两队守门员的球衣颜色相同而又没有可更换的球衣，裁判员应容许比赛开始</li>\n</ul>\n<p>打底内衣必须：</p>\n<ul>\n<li>单一颜色及其衣袖的颜色必须与运动衫衣袖主色相同或</li>\n</ul>\n<ul>\n<li>可以有图案/多色，但必须是运动衫衣袖的复制样式如穿著打底短裤/紧身打底长裤，其颜色必须与其短裤的主色相同或其底部颜色相同-唯同队球员必须穿上同一颜色的打底短裤/紧身打底长裤。</li>\n</ul>\n<h3>4.\t其他装备</h3>\n<p>准许使用柔软轻便材料制造而不会构成危险的保护装备，如手套、头箍、面罩、护膝及手臂保护装置等，就如守门员帽及运动眼镜一样。守门员可以穿著运动长裤作为基本装备的一部分。</p>\n<p>头部覆盖物如配戴头部覆盖物(除守门员帽外)，其一定要：</p>\n<ul>\n<li>是黑色或与球衣主色相同(如其他队友亦有配戴，颜色必须相同)</li>\n</ul>\n<ul>\n<li>要保持球员装备之专业外观</li>\n</ul>\n<ul>\n<li>不能与球衣相连</li>\n</ul>\n<ul>\n<li>不会对配戴者或其他球员构成危险(例如颈部开合装置)</li>\n</ul>\n<ul>\n<li>表面没有任何伸延部分(凸出物体)</li>\n</ul>\n<p>电子通讯设备禁止球员(包括替补队员/已被换下球员及已被罚令出场球员)佩戴或使用任何形式电子或通讯设备(除了获批准的电子数据表现及定位系统)。如用途是与球员之福利及安全、战术/指导有直接关系时，容许球队官员使用任何形式电子通讯设备，但只限于小型、流动、手提等之设备(例如传声器、耳机、耳塞、流动电话/智能电话、智能手表、平板电脑及手提电脑等)。若球队官员使用未经授权的设备或使用电子通讯设备作出不适当行为会被红牌罚令出场。</p>\n<p>电子数据表现及定位系统 (EPTS)在国际足球协会、洲际足球总会、国家足球总会或竞赛组织主办之正式比赛赛事中容许球员使用可携带式(WT)的电子数据表现及定位系统(EPTS)，竞赛组织必须确保球员身上佩戴的设备不会构成任何危险及符合国际足球协会规定的可佩戴电子数据表现及定位系统的标准。</p>\n<p>若电子数据表现及定位系统(EPTS)是由赛事或竞赛组织提供，他们有责任确保在比赛进行期间从电子数据表现及定位系统传至技术指导区域内的数据及资料均为可靠及准确。</p>\n<p>国际足球协会规定的可佩戴电子数据表现及定位系统标准协助竞赛组织就电子数据表现及定位系统的可靠性及准确性作出批核。</p>\n<h3>5.\t口号、声明、影像及商业广告</h3>\n<p>球员的基本装备上绝对不能含有任何政治、宗教或个人口号、声明或影像。球员不得在内衣上展示任何政治、宗教、个人的口号与声明或影像、或除内衣生产商标志外的任何商业广告。如有触犯，球员及/或所属球队将会被赛事主办机构或国际足球协会处分。</p>\n<p>原则</p>\n<ul>\n<li>规则第4章适用于所有球员、替补队员、已被换下球员穿著的装备(包括所有衣物)，其原则亦适用于在技术指导区域内的球队职员。</li>\n</ul>\n<ul>\n<li>以下(通常)是准许的：</li>\n</ul>\n<ul>\n<li class=\"l2\">球员号码、名字、球队的徽章/标志、有关推广足球、互相尊重及诚信而具积极性的口号/图案，以及竞赛规程或国家足球总会、洲际或国际足协所批准的商业广告</li>\n</ul>\n<ul>\n<li class=\"l2\">与比赛相关的资料：球队、日期、比赛/项目及场地</li>\n</ul>\n<ul>\n<li>被规限只可在球衣前面或/及臂章上出现已获批准的口号、声明及影像</li>\n</ul>\n<ul>\n<li>在某些情况，口号、声明及影像只可在队长的臂章上出现</li>\n</ul>\n<p>规则演绎当演绎规则是否容许口号、声明或影像出现时，裁判员如有需要向因触犯下列罪名的球员采取行动，应参照规则第12章(犯规及不检行为)：</p>\n<ul>\n<li>使用冒犯性、侮辱性或辱骂性的言语/或举动</li>\n</ul>\n<ul>\n<li>使用挑衅性、嘲笑性或煽动性的举动</li>\n</ul>\n<p>任何上述类别的口号、声明或影像均不容许。</p>\n<p>关于「宗教」及「个人」的相对较易介定，但属于「政治」的则不大清晰，以下是不容许的口号、声明或影像：</p>\n<ul>\n<li>任何在生或过世的人员(若是正式竞赛名称的一部分除外)</li>\n</ul>\n<ul>\n<li>任何本地、地区、国家或国际的政治政党/组织/或团体等</li>\n</ul>\n<ul>\n<li>任何本地、地区或国家政府或其部门、办公室或机构</li>\n</ul>\n<ul>\n<li>任何有歧视成份的组织</li>\n</ul>\n<ul>\n<li>任何组织其目的/或行动或会对相当数目的人员构成冒犯</li>\n</ul>\n<ul>\n<li>任何特定政治行为/活动</li>\n</ul>\n<p>当纪念一项有意义国家或国际的活动时，应顾及对方球队(包括其支持者)和大众的感受。</p>\n<p>竞赛规程应列明进一步的限制/规限，特别是与已获批准的口号、声明和影像有关的面积、数量和位置。建议在比赛/赛事开始前解决所有口号、声明或影像带出的争议。</p>\n<h3>6.\t触犯规则及罚则</h3>\n<p>如球员触犯任何有关此规则而比赛又没有需要暂停，球员：</p>\n<ul>\n<li>应依照裁判员指示离场作出调整</li>\n</ul>\n<ul>\n<li>除非该装备已经被正确调整，否则应在比赛暂停时离场作出调整</li>\n</ul>\n<p>离场作调整或更换装备的球员必须：</p>\n<ul>\n<li>在得到容许再次进入比赛场地前，需经过比赛官员检查该装备</li>\n</ul>\n<ul>\n<li>得到裁判员的准许才能再次进入比赛场地(可在比赛进行中进入)</li>\n</ul>\n<p>球员未得到裁判员的准许而擅自进入比赛场地，必须被黄牌警告。</p>\n<p>如裁判员需要停止比赛执行纪律处分，应判对方球队在比赛停止时球所在地开出一间接任意球来重新开始比赛；若裁判员停止比赛是因为比赛被干扰，则在干扰地点判罚直接任意球(或点球)来重新开始比赛。</p>"},{"id":"law-5","title":"第五章 裁判员","law":5,"pages":"72-83","html":"<h3>1.\t裁判员的权力</h3>\n<p>每场比赛是由一名裁判员全权控制及在规则赋予的权力执行球例。</p>\n<h3>2.\t裁判员的决定</h3>\n<p>裁判员所有决定都是裁判员以其最佳能力根据规则及「比赛精神」而作出，裁判员会在规则之框架内根据自己的意见及其酌情权而采取最合适之行动。</p>\n<p>竞赛组织可使用科技以协助裁判员就以下相关事宜作出或更改决定：</p>\n<ul>\n<li>VAR协定</li>\n</ul>\n<ul>\n<li>比赛是否进行中或已暂停，包括使用球门线技术（GLT）</li>\n</ul>\n<ul>\n<li>越位，包括使用半自动越位侦测技术（SAOT）</li>\n</ul>\n<p>裁判员根据事实作出与比赛有关的判决，不管是否进球及比赛结果如何，裁判员根据事实作出与比赛有关的判决为比赛最终决定。</p>\n<p>裁判员及其他比赛官员的判决必须受尊重。</p>\n<p>在球赛已经重新开始后，或裁判员已表示半场或全场完结后(包括加时赛事)及裁判员已离开球场范围或腰斩球赛后，若裁判员才自行发觉或在其他比赛官员提示下意识到作出一个错误的判决，他不能改变其重新开始比赛方式的决定。不过，如半场完结时，裁判员离开比赛场地前往裁判员覆检区域(RRA)或指示球员返回比赛场地，这样就不妨碍改变在半场完结前刚发生的事件之原有决定。</p>\n<p>除规则12章第4节及视频助理裁判员另有概述，裁判员仅可在其他比赛官员于重新开始比赛前确认犯规，并尝试与裁判员就该犯规作出沟通下，在比赛已经重新开始后采取纪律处分，但不适用于与纪律处分相关的重新开始方式。</p>\n<p>如裁判员暂时丧失能力管理正进行中的比赛，比赛可在其他赛事比赛官员的监察下继续进行，直至紧接的下一个比赛暂停为止。</p>\n<h3>3.</h3>\n<p>权力和职责裁判员：</p>\n<ul>\n<li>执行规则</li>\n</ul>\n<ul>\n<li>与其他比赛官员合作控制球赛进行</li>\n</ul>\n<ul>\n<li>担任计时员、记录球赛及给予相关赛会一份赛后报告，包括所有已执行的纪律处分及任何在比赛前、比赛中或比赛后所发生的事故</li>\n</ul>\n<ul>\n<li>管理及/或示意重新开始比赛</li>\n</ul>\n<p>有利</p>\n<ul>\n<li>当出现犯规，或重新开始比赛被不正确地开出而比赛亦已进行中，如不判罚犯规对对方球队更有利时，裁判员应容许比赛继续，或如果裁判员预期有利不会于数秒内出现时，应判罚原本的犯规/命令重开。</li>\n</ul>\n<p>纪律行动</p>\n<ul>\n<li>如同一时间有多于一个犯规出现时，裁判员因应纪律处分之轻重、重新开始比赛方式的分别、身体冲击力度大小及犯规之策略性等考虑因素，对严重性较高之犯规作出处罚</li>\n</ul>\n<ul>\n<li>对触犯需被黄牌警告或被红牌罚令出场的球员采取纪律行动</li>\n</ul>\n<ul>\n<li>裁判员有权在进进球场后，由作赛前场地检查开始直至比赛全场完结后离开球场前执行纪律行动(包括点球（射点球决胜）的时候)。如果有球员在开赛前未踏入比赛场地的一刻触犯应被红牌罚令出场的犯规，裁判员有权禁止该球员参与比赛(参阅规则第3章第6节)；裁判员赛后应提交有关之不正当行为报告</li>\n</ul>\n<ul>\n<li>裁判员在进入比赛场地一刻，直至比赛完结后，有权黄牌警告或将球员红牌罚令出场及在竞赛规程订明下可暂时驱逐球员离场，包括在中场休息时、加时比赛中和点球（射点球决胜）时</li>\n</ul>\n<ul>\n<li>裁判员可向一些行为不检的球队官员作出口头警告、出示黄牌警告，或出示红牌将其驱逐离开比赛场地范围(包括技术指导区域)；如不正当行为人员身份未能被确认，则处分出现在技术指导区域内最高级教练(职员)。如一名球队队医触犯被红牌驱逐离场的规条，在球队没有其他医护人员可用的情况下，仍可为有需要的球员治疗</li>\n</ul>\n<ul>\n<li>在其他比赛官员提示下对裁判员看不到的犯规，采取适当的行动</li>\n</ul>\n<p>受伤</p>\n<ul>\n<li>如裁判员认为一名球员只是受轻伤，可以让比赛继续进行直至比赛暂停为止</li>\n</ul>\n<ul>\n<li>仅当裁判员认为一名球员严重受伤时，他应立即暂停比赛，并确保该名受伤球员被移离比赛场地接受治理。受伤球员原则上不可在比赛场地内接受治理，而如因受伤导致比赛停止或延迟重新开始比赛，该受伤球员必须离开比赛场地，并仅可在比赛重新开始一分钟后才可再次进入比赛场地；*如比赛暂停时，受伤球员可从任何界线再次进入比赛场地。无须离开比赛场地接受治理及/或在治理后离开比赛场地的例外情况如下：</li>\n</ul>\n<ul>\n<li class=\"l2\">守门员受伤</li>\n</ul>\n<ul>\n<li class=\"l2\">守门员与在场其他球员互相碰撞而同时都需要即时治理</li>\n</ul>\n<ul>\n<li class=\"l2\">同队球员互相相撞受伤而同时都需要即时治理</li>\n</ul>\n<ul>\n<li class=\"l2\">发生严重受伤情况</li>\n</ul>\n<ul>\n<li class=\"l2\">如球员因被对方侵犯受伤，犯规球员因此而被黄牌警告或红牌罚令出场(例如鲁莽拦截或严重犯规)</li>\n</ul>\n<ul>\n<li class=\"l2\">该受伤球员为即将主射点球的球员</li>\n</ul>\n<ul>\n<li>确保流血球员离开比赛场地接受治理，治疗后该球员需要已经止血及装备上没有染有血迹后，待裁判员发出讯号示意才可再次进入比赛场地</li>\n</ul>\n<ul>\n<li>如裁判员示意医护人员进场检验受伤球员，该球员必须自行步出或被担架抬离比赛场地。否则此球员会被以欠缺体育精神行为黄牌警告</li>\n</ul>\n<ul>\n<li>如裁判员决定对一名受伤而需要离场接受治理的球员出示黄牌或红牌作纪律处分时，裁判员应在该球员离开比赛场地前出示红黄牌</li>\n</ul>\n<ul>\n<li>如比赛暂停并非因其他原因，或并非因犯规而引致球员受伤，应在比赛暂停时球所在地点以坠球方式重新开始比赛</li>\n</ul>\n<p class=\"fn\">*参阅「须知事项及修订」下的「场外治理及评估协定」。</p>\n<p>外在干扰</p>\n<ul>\n<li>受到任何外在干扰时，裁判员有权停止、暂停或腰斩比赛，如：</li>\n</ul>\n<ul>\n<li class=\"l2\">灯光不足</li>\n</ul>\n<ul>\n<li class=\"l2\">当观众将物件掷入比赛场地内而击中比赛官员、球员或球队职员，裁判员可根据事件的严重程度，作出继续比赛、暂停、暂缓或腰斩比赛等决定</li>\n</ul>\n<ul>\n<li class=\"l2\">当观众鸣哨而干扰比赛，裁判员应暂停比赛及以坠球重新开始比赛</li>\n</ul>\n<ul>\n<li class=\"l2\">当比赛进行中有额外球、其他物件或动物进入比赛场地，裁判员必须：–如有干扰比赛情况，应将比赛暂停(以坠球重新开始比赛)，如进入比赛场地干扰球赛外来物体阻碍一正进入防守一方球门之进球，但不成功，最终仍成为进球(过程中虽然可能有–如没有干扰比赛，应让比赛继续，及在可能情况下尽快将外触碰到球)，进球仍然有效。除非干扰是由攻方球队造成来物体移走</li>\n</ul>\n<ul>\n<li>确保未经授权的人员不得进入比赛场地</li>\n</ul>\n<h3>4.\t视频助理裁判员 (VAR)</h3>\n<p>只容许赛事/竞赛组织已达至所有执行要求，如VAR手册中所述，并已收到国际足球协会的书面批准，才可使用视频助理裁判员。</p>\n<p>裁判员在以下事件出现「清晰及明显错误」或「遗漏严重犯规」时，视频助理裁判员(VAR)才会提供协助:</p>\n<ul>\n<li>进球/不进球</li>\n</ul>\n<ul>\n<li>点球/非点球</li>\n</ul>\n<ul>\n<li>红牌（包括明显错误而导致两黄一红情况）</li>\n</ul>\n<ul>\n<li>裁判员错误识别球员身份（发出黄牌警告或驱逐[红牌]予不正确的球员）</li>\n</ul>\n<ul>\n<li>明显错误判决的角球，前提是该决定能被立即更改及不延迟比赛重新开始（竞赛组织可允许视像助理裁判(VAR)提供的协助是透过使用事件的重播影片。裁判员可只根据VAR提供的资讯及/或裁判员直接观看重播影片(「现场覆检」)而作出最终决定。</li>\n</ul>\n<p>在所有事件上，裁判员(及相关「场区」比赛官员)必须时刻作出决定(包括决定不处罚可能的犯规情况)；除非是「清晰及明显错误」的事件，否则其决定不会改变，但「遗漏严重犯规」则例外。</p>\n<p>比赛已重新开始后的覆检如比赛在暂停后已重新开始，裁判员只可利用「覆检」向一些行为采取适当的纪律处分，包括错误确定球员身份或球员触犯极可能被罚令出场的犯规，如凶暴行为、吐唾沫、咬人或作出极度冒犯、侮辱及/或挑衅举动等事件。</p>\n<h3>5.\t裁判员装备</h3>\n<p>必须装备裁判员必须有以下装备：</p>\n<ul>\n<li>哨子</li>\n</ul>\n<ul>\n<li>计时腕表</li>\n</ul>\n<ul>\n<li>红牌及黄牌</li>\n</ul>\n<ul>\n<li>记录簿(或用作记录比赛用途其他装置)</li>\n</ul>\n<p>其他装备裁判员可使用以下装备：</p>\n<ul>\n<li>用于与其他比赛官员作即时沟通的通讯系统-电子讯号旗、通讯系统等</li>\n</ul>\n<ul>\n<li>跑动定位系统或其他监察体能仪器</li>\n</ul>\n<ul>\n<li>随身摄像机，前提是竞赛组织提供摄像机、完全拥有及控制录像片段，并遵守相关指引。摄像机可附有麦克风，但不可用作广播与视频助理裁判员（VAR）的通讯。相关机构可将摄像机的影像及声音用于纪律处分事宜。</li>\n</ul>\n<p>裁判员及其他「场区」比赛官员不可使用任何其他电子仪器，包括摄录器材，上文所述的随身摄像机除外。只要配件没有构成危险，则可容许佩戴。</p>\n<h3>6.</h3>\n<p>裁判员讯号裁判员标准手号如下图。</p>\n<p>点球界外球</p>\n<figure class=\"pg\"><img src=\"assets/rules/p79.png\" alt=\"图示\" loading=\"lazy\"></figure>\n<figure class=\"pg\"><img src=\"assets/rules/p80.png\" alt=\"图示\" loading=\"lazy\"></figure>\n<p>覆检： 用手画出倒计时最后五秒电视讯号</p>\n<h3>7.\t比赛官员责任</h3>\n<p>裁判员或其他比赛官员毋须为下列情况负上任何责任：</p>\n<ul>\n<li>球员、职员或观众受到的任何损伤</li>\n</ul>\n<ul>\n<li>任何财物的损毁</li>\n</ul>\n<ul>\n<li>裁判员根据规则或正常惯例去主持、担任及控制一场比赛所作出的判决，而导致个人、球会、公司、团体或其他社团所受到的任何损失</li>\n</ul>\n<p>判决可包括：</p>\n<ul>\n<li>裁判员因应场地或其周围环境状况或天气的影响而决定一场比赛是否继续进行</li>\n</ul>\n<ul>\n<li>在任何原因下决定腰斩比赛</li>\n</ul>\n<ul>\n<li>就比赛场地的设施及比赛所用的球是否适用于比赛</li>\n</ul>\n<ul>\n<li>由观众的干扰或在观众席所引起的问题以致裁判员作出停止或继续比赛的决定</li>\n</ul>\n<ul>\n<li>是否停止或继续比赛，以便让受伤的球员被移离比赛场地接受治理</li>\n</ul>\n<ul>\n<li>要求受伤球员被移离比赛场地接受治理</li>\n</ul>\n<ul>\n<li>是否容许球员穿著某些衣物或装备</li>\n</ul>\n<ul>\n<li>在裁判员的职权范围内，容许或拒绝任可人员(包括球队或比赛场地职员、保安人员、摄影师或其他传媒代表)留在比赛场地范围</li>\n</ul>\n<ul>\n<li>裁判员根据规则或依照符合国际足球协会、洲际足球协会、国家足球总会的条款或竞赛规程履行其职务时所作出的任何决定</li>\n</ul>"},{"id":"law-6","title":"第六章 其他比赛官员","law":6,"pages":"84-91","html":"<p>每场比赛可委派其他比赛官员[两名助理裁判员、一名后备裁判员、两名附加助理裁判员、一名后备助理裁判员、一名视像助理裁判员(VAR)及最少一位副视频助理裁判员(AVAR)] 协助执行规则。</p>\n<p>他们要根据规则去协助裁判员控制比赛，唯裁判员有最终决定权。</p>\n<p>裁判员、助理裁判员、后备官员、附加助理裁判员及后备助理裁判员属于「场区」比赛官员视频助理裁判员(VAR)及副视频助理裁判员(AVAR)属于「视像」赛事比赛官员(VMOs)，根据足球竞赛规则和VAR协定协助裁判员执法。</p>\n<p>其他比赛官员应根据裁判员的指示协助执法。当裁判员发现他们有不合理的干扰或不恰当的行为时，可解除他们的职务及向相关比赛机构报告。</p>\n<p>其他「场区」比赛官员若身处之位置比裁判员有更佳视野，应给予裁判员协助，并应在任何严重不正当行为或事件发生于裁判员及其他比赛官员视线外时向赛会递交报告。就已向相关部门报告之事件，必须告知裁判员及其他比赛官员。</p>\n<p>其他「场区」比赛官员应协助裁判员视察比赛场地、比赛使用的球及球员装备(包括已更正后的装备)，亦应为球赛事件记录时间、进球及不正当行为等等。</p>\n<p>竞赛规程必须清楚列明，当一名比赛官员未能开始或继续执法时及有任何相关改变时，由谁人代替其职务。其中，当裁判员未能继续执法时，应清楚列明是否由后备官员、较资深助理裁判员或较资深之附加助理裁判员代替。</p>\n<h3>1.\t助理裁判员</h3>\n<p>在下列情况下作出显示：</p>\n<ul>\n<li>整个球完全越过比赛场地范围及获得角球、球门球或掷界外球的球队</li>\n</ul>\n<ul>\n<li>有球员触犯越位犯规时</li>\n</ul>\n<ul>\n<li>有替换球员的要求时</li>\n</ul>\n<ul>\n<li>当射点球时，守门员有否在主射球员触球前移离球门线及球是否完全越过球门线；如比赛有委派附加助理裁判员，助理裁判员应处于与罚球点同一水平线的位置上</li>\n</ul>\n<p>助理裁判员提供之协助应包括管理替换程序。</p>\n<p>助理裁判员可进入比赛场地协助管理离球9.15米(10码)的距离。</p>\n<h3>2.\t后备官员</h3>\n<p>后备官员提供之协助应包括：</p>\n<ul>\n<li>管理替换程序</li>\n</ul>\n<ul>\n<li>检查球员/替补队员之装备</li>\n</ul>\n<ul>\n<li>球员得到裁判员讯号/批准再次进入比赛场地</li>\n</ul>\n<ul>\n<li>管理更换皮</li>\n</ul>\n<ul>\n<li>根据裁判员的指示在半场完结的一刻显示最少补时时间(包括</li>\n</ul>\n<ul>\n<li>就技术指导区域内任何人员作出之不正当行为通知裁判员加时比赛的上下半场)</li>\n</ul>\n<h3>3.\t附加助理裁判员</h3>\n<p>附加助理裁判员应显示：</p>\n<ul>\n<li>当整个球完全越过球门线，包括进球</li>\n</ul>\n<ul>\n<li>获得角球或球门球的球队</li>\n</ul>\n<ul>\n<li>当射点球时，守门员有否在主射球员触球前移离球门线及球是否完全越过球门线</li>\n</ul>\n<h3>4. \t后备助理裁判员</h3>\n<p>后备助理裁判员可替补未能继续执行职务之助理裁判员、后备裁判员或附加助理裁判员，亦可如其他「场区」比赛官员一样给予裁判员同样协助。</p>\n<h3>5.\t视像比赛官员</h3>\n<p>视频助理裁判员（VAR）属于比赛官员，在有「清晰及明显错误」或「遗漏严重犯规」事件时，而该事件是关乎进球/不进球、点球/非点球、红牌（包括明显错误而导致两黄一红的情况）或当裁判员错误识别球员身份而发出黄牌警告或驱逐予不正确的球员离场（红牌）情况，可利用重播影片协助裁判员。</p>\n<p>副视频助理裁判员(AVAR)属于比赛官员，主要职责是协助VAR:</p>\n<ul>\n<li>当VAR正忙于进行「检查」或「覆检」时，继续观看电视直播影片</li>\n</ul>\n<ul>\n<li>记录使用VAR的事件及一切沟通或技术上的问题</li>\n</ul>\n<ul>\n<li>特别在VAR处于「检查」或「覆检」时，协助VAR与裁判员沟通，例如，告知裁判员需「暂停」或「延迟重新开始比赛」等等</li>\n</ul>\n<ul>\n<li>记录因「检查」或「覆检」而流失的比赛时间</li>\n</ul>\n<ul>\n<li>与相关单位传达有关使用VAR决定的讯息</li>\n</ul>\n<figure class=\"pg\"><img src=\"assets/rules/p88.png\" alt=\"图示\" loading=\"lazy\"></figure>\n<figure class=\"pg\"><img src=\"assets/rules/p89.png\" alt=\"图示\" loading=\"lazy\"></figure>\n<figure class=\"pg\"><img src=\"assets/rules/p90.png\" alt=\"图示\" loading=\"lazy\"></figure>\n<h3>7. \t附加助理裁判员讯号</h3>\n<p>进球(除非一些明显完全越过球门线的进球)</p>"},{"id":"law-7","title":"第七章 比赛时间","law":7,"pages":"92-95","html":"<h3>1.\t比赛时间</h3>\n<p>赛事应分为两个半场，每半场为45分钟。除非在开赛前裁判员与双方球队同意及根据竞赛规程条例下可将比赛时间减少。</p>\n<h3>2.\t半场休息时间</h3>\n<p>球员有权在半场结束后获得不超过15分钟休息时间；在加时比赛半场可有短暂补充水份小休(不得超过一分钟)。竞赛规程必须清楚列明半场休息时间及只能在裁判员准许下才可更改。</p>\n<h3>3.\t补回消耗时间</h3>\n<p>每个半场在下列情况所消耗的比赛时间由裁判员补回：</p>\n<ul>\n<li>替换球员</li>\n</ul>\n<ul>\n<li>评估球员受伤情况及/或将受伤球员移离比赛场地接受治理</li>\n</ul>\n<ul>\n<li>被蓄意浪费的时间</li>\n</ul>\n<ul>\n<li>执行纪律处分的时间</li>\n</ul>\n<ul>\n<li>竞赛规程可批准因医疗理由之暂停，例如「补充水份」小休(不得超过一分钟)及「降温」小休(由九十秒至三分钟不等)</li>\n</ul>\n<ul>\n<li>有关视频助理裁判员的「检查」及「覆核」引致的延误</li>\n</ul>\n<ul>\n<li>庆祝进球</li>\n</ul>\n<ul>\n<li>任何其他原因，包括对重新开始比赛的任何重大延误（例如，由外来物体干扰而导致的延误）在每半场比赛结束的一刻，由后备官员显示裁判员决定最少补回消耗的时间。当裁判员认为有需要时，显示的补时时间可能会被增加，但不会减少。</li>\n</ul>\n<p>裁判员不得将上半场错误计算的时间，在下半场补回或减少比赛时间。</p>\n<h3>4.\t点球</h3>\n<p>半场完结或加时完结时，比赛时间可因执行点球而延长至该点球完成为止。</p>\n<h3>5.\t被腰斩赛事</h3>\n<p>除非竞赛规程或主办机构另有规定，否则比赛进行中被腰斩的比赛应重赛。</p>"},{"id":"law-8","title":"第八章 比赛开始与重新开始比赛","law":8,"pages":"96-99","html":"<p>中圈开球是比赛中每个半场及每个加时半场开始及进球后重新开始比赛的一种方式。任意球(直接或间接)、点球、界外球、球门球及角球则属于其他重新开始比赛的方式(参阅规则第13至17章)。在没有任何规则列明如何重新开始比赛之情况下，坠球是裁判员因事件而要暂停比赛后的一种重新开始比赛的方式。</p>\n<p>如触犯规则发生于比赛暂停时，原本重新开始比赛的方式不变。</p>\n<h3>1.\t中圈开球</h3>\n<p>程序</p>\n<ul>\n<li>裁判员掷毫，掷毫的胜方将决定选择上半场进攻方向或中圈开球权</li>\n</ul>\n<ul>\n<li>按上述选择情况，而对方可获得中圈开球权或选择上半场进攻方向</li>\n</ul>\n<ul>\n<li>选择上半场进攻方向的一方将于在下半场开始时中圈开球</li>\n</ul>\n<ul>\n<li>下半场比赛开始前，双方必须更换进攻方向</li>\n</ul>\n<ul>\n<li>当一球队取得进球后，由对方中圈开球重新开始比赛</li>\n</ul>\n<p>所有中圈开球：</p>\n<ul>\n<li>除开球球员外，所有其他球员必须位于其球队的半场内</li>\n</ul>\n<ul>\n<li>开球的对方球员必须要离球9.15米(10码)直至比赛正式开始</li>\n</ul>\n<ul>\n<li>球必须被放定在中圈点上</li>\n</ul>\n<ul>\n<li>裁判员发出讯号</li>\n</ul>\n<ul>\n<li>当球被踢及明显移动后，比赛便正式开始</li>\n</ul>\n<ul>\n<li>中圈开球可直接射门取得进球；但只限射入对方球门。如球射入己方球门，判对方获得一个角球。</li>\n</ul>\n<p>触犯规则及罚则如开球的球员在球未经其他球员触球前再次触球，对方球队于犯规地点获获得一个间接任意球，或如触犯手球犯规，则判对方球队于犯规地点获获得一个直接任意球。</p>\n<p>触犯其他在进行中圈开球程序时的规则，重新执行中圈开球程序。</p>\n<h3>2.\t坠球(公正球)</h3>\n<p>程序</p>\n<ul>\n<li>当比赛暂停后，球：</li>\n</ul>\n<ul>\n<li class=\"l2\">处于其罚球区内 - 坠球给予在罚球区内守方的守门员</li>\n</ul>\n<ul>\n<li class=\"l2\">在罚球区外 - 如裁判员能确定控球权将会保持或属于哪一球队（包括在比赛暂停时本应执行重新开始比赛），堕球应给予该球队一名球员；否则堕球应给予比赛暂停前最后触及球的球队一名球员。堕球应在比赛暂停时球所在地开出。堕球应在比赛暂停时球所在地开出，除非球击中比赛官员或外来物体，此情况下应在干扰/触及位置开出坠球</li>\n</ul>\n<ul>\n<li>任何其他球员(攻守双方)，于重新开始比赛前，必须处于离开坠球位置至少4米(4.5码)以外</li>\n</ul>\n<p>当球触及地面时比赛便正式开始。</p>\n<p>触犯规则及罚则在下列情况下坠球必须重新执行：</p>\n<ul>\n<li>在球触及地面前已触碰到球员</li>\n</ul>\n<ul>\n<li>在球触及地面后而未有被球员触碰已离开比赛场地在坠球开出后，如球未经最少两名球员接触便被踢进球门：</li>\n</ul>\n<ul>\n<li>如球被踢进对方球门，判对方获得一个球门球</li>\n</ul>\n<ul>\n<li>如球被踢进己方球门，判对方获得一个角球</li>\n</ul>"},{"id":"law-9","title":"第九章 比赛进行与比赛停止","law":9,"pages":"100-101","html":"<h3>1.\t比赛暂停进行时</h3>\n<p>下列为比赛暂停进行情况：</p>\n<ul>\n<li>整个球在地面上或空中完全越过球门线或边线</li>\n</ul>\n<ul>\n<li>比赛被裁判员暂停</li>\n</ul>\n<ul>\n<li>球触及比赛官员后仍留在比赛场地上导致：</li>\n</ul>\n<ul>\n<li class=\"l2\">一球队发动明显进攻或</li>\n</ul>\n<ul>\n<li class=\"l2\">球直接进入网内成为进球或</li>\n</ul>\n<ul>\n<li class=\"l2\">改变球队的控球权</li>\n</ul>\n<p>在以上三种情况，用坠球重新开始比赛。</p>\n<h3>2.\t比赛进行中</h3>\n<p>如球触及比赛官员及从球门柱、横梁或角球旗杆反弹回比赛场地范围内，比赛仍被视作在进行中及球仍然在比赛场地内。</p>\n<p>在没有不公平干扰比赛意图的情况下，当球队官员、替补队员、已被换下或 被罚令出场的球员，或暂时离开比赛场地的球员（受伤或调整装备等等）触及即将出界的球，判罚一间接任意球，并且无需采取纪律处分。</p>"},{"id":"law-10","title":"第十章 决定比赛胜负的方法","law":10,"pages":"102-107","html":"<h3>1.\t进球</h3>\n<p>凡整个球从两球门柱之间，横梁下完全越过球门线，而进球之前并未有攻方球员触犯规则，便成为一个进球。</p>\n<p>如守门员将球直接掷入对方球队球门网内，判对方获得一个球门球。</p>\n<p>如裁判员在整个球完全越过球门线前示意进球，应以坠球重新开始比赛。</p>\n<h3>2.\t得胜球队</h3>\n<p>在比赛中进球较多的一队为得胜球队。如双方进球相同或未有入球，比赛结果应为和局。</p>\n<p>当比赛为和局，包括主客比赛成积总和相同，而根据竞赛规程该场球赛需分胜负时，只可使用以下获批准的形式决定胜方：</p>\n<ul>\n<li>作客进球条例</li>\n</ul>\n<ul>\n<li>两个相同但不超过15分钟半场的加时比赛</li>\n</ul>\n<ul>\n<li>点球（射点球决胜）可混合使用上述决胜方法。</li>\n</ul>\n<h3>3.\t点球（射点球决胜）</h3>\n<p>除非规则另有订明，如比赛完场时赛果仍然赛和，应采用点球（射点球决胜）来决定球赛胜方。在比赛时被红牌罚令出场的球员不可参与点球；而在比赛中的口头警告以及黄牌警告之纪录不会被带至点球（射点球决胜）</p>\n<figure class=\"pg\"><img src=\"assets/rules/p104.png\" alt=\"图示\" loading=\"lazy\"></figure>\n<p>程序点球（射点球决胜）前</p>\n<ul>\n<li>除非有其他考虑因素(例如场地状况、安全问题等)，否则裁判员应用掷毫决定射点球的球门，决定后只可因为安全理由、球门或比赛场地状况变得不能使用才可更改</li>\n</ul>\n<ul>\n<li>裁判员决定射点球的球门后再掷毫，掷毫胜方的球队可选择首先主射第一个点球或较后主射第二个点球</li>\n</ul>\n<ul>\n<li>除合资格替代不能继续比赛守门员的替补队员外，只有在完场一刻在比赛场地的球员或暂时离开比赛场地的球员(受伤、整理装备等)才有资格参与射点球决胜负</li>\n</ul>\n<ul>\n<li>每队自行负责从合资格球员中挑选主射点球的球员及安排其射球次序。但不需要通知裁判员有关次序</li>\n</ul>\n<ul>\n<li>在比赛结束后及在互射点球决胜负开始前或过程中，如一队比其对方多出球员时，该队必须减少球员数目直至与对方人数相同，球队必须通知裁判员哪一名合资格球员(姓名及球衣号码)在名单被删减。除下述情况外，任何被删减的球员不能参加射点球决定胜负</li>\n</ul>\n<ul>\n<li>守门员在互射点球决胜负开始前或过程中不能继续比赛，可以换入一名被删减达至双方球员数目相等的球员替代，又或其球队之换人名额尚未用尽时，可以换入一名替补队员替代，但该换出的守门员不能参与余下的过程及主射点球。</li>\n</ul>\n<ul>\n<li>如被换下的守门员已经主射过点球，该名入替球员只可在下轮点球才可主射点球</li>\n</ul>\n<p>点球（射点球决胜）时</p>\n<ul>\n<li>只准许合资格的球员及比赛官员留在比赛场地</li>\n</ul>\n<ul>\n<li>除主射点球员及两名守门员外，其他球员必须处于在中圈之内</li>\n</ul>\n<ul>\n<li>主射球员之同队守门员必须处于比赛场地内及在举行射点球之罚球区外的球门线与罚球区线之交汇点上</li>\n</ul>\n<ul>\n<li>合资格之同队球员可与守门员互换位置</li>\n</ul>\n<ul>\n<li>当球停止滚动、越出比赛场地或裁判员因有球员触犯规则而停止比赛时，该点球便完成；主射球员不可再次蓄意处理球</li>\n</ul>\n<ul>\n<li>如主射球员意外同时用双脚踢球，或球在踢出后立即触及其非踢球脚或腿：</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球被射入，重踢该点球</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球不入网，该点球被判作射失</li>\n</ul>\n<ul>\n<li>裁判员记录射点球过程</li>\n</ul>\n<ul>\n<li>如守门员触犯规则而导致点球重射，守门员第一次触犯规则时会被口头警告，再犯则会被黄牌警告</li>\n</ul>\n<ul>\n<li>如主射球员在裁判员发出讯号后触犯规则而被判罚，该点球被判作射失，而主射球员应被黄牌警告</li>\n</ul>\n<p>根据以下情况，每队主射五个点球</p>\n<ul>\n<li>双方以交替式轮流主射点球</li>\n</ul>\n<ul>\n<li>每一个点球由不同的合资格球员主射及直至同一球队所有合资格球员俱曾主射点球后，球员才可作第二次主射</li>\n</ul>\n<ul>\n<li>双方在完成五次射点球前，如其中一队的进球数字多于另一队，就算该落后球队继续主射至第五球也没有可能追平时，则射点球应该结束</li>\n</ul>\n<ul>\n<li>如双方在射完五次后的进球数字仍然相同，在此情况下，射点球应继续 进行，直至双方主射次数相同，而其中一队多对方一个入球为止</li>\n</ul>\n<ul>\n<li>当所有合资格球员完成首轮点球决胜负后，要进行第二轮点球决胜负，点球程序原则不变，但球队可改变主射点球球员次序</li>\n</ul>\n<ul>\n<li>点球（射点球决胜）不能因为有球员离开比赛场地而有所延误。假如该名球员未能在适当时间内返回比赛场地内主射该点球，该名球员将会丧失主射点球权利(作不进球论)在点球（射点球决胜）进行中的替换程序或罚令出场情况裁判员可</li>\n</ul>\n<p>向球员、替补队员、已被换下球员或球队官员作黄牌警告或红牌驱逐离场</p>\n<ul>\n<li>当守门员被红牌罚令出场，只可由另一名合资格球员代替完成余下的程序</li>\n</ul>\n<ul>\n<li>除守门员受伤外，其他不能继续比赛的球员不得替换</li>\n</ul>\n<ul>\n<li>当其中一队少于七名球员，裁判员毋须腰斩比赛</li>\n</ul>"},{"id":"law-11","title":"第十一章 越位","law":11,"pages":"108-111","html":"<h3>1.\t越位位置</h3>\n<p>身处越位位置并不触犯规则。</p>\n<p>一名球员被视为身处越位位置如：</p>\n<ul>\n<li>头部、身体或脚的任何部分处于对方场区(不包括中场线)及</li>\n</ul>\n<ul>\n<li>头部、身体或脚的任何部分比对方第二名最后的球员及球更接近对方球门线</li>\n</ul>\n<p>所有球员(包括守门员)的上肢及手部不会被计算在越位位置上。为判断是否越位，腋窝用作界定肩膊与手臂最上部分的分界线。</p>\n<p>一名球员不被视为身处越位位置，如当该球员：</p>\n<ul>\n<li>与对方第二名最后球员处于同一线上，或</li>\n</ul>\n<ul>\n<li>与对方最后两名球员处于同一线上</li>\n</ul>\n<h3>2.\t越位犯规</h3>\n<p>若在队友踢球或触球时*，身处越位位置的球员只会在有积极参与比赛时才会被判越位犯规：</p>\n<ul>\n<li>干扰比赛是指接应或接触由其队友踢出或触及的传球，或</li>\n</ul>\n<ul>\n<li>干扰对方球员：</li>\n</ul>\n<ul>\n<li class=\"l2\">明显阻碍对方球员的视线而导致对方球员不能处理球，或</li>\n</ul>\n<ul>\n<li class=\"l2\">与对方球员争夺球或</li>\n</ul>\n<ul>\n<li class=\"l2\">明显于近距离试图参与处理球，而此举动明显影响对方球员，或</li>\n</ul>\n<ul>\n<li class=\"l2\">作出明确动作，而此举动明显影响对方球员参与处理球的能力</li>\n</ul>\n<p class=\"fn\">*「踢球」或「触球」应以接触球的一刻计算；但如果是守门员掷出皮</p>\n<p>球时，应以最后接触球的一刻计算。</p>\n<p>或</p>\n<ul>\n<li>利用身处越位位置参与处理球或干扰对方球员从而取得利益：</li>\n</ul>\n<ul>\n<li class=\"l2\">从球门柱、横梁、比赛官员或对方球员反弹或改变方向回来的球</li>\n</ul>\n<ul>\n<li class=\"l2\">球被对方球员蓄意救球后反弹</li>\n</ul>\n<p>一名身处越位位置的球员接获对方球员的蓄意处理球*传来的球，包括蓄意手球，不应被视为触犯利用身处越位位置而取得利益之越位犯规，但对方球员的蓄意救球除外。</p>\n<p class=\"fn\">*「蓄意处理球」</p>\n<p>（不包括蓄意手球）指球员控制球时可能：</p>\n<ul>\n<li>将球传给队友；</li>\n</ul>\n<ul>\n<li>获得控球权；或</li>\n</ul>\n<ul>\n<li>解围（包括踢球或头搥）。</li>\n</ul>\n<p>如果控球球员传球、试图获得控球权或解围不准确或不成功，这并不否定该球员「蓄意处理球 」的事实。</p>\n<p>以下准则应酌情作为球员控制球并因此可被视为「蓄意处理球」的指标：</p>\n<ul>\n<li>球从远处传来，并且球员可以清楚看到球</li>\n</ul>\n<ul>\n<li>球移动速度不快</li>\n</ul>\n<ul>\n<li>球的方向并非不可预测</li>\n</ul>\n<ul>\n<li>球员有时间协调其身体动作，即不是本能的伸展或跳跃，或有限接触/控制的动作。</li>\n</ul>\n<ul>\n<li>在地面上移动的球比在空中的球更容易被踢。</li>\n</ul>\n<p>「救球」是指球员除了用手/手臂外(守门员可在其罚球区内利用手救球)，利用身体任何部位阻止、或试图阻止一个进球或一个有可能的进球。</p>\n<p>在以下情况：</p>\n<ul>\n<li>当一名处于越位位置的球员，身处在对方球员的跑动路线上，跑离越位位置或在越位位置站立不动从而影响对方球员跑向球位置时，过程中如出现阻碍对方球员处理球或争夺球，则属于越位犯规；如该球员跑向对方球员的跑动路线及阻碍对方球员前进(例如阻挡对方球员跑动)，应根据规则第12章作出判罚</li>\n</ul>\n<ul>\n<li>当一名处于越位位置的球员跑向球及试图参与处理球，但在玩球或试图处理球或与对方球员争夺球前被对方球员侵犯，因该犯规事件发生于越位犯规之前，故此应判罚该犯规动作</li>\n</ul>\n<ul>\n<li>当一名处于越位位置的球员已在处理球或试图处理球或与对方球员争夺球后才被对方球员侵犯，因越位犯规发生在该犯规事件之前，故此应判罚越位犯规</li>\n</ul>\n<h3>3.\t不构成犯规</h3>\n<p>当一名球员从下列情况取得球不会触犯越位犯规：</p>\n<ul>\n<li>球门球</li>\n</ul>\n<ul>\n<li>界外球</li>\n</ul>\n<ul>\n<li>角球</li>\n</ul>\n<h3>4.\t触犯规则及罚则</h3>\n<p>如有球员触犯越位犯规，裁判员应判对方球队在犯规地点获得一个间接任意球，包括在犯规球员的半场内。</p>\n<p>防守球员未得到裁判员的准许而离开比赛场地，在越位规则上将被视为逗留在球门线上或边线上，直至比赛暂停或守方球队将皮球踢向中场线并离开其罚球区。如果该名球员是蓄意离开比赛场地，裁判员必须在紧接的下一个比赛暂停时黄牌警告该球员。</p>\n<p>攻方球员可踏出或离开比赛场地以表明没有参与进行中的比赛。</p>\n<p>假若该球员在暂停比赛前或防守球队已将球踢向中场线并离开其罚球区前从球门线重新返回比赛场地，变成参与比赛，该名球员在越位规则上将被视为身处于球门线上。如该球员蓄意离开比赛场地及在没有裁判员的准许下再次返回比赛场地，借以避过触犯越位犯规而获得不公平的利益时，该球员必须被黄牌警告。</p>\n<p>如进球时，一名攻方球员身处于两柱之间和球门网内保持不动，应判进球有效。除非该名球员触犯越位犯规或规则第12章内的犯规，在这情况下，应判守方获得一个间接或直接任意球。</p>"},{"id":"law-12","title":"第十二章 犯规与不正当行为","law":12,"pages":"112-125","html":"<p>只有在比赛进行中触犯规则，才会被判罚直接任意球、间接任意球及点球。</p>\n<h3>1.\t直接任意球</h3>\n<p>一名球员向对方作出下列任何一项犯规时，如裁判员认为其举动为不小心、鲁莽或过度使用力量，判对方获得一个直接任意球：</p>\n<ul>\n<li>冲撞</li>\n</ul>\n<ul>\n<li>跳向</li>\n</ul>\n<ul>\n<li>踢或意图踢</li>\n</ul>\n<ul>\n<li>推</li>\n</ul>\n<ul>\n<li>击打或意图击打(包括用头顶撞)</li>\n</ul>\n<ul>\n<li>拦截或冲击</li>\n</ul>\n<ul>\n<li>绊倒或意图绊倒</li>\n</ul>\n<p>假如犯规动作涉及身体接触，会被判罚一直接任意球或点球。</p>\n<ul>\n<li>不小心是指球员在没有事前专注或事先考虑的情况下与对方争夺球。毋须对犯规球员采取纪律处分</li>\n</ul>\n<ul>\n<li>鲁莽是指球员在争夺球时没有顾及对方球员的危害或后果。犯规球员必须被黄牌警告</li>\n</ul>\n<ul>\n<li>使用过度的力量是指球员动作所用力量超出需要及/或伤害和危及对方球员。犯规球员必须被红牌罚令出场</li>\n</ul>\n<p>当一名球员触犯下列任何一项犯规时，亦会被判罚一直接自由球：</p>\n<ul>\n<li>手球犯规(守门员在己方罚球区内不受限制)</li>\n</ul>\n<ul>\n<li>拉扯对方球员</li>\n</ul>\n<ul>\n<li>阻碍对方球员前进时有身体接触</li>\n</ul>\n<ul>\n<li>咬或向任何在球队名单人员或比赛官员吐唾沫</li>\n</ul>\n<ul>\n<li>以手中持有的物件掷中球、对方球员或球队官员，或接触球</li>\n</ul>\n<p>另外可参阅规则第3章内列明之犯规。</p>\n<p>手球为判断手球犯规，腋窝用作界定肩膊与手臂最上部分的分界线。</p>\n<p>并非每一次球碰到球员的手/手臂都属于犯规。</p>\n<p>如球员作出以下动作便属于犯规：</p>\n<ul>\n<li>蓄意用手/手臂接触球，例如将手/手臂移向球</li>\n</ul>\n<ul>\n<li>当手/手臂使球员的身体不自然地扩大时用有关部位接触球。在特定情况下，球员的手/手臂位置并不是因其身体动作的结果或不能证实是因身体动作时产生，球员的身体便会被视为不自然地扩大，球员此时手/手臂所处的位置被球击中，便可能冒上手球犯规的风险而被判罚。</li>\n</ul>\n<ul>\n<li>把球射入对方球门：</li>\n</ul>\n<ul>\n<li class=\"l2\">即使是意外，如进球是因球员(包括守门员)将球直接从手/手臂送入对方球门</li>\n</ul>\n<ul>\n<li class=\"l2\">即使是意外，球员的手/手臂触及球后，继而立即把球射入对方球门</li>\n</ul>\n<p>与其他球员一样，守门员在罚球区外亦同样受到手球限制。有一些情况下，规则是不容许守门员在己方罚球区内用手触球，如守门员触犯，应判罚间接任意球但毋须采取纪律处分。但是，若守门员在重新开始比赛开出球后，在未经其他球员接触皮球前再次触球(无论是否使用手触球)引致干扰/阻止对方一明显进攻机会或破坏对方一个进球或一明显进球机会，必须被黄牌警告或被红牌罚令出场。</p>\n<figure class=\"pg\"><img src=\"assets/rules/p115.png\" alt=\"图示\" loading=\"lazy\"></figure>\n<h3>2.\t间接任意球</h3>\n<p>判对方获得一个间接任意球，如球员：</p>\n<ul>\n<li>以危险动作处理球</li>\n</ul>\n<ul>\n<li>阻碍对方球员推进，而过程中并未有触及对方身体任何部分</li>\n</ul>\n<ul>\n<li>触犯用冒犯性、侮辱性或辱骂性言语及/或举动表示不满又或其他言语上的犯规</li>\n</ul>\n<ul>\n<li>阻挠对方守门员从手中开出球或当守门员正释放球时，球员踢中球或意图踢向球</li>\n</ul>\n<ul>\n<li>蓄意发起诡计利用头部、胸部或膝部等部位将球（包括从自由球或球门球）传给其守门员以逃避规则的惩罚，无论守门员是否用手触碰球；如果是守门员蓄意发起诡计，则该守门员将受到惩罚</li>\n</ul>\n<ul>\n<li>触犯任何一项未有在规则提及的犯规，因而导致裁判员需要暂停比赛及黄牌警告球员或红牌驱逐球员离场</li>\n</ul>\n<p>如守门员在己方罚球区内触犯下列任何一项犯规，判对方获得一个间接任意球：</p>\n<ul>\n<li>放出球后在未经其他球员接触球前再次用手/手臂接触皮球</li>\n</ul>\n<ul>\n<li>用手/手臂接触从下列情况交回的球属于犯规，但如守门员明显将球踢走或意图将球踢出继续比赛后才用手/手臂接触到球则属例外：</li>\n</ul>\n<ul>\n<li class=\"l2\">队友蓄意用脚踢回传之球</li>\n</ul>\n<ul>\n<li class=\"l2\">队友直接掷入之界外球</li>\n</ul>\n<p>危险动作处理球危险动作处理球是球员尝试处理球时，任何威胁球员安全而可引致受伤的动作(包括球员本身)及令在附近对方的球员因担心受伤而不参与争夺球。</p>\n<p>不危及对方球员安全的剪刀式或倒挂式踢球是容许的。</p>\n<p>阻碍对方球员推进阻碍对方球员推进是指当球并非处于一名球员可争夺的距离时，球员移至对方球员跑动路线上试图阻碍、阻塞、阻慢或迫使对方改变方向。</p>\n<p>所有球员都有权留在比赛场地上任何位置；处于对方球员跑动路线上并不等同于移至对方球员的跑动路线上。</p>\n<p>如球在球员一个可争夺的距离时，球员跑到球与对方球员之间掩护球而又没有以手臂或身体阻碍对方，这并不构成犯规。如球处于球员可争夺的距离时，球员可向对方作出合理冲撞动作争夺球。</p>\n<h3>3. 角球</h3>\n<p>如果守门员在其罚球区内用手/手臂持球超过八秒才放出球，判对方一角球。</p>\n<p>守门员在以下情况会被认为已用手/手臂控制球：</p>\n<ul>\n<li>当球在其双手/双臂中或处于手/手臂与任何接触面之间(如地面、自己身体等)</li>\n</ul>\n<ul>\n<li>当球在守门员伸展开的手上</li>\n</ul>\n<ul>\n<li>在地面上来回拍球或将球抛向空中</li>\n</ul>\n<p>裁判员将决定守门员持球的一刻及计算八秒的开始，并将举手示意倒计时最后五秒。</p>\n<p>当守门员用手/手臂控制球后，对方球员不能与他争夺球。</p>\n<h3>4.\t纪律行动</h3>\n<p>裁判员有权在进进球场后，由作场地检查开始直至比赛全场完结后离开球场前(包括在点球（射点球决胜）的时候)执行纪律行动。</p>\n<p>如球员或球队官员在未踏入场地开始比赛前触犯应被红牌驱逐离场的规条，裁判员有权禁止该球员或球队官员参与比赛(参阅规则第3章第6节)；裁判员事后应提交不正当行为报告。</p>\n<p>球员或球队官员无论在场内或场外，触犯一可被黄牌警告或可被红牌罚令出场的犯规时，应依照规则作出判罚。</p>\n<p>黄牌是裁判员用以显示警告，而红牌是裁判员用以显示罚令出场。</p>\n<p>裁判员只可向球员、替补队员、已换下的球员或球队官员出示红牌或黄牌。</p>\n<p>球员、替补队员及已被换下球员延迟重新开始比赛来出示红/黄牌当裁判员决定出示(红/黄)牌后，不论是黄牌警告球员或红牌驱逐球员离场，都必须完成执行纪律行动后才可重新开始比赛。但在裁判员仍未开始采取纪律处分程序及在有一个清晰进球机会的情况下，被侵犯的球队快速开出任意球，则不受此限制。该纪律处分应在紧接的下一个比赛暂停时执行，如该犯规属破坏对方球队一个明显进球机会，犯规球员应被黄牌警告；如该犯规属干扰/阻止对方一明显进攻机会，犯规球员不需要被黄牌警告。</p>\n<p>有利如裁判员运用有利于一个应被黄牌警告/应被红牌罚令出场的犯规，此警告/罚令出场必须在紧接的下一个比赛暂停时执行。若然裁判员运用有利处理属于一个破坏对方明显进球机会犯规后，需以欠缺体育精神行为黄牌警告该犯规球员，除非非犯规球队因运用有利而进球，此情况下则不作纪律处分；如该犯规属干扰/阻止对方一明显进攻机会，犯规球员不需要被黄牌警告。</p>\n<p>当球员触犯严重犯规、凶暴行为或应被第二次黄牌警告之犯规时，除非当时出现一个明显的进球机会，否则裁判员不应运用有利条例。若有运用有利条例，裁判员应于紧接的下一个比赛暂停时，驱逐该名球员离场。但如该名犯规球员仍参与处理球、争夺球或影响对方球员时，裁判员应暂停比赛，驱逐该名犯规球员离场及判一间接任意球予对方重新开始比赛，除非该名球员触犯更严重的犯规。</p>\n<p>如防守球员在罚球区外拉扯进攻球员，直至进入罚球区后仍继续作出拉扯动作，裁判员应判罚点球。</p>\n<p>可被黄牌警告的犯规如以下罪行成立，球员应被黄牌警告：</p>\n<p>拖延重新开始比赛（如下文「拖延重新开始比赛」所述）</p>\n<ul>\n<li>用言语或行动表示不满</li>\n</ul>\n<ul>\n<li>未得裁判员准许擅自进入、再次进入或蓄意离开比赛场地范围</li>\n</ul>\n<ul>\n<li>在开坠球、角球、任意球或掷界外球时未有遵照规则规定的离球距离</li>\n</ul>\n<ul>\n<li>屡次触犯规则(构成「屡次」没有特定次数及犯规模式)</li>\n</ul>\n<ul>\n<li>欠缺体育精神行为</li>\n</ul>\n<ul>\n<li>进入裁判员覆检区域(RRA)</li>\n</ul>\n<ul>\n<li>过分做出覆检「电视讯号」手势</li>\n</ul>\n<p>如以下罪行成立，替补队员或已被换下的球员应被黄牌警告：</p>\n<ul>\n<li>拖延重新开始比赛</li>\n</ul>\n<ul>\n<li>用言语或行动表示不满</li>\n</ul>\n<ul>\n<li>未得裁判员准许擅自进入、再次进入或蓄意离开比赛场地范围</li>\n</ul>\n<ul>\n<li>欠缺体育精神行为</li>\n</ul>\n<ul>\n<li>进入裁判员覆检区域(RRA)</li>\n</ul>\n<ul>\n<li>过分做出覆检「电视讯号」手势</li>\n</ul>\n<p>当触犯两项分别都需要被黄牌警告的犯规时(纵使发生时间十分接近)，应该出示两个黄牌警告，例如球员在未得裁判员准许擅自进入比赛场地范围后即时触犯鲁莽拦截或利用犯规/手球去停止对方一明显进攻机会等等。</p>\n<p>应被黄牌警告的欠缺体育精神行为有很多不同的情况，球员触犯欠缺体育精神行为必须被黄牌警告，包括，如球员：</p>\n<ul>\n<li>试图欺骗裁判员，例如假装受伤或假装被侵犯(伪装行为)</li>\n</ul>\n<ul>\n<li>在比赛进行中球员在未得到裁判员准许与守门员互换位置(参阅规则第3章)</li>\n</ul>\n<ul>\n<li>触犯可被判直接任意球的鲁莽犯规</li>\n</ul>\n<ul>\n<li>触犯手球引致干扰或阻止对方一明显进攻机会，唯裁判员裁定为非蓄意手球犯规而判罚一个罚球点球则除外</li>\n</ul>\n<ul>\n<li>破坏对方一个进球或明显进球机会，而裁判员裁定为非蓄意手球犯规而判罚一个罚球点球</li>\n</ul>\n<ul>\n<li>因触犯任何其他违规行为引致干扰或阻止对方一明显进攻机会，如该犯规是球员在意图争夺球或争夺球情况下产生及被判罚一个罚球点球则例外</li>\n</ul>\n<ul>\n<li>因意图争夺球或争夺球时犯规引致破坏对方一明显进球机会，而该犯规被裁判员判罚一个罚球点球</li>\n</ul>\n<ul>\n<li>蓄意用手触球去取得进球(不论是否成功取得进球)</li>\n</ul>\n<ul>\n<li>在比赛场地内划上未经认可的记号</li>\n</ul>\n<ul>\n<li>在得到裁判员准许离开比赛场地，在离开途中时处理球</li>\n</ul>\n<ul>\n<li>显示对球赛不尊重</li>\n</ul>\n<ul>\n<li>蓄意发起诡计利用头部、胸部或膝部等部位将球(包括从任意球或球门球)传给其守门员以逃避规则的惩罚，无论守门员是否用手触碰球；如果守门员需要为蓄意发起诡计负责，该守门员则被黄牌警告</li>\n</ul>\n<ul>\n<li>在比赛进行中或重新开始比赛时，用言语分散对方球员的注意力</li>\n</ul>\n<p>庆祝进球球员正常表达进球后的喜悦是容许的，但庆祝不应过度；绝不鼓励精心设计的庆祝及庆祝时间不应造成浪费时间。</p>\n<p>球员离开比赛场地以庆祝进球并不是可被黄牌警告的犯规行为，但球员需尽快返回比赛场地继续比赛。</p>\n<p>就算进球被取消，球员作出以下行为仍必须被黄牌警告：</p>\n<ul>\n<li>攀爬上球场围栏及/或走向观众作出一些会构成安全及/或保安问题的行为</li>\n</ul>\n<ul>\n<li>作出具有挑衅、嘲弄及煽动性的举动</li>\n</ul>\n<ul>\n<li>以面具或类似的物件遮盖头部或面部以庆祝进球</li>\n</ul>\n<ul>\n<li>脱去球衣或用球衣盖住头部拖延重新开始比赛裁判员必须黄牌警告作出以下过度拖延重新开始比赛行为的球员，包括如第3章、第15章及第16章及其协定所述，或以下球员：</li>\n</ul>\n<ul>\n<li>裁判员停止比赛后，蓄意踢走或带走球，又或刻意触碰球员因而挑起球员之间冲突</li>\n</ul>\n<ul>\n<li>刻意在错误地点开出任意球迫使裁判员指令重开该任意球</li>\n</ul>\n<p>罚令出场的犯规球员、替补队员或已被换下球员触犯下列任何一项时，应被红牌驱逐离场：</p>\n<ul>\n<li>触犯蓄意手球犯规引致破坏对方一个进球或一明显进球机会(守门员在己方罚球区内除外)</li>\n</ul>\n<ul>\n<li>在己方罚球区外触犯非蓄意手球犯规引致破坏对方一个进球或一明显进球机会</li>\n</ul>\n<ul>\n<li>当一名球员的整体移动是向著犯规球员的球门推进，受到侵犯引致一个进球或明显进球机会被破坏，而该犯规原则上需要被判罚一任意球(下述情况除外)</li>\n</ul>\n<ul>\n<li>严重犯规</li>\n</ul>\n<ul>\n<li>咬任何人或向任何人员吐唾沫</li>\n</ul>\n<ul>\n<li>凶暴行为</li>\n</ul>\n<ul>\n<li>用冒犯性、侮辱性或辱骂性的言语及/或举动</li>\n</ul>\n<ul>\n<li>在同一场比赛中被第二次黄牌警告</li>\n</ul>\n<ul>\n<li>进入视像操作室(VOR)</li>\n</ul>\n<p>已被红牌罚令出场的球员、替补队员或已被换下球员，必须离开比赛场地范围及技术指导区域。</p>\n<p>破坏进球或明显进球机会 (DOGSO)当一名球员触犯蓄意手球犯规引致破坏对方一个进球或一明显入球机会时，则不论犯规行为发生的位置，犯规球员应被红牌驱逐离场(守门员在己方罚球区内除外)。当一名球员触犯非蓄意手球犯规引致破坏对方一个进球或一明显进球机会时，而裁判员已判罚点球予对方，犯规球员只需被黄牌警告；一名球员、已被罚令出场球员、替补队员或已被换下球员在未得裁判员准许进入比赛场地干扰比赛或对方球员引致破坏对方进球或明显进球机会时，属于触犯必须被红牌罚令出场的犯规。</p>\n<p>下列情况必须被考虑：</p>\n<ul>\n<li>犯规地点与球门距离</li>\n</ul>\n<ul>\n<li>整体处理球方向</li>\n</ul>\n<ul>\n<li>保持或获得控制球可能性</li>\n</ul>\n<ul>\n<li>防守及进攻球员球员位置和人数</li>\n</ul>\n<p>严重犯规使用危及对方安全或过度力量或用暴行拦截或冲击对方，应以触犯严重犯规罚则制裁。</p>\n<p>任何球员在争夺球时使用过度的力量或危及对方球员安全情况下，从前面、侧面或背面跃起用单脚或双脚冲冲击对方球员，应被视为触犯严重犯规。</p>\n<p>凶暴行为凶暴行为是球员在非争夺球时，在不论有否身体接触的情况下，使用或试图使用过度的力量或用暴行针对对方球员、同队球员、球队职员、比赛官员、观众或任何其他人员。</p>\n<p>除此之外，当球员在并非争夺球情况下蓄意用手或手臂击打对方球员或其他任何人员头部或面部时，除非击打力度微不足道，否则，应被视为触犯凶暴行为。</p>\n<p>球队官员如出现触犯规则情况，而犯规人员属技术指导区域（替补队员、已被换下球员、已被罚令出场球员或球队官员），并且身份未能被确认，将按触犯规则情况处分技术指导区域内球队最高级教练(或负责人员)。口头警告当触犯以下情况，一般须被口头警告；重复或公然触犯规则情况便须被黄牌警告或被红牌罚令出场：</p>\n<ul>\n<li>以尊重/非对抗性态度进入比赛范围</li>\n</ul>\n<ul>\n<li>未能配合比赛官员指示，例如忽视助理裁判员或后备裁判员发出的指令/要求</li>\n</ul>\n<ul>\n<li>对于裁判员判决(以言语或行动)表达轻微/低程度的不满</li>\n</ul>\n<ul>\n<li>偶尔离开技术指导区域，但并无触犯规则</li>\n</ul>\n<p>黄牌警告须黄牌警告的情况包括(但不限于)以下：</p>\n<ul>\n<li>明显/持续离开其技术指导区域</li>\n</ul>\n<ul>\n<li>拖延己方球队重新开始比赛</li>\n</ul>\n<ul>\n<li>蓄意进入对方技术指导区域(非对抗性)</li>\n</ul>\n<ul>\n<li>用言语或行动表示不满，包括：</li>\n</ul>\n<ul>\n<li class=\"l2\">掷/踢水樽或其他物件</li>\n</ul>\n<ul>\n<li class=\"l2\">对裁判员作出不尊重举动，例如嘲讽地拍手</li>\n</ul>\n<ul>\n<li>进入裁判员覆检区域(RRA)</li>\n</ul>\n<ul>\n<li>过分/持续示意要求裁判员出示黄牌警告/红牌罚令出场</li>\n</ul>\n<ul>\n<li>过分做出覆检「电视讯号」手势</li>\n</ul>\n<ul>\n<li>作出挑衅或煽动的举动</li>\n</ul>\n<ul>\n<li>持续作出不允许的行为(包括重复作出须被口头警告的犯规)</li>\n</ul>\n<ul>\n<li>显示对球赛不尊重</li>\n</ul>\n<p>红牌罚令出场须红牌罚令出场的情况包括(但不限于)以下：</p>\n<ul>\n<li>拖延对方重新开始比赛，例如持球不放、踢走球、阻碍球员移动</li>\n</ul>\n<ul>\n<li>蓄意离开其技术指导区域借以：向比赛官员以言语表示不满或嘲讽</li>\n</ul>\n<ul>\n<li class=\"l2\">作出挑衅或煽动行为</li>\n</ul>\n<ul>\n<li>走进对方技术指导区域作出侵犯或对抗行为</li>\n</ul>\n<ul>\n<li>蓄意掷/踢水樽或其他物件进入比赛场地</li>\n</ul>\n<ul>\n<li>进入比赛场地：</li>\n</ul>\n<ul>\n<li class=\"l2\">与裁判员对峙(包括半场及全场完结时)</li>\n</ul>\n<ul>\n<li class=\"l2\">干扰比赛、对方球员或比赛官员</li>\n</ul>\n<ul>\n<li>进入视像操控室(VOR)</li>\n</ul>\n<ul>\n<li>向对方球员、替补队员、球队官员、比赛官员、观众或任何其他人员(包括球童，保安员或竞赛职员等)作出身体冲突或侵犯行为(包括吐唾沫或咬人)</li>\n</ul>\n<ul>\n<li>在同一场比赛中被第二次黄牌警告</li>\n</ul>\n<ul>\n<li>用冒犯性、侮辱性或辱骂性的言语及/或举动</li>\n</ul>\n<ul>\n<li>使用未经授权的电子或通讯装备及/或因使用该电子或通讯装备作出不适当行为</li>\n</ul>\n<ul>\n<li>凶暴行为</li>\n</ul>\n<p>投掷物件(或球)的犯规在任何此情况下，裁判员应采取适当的纪律行动：</p>\n<ul>\n<li>鲁莽 – 以欠缺体育精神行为黄牌警告犯规人员</li>\n</ul>\n<ul>\n<li>使用过度力量 – 以凶暴行为驱逐犯规人员离场</li>\n</ul>\n<h3>5.\t犯规及不正当行为后之重新开始比赛</h3>\n<p>如发生在比赛暂停后，应按之前的决定来重新开始比赛。</p>\n<p>如球员在比赛进行中及在比赛场地内触犯一实质犯规：</p>\n<ul>\n<li>对方球员 – 一间接任意球、直接任意球或点球</li>\n</ul>\n<ul>\n<li>同队球员、替补队员、已被换下球员、已被罚令出场球员、球队职员或比赛官员 – 直接任意球或点球</li>\n</ul>\n<p>触犯所有与言语相关的规则会被判罚间接任意球。如果裁判员因球员于比赛场地内或外触犯有关侵犯外来物体的规则而暂停比赛，除非裁判员是因球员触犯在未经准许擅自离开比赛场地而判罚间接自由球，否则将用坠球重新开始比赛；间接任意球应在球员离开比赛场地的界线上开出。</p>\n<p>在比赛进行中：</p>\n<ul>\n<li>如一名球员在比赛场地外侵犯比赛官员或对方的球员、后备球员、已被换下球员、已被罚令出场球员或球队官员，或</li>\n</ul>\n<ul>\n<li>如一名替补队员、已被换下或已被罚令出场球员又或是球队职员在比赛场地外侵犯或干扰对方球员或比赛官员，</li>\n</ul>\n<p>裁判员应判对方获得一个任意球，在最接近发生犯规/干扰事件的界线上重新开始比赛；如需要被判罚直接任意球犯规发生在犯规人员罚球区范围，则判罚一个罚球点球。</p>\n<p>如球员在比赛场地外侵犯同队的球员、替补队员、已被换下球员或球队官员，裁判员应在最接近犯规地点的界线上，判对方获得一个间接任意球重新开始比赛。</p>\n<p>如球员以手中持有的物件(球鞋、护胫等)接触球，判直接任意球(或点球)重新开始比赛。</p>\n<p>一名无论身处场内或场外的球员将物件(并非比赛使用的球)掷或踢向对方球员或将物件(包括另一球)掷或踢向对方替补队员、已被换下球员、已被罚令出场球员、球队官员、或一名赛事执法人员或在比赛进行中的球，裁判员应判罚一直接任意球予对方在物件击中或可能击中该人员或球的地点重新开始比赛。如犯规事件发生在比赛场地外，任意球应在最接近犯规地点的界线上开出；如事件发生在犯规者罚球区范围内，则判罚一个罚球点球。如一名替补队员、已被换下球员、已被罚令出场球员、暂时离开比赛场地的球员或球队官员将物件掷入或踢入比赛场地而干扰比 员或赛事比赛官员，应判由对方在物件干扰比赛、击中或可能击中对方球员、比赛官员或球之地点开出一直接任意球(或点球)重新开始比赛。</p>"},{"id":"law-13","title":"第十三章 任意球","law":13,"pages":"126-129","html":"<h3>1.\t任意球的种类</h3>\n<p>球员、替补队员、已被换下球员、已被罚令出场球员或球队官员触犯规则时，裁判员会判予对方球队一直接或间接任意球。</p>\n<p>间接任意球讯号裁判员将手高举过头作为显示一间接任意球，维持此讯号直至自由球开出后及有其他球员触球、或比赛已经暂停进行为止、或如该自由球明显不能被直接射进球门。</p>\n<p>如因裁判员未有高举单手而使一个原本为间接任意球的球被直接射进球门，裁判员必须指示重开该间接任意球。</p>\n<p>球进进球门</p>\n<ul>\n<li>如一直接任意球，球被直接射入对方的球门，判一进球</li>\n</ul>\n<ul>\n<li>如一间接任意球，球被直接射入对方球门，判对方获得一个球门球</li>\n</ul>\n<ul>\n<li>如一直接或间接任意球，球被直接射入自己一方的球门，判对方获得一个角球</li>\n</ul>\n<h3>2.\t程序</h3>\n<p>所有任意球必须在犯规地点开出，除了：</p>\n<ul>\n<li>攻方在对方球门区域内获得之间接任意球，必须在最接近犯规地点与球门线平行的球门区域界线上的位置开出</li>\n</ul>\n<ul>\n<li>守方于己方球门区域内获获得一个任意球时，可在球门区域内任何位置上开出</li>\n</ul>\n<ul>\n<li>有关未获得裁判员准许而擅自进入、再次进入或离开比赛场地的判罚，任意球应于比赛暂停时球所在地点开出。然而，假如球员在比赛场地外触犯规则，则需要在最接近犯规地点之界线上开出任意球重新开始比赛。如球员在己方罚球区范围之比赛场地外触犯应被判罚直接任意球的条例，则需判罚一个罚球点球</li>\n</ul>\n<ul>\n<li>有关其他指定所在地点开出之任意球(参阅规则第3章、第11章及第12章)</li>\n</ul>\n<p>球：</p>\n<ul>\n<li>必须被放定在地上及踢球的球员在球未经其他球员触球前，不得再次触球</li>\n</ul>\n<ul>\n<li>被踢及有明显移动后，比赛便重新开始</li>\n</ul>\n<p>在比赛正式开始前，所有对方球员必须处于：</p>\n<ul>\n<li>最少离球9.15米(10码)，除非他们已经处于球门两柱之间的球门线上</li>\n</ul>\n<ul>\n<li>罚球区内的任意球，所有对方球员必须在罚球区外</li>\n</ul>\n<p>当守方球队由三名或以上球员筑成「人墙」时，所有攻方球员必须保持距离「人墙」最少1米(1码)，直至比赛正式开始。</p>\n<p>可以用单脚或双脚同时将球挑起开出任意球。</p>\n<p>作为足球比赛的一部分，用假动作开出任意球以扰乱对方是容许的。</p>\n<p>如球员正确地执行任意球时，蓄意将球踢向对方以使球再次弹回，而踢球球员当时不是以不小心、鲁莽或使用过度的力量踢球，裁判员应让比赛继续。</p>\n<h3>3.\t触犯规则及罚则</h3>\n<p>当任意球开出时，如对方一名球员离球未达规则要求距离，除非开球一方能够获得利益，否则应判重开该任意球。但是，如球员决定快速开出任意球，而此时一名对方球员处于距离球少于9.15米(10码)位置截获球，裁判员应让比赛继续。不过，如对方球员蓄意阻止球员快速开出任意球时，该名犯规球员必须因触犯拖延重新开始比赛而被黄牌警告。</p>\n<p>当开出任意球时，如攻方球员处于距离由三人或以上守方球员筑成的「人墙」少于1米(1码)时，判罚一间接任意球。</p>\n<p>如守方球员在己方罚球区内开出任意球，对方球员因没有足够时间离开罚球区，裁判员应让比赛继续。当任意球被开出后，如有对方球员处于罚球区内或在比赛正式开始前走入罚球区，在比赛正式开始前接触球或争夺球，应判重开任意球。</p>\n<p>比赛正式开始后，开球球员在球未经其他球员触球前再次触球，判对方在犯规地点获得一个间接任意球；如主射球员在球未经其他球员触球前触犯手球犯规：</p>\n<ul>\n<li>判对方获得一个直接任意球</li>\n</ul>\n<ul>\n<li>在己方罚球区内犯手球，判对方获得一个罚点球；除非开出任意球是守门员，在此情况，判对方获得一个间接任意球</li>\n</ul>"},{"id":"law-14","title":"第十四章 罚球点球","law":14,"pages":"130-135","html":"<p>在比赛进行中，如球员在己方罚球区内，或在规则第12章及第13章内所列出在比赛场地之外仍属于比赛一部分的犯规，而该犯规应被判罚直接任意球，便会被判罚一个罚球点球。</p>\n<p>点球可以直接射门取得进球。</p>\n<h3>1.\t程序</h3>\n<p>球必须被放定，球的一部分必须触及或停在罚球点中央上，而门柱、横梁和球门网则必须保持在静止状态。</p>\n<p>主射球员身份必须被清晰确认。</p>\n<p>守方之守门员必须留在两柱之间球门线上，面向主射球员，直至皮球被踢出为止。守门员不能作出不公正行为以分散主射球员注意力，例如拖延踢球或碰触门柱、横梁或球门网。</p>\n<p>主射球员及守方之守门员以外的其他球员：</p>\n<ul>\n<li>距离罚球点最少9.15米(10码)</li>\n</ul>\n<ul>\n<li>在罚球点之后</li>\n</ul>\n<ul>\n<li>留在比赛场地内</li>\n</ul>\n<ul>\n<li>在罚球区外</li>\n</ul>\n<p>所有球员处于合乎规则要求位置后，裁判员发出讯号后才可执行射点球。</p>\n<p>主射球员必须将球向前踢出；利用脚踭踢球是容许的，但球必须向前移动。</p>\n<p>守方之守门员在球被踢时，必须至少有一只脚的一部分接触球门线、凌空与球门线对齐或在其后面。</p>\n<p>当球被踢及明显移动后，比赛便正式开始。</p>\n<p>主射球员在踢出球后，在未有其他球员触球前不得再次触球。</p>\n<p>当球停止滚动、越出比赛场地或当裁判员因有球员犯规而暂停比赛时，点球程序便结束。</p>\n<p>当要执行在半场、全场完结或加时结束前的点球，必须要延长比赛时间让点球进行直至执行点球程序完成为止。当延长比赛时间执行点球时，在球被踢出后，球停止滚动、离开比赛场地、被守方守门员以外的球员触及(包括主射球员)或因裁判员判罚主射球员或主射球员队友犯规而将比赛暂停，点球程序便结束。假如有守方球员(包括守门员)犯规而该点球被射失/扑救，点球则需重踢。</p>\n<h3>2.\t触犯规则及罚则</h3>\n<p>若裁判员已发出讯号执行点球，点球必须完成；如点球还未曾执行，裁判员可在再次发出执行点球的讯号前采取纪律行动。</p>\n<p>假如球被踢出前有以下情况发生：</p>\n<ul>\n<li>主射球员意外地双脚同时踢球，或球在踢出后立即触及其非踢球的脚或腿：</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球被射入，重踢该点球</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球不入网，判一间接任意球</li>\n</ul>\n<ul>\n<li>仅在以下情况下，主射点球球员的队友才会因入侵而被处罚：</li>\n</ul>\n<ul>\n<li class=\"l2\">该入侵明显影响守门员；或</li>\n</ul>\n<ul>\n<li class=\"l2\">该入侵球员处理球或争夺球引致进球、射门或制造进球机会</li>\n</ul>\n<ul>\n<li>仅在以下情况下，守门员的队友才会因入侵而被处罚：</li>\n</ul>\n<ul>\n<li class=\"l2\">该入侵明显影响主射球员；或</li>\n</ul>\n<ul>\n<li class=\"l2\">该入侵球员处理球或争夺球阻止对方进球、射门或制造进球机会</li>\n</ul>\n<ul>\n<li>主射球员或其队友犯规：</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球被直接射入网，重踢该点球</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球没有被直接射入网，裁判员暂停比赛及判守方以间接任意球重新开始比赛除比赛因下列情况暂停，无论点球是否被射入网，裁判员应判一间接任意球重新开始比赛：</li>\n</ul>\n<ul>\n<li class=\"l2\">将点球向后踢出</li>\n</ul>\n<ul>\n<li class=\"l2\">已被确认主射球员其中一名队友把点球踢出，裁判员应黄牌警告把点球踢出之球员</li>\n</ul>\n<ul>\n<li class=\"l2\">主射球员完成整个跑动过程后使用假动作射点球(在射点球前的跑动过程中使用假动作是容许的)，裁判员应黄牌警告该名球员守门员犯规：</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球被射入，进球有效</li>\n</ul>\n<ul>\n<li class=\"l2\">如主射球员射失或球从横梁或门柱反弹回场内，除非守门员的犯规明显影响主射球员，否则不必重射</li>\n</ul>\n<ul>\n<li class=\"l2\">如球因守门员犯规被阻截而引至不进球，重射点球</li>\n</ul>\n<p>如守门员在比赛中第一次犯规引至重射点球，守门员会被口头警告，再犯则会被黄牌警告</p>\n<ul>\n<li>守门员队友犯规：</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球被直接射入网，进球有效</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球没有被直接射入网，重射点球</li>\n</ul>\n<ul>\n<li>除非有球员触犯更严重的犯规(例如使用假动作射球)，否则，如射点球时双方都有球员犯规，应判重射该点球</li>\n</ul>\n<ul>\n<li>守门员与该主射球员双方同一时间犯规，黄牌警告该主射球员及判守方获得一个间接任意球重新开始比赛</li>\n</ul>\n<p>当点球被踢出后，如：</p>\n<ul>\n<li>主射球员在球未经其他球员触球前蓄意再次触球：</li>\n</ul>\n<ul>\n<li class=\"l2\">判对方获得一个间接任意球(或如手球犯规，判对方获得一个直接自由球)</li>\n</ul>\n<ul>\n<li>球在向前移动过程中被场外任何外来物体所触碰：</li>\n</ul>\n<ul>\n<li class=\"l2\">重射点球，除非球在进进球门之际及该干扰未有妨碍守门员或防守球员处理球。在此情况下，如球进进球门，则判进球有效(就算该外来物体有触及球)，除非干扰是由攻方球队造成。</li>\n</ul>\n<ul>\n<li>当球从守门员、横梁或门柱反弹回场内后才被场外任何外来物体所触及：裁判员暂停比赛</li>\n</ul>\n<ul>\n<li class=\"l2\">在球被外来物体触及的地方用坠球方式重新开始比赛</li>\n</ul>\n<h3>3.\t总结列表</h3>\n<p>点球结果进球不进球有影响：重射点球有影响：间接任意球仅无影响：进球无影响：不重射攻方球员入侵有影响：进球有影响：重射点球仅无影响：进球无影响：不重射防守球员入侵攻守双方球员均有影攻守双方球员均有影响：重射点球响：重射点球仅守方球员有影响：</p>\n<p>仅守方球员有影响：</p>\n<p>攻方及防守球员入侵进球重射点球仅攻方球员有影响：</p>\n<p>仅攻方球员有影响：</p>\n<p>重射点球不重射无影响：进球无影响：不重射不是被救出：不需重射点球(除非主射球员受到影响)进球仅属守门员犯规被救出：重射点球及口头警告守门员；再犯则会被黄牌警告除非主射球员触犯以除非主射球员触犯以守门员与主射球员在下其中一项犯规，否下其中一项犯规，否同一时间触犯规则则重射点球则重射点球意外：重射点球意外或蓄意：间接自主射球员重触球蓄意：间接任意球由球将球向踢后间接任意球间接任意球间接任意球间接任意球「不合法」假动作及黄牌警告主射球员及黄牌警告主射球员不是被确认之间接任意球间接任意球主射球员及黄牌警告该球员及黄牌警告该球员间接任意球及黄牌警间接任意球及黄牌警主射球员的告主射球员告主射球员欠缺体育精神行为</p>"},{"id":"law-15","title":"第十五章 掷界外球","law":15,"pages":"136-139","html":"<p>当整个球在地面或空中完全越过边线，或当裁判员因一球员为其球队延误掷出界外球而处罚该球员时，判予最后触球球员之对方在球越过边线位置掷界外球。</p>\n<p>不可以直接掷界外球取得进球：</p>\n<ul>\n<li>如球被直接掷入对方球门，判球门球</li>\n</ul>\n<ul>\n<li>如球被掷入己方球门，判角球</li>\n</ul>\n<h3>1.\t程序</h3>\n<p>在掷界外球时，掷球之球员必须：</p>\n<ul>\n<li>站立面向比赛场地</li>\n</ul>\n<ul>\n<li>每只脚部分可站在边线上或边线外的地面上</li>\n</ul>\n<ul>\n<li>双手掷球，在球越过边线之位置将球从后经头顶掷入比赛场地</li>\n</ul>\n<p>对方所有球员必须站于距离掷出球地点之边线位置最少 2 米(2码)以外。</p>\n<p>当球被掷入比赛场地的一刻，比赛便正式开始。如界外球在掷入前已触及比赛场地以外的地面，重掷界外球。如掷界外球程序不正确，则应判由对方球员掷界外球。</p>\n<p>球员以正确程序掷界外球，蓄意将球掷向对方使球弹回，如掷球球员不是以不小心、鲁莽或使用过度的力量，裁判员应让比赛继续。</p>\n<p>掷界外球之球员在球未经其他球员接触前，不得再次触球。</p>\n<h3>2.\t触犯规则及罚则</h3>\n<p>若球员不公正地为其球队延误掷出界外球，裁判员将鸣哨并示意开始五秒倒计时。裁判员将以举起的手作五秒明显倒计时计时，如果在五秒结束时界外球仍未掷出，则将界外球判予对方球队。仅当犯规球员在界外球被判予对方球队后，仍过度延误比赛重新开始时，才会被黄牌警告。*如比赛正式开始后，掷界外球之球员在球未经其他球员接触前再次触球，判罚一间接任意球；如掷界外球之球员在球未经其他球员接触前触犯手球犯规：</p>\n<ul>\n<li>判对方获得一个直接任意球</li>\n</ul>\n<ul>\n<li>如犯规地点是在掷界外球之球员的罚球区内，判对方获得一个点球；如接触是同队之守门员，判对方获得一个间接任意球</li>\n</ul>\n<p>如对方球员不公平地分散掷界外球之球员的注意力或阻碍掷界外球之球员(包括移至掷球位置距离少于2米(2码))，该名犯规球员应因触犯欠缺体育精神行为而被黄牌警告，如界外球已经被掷出，则判罚一间接任意球。</p>\n<p>触犯本章其他犯规，判由对方球员掷出界外球。</p>\n<p class=\"fn\">*参阅「须知事项及修订」下的「界外球及球门球倒计时协定」。</p>"},{"id":"law-16","title":"第十六章 球门球","law":16,"pages":"140-143","html":"<p>当整个球在地面或空中完全越过两球门柱外的球门线，而最后触球者为攻方球员而又并非一进球时，判球门球 (参阅第8章、第10章、第13章及第15章) 。</p>\n<p>开球门球可直接将球射进球门取得进球，但只限对方球门。如皮球直接进入踢球者一方的球门，则判角球。</p>\n<h3>1.\t程序</h3>\n<ul>\n<li>球必须放定，由守方球员在球门区域内任何一点踢出</li>\n</ul>\n<ul>\n<li>当球被踢及明显移动后，比赛便正式重新开始</li>\n</ul>\n<ul>\n<li>对方球员必须停留在罚球区外直至比赛正式开始为止</li>\n</ul>\n<h3>2.\t触犯规则及罚则</h3>\n<p>若球员不公平地为其球队延误开出球门球，裁判员将鸣哨并示意开始五秒倒计时。裁判员将以举起的手作五秒明显倒计时计时，如果在五秒结束时球门球仍未开出，则将判予对方球队获得一个角球。仅当犯规球员在角球被判予对方球队后，仍过度延误比赛重新开始时，才会被黄牌警告。*比赛正式开始后，如主踢者在球未经其他球员触球前再次触球，判对方在犯规地点获得一个间接任意球；如主踢者触犯手球犯规：</p>\n<ul>\n<li>判对方获得一个直接任意球</li>\n</ul>\n<ul>\n<li>当犯规发生在主踢者的罚球区内，判对方获得一个个罚球点球；除非主踢者是守门员，在此情况下，判对方获得一个间接任意球</li>\n</ul>\n<p>如开出球门球时，对方球员因没有足够时间离开罚球区，裁判员应让比赛继续。在重新开始比赛前，如对方球员处于罚球区内或走入罚球区接触球或争夺球，判重开球门球。</p>\n<figure class=\"pg\"><img src=\"assets/rules/p142.png\" alt=\"图示\" loading=\"lazy\"></figure>"},{"id":"law-17","title":"第十七章 角球","law":17,"pages":"144-154","html":"<p>在以下情况判一角球:</p>\n<ul>\n<li>当整个球在地面或空中完全越过两球门柱外的球门线，而最后触球者为防守球员而又并非一进球时（参阅第8章、第12章、第13章, 第15章及第16章）</li>\n</ul>\n<ul>\n<li>裁判员判罚以下情况：</li>\n</ul>\n<ul>\n<li class=\"l2\">守门员用手/手臂控制球超过八秒</li>\n</ul>\n<ul>\n<li class=\"l2\">球员为其球队延误开出球门球</li>\n</ul>\n<h3>1.  程序</h3>\n<ul>\n<li>角球必须放在球出界一边的角球区域内或守门员被判罚时的位置开出</li>\n</ul>\n<ul>\n<li>球必须被放定，由攻方一名球员踢出</li>\n</ul>\n<ul>\n<li>角球毋须被踢离角球区域，只要球被踢及有明显移动，比赛便重新开始</li>\n</ul>\n<ul>\n<li>角球旗杆不得被移走</li>\n</ul>\n<ul>\n<li>对方球员必须离角球弧圈最少9.15米(10码)直至比赛已经重新开始</li>\n</ul>\n<h3>2. 触犯规则及罚则</h3>\n<p>比赛正式开始后，如主踢球员在未有其他球员触球前再次触球，判对方获得一个间接任意球；如主踢球员在未有其他球员触球前触犯手球犯规：</p>\n<ul>\n<li>判对方获得一个直接任意球</li>\n</ul>\n<ul>\n<li>如犯规地点是在主踢球员的罚球区内，判对方获得一个个罚球点球；除非主踢球员是守门员，在此情况下，判对方获得一个间接任意球</li>\n</ul>\n<figure class=\"pg\"><img src=\"assets/rules/p146.png\" alt=\"图示\" loading=\"lazy\"></figure>\n<p>VAR协定尽可能与规则原则及理念一致。</p>\n<p>只容许赛事/竞赛组织已达至所有执行要求，如VAR手册中所述，并已收到国际足球协会的书面批准，才可使用视频助理裁判员。</p>\n<h3>1.\t原则</h3>\n<p>在足球比赛中使用VAR是基于数项原则，在使用VAR时，所有这些原则必须应用于比赛当中。（错误判决的角球除外 – 参阅「2. 可覆检的决定/事件」下的e项）。</p>\n<p>1.\t视频助理裁判员(VAR)属于比赛官员，在不受干扰地获得比赛视像影片，可在以下相关的事件出现「清晰及明显错误」或「遗漏严重犯规」时协助裁判员:a.\t 进球/不进球b.\t 点球/非点球c.\t 红牌(包括明显错误的而导致两黄一红情况)d.\t 裁判员错误识别球员身份（发出黄牌警告或驱逐[红牌]予不正确的球员)2.\t 裁判员在任何时候都必须作出决定，即裁判员是不容许「不作决定」而利用VAR来作出决定；若其决定是让比赛继续，之后可覆检有可疑的犯规。</p>\n<p>3.\t 除非视像覆检清楚显示该决定是「清晰及明显错误」，否则裁判员将不会改变其原本的决定。</p>\n<p>4.\t 只有裁判员可以主动提出「覆检」；VAR(或其他比赛官员)只可向裁判员建议「覆检」。</p>\n<p>5.\t 裁判员可只基于VAR给予的资讯或使用「现场覆检」(OFR)后作出最终决定。</p>\n<p>6.\t 因准确度比速度更为重要，所以覆检的过程不设时间限制。</p>\n<p>7.\t 假如作出覆检决定、覆检的过程或最终决定时，球员及球队职员不得包围或企图影响裁判员。</p>\n<p>8.\t 在覆检的过程中，裁判员必须维持「可见」状态，以确保透明度。</p>\n<p>9.\t 如事件发生后比赛继续，而该事件最终需要覆检时，即使原本的决定被改变，任何因这事件发生后而引致所采取/需要的纪律处分将不可取消(除非是因干扰或阻止对方一明显进攻机会或破坏明显进球机会所发出的黄牌警告/红牌罚令出场决定)。</p>\n<p>10.\t如比赛在停止后已重新开始比赛，裁判员不可使用「覆检」，除非该情况是关于错误确定球员身份或是球员触犯相关可被驱逐离场之凶暴行为、吐唾沫、咬人或作出极度冒犯、侮辱及/或辱骂举动。</p>\n<p>11.\t足球竞赛规则及VAR协定制定每个事件发生前后可被覆检的时段。</p>\n<p>12.\tVAR会自动作出所有情况/决定的「检查」，因此教练或球员没有必要提出「覆检」的要求。</p>\n<h3>2.\t可覆检令比赛逆转的决定/事件</h3>\n<p>经修订文字裁判员只在五项有关于决定/事件可接受由VAR提供的协助。在所有情况中，VAR只可在裁判员作出(首次/原本)决定后(包括让比赛继续)使用，或如发生遗漏严重犯规/比赛官员没有看见的情况。</p>\n<p>裁判员原本的决定不可被改变，除非发生「清晰及明显错误」(当中包括所有由裁判员根据其他比赛官员的讯息作出的决定，例如越位)。</p>\n<p>可覆检的决定/事件类别中，有可能发生「清晰及明显错误」或「遗漏严重犯规」的相关事件有：</p>\n<p>a.\t 进球/不进球</p>\n<ul>\n<li>攻方球队在建立攻势时的犯规或获得进球(手球、犯规、越位等)</li>\n</ul>\n<ul>\n<li>进球前比赛已经因球离开比赛场地而暂停</li>\n</ul>\n<ul>\n<li>进球/不进球决定</li>\n</ul>\n<ul>\n<li>守门员及/或主射球员在执行点球过程中的犯规；又或皮球从门柱、横梁或守门员反弹出来，进攻或防守球员触犯入侵犯规，演变成直接参与赛事的情况</li>\n</ul>\n<p>b.\t 点球/非点球</p>\n<ul>\n<li>点球事件发生前攻方球队在建立攻势时的犯规(手球、犯规、越位等)</li>\n</ul>\n<ul>\n<li>点球事件发生前比赛已经因球离开比赛场地而暂停</li>\n</ul>\n<ul>\n<li>犯规地点(罚球区内或外)</li>\n</ul>\n<ul>\n<li>错误地判罚点球</li>\n</ul>\n<ul>\n<li>没有判罚点球</li>\n</ul>\n<p>c.\t 红牌</p>\n<ul>\n<li>破坏明显进球机会(尤其是关于犯规位置和其他球员位置)</li>\n</ul>\n<ul>\n<li>严重犯规(或鲁莽冲撞)</li>\n</ul>\n<ul>\n<li>凶暴行为、向其他人吐唾沫或咬人</li>\n</ul>\n<ul>\n<li>作出冒犯、侮辱及/或辱骂举动</li>\n</ul>\n<ul>\n<li>明显错误的第二面黄牌警告</li>\n</ul>\n<p>d.\t 错误确认身份(红或黄牌)如裁判员判罚一犯规但明显错误确认球员身份，仅犯规球员的身份可被覆检e.\t 明显错误判决的角球，前提是该决定能被立即更改及不延迟比赛重新开始（竞赛组织可允许）</p>\n<h3>3.\t实际使用</h3>\n<p>在比赛中使用VAR包括以下实际安排：</p>\n<ul>\n<li>VAR在一名或多名副视频助理裁判员(AVAR)协助下，于视像操控室(VOR)观看赛事</li>\n</ul>\n<ul>\n<li>根据镜头角度的数量(和其他考虑因素)，可能会编排多过一位AVAR或一名或多名重播操作员(RO)</li>\n</ul>\n<ul>\n<li>只有获授权人员可进入VOR或在赛事中与VAR/AVAR/RO沟通</li>\n</ul>\n<ul>\n<li>VAR在不受干扰地存取电视广播影片和控制重播影片</li>\n</ul>\n<ul>\n<li>VAR亦会佩戴比赛官员使用的通讯设备及可收听他们所有对话；如VAR与裁判员对话，则需按通讯键钮(避免裁判员被VOR中的对话影响)</li>\n</ul>\n<ul>\n<li>如VAR忙于「检查」或「覆检」，AVAR可与裁判员对话，尤其在比赛有需要暂停或确保比赛不可重新开始的情况</li>\n</ul>\n<ul>\n<li>如裁判员决定观看重播影片，VAR将会选择最佳镜头角度/重播的速度；裁判员可要求其他/额外拍摄角度/速度的影片</li>\n</ul>\n<h3>4.\t程序</h3>\n<p>原本决定</p>\n<ul>\n<li>与没有VAR时执法情况一样(除非是「遗漏」事件)，裁判员和其他比赛官员必须作出初步决定(包括任何纪律行动)</li>\n</ul>\n<ul>\n<li>裁判员和其他比赛官员是不容许「不作决定」，因太多「覆检」会导致比赛官员变得「弱势/优柔寡断」及如发生技术故障会引致出现重大问题</li>\n</ul>\n<ul>\n<li>裁判员有最终决权，而VAR和其他比赛官员地位相同，只可协助裁判员执法</li>\n</ul>\n<ul>\n<li>仅当球员在非常清晰的进攻情况下有机会射门或明显跑入/跑向对手的罚球区时，容许延迟显示旗号/哨子讯号</li>\n</ul>\n<ul>\n<li>如助理裁判员对一犯规延迟作出判罚的旗号，他必须在进攻一方获得进球、点球、罚球、角球或界外球；或该攻势完结仍保持控球权后举旗示意。在所有其他情况，助理裁判员应根据比赛要求，决定是否举旗</li>\n</ul>\n<p>检查</p>\n<ul>\n<li>VAR会自动透过不同镜头角度和重播速度的电视影片，「检查」每个有机会或实际进球、点球、直接红牌/事件或错误确认身份事件</li>\n</ul>\n<ul>\n<li>VAR可用正常速度及/或慢速重播影片作「检查」，但一般情况，慢速重播的影片应只用于关乎事实情况，例如犯规位置/球员、犯规动作和手球的接触点、比赛是否已经暂停(包括进球/不入球)；正常速度应用作检视犯规的「强度」或决定是否手球犯规</li>\n</ul>\n<ul>\n<li>如「检查」没有显示「清晰及明显错误」或「遗漏严重犯规」事件，VAR不需要与裁判员沟通 － 这属于「无声检查」；不过，有时候如VAR能明示确定没有发生「清晰及明显错误」或「遗漏严重犯规」事件，帮助裁判员/助理裁判员管理球员/赛事</li>\n</ul>\n<ul>\n<li>如因「检查」而需延迟重新开始比赛，裁判员会以手指清楚指向耳机/听筒及张开另一手臂；因这手号代表裁判员正在接收资料(资料可由VAR或其他比赛官员发出)，所以此手号必须维持至「检查」完成为止</li>\n</ul>\n<ul>\n<li>如「检查」显示有可能出现「清晰及明显错误」或「遗漏严重犯规」事件，VAR将会传达这些资料予裁判员，裁判员自行决定是否使用「覆检」覆检</li>\n</ul>\n<ul>\n<li>裁判员在有可能的「清晰及明显错误」或「遗漏严重犯规」情况下，可主动提出「覆检」：</li>\n</ul>\n<ul>\n<li class=\"l2\">VAR(或其他比赛官员)建议「覆检」</li>\n</ul>\n<ul>\n<li class=\"l2\">裁判员怀疑自己遗漏了一些严重事件</li>\n</ul>\n<ul>\n<li>如比赛已暂停，裁判员应延迟重新开始比赛</li>\n</ul>\n<ul>\n<li>如比赛还在进行中，裁判员应待球发展至一个中立的区域/情况(通常在两队均没有进攻时)暂停比赛并显示「电视讯号」手号</li>\n</ul>\n<ul>\n<li>VAR向裁判员描述电视重播中可以看到的情况，待裁判员：</li>\n</ul>\n<ul>\n<li class=\"l2\">作出最终决定前，显示「电视讯号」手号(若之前未曾显示)并往裁判员覆检区域观看重播影片 － 「现场覆检」(OFR)。其他比赛官员不会观看影片，除非裁判员在特殊情况下提出此要求或</li>\n</ul>\n<ul>\n<li class=\"l2\">根据本身的看法及VAR提供的资讯，并在适合环境下收集来自其他比赛官员提供的资料作出最终决定 － VAR - 只限覆检</li>\n</ul>\n<ul>\n<li>当两项覆检程序结束时，裁判员必须立即显示「电视讯号」，然后作出最终决定</li>\n</ul>\n<ul>\n<li>关于主观性的决定，例如：侵犯的强度、与干扰相关的越位犯规、手球犯规的考虑，使用「现场覆检」(OFR)是最合适的处理方式</li>\n</ul>\n<ul>\n<li>对于基于事实作出的决定，例如球员犯规的位置(越位)、接触点(手球/犯规)、地点(罚球区内或外)、比赛是否不在进行中等。VAR-只限覆检已能适当处理此情况，但如「现场覆检」(OFR)可以协助管理球员/赛事或可令决定更有说服力的时候(例如：比赛后段时间有令比赛逆转关键的决定)，也可在基于事实作出的决定时使用「现场覆检」</li>\n</ul>\n<ul>\n<li>裁判员可要求不同镜头角度/重播速度，但一般来说，慢动作重播应只用于事实性的判决，例如球员/犯规的位置、犯规动作和</li>\n</ul>"},{"id":"var","title":"视频助理裁判员（VAR）协定","pages":"155-162","html":"<p>手球接触的位置、比赛是否因球越出界线而暂停(进球/不入球)；而正常重播速度则应该用于检视犯规「强度」或手球犯规之决定</p>\n<ul>\n<li>关于进球、点球/非点球及因破坏一个明显进球(DOGSO)的红牌决定，可能有需要覆检直接由该进攻过程而引起所出现的决定/事件；这可能包括进攻球队如何在比赛进行时获得控球权</li>\n</ul>\n<ul>\n<li>规则不容许改变在比赛已被重新开始前的决定(角球、界外球等)，所以这类情况不能被覆检</li>\n</ul>\n<ul>\n<li>如比赛暂停后已被重新开始，裁判员只可利用「覆检」向关于错误确定球员身份或是球员触犯相关可被罚令出场之凶暴行为、吐唾沫、咬人或作出极度冒犯、侮辱及/或辱骂性举动的事件采取适当的纪律处分</li>\n</ul>\n<ul>\n<li>覆检的过程应尽量有效率完成，但最终决定的准确度比速度更为重要及因可能出现一些同时有数个需覆检决定/事件的复杂情况，所以在覆检过程中不设时间限制</li>\n</ul>\n<p>最终决定</p>\n<ul>\n<li>完成覆检后，裁判员必须画出「电视讯号」并传达最终决定；竞赛组织亦可以采用系统，允许裁判员在视频助理裁判员(VAR)「覆检」或长时间「检查」后宣布并解释裁决，如国际足球协会指引及VAR手册所述</li>\n</ul>\n<ul>\n<li>裁判员随后便根据规则采取/更改/撤销任何纪律行动(适当情况下)及重新开始比赛球员、替补队员和球队官员</li>\n</ul>\n<ul>\n<li>因VAR会自动会将所有情况/事件作出「检查」，所以教练及球员毋须提出「检查」或「覆检」的要求</li>\n</ul>\n<ul>\n<li>球员、替补队员及球队官员绝不能尝试影响或干扰覆检过程，包括在作出最终决定时</li>\n</ul>\n<ul>\n<li>当进行覆检时，球员要留在比赛场地内，而替补队员及球队职员应留在比赛场地外</li>\n</ul>\n<ul>\n<li>球员/替补队员/已被换下的球员/球队官员过份做出电视讯号手号或进入裁判员覆检区域(RRA)将会被黄牌警告</li>\n</ul>\n<ul>\n<li>球员/替补队员/已被换下的球员/球队官员进入视像操控室(VOR)将会被红牌罚令出场</li>\n</ul>\n<p>赛事合法性原则上，比赛不会因为以下情况而失效：</p>\n<ul>\n<li>VAR科技上的故障[等同球门线科技(GLT)]</li>\n</ul>\n<ul>\n<li>涉及VAR的错误决定(因VAR属于比赛官员)</li>\n</ul>\n<ul>\n<li>作出的决定并非用于覆检的事件</li>\n</ul>\n<ul>\n<li>覆检不属于可覆检的情况/决定</li>\n</ul>\n<p>VAR、AVAR或重播操作员丧失管理能力第6章 – 其他比赛官员清楚规定：「赛事规则须清楚说明当一名比赛官员未能开始或继续执法和处理任何相关改变时，将由谁人代替其职务。」这亦适用于使用VAR赛事的重播操作员。</p>\n<p>成为一名视像比赛官员（VMO）/重播操作员需要经过特别培训并获得资格，因此，以下原则必须纳入赛事规则：</p>\n<ul>\n<li>当一名视频助理裁判员(VAR)、副视频助理裁判员(AVAR)或重播操作员未能开始或继续执法时，仅可由另一名符合资格的人员代替其职位</li>\n</ul>\n<ul>\n<li>如果没有符合资格的VAR或重播操作员的代替人员*，该赛事必须在没有VAR的情况下继续进行</li>\n</ul>\n<ul>\n<li>如果没有符合资格的AVAR或重播操作员的代替人员*，该赛事必须在没有VAR的情况下继续进行，除非经双方球队书面同意赛事在只有VAR及重播操作员下仍然使用VAR继续进行则属例外情况</li>\n</ul>\n<p class=\"fn\">*不适用于超过一名AVAR/重播操作员的情况。</p>\n<p>国际足球协会的品质条例是经过合理的研究后，为球赛中使用的产品、赛事场地和科技制定的一套标准。除了部分应用范围内的主要品质要求，为了让赛事主办者能进一步明确他们的规定，其他领域均采用统一的建议。</p>\n<p>独立测试机构是按照相关的标准验证产品、赛事场地和科技的功能性。机构所进行的测试均经过国际足球协会的批准。以下的品质标志表示产品、赛事场地和科技经过测试并符合现行资格要求：</p>\n<p>国际足球协会基本标准*本标准的测试旨在鉴定产品的基本功能、准确性、安全性和耐久性是否符合球赛的要求。在设定最低标准的同时确保适用于所有级别的球赛。</p>\n<p>国际足球协会品质本测试比国际足球协会基本标准更注重产品、赛事场地和科技的耐久性和安全性。除了测试其基本功能和准确性是否符合标准，主要更著重于其广泛的使用性。</p>\n<p>国际足球协会专业品质本测试要求顶级的功能、准确性和安全性。拥有此标志的产品、赛事场地和科技具有最佳的功能，可用于最高水平的赛事。</p>\n<p>关于国际足球协会的品质条例、个别标准以及认证的产品、赛事场地及技术的详情，请浏览https://football-technology.fifa.com</p>\n<p class=\"fn\">*国际比赛标准（IMS）已由国际足球协会基本标准取代，然而，经国</p>\n<p>际比赛标准验证合格的球和赛事场地仍然可以继续使用，直至认证有效期结束为止。</p>"},{"id":"changes","title":"2026/27规则变更","pages":"163-190","html":"<p>第3章–球员</p>\n<ul>\n<li>如双方球队同意并提前通知裁判员，国际最高级别代表队「A」级友谊赛赛事可使用的换人名额增加至八名或十一名；每队三次换人机会的限制将适用</li>\n</ul>\n<ul>\n<li>球员被替换离开比赛场地的时限为十秒钟。如超过时限，后备球员须待比赛重新开始一分钟后的首次暂停，方可进入场地</li>\n</ul>\n<ul>\n<li>预先通知：「仅限队长」指引将自2027年7月1日起成为所有比赛的强制性协定</li>\n</ul>\n<p>第4章–球员装备</p>\n<ul>\n<li>只要配件被安全及稳固覆盖，并不会构成危险，则可允许佩戴</li>\n</ul>\n<p>第5章–裁判员</p>\n<ul>\n<li>赛事可获准使用科技，以协助裁判员就视频助理裁判员（VAR）协定、比赛进行中及比赛暂停（包括球门线技术）及越位（包括半自动越位侦测技术）相关事宜作出/更改决定</li>\n</ul>\n<ul>\n<li>澄清在重新开始比赛被不正确地开出而比赛已进行中，可运用有利</li>\n</ul>\n<ul>\n<li>除特定例外情况外，在场上因受伤接受评估/治理或导致比赛停止的球员，必须在比赛重新开始后离开比赛场地并在场外逗留一分钟</li>\n</ul>\n<ul>\n<li>VAR可覆检：</li>\n</ul>\n<ul>\n<li class=\"l2\">因明显错误的第二面黄牌警告而导致的错误红牌</li>\n</ul>\n<ul>\n<li class=\"l2\">当犯规者为任何一队的另一名球员时，有球员被错误出示红牌或黄牌</li>\n</ul>\n<ul>\n<li class=\"l2\">错误判决的角球，前提是该决定能被立即更改及不延迟比赛重新开始（竞赛组织可允许）</li>\n</ul>\n<ul>\n<li>竞赛组织可选择为裁判员、助理裁判员及其他比赛官员提供随身摄像机。</li>\n</ul>\n<ul>\n<li>只要配件不会构成危险，则可允许佩戴</li>\n</ul>\n<p>第6章 - 其他比赛官员</p>\n<ul>\n<li>新增VAR可覆检的事件</li>\n</ul>\n<p>第8章 - 开始比赛及重新开始比赛</p>\n<ul>\n<li>修订坠球的文字，以澄清「哪一球队将会夺得控球权」的球队，包括在比赛暂停时，本应执行重新开始比赛的球队。当赛事执法人员或外来物体干扰比赛时，应在干扰发生位置执行坠球</li>\n</ul>\n<p>第10章 - 决定比赛胜负的方法</p>\n<ul>\n<li>确认关于在点球（射点球决胜）期间意外重触球的第31号通告</li>\n</ul>\n<ul>\n<li>如主射球员与守门员同时犯规，取消对主射球员的自动黄牌警告</li>\n</ul>\n<p>第12章–犯规及不正当行为</p>\n<ul>\n<li>如运用有利并进球得分，则对于破坏明显进球机会的犯规行为不予黄牌警告</li>\n</ul>\n<ul>\n<li>在破坏明显进球机会的考虑因素列表中纳入「进攻球员」的提述</li>\n</ul>\n<p>第14章–点球</p>\n<ul>\n<li>确认关于在射点球期间意外重触球的第31号通告</li>\n</ul>\n<ul>\n<li>如主射球员与守门员同时犯规，取消对主射球员的自动黄牌警告</li>\n</ul>\n<p>第15章 - 界外球</p>\n<ul>\n<li>当球员/球队延误掷出界外球时，采用五秒钟的明显倒计时计时。如超过时限，界外球将判给对方球队第16章–球门球</li>\n</ul>\n<ul>\n<li>当球员/球队延误掷出球门球时，采用五秒钟的明显倒计时计时。如超过时限，角球将判给对方球队</li>\n</ul>\n<p>视频助理裁判员(VAR)协定</p>\n<ul>\n<li>因明显错误的第二面黄牌警告而导致的红牌，可进行覆检</li>\n</ul>\n<ul>\n<li>当球员被出示黄牌/红牌，但该犯规行为是由任何一方球队的另一名球员所为时，可对球员身份错误进行覆检</li>\n</ul>\n<ul>\n<li>竞赛组织可选择覆检明显错判的角球，前提是该决定能被立即更正及没有引致比赛重新开始的延误以下列出2026/27年足球竞赛规则版本的所有修订。在每一修订内，都有列明旧有字句及修改/新增字句，并会解释修改原因（如合适）。</li>\n</ul>\n<p>重点规则的主要变更字句下有黄色划线，并在边界空白处强调此变更。</p>\n<p>编辑修改有下划线。</p>\n<p>YC = 黄牌 (警告)； RC = 红牌 (罚令出场)。</p>\n<p>第3章–球员 (p.60)</p>\n<h3>2. 替换球员人数</h3>\n<p>经修订文字其他比赛在国际最高级别代表队「A」级赛事，最多可列十五名替补队员在比赛名单内，而最多可替换六八名球员；除非两队同意使用更多人数，则最多可替换十一名球员，此情况下必须在比赛前通知裁判员。官方比赛中需采用换人机会的限制及程序。</p>\n<p>解释在国际最高级别代表队「A」级友谊赛赛事，球队现时获准使用八名已列名的后备球员，除非两队同意使用更多人数，则最多可替换十一名球员；每队将限制于三次换人机会。</p>\n<p>第3章–球员 (p.61)</p>\n<h3>3. 替换程序</h3>\n<p>新增文字(...)要换入一名替补队员，需依照「须知事项及修订」下的「限时替换球员协定」及以下程序进行：</p>\n<ul>\n<li>替换前必须知会裁判员</li>\n</ul>\n<ul>\n<li>即将被换下的球员：</li>\n</ul>\n<ul>\n<li class=\"l2\">除非球员已身处比赛场地外，否则需得到裁判员准许及必须在最近的边线离开比赛场地；但如裁判员示意该球员可直接快速地从中场线或特定地点(例如，因安全/保安或受伤情况下)离开则作别论</li>\n</ul>\n<ul>\n<li class=\"l2\">须在替换讯号板展示后的十秒内离开比赛场地，或在没有替换讯号板时，从裁判员发出替换讯号起计十秒内离开比赛场地，除非因安全/保安或受伤而无法做到</li>\n</ul>\n<ul>\n<li class=\"l2\">须立刻返回技术指导区域或更衣室，并且不能再参与余下的比赛时间，除非比赛已获批准采用重返替换条例如在同一次暂停期间替换多名球员，所有被换下的球员必须在示意最后一次替换后的十秒内离开比赛场地。第3章–球员 (p.62, 63)</li>\n</ul>\n<h3>5. 触犯规则及罚则</h3>\n<p>新增文字(...)除非因安全/保安或受伤而无法在十秒内离开比赛场地，如被换下的球员未能在规定的十秒内离开比赛场地：</p>\n<ul>\n<li>该被换下的球员仍须离开比赛场地；当他们在十秒后仍过度延误比赛重新开始时，会被黄牌警告</li>\n</ul>\n<ul>\n<li>替补队员不可进入比赛场地</li>\n</ul>\n<ul>\n<li>比赛重新开始</li>\n</ul>\n<ul>\n<li>该换人决定不可取消，亦不可更换另一名替补队员。</li>\n</ul>\n<ul>\n<li>替补队员仅可在比赛重新开始一分钟后的首次暂停期间，得到裁判员许可后方可进入比赛场地触犯本章其他犯规：</li>\n</ul>\n<ul>\n<li>(...)</li>\n</ul>\n<p>解释为防止浪费时间，被换下的球员必须在替换讯号板展示后的十秒内离开比赛场地，或在没有替换讯号板时，从裁判员发出替换讯号起计十秒内离场。如球员在该十秒内未离开比赛场地，他们仍须离开，但替补队员需待比赛重新开始一分钟（持续计时）后的首次暂停，方可进入比赛场地。</p>\n<p>第4章–球员装备 (p.67)</p>\n<h3>1.安全守则</h3>\n<p>经修订文字球员不能佩戴或穿著会构成危险的装备或物品。</p>\n<p>禁止佩戴及必须移除任何饰物（颈链、戒指、手镯、耳环、皮革带、橡胶带等）。不准使用胶布覆盖饰物。只要配件不会构成危险，并被安全及稳固覆盖，则可允许佩戴。危险物件必须移除，不准用胶布黏贴或覆盖。</p>\n<p>球员必须在比赛开始前和替换进场前经过检查。如在比赛进行中发现有球员穿戴未经许可/会构成危险的装备或饰物配件时，裁判员必须指令球员：</p>\n<ul>\n<li>(...)</li>\n</ul>\n<p>解释使用「饰物」一词可能引起混淆，因为所列举的某些物件不属于饰物。禁止饰物引发冲突，并且执行不一。此规定亦忽略佩戴某些物品的文化、宗教、医疗及个人原因。</p>\n<p>重点在于允许佩戴不会构成危险的物品，前提是其被安全及稳固覆盖（另见第5章–裁判员），而会构成危险的物品则仍然被禁止。</p>\n<p>第5章–裁判员 (p.73)</p>\n<h3>2.裁判员的决定</h3>\n<p>新增文字裁判员所有决定都是裁判员以其最佳能力根据规则(...)采取最合适之行动。</p>\n<p>竞赛组织可使用科技以协助裁判员就以下相关事宜作出或更改决定：</p>\n<ul>\n<li>VAR协定</li>\n</ul>\n<ul>\n<li>比赛是否进行中或已暂停，包括使用球门线技术（GLT）</li>\n</ul>\n<ul>\n<li>越位，包括使用半自动越位侦测技术（SAOT）裁判员根据事实作出与比赛有关的判决(...)</li>\n</ul>\n<p>解释将竞赛组织可选择使用科技（包括影片重播）纳入第5章，将禁止比赛官员使用任何未经官方批准科技。</p>\n<p>第5章–裁判员 (p.74)</p>\n<h3>3.权力和职责</h3>\n<p>经修订文字有利</p>\n<ul>\n<li>当出现犯规，或重新开始比赛被不正确地开出而比赛亦已进行中，如不判罚犯规对被侵犯的对方球队更有利时，裁判员应容许比赛继续，或如果裁判员预期有利不会于数秒内出现时，应判罚原本的犯规/命令重开。</li>\n</ul>\n<p>解释确认如果球队以不正确方式将比赛重新开始（如任意球、掷界外球等）继而对方获得控球权，裁判员可运用有利。</p>\n<p>第5章–裁判员 (p.75, 76)</p>\n<h3>3.权力和职责</h3>\n<p>经修订文字裁判员：</p>\n<p>(...)受伤</p>\n<ul>\n<li>如裁判员认为一名球员只是受轻伤，可以让比赛继续进行直至比赛暂停为止</li>\n</ul>\n<ul>\n<li>仅当裁判员认为一名球员严重受伤时，他应立即暂停比赛，并确保该名受伤球员被移离比赛场地接受治理。受伤球员原则上不可在比赛场地内接受治理，而如因受伤导致比赛停止或延迟重新开始比赛，该受伤球员必须离开比赛场地，并仅可在比赛重新开始一分钟后才可再次进入比赛场地；*如比赛暂停时，受伤球员可从任何界线再次进入比赛场地。例外情况 无须离开比赛场地接受治理及/或在治理后离开比赛场地的唯一例外情况如下：</li>\n</ul>\n<ul>\n<li class=\"l2\">守门员受伤</li>\n</ul>\n<ul>\n<li class=\"l2\">(…)</li>\n</ul>\n<ul>\n<li class=\"l2\">如球员因被对方侵犯受伤，犯规球员因此而被黄牌警告或红牌罚令出场（例如鲁莽拦截或严重犯规），该受伤的球员可在比赛场地接受适时检查及治理</li>\n</ul>\n<ul>\n<li>(…)</li>\n</ul>\n<p class=\"fn\">*参阅「须知事项及修订」下的「场外治理及评估协定」。</p>\n<p>解释</p>\n<ul>\n<li>在比赛场地上接受治理或评估，或导致比赛停止的受伤球员，必须离开比赛场地并在场外逗留一分钟（持续计时）。裁判员可在比赛进行中容许该球员返回比赛场地。详细说明此执行方式的协定已载于「须知事项及修订」中。</li>\n</ul>\n<ul>\n<li>如受伤是由于被被黄牌警告或红牌罚令出场的体力化犯规所致，即使治理未能适时完成，球员在评估/治理后可留在比赛场地上。第5章–裁判员 (p.77)</li>\n</ul>\n<h3>4. 视频助理裁判员(VAR)</h3>\n<p>经修订文字(…)裁判员在以下事件出现「清晰及明显错误」或「遗漏严重犯规」时，视频助理裁判员(VAR)才会提供协助:</p>\n<ul>\n<li>进球/不进球</li>\n</ul>\n<ul>\n<li>点球/非点球</li>\n</ul>\n<ul>\n<li>直接红牌（不包括明显错误而导致两黄一红情况）</li>\n</ul>\n<ul>\n<li>裁判员错误识别球员身份（发出黄牌警告或驱逐[红牌]予犯规球队不正确的球员）</li>\n</ul>\n<ul>\n<li>明显错误判决的角球，前提是该决定能被立即更改及不延迟比赛重新开始（竞赛组织可允许）</li>\n</ul>\n<p>解释新增可由VAR覆检的事件，详情见修订后的VAR协定。</p>\n<p>第5章–裁判员 (p.78)</p>\n<h3>5.裁判员装备</h3>\n<p>经修订文字其他装备裁判员可使用以下装备：</p>\n<ul>\n<li>(…)</li>\n</ul>\n<ul>\n<li>随身摄像机，前提是竞赛组织提供摄像机、完全拥有及控制录像片段，并遵守相关指引。摄像机可附有麦克风，但不可用作广播与视频助理裁判员（VAR）的通讯。相关机构可将摄像机的影像及声音用于纪律处分事宜。裁判员及其他「场区」比赛官员不可佩戴饰物或使用任何其他电子仪器，包括摄录器材，上文所述的随身摄像机除外。只要配件没有构成危险，则可容许佩戴。解释</li>\n</ul>\n<ul>\n<li>竞赛组织可容许裁判员、助理裁判员及其他比赛官员佩戴/使用随身摄录机，前提是竞赛组织提供摄像机并完全控制录像片段（以避免裁判员非官方使用）。摄像机亦可附有麦克风，但与视频助理裁判员（VAR）的通讯不得广播。相关机构可选择将声音及/或摄像机影像用于纪律处分事宜。</li>\n</ul>\n<ul>\n<li>除了必须及其他允许的装备外，裁判员可佩戴配件，前提是其被安全及稳固覆盖并不会构成危险。</li>\n</ul>\n<p>第6章 - 其他比赛官员 (p.87)</p>\n<h3>5.视像比赛官员</h3>\n<p>经修订文字视频助理裁判员（VAR）属于比赛官员，在有「清晰及明显错误」或「遗漏严重犯规」事件时，而该事件是关乎进球/不进球、点球/非点球、直接红牌（不包括明显错误而导致两黄一红的情况）或当裁判员错误识别球员身份而发出黄牌警告或驱逐予犯规球队不正确的球员离场（红牌）情况，可利用重播影片协助裁判员。</p>\n<p>解释新增可由VAR覆检的事件，详情见修订后的VAR协定。</p>\n<p>第8章 - 开始比赛及重新开始比赛 (p.98)</p>\n<h3>2.坠球(公正球)</h3>\n<p>经修订文字程序</p>\n<ul>\n<li>当比赛暂停后，球：</li>\n</ul>\n<ul>\n<li class=\"l2\">(…)</li>\n</ul>\n<ul>\n<li class=\"l2\">在罚球区外 - 如裁判员能确定控球权已经或将会保持或属于哪一球队（包括在比赛暂停时本应执行重新开始比赛），堕球应给予该球队一名球员；否则堕球应给予比赛暂停前最后触及球的球队一名球员。堕球应在比赛暂停时球所在地开出。堕球应在比赛暂停时球所在地开出，除非球击中比赛官员或外来物体，此情况下应在干扰/触及位置开出坠球</li>\n</ul>\n<ul>\n<li>(…)</li>\n</ul>\n<p>解释</p>\n<ul>\n<li>主要原则是，坠球应给予如比赛未停止则本可保持/获得控球权的球队，这包括在球本应出界的情况下，而应执行重新开始比赛的球队。</li>\n</ul>\n<ul>\n<li>如因球触及比赛官员或外来物体而停止比赛，则堕球应在触及位置开出。第10章 - 决定比赛胜负的方法 (p.106)</li>\n</ul>\n<h3>3.点球（射点球决胜）</h3>\n<p>经修订文字程序点球（射点球决胜）时</p>\n<ul>\n<li>(...)</li>\n</ul>\n<ul>\n<li>当球(...)该点球便完成；主射球员不可蓄意再次处理球</li>\n</ul>\n<ul>\n<li>如主射球员意外同时用双脚踢球，或球在踢出后立即触及其非踢球脚或腿：</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球被射入，重踢该点球</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球不入网，该点球被判作射失</li>\n</ul>\n<ul>\n<li>(...)</li>\n</ul>\n<ul>\n<li>如守门员及该主射球员同时触犯规则，点球被视作射失而该主射球员应被黄牌警告</li>\n</ul>\n<p>解释加入文字以确认第31号通告中关于点球主射球员意外重触球的澄清。此变更亦需要删除主射球员与守门员同时犯规时，主射球员会被警告的提述。</p>\n<p>第12章–犯规及不正当行为 (p.118)</p>\n<h3>4. 纪律行动</h3>\n<p>新增文字有利如裁判员运用有利于一个(...)。若然裁判员运用有利处理属于一个破坏对方明显入球机会犯规后，需以欠缺体育精神行为黄牌警告该犯规球员，除非非犯规球队因运用有利而进球，此情况下则不作纪律处分；如该犯规属干扰/阻止对方一明显进攻机会，犯规球员不需要被黄牌警告。</p>\n<p>解释如裁判员在一次破坏明显进球机会的犯规后运用有利，并因此导致进攻球队进球，则犯规球员不会被警告或罚令出场。</p>\n<p>第12章–犯规及不正当行为 (p.119)</p>\n<h3>4. 纪律行动</h3>\n<p>经修订文字应被黄牌警告的欠缺体育精神行为有很多不同的情况，球员触犯欠缺体育精神行为必须被黄牌警告，包括，如球员：</p>\n<ul>\n<li>(...)</li>\n</ul>\n<ul>\n<li>蓄意用手触球去取得进球（不论是否成功取得进球）或阻止一进球但不成功</li>\n</ul>\n<p>解释当球员用手/手臂试图阻止进球但不成功，而裁判员运用有利时，则不予警告。</p>\n<p>第12章–犯规及不正当行为 (p.121)</p>\n<h3>4. 纪律行动</h3>\n<p>经修订文字拖延重新开始比赛裁判员必须黄牌警告作出以下过度拖延重新开始比赛行为的球员，包括如第3章、第15章及第16章及其协定所述，或以下球员：</p>\n<ul>\n<li>看似要掷出界外球，突然又将球留给另一名球员掷球</li>\n</ul>\n<ul>\n<li>当被更换下场时拖延离场时间</li>\n</ul>\n<ul>\n<li>过分拖延比赛重开时间</li>\n</ul>\n<ul>\n<li>裁判员停止比赛后，蓄意踢走或带走球，又或刻意触碰球因而挑起球员之间冲突</li>\n</ul>\n<ul>\n<li>刻意在错误地点开出任意球迫使裁判员指令重开该任意球</li>\n</ul>\n<p>解释由于裁判员现有权力透过将界外球判给对方球队来惩罚拖延掷界外球的球队，以及透过将角球判给对方球队来惩罚拖延踢球门球的球队，这被认为是足够的惩罚，除非球员的举动造成极端的延误。</p>\n<p>第12章–犯规及不正当行为 (p.122)</p>\n<h3>4. 纪律行动</h3>\n<p>新增文字破坏进球或明显进球机会(DOGSO)(…)下列情况必须被考虑：</p>\n<ul>\n<li>犯规地点与球门距离</li>\n</ul>\n<ul>\n<li>整体处理球方向</li>\n</ul>\n<ul>\n<li>保持或获得控球权的可能性</li>\n</ul>\n<ul>\n<li>防守及进攻球员球员位置和人数</li>\n</ul>\n<p>解释进攻球员的位置和数目被纳入明显进球机会的考虑因素中，这亦有助判断是否存在明显进球机会。</p>\n<p>第14章–点球 (p.132)</p>\n<h3>2. 触犯规则及罚则</h3>\n<p>经修订文字假如球被踢出前有以下情况发生：</p>\n<ul>\n<li>主射球员意外地双脚同时踢球，或球在踢出后立即触及其非踢球的脚或腿：</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球被射入，重踢该点球</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球不入网，判一间接任意球</li>\n</ul>\n<ul>\n<li>(…)</li>\n</ul>\n<ul>\n<li>守门员及该主射球员同时触犯规则，该主射球员应被黄牌警告并判一间接自由球予防守球队以重新开始比赛当点球被踢出后，如：</li>\n</ul>\n<ul>\n<li>主射球员在球未经其他球员触球前蓄意再次触球：</li>\n</ul>\n<ul>\n<li class=\"l2\">判对方获得一个间接任意球（或如手球犯规，判对方获得一个直接任意球）</li>\n</ul>\n<p>解释加入文字以确认第31号通告中关于点球主射球员意外重触球的澄清。此变更亦要求删除主射球员与守门员同时犯规时，主射门球员会自动被警告的提述。</p>\n<p>第15章 - 界外球 (p.137, 138)新增文字当整个球在地面或空中完全越过边线，或当裁判员因一球员为其球队延误掷出界外球而处罚该球员时，判予最后触球球员之对方在球越过边线位置掷界外球。</p>\n<p>(…)</p>\n<h3>2. 触犯规则及罚则</h3>\n<p>新增文字若球员不公正地为其球队延误掷出界外球，裁判员将鸣哨并示意开始五秒倒计时。裁判员将以举起的手作五秒明显倒计时计时，如果在五秒结束时界外球仍未掷出，则将界外球判予对方球队。仅当犯规球员在界外球被判予对方球队后，仍过度延误比赛重新开始时，才会被黄牌警告。*如比赛正式开始后，(...)</p>\n<p class=\"fn\">*参阅「须知事项及修订」下的「界外球及球门球倒计时协定」。</p>\n<p>解释引入文字以避免掷界外球时的延误。如球队故意延误开出界外球，裁判员将鸣哨，示意掷出界外球，
