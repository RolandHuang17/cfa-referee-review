然后开始五秒明显倒计时计时。如在倒计时结束时界外球仍未掷出，则将界外球判予对方球队。</p>\n<p>第16章–球门球 (p.141, 142)</p>\n<h3>2. 触犯规则及罚则</h3>\n<p>新增文字若球员不公平地为其球队延误开出球门球，裁判员将鸣哨并示意开始五秒倒计时。裁判员将以举起的手作五秒明显倒计时计时，如果在五秒结束时球门球仍未开出，则将判予对方球队获得一个角球。仅当犯规球员在角球被判予对方球队后，仍过度延误比赛重新开始时，才会被黄牌警告。*如比赛正式开始后，(...)</p>\n<p class=\"fn\">*参阅「须知事项及修订」下的「界外球及球门球倒计时协定」。</p>\n<p>解释引入文字以避免开出球门球时的延误。如球队故意延误其球门球，裁判员将鸣哨，示意开出角球，然后开始五秒明显倒计时计时。如在倒计时结束时球门球仍未开出，则将角球判予对方球队。</p>\n<p>第17章–角球 (p.145)新增文字在以下情况判一角球:</p>\n<ul>\n<li>当整个球在地面或空中完全越过两球门柱外的球门线，而最后触球者为防守球员而又并非一进球时（参阅第8章、第12章、第13章, 第15章及第16章）。</li>\n</ul>\n<ul>\n<li>裁判员判罚以下情况：</li>\n</ul>\n<ul>\n<li class=\"l2\">守门员用手/手臂控制球超过八秒</li>\n</ul>\n<ul>\n<li class=\"l2\">球员为其球队延误开出球门球</li>\n</ul>\n<p>解释当裁判员判罚守门员持球时间过长或球队延误开出球门球时，可判一角球予对方。</p>\n<p>视频助理裁判员(VAR)协定 (p.149, 151)</p>\n<h3>1. 原则</h3>\n<p>经修订文字在足球比赛中使用VAR是基于数项原则，在使用VAR时，所有这些原则必须应用于比赛当中。（错误判决的角球除外 – 参阅「2. 可覆检的决定/事件」下的e项）。</p>\n<p>1.\t视频助理裁判员（VAR）属于比赛官员，在不受干扰地获得比赛视像影片，可在以下相关的事件出现「清晰及明显错误」或「遗漏严重犯规」时协助裁判员:a.\t进球/不进球b.\t点球/非点球c.\t直接红牌（不包括明显错误的而导致两黄一红情况）d.\t裁判员错误识别球员身份（发出黄牌警告或驱逐[红牌]予犯规球队不正确的球员）(...)</p>\n<h3>2. 可覆检令比赛逆转的决定/事件</h3>\n<p>经修订文字经修订文字裁判员只在四项五项有关于会令比赛逆转的决定/事件可接受由VAR提供的协助。</p>\n<p>(…)可覆检的决定/事件类别中，有可能发生「清晰及明显错误」或「遗漏严重犯规」的相关事件有：</p>\n<p>(...)c.\t直接红牌（非两黄一红情况）</p>\n<ul>\n<li>破坏明显进球机会（尤其是关于犯规位置和其他球员位置）</li>\n</ul>\n<ul>\n<li>严重犯规（或鲁莽冲撞）</li>\n</ul>\n<ul>\n<li>凶暴行为、向其他人吐唾沫或咬人</li>\n</ul>\n<ul>\n<li>作出冒犯、侮辱及/或辱骂举动</li>\n</ul>\n<ul>\n<li>明显错误的第二面黄牌警告a.\t错误确认身份（红或黄牌）如裁判员判罚一犯规但明显错误确认球员身份，然后发出黄牌或红牌予错误的犯规（被判罚）球队球员时，仅犯规球员的身份可被覆检；除非关于进球、点球事件或直接红牌情况，否则该实际犯规动作不能被覆检。b.\t明显错误判决的角球，前提是该决定能被立即更改及不延迟比赛重新开始（竞赛组织可允许）</li>\n</ul>\n<p>解释可覆检的决定/事件现包括两项不常见但可令比赛逆转的错误：</p>\n<ul>\n<li>因明显错误的第二面黄牌警告而导致的红牌</li>\n</ul>\n<ul>\n<li>裁判员错误识别球员而发出黄牌警告或红牌罚令出场但明显判罚任何一方球队的错误球员；除非错误识别球员，否则该犯规动作不能被覆检此外，竞赛组织可选择覆检明显错误判决的角球（包括当球已越过边线位置出界时），前提是此覆检能立即进行及不延误比赛重新开始。如角球被迅速开出，则该决定不能更改。如在收到VAR资讯后需要使用「电视讯号」手势更改决定。第5章–裁判员 (p.73)</li>\n</ul>\n<h3>2.裁判员的决定</h3>\n<p>经修订文字(…)除规则12章第3节第4节及视频助理裁判员另有概述，裁判员仅可在...）第5章–裁判员 (p.76)</p>\n<h3>4. 视频助理裁判员(VAR)</h3>\n<p>经修订文字只容许赛事/竞赛组织(...)所有支援和批准执行(IAAP)执行要求，如国际足球协会的IAAP文件VAR手册中所述，并(...)才可使用视频助理裁判员。</p>\n<p>第5章–裁判员 (p.78, 80)</p>\n<h3>6.裁判员讯号</h3>\n<p>新增讯号新增裁判员界外球讯号。</p>\n<p>界外球经修订的讯号将点球的图像更改为裁判员鸣哨图像。</p>\n<p>点球经修订的讯号将角球的图像更改为裁判员不鸣哨图像。</p>\n<p>角球第12章–犯规及不正当行为 (p.119)</p>\n<h3>4. 纪律行动</h3>\n<p>新增文字可被黄牌警告的犯规如以下罪行成立，球员应被黄牌警告：</p>\n<ul>\n<li>拖延重新开始比赛（如下文「拖延重新开始比赛」所述）</li>\n</ul>\n<ul>\n<li>(...)第14章–点球 (p.133)</li>\n</ul>\n<h3>2. 触犯规则及罚则</h3>\n<p>经修订文字假如球被踢出前有以下情况发生：</p>\n<p>(...)</p>\n<ul>\n<li>主射球员或其队友犯规：</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球被直接射入网，重踢该点球</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球没有被直接射入网，裁判员暂停比赛及判守方以间接任意球重新开始比赛</li>\n</ul>\n<p>(...)</p>\n<ul>\n<li>守门员犯规：</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球被射入，进球有效</li>\n</ul>\n<p>(...)</p>\n<ul>\n<li>守门员队友犯规：</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球被直接射入网，进球有效</li>\n</ul>\n<ul>\n<li class=\"l2\">如点球没有被直接射入网，重射点球</li>\n</ul>\n<p>第14章–点球 (p.134, 135)</p>\n<h3>3.总结列表</h3>\n<p>经修订文字点球结果点球进球点球不进球仅有影响：重射点球有影响：间接任意球无影响：进球无影响：不重射攻方球员入侵有影响：进球有影响：重射点球仅无影响：进球无影响：不重射防守球员入侵攻守双方球员均有影响：</p>\n<p>攻守双方球员均有影响：重重射点球射点球守方和攻方球员入侵仅守方球员有影响：进球仅守方球员有影响：重射点仅攻方球员有影响：重射球点球仅攻方球员有影响：不重射无影响：进球无影响：不重射不是被救出：不需重射点球(除非主射球员受到影响）仅属进球被救出：重射点球及口头守门员犯规警告守门员；再犯则会被黄牌警告判罚间接任意球，并黄牌警判罚间接任意球，并黄牌警告主射球员告主射球员守门员与主射球员在同一时间触犯规则除非主射球员触犯以下其除非主射球员触犯以下其中一项犯规，否则重射点球中一项犯规，否则重射点球意外：重射点球意外或蓄意：间接任意球主射球员重触球蓄意：间接任意球将球踢向后间接任意球间接任意球间接任意球及黄牌警告主间接任意球及黄牌警告主「不合法」假动作射球员射球员间接任意球及黄牌警告该间接任意球及黄牌警告该不是被确认之主射球员球员球员间接任意球及黄牌警告主间接任意球及黄牌警告主主射球员的欠缺体育精神行为射球员射球员视频助理裁判员(VAR)协定 (p.149)经修订文字只容许赛事/竞赛组织(...)所有支援和批准执行(IAAP)执行要求，如国际足球协会的IAAP文件VAR手册中所述，并(...)才可使用视频助理裁判员。</p>\n<p>词汇 – 足球用语经修订及新增文字Advantage (有利)当出现犯规，或重新开始比赛被不正确地开出而比赛亦已进行中，如不判罚犯规对非犯规对方球队更有利时，裁判员应容许比赛继续。</p>\n<p>Careless (不小心)球员作出任何对对方球员表现出不谨慎或欠缺注意的动作（通常指拦截或冲击）。</p>\n<p>Kicks from the penalty mark（ 互射点球决胜）参阅「点球（射点球决胜）」Restart position (重新开球位置)球员在重新开球时的位置，由其双脚或身体任何触地的部分之位置决定，唯第11章「越位」条例所列明的情况除外；球员在空中，其位置将以其双脚若接触地面时的投影位置来决定。</p>\n<p>Semi-automated offside technology (SAOT) (半自动越位侦测技术)一种能即时将越位位置的相关资讯，传送给视频助理裁判员（VAR）的技术；其进阶版本更能将资讯直接传送给助理裁判员。</p>"},{"id":"revision","title":"规则修订与实施","pages":"191-210","html":"<p>词汇包含需要澄清或解说字句/片语，其意思超越在规则上的详述及/或难以用其他语言翻译。</p>\n<p>由英国四个足球协会及国际足球协会组成的团体，主要负责在全The IFAB － 国际足球协会委员会球实施足球竞赛规则。原则上，任何规则修订要经过每年二月或三月举行之年度大会批准通过FIFA － 国际足球协会世界足球的管治机构洲际足球协会负责各大洲足球的机构。六个洲际足球协会是亚洲足球协会(AFC)、非洲足球协会(CAF)、中北美洲及加勒比海足球协会(CONCACAF)、南美洲足球协会(CONMEBOL)、大洋洲足球协会(OFC)及欧洲足球协会(UEFA)国家足球协会各国家地区之足球管治机构AAbandon （腰斩）在正式法定时间前结束/终止比赛Additional time （补时）每半场完用作补偿因替换程序、受伤、纪律行动、庆祝进球等「消耗」的时间Advantage （有利）当出现犯规，或重新开始比赛被不正确地开出而比赛亦已进行中，如不判罚犯规对非犯规对方球队更有利时，裁判员应容许比赛继续。</p>\n<p>Assessment of injured player （评估受伤球员）医疗人员对受伤球员作快速检查，看有否需要接受治疗Away goals rule （作客进球条例）当双方球队进球数字一样，在决定一场比赛胜负/和局时，作客进球便会以双倍计算BBrutality （粗暴行为）野蛮、残忍或蓄意的暴力行为CCaution （黄牌警告）需向纪律当局报告的纪律惩处，一张黄牌是显示一警告，球员或球队职员在同一场比赛被两次黄牌警告便必须离场（红牌罚令出场）Careless (不小心)球员作出任何对对方球员表现出不谨慎或欠缺注意的动作（通常指拦截或冲击）。</p>\n<p>Challenge （争夺）与对方球员竞争/争夺球时的动作Charge (an opponent) [冲撞（对方球员）]向对方作身体冲击，通常会使用肩膊及上肢（保持紧贴身躯）‘Cooling’ break （「降温」小休）为了球员的福利和安全，竞赛规程可容许在某些天气情况及条件（高湿度与高温）下，可在比赛安排「降温」小休（通常由九十秒至三分钟）让球员身体温度降低，这与「补充水分」小休时间不一样Concussion substitution （替换脑震荡球员）竞赛组织可允许各队在一名球员实际或疑似出现脑震荡时进行一次额外换人（并在适用的情况下给予球队一次额外的替换球员机会）。</p>\n<p>参阅「额外永久替换脑震荡球员协定」DDeceive （欺骗）利用误导/诡计引致裁判员作错误判决/纪律行动，从而使作出欺诈的球员/其球队有得著Deliberate （蓄意）球员有意识/有目的地作出的动作；这并非反射或无意识反应Direct free kick （直接任意球）一种任意球，可不用接触其他球员下，将球直接射进对方球门而得分Discretion （酌情权）裁判员或其他比赛官员做决定时的判断Dissent （表示不满）对比赛官员公开抗议或争论（言语或/及动作），此行为应被黄牌警告Distract （分散）打扰、扰乱或吸引人注目（通常不公平地）‘Drinks’ break （「补充水份」小休）为了让球员补充水份，竞赛规程可容许「补充水份」小休（不超过一分钟）；但这小休有别于「降温」小休Dropped ball [坠球 （公正球）]当裁判员在没有犯规的情况下暂停比赛时重新开始比赛，例如由于受伤、球破损等等（参见第8章）。</p>\n<p>EElectronic performance and tracking system (EPTS)（电子数据表现及定位系统）用作纪录及分析球员体能及生理表现的电子系统Endanger the safety of an opponent （危害对方安全）令对手有危险或风险（受伤）Excessive force （过度力量）在不必要的情况下使用过度的力度/力量Extra time （加时作赛）一个以两段不超过15分钟的额外加时时段作赛，属于决定胜负的一种方法FFeinting （假动作）试图以动作令对手混淆。规则祥细说明何谓允许和「不合法」的假动作Field of play (Pitch) [比赛场地（球场）]比赛范围指由边线、球门线和球门网之内的地方GGoal line technology (GLT) （球门线技术）当进球发生时，透过电子系统即时通知裁判员球已完全越过球门的球门线（详情参阅规则第1章）HHolding offence （拉扯犯规）当球员与对方球员身体或装备接触时引致阻碍其移动，才算触犯拉扯犯规Hybrid system （混合系统）一个需要阳光、水、空气流通和割草的人工和天然物料组合而成的比赛场地表面IImpede （阻碍）延迟、阻碍或防止对手的动作或移动Indirect free kick （间接任意球）如踢出球后，经（任何球队的）其他球员触球后才可计算进球的自由球阻截球到达预计的地点Intercept （截取）KKick （踢球）球被踢是指球员使用脚部/或足踝接触球NNegligible （微不足道）极轻微及极小OOffence （犯规）一个破坏/违反规则的动作Offensive, insulting or abusive language/action(s)（冒犯性、侮辱性或辱骂性言语/举动）作出粗鲁、使心理受伤害或不尊重的言语或身体动作，需被红牌驱逐离场Outside agent （外来物体）任何动物、物件或结构等，以及任何非比赛官员或不在球队名单上的人员（球员、替补队员和球队官员）PPenalise （判罚）判罚通常是指暂停比赛并判对方获获得一个任意球或点球（另参阅有利条例）Penalties (penalty shoot-out)) [点球（射点球决胜）]前称为「互射点球决胜负」决定胜负的一种方法，每队派出相同数量球员轮流主射点球，直至其中一队在两队都完成相同数目之射球后，进球数目比对方多于一个进球便胜出比赛。（除非首五轮射点球的过程中，其中一队在余下的射门名额都无法追至平手）Penalty shoot-out（射点球决胜）参阅「点球（射点球决胜）」Play （处理球）球员接触球的动作Playing distance （可处理球的距离）一段能让球员伸延脚/腿或跳起，又或是守门员跳起时伸延前臂接触球的距离。距离长度视乎球员本身的体格QQuick free kick （快开任意球）一个在赛事暂停后非常快速开出的任意球（经裁判员许可下）RReckless （鲁莽）一名球员漠视（忽略）对手的安危或其作出的任何动作之后果（通常是栏截或冲击）Restart （重新开始比赛)任何比赛暂停后重开的方法Restart position （重新开始比赛时球员的位置）球员在重新开球时的位置，由其双脚或身体任何触地的部分之位置决定，唯第11章「越位」条例所列明的情况除外；球员在空中，其位置将以其双脚若接触地面时的投影位置来决定。</p>\n<p>SSanction （处分）裁判员采取的纪律行动Save （救球）「救球」是指球员除了用手/手臂部外（守门员可在禁区内利用手/手臂触球），利用身体任何部分阻止或试图阻止一个进球或一个有可能的进球Sending-off （红牌罚令出场）一种纪律惩处，指一名球员因触犯须被罚令出场的犯规（出示红牌），必须离开比赛场地及不能参与余下比赛时间；如赛事已开始，此球员的名额不能被替补。</p>\n<p>球队官员亦可被红牌罚令出场。</p>\n<p>Semi-automated offside technology (SAOT) (半自动越位侦测技术)一种能即时将越位位置的相关资讯，传送给视频助理裁判员（VAR）的技术；其进阶版本更能将资讯直接传送给助理裁判员。</p>\n<p>Serious foul play （严重犯规）在争夺球时，危害对手安全或使用过度力量或有粗暴举动之栏截或冲击，犯规球员须被红牌罚令出场Shinguard（护胫）为保护球员胫骨免受伤害而穿戴的装备。球员有责任穿著由合适物质和尺寸制成而具有一定的保护作用的护胫，并且整个护胫必须被长袜覆盖Shirt（运动衫）作为球队制服一部分穿在球员上身的衣服。除了衣袖长度，球队中所有球员均穿著同样运动衫，唯守门员除外，以便与其他球员及赛事比赛官员区分开来Signal （讯号）裁判员或任何赛事的比赛官员的实质示意；通常涉及手、手臂或旗号的动作，或者利用哨子（只限裁判员）Simulation （伪装）一名球员为了获得不公平的利益，在事件没有发生的情况下制造一个错误/虚拟假象（另参阅欺骗）Spirit of the game （比赛精神）足球运动比赛中应展现的主旨/基本原则/精神（参阅规则第5章）Suspend （暂缓）暂停赛事一段时间，并有机会重新开始比赛，例如：因为大雾、暴雨、雷暴或严重受伤TTackle （栏截）用脚去争夺球（在地面或离开地面）Team list （球队名单）官方的球队名单，通常列出球员、替补队员及球队官员Teamofficial （球队官员）任何在比赛名单上的非球员人员，如教练、物理治疗师、医生（另参阅技术人员）Technical area （技术指导区域）予以球队职球员包括座位在内的指定区域（在运动场内）（详情另参阅规则第1章）Technical staff （球队技术人员）官方球队名单中非球员人员，如教练、物理治疗师、医生（另参阅球队职员）Temporary dismissal （暂时罚令出场）球员因触犯可被黄牌警告条例时被处罚暂停在往后一段时间不可参与比赛（依照竞赛规程）UUndue interference （不必要的干扰）不必要的行动/影响不公平的动作/行为；可被黄牌警告Unsporting behaviour （欠缺体育精神行为）</p>\n<figure class=\"pg\"><img src=\"assets/rules/p201.png\" alt=\"图示\" loading=\"lazy\"></figure>\n<p>Match official(s) （比赛官员）负责管控足球比赛的人员或团队之统称，他们代表足球总会及/或赛事在其管辖下进行Referee （裁判员）在比赛场地内的主要比赛官员，其他比赛官员在裁判员的控制和指示下作出合作。裁判员是最后/最终的决策者Other match officials （其他比赛官员）「场区」比赛官员赛事组织可委派其他比赛官员协助裁判员：</p>\n<ul>\n<li>Assistant referee （助理裁判员）位于每半场边线持旗的比赛官员，主要协助裁判员决定越位情况和球门球/角球/界外球</li>\n</ul>\n<ul>\n<li>Fourth official （后备官员）主要负责协助裁判员场内和场外事宜的比赛官员，工作包括监视技术指导区域、处理替换程序等</li>\n</ul>\n<ul>\n<li>Additional assistant referee (AAR) （附加助理裁判员）位于球门线上的比赛官员，协助裁判员在罚球区内/附近的情况和进球/不进球的决定</li>\n</ul>\n<ul>\n<li>Reserve assistant referee （后备助理裁判员）代替未能继续执法而负责协助裁判员场内和场外事宜（包括监视技术指导区域、处理替换程序等）之助理裁判员（及如竞赛规则许可，则为后备官员及/或附加助理裁判员）的赛事执法人员「视像」比赛官员 (VMOs)视频助理裁判员(VAR)和副视频助理裁判员(AVAR)，其根据足球球例和VAR协定来协助裁判员执法</li>\n</ul>\n<ul>\n<li>视频助理裁判员 (VAR)可委派现役或退役裁判员担任，其只可将属于可覆检类别且与清晰及明显错误决定或遗漏严重犯规相关的情况，透过提供重播影片资料与裁判员沟通来协助执法</li>\n</ul>\n<ul>\n<li>副视频助理裁判员 (AVAR)可委派现役或前任裁判员/助理裁判员担任来协助视像助理裁判员(VAR)本指引包括给予比赛官员的实用建议，作为规则的附加资料。</li>\n</ul>\n<p>指引是参照规则第5章，以其框架及比赛精神而制订。目的是期望裁判员能运用常理及比赛精神去演绎规则，特别是当要决定比赛应否开始及/或继续。</p>\n<p>因要在低组别赛事严格执行规则的可能性不大，运用常理及比赛精神演绎规则尤为重要。除非存在安全问题，否则裁判员应在以下情况让比赛开始及/或继续：</p>\n<ul>\n<li>失去一支或多支角球旗杆</li>\n</ul>\n<ul>\n<li>场地界线尺寸有少许不准确，例如角球弧线、中圈等等</li>\n</ul>\n<ul>\n<li>门柱/横梁不是白色</li>\n</ul>\n<p>在这情况下，裁判员应与球队达成共识而让比赛开始/继续，但必须向相关赛会提交报告。</p>\n<p>注解：</p>\n<ul>\n<li>AR = 助理裁判员</li>\n</ul>\n<ul>\n<li>AAR = 附加助理裁判员</li>\n</ul>\n<h3>1.\t一般的位置及走动</h3>\n<p>最佳位置是裁判员可作出正确判决的位置。所有关于位置的建议必须基于球队、球员和该场比赛中可能发生事件的具体资讯而调整。</p>\n<p>以下位置的图解建议只是基本准则。建议位置指在普遍情况下最有利裁判员的区域。因应实际比赛情况，区域有可能扩大、缩小或改变形状。</p>\n<p>建议：</p>\n<ul>\n<li>处理球位置应在裁判员和进攻方向的助理裁判员之间</li>\n</ul>\n<ul>\n<li>进攻方向的助理裁判员应在裁判员视线范围内，裁判员应经常使用宽阔对角线系统走动</li>\n</ul>\n<ul>\n<li>选择位置应在比赛时处理球位置范围外，这可更容易将处理球位置及进攻方向的助理裁判员纳入裁判员视线范围内</li>\n</ul>\n<ul>\n<li>裁判员应在不干扰比赛的情况下，尽可能接近比赛时的处理球位置观察</li>\n</ul>\n<ul>\n<li>发生在球附近的事件并不一定是比赛经常「需要注视的地点」。裁判员还应注意：</li>\n</ul>\n<ul>\n<li class=\"l2\">非处理球球员间的冲突</li>\n</ul>\n<ul>\n<li class=\"l2\">比赛进攻区域可能的犯规</li>\n</ul>\n<ul>\n<li class=\"l2\">球被出踢后所发生的犯规</li>\n</ul>\n<figure class=\"pg\"><img src=\"assets/rules/p207.png\" alt=\"图示\" loading=\"lazy\"></figure>\n<p>助理裁判员和附加助理裁判员的位置助理裁判员应与最后第二名防守球员处于同一线上，而当比赛时球比最后第二名防守球员更接近球门线时，应与球处于同一线上。助理裁判员在跑动时，应时常保持面向比赛场地。在短距离内应尽量使用横向跑动。尤其在判断越位时显得更重要，这可给予助理裁判员更好的视野。</p>\n<p>除非有必要踏上球门线上判断进球与否，附加助理裁判员的位置应在球门线后。除特别情况外，附加助理裁判员不应进入比赛场地。</p>\n<p>(GK)守门员防守球员进攻球员裁判员助理裁判员附加助理裁判员</p>\n<h3>2.\t位置及团队合作</h3>\n<p>商讨当执行纪律事宜时，助理裁判员与裁判员保持目光接触及给予基本指定的手号已经足够。当有需要直接进行对话时，助理裁判员可进入场内2至3米。当对话进行时，裁判员及助理裁判员都应面向场内，以避免其他人员听到对话内容及可同时观察场内的球员。</p>\n<p>角球开角球时，助理裁判员应站在角球旗后与球门线同一线上的位置。</p>\n<p>唯处于此位置时，应不要阻碍球员开出角球，并应确保球正确放在角球区域内。</p>\n<p>(GK)守门员 (GK)防守球员进攻球员裁判员任意球开任意球时，助理裁判员应站在与最后第二名防守球员同一线上的位置观察越位线。不过，当有任意球直接射门时，他应跟随球沿著边线向角球旗方向跑动。</p>\n<p>(GK)守门员 (GK)防守球员进攻球员裁判员(GK)守门员 (GK)防守球员进攻球员裁判员</p>"},{"id":"guide","title":"比赛官员实用指引","pages":"211-236","html":"<figure class=\"pg\"><img src=\"assets/rules/p211.png\" alt=\"图示\" loading=\"lazy\"></figure>\n<p>进球/不进球当有进球而在过程并无问题，裁判员与助理裁判员应保持目光接触，助理裁判员随后应沿边线向中场线疾跑25至30米及不需举旗示意。</p>\n<p>进球后，如球仍呈现在比赛状态，助理裁判员应先举旗以引起裁判员注意，接著按照正常的进球程序，沿边线向中场线疾跑25至30米。</p>\n<p>当球并未完全越过球门线，并因未有进球而比赛需如常继续，此时，裁判员应与助理裁判员保持目光接触，如有需要，可给予特定的手号作提示。</p>\n<p>(GK)守门员 (GK)防守球员进攻球员裁判员球门球助理裁判员应首先检查球是否已被放定在球门区域内。如球没有被正确放置，助理裁判员应站于原地及必须与裁判员保持目光接触并举旗示意。当球已经被正确放定在球门区域后，助理裁判员必须移至适当位置观察越位线。</p>\n<p>然而，如比赛中有委派附加助理裁判员，助理裁判员应到适当位观察越位线，而附加助理裁判必须在球门线及球门区域的交汇点上，检查球是否被放定放在球门区域内。如球没有被正确放置，附加助理裁判员必须向裁判员作出提示。</p>\n<p>(GK)守门员 (GK)防守球员进攻球员裁判员</p>\n<figure class=\"pg\"><img src=\"assets/rules/p214.png\" alt=\"图示\" loading=\"lazy\"></figure>\n<figure class=\"pg\"><img src=\"assets/rules/p215.png\" alt=\"图示\" loading=\"lazy\"></figure>\n<p>点球（射点球决胜）其中一名助理裁判员应站在球门线与球门区域的交汇点上。另一助理裁判员应位于中圈管理两队的球员。如比赛中有委派附加助理裁判员，他们必须分别在球门线与球门区域交汇点的左边及右边，但如有使用球门线科技则只需要一名附加助理裁判员站在球门线与球门区域的交汇点上；在这情况，第二附加助理裁判员及第一助理裁判员应在中圈位置管理两队球员，而第二助理裁判员及后备官员则管理两队技术指导区域。</p>\n<p>没有 AAR(GK)(GK)守门员 (GK)防守球员进攻球员裁判员AARs(GK)(GK)守门员 (GK)防守球员进攻球员裁判员点球助理裁判员应站在球门线及罚球区线的交汇点。</p>\n<p>(GK)守门员 (GK)防守球员进攻球员裁判员在科技协助下(例如球门线科技，视频助理裁判员系统)，球门线上守门员有否入侵及进球/不进球的情况已能以科技协助检视，为减低助理裁判员因未能及时从球门线返回越位线上判决球被踢反弹后的越位情况的风险，建议助理裁判员可以站在边线与罚球点的交汇点上（即越位线）来判断越位情况。</p>\n<p>(GK)守门员 (GK)防守球员进攻球员裁判员如赛事中有附加助理裁判员，他必须站在球门线与球门区域线的交汇点，而助理裁判员应站在点球的同一线上(即越位线)。</p>\n<p>集体冲突在发生集体冲突时，最近的助理裁判员可进入比赛场地协助裁判员。另一名助理裁判员需要在有利位置观察并记录事件的细节。后备裁判员应控制技术指导区域。</p>\n<p>人墙距离在非常接近助理裁判员位置有任意球时，助理裁判员可进入比赛场地(通常由裁判员提出要求)协助处理9.15米(10码)的人墙距离。</p>\n<p>在这情况下，裁判员应等待助理裁判员回到适当位置后才示意重新开始比赛。</p>\n<p>替换程序如比赛没有委派后备官员，助理裁判员需要移至中场线协助处理替换程序。裁判员应等待助理裁判员回到适当位置后，才示意重新开始比赛。</p>\n<p>如比赛中有委派后备官员时，助理裁判员不需跑向中场线位置，因后备官员会负责替换程序。除非同时有数个替换要求，助理裁判员便应移至中场线协助后备官员处理替换程序。</p>\n<h3>1.\t裁判员</h3>\n<p>身体语言身体语言是裁判员的一种沟通技巧，用于：</p>\n<ul>\n<li>协助控制比赛</li>\n</ul>\n<ul>\n<li>展示权威及自控能力身体语言并不是用作解释判决。</li>\n</ul>\n<p>讯号参阅规则第5章有关讯号的图像哨子在下列情况下需要鸣哨：</p>\n<ul>\n<li>开始比赛(正常比赛时间的上/下半场及加时)及进球后的开始比赛</li>\n</ul>\n<ul>\n<li>暂停比赛：</li>\n</ul>\n<ul>\n<li class=\"l2\">判罚一任意球或点球</li>\n</ul>\n<ul>\n<li class=\"l2\">如暂缓或腰斩比赛</li>\n</ul>\n<ul>\n<li class=\"l2\">每个半场的完结</li>\n</ul>\n<ul>\n<li>在下列情况重新开始比赛：</li>\n</ul>\n<ul>\n<li class=\"l2\">需要处理人墙合法距离之任意球</li>\n</ul>\n<ul>\n<li class=\"l2\">执行点球</li>\n</ul>\n<ul>\n<li>在下列情况暂停比赛后的重新开始：</li>\n</ul>\n<ul>\n<li class=\"l2\">给予黄牌警告或红牌罚令出场</li>\n</ul>\n<ul>\n<li class=\"l2\">处理受伤</li>\n</ul>\n<ul>\n<li class=\"l2\">替换程序</li>\n</ul>\n<p>在下列情况可不需鸣哨：</p>\n<ul>\n<li>明显比赛暂停的情况：</li>\n</ul>\n<ul>\n<li class=\"l2\">球门球、角球、掷界外球或进球</li>\n</ul>\n<ul>\n<li>在下列情况重新开始比赛：</li>\n</ul>\n<ul>\n<li class=\"l2\">大部分任意球、球门球、角球、界外球或坠球</li>\n</ul>\n<p>太频密/不必要的哨子声会减低在有需要时其作用。</p>\n<p>如裁判员在重新开始比赛前要求球员(们)等待哨子声[例如要确保防守球员在任意球开出前离球9.15米(10码)]，裁判员必须明确通知进攻球员(们)等待哨声。</p>\n<p>如裁判员错误鸣哨令比赛停止，应用一坠球来重新开始比赛。</p>\n<h3>2.\t助理裁判员</h3>\n<p>电子讯号旗电子讯号系统是一种仅用来向裁判员作出提示的附加讯号。使用电子讯号的情况包括：</p>\n<ul>\n<li>越位</li>\n</ul>\n<ul>\n<li>犯规(发生在裁判员视线范围外)</li>\n</ul>\n<ul>\n<li>界外球、角球、球门球或进球(争议性的决定)</li>\n</ul>\n<p>电子通讯系统当使用电子通讯系统时，裁判员应建议助理裁判员何时使用该系统才最适合或在甚么情况可取代实质旗号。</p>\n<p>旗号技术助理裁判员手持的旗应时常展开和让裁判员看见，一般指助理裁判员应用靠近裁判员方向的手持旗。当示意讯号时，助理裁判员应停止动跑，面向比赛场地，与裁判员保持目光接触并从容的摇旗(不匆忙或夸张)。旗应像手臂延伸。助理裁判员应使用示意讯号的手举旗。如情况有变而必须要使用另一只手显示讯号，应将旗降到腰部以下才换至另一只手。无论任何时候，当助理裁判员示意球离开比赛范围时，便必须保持这个旗号直至裁判员知悉并作出相应判决为止。</p>\n<p>当助理裁判员示意一个需要罚令出场的犯规时，而此讯号没有即时被察觉：</p>\n<ul>\n<li>如比赛已暂停，重新开始比赛方式可依照规则的规定而改变(自由球、点球等)</li>\n</ul>\n<ul>\n<li>如果比赛已经重新开始，只可以进行纪律行动，不能再判罚自由球或点球</li>\n</ul>\n<p>姿态一般来说，助理裁判员不应使用明显手号。在一些特别情况下，一个简单而不明显的讯号能协助裁判员作出正确决定。但该手号必须清楚明确及在开赛前已达成共识。</p>\n<p>讯号参阅规则第6章讯号图解角球/球门球当整个球在近助理裁判员一方完全越过球门线，助理裁判员应用右手举旗示意(有更佳视线)通知裁判员球已离开比赛范围，如：</p>\n<ul>\n<li>近助理裁判员一方 － 示意是一球门球或一角球</li>\n</ul>\n<ul>\n<li>在助理裁判员的远方 － 与裁判员保持目光接触，然后跟随裁判员的判决</li>\n</ul>\n<p>当球明显完全越过球门线，助理裁判员不需要举旗示意球已离开比赛场地。如是明显的球门球或角球，尤其是裁判员已显示其决定，则不需要作出任何旗号。</p>\n<p>犯规当有犯规或不正当行为发生在助理裁判员附近或裁判员视线以外，助理裁判员必须举旗示意。在其他情况，助理裁判员必须等待及在有需要时给予裁判员意见，告知其所见所闻及涉事球员。</p>\n<p>在示意犯规前，助理裁判员必须确定：</p>\n<ul>\n<li>犯规发生在裁判员视线以外或裁判员视线被阻情况下</li>\n</ul>\n<ul>\n<li>裁判员没有运用有利规条</li>\n</ul>\n<p>当有犯规发生，而需要助理裁判员发出讯号时，助理裁判员必须：</p>\n<ul>\n<li>用将会示意讯号的手举旗通知裁判员 － 这可给予裁判员明确得知哪一方将会获得任意球</li>\n</ul>\n<ul>\n<li>与裁判员保持目光接触</li>\n</ul>\n<ul>\n<li>将旗轻轻前后摇动(避免怱忙或夸张旗号)</li>\n</ul>\n<p>助理裁判员必须使用「等及看技巧」来让比赛继续，当被侵犯一方得到利益时便不需举旗示意。故此助理裁判员与裁判员经常保持目光接触是非常重要。</p>\n<p>在罚球区内的犯规当防守球员在其罚球区内犯规时，如事件在裁判员视线范围外，而犯规地点是接近助理裁判员时，助理裁判员应先与裁判员有目光接触，留意裁判员的身处地点及会否采取任何行动。假如裁判员没有采取行动，助理裁判员必须举旗示意，使用电子讯号旗及向角球旗方向跑去。</p>\n<p>在罚球区外的犯规当防守球员在其罚球区外(接近其罚球区界线)犯规时，助理裁判员应先与裁判员作目光接触，留意裁判员身处地点及会否采取任何行动，才在有需要情况下举旗示意。在快速反击时，助理裁判员应给予裁判员以下资讯，如是否出现犯规情况、该犯规发生于点球区域内或外、及需要采取甚么纪律行动。当犯规地点是发生在点球区域外时，助理裁判员应在边线上明显移向中场线借此向裁判员显示该犯规是发生在罚球区外。</p>\n<p>进球 － 不进球当整个球明显完全越过球门线进进球网内，助理裁判员必须先与裁判员作目光接触而不需有任何额外讯号。</p>\n<p>进球后，但球仍像未完全越过球门线，助理裁判员应先举旗引起裁判员注意，然后确定这是进球。</p>\n<p>越位在判断越位犯规，助理裁判员的第一个动作是举旗(用右手持旗可使助理裁判员有更佳的视野)，当裁判员暂停比赛后，以旗号去显示犯规是在比赛场地内何处发生。如裁判员未能即时察觉越位犯规旗号，助理裁判员必须维持该旗号直至裁判员知悉为止或守方球员已明显控制球。</p>\n<p>点球如守门员在点球踢出前明显离开球门线而阻止进球，助理裁判员应根据裁判员赛前建议的处理方式举旗示意守门员触犯入侵球例。</p>\n<p>替换程序判员必须在下一个暂停时用旗号通知裁判员。</p>\n<p>当(由后备官员或球队官员)通知助理裁判员需要替换后，助理裁界外球当整个球完全越出边线：</p>\n<ul>\n<li>近助理裁判员一方-应以讯号直接显示掷界外球方向</li>\n</ul>\n<ul>\n<li>在助理裁判员远方而界外球决定如是明显的-助理裁判员必须以讯号直接显示掷界外球方向</li>\n</ul>\n<ul>\n<li>在助理裁判员远方而对于哪方掷界外球有疑问的-助理裁判员必须举旗向裁判员示意球已离开比赛场地，与裁判员作目光接触并跟随裁判员的讯号</li>\n</ul>\n<h3>3.\t附加助理裁判员</h3>\n<p>附加助理裁判员使用无线通讯系统(非旗号)与裁判员联络。假如无线通讯系统失灵时，附加助理裁判员便会使用电子通讯旗杆。附加助理裁判员通常不需要使用明显手号，但在特别情况下，简单而不明显手号能给予裁判员有力的协助，该手号必须清楚明确及在开赛前与裁判员已达成共识。</p>\n<p>附加助理裁判员发觉整个球完全越过球门线进进球网内，必须：</p>\n<ul>\n<li>立即利用无线系统通知裁判员应为进球</li>\n</ul>\n<ul>\n<li>用左手作出一明确讯号，与球门线成一直角指向中场(如左手持电子通讯旗杆亦需要这样做)。如球清晰越过球门线便不需要显示这讯号。</li>\n</ul>\n<p>裁判员会作最终决定。</p>\n<h3>1.\t有利</h3>\n<p>在比赛进行中，当有犯规情况出现时，裁判员可以运用有利条例让比赛继续。在决定是否运用有利条例或暂停比赛前，裁判员应考虑以下情况：</p>\n<ul>\n<li>犯规严重程度 － 如该犯规为一个可被红牌罚令出场的犯规，除非当时有一明显取得进球机会，否则裁判员应暂停比赛及显示红牌驱逐该名球员离场</li>\n</ul>\n<ul>\n<li>犯规地点 － 越接近对方球门，运用有利条例会产生更佳效果</li>\n</ul>\n<ul>\n<li>即时明显进攻机会</li>\n</ul>\n<ul>\n<li>比赛气氛</li>\n</ul>\n<h3>2.\t补偿消耗时间</h3>\n<p>在比赛中有很多暂停是完全正常的(例如：掷界外球、球门球)。只有当暂停时间过长才需要作出补偿。</p>\n<h3>3.\t拉扯对方球员以阻碍其移动</h3>\n<p>裁判员应提高警觉，尽早介入和坚定处理拉扯行为，尤其在角球或任意球开出前于罚球区内出现的此类行为。处理这些情况时：</p>\n<ul>\n<li>裁判员应在重新开始比赛前，口头警告作出此行为的任何球员</li>\n</ul>\n<ul>\n<li>如口头警告后此行为仍继续，黄牌警告涉事球员</li>\n</ul>\n<ul>\n<li>如在比赛已经重新开始才发生，判罚直接任意球或点球，并黄牌警告该球员</li>\n</ul>\n<h3>4.\t越位</h3>\n<p>干扰比赛(A)越位犯规(GK)守门员(GK)防守球员进攻球员裁判员球员移动路线球移动路线身处越位位置的进攻球员(A)，虽没有干扰对方球员，但触碰球。</p>\n<p>在这情况下， 助理裁判员必须在这球员触球的时候举旗示意。</p>\n<p>干扰比赛(A)没有越位犯规(GK)守门员(GK)防守球员进攻球员裁判员球员移动路线球移动路线身处越位位置的进攻球员(A)，没有干扰对方球员，亦没有触碰皮球。在这情况下，因这球员没有触球，不应被判罚犯规。</p>\n<p>干扰比赛(GK)没有越位犯规(A)守门员(GK)防守球员(B)进攻球员裁判员球员移动路线球移动路线身处越位位置的进攻球员(A)跑向球；与此同时，其队友亦同时从非越位位置(B)跑向球及处理球。球员(A)因没有触球，因此毋须被判罚。</p>\n<p>干扰比赛(GK)越位犯规(A)守门员(GK)防守球员进攻球员裁判员球员移动路线球移动路线身处越位位置的进攻球员(A)跑向球，如裁判员认为此球员在玩球或触及球前，没有其他队友有机会从非越位位置跑往处理球，球员(A)应被判罚越位犯规。</p>\n<p>干扰比赛(GK)球门球(2)(1)守门员(GK)防守球员进攻球员裁判员球员移动路线球移动路线身处越位位置的进攻球员(1)跑向球但未能触及球。助理裁判员应示意「球门球」。</p>\n<p>干扰对方球员(GK)越位犯规(A)守门员(GK)防守球员进攻球员裁判员球员移动路线球移动路线身处越位位置的进攻球员(A)明显阻碍守门员视线，该球员应因阻碍守门员处理球或导致不能处理球而被判罚越位犯规。</p>\n<p>干扰对方球员(GK)没有越位犯规(A)守门员(GK)防守球员进攻球员裁判员球员移动路线球移动路线身处越位位置的进攻球员(A)并没有明显阻碍守门员视线或与对方抢球，该球员不应被判罚。</p>\n<p>干扰对方球员(GK)没有越位犯规角球(A)(B)守门员(GK)防守球员进攻球员裁判员球员移动路线球移动路线身处越位位置的进攻球员(A)跑向球但未有阻碍对方球员处理球或导致对方球员不能处理球。球员(A)并没有向球员(B)作出争夺皮球动作。</p>\n<p>干扰对方球员(GK)越位犯规(A)(B)守门员(GK)防守球员进攻球员进攻球员球员移动路线球移动路线身处越位位置的进攻球员(A)跑向球及作出争夺动作引致阻碍对方球员(B)处理球或导致对方球员不能处理球。球员(A)向球员(B)作出争夺动作。</p>\n<p>取得利益(GK)1越位犯规(B)守门员(GK)防守球员进攻球员裁判员(A)球员移动路线球移动路线身处越位位置的进攻球员(B)踢或触及由其队友最后触及或处理球后而经由守门员反弹、改变方向或蓄意救球后传来的球，该身处越位位置球员应被判罚越位犯规。</p>\n<p>取得利益(C)(B)(GK)越位犯规守门员(GK)防守球员进攻球员裁判员(A)球员移动路线球移动路线身处越位位置的进攻球员(B)踢或触及由其队友最后触及或处理球后而经由防守球员(C)反弹、改变方向或蓄意救球后传来的球，该身处越位位置球员应被判罚越位犯规。</p>\n<p>取得利益(GK)没有越位犯规(C)(B)守门员(GK)防守球员进攻球员裁判员(A)球员移动路线球移动路线进攻球员(A)的射门，球经由守门员反弹，一名在非越位位置球员(B)处理球，而身处越位位置的进攻球员(C)没有触及球，球员没有因身处越位位置而取得利益，所以不能被判罚越位犯规。</p>\n<p>取得利益(GK)越位犯规(B)守门员(GK)防守球员进攻球员(A)裁判员球员移动路线球移动路线进攻球员(A)的射门，球经由对方球员反弹或弹离到一身处越位位置的进攻球员(B)，此球员处理球或触碰球，应被判罚越位犯规。</p>\n<p>取得利益(GK)没有越位犯规(B2)(C)守门员(GK)(B1)防守球员进攻球员(A)裁判员球员移动路线球移动路线身处越位位置并且没有干扰对方球员的进攻球员(C)，当队友(A)传球予位置(B1)球员，该球员跑向对方球门位置(B2)及将球传给球员(C)。因在传球给球员(C)的一刻，他非身处越位位置，不能判罚此球员越位犯规。</p>\n<h3>5.\t受伤</h3>\n<p>比赛中球员的安全是非常重要及应优先处理，在有球员受伤时，尤其是严重受伤或评估头部伤势，裁判员应尽快让医疗人员处理受伤球员，而处理过程应包括如何尊重及支持已有共识之评估/治疗方案。</p>\n<h3>6.\t处理涉及黄牌警告/红牌罚令出场的受伤治理/评估</h3>\n<p>在此之前，当受伤球员在场内接受医疗评估后，在重新开始比赛前，需要离开球场。如受伤是因对方在犯规时构成，此条例便显得不公平，因为当重新开始比赛后，犯规球队反而获得球员数目上的优势。</p>\n<p>不过，因为球员时常为战术原因而不顾体育精神利用处理受伤的程序去延迟重新开始比赛。</p>\n<p>为了平衡此两项不公平情况，国际足球协会委员会决定只有在有身体接触的犯规而犯规球员亦因此被黄牌警告或红牌罚令出场时，被侵犯而受伤的球员可留在比赛场地接受快速评估/治理。</p>\n<p>原则上，该评估/治理时间不应多于现时让医疗人员进进球场内评估伤势的时间。不同的是，裁判员以往会要求医疗人员及受伤球员一同离场，但现在只需要求医疗人员离场，而受伤球员可以留在比赛场地。</p>\n<p>要确定受伤球员并不会不公平使用/延长该暂停的时间，建议裁判员：</p>\n<ul>\n<li>需留意比赛形势及是否有任何潜在战术理由去延迟重新开始比赛</li>\n</ul>\n<ul>\n<li>通知该受伤球员，如需要医疗治理，必须尽快完成</li>\n</ul>\n<ul>\n<li>示意医疗人员(并非担架人员)及，如可能的话，提醒他们快速进行医疗检查及治理当裁判员决定比赛应重新开始时：</li>\n</ul>\n<ul>\n<li>医疗人员离场而受伤球员留在比赛场地，或</li>\n</ul>\n<ul>\n<li>受伤球员需要离场接受进一步评估/治理(或需示意担架进场)一般指引是，当所有在场人员已经准备重开比赛时，治理时间不应多于约20至25秒，如属于严重受伤及/或评估头部伤势除外。</li>\n</ul>\n<p>裁判员必须补偿因暂停而消耗了的时间。</p>"}]};
const byId = {};
DATA.sections.forEach((s,i)=>{ byId[s.id]=s; s.idx=i; });
let cur = null;

function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

// ---------- 目录 ----------
const groups = [["前言与总纲", s=>!s.id.startsWith("law-") && !["var","changes","revision","guide"].includes(s.id)],
  ["规则正文（第1—17章）", s=>!!s.law],
  ["附录与指引", s=>["var","changes","revision","guide"].includes(s.id)]];
document.getElementById("toc").innerHTML = groups.map(([g, pred])=>{
  const items = DATA.sections.filter(pred).map(s=>
    `<button class="toc-item" data-id="${s.id}"><span class="lawno">${s.law?("第"+s.law+"章"):"•"}</span> ${esc(s.title.replace(/^第.+章\s*/,""))}</button>`).join("");
  return `<div class="toc-group">${g}</div>`+items;
}).join("");

function select(id, scroll=true){
  const s = byId[id]; if(!s) return;
  cur = id;
  document.getElementById("emptyBox").style.display = "none";
  document.getElementById("secBody").style.display = "block";
  document.getElementById("secTitle").textContent = s.title;
  document.getElementById("secPages").textContent = "官方PDF页码: " + s.pages;
  document.getElementById("secHtml").innerHTML = s.html;
  document.getElementById("main").scrollTop = 0;
  document.querySelectorAll(".toc-item").forEach(x=>x.classList.toggle("on", x.dataset.id===id));
  history.replaceState(null, "", "#"+id);
  clearMarks();
  applyHl();
  loadNote();
}
function step(dir){
  if(!cur) return;
  const i = byId[cur].idx + dir;
  if(i>=0 && i<DATA.sections.length) select(DATA.sections[i].id);
}
document.getElementById("toc").addEventListener("click", e=>{
  const b = e.target.closest(".toc-item"); if(b) select(b.dataset.id);
});
document.getElementById("prevBtn").onclick = ()=>step(-1);
document.getElementById("nextBtn").onclick = ()=>step(1);

// ---------- 字号 ----------
let fs = 16;
document.getElementById("fsPlus").onclick = ()=>{ fs=Math.min(22,fs+1); document.documentElement.style.setProperty("--fs",fs+"px"); };
document.getElementById("fsMinus").onclick = ()=>{ fs=Math.max(13,fs-1); document.documentElement.style.setProperty("--fs",fs+"px"); };

// ---------- 搜索 ----------
const sb = document.getElementById("searchBox");
const fSearch = document.getElementById("fSearch");
fSearch.addEventListener("input", ()=>{
  const q = fSearch.value.trim();
  if(q.length < 2){ sb.classList.remove("open"); clearMarks(); return; }
  const hits = [];
  for (const s of DATA.sections){
    const plain = s.html.replace(/<[^>]+>/g,"");
    let i = plain.indexOf(q);
    while(i >= 0 && hits.length < 60){
      hits.push({id: s.id, title: s.title, snippet:
        (i>40?"…":"") + esc(plain.slice(Math.max(0,i-40), i+q.length+60)) + "…"});
      i = plain.indexOf(q, i+q.length);
    }
  }
  sb.innerHTML = hits.length
    ? hits.map(h=>`<button class="sr" data-id="${h.id}" data-q="${esc(q)}">
        <span class="t">${esc(h.title)}</span><br><span class="s">${h.snippet.replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"g"), m=>`<mark>${m}</mark>`)}</span></button>`).join("")
    : `<div style="padding:12px;color:var(--muted)">未找到「${esc(q)}」</div>`;
  sb.classList.add("open");
});
sb.addEventListener("click", e=>{
  const b = e.target.closest(".sr"); if(!b) return;
  select(b.dataset.id);
  sb.classList.remove("open");
  highlight(b.dataset.q);
});
function clearMarks(){
  document.querySelectorAll("#secHtml mark[data-h]").forEach(m=>{
    const p = m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize();
  });
}
function highlight(q){
  clearMarks();
  if(!q) return;
  const walker = document.createTreeWalker(document.getElementById("secHtml"), NodeFilter.SHOW_TEXT);
  const nodes = [];
  while(walker.nextNode()){
    if(walker.currentNode.textContent.toLowerCase().includes(q.toLowerCase())) nodes.push(walker.currentNode);
  }
  for (const node of nodes){
    const frag = document.createDocumentFragment();
    let text = node.textContent, lower = text.toLowerCase(), ql = q.toLowerCase();
    let pos = lower.indexOf(ql);
    while(pos >= 0){
      frag.appendChild(document.createTextNode(text.slice(0, pos)));
      const mk = document.createElement("mark"); mk.dataset.h = "1";
      mk.textContent = text.slice(pos, pos+q.length);
      frag.appendChild(mk);
      text = text.slice(pos+q.length); lower = lower.slice(pos+q.length);
      pos = lower.indexOf(ql);
    }
    frag.appendChild(document.createTextNode(text));
    node.parentNode.replaceChild(frag, node);
  }
}
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") sb.classList.remove("open");
});
document.addEventListener("click", e=>{
  if(!e.target.closest("#searchBox") && !e.target.closest("#fSearch")) sb.classList.remove("open");
});

// ---------- 划词高亮（localStorage: cfa2026rules.hl） ----------
const HL_KEY = "cfa2026rules.hl";
let hlData = [];
try { hlData = JSON.parse(localStorage.getItem(HL_KEY) || "[]") || []; } catch(_) { hlData = []; }
function saveHl(){ try { localStorage.setItem(HL_KEY, JSON.stringify(hlData)); } catch(_){} }
const secHtmlEl = document.getElementById("secHtml");
const hlBar = document.getElementById("hlBar");

document.addEventListener("mouseup", e=>{
  if(e.target.closest("#hlBar")) return;
  setTimeout(()=>{
    const sel = window.getSelection();
    const txt = sel ? sel.toString() : "";
    if(txt.trim().length >= 2 && sel.rangeCount &&
       secHtmlEl.contains(sel.getRangeAt(0).commonAncestorContainer)){
      const r = sel.getRangeAt(0).getBoundingClientRect();
      hlBar.style.display = "flex";
      hlBar.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 260)) + "px";
      hlBar.style.top = Math.max(8, r.top - 46) + "px";
    } else if (!e.target.closest("#hlBar")) {
      hlBar.style.display = "none";
    }
  }, 10);
});
hlBar.addEventListener("mousedown", e=>e.preventDefault());   // 防止点击工具条丢失选区
hlBar.addEventListener("click", e=>{
  const b = e.target.closest("button[data-c]"); if(!b) return;
  addHighlight(b.dataset.c);
});
function addHighlight(color){
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  if(!secHtmlEl.contains(range.commonAncestorContainer)) return;
  const quote = sel.toString();
  if(quote.replace(/\s+/g,"").length < 2) return;
  const ts = Date.now();
  hlData.push({sec: cur, quote, color, ts});
  saveHl();
  const walker = document.createTreeWalker(secHtmlEl, NodeFilter.SHOW_TEXT);
  const nodes = []; let n;
  while((n = walker.nextNode())){
    if(range.intersectsNode(n) && n.textContent.trim()) nodes.push(n);
  }
  for (const node of nodes){
    const t = node.textContent;
    let start = 0, end = t.length;
    if(node === range.startContainer && node.nodeType === 3) start = range.startOffset;
    if(node === range.endContainer && node.nodeType === 3) end = range.endOffset;
    if(end <= start) continue;
    const frag = document.createDocumentFragment();
    if(start > 0) frag.appendChild(document.createTextNode(t.slice(0, start)));
    const mk = document.createElement("mark");
    mk.className = "hl h" + color; mk.dataset.ts = ts;
    mk.textContent = t.slice(start, end);
    frag.appendChild(mk);
    if(end < t.length) frag.appendChild(document.createTextNode(t.slice(end)));
    node.parentNode.replaceChild(frag, node);
  }
  hlBar.style.display = "none";
  sel.removeAllRanges();
}
function applyHl(){
  const list = hlData.filter(h=>h.sec===cur);
  if(!list.length) return;
  const walker = document.createTreeWalker(secHtmlEl, NodeFilter.SHOW_TEXT);
  const nodes = []; let n;
  while((n = walker.nextNode())) nodes.push(n);
  for (const node of nodes){
    let rest = node.textContent;
    if(!rest.trim()) continue;
    let frag = null;
    while(rest.length){
      let best = null;
      for (const h of list){
        const q = h.quote.length > 80 ? h.quote.slice(0, 80) : h.quote;
        const i = rest.indexOf(q);
        if(i >= 0 && (!best || i < best.i)) best = {h, i, q};
      }
      if(!best){
        (frag = frag || document.createDocumentFragment())
          .appendChild(document.createTextNode(rest));
        break;
      }
      (frag = frag || document.createDocumentFragment())
        .appendChild(document.createTextNode(rest.slice(0, best.i)));
      const mk = document.createElement("mark");
      mk.className = "hl h" + best.h.color; mk.dataset.ts = best.h.ts;
      mk.textContent = rest.slice(best.i, best.i + best.q.length);
      frag.appendChild(mk);
      rest = rest.slice(best.i + best.q.length);
    }
    if(frag) node.parentNode.replaceChild(frag, node);
  }
}
secHtmlEl.addEventListener("click", e=>{
  const mk = e.target.closest("mark.hl"); if(!mk) return;
  const ts = mk.dataset.ts;
  if(confirm("删除这条高亮？")){
    hlData = hlData.filter(h=>String(h.ts)!==String(ts));
    saveHl();
    document.querySelectorAll(`#secHtml mark.hl[data-ts="${CSS.escape(ts)}"]`).forEach(m=>{
      const p = m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize();
    });
  }
});

// ---------- 章节笔记（localStorage: cfa2026rules.notes） ----------
const NOTE_KEY = "cfa2026rules.notes";
let secNotes = {};
try { secNotes = JSON.parse(localStorage.getItem(NOTE_KEY) || "{}") || {}; } catch(_) { secNotes = {}; }
function saveNotes(){ try { localStorage.setItem(NOTE_KEY, JSON.stringify(secNotes)); } catch(_){} }
function loadNote(){
  const ta = document.getElementById("secNote");
  ta.value = (secNotes[cur] && secNotes[cur].text) || "";
  document.getElementById("noteStat").textContent =
    (secNotes[cur] && secNotes[cur].text && secNotes[cur].text.trim()) ? "已保存" : "";
  document.getElementById("noteFlag").textContent =
    (secNotes[cur] && secNotes[cur].text && secNotes[cur].text.trim()) ? "· 有笔记" : "";
}
let noteTimer = null;
document.getElementById("secNote").addEventListener("input", ()=>{
  document.getElementById("noteStat").textContent = "正在保存…";
  clearTimeout(noteTimer);
  noteTimer = setTimeout(()=>{
    const t = document.getElementById("secNote").value;
    if(t.trim()) secNotes[cur] = {text: t, ts: Date.now()};
    else delete secNotes[cur];
    saveNotes();
    const d = new Date();
    document.getElementById("noteStat").textContent =
      "已保存 " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    loadNote();
  }, 800);
});
document.getElementById("btnExportN").onclick = ()=>{
  const blob = new Blob(
    [JSON.stringify({highlights: hlData, notes: secNotes, exported: new Date().toISOString(), app:"cfa-rules-2026"}, null, 1)],
    {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "竞赛规则-笔记与高亮.json";
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("btnImportN").onclick = ()=>document.getElementById("importFileN").click();
document.getElementById("importFileN").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      let n = 0;
      const seen = new Set(hlData.map(h=>h.sec+"|"+h.quote));
      for (const h of (d.highlights||[])) {
        if (h.sec && h.quote && !seen.has(h.sec+"|"+h.quote)) { hlData.push(h); n++; }
      }
      for (const [s, v] of Object.entries(d.notes||{})) {
        if (!secNotes[s] || (v.ts||0) > (secNotes[s].ts||0)) { secNotes[s] = v; n++; }
      }
      saveHl(); saveNotes(); applyHl(); loadNote();
      alert(`导入完成：合并了 ${n} 条记录`);
    } catch(err) { alert("导入失败：文件不是有效的导出JSON"); }
  };
  rd.readAsText(f, "utf-8");
  e.target.value = "";
});

  if(m && byId[m[1]]) select(m[1]);
  else select(DATA.sections[0].id, false); }
