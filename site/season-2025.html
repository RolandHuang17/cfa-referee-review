<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2025赛季中国足协裁判评议全集 · 新裁判教学合集</title>
<style>
:root{
  --bg:#eef2f7; --card:#fff; --ink:#1c2733; --muted:#5c6b7a; --line:#e3e9f0;
  --brand:#0b4c8c; --brand2:#1266b5;
  --red:#c0392b; --redbg:#fdeceb; --green:#1e7e34; --greenbg:#e9f6ec;
  --amber:#9a6700; --amberbg:#fff5e0; --bluebg:#eef4fb;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.7}

/* ---------- 顶栏(单行) ---------- */
.topbar{height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:linear-gradient(90deg,#0b3d73,#0b4c8c 60%,#1266b5);color:#fff;
  position:relative;z-index:40;overflow-x:auto;scrollbar-width:none}
.topbar::-webkit-scrollbar{display:none}
.topbar a.tbtn{text-decoration:none}
.topbar .tbtn.cur{background:rgba(255,255,255,.28);font-weight:700}
.topbar .brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.topbar .brand b{font-size:17px;letter-spacing:.5px}
.topbar .brand span{font-size:12.5px;color:#cfe2f5}
.topbar input[type=search]{flex:1;max-width:430px;min-width:120px;padding:7px 12px;
  border:1px solid #3a6ea8;border-radius:8px;background:rgba(255,255,255,.94);
  font-size:14px;color:var(--ink)}
.topbar select{padding:7px 8px;border:1px solid #3a6ea8;border-radius:8px;
  background:rgba(255,255,255,.94);font-size:13.5px;color:var(--ink);max-width:130px}
.tbtn{padding:7px 14px;border-radius:8px;border:1px solid #3a6ea8;cursor:pointer;
  background:rgba(255,255,255,.12);color:#e8f1fa;font-size:13.5px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.22)}
.tbtn.stat b{color:#ffd2cc}.tbtn.stat i{font-style:normal;color:#c9f0d2}

/* ---------- 三栏布局 ---------- */
.layout{display:grid;grid-template-columns:238px 336px 1fr;height:calc(100vh - 54px)}
body.sb-off .layout{grid-template-columns:0 336px 1fr}
body.sb-off .sidebar{display:none}

/* ---------- 侧栏 ---------- */
.sidebar{overflow-y:auto;background:#f8fafc;border-right:1px solid var(--line);
  padding:12px 10px 20px}
.side-h{font-size:12px;color:var(--muted);letter-spacing:1px;margin:14px 6px 6px;
  text-transform:uppercase}
.side-h:first-child{margin-top:2px}
.cat-item,.ver-item{display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  padding:7px 10px;border:none;background:none;border-radius:8px;cursor:pointer;
  font-size:13.8px;color:var(--ink);font-family:inherit}
.cat-item:hover,.ver-item:hover{background:#eef3f9}
.cat-item.on,.ver-item.on{background:var(--brand);color:#fff}
.cat-item.on small,.ver-item.on small{color:#cfe2f5}
.cat-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-item b,.ver-item b{font-weight:600;font-size:12.5px}
.cat-item small,.ver-item small{color:var(--muted);font-size:11.5px}
.ver-item .vdot{width:9px;height:9px;border-radius:50%;flex:none}
.side-link{display:block;margin:16px 6px 0;padding:8px 10px;border-radius:8px;
  background:var(--bluebg);color:var(--brand2);text-decoration:none;font-size:13px}
.side-link:hover{background:#dfeafa}
.sidebox{max-height:236px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;
  background:#fff;padding:4px}
.sidebox .cat-item{padding:5px 8px;font-size:13px}
.tav{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#e2e8f0;
  color:#475569;font-size:11px;align-items:center;justify-content:center;
  margin-right:3px;vertical-align:-4px;flex:none}
#compList .cat-item .nm, #teamList .cat-item .nm, #issueList .cat-item .nm{font-size:13px}

/* ---------- 播放列表 ---------- */
.plist{overflow-y:auto;background:#fff;border-right:1px solid var(--line)}
.plist-head{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);
  padding:8px 14px;font-size:12.5px;color:var(--muted)}
.ph{position:sticky;top:33px;z-index:4;padding:7px 14px 5px;font-size:13px;font-weight:700;
  color:var(--brand);background:#f4f8fc;border-bottom:1px solid var(--line)}
.ph b{color:var(--muted);font-weight:500;font-size:12px}
.prow{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;
  border-bottom:1px solid #f1f5f9}
.prow:hover{background:#f6f9fc}
.prow.sel{background:var(--bluebg);box-shadow:inset 3px 0 0 var(--brand2)}
.prow .dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.wrong{background:var(--red)}.dot.correct{background:#3a9d55}.dot.pending{background:#d9a514}
.prow .ptxt{flex:1;min-width:0}
.prow .ptxt b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.prow .ptxt i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .ptxt .p-source{font-family:Georgia,"Times New Roman","Noto Serif SC",serif;
  font-style:italic;font-weight:600;color:#456b92}
.prow .ptxt .p-case-id{color:#8a9bad;font-style:normal;font-weight:400}
.prow .ptxt .p-verdict{font-style:normal;font-weight:500}
.prow .rv{flex:none;font-size:11px;border-radius:5px;padding:0 6px;
  background:var(--bluebg);color:var(--brand2)}
.prow .rv.bad{background:var(--redbg);color:var(--red)}
.prow .pmark{flex:none;font-size:12px}
.crest{width:auto;border-radius:3px;vertical-align:-3px;margin-right:3px;background:#fff}
.team-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
  border-radius:4px;margin-right:3px;vertical-align:-4px;font-size:8px;font-weight:700;
  line-height:1;color:var(--badge-fg,#0b4c8c);background:var(--badge-bg,#e9f2fb)}
.plist-empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* ---------- 详情区 ---------- */
.detail{overflow-y:auto;padding:18px 24px 40px}
.detail-empty{height:70vh;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:15px}
.d-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:18px 22px;box-shadow:0 1px 3px rgba(15,40,80,.05);max-width:1080px}
.d-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:4px}
.cid{color:var(--muted);font-size:13px;background:#f1f5f9;border-radius:6px;padding:2px 10px}
.d-head .match{flex-basis:100%;margin:2px 0 0;font-size:20px;font-weight:700;line-height:1.4}
.badge{padding:3px 13px;border-radius:16px;font-size:14px;font-weight:600;white-space:nowrap}
.b-wrong{background:var(--redbg);color:var(--red);border:1px solid #f2c4bf}
.b-correct{background:var(--greenbg);color:var(--green);border:1px solid #bfe3c8}
.b-pending{background:var(--amberbg);color:var(--amber);border:1px solid #ecd9a0}
.b-var{background:var(--bluebg);color:var(--brand2);border:1px solid #c9dcf2;font-weight:500}
.b-var.bad{background:var(--redbg);color:var(--red);border-color:#f2c4bf}
.d-video{margin:14px 0 4px}
.d-video video{width:100%;aspect-ratio:16/9;background:#0d1420;border-radius:10px;display:block}
.vsw-row{display:flex;gap:8px;margin:8px 0 2px}
.vsw{padding:3px 14px;border-radius:14px;border:1px solid #cbd5e1;background:#fff;
  cursor:pointer;font-size:13px;color:var(--muted)}
.vsw.on{background:var(--brand);border-color:var(--brand);color:#fff}
.d-note{font-size:13px;color:var(--muted);margin:6px 0 0}
.txt{font-size:15.5px;margin-top:10px}
.txt .lbl{color:var(--brand);font-weight:700}
.txt p{margin:8px 0;white-space:pre-wrap}
.txt .concl{background:#f6f9fc;border-left:3px solid var(--brand2);
  padding:10px 14px;border-radius:0 8px 8px 0}
.d-note-box{margin-top:12px;font-size:14px;background:#f6f9fc;border:1px solid var(--line);
  border-radius:8px;padding:8px 14px}
.d-note-box summary{cursor:pointer;color:var(--brand);font-weight:600;user-select:none}
.d-note-box div{margin-top:6px;color:#33475b}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:12.5px;color:var(--muted);background:#f1f5f9;border-radius:5px;padding:2px 9px}
.d-foot{font-size:13px;margin-top:12px}
.d-foot a{color:var(--brand2);text-decoration:none}
.d-foot a:hover{text-decoration:underline}
.d-nav{display:flex;gap:10px;margin-top:16px}
.d-nav button{flex:1;padding:10px;border-radius:9px;border:1px solid #cbd5e1;background:#fff;
  cursor:pointer;font-size:14.5px;color:var(--ink)}
.d-nav button:hover{border-color:var(--brand2);color:var(--brand2)}
.favbtn{padding:4px 16px;border-radius:16px;border:1px solid #cbd5e1;background:#fff;
  cursor:pointer;font-size:14px;color:var(--muted)}
.favbtn.on{background:#fff7d6;border-color:#e6c34a;color:#9a6700;font-weight:700}
.favtags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.ftag{padding:3px 12px;border-radius:14px;border:1px solid #cbd5e1;background:#fff;
  cursor:pointer;font-size:13px;color:var(--muted)}
.ftag.on{background:var(--brand);border-color:var(--brand);color:#fff}
.favtags input{padding:4px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:12.5px;width:110px}
.notewrap{margin-top:14px}
.notewrap textarea{width:100%;min-height:74px;padding:10px 12px;border:1px solid #cbd5e1;
  border-radius:9px;font-size:14px;font-family:inherit;resize:vertical;background:#fffdf5}
.notewrap .nstatus{font-size:12px;color:var(--muted)}
.kbd{font-size:11.5px;color:var(--muted);border:1px solid #cbd5e1;border-bottom-width:2px;
  border-radius:4px;padding:0 5px;margin:0 2px}

/* ---------- 弹层 ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(8,20,38,.55);z-index:90;
  display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:44px 16px}
.modal-mask.open{display:flex}
.modal{background:#fff;border-radius:14px;max-width:980px;width:100%;padding:22px 26px}
.modal h3{margin:0 0 12px;font-size:18px}
.modal .close{float:right;border:none;background:#f1f5f9;color:var(--muted);
  border-radius:8px;padding:4px 12px;cursor:pointer;font-size:13px}
.matrix table{border-collapse:collapse;width:100%;font-size:13.8px}
.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix tr:hover td{background:#f6f9fc}
.matrix .w{color:var(--red);font-weight:600}.matrix .g{color:var(--green);font-weight:600}
.matrix .p{color:var(--amber);font-weight:600}
.matrix tfoot td{font-weight:700;background:#f6f9fc}
.help p{margin:8px 0;font-size:14.5px}
.help b{color:var(--brand)}
.top-btn{position:fixed;right:22px;bottom:24px;background:var(--brand);color:#fff;
  border:none;border-radius:24px;padding:9px 18px;font-size:13.5px;cursor:pointer;z-index:30}

/* ---------- 响应式 ---------- */
@media (max-width:1180px){
  .layout{grid-template-columns:250px 1fr}
  .plist{grid-column:1 / 3}
  .detail{grid-column:1 / 3}
  body.detail-open .plist{display:none}
  body.detail-open .detail{grid-column:1 / 3}
}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  body{overflow:auto}
  .layout{height:auto}
  .sidebar{position:fixed;left:0;top:54px;bottom:0;width:260px;z-index:60;
    transform:translateX(-105%);transition:.15s;box-shadow:4px 0 14px rgba(0,0,0,.15)}
  body.sb-off .sidebar{display:block;transform:none}
  body.sb-off .layout{grid-template-columns:1fr}
  .plist{max-height:46vh}
  .topbar .brand span{display:none}
}
</style>

o_urls":["https://videooss.thecfa.cn/upload/video/20250409/1744201820967917.mp4"],"category":"penalty_area","tags":["意外接触"],"v":"correct","var":"correct"},{"seq":29,"issue":6,"no":5,"comp":"中超联赛","round":"第4轮","home":"上海申花","away":"云南玉昆","minute":"77","match_info":"中超联赛第4轮，上海申花VS云南玉昆，比赛第77分钟，上海申花23号队员铲球后，脚部与云南玉昆14号队员腿部发生接触，裁判员未判罚犯规，VAR未介入","desc":"判例五：中超联赛第4轮，上海申花VS云南玉昆，比赛第77分钟，上海申花23号队员铲球后，脚部与云南玉昆14号队员腿部发生接触，裁判员未判罚犯规，VAR未介入。","appeal":"","conclusion":"对于此判罚，评议组一致认为：上海申花23号将球铲出后接触对方腿部，剐蹭对方小腿球袜及护腿板，其力度和接触程度不构成严重犯规，不应出示红牌，应视为鲁莽犯规并出示黄牌警告。裁判员临场决定错误，漏判犯规和黄牌；因不属于红牌事件，VAR未介入正确。","videos":["2025/i06c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250409/1744201873677432.mp4"],"category":"freekick_foul","tags":["黄牌","铲球","红牌不成立"],"v":"wrong","var":"correct"},{"seq":30,"issue":6,"no":6,"comp":"中超联赛","round":"第5轮","home":"上海海港","away":"上海申花","minute":"82","match_info":"中超联赛第5轮，上海海港VS上海申花，比赛第82分钟，上海申花20号队员进球，裁判员判进球有效；VAR查看进球事件，经越位划线后确认进球有效","desc":"判例六：中超联赛第5轮，上海海港VS上海申花，比赛第82分钟，上海申花20号队员进球，裁判员判进球有效；VAR查看进球事件，经越位划线后确认进球有效。","appeal":"","conclusion":"对于此判例，评议组一致认为：在查看该进球时，VAR对于攻方传球或触球一瞬间关键帧的选择准确。之后在对双方队员进行划线判定时，身体部位选择正确，划线判断结果正确。根据竞赛规则和VAR操作规范，当双方队员划线重合或守方倒数第二名队员更接近于本方球门线时，均视为攻方队员不处于越位位置。此判例中VAR操作流程符合规范，操作方法和结果均正确。针对划线画面与球员传球或触球一瞬间是否同步的社会关切，评议组做出说明：在VAR选择传球或触球一瞬间关键帧后，会切换到适合划线的画面，此过程中各个角度和机位的画面严格同步，不会改变所选关键帧。此为VAR系统的基本条件和基本功能，中超联赛使用的VAR系统在每场比赛赛前，都会进行各个机位和画面的同步测试，确认无误后才会开始比赛。此判例裁判员决定正确，VAR操作正确。","videos":["2025/i06c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250409/1744202003417904.mp4"],"category":"offside","tags":["VAR划线","进球有效"],"v":"correct","var":"correct"},{"seq":31,"issue":6,"no":7,"comp":"中乙联赛","round":"第3轮","home":"兰州陇原竞技","away":"山东泰山B队","minute":"63","match_info":"中乙联赛第3轮，兰州陇原竞技VS山东泰山B队，比赛第63分钟，兰州陇原竞技前场掷界外球至对方罚球区内，双方队员争抢后兰州陇原竞技队员倒地，裁判员未判罚犯规","desc":"判例七：中乙联赛第3轮，兰州陇原竞技VS山东泰山B队，比赛第63分钟，兰州陇原竞技前场掷界外球至对方罚球区内，双方队员争抢后兰州陇原竞技队员倒地，裁判员未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组一致认为：从现有单一机位视频看，山东泰山B队两名防守队员包夹防守对方队员，其中内侧的防守队员有可能触到了球，攻方队员的倒地 在先，当时青岛西海岸11号队员与大连英博38号队员争抢，双方倒地，裁判员未判罚犯规。VAR未介入。","appeal":"","conclusion":"对于此判例，评议组一致认为：按照竞赛规则和VAR操作手册，青岛西海岸11号的争抢并未影响大连英博38号头顶球动作，双方属于比赛中争抢球时的正常接触，双方均不犯规。之后青岛西海岸队进攻并获得罚球点球，裁判员决定正确，VAR未介入正确。","videos":["2025/i08c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250423/1745409210805602.mov"],"category":"penalty_area","tags":["点球"],"v":"correct","var":"correct"},{"seq":42,"issue":8,"no":2,"comp":"中超联赛","round":"第8轮","home":"北京国安","away":"山东泰山","minute":"37","match_info":"中超联赛第8轮，北京国安VS山东泰山，比赛第37分钟，山东泰山队19号队员在争抢中脚部接触北京国安27号队员腿部","desc":"判例二：中超联赛第8轮，北京国安VS山东泰山，比赛第37分钟，山东泰山队19号队员在争抢中脚部接触北京国安27号队员腿部。裁判员判山东泰山19号犯规并出示红牌将其罚令出场，VAR未介入。","appeal":"","conclusion":"对于此判例，评议组一致认为：山东泰山19号采用不合理的争抢动作，使用脚底蹬踩对方队员脚踝至跟腱部位，力量和强度较大，造成对方队员踝关节变形，危及对方队员安全，应视为严重犯规并出示红牌罚令出场。裁判员决定正确，VAR未介入正确。","videos":["2025/i08c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250423/1745409236969096.mov"],"category":"sfp_vc","tags":["红牌","严重犯规","蹬踩"],"v":"correct","var":"correct"},{"seq":43,"issue":8,"no":3,"comp":"中超联赛","round":"第8轮","home":"上海申花","away":"武汉三镇","minute":"65","match_info":"中超联赛第8轮，上海申花VS武汉三镇，比赛第65分钟，武汉三镇队进球，助理裁判示意越位；裁判员判武汉三镇队越位犯规在先，进球无效；VAR检查并划线后，确认越位","desc":"判例三：中超联赛第8轮，上海申花VS武汉三镇，比赛第65分钟，武汉三镇队进球，助理裁判示意越位；裁判员判武汉三镇队越位犯规在先，进球无效；VAR检查并划线后，确认越位。","appeal":"","conclusion":"对于此判例，评议组一致认为：VAR在进行越位位置查看过程中，攻方触球关键帧选择正确；在划线时，选择攻方队员的肩部、守方队员的膝部，部位选择正确，划线落位正确。VAR整个操作过程符合规范，判断结果正确。裁判员判武汉三镇队越位犯规在先、进球无效的决定正确。","videos":["2025/i08c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250423/1745409310298485.mov"],"category":"offside","tags":["VAR划线","进球无效"],"v":"correct","var":"correct"},{"seq":44,"issue":8,"no":4,"comp":"中国足协杯","round":"第2轮","home":"重庆春蕾","away":"广州豹","minute":"16","match_info":"中国足协杯赛第2轮，重庆春蕾VS广东广州豹，比赛第16分钟，广东广州豹队守门员出击并与对方进攻队员发生接触，裁判员判广东广州豹队守门员犯规并出示红牌罚令出场","desc":"判例四：中国足协杯赛第2轮，重庆春蕾VS广东广州豹，比赛第16分钟，广东广州豹队守门员出击并与对方进攻队员发生接触，裁判员判广东广州豹队守门员犯规并出示红牌罚令出场。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：广东广州豹守门员以鲁莽的方式冲撞对方进攻队员。重庆春蕾进攻队员无犯规动作。重庆春蕾进攻队员完成挑球后，从控球可能性、广东广州豹防守队员人数及位置等因素考虑，不属于明显进球得分机会，无需向广东广州豹守门员出示红牌，应以阻止对方有希望的进攻为由，判广东广州豹守门员犯规并出示黄牌警告。裁判员出示红牌的决定错误。","videos":["2025/i08c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250423/1745409358548703.mov"],"category":"spa_tactical","tags":["黄牌","DOGSO不成立","守门员"],"v":"wrong","var":"none"},{"seq":45,"issue":9,"no":1,"comp":"中超联赛","round":"第8轮","home":"上海海港","away":"成都蓉城","minute":"8","match_info":"中超联赛第8轮，上海海港VS成都蓉城，比赛第8分钟，上海海港13号队员争抢球时踩踏到成都蓉城2号队员，裁判员判罚上海海港13号犯规，并出示黄牌","desc":"判例一：中超联赛第8轮，上海海港VS成都蓉城，比赛第8分钟，上海海港13号队员争抢球时踩踏到成都蓉城2号队员，裁判员判罚上海海港13号犯规，并出示黄牌。VAR未介入。","appeal":"","conclusion":"对于此判例，评议组一致认为：上海海港13号队员在争抢球中使用鞋底踩踏到对方队员脚踝部位，犯规力度和强度中等，应视为鲁莽犯规并出示黄牌警告。裁判员决定正确，VAR未介入正确。","videos":["2025/i09c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250501/1746070918868143.mp4"],"category":"sfp_vc","tags":["黄牌","踩踏","红牌不成立"],"v":"correct","var":"correct"},{"seq":46,"issue":9,"no":2,"comp":"中超联赛","round":"第8轮","home":"上海海港","away":"成都蓉城","minute":"28","match_info":"中超联赛第8轮，上海海港VS成都蓉城，比赛第28分钟，上海海港40号队员倒地铲抢接触到成都蓉城9号队员，裁判员判罚上海海港40号犯规，并出示黄牌","desc":"判例二：中超联赛第8轮，上海海港VS成都蓉城，比赛第28分钟，上海海港40号队员倒地铲抢接触到成都蓉城9号队员，裁判员判罚上海海港40号犯规，并出示黄牌。VAR未介入。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：上海上港40号争抢时铲球动作速度力量较大且未触球，但未明显蹬踹到对方队员，双方主要接触为腿部的冲撞，应视为鲁莽犯规并出示黄牌警告。裁判员决定正确，VAR未介入正确。","videos":["2025/i09c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250501/1746070952182869.mp4"],"category":"sfp_vc","tags":["黄牌","铲球","红牌不成立"],"v":"correct","var":"correct"},{"seq":47,"issue":9,"no":3,"comp":"中超联赛","round":"第9轮","home":"云南玉昆","away":"上海海港","minute":"15","match_info":"中超联赛第9轮，云南玉昆VS上海海港，比赛第15分钟，云南玉昆进球，第一助理裁判员未判罚越位，裁判员初始决定为进球有效","desc":"判例三：中超联赛第9轮，云南玉昆VS上海海港，比赛第15分钟，云南玉昆进球，第一助理裁判员未判罚越位，裁判员初始决定为进球有效。VAR经检查并划线后，确认攻方处越位位置并进行介入，裁判员改判进球前云南玉昆25号越位犯规，进球无效。","appeal":"","conclusion":"对于此判例，评议组一致认为：VAR在进行越位位置查看过程中，攻方触球关键帧选择正确；但在划线中，在选择守方队员更靠近本方球门线的有效身体部位时，错误地把肘部作为划线的有效身体部位，造成越位划线偏差。在越位划线的操作流程中，VAR必须选择最适合划线的机位，选择正确的双方队员有效身体部位，并利用VAR系统功能，根据队员动作和身体姿态确定正确的落线位置，现场进行划线比对。此判例在VAR对有效身体部位的选择出现错误的情况下，评议组无法认定攻方队员是否处于越位位置，以及随后的进球是否有效。评议组只能判定VAR划线错误。\n另外，评议组作出说明：中超联赛使用的VAR系统功能中，仅有越位机位（该判例中VAR实际使用的机位）和球门线机位可进行划线，其他机位无法进行划线，因而VAR无法选择其他更好角度的机位进行划线。","videos":["2025/i09c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250501/1746071073480463.mp4"],"category":"offside","tags":["VAR划线错误","证据不足"],"v":"pending","var":"wrong"},{"seq":48,"issue":9,"no":4,"comp":"中超联赛","round":"第7轮","home":"青岛西海岸","away":"山东泰山","minute":"60","match_info":"中超第7轮，青岛西海岸VS山东泰山，比赛第60分钟，青岛西海岸56号队员脚部与山东泰山9号队员腿部有接触，裁判员判青岛西海岸56号犯规，无纪律处罚","desc":"判例四：中超第7轮，青岛西海岸VS山东泰山，比赛第60分钟，青岛西海岸56号队员脚部与山东泰山9号队员腿部有接触，裁判员判青岛西海岸56号犯规，无纪律处罚。VAR介入后，裁判员经在场回看，向青岛西海岸56号出示黄牌。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：青岛西海岸56号在无触球可能性的情况下，使用鞋钉踩踏对方小腿及跟腱部位，速度力量中等偏上，有意向下踩踏，应视为严重犯规并出示红牌罚令出场。裁判员最初漏判犯规及红牌，VAR介入正确，裁判员在场回看后出示黄牌的决定错误，漏判红牌。","videos":["2025/i09c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250501/1746071103523797.mp4"],"category":"sfp_vc","tags":["红牌","严重犯规","踩踏","VAR介入正确"],"v":"wrong","var":"correct"},{"seq":49,"issue":9,"no":5,"comp":"中超联赛","round":"第9轮","home":"深圳新鹏城","away":"大连英博","minute":"70","match_info":"中超联赛第9轮，深圳新鹏城VS大连英博，比赛第70分钟，深圳新鹏城27号队员与大连英博4号队员疑似发生肢体接触，大连英博4号倒地","desc":"判例五：中超联赛第9轮，深圳新鹏城VS大连英博，比赛第70分钟，深圳新鹏城27号队员与大连英博4号队员疑似发生肢体接触，大连英博4号倒地。裁判员未判罚犯规，VAR未介入。","appeal":"","conclusion":"对于此判例，评议组首先一致认为：双方队员有互相使用手臂接触对方的动作，之后深圳新鹏城27号队员挥臂接触到大连英博4号队员，现有视频无清晰证据证明该动作击打到了队员头面部，应以鲁莽犯规为由，判深圳新鹏城27号犯规并出示黄牌警告。裁判员临场决定错误，漏判犯规和黄牌。另外评议组多数成员认为：VAR未介入正确。","videos":["2025/i09c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250501/1746071137970273.mp4"],"category":"sfp_vc","tags":["黄牌","挥臂","红牌不成立"],"v":"wrong","var":"correct"},{"seq":50,"issue":9,"no":6,"comp":"中甲联赛","round":"第5轮","home":"南通支云","away":"重庆铜梁龙","minute":"71","match_info":"中甲联赛第5轮，南通支云VS重庆铜梁龙，比赛第71分钟，重庆铜梁龙38号队员与南通支云33号队员在南通支云罚球区外头球争抢时发生身体接触","desc":"判例六：中甲联赛第5轮，南通支云VS重庆铜梁龙，比赛第71分钟，重庆铜梁龙38号队员与南通支云33号队员在南通支云罚球区外头球争抢时发生身体接触。南通支云33号倒地。之后重庆铜梁龙40号队员射门进球。裁判员判进球有效。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：南通支云33号队员率先争抢到头顶球，但双方队员属于在正常争抢范围内的合理接触。重庆铜梁龙38号不属于犯规，随后的进球有效。裁判员决定正确。","videos":["2025/i09c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250501/1746071180745506.mp4"],"category":"goal_decision","tags":["争抢头球"],"v":"correct","var":"none"},{"seq":51,"issue":9,"no":7,"comp":"中甲联赛","round":"第5轮","home":"南通支云","away":"重庆铜梁龙","minute":"74","match_info":"中甲联赛第5轮，南通支云VS重庆铜梁龙，比赛第74分钟，南通支云26号进攻中向前传球给本方9号队员，第二助理裁判员示意越位，裁判员判罚越位犯规，此后重庆铜梁龙31号守门员与南通支云9号发生接触，随后南通支云37号进球","desc":"判例七：中甲联赛第5轮，南通支云VS重庆铜梁龙，比赛第74分钟，南通支云26号进攻中向前传球给本方9号队员，第二助理裁判员示意越位，裁判员判罚越位犯规，此后重庆铜梁龙31号守门员与南通支云9号发生接触，随后南通支云37号进球。裁判员最终判罚越位犯规，进球无效。南通支云俱乐部申诉意见认为应向重庆铜梁龙31号守门员出示红牌罚令出场。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：从现有视频看，南通支云26号传球时，其9号队员未处于越位位置，第二助理裁判员判断错误。裁判员判罚越位犯规后南通支云9号队员被犯规，按照竞赛规则，仍视为越位犯规在先。另外，重庆铜梁龙31号守门员不存在暴力行为或其他可出示红牌的违规行为。此判例评议组认定为：第二助理裁判员及裁判员判越位犯规的决定错误，重庆铜梁龙31号守门员不应被红牌罚令出场。在裁判员停止比赛后出现的进球不应进行讨论认定。","videos":["2025/i09c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250501/1746071224785256.mp4"],"category":"offside","tags":["越位误判"],"v":"wrong","var":"none"},{"seq":52,"issue":9,"no":8,"comp":"中甲联赛","round":"第5轮","home":"南通支云","away":"重庆铜梁龙","minute":"81","match_info":"中甲联赛第5轮，南通支云VS重庆铜梁龙，比赛第81分钟，南通支云19号队员在对方罚球区内射门，重庆铜梁龙5号队员在本方罚球区内封堵，球疑似接触其手臂后出球门线，裁判员未判罚手球犯规","desc":"判例八：中甲联赛第5轮，南通支云VS重庆铜梁龙，比赛第81分钟，南通支云19号队员在对方罚球区内射门，重庆铜梁龙5号队员在本方罚球区内封堵，球疑似接触其手臂后出球门线，裁判员未判罚手球犯规。","appeal":"","conclusion":"对于此判例，评议组一致认为：现有视频基本可以确定球未接触重庆铜梁龙5号队员张开的左手臂，但是否与右手臂有接触，以及接触的具体过程、右手臂的位置等均无法确定。裁判员和助理裁判员的观察位置和角度较好，做出的不是手球犯规的决定应予支持。","videos":["2025/i09c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250501/1746071249134000.mp4"],"category":"handball","tags":["证据不足"],"v":"correct","var":"none"},{"seq":53,"issue":9,"no":9,"comp":"中甲联赛","round":"第6轮","home":"大连鲲城","away":"南通支云","minute":"25","match_info":"中甲联赛第6轮，大连鲲城VS南通支云，比赛第25分钟，南通支云23号队员进攻中突破时在对方罚球区外与大连鲲城5号队员身体接触后倒地，裁判员未判罚犯规","desc":"判例九：中甲联赛第6轮，大连鲲城VS南通支云，比赛第25分钟，南通支云23号队员进攻中突破时在对方罚球区外与大连鲲城5号队员身体接触后倒地，裁判员未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：大连鲲城5号队员防守时的封堵动作合理，南通支云23号带球突破，双方队员距离近，大连鲲城5号无法及时改变身体姿态，双方的接触不属于犯规。裁判员未判罚犯规的决定正确。","videos":["2025/i09c09-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250501/1746071273648523.mp4"],"category":"freekick_foul","tags":["封堵合理"],"v":"correct","var":"none"},{"seq":54,"issue":9,"no":10,"comp":"中甲联赛","round":"第6轮","home":"大连鲲城","away":"南通支云","minute":"79","match_info":"中甲联赛第6轮，大连鲲城VS南通支云，比赛第79分钟，大连鲲城18号队员进攻中将球传中至对方罚球区内，南通支云5号队员头顶球，头顶球前大连鲲城17号队员疑似对其有推搡动作","desc":"判例十：中甲联赛第6轮，大连鲲城VS南通支云，比赛第79分钟，大连鲲城18号队员进攻中将球传中至对方罚球区内，南通支云5号队员头顶球，头顶球前大连鲲城17号队员疑似对其有推搡动作。之后大连鲲城30号队员进球。裁判员未判罚犯规，并判进球有效。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：大连鲲城17号明显使用手臂不合理接触南通支云5号，虽然视频中不能确定推搡力度，但对于后者起跳头顶球造成了影响，应判大连鲲城17号犯规，后续进球无效。裁判员决定错误。","videos":["2025/i09c10-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250501/1746071323857951.mp4"],"category":"goal_decision","tags":["推搡","进球无效"],"v":"wrong","var":"none"},{"seq":55,"issue":9,"no":11,"comp":"中甲联赛","round":"第6轮","home":"定南赣联","away":"广西平果","minute":"6","match_info":"中甲联赛第6轮，定南赣联vs广西平果，比赛第6分钟，定南赣联11号队员进攻中前插跑位时与广西平果7号队员发生身体接触后倒地，裁判员未判罚犯规","desc":"判例十一：中甲联赛第6轮，定南赣联vs广西平果，比赛第6分钟，定南赣联11号队员进攻中前插跑位时与广西平果7号队员发生身体接触后倒地，裁判员未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：定南赣联11号向传球方向跑动试图接球，广西平果7号对其进行拉扯犯规，由于定南赣联11号后续控球的可能性不明确，该犯规应视为阻止了对方有希望的进攻。应判罚广西平果7号犯规并出示黄牌警告。裁判员决定错误，漏判犯规和黄牌。","videos":["2025/i09c11-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250501/1746071348626470.mp4"],"category":"spa_tactical","tags":["黄牌","拉扯"],"v":"wrong","var":"none"},{"seq":56,"issue":9,"no":12,"comp":"中甲联赛","round":"第6轮","home":"定南赣联","away":"广西平果","minute":"40","match_info":"中甲联赛第6轮，定南赣联vs广西平果，比赛第40分钟，定南赣联11号队员进攻中前插至对方罚球区内，并与广西平果5号队员发生身体接触后倒地，裁判员未判罚犯规","desc":"判例十二：中甲联赛第6轮，定南赣联vs广西平果，比赛第40分钟，定南赣联11号队员进攻中前插至对方罚球区内，并与广西平果5号队员发生身体接触后倒地，裁判员未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组一致认为：双方队员具有同等的争抢球的位置和机会，守方广西平果5号率先触到球，并且无犯规动作。裁判员未判罚犯规的决定正确。","videos":["2025/i09c12-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250501/1746071390433504.mp4"],"category":"penalty_area","tags":[],"v":"correct","var":"none"},{"seq":57,"issue":9,"no":13,"comp":"中甲联赛","round":"第6轮","home":"定南赣联","away":"广西平果","minute":"43","match_info":"中甲联赛第6轮，定南赣联vs广西平果，比赛第43分钟，定南赣联进攻中将球传中至对方罚球区内，其11号队员在对方罚球区内争抢位置时，与广西平果5号队员发生身体接触后倒地，裁判员未判罚犯规","desc":"判例十三：中甲联赛第6轮，定南赣联vs广西平果，比赛第43分钟，定南赣联进攻中将球传中至对方罚球区内，其11号队员在对方罚球区内争抢位置时，与广西平果5号队员发生身体接触后倒地，裁判员未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组一致认为：双方队员在罚球区内争抢位置时，身体正常相互接触，广西平果5号卡住位置并且无明显犯规动作，也不是造成定南赣联11号倒地的主要原因。裁判员未判罚犯规的决定正确。","videos":["2025/i09c13-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250501/1746071440306264.mp4"],"category":"penalty_area","tags":[],"v":"correct","var":"none"},{"seq":58,"issue":10,"no":1,"comp":"中超联赛","round":"第10轮","home":"深圳新鹏城","away":"天津津门虎","minute":"48","match_info":"中超联赛第10轮，深圳新鹏城VS天津津门虎，比赛第48分钟，天津津门虎37号队员在对方罚球区内与深圳新鹏城20号队员发生接触后倒地，裁判员未判罚犯规","desc":"判例一：中超联赛第10轮，深圳新鹏城VS天津津门虎，比赛第48分钟，天津津门虎37号队员在对方罚球区内与深圳新鹏城20号队员发生接触后倒地，裁判员未判罚犯规。VAR未介入。","appeal":"","conclusion":"对于此判例，评议组一致认为：双方队员在向同方向移动争抢球过程中，深圳新鹏城20号有拉天津津门虎37号球衣的动作，但接触时间短，力量轻微，未明显影响后者争抢球的能力，也非后者倒地的主要原因。天津津门虎37号有借拉扯动作主动倒地的成分。裁判员未判罚犯规的决定，应予支持；VAR未介入正确。","videos":["2025/i10c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250507/1746619037302851.mp4"],"category":"penalty_area","tags":["拉扯轻微","主动倒地"],"v":"correct","var":"correct"},{"seq":59,"issue":10,"no":2,"comp":"中超联赛","round":"第10轮","home":"深圳新鹏城","away":"天津津门虎","minute":"","match_info":"中超联赛第10轮，深圳新鹏城VS天津津门虎，比赛第90+3分钟，天津津门虎9号队员在对方罚球区内与深圳新鹏城16号队员争抢球后倒地，裁判员初始判深圳新鹏城16号犯规，并判罚球点球","desc":"判例二：中超联赛第10轮，深圳新鹏城VS天津津门虎，比赛第90+3分钟，天津津门虎9号队员在对方罚球区内与深圳新鹏城16号队员争抢球后倒地，裁判员初始判深圳新鹏城16号犯规，并判罚球点球。经VAR介入，裁判员在场回看后，改判为不犯规，取消罚球点球，并以角球恢复比赛。","appeal":"","conclusion":"对于此判例，评议组首先一致认为：深圳新鹏城16号防守中的封堵和试图破坏球的动作正常，且触到了球，无其他犯规动作，不应视为犯规。裁判员在场回看后取消罚球点球的决定正确，VAR介入正确。其次评议组多数成员认为，裁判员在做出初始判罚停止比赛时，球尚未离开比赛场地，在更改判罚取消罚球点球后，不应以角球恢复比赛，应以坠球恢复比赛。","videos":["2025/i10c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250507/1746619099977333.mp4"],"category":"penalty_area","tags":["点球","VAR介入正确","坠球恢复"],"v":"correct","var":"correct"},{"seq":60,"issue":10,"no":3,"comp":"中甲联赛","round":"第7轮","home":"深圳青年人","away":"南京城市","minute":"40","match_info":"中甲联赛第7轮，深圳青年人VS南京城市，比赛第40分钟，南京城市20号队员在对方罚球区内与深圳青年人7号队员争抢后倒地，裁判员在第二助理裁判员协助下判罚攻方南京城市20号犯规，由守方深圳青年人踢直接任意球恢复比赛","desc":"判例三：中甲联赛第7轮，深圳青年人VS南京城市，比赛第40分钟，南京城市20号队员在对方罚球区内与深圳青年人7号队员争抢后倒地，裁判员在第二助理裁判员协助下判罚攻方南京城市20号犯规，由守方深圳青年人踢直接任意球恢复比赛。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：双方队员在向球跑动过程中有互相拉扯的动作，南京城市20号对深圳青年人7号的拉扯造成后者失去重心和身体平衡，之后深圳青年人7号在本方罚球区内拉倒南京城市20号，回放慢动作镜头未能完整展现双方相互拉扯的全过程，第二助理裁判员位置和视角应能够清晰看到攻方对守方的拉扯情况，在此情况下，在第二助理裁判员协助后，裁判员做出的攻方犯规的决定，应予支持。","videos":["2025/i10c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250507/1746619148951327.mp4"],"category":"penalty_area","tags":["拉扯","助理裁判协助"],"v":"correct","var":"none"},{"seq":61,"issue":10,"no":4,"comp":"中甲联赛","round":"第7轮","home":"辽宁铁人","away":"陕西联合","minute":"55","match_info":"中甲联赛第7轮，辽宁铁人vs陕西联合，比赛第55分钟，陕西联合33号队员进攻中接本方传中球，头球将球顶入对方球门，第一助理裁判员示意陕西联合33号越位，裁判员判陕西联合越位犯规在先，进球无效","desc":"判例四：中甲联赛第7轮，辽宁铁人vs陕西联合，比赛第55分钟，陕西联合33号队员进攻中接本方传中球，头球将球顶入对方球门，第一助理裁判员示意陕西联合33号越位，裁判员判陕西联合越位犯规在先，进球无效。","appeal":"","conclusion":"对于此判例，评议组一致认为：陕西联合33号在本方球员传中时明显未处于越位位置，第一助理裁判员出现明显的判断失误，裁判员判陕西联合越位犯规以及进球无效的决定错误。","videos":["2025/i10c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250507/1746619216495549.mp4"],"category":"offside","tags":["越位误判","进球无效"],"v":"wrong","var":"none"},{"seq":62,"issue":10,"no":5,"comp":"中乙联赛","round":"第7轮","home":"广东铭途","away":"广西恒宸","minute":"60","match_info":"中乙联赛第7轮，广东铭途VS广西恒宸，比赛第60分钟，广西恒宸7号队员进攻中带球突破至对方罚球区内后摔倒，裁判员判守方广东铭途5号队员犯规，判罚球点球，并向广东铭途5号出示黄牌","desc":"判例五：中乙联赛第7轮，广东铭途VS广西恒宸，比赛第60分钟，广西恒宸7号队员进攻中带球突破至对方罚球区内后摔倒，裁判员判守方广东铭途5号队员犯规，判罚球点球，并向广东铭途5号出示黄牌。","appeal":"","conclusion":"对于此判例，评议组首先一致认为：广东铭途5号有使用手臂接触广西恒宸7号的动作，但接触较轻微，未影响后者继续前进和带球，不应视为犯规。广西恒宸7号有夸大接触和主动倒地的成分。其次评议组多数成员认为：广东铭途5号有对对方实施手部接触，无需判广西恒宸7号佯装（假摔）以及对其出示黄牌。裁判员判广东铭途5号犯规、判罚球点球以及出示黄牌的决定均为错误。","videos":["2025/i10c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250507/1746619259181682.mp4"],"category":"simulation","tags":["点球","黄牌","假摔"],"v":"wrong","var":"none"},{"seq":63,"issue":10,"no":6,"comp":"中乙联赛","round":"第7轮","home":"贵州筑城竞技","away":"广州蒲公英","minute":"67","match_info":"中乙联赛第7轮，贵州筑城竞技VS广州蒲公英，比赛第67分钟，贵州筑城竞技49号队员进攻中带球突破至对方罚球区，与广州蒲公英20号、47号队员争抢后倒地，裁判员判广州蒲公英队防守犯规，并判罚球点球","desc":"判例六：中乙联赛第7轮，贵州筑城竞技VS广州蒲公英，比赛第67分钟，贵州筑城竞技49号队员进攻中带球突破至对方罚球区，与广州蒲公英20号、47号队员争抢后倒地，裁判员判广州蒲公英队防守犯规，并判罚球点球。","appeal":"","conclusion":"对于此判例，评议组多数成员认为：广州蒲公英20号、47号队员夹防对方队员时未能及时占据有利位置，现有视频无法清晰展现双方队员接触情况，但在贵州筑城竞技49号突破时，广州蒲公英队员对其有挤靠和绊摔动作，裁判员的观察位置较好，做出的守方犯规和判罚球点球的决定，应予支持。","videos":["2025/i10c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250507/1746619306268115.mp4"],"category":"penalty_area","tags":["点球","绊摔"],"v":"correct","var":"none"},{"seq":64,"issue":10,"no":7,"comp":"中乙联赛","round":"第7轮","home":"贵州筑城竞技","away":"广州蒲公英","minute":"72","match_info":"中乙联赛第7轮，贵州筑城竞技VS广州蒲公英，比赛第72分钟，广州蒲公英43号队员在对方罚球区内试图处理高空球时，贵州筑城竞技17号队员与其有接触，广州蒲公英43号倒地，裁判员未判罚犯规","desc":"判例七：中乙联赛第7轮，贵州筑城竞技VS广州蒲公英，比赛第72分钟，广州蒲公英43号队员在对方罚球区内试图处理高空球时，贵州筑城竞技17号队员与其有接触，广州蒲公英43号倒地，裁判员未判罚犯规。","appeal":"","conclusion":"对于此判例，评议组首先一致认为：球从高处下落时，处于广州蒲公英43号的控制范围，贵州筑城竞技17号从背后冲撞广州蒲公英43号，应视为犯规，并判罚球点球。其次评议组多数成员认为：贵州筑城竞技17号在争抢时膝关节抬起，从背后冲撞对方队员，未顾及可能对对方造成的危险，应视为鲁莽犯规并出示黄牌警告。裁判员决定错误，漏判守方犯规、罚球点球和黄牌。","videos":["2025/i10c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250507/1746619330606836.mp4"],"category":"penalty_area","tags":["点球","黄牌","背后冲撞"],"v":"wrong","var":"none"},{"seq":65,"issue":11,"no":1,"comp":"中超联赛","round":"第11轮","home":"梅州客家","away":"上海申花","minute":"45","match_info":"中超联赛第11轮，梅州客家VS上海申花，比赛第45分钟，梅州客家10号队员进攻中在对方罚球区内传球，球疑似接触上海申花5号队员手臂，裁判员未判罚手球犯规","desc":"判例一：中超联赛第11轮，梅州客家VS上海申花，比赛第45分钟，梅州客家10号队员进攻中在对方罚球区内传球，球疑似接触上海申花5号队员手臂，裁判员未判罚手球犯规。VAR未介入。","appeal":"","conclusion":"对于此判例，评议组首先一致认为：视频中无法清晰证明球是否与上海申花5号手臂有接触。其次评议组多数成员认为，即使球与上海申花5号手臂有接触，但由于其手臂已经张开 7号队员主动做出后仰试图争抢球的动作，其倒地并非对方队员拉扯造成，仅从现有视频来看，未呈现出守方有犯规动作的清晰证据。双方队员的第二次接触中，视频中未清晰展现双方队员接触的情况，石家庄功夫33号队员上前防守时腿部先到达位置，无附加犯规动作，南京城市39号队员试图带球突破时造成双方接触。在该判例的两次接触中，裁判员做出的不犯规的决定，应予支持。","videos":["2025/i13c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250604/1749044085663629.mp4"],"category":"penalty_area","tags":[],"v":"correct","var":"none"},{"seq":82,"issue":13,"no":2,"comp":"中甲联赛","round":"第11轮","home":"南京城市","away":"广州豹","minute":"7","match_info":"中甲联赛第11轮，南京城市VS广东广州豹，比赛第7分钟，南京城市10号队员进球，助理裁判员举旗示意越位，裁判员判南京城市10号越位犯规在先，进球无效","desc":"判例二：中甲联赛第11轮，南京城市VS广东广州豹，比赛第7分钟，南京城市10号队员进球，助理裁判员举旗示意越位，裁判员判南京城市10号越位犯规在先，进球无效。","appeal":"南京城市俱乐部申诉意见认为：本队10号队员在同队队员传球时不处在越位位置，进球应有效。","conclusion":"对于此判例，评议组一致认为：从现有视频角度来看，在南京城市队员传球的瞬间，守方广东广州豹倒数第二名队员较之攻方队员更接近本方球门线，南京城市10号队员不处于越位位置。助理裁判员举旗示意越位，以及裁判员判罚越位犯规的决定均为错误。","videos":["2025/i13c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250604/1749044152987029.mp4"],"category":"offside","tags":["越位误判","进球无效"],"v":"wrong","var":"none"},{"seq":83,"issue":13,"no":3,"comp":"中甲联赛","round":"第11轮","home":"南通支云","away":"定南赣联","minute":"","match_info":"中甲联赛第11轮，南通支云VS定南赣联，比赛第45+2分钟，定南赣联11号队员与南通支云5号队员在南通支云罚球区内争抢球后，定南赣联11号倒地，裁判员判守方犯规并判罚球点球","desc":"判例三：中甲联赛第11轮，南通支云VS定南赣联，比赛第45+2分钟，定南赣联11号队员与南通支云5号队员在南通支云罚球区内争抢球后，定南赣联11号倒地，裁判员判守方犯规并判罚球点球。","appeal":"南通支云俱乐部申诉意见认为：本方防守队员不犯规，不应判罚球点球。","conclusion":"对于此判罚，评议组一致认为：守方南通支云5号队员先占据争抢球的有利位置，攻方定南赣联11号试图继续争抢球，手部对对方有接触，在定南赣联11号腾空和落地过程中双方可能有接触，南通支云5号无明显的可视为犯规的动作。双方的争抢属于比赛中的正常接触，双方均不犯规。裁判员判守方犯规以及罚球点球的决定均为错误。","videos":["2025/i13c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250604/1749044197496624.mp4"],"category":"penalty_area","tags":["点球","正常接触"],"v":"wrong","var":"none"},{"seq":84,"issue":13,"no":4,"comp":"全运会","round":"第一轮","home":"四川","away":"湖北","minute":"56","match_info":"中华人民共和国第十五届运动会，女子足球U16组决赛阶段第一轮，四川VS湖北，比赛第56分钟，四川队38号队员在对方罚球区线附近，被湖北队8号队员犯规，裁判员判湖北队犯规并因犯规地点在罚球区外而判直接任意球","desc":"判例四：中华人民共和国第十五届运动会，女子足球U16组决赛阶段第一轮，四川VS湖北，比赛第56分钟，四川队38号队员在对方罚球区线附近，被湖北队8号队员犯规，裁判员判湖北队犯规并因犯规地点在罚球区外而判直接任意球。","appeal":"四川队申诉意见认为：该犯规地点在湖北队罚球区内，应判罚球点球。","conclusion":"对于此判例，评议组首先一致认为：湖北队8号队员对对方队员实施草率的绊摔，应判罚犯规。其次评议组多数成员认为：双方腿部的接触是主要的犯规接触点，现有视频的角度无法绝对证明接触点是否处于罚球区内或罚球区线上（线上也视为罚球区内），裁判员认为犯规地点处于罚球区外，并判罚直接任意球的决定，应予支持。","videos":["2025/i13c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250604/1749044264675969.mp4"],"category":"penalty_area","tags":["地点判定","直接任意球"],"v":"correct","var":"none"},{"seq":85,"issue":14,"no":1,"comp":"中超联赛","round":"第14轮","home":"浙江俱乐部绿城","away":"上海海港","minute":"","match_info":"中超联赛第14轮，浙江俱乐部VS上海海港，比赛第90+1分钟，浙江队进球，裁判员初始决定为进球有效","desc":"判例一：中超联赛第14轮，浙江俱乐部VS上海海港，比赛第90+1分钟，浙江队进球，裁判员初始决定为进球有效。VAR介入，裁判员经在场回看后，判进球前浙江队7号队员对上海海港32号队员犯规在先，取消进球，并以守方在犯规地点踢直接任意球恢复比赛。","appeal":"浙江俱乐部申诉意见认为：双方争抢未对本次进攻产生影响，VAR介入有误，进球应有效。","conclusion":"对于此判例，评议组多数成员认为：攻方违规行为发生时，比赛尚未恢复（未踢出角球），不属于VAR可介入的进攻发展阶段范畴。裁判员在比赛恢复前未做出管理。比赛恢复后（踢出角球后）攻方无违规行为，进球应有效。VAR介入错误（对不可介入时段的事件进行了介入），裁判员在场回看后取消进球的决定错误。","videos":["2025/i14c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250618/1750259235266578.mov"],"category":"goal_decision","tags":["VAR介入错误","进球有效","比赛恢复前"],"v":"wrong","var":"wrong"},{"seq":86,"issue":14,"no":2,"comp":"中超联赛","round":"第14轮","home":"河南俱乐部","away":"成都蓉城","minute":"13","match_info":"中超联赛第14轮，河南俱乐部VS成都蓉城，比赛第13分钟，河南俱乐部10号队员进攻中在对方罚球区内与成都蓉城26号队员接触后倒地","desc":"判例二：中超联赛第14轮，河南俱乐部VS成都蓉城，比赛第13分钟，河南俱乐部10号队员进攻中在对方罚球区内与成都蓉城26号队员接触后倒地。裁判员判罚球点球，并向成都蓉城26号出示黄牌。VAR未介入。","appeal":"成都蓉城俱乐部申诉意见认为：本方防守队员不犯规，不应被判罚球点球。","conclusion":"对于此判例，评议组一致认为：成都蓉城26号队员在争抢球时踢倒河南俱乐部10号队员，属于草率犯规，裁判员判罚球点球的主要决定正确，VAR未介入正确。另外评议组指出：该犯规未达到鲁莽的严重程度，从防守队员的人数、位置等因素来看，也不属于破坏明显进球得分机会的犯规，因此在判罚球点球的同时，无需出示红黄牌。","videos":["2025/i14c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250618/1750259268507012.mov"],"category":"penalty_area","tags":["点球","无需红黄牌"],"v":"correct","var":"correct"},{"seq":87,"issue":14,"no":3,"comp":"中超联赛","round":"第14轮","home":"河南俱乐部","away":"成都蓉城","minute":"27","match_info":"中超联赛第14轮，河南俱乐部VS成都蓉城，比赛第27分钟，河南队进球，裁判员判进球有效","desc":"判例三：中超联赛第14轮，河南俱乐部VS成都蓉城，比赛第27分钟，河南队进球，裁判员判进球有效。VAR未介入。","appeal":"成都蓉城俱乐部申诉意见认为：对方在边路接球并头顶球的11号队员越位犯规在先，后续进球应无效。","conclusion":"对于此判例，评议组一致认为：VAR查看进球事件时，对河南俱乐部11号队员是否处于越位位置进行了画线检查，从传球触球关键帧的确认，到攻防双方队员身体部位的选择，以及落线和画线比对等流程，均操作正确，判断结果正确。河南俱乐部11号不越位，裁判员判后续进球有效的决定正确，VAR查看进球后未介入正确。","videos":["2025/i14c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250618/1750259338574640.mov"],"category":"offside","tags":["VAR划线","进球有效"],"v":"correct","var":"correct"},{"seq":88,"issue":14,"no":4,"comp":"中超联赛","round":"第14轮","home":"河南俱乐部","away":"成都蓉城","minute":"39","match_info":"中超联赛第14轮，河南俱乐部VS成都蓉城，比赛第39分钟，河南队23号队员防守时对成都蓉城9号队员犯规，裁判员向河南队23号出示黄牌","desc":"判例四：中超联赛第14轮，河南俱乐部VS成都蓉城，比赛第39分钟，河南队23号队员防守时对成都蓉城9号队员犯规，裁判员向河南队23号出示黄牌。VAR未介入。","appeal":"成都蓉城俱乐部申诉意见认为：本方9号队员已经形成明显单刀机会，对方犯规队员应被出示红牌罚令出场。","conclusion":"对于此判例，评议组一致认为：综合考量河南队23号队员犯规时，犯规地点距球门的距离，以及其他防守队员的位置和可能起到的防守作用，该犯规不符合破坏明显进球得分机会的判断标准，应视为阻止有希望的进攻的犯规并出示黄牌。裁判员判河南队23号犯规并向其出示黄牌警告的决定正确，VAR未介入正确。","videos":["2025/i14c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250618/1750259367588925.mov"],"category":"spa_tactical","tags":["黄牌","DOGSO不成立"],"v":"correct","var":"correct"},{"seq":89,"issue":14,"no":5,"comp":"中甲联赛","round":"第12轮","home":"广西平果","away":"南通支云","minute":"51","match_info":"中甲联赛第12轮，广西平果VS南通支云，比赛第51分钟，广西平果45号队员在本方罚球区内封挡对方射门时手臂触球，经助理裁判员协助后，裁判员判广西平果45号手球犯规，并判罚球点球","desc":"判例五：中甲联赛第12轮，广西平果VS南通支云，比赛第51分钟，广西平果45号队员在本方罚球区内封挡对方射门时手臂触球，经助理裁判员协助后，裁判员判广西平果45号手球犯规，并判罚球点球。","appeal":"广西平果俱乐部申诉意见认为：本方队员手臂处于自然位置，不应被判罚手球犯规和罚球点球。","conclusion":"对于此判例，评议组一致认为：广西平果45号队员封堵对方射门，手臂触球时处于使身体不自然扩大的位置，应判手球犯规。另外，该手球犯规阻止了对方有希望的进攻（射门），但不属于故意手球（手向球移动），按照竞赛规则，判罚球点球的同时，无需出示红黄牌。裁判员在经助理裁判员协助后，判广西平果45号手球犯规并判罚球点球的决定正确。","videos":["2025/i14c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250618/1750259415140778.mov"],"category":"handball","tags":["点球","无需红黄牌"],"v":"correct","var":"none"},{"seq":90,"issue":14,"no":6,"comp":"中甲联赛","round":"第12轮","home":"广西平果","away":"南通支云","minute":"55","match_info":"中甲联赛第12轮，广西平果VS南通支云，比赛第55分钟，广西平果8号队员在对方罚球区内与对方队员争抢球后倒地，裁判员未判罚犯规","desc":"判例六：中甲联赛第12轮，广西平果VS南通支云，比赛第55分钟，广西平果8号队员在对方罚球区内与对方队员争抢球后倒地，裁判员未判罚犯规。","appeal":"广西平果俱乐部申诉意见认为：对方队员争抢球时犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：现有视频无法清晰展现双方队员争抢时的接触情况、触球情况以及守方队员是否有犯规动作发生，支持裁判员临场做出的未判罚犯规的决定。","videos":["2025/i14c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250618/1750259442540200.mov"],"category":"penalty_area","tags":["证据不足"],"v":"correct","var":"none"},{"seq":91,"issue":14,"no":7,"comp":"中甲联赛","round":"第12轮","home":"广州豹","away":"苏州东吴","minute":"60","match_info":"中甲联赛第12轮，广东广州豹VS苏州东吴，比赛第60分钟，广东广州豹球员在对方罚球区内倒钩射门，苏州东吴5号队员封堵时手臂触球，裁判员判苏州东吴5号手球犯规并判罚球点球","desc":"判例七：中甲联赛第12轮，广东广州豹VS苏州东吴，比赛第60分钟，广东广州豹球员在对方罚球区内倒钩射门，苏州东吴5号队员封堵时手臂触球，裁判员判苏州东吴5号手球犯规并判罚球点球。","appeal":"苏州东吴俱乐部申诉意见认为：球接触本方队员脸部后变向反弹接触手臂，本方不应被判手球犯规和罚球点球。","conclusion":"对于此判例，评议组多数成员认为：苏州东吴5号队员封堵对方射门时，球接触其脸部后反弹接触其手臂。手臂的位置并非此动作下的合理位置，队员将手臂抬起置于此位置，冒了手臂被球击中的风险，使身体不自然扩大，应判罚手球犯规。另外，该手球犯规阻止了对方有希望的进攻（射门），但不属于故意手球（手向球移动），按照竞赛规则，判罚球点球的同时，无需出示红黄牌。裁判员判苏州东吴5号手球犯规并判罚球点球的决定正确。","videos":["2025/i14c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250618/1750259488664641.mov"],"category":"handball","tags":["点球","手臂不自然扩大"],"v":"correct","var":"none"},{"seq":92,"issue":14,"no":8,"comp":"中乙联赛","round":"第13轮","home":"江西庐山","away":"杭州临平吴越","minute":"16","match_info":"中乙联赛第13轮，江西庐山VS杭州临平吴越，比赛第16分钟，杭州临平吴越29号队员进球，裁判员经与助理裁判员和第四官员商议后，判进球有效","desc":"判例八：中乙联赛第13轮，江西庐山VS杭州临平吴越，比赛第16分钟，杭州临平吴越29号队员进球，裁判员经与助理裁判员和第四官员商议后，判进球有效。","appeal":"江西庐山俱乐部申诉意见认为：对方队员使用手臂进球，进球应无效。","conclusion":"对于此判例，评议组一致认为：现有视频的角度，无法证明球是否与杭州临平吴越29号队员手臂有接触，支持和尊重裁判员做出的进球有效的决定。","videos":["2025/i14c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250618/1750259532691027.mov"],"category":"handball","tags":["证据不足"],"v":"correct","var":"none"},{"seq":93,"issue":14,"no":9,"comp":"女超联赛","round":"第9轮","home":"上海农商银行女足","away":"江苏无锡女足","minute":"74","match_info":"女超联赛第9轮，上海农商银行女足VS江苏无锡女足，比赛第74分钟，上海农商银行女足16号队员在对方罚球区内带球转身突破，与对方队员发生 deos":["2025/i19c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250724/1753318047675098.mp4"],"category":"offside","tags":["进球有效"],"v":"correct","var":"none"},{"seq":135,"issue":19,"no":5,"comp":"中乙联赛","round":"第20轮","home":"兰州陇原竞技","away":"山西崇德荣海","minute":"68","match_info":"中乙联赛第20轮，兰州陇原竞技VS山西崇德荣海，比赛第68分钟，山西崇德荣海36号队员在本方罚球区疑似手球，裁判员未判罚手球犯规","desc":"判例五：中乙联赛第20轮，兰州陇原竞技VS山西崇德荣海，比赛第68分钟，山西崇德荣海36号队员在本方罚球区疑似手球，裁判员未判罚手球犯规。","appeal":"兰州陇原竞技俱乐部申诉意见认为：对方队员手球犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：山西崇德荣海36号队员手臂展开使身体不自然变大，在对方队员头顶球后未及时回收躲避，其手臂接触球应视为手球犯规，并判罚球点球。裁判员决定错误，漏判手球犯规和罚球点球。","videos":["2025/i19c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250724/1753318083665752.mp4"],"category":"handball","tags":["点球","手臂不自然扩大"],"v":"wrong","var":"none"},{"seq":136,"issue":19,"no":6,"comp":"中乙联赛","round":"第20轮","home":"无锡吴钩","away":"长春喜都","minute":"32","match_info":"中乙联赛第20轮，无锡吴钩VS长春喜都，比赛第32分钟，无锡吴钩30号队员在对方罚球区内争抢位置时与长春喜都29号队员接触后倒地，裁判员未判罚犯规","desc":"判例六：中乙联赛第20轮，无锡吴钩VS长春喜都，比赛第32分钟，无锡吴钩30号队员在对方罚球区内争抢位置时与长春喜都29号队员接触后倒地，裁判员未判罚犯规。","appeal":"无锡吴钩俱乐部申诉意见认为：对方29号队员拉扯抱摔本队30号队员，应判罚球点球。","conclusion":"对于此判例，评议组多数成员认为：长春喜都29号队员在本方罚球区内防守对方30号队员时，进行了持续的环抱和拉扯并造成后者倒地，不属于正常争抢位置的防守动作，应视为拉扯犯规并判罚球点球。裁判员决定错误，漏判犯规和罚球点球。","videos":["2025/i19c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250724/1753318122660478.mp4"],"category":"penalty_area","tags":["点球","拉扯","抱拽"],"v":"wrong","var":"none"},{"seq":137,"issue":19,"no":7,"comp":"女超联赛","round":"第11轮","home":"河南万仙山女足","away":"广东省女足","minute":"26","match_info":"女超联赛第11轮，河南万仙山女足VS广东省女足，比赛第26分钟，河南万仙山女足29号队员在对方罚球区内接球，广东队17号队员倒地铲球，河南队29号倒地，裁判员判广东队17号犯规，并判罚球点球","desc":"判例七：女超联赛第11轮，河南万仙山女足VS广东省女足，比赛第26分钟，河南万仙山女足29号队员在对方罚球区内接球，广东队17号队员倒地铲球，河南队29号倒地，裁判员判广东队17号犯规，并判罚球点球。","appeal":"广东省女足申诉意见认为：本队队员不犯规，裁判员错判罚球点球。","conclusion":"对于此判例，评议组一致认为：虽然河南万仙山女足29号队员接球时率先触球，但球仍处于对方可争抢的范围内，广东省女足17号队员防守时的铲球动作合理，先触到球后因惯性接触攻方队员，且无附加犯规动作，不构成犯规。裁判员决定错误，错判罚球点球。","videos":["2025/i19c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250724/1753318157540849.mp4"],"category":"penalty_area","tags":["点球","铲球先触球"],"v":"wrong","var":"none"},{"seq":138,"issue":20,"no":1,"comp":"中超联赛","round":"第18轮","home":"上海申花","away":"河南俱乐部","minute":"","match_info":"中超联赛第18轮，上海申花VS河南俱乐部酒祖杜康，比赛第45+7分钟，上海申花队进球，进球前上海申花9号队员疑似手臂触球","desc":"判例一：中超联赛第18轮，上海申花VS河南俱乐部酒祖杜康，比赛第45+7分钟，上海申花队进球，进球前上海申花9号队员疑似手臂触球。裁判员判进球有效，VAR未介入。","appeal":"河南俱乐部申诉意见认为：对方9号队员手球犯规在先，后续进球应无效。","conclusion":"对于此判例，评议组一致认为：上海申花9号队员手臂触球，但属于手臂在自然位置的意外手球，随后上海申花同队队员进球，而非手球队员立即进球，按照竞赛规则，不构成手球犯规，后续进球有效。裁判员决定正确。VAR未介入正确。","videos":["2025/i20c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250730/1.mp4"],"category":"handball","tags":["进球有效","意外手球"],"v":"correct","var":"correct"},{"seq":139,"issue":20,"no":2,"comp":"中超联赛","round":"第18轮","home":"上海申花","away":"河南俱乐部","minute":"","match_info":"中超联赛第18轮，上海申花VS河南俱乐部酒祖杜康，比赛第90+8分钟，河南俱乐部酒祖杜康队踢出角球后，助理裁判员示意球的整体已离开比赛场地（出界），裁判员鸣哨停止比赛，之后河南队队员将球踢进对方球门","desc":"判例二：中超联赛第18轮，上海申花VS河南俱乐部酒祖杜康，比赛第90+8分钟，河南俱乐部酒祖杜康队踢出角球后，助理裁判员示意球的整体已离开比赛场地（出界），裁判员鸣哨停止比赛，之后河南队队员将球踢进对方球门。","appeal":"河南俱乐部申诉意见认为：本队踢出的角球并未出界，助理裁判员举旗以及裁判员停止比赛的时机不正确，导致本队随后获得射门得分机会后，VAR无法介入。","conclusion":"对于此判例，评议组首先一致认为：从VAR视频镜头看，角球踢出后，球的整体已经在空中越过球门线离开比赛场地（出界），在此判例的判罚结果认定上，助理裁判员判断正确，裁判员决定正确，后续进球无效，VAR无需介入。另外，评议组指出：在类似情况下，助理裁判员应延迟举旗示意，裁判员应延迟鸣哨停止比赛，以便在VAR查看中如果发现出现清晰明显错误时可以介入。","videos":["2025/i20c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250730/2.mp4"],"category":"goal_decision","tags":["出界判定","延迟举旗提示"],"v":"correct","var":"correct"},{"seq":140,"issue":20,"no":3,"comp":"中超联赛","round":"第18轮","home":"上海申花","away":"河南俱乐部","minute":"","match_info":"中超联赛第18轮，上海申花VS河南俱乐部酒祖杜康，比赛第45+1分钟，上海申花13号队员在本方罚球区线附近对对方11号队员犯规，裁判员初始决定认为犯规地点在罚球区外，判直接任意球","desc":"判例三：中超联赛第18轮，上海申花VS河南俱乐部酒祖杜康，比赛第45+1分钟，上海申花13号队员在本方罚球区线附近对对方11号队员犯规，裁判员初始决定认为犯规地点在罚球区外，判直接任意球。VAR查看后认为犯规地点在罚球区内，并介入，裁判员直接改判为罚球点球。","appeal":"","conclusion":"此判例无俱乐部申诉，但围绕是否犯规、犯规地点是否在罚球区内、裁判员没有现场回看而作出处罚是否合规等引起较多关注，故评议组评议解读此判例。\n对于此判例，评议组多数成员认为：上海申花13号队员的动作构成犯规，且认为犯规地点在本方罚球区内（按照竞赛规则，罚球区线也视为罚球区内）。VAR查看后认为，裁判员对犯规地点的客观事实认定错误，应该介入。此类情况下，按照竞赛规则以及VAR操作规范的有关规定，在VAR介入后，裁判员可以不执行在场回看，而根据VAR回看分析提供的结果直接作出最终决定。此判例裁判员改判罚球点球的决定正确，VAR介入正确。\n另外，评议组指出：即使裁判员未进行在场回看，也应在做出最终决定前做出“电视示意信号”手势，以示意该最终决定是由VAR回看分析后做出的。此判例中裁判员遗漏了该手势。","videos":["2025/i20c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250730/3.mp4"],"category":"penalty_area","tags":["点球","地点判定","VAR介入正确","电视手势遗漏"],"v":"correct","var":"correct"},{"seq":141,"issue":20,"no":4,"comp":"中甲联赛","round":"第18轮","home":"南通支云","away":"南京城市","minute":"24","match_info":"中甲联赛第18轮，南通支云VS南京城市，比赛第24分钟，南京城市队踢出角球后，南京城市队员与南通支云守门员有身体接触，随后球进门，裁判员判罚南京城市队员对对方守门员犯规在先，进球无效","desc":"判例四：中甲联赛第18轮，南通支云VS南京城市，比赛第24分钟，南京城市队踢出角球后，南京城市队员与南通支云守门员有身体接触，随后球进门，裁判员判罚南京城市队员对对方守门员犯规在先，进球无效。","appeal":"南京城市俱乐部申诉意见认为：本队不犯规，进球应有效。","conclusion":"对于此判例，评议组一致认为：角球踢出时，南京城市队员与对方守门员尚有一定距离，且背对守门员，做出正常争抢球的动作。南通支云守门员向斜上方跳起争抢球，双方接触不属于犯规，后续进球有效。裁判员判攻方犯规、进球无效的决定均为错误。","videos":["2025/i20c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250730/4.mp4"],"category":"goal_decision","tags":["进球有效","守门员"],"v":"wrong","var":"none"},{"seq":142,"issue":20,"no":5,"comp":"中甲联赛","round":"第18轮","home":"南通支云","away":"南京城市","minute":"","match_info":"中甲联赛第18轮，南通支云VS南京城市，比赛第90+5分钟，南京城市19号队员对南通支云10号队员犯规，后者随后有试图击打前者的动作，裁判员以非体育行为为由对南通支云10号出示黄牌警告","desc":"判例五：中甲联赛第18轮，南通支云VS南京城市，比赛第90+5分钟，南京城市19号队员对南通支云10号队员犯规，后者随后有试图击打前者的动作，裁判员以非体育行为为由对南通支云10号出示黄牌警告。","appeal":"南京城市俱乐部申诉意见认为：对方10号队员故意用手击打本方队员面部，属于暴力行为，应被红牌罚令出场。","conclusion":"对于此判例，评议组多数成员认为：南通支云10号队员被犯规后，企图击打对方队员，属于野蛮动作，按照竞赛规则，无论是否击打到对方队员，均应被视为暴力行为并被出示红牌罚令出场。另外，评议组指出：南京城市19号队员的犯规动作应以非体育行为为由予以黄牌警告。裁判员决定错误，漏判南京城市19号黄牌，漏判南通支云10号红牌。","videos":["2025/i20c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250730/5.mp4"],"category":"sfp_vc","tags":["红牌","暴力行为","黄牌"],"v":"wrong","var":"none"},{"seq":143,"issue":20,"no":6,"comp":"中乙联赛","round":"第21轮","home":"杭州临平吴越","away":"无锡吴钩","minute":"","match_info":"中乙联赛第21轮，杭州临平吴越VS无锡吴钩，比赛第90+4分钟，杭州临平吴越队员进攻中下底传中，同队队员头球进球，助理裁判员示意传中过程中球的整体已离开比赛场地（出界），裁判员判进球无效","desc":"判例六：中乙联赛第21轮，杭州临平吴越VS无锡吴钩，比赛第90+4分钟，杭州临平吴越队员进攻中下底传中，同队队员头球进球，助理裁判员示意传中过程中球的整体已离开比赛场地（出界），裁判员判进球无效。","appeal":"杭州临平吴越俱乐部申诉意见认为：本方传中时球并未出界，后续进球应有效。","conclusion":"对于此判例，评议组一致认为：现有视频角度无法证明球在空中运行过程中是否已经整体离开比赛场地（出界），助理裁判员在此时并未完全到达球门线齐平位置，做出的判断无说服力，评议组对此判例不予认定和评议。","videos":["2025/i20c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250730/6.mp4"],"category":"goal_decision","tags":["出界判定","证据不足","延迟举旗提示"],"v":"pending","var":"none"},{"seq":144,"issue":20,"no":7,"comp":"中乙联赛","round":"第21轮","home":"湖北青年星","away":"江西庐山","minute":"74","match_info":"中乙联赛第21轮，湖北青年星VS江西庐山，比赛第74分钟，湖北青年星46号队员与江西庐山29号队员在争抢球过程中发生身体接触","desc":"判例七：中乙联赛第21轮，湖北青年星VS江西庐山，比赛第74分钟，湖北青年星46号队员与江西庐山29号队员在争抢球过程中发生身体接触。随后湖北青年星46号倒地，疑似被江西庐山29号踩踏，裁判员判江西庐山29号犯规，未出示红黄牌。","appeal":"湖北青年星俱乐部申诉意见认为：对方29号队员对本方46号队员有踩踏动作，属于暴力行为，应被出示红牌罚令出场。","conclusion":"对于此判例，评议组一致认为：现有视频的角度和距离，对于双方接触后落地的情况展现不清晰，不能证明江西庐山29号队员在犯规后有恶意或故意的踩踏动作或明显的附加动作。对裁判员未出示红黄牌的决定应予支持。","videos":["2025/i20c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250730/7.mp4"],"category":"sfp_vc","tags":["红牌不成立","踩踏不成立"],"v":"correct","var":"none"},{"seq":145,"issue":20,"no":8,"comp":"中乙联赛","round":"第21轮","home":"湖北青年星","away":"江西庐山","minute":"","match_info":"中乙联赛第21轮，湖北青年星VS江西庐山，比赛第90+7分钟，湖北青年星3号队员在本方罚球区内防守江西庐山队4号队员时，后者倒地，裁判员判湖北青年星3号犯规并判罚球点球","desc":"判例八：中乙联赛第21轮，湖北青年星VS江西庐山，比赛第90+7分钟，湖北青年星3号队员在本方罚球区内防守江西庐山队4号队员时，后者倒地，裁判员判湖北青年星3号犯规并判罚球点球。","appeal":"湖北青年星俱乐部申诉意见认为：本方队员不犯规，不应被判罚球点球。","conclusion":"对于此判例，评议组一致认为：湖北青年星3号队员防守时与对方接触的力量和幅度有限，并非江西庐山队4号队员倒地的主要原因，属于比赛中可接受的接触，江西庐山队4号队员借助接触主动倒地。双方均不犯规。裁判员判守方犯规及罚球点球的决定错误。","videos":["2025/i20c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250730/8.mp4"],"category":"penalty_area","tags":["点球","主动倒地"],"v":"wrong","var":"none"},{"seq":146,"issue":20,"no":9,"comp":"中乙联赛","round":"第21轮","home":"赣州瑞狮","away":"武汉三镇B队","minute":"74","match_info":"中乙联赛第21轮，赣州瑞狮VS武汉三镇B队，比赛第74分钟，赣州瑞狮59号队员在对方罚球区内与武汉三镇B队守门员争抢球，守门员倒地后，赣州瑞狮队射门进球，裁判员判进球有效","desc":"判例九：中乙联赛第21轮，赣州瑞狮VS武汉三镇B队，比赛第74分钟，赣州瑞狮59号队员在对方罚球区内与武汉三镇B队守门员争抢球，守门员倒地后，赣州瑞狮队射门进球，裁判员判进球有效。","appeal":"武汉三镇俱乐部申诉意见认为：对方59号对本方守门员犯规在先，进球应无效。","conclusion":"对于此判例，评议组一致认为：武汉三镇B队守门员率先触球，赣州瑞狮59号队员的争抢动作未顾及可能对对方队员造成的危险，应视为鲁莽犯规，并出示黄牌，后续进球无效。裁判员判进球有效的决定错误，漏判赣州瑞狮59号犯规和黄牌。","videos":["2025/i20c09-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250730/9.mp4"],"category":"goal_decision","tags":["黄牌","进球无效","守门员"],"v":"wrong","var":"none"},{"seq":147,"issue":20,"no":10,"comp":"中乙联赛","round":"第21轮","home":"赣州瑞狮","away":"武汉三镇B队","minute":"","match_info":"中乙联赛第21轮，赣州瑞狮VS武汉三镇B队，比赛第90+3分钟，赣州瑞狮守门员在本方罚球区内争抢球时与对方队员有接触，裁判员判武汉三镇B队队员犯规","desc":"判例十：中乙联赛第21轮，赣州瑞狮VS武汉三镇B队，比赛第90+3分钟，赣州瑞狮守门员在本方罚球区内争抢球时与对方队员有接触，裁判员判武汉三镇B队队员犯规。","appeal":"武汉三镇俱乐部申诉意见认为：对方守门员对本方队员犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：武汉三镇B队进攻队员正常做出争抢球动作，不构成犯规。赣州瑞狮守门员出击未触球并对对方队员实施草率的犯规。应判赣州瑞狮守门员犯规并判罚球点球。裁判员决定错误，错判武汉三镇B队队员犯规，漏判赣州瑞狮守门员犯规和罚球点球。","videos":["2025/i20c10-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250730/10.mp4"],"category":"penalty_area","tags":["点球","守门员"],"v":"wrong","var":"none"},{"seq":148,"issue":20,"no":11,"comp":"中乙联赛","round":"第21轮","home":"广东铭途","away":"昆明城星","minute":"","match_info":"中乙联赛第21轮，广东铭途VS昆明城星，比赛第90+2分钟，广东铭途9号队员在对方罚球区内与对方守门员争抢球时有接触，裁判员判广东铭途9号犯规，随后广东铭途67号将球打进对方球门，裁判员判罚进球无效","desc":"判例十一：中乙联赛第21轮，广东铭途VS昆明城星，比赛第90+2分钟，广东铭途9号队员在对方罚球区内与对方守门员争抢球时有接触，裁判员判广东铭途9号犯规，随后广东铭途67号将球打进对方球门，裁判员判罚进球无效。","appeal":"广东铭途俱乐部申诉意见认为：本方9号不犯规，后续进球应有效。","conclusion":"对于此判例，评议组一致认为：昆明城星守门员出击并已经用手控球，广东铭途9号与其争抢犯规，后续进球无效。裁判员判广东铭途9号犯规以及后续进球无效的决定正确。","videos":["2025/i20c11-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250730/11.mp4"],"category":"goal_decision","tags":["用手控制球","进球无效"],"v":"correct","var":"none"},{"seq":149,"issue":20,"no":12,"comp":"中乙联赛","round":"第21轮","home":"广东铭途","away":"昆明城星","minute":"","match_info":"中乙联赛第21轮，广东铭途VS昆明城星，比赛第90+6分钟，广东铭途队进攻中传中，昆明城星队员在本方罚球区内铲球防守时，疑似手臂接触球，裁判员未判罚手球犯规","desc":"判例十二：中乙联赛第21轮，广东铭途VS昆明城星，比赛第90+6分钟，广东铭途队进攻中传中，昆明城星队员在本方罚球区内铲球防守时，疑似手臂接触球，裁判员未判罚手球犯规。","appeal":"广东铭途俱乐部申诉意见认为：对方队员手球犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：昆明城星队员在本方罚球区内铲球后，球接触其手臂，其手臂处于铲球时起支撑作用的自然张开状态，属于合理位置，不构成手球犯规。裁判员未判罚手球犯规的决定正确。","videos":["2025/i20c12-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250730/12.mp4"],"category":"handball","tags":["自然位置","铲球支撑手"],"v":"correct","var":"none"},{"seq":150,"issue":21,"no":1,"comp":"中超联赛","round":"第19轮","home":"青岛西海岸","away":"河南俱乐部","minute":"90","match_info":"中超联赛第19轮，青岛西海岸VS河南酒祖杜康，比赛第90分钟，河南队15号队员在对方罚球区内与青岛西海岸6号队员发生接触后倒地","desc":"判例一：中超联赛第19轮，青岛西海岸VS河南酒祖杜康，比赛第90分钟，河南队15号队员在对方罚球区内与青岛西海岸6号队员发生接触后倒地。裁判员未判罚犯规。VAR未介入。","appeal":"河南俱乐部申诉意见认为：对方6号对本方15号犯规，并且破坏了本队一次极佳的得分机会。","conclusion":"对于此判例，评议组首先一致认为：青岛西海岸6号队员在防守时草率地踢人犯规，应判罚球点球。其次评议组多数成员认为：裁判员漏判罚球点球，VAR应该介入。此判例裁判员决定错误，漏判罚球点球。VAR未介入错误。","videos":["2025/i21c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250806/1.mp4"],"category":"penalty_area","tags":["点球","VAR未介入错误"],"v":"wrong","var":"wrong"},{"seq":151,"issue":21,"no":2,"comp":"中超联赛","round":"第19轮","home":"大连英博","away":"青岛海牛","minute":"31","match_info":"中超联赛第19轮，大连英博海发VS青岛海牛，比赛第31分钟，大连英博海发队进球","desc":"判例二：中超联赛第19轮，大连英博海发VS青岛海牛，比赛第31分钟，大连英博海发队进球。裁判员判进球有效。VAR未介入。","appeal":"青岛海牛俱乐部申诉意见认为：对方11号队员在争抢球时对本方8号队员犯规，并获得控球权，导致之后发展为进球，应判对方11号犯规在先，进球无效。","conclusion":"对于此判例，评议组一致认为：大连英博海发11号队员在两次与对方队员争抢球的过程中均不构成犯规。之后的进球有效。裁判员决定正确。VAR未介入正确。","videos":["2025/i21c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250806/2.mp4"],"category":"goal_decision","tags":["进球有效"],"v":"correct","var":"correct"},{"seq":152,"issue":21,"no":3,"comp":"中超联赛","round":"第19轮","home":"大连英博","away":"青岛海牛","minute":"69","match_info":"中超联赛第19轮，大连英博海发VS青岛海牛，比赛第69分钟，大连英博海发5号队员在本方罚球区内疑似手臂触球","desc":"判例三：中超联赛第19轮，大连英博海发VS青岛海牛，比赛第69分钟，大连英博海发5号队员在本方罚球区内疑似手臂触球。裁判员未判罚手球犯规。VAR未介入。","appeal":"青岛海牛俱乐部申诉意见认为：对方5号手球犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：在青岛海牛队员踢球时，球触及近距离的大连英博海发5号队员手臂，当时其手臂处于自然位置，属于意外手球，不属于手球犯规。裁判员未判罚手球犯规的决定正确。VAR未介入正确。","videos":["2025/i21c03-1.mp4"],"v
