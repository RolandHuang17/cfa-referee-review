],"category":"goal_decision","tags":["VAR介入错误","进球有效"],"v":"correct","var":"wrong"},{"seq":159,"issue":21,"no":10,"comp":"中甲联赛","round":"第19轮","home":"上海嘉定汇龙","away":"南京城市","minute":"83","match_info":"中甲联赛第19轮，上海嘉定汇龙VS南京城市","desc":"判例十：中甲联赛第19轮，上海嘉定汇龙VS南京城市。比赛第83分钟，上海嘉定汇龙9号队员在对方罚球区内与南京城市2号队员争抢高空球后倒地，裁判员判罚攻方上海嘉定汇龙9号犯规。","appeal":"上海嘉定汇龙俱乐部申诉意见认为：对方2号对本方9号犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：双方争抢高空球的动作属于正常接触，上海嘉定汇龙9号队员未跳起争抢球，南京城市2号队员跳起头顶球，双方的接触均不属于犯规。裁判员未判罚球点球正确。另外，评议组认为也不应判攻方上海嘉定汇龙9号犯规。","videos":["2025/i21c10-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250806/10.mp4"],"category":"penalty_area","tags":["点球","攻方犯规亦不应判"],"v":"correct","var":"none"},{"seq":160,"issue":21,"no":11,"comp":"中甲联赛","round":"第19轮","home":"延边龙鼎","away":"石家庄功夫","minute":"41","match_info":"中甲联赛第19轮，延边龙鼎VS石家庄功夫","desc":"判例十一：中甲联赛第19轮，延边龙鼎VS石家庄功夫。比赛第41分钟，延边龙鼎队进攻传球，助理裁判员示意越位，裁判员鸣哨停止比赛，判延边龙鼎38号队员越位犯规。随后延边龙鼎38号将球射入对方球门。","appeal":"延边龙鼎俱乐部申诉意见认为：本方38号不处于越位位置，不是越位犯规。","conclusion":"对于此判例，评议组一致认为：延边龙鼎38号队员在本方传球的瞬间，不处于越位位置，不是越位犯规。助理裁判员判断错误，裁判员判越位犯规错误。","videos":["2025/i21c11-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250806/11.mp4"],"category":"offside","tags":["越位误判"],"v":"wrong","var":"none"},{"seq":161,"issue":21,"no":12,"comp":"中甲联赛","round":"第19轮","home":"延边龙鼎","away":"石家庄功夫","minute":"63","match_info":"中甲联赛第19轮，延边龙鼎VS石家庄功夫","desc":"判例十二：中甲联赛第19轮，延边龙鼎VS石家庄功夫。比赛第63分钟，延边龙鼎29号队员进球，裁判员判双方争抢球时，延边龙鼎29号对石家庄功夫33号队员犯规，进球无效。","appeal":"延边龙鼎俱乐部申诉意见认为：本方29号不犯规，并且认为与之争抢的对方33号有假摔嫌疑。","conclusion":"对于此判例，评议组多数成员认为：延边龙鼎29号队员对对方队员有推搡和腿部接触动作，现有视频无法清晰展示具体接触情况和力度，裁判员观察位置和角度较好，支持裁判员做出的攻方犯规、进球无效的决定。","videos":["2025/i21c12-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250806/12.mp4"],"category":"goal_decision","tags":["证据不足"],"v":"correct","var":"none"},{"seq":162,"issue":21,"no":13,"comp":"中乙联赛","round":"第22轮","home":"山西崇德荣海","away":"海门珂缔缘","minute":"1","match_info":"中乙联赛第22轮，山西崇德荣海VS海门珂缔缘","desc":"判例十三：中乙联赛第22轮，山西崇德荣海VS海门珂缔缘。比赛第1分钟，山西崇德荣海36号队员进攻中在对方罚球区内与海门珂缔缘19号队员有接触并倒地，裁判员判海门珂缔缘19号犯规，并判罚球点球。","appeal":"海门珂缔缘俱乐部申诉意见认为：本方19号不犯规，不应被判罚球点球。","conclusion":"对于此判例，评议组一致认为：海门珂缔缘19号队员防守时先触球并且成功处理球，动作合理，随后山西崇德荣海36号队员与之发生接触，守方不犯规。裁判员判罚球点球的决定错误。","videos":["2025/i21c13-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250806/13.mp4"],"category":"penalty_area","tags":["点球","铲球先触球"],"v":"wrong","var":"none"},{"seq":163,"issue":22,"no":1,"comp":"中超联赛","round":"第20轮","home":"天津津门虎","away":"青岛西海岸","minute":"35","match_info":"中超联赛第20轮，天津津门虎VS青岛西海岸，比赛第35分钟，天津津门虎踢角球，4号队员头球进球","desc":"判例一：中超联赛第20轮，天津津门虎VS青岛西海岸，比赛第35分钟，天津津门虎踢角球，4号队员头球进球。裁判员初始判进球有效。VAR介入，裁判员经在场回看后，改判进球前天津津门虎6号队员推搡青岛西海岸15号队员犯规在先，进球无效。","appeal":"天津津门虎俱乐部申诉意见认为：本方6号不犯规，应判进球有效。","conclusion":"对于此判例，评议组一致认为：天津津门虎6号队员与青岛西海岸15号队员属于正常争抢中的身体接触，其程度不构成犯规，接触地点也不在空中球落点的争抢范围，此判例攻方不犯规，应判进球有效。裁判员判攻方犯规进球无效的最终决定错误。VAR介入错误。","videos":["2025/i22c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250813/1.mp4"],"category":"goal_decision","tags":["VAR介入错误","进球有效"],"v":"wrong","var":"wrong"},{"seq":164,"issue":22,"no":2,"comp":"中超联赛","round":"第20轮","home":"浙江俱乐部绿城","away":"北京国安","minute":"59","match_info":"中超联赛第20轮，浙江俱乐部绿城VS北京国安，比赛第59分钟，浙江俱乐部22号队员争抢球时踩踏到北京国安26号队员，裁判员初始未判罚犯规","desc":"判例二：中超联赛第20轮，浙江俱乐部绿城VS北京国安，比赛第59分钟，浙江俱乐部22号队员争抢球时踩踏到北京国安26号队员，裁判员初始未判罚犯规。VAR介入，裁判员经在场回看后，改判浙江俱乐部22号严重犯规，并出示红牌罚令出场。","appeal":"浙江俱乐部申诉意见认为：本队22号的犯规程度不构成严重犯规，不应被出示红牌。","conclusion":"对于此判例，评议组多数成员认为：根据浙江俱乐部22号队员踩踏对方队员时的接触部位、踩踏后的身体重心转移等情况，该判例构成严重犯规。裁判员在场回看后出示红牌的最终决定正确。在裁判员初始未判罚犯规的情况下，VAR以红牌事件介入正确。","videos":["2025/i22c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250813/2.mp4"],"category":"sfp_vc","tags":["红牌","严重犯规","踩踏","VAR介入正确"],"v":"correct","var":"correct"},{"seq":165,"issue":23,"no":1,"comp":"中超联赛","round":"第21轮","home":"青岛西海岸","away":"北京国安","minute":"","match_info":"中超联赛第21轮，青岛西海岸VS北京国安，比赛第90+2分钟，青岛西海岸队进球","desc":"判例一：中超联赛第21轮，青岛西海岸VS北京国安，比赛第90+2分钟，青岛西海岸队进球。裁判员经第二助理裁判员提示后，判青岛西海岸56号队员对北京国安34号守门员犯规在先，进球无效。VAR未介入。","appeal":"青岛西海岸俱乐部申诉意见认为：本方56号不犯规，应判进球有效。","conclusion":"对于此判例，评议组一致认为：北京国安34号守门员将球踢出后，青岛西海岸56号队员在争抢球后落地时踩踏到北京国安34号脚部，属于草率的犯规，后续进球无效。裁判员在得到助理裁判员协助后做出的攻方犯规进球无效的决定正确。VAR未介入正确。","videos":["2025/i23c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250820/1.mp4"],"category":"goal_decision","tags":["进球无效","踩踏"],"v":"correct","var":"correct"},{"seq":166,"issue":23,"no":2,"comp":"中超联赛","round":"第21轮","home":"长春亚泰","away":"梅州客家","minute":"33","match_info":"中超联赛第21轮，长春亚泰VS梅州客家，比赛第33分钟，梅州客家10号队员在对方罚球区内与长春亚泰31号队员接触后倒地","desc":"判例二：中超联赛第21轮，长春亚泰VS梅州客家，比赛第33分钟，梅州客家10号队员在对方罚球区内与长春亚泰31号队员接触后倒地。裁判员未判罚犯规，VAR未介入。","appeal":"梅州客家俱乐部申诉意见认为：对方31号对本方10号构成犯规。","conclusion":"对于此判例，评议组多数成员认为：长春亚泰31号队员在争抢球时手臂搭在梅州客家10号队员肩部，但接触力度较轻，并非梅州客家10号倒地的主要原因，属于可接受的接触动作。梅州客家10号在跑动变向过程中，有借助接触主动倒地的成分。裁判员未判罚犯规的决定正确。VAR未介入正确。","videos":["2025/i23c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250820/2.mp4"],"category":"penalty_area","tags":["主动倒地"],"v":"correct","var":"correct"},{"seq":167,"issue":23,"no":3,"comp":"中甲联赛","round":"第21轮","home":"上海嘉定汇龙","away":"苏州东吴","minute":"","match_info":"中甲联赛第21轮，上海嘉定汇龙vs苏州东吴，比赛第45+4分钟，苏州东吴23号队员在本方罚球区内与对方队员争顶时，手臂疑似触球，裁判员未判罚手球犯规","desc":"判例三：中甲联赛第21轮，上海嘉定汇龙vs苏州东吴，比赛第45+4分钟，苏州东吴23号队员在本方罚球区内与对方队员争顶时，手臂疑似触球，裁判员未判罚手球犯规。","appeal":"上海嘉定汇龙俱乐部申诉意见认为：对方23号构成手球犯规。","conclusion":"对于此判例，评议组多数成员认为：苏州东吴23号队员在与对方队员争抢头球时，身体因被对方队员手臂压制而失衡，导致球接触其张开的手臂，属于意外的手球，不构成手球犯规。裁判员未判罚手球犯规的决定正确。","videos":["2025/i23c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250820/3.mp4"],"category":"handball","tags":["意外手球"],"v":"correct","var":"none"},{"seq":168,"issue":23,"no":4,"comp":"中甲联赛","round":"第21轮","home":"广西平果","away":"定南赣联","minute":"22","match_info":"中甲联赛第21轮，广西平果vs定南赣联，比赛第22分钟，广西平果43号队员在对方罚球区内对对方队员有冲撞","desc":"判例四：中甲联赛第21轮，广西平果vs定南赣联，比赛第22分钟，广西平果43号队员在对方罚球区内对对方队员有冲撞。裁判员未判罚犯规。","appeal":"定南赣联俱乐部申诉意见认为：对方43号队员构成暴力行为，应出示红牌罚令出场。","conclusion":"对于此判例，评议组多数成员认为：广西平果43号队员故意冲撞对方队员，从接触部位、冲撞力度等因素考虑，未达到暴力行为程度，不应出示红牌，应视为鲁莽犯规，并出示黄牌警告。该判例中裁判员未出示红牌的决定正确，但漏判广西平果43号犯规和黄牌。","videos":["2025/i23c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250820/4.mp4"],"category":"sfp_vc","tags":["黄牌","挥臂","红牌不成立"],"v":"wrong","var":"none"},{"seq":169,"issue":23,"no":5,"comp":"中甲联赛","round":"第21轮","home":"广西平果","away":"定南赣联","minute":"37","match_info":"中甲联赛第21轮，广西平果vs定南赣联，比赛第37分钟，定南赣联4号队员对广西平果11号队员犯规，随后定南赣联队4号脚踩踏到广西平果11号腹部，裁判员掌握有利让比赛继续进行","desc":"判例五：中甲联赛第21轮，广西平果vs定南赣联，比赛第37分钟，定南赣联4号队员对广西平果11号队员犯规，随后定南赣联队4号脚踩踏到广西平果11号腹部，裁判员掌握有利让比赛继续进行。随后在比赛停止时，裁判员向定南赣联4号出示红牌罚令出场。","appeal":"定南赣联俱乐部申诉意见认为：本方4号队员因避免伤及对方队员要害部位，做出躲避动作造成踩踏，应被出示黄牌，裁判员错判红牌。","conclusion":"对于此判例，评议组首先一致认为：定南赣联队4号队员踩踏对方队员腹部，考虑动作力度和接触部位等因素，应出示红牌罚令出场。其次，评议组多数成员认为：定南赣联队4号的踩踏行为并非以争抢球为目的，且能够观察到对方队员倒地的位置，后续做出的跨步动作以及踩踏的结果并非不可避免，其犯规性质应视为暴力行为。裁判员出示红牌罚令出场的决定正确。另外，评议组指出：该判例中出现暴力行为，且广西平果未形成明显进球得分机会，故裁判员不应实施有利条款，应立即停止比赛并出示红牌。","videos":["2025/i23c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250820/5.mp4"],"category":"sfp_vc","tags":["红牌","暴力行为","有利条款不适用"],"v":"correct","var":"none"},{"seq":170,"issue":24,"no":1,"comp":"中超联赛","round":"第22轮","home":"长春亚泰","away":"深圳新鹏城","minute":"","match_info":"中超联赛第22轮，长春亚泰VS深圳新鹏城","desc":"判例一：中超联赛第22轮，长春亚泰VS深圳新鹏城。比赛第45+2分钟，长春亚泰10号队员对深圳新鹏城4号队员犯规，之后长春亚泰10号疑似踩踏深圳新鹏城4号。裁判员判长春亚泰10号犯规，但未针对踩踏动作出示红黄牌。VAR未介入。","appeal":"深圳新鹏城俱乐部申诉意见认为：对方10号的踩踏动作构成严重犯规，应出示红牌。","conclusion":"对于此判例，评议组首先一致认为：长春亚泰10号队员的踩踏动作不构成严重犯规，不应出示红牌。其次评议组多数成员认为，长春亚泰10号右脚落地前有避免踩踏到对方的躲避动作，之后的踩踏属于意外接触，无需出示黄牌。裁判员仅判罚之前的草率犯规，而未针对踩踏动作做出出示红黄牌的决定正确。VAR未介入正确。","videos":["2025/i24c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250827/1756304632517077.mp4"],"category":"sfp_vc","tags":["红牌不成立","踩踏"],"v":"correct","var":"correct"},{"seq":171,"issue":24,"no":2,"comp":"中超联赛","round":"第22轮","home":"长春亚泰","away":"深圳新鹏城","minute":"50","match_info":"中超联赛第22轮，长春亚泰VS深圳新鹏城","desc":"判例二：中超联赛第22轮，长春亚泰VS深圳新鹏城。比赛第50分钟，长春亚泰队进球，裁判员判进球有效。VAR未介入。","appeal":"深圳新鹏城俱乐部申诉意见认为：对方2号队员在中场争顶头球时对本方7号队员犯规，对方得到控球权随后取得进球，应判对方犯规在先，进球无效。","conclusion":"对于此判例，评议组多数成员认为：双方在中场争顶头球时，空中来球的落点处于深圳新鹏城7号队员可触球的范围内，长春亚泰2号队员在争抢时，使用手臂限制对方队员动作，起跳后又使用身体压制对方队员，从而争抢到头球，属于犯规。在后续进攻过程中，虽然守方深圳新鹏城队员有触球，但仅为阻挡对方带球，并未控球或阻断对方本次进攻，因此之前双方争抢头球属于本次进攻发起阶段的起点。应判攻方犯规在先，进球无效，VAR应介入。裁判员判进球有效的决定错误，VAR未介入错误。","videos":["2025/i24c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250827/1756304658619640.mp4"],"category":"goal_decision","tags":["进球无效","VAR未介入错误","争顶"],"v":"wrong","var":"wrong"},{"seq":172,"issue":24,"no":3,"comp":"中超联赛","round":"第22轮","home":"长春亚泰","away":"深圳新鹏城","minute":"55","match_info":"中超联赛第22轮，长春亚泰VS深圳新鹏城","desc":"判例三：中超联赛第22轮，长春亚泰VS深圳新鹏城。比赛第55分钟，深圳新鹏城27号队员在对方罚球区内控球时倒地，助理裁判员示意越位，裁判员判深圳新鹏城27号越位犯规在先。VAR未介入。","appeal":"深圳新鹏城俱乐部申诉意见认为：本方27号并未处于越位位置，不应被判越位犯规，之后对方4号对本方27号犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：VAR在检查越位位置操作时，传球瞬间的关键帧选取、双方队员身体部位选择、画线及比对等操作均正确，得出的攻方队员处于越位位置的结论正确。深圳新鹏城27号在球经对方队员折射后触球，构成越位犯规。助理裁判员判断正确，裁判员判深圳新鹏城27号越位犯规在先的决定正确。VAR未介入正确。","videos":["2025/i24c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250827/1756304688456014.mp4"],"category":"offside","tags":["VAR划线","折射"],"v":"correct","var":"correct"},{"seq":173,"issue":24,"no":4,"comp":"中超联赛","round":"第22轮","home":"长春亚泰","away":"深圳新鹏城","minute":"","match_info":"中超联赛第22轮，长春亚泰VS深圳新鹏城","desc":"判例四：中超联赛第22轮，长春亚泰VS深圳新鹏城。比赛第90+6分钟，深圳新鹏城9号队员在对方罚球区内与长春亚泰4号队员争抢高空球发生接触后倒地，裁判员未判罚犯规。VAR未介入。","appeal":"深圳新鹏城俱乐部申诉意见认为：对方4号对本方9号犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：空中来球的落点属于双方均可争抢的范围，长春亚泰4号队员主动争抢并顶到球，双方属于正常争抢接触。支持裁判员未判罚犯规的决定，VAR未介入正确。","videos":["2025/i24c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250827/1756304704438779.mp4"],"category":"penalty_area","tags":["争抢高球"],"v":"correct","var":"correct"},{"seq":174,"issue":24,"no":5,"comp":"中超联赛","round":"第23轮","home":"浙江俱乐部绿城","away":"天津津门虎","minute":"65","match_info":"中超联赛第23轮（调赛），浙江俱乐部绿城VS天津津门虎","desc":"判例五：中超联赛第23轮（调赛），浙江俱乐部绿城VS天津津门虎。比赛第65分钟，浙江俱乐部20号队员手臂击打到天津津门虎4号队员头部，裁判员未判罚犯规，VAR未介入。","appeal":"天津津门虎俱乐部申诉意见认为：对方20号肘击本方4号，应出示红牌。","conclusion":"对于此判例，评议组在认定中未达成相对一致。经询国际足联裁判讲师意见，评议组同意将此判例认定为：浙江俱乐部20号队员手臂击打对方队员的动作属于严重犯规，应出示红牌，VAR应介入此事件。裁判员决定错误，漏判红牌。VAR未介入错误。","videos":["2025/i24c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250827/1756304722887432.mp4"],"category":"sfp_vc","tags":["红牌","严重犯规","挥臂","VAR未介入错误"],"v":"wrong","var":"wrong"},{"seq":175,"issue":24,"no":6,"comp":"中超联赛","round":"第23轮","home":"浙江俱乐部绿城","away":"天津津门虎","minute":"","match_info":"中超联赛第23轮（调赛），浙江俱乐部绿城VS天津津门虎","desc":"判例六：中超联赛第23轮（调赛），浙江俱乐部绿城VS天津津门虎。比赛第90+5分钟，浙江俱乐部进球，裁判员判进球有效。VAR未介入。","appeal":"天津津门虎俱乐部申诉意见认为：双方在争抢球权过程中，对方26号抬脚过高，浙江队得到控球权随后取得进球，应判对方犯规在先，进球无效。","conclusion":"对于此判例，评议组一致认为：双方争抢球权时，面对球所处的高度，使用脚争抢相对更为合理。天津津门虎队员使用头部全力争抢未成功，浙江俱乐部26号队员先触球后立即收脚避免了与对方头部的接触。浙江队26号不构成犯规。裁判员未判罚犯规的决定以及判后续进球有效的决定均正确，VAR未介入正确。","videos":["2025/i24c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250827/1756304741825316.mp4"],"category":"freekick_foul","tags":["争抢高球","收脚"],"v":"correct","var":"correct"},{"seq":176,"issue":24,"no":7,"comp":"中乙联赛","round":"第23轮","home":"海门珂缔缘","away":"广西恒宸","minute":"88","match_info":"中乙联赛第23轮，海门珂缔缘VS广西恒宸","desc":"判例七：中乙联赛第23轮，海门珂缔缘VS广西恒宸。比赛第88分钟，海门珂缔缘57号队员接本方传球进攻至对方罚球区，广西恒宸21号队员铲球，随后海门珂缔缘57号倒地，裁判员未判罚犯规。","appeal":"海门珂缔缘俱乐部申诉意见认为：对方21号铲球犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：广西恒宸21号队员铲球试图拦截对方队员传球，并未对对方队员犯规或造成其倒地。海门珂缔缘57号扣球后腿部继续向前移动造成了双方的接触。裁判员未判罚犯规的决定正确。","videos":["2025/i24c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250827/1756304761697913.mp4"],"category":"penalty_area","tags":["铲球"],"v":"correct","var":"none"},{"seq":177,"issue":24,"no":8,"comp":"中乙联赛","round":"第23轮","home":"广州蒲公英","away":"湖北青年星","minute":"43","match_info":"中乙联赛第23轮，广州蒲公英vs湖北青年星","desc":"判例八：中乙联赛第23轮，广州蒲公英vs湖北青年星。比赛第43分钟，湖北青年星10号队员接本方传球进攻至对方罚球区，广州蒲公英16号队员与其发生接触，湖北青年星10号倒地，裁判员未判罚犯规。","appeal":"湖北青年星俱乐部申诉意见认为：对方16号对本方10号犯规，破坏了本方进攻机会和得分机会。","conclusion":"对于此判例，评议组多数成员认为：双方队员侧背部相互接触以争抢位置，接触力度可接受，且均有争抢球机会，不构成犯规。裁判员未判罚广州蒲公英球员犯规的决定正确。","videos":["2025/i24c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250827/1756304781652605.mp4"],"category":"penalty_area","tags":[],"v":"correct","var":"none"},{"seq":178,"issue":25,"no":1,"comp":"中超联赛","round":"第23轮","home":"云南玉昆","away":"长春亚泰","minute":"","match_info":"中超联赛第23轮，云南玉昆VS长春亚泰","desc":"判例一：中超联赛第23轮，云南玉昆VS长春亚泰。比赛第90+5分钟，云南玉昆14号队员在对方罚球区内与长春亚泰29号队员发生接触后倒地。裁判员认定长春亚泰29号犯规，并判罚球点球。VAR未介入。","appeal":"长春亚泰俱乐部申诉意见认为：本方29号不犯规，不应判罚球点球。","conclusion":"对于此判例，评议组一致认为：在云南玉昆14号队员摆腿射门时，长春亚泰29号队员在争抢时对其实施草率的绊人犯规，阻止了对方有希望的进攻，应判罚球点球，无需出示红黄牌。裁判员判罚球点球的决定正确。VAR未介入正确。","videos":["2025/i25c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250903/1756898261228524.mp4"],"category":"penalty_area","tags":["点球","绊摔","无需红黄牌"],"v":"correct","var":"correct"},{"seq":179,"issue":25,"no":2,"comp":"中超联赛","round":"第23轮","home":"武汉三镇","away":"上海申花","minute":"40","match_info":"中超联赛第23轮，武汉三镇VS上海申花","desc":"判例二：中超联赛第23轮，武汉三镇VS上海申花。比赛第40分钟，上海申花10号队员右脚踩到武汉队倒地队员腿部，裁判员未判罚犯规。VAR介入。裁判员经在场回看后，判上海申花10号犯规，并出示黄牌警告。","appeal":"","conclusion":"此判例无俱乐部申诉，但因牵涉到判罚尺度统一问题而引起较多关注，因此评议组评议此判例。\n对于此判例，评议组一致认为：武汉三镇队队员率先将球铲出，上海申花队10号队员争抢球时使用鞋钉部位，直腿蹬出且未及时收脚，踩踏到对方队员小腿部位，危及对方安全。按照竞赛规则及本赛季统一判罚与评议尺度，应视为上海申花队10号队员严重犯规并出示红牌罚令其出场。VAR介入正确。裁判员经在场回看后改判黄牌的决定错误，漏判红牌。","videos":["2025/i25c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250903/1756898342670424.mp4"],"category":"sfp_vc","tags":["红牌","严重犯规","踩踏","VAR介入正确"],"v":"wrong","var":"correct"},{"seq":180,"issue":25,"no":3,"comp":"中乙联赛","round":"第24轮","home":"广西恒宸","away":"山东泰山B队","minute":"","match_info":"中乙联赛第24轮，广西恒宸vs山东泰山B队","desc":"判例三：中乙联赛第24轮，广西恒宸vs山东泰山B队。比赛第90+9分钟，山东泰山B队62号在对方罚球区内与广西恒宸守门员争抢球后倒地，裁判员未判罚犯规。","appeal":"山东泰山俱乐部申诉意见认为：对方守门员犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：广西恒宸守门员争抢中手触到了球，从现有视频中看，没有明显证据展示其在争抢中有犯规情况。双方的争抢应视为正常接触。支持裁判员未判罚犯规的决定。","videos":["2025/i25c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250903/1756898455713155.mp4"],"category":"penalty_area","tags":["守门员"],"v":"correct","var":"none"},{"seq":181,"issue":25,"no":4,"comp":"中乙联赛","round":"第24轮","home":"昆明城星","away":"山西崇德荣海","minute":"79","match_info":"中乙联赛第24轮，昆明城星VS山西崇德荣海","desc":"判例四：中乙联赛第24轮，昆明城星VS山西崇德荣海。比赛第79分钟，昆明城星进球，裁判员判进球前山西崇德荣海守门员在本方罚球区外犯规并出示红牌将其罚令出场，进球无效，由昆明城星踢任意球恢复比赛。","appeal":"昆明城星俱乐部申诉意见认为：裁判员应掌握有利条款，本方进球应有效。","conclusion":"对于此判例，评议组一致认为：山西崇德荣海守门员犯规时，球即将进入山西崇德荣海球门，此时裁判员应掌握有利条款，使进球发生后判进球有效，之后再以非体育行为为由警告山西崇德荣海守门员。此判例中裁判员在球尚未进入球门前鸣哨停止了比赛，判罚守门员犯规，之后球进门，在此情况下裁判员无法再做出进球有效的决定，因此做出了进球无效、向山西崇德荣海守门员出示红牌并判罚直接任意球的决定。结合上述两点，评议组多数成员认为：在犯规发生时，裁判员应正确运用规则，并且做出对被犯规一方更有利的判罚决定，此判例应认定为裁判员判罚决定错误。","videos":["2025/i25c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250903/1756898677734714.mp4"],"category":"goal_decision","tags":["有利条款","进球有效","守门员"],"v":"wrong","var":"none"},{"seq":182,"issue":26,"no":1,"comp":"中超联赛","round":"第24轮","home":"成都蓉城","away":"长春亚泰","minute":"42","match_info":"中超联赛第24轮，成都蓉城VS长春亚泰，比赛第42分钟，成都蓉城7号队员在对方罚球区内与长春亚泰2号队员接触后倒地，裁判员未判罚犯规，VAR未介入","desc":"判例一：中超联赛第24轮，成都蓉城VS长春亚泰，比赛第42分钟，成都蓉城7号队员在对方罚球区内与长春亚泰2号队员接触后倒地，裁判员未判罚犯规，VAR未介入。","appeal":"成都蓉城俱乐部申诉意见认为：对方2号对本方7号犯规，应判罚球点球。","conclusion":"对于此判例，评议组多数成员认为：成都蓉城7号队员带球变向，造成双方腿部发生接触，长春亚泰2号队员无犯规动作。裁判员未判罚犯规的决定正确。VAR未介入正确。","videos":["2025/i26c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250917/1758121688675816.mp4"],"category":"penalty_area","tags":[],"v":"correct","var":"correct"},{"seq":183,"issue":26,"no":2,"comp":"中超联赛","round":"第24轮","home":"上海申花","away":"山东泰山","minute":"7","match_info":"中超联赛第24轮，上海申花VS山东泰山，比赛第7分钟，山东泰山11号队员进攻中传中，球疑似接触处在罚球区内的上海申花13号队员手臂","desc":"判例二：中超联赛第24轮，上海申花VS山东泰山，比赛第7分钟，山东泰山11号队员进攻中传中，球疑似接触处在罚球区内的上海申花13号队员手臂。裁判员未判罚手球犯规，VAR未介入。","appeal":"山东泰山俱乐部申诉意见认为：对方13号手球犯规，并阻止了本方有希望的进攻，应判罚球点球并向对方13号出示黄牌。","conclusion":"对于此判例，评议组将在征求国际足联裁判专家意见后做出认定。\n【第27期补充认定】中超联赛第24轮，上海申花VS山东泰山，比赛第7分钟，山东泰山11号队员进攻中传中，球疑似接触处在罚球区内的上海申花13号队员手臂。裁判员未判罚手球犯规，VAR未介入。\n对于此判例，在参考国际足联裁判专家意见后，评议组认定：上海申花13号队员清晰地跳向球的运行路线，并且张开手臂，使身体不自然扩大。但视频无法证实球与队员身体的接触点是否处于规则规定的手臂范围（腋窝以下）。综上，评议组支持裁判员做出的不是手球犯规的决定，以及VAR不介入的决定。另外，评议组作出说明：现场转播画面中显示，裁判员做出了手指指向耳机的动作，表示裁判员正在与VAR进行沟通，该沟通属于查看潜在的介入事件时的正常操作程序，并不代表VAR对裁判员初始决定进行了介入。只有当VAR找到清晰证据证明裁判员的初始决定存在错误时，VAR将建议裁判员对该事件进行回看分析，此时，才意味着VAR进行了介入，而介入的标志就是裁判员比划“电视”手势。","videos":["2025/i26c02-1.mp4","2025/i26c02-2.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250917/1758121712340861.mp4","https://videooss.thecfa.cn/upload/video/20250924/1758720939937197.mp4"],"category":"handball","tags":["证据不足","腋窝以下"],"v":"correct","var":"correct"},{"seq":184,"issue":26,"no":3,"comp":"中超联赛","round":"第24轮","home":"上海申花","away":"山东泰山","minute":"18","match_info":"中超联赛第24轮，上海申花VS山东泰山，比赛第18分钟，上海申花队踢角球并且进球","desc":"判例三：中超联赛第24轮，上海申花VS山东泰山，比赛第18分钟，上海申花队踢角球并且进球。裁判员判进球有效，VAR未介入。","appeal":"山东泰山俱乐部申诉意见认为：对方23号队员在争抢位置中推搡本方守门员犯规，应判对方犯规在先进球无效。","conclusion":"对于此判例，评议组一致认为：山东泰山守门员争抢球时向后移动，与已经处于该位置的上海申花23号发生接触，后者做出正常保护动作，其性质和程度不构成犯规，后续进球有效。裁判员判进球有效的决定正确，VAR未介入正确。","videos":["2025/i26c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250917/1758121752270020.mp4"],"category":"goal_decision","tags":["守门员","进球有效"],"v":"correct","var":"correct"},{"seq":185,"issue":26,"no":4,"comp":"中超联赛","round":"第24轮","home":"大连英博","away":"深圳新鹏城","minute":"46","match_info":"中超联赛第24轮，大连英博VS深圳新鹏城，比赛第46分钟，深圳新鹏城20号队员在本方罚球区内被球打到手臂","desc":"判例四：中超联赛第24轮，大连英博VS深圳新鹏城，比赛第46分钟，深圳新鹏城20号队员在本方罚球区内被球打到手臂。裁判员判其手球犯规并判罚球点球。VAR介入，裁判员经在场回看后，做出维持罚球点球的最终判罚。","appeal":"深圳新鹏城俱乐部申诉意见认为：本方20号手臂触球不构成犯规，不应被判罚球点球。","conclusion":"对于此判例，评议组多数成员认为：深圳新鹏城20号队员铲球防守并触球后，大连英博队员射门，球接触深圳新鹏城20号手臂，此时其手臂处于当前动作下的合理位置，且为近距离意外来球，不构成手球犯规。VAR介入正确。裁判员经在场回看后仍维持手球犯规并判罚球点球的最终决定错误。","videos":["2025/i26c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250917/1758121788657914.mp4"],"category":"handball","tags":["点球","VAR介入正确"],"v":"wrong","var":"correct"},{"seq":186,"issue":26,"no":5,"comp":"中甲联赛","round":"第22轮","home":"广州豹","away":"石家庄功夫","minute":"67","match_info":"中甲联赛第22轮，广东广州豹VS石家庄功夫，比赛第67分钟，石家庄功夫44号队员在对方罚球区内与广东广州豹5号队员接触后，双方倒地，裁判员未判罚犯规","desc":"判例五：中甲联赛第22轮，广东广州豹VS石家庄功夫，比赛第67分钟，石家庄功夫44号队员在对方罚球区内与广东广州豹5号队员接触后，双方倒地，裁判员未判罚犯规。","appeal":"石家庄功夫俱乐部申诉意见认为：对方5号对本方44号犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：双方争抢过程中互有身体接触和干扰动作，现有视频不能证明广东广州豹5号队员有明显犯规。支持裁判员未判罚犯规的决定。","videos":["2025/i26c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250917/1758121835323885.mp4"],"category":"penalty_area","tags":["证据不足"],"v":"correct","var":"none"},{"seq":187,"issue":26,"no":6,"comp":"中甲联赛","round":"第22轮","home":"广州豹","away":"石家庄功夫","minute":"57","match_info":"中甲联赛第22轮，广东广州豹VS石家庄功夫，比赛第57分钟，广东广州豹队进攻中，其7号队员与石家庄功夫19号队员发生接触后倒地，裁判员未判罚犯规；之后石家庄功夫19号靠近倒地的广东广州豹7号示意其起身，双方互有手臂动作，石家庄功夫19号倒地不起；裁判员停止比赛，石家庄功夫36号队员靠近倒地的广东广州豹7号施压；在裁判员管理过程中，广东广州豹11号队员跑来，疑似与石家庄功夫36号有接触，石家庄功夫36号倒地翻滚后无法起身；裁判员经与助理裁判员及第四官员协商后，向广东广州豹7号、石家庄功夫36号以及石家庄功夫19号出示黄牌","desc":"判例六：中甲联赛第22轮，广东广州豹VS石家庄功夫，比赛第57分钟，广东广州豹队进攻中，其7号队员与石家庄功夫19号队员发生接触后倒地，裁判员未判罚犯规；之后石家庄功夫19号靠近倒地的广东广州豹7号示意其起身，双方互有手臂动作，石家庄功夫19号倒地不起；裁判员停止比赛，石家庄功夫36号队员靠近倒地的广东广州豹7号施压；在裁判员管理过程中，广东广州豹11号队员跑来，疑似与石家庄功夫36号有接触，石家庄功夫36号倒地翻滚后无法起身；裁判员经与助理裁判员及第四官员协商后，向广东广州豹7号、石家庄功夫36号以及石家庄功夫19号出示黄牌。","appeal":"石家庄功夫俱乐部申诉意见认为：对方11号对本方36号实施暴力行为，应被红牌罚令出场；对方7号对本方19号实施暴力行为，应被红牌罚令出场。","conclusion":"对于此判例，评议组一致认为：从现有视频展示的事件过程看，双方均无应被认定为暴力行为或出示红牌的队员。裁判员以挑衅、佯装和夸大被犯规程度等非体育行为原因，向广东广州豹7号、石家庄功夫36号以及石家庄功夫19号出示黄牌的决定正确。","videos":["2025/i26c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250917/1758121913347439.mp4"],"category":"simulation","tags":["黄牌","非体育行为","佯装夸大"],"v":"correct","var":"none"},{"seq":188,"issue":26,"no":7,"comp":"中甲联赛","round":"第22轮","home":"广州豹","away":"石家庄功夫","minute":"69","match_info":"中甲联赛第22轮，广东广州豹VS石家庄功夫，比赛第69分钟，石家庄功夫队踢角球，在比赛恢复前，广东广州豹7号队员在本方罚球区内与石家庄功夫14号头部疑似有接触，后者倒地，裁判员未出示红黄牌","desc":"判例七：中甲联赛第22轮，广东广州豹VS石家庄功夫，比赛第69分钟，石家庄功夫队踢角球，在比赛恢复前，广东广州豹7号队员在本方罚球区内与石家庄功夫14号头部疑似有接触，后者倒地，裁判员未出示红黄牌。","appeal":"石家庄功夫俱乐部申诉意见认为：对方7号使用头部恶意撞击本方14号，属于暴力行为，应被红牌罚令出场。","conclusion":"对于此判例，评议组将在征求国际足联裁判专家意见后做出认定。\n【第27期补充认定】中甲联赛第22轮，广东广州豹VS石家庄功夫，比赛第69分钟，石家庄功夫队踢角球，在比赛恢复前，广东广州豹7号队员在本方罚球区内与石家庄功夫14号头部疑似有接触，后者倒地，裁判员未出示红黄牌。\n对于此判例，在参考国际足联裁判专家意见后，评议组认定：在比赛停止时，广东广州豹7号队员使用头部撞击对方队员，应以暴力行为被红牌罚令出场。裁判员决定错误，漏判红牌。另外，石家庄功夫14号队员疑似有挑衅或还击行为，在此角度视频下无法清晰证实是否构成暴力行为，但至少应以非体育行为出示黄牌警告。","videos":["2025/i26c07-1.mp4","2025/i26c07-2.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250917/1758121938254296.mp4","https://videooss.thecfa.cn/upload/video/20250924/1758720981945686.mp4"],"category":"sfp_vc","tags":["红牌","暴力行为","比赛停止时"],"v":"wrong","var":"none"},{"seq":189,"issue":26,"no":8,"comp":"中甲联赛","round":"第22轮","home":"南通支云","away":"苏州东吴","minute":"85","match_info":"中甲联赛第22轮，南通支云VS苏州东吴，比赛第85分钟，南通支云队进球","desc":"判例八：中甲联赛第22轮，南通支云VS苏州东吴，比赛第85分钟，南通支云队进球。裁判员判进球有效。","appeal":"苏州东吴俱乐部申诉意见认为：对方远射被本方守门员扑出后，对方6号队员对本方23号队员犯规，本方23号倒地后，对方6号又踢本方23号，随后对方的进球应判为无效。","conclusion":"对于此判例，评议组一致认为：南通支云队远射后，苏州东吴守门员将球扑出，双方争抢球，现有视频未显示南通支云进攻队员有犯规；随后苏州东吴23号争抢中身体倒向对方队员，南通支云6号未犯规；苏州东吴23号倒地后手臂触球，之后南通支云6号的争抢未犯规，随即南通支云进球有效，因掌握有利，不必再判罚苏州东吴23号手球犯规。裁判员判进球有效的决定正确。","videos":["2025/i26c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250917/1758121993943265.mp4"],"category":"goal_decision","tags":["有利条款","进球有效"],"v":"correct","var":"none"},{"seq":190,"issue":26,"no":9,"comp":"中甲联赛","round":"第22轮","home":"南通支云","away":"苏州东吴","minute":"","match_info":"中甲联赛第22轮，南通支云VS苏州东吴，比赛第90+2分钟，南通支云队进球","desc":"判例九：中甲联赛第22轮，南通支云VS苏州东吴，比赛第90+2分钟，南通支云队进球。裁判员判进球有效。","appeal":"苏州东吴俱乐部申诉意见认为：对方20号队员在进攻过程中应被判罚手球犯规或越位犯规，随后对方的进球应判为无效。","conclusion":"对于此判例，评议组一致认为：南通支云20号倒地后，在同队队员后续触球时，南通支云20号处于越位位置，随后球先触及南通支云20号身体，应判罚南通支云20号越位犯规，后续进球无效。裁判员判进球有效的决定错误，漏判越位犯规。","videos":["2025/i26c09-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250917/1758122046824016.mp4"],"category":"offside","tags":["进球无效","越位位置获利"],"v":"wrong","var":"none"},{"seq":191,"issue":26,"no":10,"comp":"中乙联赛","round":"第25轮","home":"昆明城星","away":"泰安天贶","minute":"","match_info":"中乙联赛第25轮，昆明城星VS泰安天贶，比赛第90+8分钟，昆明城星14号队员铲抢泰安天贶16号队员，裁判员判昆明城星14号犯规，并出示黄牌","desc":"判例十：中乙联赛第25轮，昆明城星VS泰安天贶，比赛第90+8分钟，昆明城星14号队员铲抢泰安天贶16号队员，裁判员判昆明城星14号犯规，并出示黄牌。","appeal":"泰安天贶俱乐部申诉意见认为：对方14号队员铲球后的附加腿部动作，属于暴力行为，应出示红牌罚令出场。","conclusion":"对于此判例，评议组多数成员认为：根据昆明城星14号队员的犯规及附加动作的力量和方式，不构成严重犯规或暴力行为，应认定为鲁莽犯规并出示黄牌。裁判员判昆明城星14号犯规并出示黄牌的决定正确。","videos":["2025/i26c10-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250917/1758122080738843.mp4"],"category":"sfp_vc","tags":["黄牌","红牌不成立","铲球"],"v":"correct","var":"none"},{"seq":192,"issue":26,"no":11,"comp":"女超联赛","round":"第15轮","home":"辽宁沈北禾丰女足","away":"山东体彩女足","minute":"71","match_info":"女超联赛第15轮，辽宁沈北禾丰女足VS山东体彩女足，比赛第71分钟，辽宁队踢角球，随后辽宁队队员头球将球顶入对方球门；在球进门前，裁判员鸣哨，判辽宁队其他队员在与对方争抢位置时犯规在先，进球无效","desc":"判例十一：女超联赛第15轮，辽宁沈北禾丰女足VS山东体彩女足，比赛第71分钟，辽宁队踢角球，随后辽宁队队员头球将球顶入对方球门；在球进门前，裁判员鸣哨，判辽宁队其他队员在与对方争抢位置时犯规在先，进球无效。","appeal":"辽宁女足申诉意见认为：本方队员不犯规，进球应有效。","conclusion":"对于此判例，评议组一致认为：双方队员在罚球区内争抢位置时属于正常程度的接触，不构成犯规。裁判员判攻方犯规的决定错误。另外，评议组指出：球在裁判员鸣哨停止比赛后进入球门，按照规则，不能认定为进球有效。","videos":["2025/i26c11-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250917/1758122140431790.mp4"],"category":"goal_decision","tags":["进球有效","鸣哨后进球"],"v":"wrong","var":"none"},{"seq":193,"issue":26,"no":12,"comp":"女超联赛","round":"第15轮","home":"辽宁沈北禾丰女足","away":"山东体彩女足","minute":"6","match_info":"女超联赛第15轮，辽宁沈北禾丰女足VS山东体彩女足，比赛第6分钟，辽宁队30号队员进攻中带球进入对方罚球区后倒地，裁判员未判罚犯规","desc":"判例十二：女超联赛第15轮，辽宁沈北禾丰女足VS山东体彩女足，比赛第6分钟，辽宁队30号队员进攻中带球进入对方罚球区后倒地，裁判员未判罚犯规。","appeal":"辽宁女足申诉意见认为：对方队员对本方30号犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：现有视频无法证明山东队防守队员脚部与辽宁队30号队员是否发生接触以及是否构成犯规，裁判员临场观察距离和角度较好。支持裁判员做出的不犯规的决定。","videos":["2025/i26c12-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250917/1758122172513483.mp4"],"category":"penalty_area","tags":["证据不足"],"v":"correct","var":"none"},{"seq":194,"issue":27,"no":1,"comp":"中乙联赛","round":"第26轮","home":"广东铭途","away":"湖北青年星","minute":"89","match_info":"中乙联赛第26轮，广东铭途VS湖北青年星，比赛第89分钟，湖北青年星10号队员在本方罚球区附近防守带球进攻的广东铭途46号队员，后者倒地，裁判员未判罚犯规，VAR查看后未介入","desc":"判例一：中乙联赛第26轮，广东铭途VS湖北青年星，比赛第89分钟，湖北青年星10号队员在本方罚球区附近防守带球进攻的广东铭途46号队员，后者倒地，裁判员未判罚犯规，VAR查看后未介入。","appeal":"广东铭途俱乐部申诉意见认为：对方10号对本方46号犯规，犯规地点在罚球区内，应判罚球点球。","conclusion":"对于此判例，评议组首先一致认为：视频显示，双方队员接触点处于罚球区外，不存在判罚球点球的可能。其次评议组多数成员认为：从现有视频看，湖北青年星10号对广东铭途46号的防守动作，接触程度较轻微，可视为比赛中的正常接触，不构成犯规。支持裁判员未判罚犯规的决定，VAR未介入正确。","videos":["2025/i27c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250924/1758720871199943.mp4"],"category":"penalty_area","tags":["地点判定"],"v":"correct","var":"correct"},{"seq":195,"issue":27,"no":2,"comp":"中乙联赛","round":"第26轮","home":"无锡吴钩","away":"广西恒宸","minute":"","match_info":"中乙联赛第26轮，无锡吴钩VS广西恒宸，比赛进行至第18分钟，无锡吴钩进球，裁判员判进球有效","desc":"判例二：中乙联赛第26轮，无锡吴钩VS广西恒宸，比赛进行至第18分钟，无锡吴钩进球，裁判员判进球有效。","appeal":"广西恒宸俱乐部申诉意见认为：对方进攻中最后一传时，传给了处于越位位置的队员，后续该队员射门进球，应判为越位犯规在先进球无效。","conclusion":"对于此判例，评议组一致认为：从视频回放角度看，无锡吴钩队最后一传的触球点存在被遮挡的情况，从现有角度无法证实其同队队员是否处于越位位置。遂尊重和支持助理裁判员的判断，以及裁判员做出的进球有效的决定。","videos":["2025/i27c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20250924/1758720908920948.mp4"],"category":"offside","tags":["证据不足"],"v":"correct","var":"none"},{"seq":196,"issue":28,"no":1,"comp":"中甲联赛","round":"第24轮","home":"南通支云","away":"陕西联合","minute":"86","match_info":"中甲联赛第24轮，南通支云vs陕西联合月亮泊","desc":"判例一：中甲联赛第24轮，南通支云vs陕西联合月亮泊。比赛第86分钟，南通支云15号队员与陕西联合月亮泊9号队员在无球状态下有接触，裁判员停止比赛，并在征求助理裁判员意见后，向上述双方队员各出示一张黄牌。","appeal":"陕西联合月亮泊俱乐部申诉意见认为：在无球状态下，对方15号对本方9号实施暴力行为。","conclusion":"对于此判例，评议组一致认为：从现有视频看，在无球状态下，南通支云15号队员挥拳击打对方队员，应被视为暴力行为并出示红牌罚令出场。裁判员向南通支云15号出示黄牌的决定错误，漏判红牌。","videos":["2025/i28c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251001/1759321425877924.mov"],"category":"sfp_vc","tags":["红牌","暴力行为","挥拳"],"v":"wrong","var":"none"},{"seq":197,"issue":28,"no":2,"comp":"中甲联赛","round":"第24轮","home":"佛山南狮","away":"广西平果","minute":"","match_info":"中甲联赛第24轮，佛山南狮vs广西平果国晶","desc":"判例二：中甲联赛第24轮，佛山南狮vs广西平果国晶。比赛第90+6分钟，双方队员争抢空中球时，佛山南狮25号队员脚部与广西平果国晶5号队员头部有接触，裁判员判佛山南狮25号犯规，并出示黄牌。VAR未介入。","appeal":"广西平果国晶俱乐部申诉意见认为：对方25号的犯规属于严重犯规，应被出示红牌罚令出场。","conclusion":"对于此判例，评议组多数成员认为：根据佛山南狮25号队员抬脚争抢球的高度，以及鞋或鞋钉与对方队员面部接触、危及对方安全的情况，该犯规应被视为严重犯规并出示红牌罚令出场。裁判员出示黄牌的决定错误，漏判红牌。VAR未介入错误。","videos":["2025/i28c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251001/1759321457506931.mov"],"category":"sfp_vc","tags":["红牌","严重犯规","抬脚过高","VAR未介入错误"],"v":"wrong","var":"wrong"},{"seq":198,"issue":28,"no":3,"comp":"中甲联赛","round":"第24轮","home":"苏州东吴","away":"南京城市","minute":"48","match_info":"中甲联赛第24轮，苏州东吴vs南京城市","desc":"判例三：中甲联赛第24轮，苏州东吴vs南京城市。比赛第48分钟，苏州东吴6号队员头球射门，南京城市守门员将球扑出，助理裁判员示意球的整体已经越过球门线，裁判员判苏州东吴队进球得分。","appeal":"南京城市俱乐部申诉意见认为：球的整体未完全越过球门线，不应判对方进球得分。","conclusion":"对于此判例，评议组一致认为：现有视频的角度无法准确判断球的整体是否已经越过了球门线，助理裁判员的观察位置不好，做出的判断无说服力。评议组对此判例不予认定。","videos":["2025/i28c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251001/1759321485660442.mov"],"category":"goal_decision","tags":["球门线","证据不足"],"v":"pending","var":"none"},{"seq":199,"issue":28,"no":4,"comp":"中甲联赛","round":"第24轮","home":"苏州东吴","away":"南京城市","minute":"74","match_info":"中甲联赛第24轮，苏州东吴vs南京城市","desc":"判例四：中甲联赛第24轮，苏州东吴vs南京城市。比赛第74分钟，苏州东吴29队员犯规后倒地不起，南京城市2号队员过来用手接触苏州东吴29号面部，裁判员向南京城市2号出示红牌罚令出场。","appeal":"南京城市俱乐部申诉意见认为：本方2号队员用手接触对方29号面部，示意其尽快起身，接触力度轻微可忽略，不属于暴力行为，不应被红牌罚令出场。","conclusion":"对于此判例，评议组多数成员认为：南京城市2号队员的行为带有挑衅性质，但其接触对方的力度轻微，应视为非体育行为并出示黄牌。裁判员向南京城市2号出示红牌的决定错误。","videos":["2025/i28c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251001/1759321551868350.mov"],"category":"sfp_vc","tags":["红牌","黄牌","暴力行为不成立"],"v":"wrong","var":"none"},{"seq":200,"issue":28,"no":5,"comp":"中甲联赛","round":"第24轮","home":"上海嘉定汇龙","away":"广州豹","minute":"","match_info":"中甲联赛第24轮，上海嘉定汇龙vs广东广州豹","desc":"判例五：中甲联赛第24轮，上海嘉定汇龙vs广东广州豹。比赛第90+3分钟，上海嘉定汇龙踢后场任意球，广东广州豹有队员阻止对方快发任意球，上海嘉定汇龙23号大力将球踢向对方队员，裁判员向上海嘉定汇龙23号出示红牌罚令出场，并向广东广州豹42号出示黄牌。","appeal":"上海嘉定汇龙俱乐部申诉意见认为：本方发任意球时，对方队员未退出规定距离，之后本方23号队员踢任意球将球踢在对方未退出规定距离的队员身上，本方23号不应被出示红牌或黄牌。","conclusion":"对于此判例，评议组多数成员认为：上海嘉定汇龙23号队员故意将球踢向对方队员，且力度较大，裁判员依据暴力行为向其出示红牌罚令出场的决定应予支持；因延误比赛恢复为由向广东广州豹42号出示黄牌的决定正确。","videos":["2025/i28c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251001/1759321602266812.mov"],"category":"sfp_vc","tags":["红牌","暴力行为"],"v":"correct","var":"none"},{"seq":201,"issue":28,"no":6,"comp":"女超联赛","round":"第22轮","home":"北京东方雨虹女足","away":"辽宁沈北禾丰女足","minute":"26","match_info":"女超联赛第22轮，北京东方雨虹女足VS辽宁沈北禾丰女足","desc":"判例六：女超联赛第22轮，北京东方雨虹女足VS辽宁沈北禾丰女足。比赛第26分钟，辽宁沈北禾丰30号队员在进攻中在对方罚球区内与北京东方雨虹5号队员接触后倒地，裁判员未判罚犯规。","appeal":"辽宁沈北禾丰女足申诉意见认为：对方5号队员对本方30号队员犯规。","conclusion":"对于此判例，评议组多数成员认为：北京东方雨虹5号队员防守过程中以争抢球为目的，且无犯规动作，辽宁沈北禾丰30号队员触球后造成双方的接触。裁判员未判罚犯规的决定正确。","videos":["2025/i28c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251001/1759321635354232.mov"],"category":"penalty_area","tags":[],"v":"correct","var":"none"},{"seq":202,"issue":28,"no":7,"comp":"女超联赛","round":"第22轮","home":"北京东方雨虹女足","away":"辽宁沈北禾丰女足","minute":"29","match_info":"女超联赛第22轮，北京东方雨虹女足VS辽宁沈北禾丰女足","desc":"判例七：女超联赛第22轮，北京东方雨虹女足VS辽宁沈北禾丰女足。比赛第29分钟，北京东方雨虹16号队员带球进入对方罚球区并与辽宁沈北禾丰14号队员接触后倒地，裁判员判辽宁队14号犯规，判罚球点球并出示黄牌警告辽宁队14号。","appeal":"辽宁沈北禾丰女足申诉意见认为：本方14号与对方16号接触地点在罚球区外，且为正常身体接触，不应被判罚球点球。","conclusion":"对于此判例，评议组一致认为：北京东方雨虹16号队员带球突破时，辽宁沈北禾丰14号队员对其实施了拉扯犯规，犯规地点处于罚球区内，并且阻止了对方有希望的进攻。裁判员判罚球点球并向辽宁队14号出示黄牌的决定正确。","videos":["2025/i28c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251001/1759321671750464.mov"],"category":"penalty_area","tags":["点球","黄牌","拉扯"],"v":"correct","var":"none"},{"seq":203,"issue":28,"no":8,"comp":"女超联赛","round":"第22轮","home":"北京东方雨虹女足","away":"辽宁沈北禾丰女足","minute":"79","match_info":"女超联赛第22轮，北京东方雨虹女足VS辽宁沈北禾丰女足","desc":"判例八：女超联赛第22轮，北京东方雨虹女足VS辽宁沈北禾丰女足。比赛第79分钟，北京东方雨虹进攻中传中，其6号队员在对方罚球区与辽宁沈北禾丰8号队员争抢，之后北京队另一名队员射门进球，裁判员判进球有效。","appeal":"辽宁沈北禾丰女足申诉意见认为：对方6号在拼抢时犯规，导致后续进球。","conclusion":"对于此判例，评议组一致认为：从现有视频看，北京东方雨虹6号队员与辽宁沈北禾丰8号队员属于比赛中正常争抢球动作，支持裁判员未判罚犯规以及后续进球有效的决定。","videos":["2025/i28c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251001/1759321721114936.mov"],"category":"goal_decision","tags":["进球有效"],"v":"correct","var":"none"},{"seq":204,"issue":29,"no":1,"comp":"中超联赛","round":"第23轮","home":"大连英博","away":"青岛西海岸","minute":"61","match_info":"中超联赛第23轮，大连英博VS青岛西海岸","desc":"判例一：中超联赛第23轮，大连英博VS青岛西海岸。比赛第61分钟，青岛西海岸5号队员在本方罚球区内争抢球时与大连英博2号队员发生接触，裁判员判青岛西海岸5号犯规并判罚球点球，VAR介入，裁判员经在场回看后，取消了罚球点球的判罚。","appeal":"大连英博俱乐部申诉意见认为：对方5号对本方2号犯规，应判罚球点球，裁判员不应改判取消点球判罚。","conclusion":"对于此判例，评议组一致认为：双方争抢空中球时，青岛西海岸5号队员手臂或腿部没有明显犯规动作，从双方接触程度来看，不构成犯规。在裁判员初始判罚球点球的情况下，VAR介入正确，裁判员经在场回看后取消罚球点球的最终决定正确。","videos":["2025/i29c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251008/1759888738793977.mov"],"category":"penalty_area","tags":["点球","VAR介入正确"],"v":"correct","var":"correct"},{"seq":205,"issue":29,"no":2,"comp":"中超联赛","round":"第23轮","home":"大连英博","away":"青岛西海岸","minute":"86","match_info":"中超联赛第23轮，大连英博VS青岛西海岸","desc":"判例二：中超联赛第23轮，大连英博VS青岛西海岸。比赛第86分钟，大连英博16号队员在对方罚球区内带球进攻时与青岛西海岸36号队员发生接触并倒地。裁判员未判罚犯规，VAR介入，裁判员经在场回看后，维持不犯规的决定。","appeal":"大连英博俱乐部申诉意见认为：对方36号对本方16号犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：青岛西海岸36号队员对大连英博16号队员实施拉扯犯规，应判罚球点球。在裁判员初始未判罚犯规的情况下，VAR介入正确。裁判员经在场回看后维持不犯规的最终决定错误。","videos":["2025/i29c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251008/1759888826501915.mov"],"category":"penalty_area","tags":["点球","拉扯","VAR介入正确"],"v":"wrong","var":"correct"},{"seq":206,"issue":29,"no":3,"comp":"中甲联赛","round":"第25轮","home":"陕西联合","away":"上海嘉定汇龙","minute":"11","match_info":"中甲联赛第25轮，陕西联合vs上海嘉定汇龙，比赛第11分钟，陕西联合35号队员在本方罚球区内疑似手球，裁判员未判罚手球犯规","desc":"判例三：中甲联赛第25轮，陕西联合vs上海嘉定汇龙，比赛第11分钟，陕西联合35号队员在本方罚球区内疑似手球，裁判员未判罚手球犯规。","appeal":"上海嘉定汇龙俱乐部申诉意见认为：对方手球犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：陕西联合35号队员在本方罚球区内触球，触球的身体部位属于规则规定的手臂范围，且其手臂处于使身体不自然扩大的位置，应判罚手球犯规，并判罚球点球。裁判员决定错误，漏判罚球点球。","videos":["2025/i29c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251008/1759888871770005.mov"],"category":"handball","tags":["点球","手臂不自然扩大"],"v":"wrong","var":"none"},{"seq":207,"issue":29,"no":4,"comp":"中甲联赛","round":"第25轮","home":"广西平果","away":"重庆铜梁龙","minute":"60","match_info":"中甲联赛第25轮，广西平果vs重庆铜梁龙，比赛第60分钟，广西平果17号队员在对方罚球区内与对方队员争抢球后倒地，裁判员未判罚犯规，随后VAR与裁判员沟通后未介入","desc":"判例四：中甲联赛第25轮，广西平果vs重庆铜梁龙，比赛第60分钟，广西平果17号队员在对方罚球区内与对方队员争抢球后倒地，裁判员未判罚犯规，随后VAR与裁判员沟通后未介入。","appeal":"广西平果俱乐部申诉意见认为：对方犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：从现有视频看，重庆铜梁龙防守队员踢球时先触到了球，随后接触到对方队员，无犯规动作，不构成犯规。裁判员未判罚犯规的决定正确。VAR未介入正确。另外，转播画面显示，裁判员使用了对讲机与VAR联络沟通，在场回看区域中的屏幕也未显示比赛画面。对此，评议组作出说明：本场比赛中裁判员耳麦通讯系统受到了比赛现场附近电磁环境影响和干扰，无法正常通讯，在此情况下使用对讲机等其他设备与其他比赛官员沟通，符合VAR操作有关要求，对讲机等通讯设备也属于使用VAR的比赛中必备的备用通讯设备。VAR在与裁判员建立通讯联络并沟通后，决定不介入该判罚（其标志为裁判员未作出“电视信号”手势），在此情况下在场回看区域中的屏幕不显示回看画面，仅显示赛事标识（并非有些报道所称“黑屏”），属于正常和正确情况，屏幕及画面信号并未出现故障。","videos":["2025/i29c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251008/1759889024190991.mov"],"category":"penalty_area","tags":["铲球先触球","通讯程序说明"],"v":"correct","var":"correct"},{"seq":208,"issue":29,"no":5,"comp":"中甲联赛","round":"第25轮","home":"广西平果","away":"重庆铜梁龙","minute":"50","match_info":"中甲联赛第25轮，广西平果vs重庆铜梁龙，比赛第50分钟，重庆铜梁龙16号队员在边线附近对广西平果10号队员犯规，后者与场外LED广告展示设备接触后倒地，后被救护车送往医院","desc":"判例五：中甲联赛第25轮，广西平果vs重庆铜梁龙，比赛第50分钟，重庆铜梁龙16号队员在边线附近对广西平果10号队员犯规，后者与场外LED广告展示设备接触后倒地，后被救护车送往医院。裁判员判重庆铜梁龙16号犯规并出示黄牌警告，VAR未介入。","appeal":"广西平果俱乐部申诉意见认为：对方队员实施了非体育行为导致本方队员受重伤。","conclusion":"对于此判例，评议组多数成员认为：重庆铜梁龙16号队员的犯规属于鲁莽犯规的程度，尚未达到严重犯规或暴力行为的程度，不应被出示红牌，广西平果10号队员受伤有意外成分。裁判员判重庆铜梁龙16号犯规并出示黄牌的决定正确。另外，经向中足联有关方面了解，本场比赛场外LED广告展示设备摆放的位置以及与比赛场地边线间的距离（3米），符合足球赛事的国际标准以及中甲联赛有关规程要求。","videos":["2025/i29c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251008/1759889061289433.mov"],"category":"sfp_vc","tags":["黄牌","红牌不成立"],"v":"correct","var":"none"},{"seq":209,"issue":30,"no":1,"comp":"中超联赛","round":"第27轮","home":"青岛海牛","away":"上海海港","minute":"16","match_info":"中超联赛第27轮，青岛海牛VS上海海港，比赛第16分钟，青岛海牛60号队员在对方罚球区内与上海上港1号守门员争抢后倒地，裁判员初始判上海海港1号守门员犯规，并判罚球点球","desc":"判例一：中超联赛第27轮，青岛海牛VS上海海港，比赛第16分钟，青岛海牛60号队员在对方罚球区内与上海上港1号守门员争抢后倒地，裁判员初始判上海海港1号守门员犯规，并判罚球点球。VAR随之介入。裁判员经在场回看后，取消罚球点球，改判青岛海牛队60号佯装（假摔），并向其出示黄牌警告。","appeal":"青岛海牛俱乐部申诉意见认为：对方守门员对本方60号犯规，应被判罚球点球；不应判本方60号假摔并出示黄牌。","conclusion":"对于此判例，评议组首先一致认为：从视频中看，双方脚部接触轻微，并非青岛海牛60号队员倒地的主要原因，上海海港1号守门员不构成犯规，裁判员在场回看后取消罚球点球的最终决定正确。其次评议组多数成员认为：青岛海牛60号在双方接触前已有主动曲腿的动作以及佯装被犯规的意图，支持裁判员以佯装（假摔）为由向其出示黄牌警告的决定。","videos":["2025/i30c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251022/1761140849941089.mp4"],"category":"simulation","tags":["假摔","黄牌","VAR介入正确"],"v":"correct","var":"correct"},{"seq":210,"issue":30,"no":2,"comp":"中乙联赛","round":"第28轮","home":"杭州临平吴越","away":"广东铭途","minute":"76","match_info":"中乙联赛第28轮，杭州临平吴越VS广东铭途","desc":"判例二：中乙联赛第28轮，杭州临平吴越VS广东铭途。比赛第76分钟，广东铭途9号队员在对方罚球区内与对方队员争抢头球后倒地，裁判员示未判罚犯规。","appeal":"广东铭途俱乐部申诉意见认为：本方9号队员率先争抢到头球，对方队员对本方9号犯规，裁判员应判罚球点球。","conclusion":"对于此判例，评议组多数成员认为：广东铭途9号队员率先争抢到头球，杭州临平吴越队员构成跳向对方队员的草率犯规，应判罚球点球。裁判员决定错误，漏判犯规和罚球点球。","videos":["2025/i30c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251022/1761140890346598.mp4"],"category":"penalty_area","tags":["点球","跳向对方"],"v":"wrong","var":"none"},{"seq":211,"issue":30,"no":3,"comp":"中乙联赛","round":"第28轮","home":"山西崇德荣海","away":"昆明城星","minute":"89","match_info":"中乙联赛第28轮，山西崇德荣海VS昆明城星","desc":"判例三：中乙联赛第28轮，山西崇德荣海VS昆明城星。比赛第89分钟，双方在边线附近争抢后，昆明城星42号队员在比赛场地外疑似被山西崇德荣海球队官员踩踏。裁判员出示红牌将山西崇德荣海球队官员罚令出场，并向昆明城星42号出示黄牌警告。","appeal":"山西崇德荣海俱乐部申诉意见认为：对方42号队员在球已经离开比赛场地的情况下做出飞铲动作铲到本方教练员。本方教练员随后踩踏到对方42号队员属于自然反应，并非恶意动作，不应被出示红牌罚令出场。","conclusion":"对于此判例，评议组首先一致认为：山西崇德荣海球队官员在技术区域外对对方场上队员实施暴力行为，裁判员对其出示红牌罚令出场的决定正确。其次评议组多数成员认为：昆明城星42号队员在裁判员已经停止比赛的情况下做出争抢球动作，延误比赛恢复，并带有挑衅意味，裁判员向其出示黄牌的决定正确。","videos":["2025/i30c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251022/1761140928127974.mp4"],"category":"sfp_vc","tags":["红牌","球队官员","暴力行为"],"v":"correct","var":"none"},{"seq":212,"issue":31,"no":1,"comp":"中超联赛","round":"第28轮","home":"上海申花","away":"大连英博","minute":"23","match_info":"中超第28轮，上海申花VS大连英博，比赛第23分钟，大连英博16号队员进攻至前场，上海申花3号队员铲球，大连英博16号倒地，裁判员未判罚犯规","desc":"判例一：中超第28轮，上海申花VS大连英博，比赛第23分钟，大连英博16号队员进攻至前场，上海申花3号队员铲球，大连英博16号倒地，裁判员未判罚犯规。VAR未介入。","appeal":"大连英博俱乐部申诉意见认为：对方3号铲球犯规且破坏了本方明显的进球得分机会，应被出示红牌罚令出场。","conclusion":"对于此判例，评议组首先一致认为：上海申花3号队员的犯规，不构成严重犯规，也不符合破坏对方明显进球得分机会的判定标准，裁判员未出示红牌的主要决定正确。VAR未介入正确。其次，评议组一致认为：裁判员应判上海申花3号队员犯规，并以阻止对方有希望的进攻或鲁莽犯规为由，向其出示黄牌警告。","videos":["2025/i31c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251029/1761740751592440.mp4"],"category":"penalty_area","tags":["红牌不成立","DOGSO不成立","附应判犯规并黄牌"],"v":"correct","var":"correct"},{"seq":213,"issue":31,"no":2,"comp":"中超联赛","round":"第28轮","home":"上海申花","away":"大连英博","minute":"","match_info":"中超第28轮，上海申花VS大连英博，比赛第45+1分钟，大连英博踢角球，球传至上海申花罚球区内，大连英博2号队员头球，之后该队16号队员将球踢进对方球门，助理裁判员举旗示意越位，裁判员判大连英博越位犯规在先，进球无效","desc":"判例二：中超第28轮，上海申花VS大连英博，比赛第45+1分钟，大连英博踢角球，球传至上海申花罚球区内，大连英博2号队员头球，之后该队16号队员将球踢进对方球门，助理裁判员举旗示意越位，裁判员判大连英博越位犯规在先，进球无效。VAR未介入。","appeal":"大连英博俱乐部申诉意见认为：本方队员射门得分的队员不越位，进球应有效。","conclusion":"对于此判例，评议组一致认为：大连英博2号队员头顶球时，其15号队员处于越位位置，阻碍了上海申花守门员视线，并且做出试图触球的动作，影响了对方守门员处理球的能力，应判大连英博15号越位犯规，其队友后续进球无效。裁判员决定正确。VAR未介入正确。","videos":["2025/i31c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251029/1761740784262617.mp4"],"category":"offside","tags":["阻碍视线","进球无效"],"v":"correct","var":"correct"},{"seq":214,"issue":31,"no":3,"comp":"中超联赛","round":"第28轮","home":"上海申花","away":"大连英博","minute":"","match_info":"中超第28轮，上海申花VS大连英博，比赛第90+6分钟，上海申花踢角球，球传至大连英博罚球区内，上海申花15号队员与大连英博36号队员争顶头球并发生接触后倒地","desc":"判例三：中超第28轮，上海申花VS大连英博，比赛第90+6分钟，上海申花踢角球，球传至大连英博罚球区内，上海申花15号队员与大连英博36号队员争顶头球并发生接触后倒地。裁判员未判罚犯规。VAR介入。裁判员经在场回看后，改判大连英博36号犯规，判罚球点球并向其出示黄牌警告。","appeal":"大连英博俱乐部申诉意见认为：本方36号不犯规，裁判员不应改判罚球点球。","conclusion":"对于此判例，评议组首先一致认为：上海申花15号队员率先顶到球，大连英博36号队员使用头部顶撞对方，按照竞赛规则，构成犯规，裁判员在场回看后改判大连英博36号犯规并判罚球点球的最终决定正确。VAR介入正确。其次，评议组多数成员认为：大连英博36号犯规的严重程度属于鲁莽犯规，裁判员对其出示黄牌警告的决定正确。","videos":["2025/i31c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251029/1761740869432655.mp4"],"category":"penalty_area","tags":["点球","黄牌","VAR介入正确"],"v":"correct","var":"correct"},{"seq":215,"issue":31,"no":4,"comp":"中超联赛","round":"第28轮","home":"上海申花","away":"大连英博","minute":"","match_info":"中超第28轮，上海申花VS大连英博，比赛第90+16分钟，双方争抢球，裁判员鸣哨停止比赛后，上海申花10号队员疑似向倒地的大连英博40号队员有攻击性行为，裁判员未向上海申花10号出示红黄牌，VAR未介入","desc":"判例四：中超第28轮，上海申花VS大连英博，比赛第90+16分钟，双方争抢球，裁判员鸣哨停止比赛后，上海申花10号队员疑似向倒地的大连英博40号队员有攻击性行为，裁判员未向上海申花10号出示红黄牌，VAR未介入。","appeal":"大连英博俱乐部申诉意见认为：对方10号向本方倒地的40号队员具有攻击性行为，并且吐口水，应被红牌罚令出场。","conclusion":"对于此判例，评议组首先一致认为：通过现有视频画面，无法证实上海申花10号队员对倒地的大连英博40号队员是否有辱骂、吐口水等应予以红牌罚令出场的行为，因此评议组对于上海申花10号是否应被出示红牌罚令出场不予认定。\n其次，评议组指出，在无法确定上海申花10号队员是否有辱骂、吐口水等应予以红牌罚令出场的行为的前提下，其动作也构成非体育行为，应予以黄牌 ideo/20251029/1761741024887013.mp4"],"category":"penalty_area","tags":["进球有效"],"v":"correct","var":"correct"},{"seq":219,"issue":31,"no":8,"comp":"中超联赛","round":"第28轮","home":"武汉三镇","away":"深圳新鹏城","minute":"43","match_info":"中超第28轮，武汉三镇VS深圳新鹏城，比赛第43分钟，深圳新鹏城23号队员手臂接触武汉三镇22号队员头部，裁判员向深圳新鹏城23号出示红牌罚令出场","desc":"判例八：中超第28轮，武汉三镇VS深圳新鹏城，比赛第43分钟，深圳新鹏城23号队员手臂接触武汉三镇22号队员头部，裁判员向深圳新鹏城23号出示红牌罚令出场。VAR未介入。","appeal":"深圳新鹏城俱乐部申诉意见认为：本方23号手臂接触到对方队员头部，属于护球时的意外接触，不属于严重犯规或暴力行为，不应被出示红牌。","conclusion":"对于此判例，评议组一致认为：深圳新鹏城23号队员手臂明显挥动发力击打到对方队员面部，并非正常护球动作，应视为严重犯规。裁判员向深圳新鹏城23号出示红牌罚令出场的决定正确。VAR未介入正确。","videos":["2025/i31c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251029/1761741063795646.mp4"],"category":"sfp_vc","tags":["红牌","严重犯规","挥臂"],"v":"correct","var":"correct"},{"seq":220,"issue":31,"no":9,"comp":"全运会","round":"","home":"浙江俱乐部绿城","away":"山东","minute":"55","match_info":"中华人民共和国第十五届运动会足球项目男子U18组决赛阶段，浙江VS山东，比赛第55分钟，浙江队踢角球，之后传中至对方罚球区内并头球射门进球，助理裁判员举旗示意越位，裁判员判浙江队越位犯规在先，进球无效","desc":"判例九：中华人民共和国第十五届运动会足球项目男子U18组决赛阶段，浙江VS山东，比赛第55分钟，浙江队踢角球，之后传中至对方罚球区内并头球射门进球，助理裁判员举旗示意越位，裁判员判浙江队越位犯规在先，进球无效。","appeal":"浙江队申诉意见认为该越位判罚为错判。","conclusion":"对于此判例，评议组一致认为：浙江队头球进球的球员，在本队传中触球时并未处于越位位置，不是越位犯规，进球应有效。助理裁判员越位判断错误，裁判员判浙江队越位犯规、进球无效的决定错误。","videos":["2025/i31c09-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251029/1761741097532129.mp4"],"category":"offside","tags":["越位误判","进球有效"],"v":"wrong","var":"none"},{"seq":221,"issue":31,"no":10,"comp":"全运会","round":"","home":"浙江俱乐部绿城","away":"山东","minute":"87","match_info":"中华人民共和国第十五届运动会足球项目男子U18组决赛阶段，浙江VS山东，比赛第87分钟，浙江队在前场掷界外球，之后浙江队50号队员在对方罚球区内争抢头球并与对方队员接触后倒地，裁判员未判罚犯规","desc":"判例十：中华人民共和国第十五届运动会足球项目男子U18组决赛阶段，浙江VS山东，比赛第87分钟，浙江队在前场掷界外球，之后浙江队50号队员在对方罚球区内争抢头球并与对方队员接触后倒地，裁判员未判罚犯规。","appeal":"浙江队申诉意见认为：对方队员犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：在浙江队50号队员即将头顶球时，山东队队员从侧面对其实施冲撞犯规，导致其失去重心倒地，应判山东队犯规并判罚球点球。裁判员决定错误，漏判犯规和罚球点球。","videos":["2025/i31c10-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251029/1761741120499615.mp4"],"category":"penalty_area","tags":["点球","冲撞"],"v":"wrong","var":"none"},{"seq":222,"issue":32,"no":1,"comp":"中超联赛","round":"第29轮","home":"成都蓉城","away":"河南俱乐部","minute":"15","match_info":"中超联赛第29轮，成都蓉城VS河南俱乐部","desc":"判例一：中超联赛第29轮，成都蓉城VS河南俱乐部。比赛第15分钟，双方队员在河南队罚球区附近争抢头球后，裁判员判河南队队员手球犯规，随后成都蓉城进球。裁判员判进球无效，由成都蓉城踢直接任意球恢复比赛，VAR未介入。","appeal":"成都蓉城俱乐部申诉意见认为：裁判员鸣哨时间晚于本方射门时间，应判进球有效。","conclusion":"对于此判例，评议组一致认为：在双方队员争抢头球时，成都蓉城队队员率先起跳并争抢到头球，其手臂与对方队员的接触不构成犯规。之后球接触了河南俱乐部队员张开并高于肩部的手臂，应视为手球犯规，但随即成都蓉城队获得了很好的射门得分机会，此时裁判员应掌握有利条款，使比赛继续进行，不应判罚手球犯规。此判例中，裁判员在进球前已经鸣哨停止比赛，不能再判进球有效，因此做出了由成都蓉城踢任意球恢复比赛的决定。另外，此情况不符合规则规定的介入原则，因此VAR无法介入。此球评议组认定为裁判员判罚决定错误，VAR不介入正确。","videos":["2025/i32c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251105/1762353385647450.mp4"],"category":"goal_decision","tags":["有利条款","手球","VAR不介入正确"],"v":"wrong","var":"correct"},{"seq":223,"issue":32,"no":2,"comp":"中超联赛","round":"第29轮","home":"成都蓉城","away":"河南俱乐部","minute":"48","match_info":"中超联赛第29轮，成都蓉城VS河南俱乐部","desc":"判例二：中超联赛第29轮，成都蓉城VS河南俱乐部。比赛第48分钟，成都蓉城队传中，球疑似接触河南俱乐部11号队员臂部，裁判员未判罚手球犯规，VAR未介入。","appeal":"成都蓉城俱乐部申诉意见认为：对方11号手球犯规。","conclusion":"对于此判例，评议组多数成员认为：成都蓉城队传中时，河南俱乐部11号手臂从身体背后的位置，向球运行的方向移动至非自然位置，且从现有视频画面中判断，球接触了河南俱乐部11号手臂，因此应视为手球犯规，并判罚球点球。VAR应介入。裁判员决定错误，漏判手球犯规和罚球点球。VAR未介入错误。","videos":["2025/i32c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251105/1762353420483565.mp4"],"category":"handball","tags":["点球","手向球移动","VAR未介入错误"],"v":"wrong","var":"wrong"},{"seq":224,"issue":32,"no":3,"comp":"中甲联赛","round":"第29轮","home":"广西平果","away":"上海嘉定汇龙","minute":"59","match_info":"中甲联赛第29轮，广西平果VS上海嘉定汇龙","desc":"判例三：中甲联赛第29轮，广西平果VS上海嘉定汇龙。比赛第59分钟，上海嘉定汇龙队员射门，广西平果守门员在本方球门内的球门线附近将球踢出，裁判员未判进球，VAR未介入。","appeal":"上海嘉定汇龙俱乐部申诉意见认为：本方射门后球已越过球门线，应为进球得分。","conclusion":"对于此判例，评议组多数成员认为：从现有视频无法判断球是否整体越过了球门线，评议组对此判例不予认定。","videos":["2025/i32c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251105/1762353453358645.mp4"],"category":"goal_decision","tags":["球门线","证据不足"],"v":"pending","var":"none"},{"seq":225,"issue":32,"no":4,"comp":"中甲联赛","round":"第29轮","home":"广西平果","away":"上海嘉定汇龙","minute":"78","match_info":"中甲联赛第29轮，广西平果VS上海嘉定汇龙","desc":"判例四：中甲联赛第29轮，广西平果VS上海嘉定汇龙。比赛第78分钟，广西平果5号队员与上海嘉定汇龙9号队员在中场区域争抢，双方倒地，上海嘉定汇龙9号使用手臂接触广西平果队5号。裁判员初始未判罚犯规，VAR介入，裁判员经在场回看后，向上海嘉定汇龙9号出示红牌罚令出场。","appeal":"上海嘉定汇龙俱乐部申诉意见认为：本方9号起身时无意击打到对方队员，不应被出示红牌。","conclusion":"对于此判例，首先，评议组多数成员认为：双方队员起身过程中相互距离很近，上海嘉定汇龙9号队员有主动挥臂的动作，但综合其动作的力度和接触情况看，不构成暴力行为，不应出示红牌，应视为非体育行为并出示黄牌警告。其次，评议组一致认为：广西平果5号队员在争抢和倒地过程中持续拉扯抱摔对方队员，也应因非体育行为被出示黄牌警告。裁判员决定错误，错判上海嘉定汇龙9号红牌，漏判广西平果5号黄牌。VAR介入错误。","videos":["2025/i32c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251105/1762353480944268.mp4"],"category":"sfp_vc","tags":["红牌","黄牌","暴力行为不成立","VAR介入错误"],"v":"wrong","var":"wrong"},{"seq":226,"issue":32,"no":5,"comp":"全运会","round":"","home":"新疆","away":"山东","minute":"54","match_info":"中华人民共和国第十五届运动会男子足球项目U20组决赛阶段，新疆VS山东","desc":"判例五：中华人民共和国第十五届运动会男子足球项目U20组决赛阶段，新疆VS山东。比赛第54分钟，山东队进攻中从左路传中，处在新疆队罚球区内的山东队9号队员跳起争抢，未触球，随后山东队32号队员射门进球。裁判员在与助理裁判员沟通后，判进球有效。","appeal":"新疆代表队申诉意见认为：对方传中时其9号队员处于越位位置，之后干扰了本方守门员，应判对方9号越位犯规，后续进球无效。","conclusion":"对于此判例，评议组多数成员认为：山东队传中瞬间，其9号队员处于越位位置，并试图触球，影响了对方守门员对球的判断和反应，应视为处于越位位置并干扰对方队员的越位犯规。另外，国际足联裁判专家也对该判例给出了相同的认定意见。综上，评议组认定此判例为越位犯规，进球无效。裁判员判进球有效的决定错误。","videos":["2025/i32c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251105/1762353502823138.mp4"],"category":"offside","tags":["进球无效","干扰对方队员"],"v":"wrong","var":"none"},{"seq":227,"issue":32,"no":6,"comp":"全运会","round":"","home":"云南","away":"河北","minute":"55","match_info":"中华人民共和国第十五届运动会男子足球项目U20组决赛阶段，云南VS河北","desc":"判例六：中华人民共和国第十五届运动会男子足球项目U20组决赛阶段，云南VS河北。比赛第55分钟，河北队进攻中向前传球至云南队罚球区附近，双方队员争抢球，河北队队员倒地，裁判员未判罚犯规。","appeal":"河北代表队申诉意见认为：在对方罚球区内，对方队员对本方队员犯规，应判罚球点球。","conclusion":"对于此判例，评议组多数成员认为：从现有视频看，双方应为正常身体接触。裁判员、助理裁判员、附加助理裁判员观察位置较好，支持裁判员未判罚犯规的决定。","videos":["2025/i32c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20251105/1762353522982740.mp4"],"category":"penalty_area","tags":[],"v":"corr gories":[{"id":"handball","name":"手球犯规","icon":"✋"},{"id":"offside","name":"越位","icon":"🚩"},{"id":"penalty_area","name":"罚球区内判罚（点球）","icon":"⭕"},{"id":"freekick_foul","name":"罚球区外一般犯规","icon":"🦵"},{"id":"spa_tactical","name":"战术犯规与SPA","icon":"🧲"},{"id":"dogso","name":"破坏明显进球得分机会（DOGSO）","icon":"🎯"},{"id":"sfp_vc","name":"严重犯规与暴力行为","icon":"🟥"},{"id":"simulation","name":"假摔与欺骗行为","icon":"🎭"},{"id":"goal_decision","name":"进球判定与有利条款","icon":"🥅"},{"id":"other_program","name":"程序与其他","icon":"📐"}],"notes":{"handball":"统一尺度要点：①判定手球犯规的核心是「手臂是否使身体不自然扩大」以及「是否手向球移动」；手臂处于动作下的自然位置、近距离反弹、意外触球不构成犯规。②手臂范围以腋窝下沿为界。③守方在本方罚球区内手球→罚球点球；手球阻止对方射门（有希望的进攻）但非故意（手未向球移动）→点球且无需红黄牌；故意手球破坏进球或明显得分机会→红牌。④手球队员紧接着进球无效，但队友随后进球有效（手球未立即获益的意外手球不判罚）。","offside":"统一尺度要点：①越位位置以头、躯干（不含手臂）更接近对方球门线为准。②越位犯规三种情形：干扰比赛（触球）、干扰对方队员（明显影响对方处理球能力、阻挡视线、争抢中影响守门员）、利用越位位置获利。③守方「有意触球」后才重置越位——受限触球（来不及调整身体的解围）、折射不算有意触球，不重置。④每次攻方新的触球后越位判定重新计算（越位重置）。⑤VAR越位划线：关键帧选择→有效身体部位选择→落线比对，任一环节错误划线结论即不成立。","penalty_area":"统一尺度要点：①罚球区内点球判罚三问：有无犯规动作（绊摔、推、拉、踢、冲撞）？接触是否达到草率以上？是否属正常争抢/意外接触？②守方先触球且动作合理、轻微接触不影响控球、攻方主动倒地夸大接触→不判点球。③罚球区线属于罚球区内；犯规地点需有清晰证据支持改判。④判罚点球本身不附带红黄牌，除非同时构成SPA、DOGSO或严重犯规。⑤VAR回看改判取消点球后，若球未出界应以坠球恢复（而非角球）。","freekick_foul":"统一尺度要点：直接任意球犯规（踢、绊、推、拉、冲撞、跳向、铲球）按「草率—鲁莽—过分用力」三档把握纪律尺度：草率犯规不出示牌；鲁莽犯规黄牌警告；过分用力危及对方安全为严重犯规红牌。以危险方式比赛（如争抢高球时抬脚过高危及对方）判间接任意球。","spa_tactical":"统一尺度要点：破坏有希望的进攻（SPA）→黄牌。判断要素：犯规地点与对方球门的距离、进攻方向、控球或控球可能性、防守队员人数与位置。拉扯、抱拽、背后冲撞、鲁莽冲撞破坏快攻/突破均属典型战术犯规。","dogso":"统一尺度要点：破坏明显进球得分机会（DOGSO）四要素：①犯规地点与球门距离；②进攻大致朝向球门；③控球或可争得控球；④防守队员人数与位置（通常含守门员在内仅一名防守队员时成立）。以争抢球为目的且判罚球点球→黄牌；否则红牌。守门员在罚球区外犯规破坏明显得分机会→红牌。拉扯、推搡同样可构成DOGSO。","sfp_vc":"统一尺度要点：①严重犯规（SFP）：争抢球中使用过分力量或野蛮方式危及对方安全——鞋钉蹬踹、直腿踩踏小腿跟腱、飞铲、抬脚触头等。②暴力行为（VC）：非争抢球时（或球不在可争抢范围时）击打、挥拳、肘击头面部；比赛停止时的攻击性行为同样可罚；「试图击打」即使未触及也属暴力行为。③挥臂接触但未达过分力量的，按鲁莽犯规黄牌处理。④轻微触碰面部示意对方起身，不构成暴力行为。","simulation":"统一尺度要点：佯装被犯规（假摔）、夸大接触程度、挑衅与欺骗行为→以非体育行为黄牌警告。接触轻微且未影响平衡的主动倒地，既不判对方犯规，也应警示佯装行为。","goal_decision":"统一尺度要点：①进球前提：球整体越过球门线，且进球前攻方无犯规（推搡、拉扯、冲撞守门员等）；裁判员鸣哨停止比赛后的进球无效。②有利条款：被犯规方即将形成明显进球得分机会时，必须掌握有利让进攻完成后再处理犯规——不可提前鸣哨剥夺进球机会；守门员犯规球即将进门时同样先掌握有利。③球出界（整体离开比赛场地）判定：助理裁判员应延迟举旗、裁判员延迟鸣哨，给VAR保留介入空间。","other_program":"统一尺度要点：①VAR介入原则：仅限清晰明显的错漏判以及严重事件（红牌、点球、进球、认错人）；VAR查看≠介入，介入的标志是裁判员做出「电视信号」手势；VAR介入后裁判员可不回看而直接采纳结论，但仍须做出电视手势。②裁判员选位跑位影响判罚质量，虽不构成改判依据，但应持续改进。③耳麦通讯受干扰时，对讲机等备用通讯设备的使用符合VAR操作要求。④球队官员在技术区域外实施暴力行为可被红牌罚令出场。"},"issueNotes":{"9":"本期标题认定6例，其中判例三为VAR越位划线错误（评议组对裁判员判定不予认定），本合集计入VAR错误统计。","26":"本期判例七（头撞事件）当期未认定，第27期补充认定为漏判红牌；本合集将该错漏判随原判例计入第26期。","27":"本期文章的认定1例为对第26期判例七的补充认定（已计入第26期）；本期新增判例二经评议为支持原判。"},"verdictNames":{"wrong":"错漏判","correct":"支持原判","pending":"不予认定"},"varNames":{"correct":"VAR正确","wrong":"VAR错误","none":""},"built":"2026-09-25"};
const CATS = DATA.categories;
const VN = {wrong:"错漏判", correct:"支持原判", pending:"不予认定"};
const VICON = {wrong:"❌", correct:"✅", pending:"⚪"};
const VCLS = {wrong:"b-wrong", correct:"b-correct", pending:"b-pending"};
const bySeq = {};
DATA.cases.forEach(c => bySeq[c.seq] = c);
// 必须在applyFilter的自动选中改写hash之前捕获初始锚点
const initialHashSeq = (location.hash.match(/^#case-(\d+)$/)||[])[1];

// ---------- 收藏与笔记（localStorage 持久化，键按赛季隔离） ----------
const CFG = DATA.cfg;
const FAV_KEY = CFG.favKey, NOTE_KEY = CFG.noteKey;
const TAG_PRESETS = ["精选", "有疑问", "尺度标杆", "易错点", "课堂讨论"];
let fav = {}, notes = {};
try { fav = JSON.parse(localStorage.getItem(FAV_KEY) || "{}") || {}; } catch(_) { fav = {}; }
try { notes = JSON.parse(localStorage.getItem(NOTE_KEY) || "{}") || {}; } catch(_) { notes = {}; }
function persistFav() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(fav));
        localStorage.setItem(NOTE_KEY, JSON.stringify(notes)); } catch(_) {}
}
function isFav(seq) { return !!fav[seq]; }
function hasNote(seq) { return !!(notes[seq] && notes[seq].text && notes[seq].text.trim()); }
function crest(team, h) {
  const item = DATA.teams && DATA.teams[team];
  if (!item) return `<span class="team-badge" title="${esc(team)}：未登记">?</span>`;
  if (item.status === "verified" && item.path)
    return `<img class="crest" style="height:${h}px" src="${item.path}" alt="${esc(team)}队徽">`;
  const scale = Math.max(16, h);
  return `<span class="team-badge" style="width:${scale}px;height:${scale}px;--badge-fg:${item.fg};--badge-bg:${item.bg}" title="${esc(team)}：文字徽章（队徽待核验）" aria-label="${esc(team)}文字徽章">${esc(item.initials)}</span>`;
}

// 预聚合搜索串
for (const c of DATA.cases) {
  const match = [c.comp, c.round, (c.home&&c.away)?`${c.home} VS ${c.away}`:"", c.minute?`第${c.minute}分钟`:""]
    .filter(Boolean).join(" · ");
  c.search = (match+" "+c.desc+" "+c.appeal+" "+c.conclusion+" "+(c.tags||[]).join(" ")).toLowerCase();
}

// ---------- 侧栏 ----------
const catCount = {}, catWrong = {};
for (const c of DATA.cases) {
  catCount[c.category] = (catCount[c.category]||0)+1;
  if (c.v==="wrong") catWrong[c.category] = (catWrong[c.category]||0)+1;
}
const verCount = {all:DATA.cases.length, wrong:0, correct:0, pending:0};
for (const c of DATA.cases) verCount[c.v]++;

document.getElementById("totalBadge").textContent =
  `${DATA.cases.length}例 · 错漏判${verCount.wrong} · 支持原判${verCount.correct}`;
const badge = document.getElementById("totalBadge");
badge.style.cursor = "pointer";
badge.title = "点击查看分类统计总表";
badge.onclick = ()=>openModal("modalStats");
document.getElementById("catList").innerHTML =
  `<button class="cat-item on" data-cat=""><span class="nm">全部分类</span><b>${DATA.cases.length}</b></button>` +
  CATS.filter(k=>catCount[k.id]).map(k=>
    `<button class="cat-item" data-cat="${k.id}"><span class="nm">${k.icon} ${k.name}</span>` +
    `<b>${catCount[k.id]}</b><small>错${catWrong[k.id]||0}</small></button>`).join("");
document.getElementById("verList").innerHTML =
  `<button class="ver-item on" data-v=""><span class="vdot" style="background:#94a3b8"></span><span class="nm">全部判定</span><b>${verCount.all}</b></button>` +
  `<button class="ver-item" data-v="wrong"><span class="vdot" style="background:var(--red)"></span><span class="nm">❌ 错漏判</span><b>${verCount.wrong}</b></button>` +
  `<button class="ver-item" data-v="correct"><span class="vdot" style="background:#3a9d55"></span><span class="nm">✅ 支持原判</span><b>${verCount.correct}</b></button>` +
  `<button class="ver-item" data-v="pending"><span class="vdot" style="background:#d9a514"></span><span class="nm">⚪ 不予认定</span><b>${verCount.pending}</b></button>`;

// ---------- 状态与筛选 ----------
const state = {cat:"", v:"", issue:"", q:"", sel:null, vIdx:0, fav:null,
               comp:"", team:""};
const fSearch = document.getElementById("fSearch");

const COMP_ORDER = [["中超联赛","中超"],["中甲联赛","中甲"],["中乙联赛","中乙"],
                    ["女超联赛","女超"],["女甲联赛","女甲"],["中国足协杯","足协杯"],
                    ["全运会","全运会"],["三大球运动会","三大球"]];
const COMP_SHORT = Object.fromEntries(COMP_ORDER);
const teamComps = {};
for (const c of DATA.cases) {
  for (const t of new Set([c.home, c.away].filter(Boolean))) {
    (teamComps[t] = teamComps[t] || new Set()).add(c.comp);
  }
}
function teamBadge(t){
  return crest(t, 18);
}

// 除 skip 维度外的全部筛选（用于分面计数；skip 可为字符串或数组）
function baseMatch(c, skip){
  skip = Array.isArray(skip) ? skip : (skip ? [skip] : []);
  const sk = k => skip.includes(k);
  if (!sk("cat") && state.cat && c.category!==state.cat) return false;
  if (!sk("v") && state.v && c.v!==state.v) return false;
  if (!sk("issue") && state.issue && String(c.issue)!==state.issue) return false;
  if (!sk("comp") && state.comp && c.comp!==state.comp) return false;
  if (!sk("team") && state.team && c.home!==state.team && c.away!==state.team) return false;
  if (!sk("fav")){
    if (state.fav==="all" && !isFav(c.seq)) return false;
    if (state.fav==="note" && !hasNote(c.seq)) return false;
    if (state.fav && state.fav.startsWith("tag:")) {
      const t = state.fav.slice(4);
      if (!(fav[c.seq] && (fav[c.seq].tags||[]).includes(t))) return false;
    }
  }
  if (!sk("q")){ const q=state.q.trim().toLowerCase(); if(q && !c.search.includes(q)) return false; }
  return true;
}

function visibleCases(){
  return DATA.cases.filter(c => baseMatch(c, null));
}

// ---------- 侧栏：赛事/球队/期数（计数随其他筛选联动） ----------
function renderSidebar(){
  document.getElementById("compList").innerHTML =
    `<button class="cat-item ${state.comp===""?"on":""}" data-comp=""><span class="nm">全部赛事</span><b>${DATA.cases.filter(c=>baseMatch(c,["comp","team"])).length}</b></button>` +
    COMP_ORDER.map(([full,short])=>{
      const n = DATA.cases.filter(c=>baseMatch(c,["comp","team"]) && c.comp===full).length;
      return {full, short, n};
    }).filter(x=>x.n>0 || state.comp===x.full)
      .map(x=>`<button class="cat-item ${state.comp===x.full?"on":""}" data-comp="${x.full}"><span class="nm">${x.short}</span><b>${x.n}</b></button>`).join("");
  const teams = {};
  for (const c of DATA.cases) {
    if (!baseMatch(c,"team")) continue;
    if (state.comp && c.comp!==state.comp) continue;
    for (const t of new Set([c.home,c.away].filter(Boolean))) teams[t]=(teams[t]||0)+1;
  }
  document.getElementById("teamList").innerHTML =
    Object.entries(teams).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([t,n])=>
      `<button class="cat-item ${state.team===t?"on":""}" data-team="${esc(t)}">${teamBadge(t)}<span class="nm">${esc(t)}</span><b>${n}</b></button>`).join("") ||
    `<div style="font-size:12.5px;color:var(--muted);padding:6px 8px">该赛事下无判例</div>`;
  document.getElementById("issueList").innerHTML =
    Array.from({length:CFG.issueCount},(_,k)=>k+1).map(i=>{
      const n = DATA.cases.filter(c=>baseMatch(c,"issue") && String(c.issue)===String(i)).length;
      return `<button class="cat-item ${String(state.issue)===String(i)?"on":""}" data-issue="${i}"><span class="nm">第${i}期</span><b>${n}</b></button>`;
    }).join("");
}

function renderList(){
  const list = visibleCases();
  const issueTitle = document.getElementById("issueTitle");
  if (state.issue) {
    const iss = DATA.issues[state.issue];
    issueTitle.innerHTML = `第${state.issue}期 · ${esc(iss.title)} · ${iss.date.slice(0,4)}-${iss.date.slice(4,6)}-${iss.date.slice(6,8)}发布 · `;
  } else {
    issueTitle.innerHTML = "";
  }
  document.getElementById("shownCount").textContent = list.length;
  const groups = {};
  list.forEach(c => (groups[c.category] = groups[c.category]||[]).push(c));
  const rows = CATS.filter(k=>groups[k.id]).map(k =>
    `<div class="ph">${k.icon} ${k.name} <b>${groups[k.id].length}例</b></div>` +
    groups[k.id].map(c=>{
      const short = (c.comp||"").replace("联赛","");
      const varChip = c.var==="none" ? "" :
        `<span class="rv ${c.var==="wrong"?"bad":""}">V${c.var==="wrong"?"✗":"✓"}</span>`;
      return `<div class="prow ${state.sel===c.seq?"sel":""}" data-seq="${c.seq}">
        <span class="dot ${c.v}"></span>
        <span class="ptxt"><b>${crest(c.home,16)}${esc(c.home)} <span style="color:var(--muted);font-weight:400">vs</span> ${crest(c.away,16)}${esc(c.away)}</b>
        <i><span class="p-source">${esc(short)}${c.round?esc(c.round):""}${c.minute?" · 第"+c.minute+"分钟":""}</span> · <span class="p-case-id">第${c.issue}期-判例${c.no}</span> · <span class="p-verdict">${VN[c.v]}</span></i></span>
        <span class="pmark">${isFav(c.seq)?"★":""}${hasNote(c.seq)?"📝":""}</span>
        ${varChip}</div>`;
    }).join("")).join("");
  document.getElementById("plistRows").innerHTML = rows ||
    `<div class="plist-empty">没有符合条件的判例，请调整筛选。</div>`;
}

function applyFilter(){
  renderSidebar();
  renderFavList();
  renderList();
  const list = visibleCases();
  if (!list.some(c=>c.seq===state.sel)) {
    if (list.length) select(list[0].seq, false); else clearDetail();
  }
}

function clearDetail(){
  state.sel = null;
  document.getElementById("dcard").style.display = "none";
  document.getElementById("detailEmpty").style.display = "flex";
  const v = document.getElementById("dvid");
  try{ v.pause(); }catch(_){}
  v.removeAttribute("src"); v.load();
}

function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

// ---------- 选中判例 ----------
function select(seq, scrollRow=true){
  const c = bySeq[seq]; if (!c) return;
  if (window.matchMedia && window.matchMedia("(max-width:900px)").matches)
    document.body.classList.add("detail-open");
  state.sel = seq;
  const iss = DATA.issues[c.issue];
  document.getElementById("detailEmpty").style.display = "none";
  document.getElementById("dcard").style.display = "block";
  const match = [c.comp, c.round, (c.home&&c.away)?`${c.home} VS ${c.away}`:"", c.minute?`第${c.minute}分钟`:""]
    .filter(Boolean).join(" · ");
  const matchHTML = match
    .replace(c.home, `${crest(c.home,22)}${esc(c.home)}`)
    .replace(c.away, `${crest(c.away,22)}${esc(c.away)}`);
  const varBadge = c.var==="none" ? "" :
    `<span class="badge b-var ${c.var==="wrong"?"bad":""}">VAR${c.var==="wrong"?"错误":"正确"}</span>`;
  document.getElementById("dHead").innerHTML =
    `<span class="cid">第${c.issue}期 · 判例${c.no}</span>
     <span class="badge ${VCLS[c.v]}">${VICON[c.v]} ${VN[c.v]}</span>${varBadge}
     <button class="favbtn ${isFav(c.seq)?"on":""}" id="favBtn" title="收藏该判例">${isFav(c.seq)?"★ 已收藏":"☆ 收藏"}</button>
     <h2 class="match">${matchHTML}</h2>`;
  renderFavUI(c);
  renderNoteUI(c);
  // 视频（唯一播放器，切换即替换）
  state.vIdx = 0;
  const vid = document.getElementById("dvid");
  try{ vid.pause(); }catch(_){}
  vid.src = "videos/" + c.videos[0];
  const vsr = document.getElementById("vswRow");
  if (c.videos.length > 1) {
    vsr.style.display = "flex";
    vsr.innerHTML = c.videos.map((f,i)=>
      `<button class="vsw ${i===0?"on":""}" data-i="${i}">${/-(2|3)\.mp4$/.test(f)&&i>0?"补充角度":"视频"+(i+1)}</button>`).join("");
  } else { vsr.style.display = "none"; vsr.innerHTML = ""; }
  document.getElementById("dNote").textContent =
    c.videos.length>1 ? "同判例存在多个角度视频，可切换：" : "";
  // 正文
  document.getElementById("dText").innerHTML =
    `<p>${esc(c.desc.replace(/^判例[一二三四五六七八九十百]+[：:]/,"").trim())}</p>` +
    (c.appeal?`<p><span class="lbl">申诉意见：</span>${esc(c.appeal.replace(/^[^：]*申诉意见认为：/,"").trim())}</p>`:"") +
    `<p class="concl"><span class="lbl">评议组认定：</span>${esc(c.conclusion
      .replace(/^对于此判[例罚]，评议组[^：]*认为：/,"").trim())}</p>`;
  const catMeta = CATS.find(k=>k.id===c.category);
  document.getElementById("dCatNote").querySelector("summary").textContent =
    `📏 ${catMeta ? catMeta.name : ""} · 统一尺度要点`;
  document.getElementById("dCatNote").querySelector("div").textContent =
    DATA.notes[c.category] || "";
  document.getElementById("dTags").innerHTML =
    (c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  document.getElementById("dFoot").innerHTML =
    `来源：<a href="${iss.url}" target="_blank" rel="noopener">${esc(iss.title)}</a>（${iss.date.slice(0,4)}-${iss.date.slice(4,6)}-${iss.date.slice(6,8)}发布）`;
  document.getElementById("detail").scrollTop = 0;
  // 列表高亮
  document.querySelectorAll(".prow.sel").forEach(e=>e.classList.remove("sel"));
  const row = document.querySelector(`.prow[data-seq="${seq}"]`);
  if (row && scrollRow) row.scrollIntoView({block:"nearest"});
  if (row) row.classList.add("sel");
  history.replaceState(null, "", "#case-"+seq);
}

function step(dir){
  const list = visibleCases();
  if (!list.length) return;
  let i = list.findIndex(c=>c.seq===state.sel);
  i = i<0 ? 0 : Math.min(list.length-1, Math.max(0, i+dir));
  select(list[i].seq);
}

// ---------- 收藏与笔记 ----------
function toggleFav(seq){
  const c = bySeq[seq]; if(!c) return;
  if (isFav(seq)) delete fav[seq];
  else fav[seq] = {tags: [], ts: Date.now()};
  persistFav();
  renderFavUI(c); renderFavList();
  const row = document.querySelector(`.prow[data-seq="${seq}"] .pmark`);
  if (row) row.textContent = (isFav(seq)?"★":"") + (hasNote(seq)?"📝":"");
}
function renderFavUI(c){
  const btn = document.getElementById("favBtn");
  if (!btn) return;
  btn.classList.toggle("on", isFav(c.seq));
  btn.innerHTML = isFav(c.seq) ? "★ 已收藏" : "☆ 收藏";
  const box = document.getElementById("favTags");
  if (!isFav(c.seq)) { box.style.display = "none"; return; }
  box.style.display = "flex";
  const cur = (fav[c.seq].tags||[]);
  const customs = cur.filter(t=>!TAG_PRESETS.includes(t));
  box.innerHTML =
    `<span style="font-size:13px;color:var(--muted)">收藏标签:</span>` +
    TAG_PRESETS.map(t=>`<span class="ftag ${cur.includes(t)?"on":""}" data-tag="${t}">${t}</span>`).join("") +
    customs.map(t=>`<span class="ftag on" data-tag="${esc(t)}">${esc(t)} <b data-del="${esc(t)}" style="cursor:pointer">✕</b></span>`).join("") +
    `<input id="customTag" placeholder="自定义标签"><button class="ftag" id="addTag">添加</button>`;
}
document.getElementById("favTags").addEventListener("click", e=>{
  const del = e.target.closest("[data-del]");
  if (del) {
    const c = bySeq[state.sel]; if(!c) return;
    const arr = fav[c.seq]?.tags || [];
    fav[c.seq].tags = arr.filter(t=>t!==del.dataset.del);
    persistFav(); renderFavUI(c); renderFavList();
    return;
  }
  if (e.target.id === "addTag") {
    const c = bySeq[state.sel]; if(!c) return;
    const inp = document.getElementById("customTag");
    const t = (inp.value||"").trim();
    if (!t) return;
    if (!fav[c.seq]) fav[c.seq] = {tags:[], ts:Date.now()};
    fav[c.seq].tags = fav[c.seq].tags||[];
    if (!fav[c.seq].tags.includes(t)) fav[c.seq].tags.push(t);
    persistFav(); renderFavUI(c); renderFavList();
    return;
  }
  const chip = e.target.closest(".ftag[data-tag]");
  if (chip) {
    const c = bySeq[state.sel]; if(!c) return;
    if (!fav[c.seq]) fav[c.seq] = {tags:[], ts:Date.now()};
    fav[c.seq].tags = fav[c.seq].tags||[];
    const t = chip.dataset.tag;
    if (fav[c.seq].tags.includes(t)) fav[c.seq].tags = fav[c.seq].tags.filter(x=>x!==t);
    else fav[c.seq].tags.push(t);
    persistFav(); renderFavUI(c); renderFavList();
  }
});
document.getElementById("dHead").addEventListener("click", e=>{
  if (e.target.closest("#favBtn")) toggleFav(state.sel);
});
function renderNoteUI(c){
  const wrap = document.getElementById("noteWrap");
  wrap.style.display = "block";
  document.getElementById("noteBox").value = (notes[c.seq]&&notes[c.seq].text)||"";
  document.getElementById("noteStatus").textContent =
    hasNote(c.seq) ? "已保存" : "自动保存，无需手动确认";
}
let noteTimer = null;
document.getElementById("noteBox").addEventListener("input", ()=>{
  const seq = state.sel; if(!seq) return;
  document.getElementById("noteStatus").textContent = "正在保存…";
  clearTimeout(noteTimer);
  noteTimer = setTimeout(()=>{
    const t = document.getElementById("noteBox").value;
    if (t.trim()) notes[seq] = {text: t, ts: Date.now()};
    else delete notes[seq];
    persistFav();
    const d = new Date();
    document.getElementById("noteStatus").textContent =
      "已保存 " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    renderFavList();
    const row = document.querySelector(`.prow[data-seq="${seq}"] .pmark`);
    if (row) row.textContent = (isFav(seq)?"★":"") + (hasNote(seq)?"📝":"");
  }, 800);
});
function renderFavList(){
  const tags = {};
  for (const f of Object.values(fav)) for (const t of (f.tags||[])) tags[t]=(tags[t]||0)+1;
  const nAll = Object.keys(fav).length;
  const nNote = Object.values(notes).filter(n=>n.text&&n.text.trim()).length;
  const cur = state.fav;
  const item = (val, label, n) =>
    `<button class="ver-item ${cur===val?"on":""}" data-fav="${val}"><span class="nm">${label}</span><b>${n}</b></button>`;
  let h = item("", "全部", DATA.cases.length) + item("all", "★ 收藏", nAll) + item("note", "📝 笔记", nNote);
  for (const t of TAG_PRESETS) h += item("tag:"+t, t, tags[t]||0);
  for (const t of Object.keys(tags)) if (!TAG_PRESETS.includes(t)) h += item("tag:"+t, t, tags[t]);
  document.getElementById("favList").innerHTML = h;
}
document.getElementById("favList").addEventListener("click", e=>{
  const b = e.target.closest("[data-fav]"); if(!b) return;
  state.fav = (state.fav === b.dataset.fav) ? null : b.dataset.fav;
  renderFavList();
  applyFilter();
});
document.getElementById("btnExport").onclick = ()=>{
  const blob = new Blob([JSON.stringify({fav, notes, exported: new Date().toISOString(), app:"cfa-referee-review-"+CFG.season}, null, 1)],
    {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = CFG.season + "赛季-收藏与笔记.json";
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("btnImport").onclick = ()=>document.getElementById("importFile").click();
document.getElementById("importFile").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      let n = 0;
      for (const [s, v] of Object.entries(d.fav||{})) {
        if (!fav[s] || (v.ts||0) > (fav[s].ts||0)) { fav[s] = v; n++; }
      }
      for (const [s, v] of Object.entries(d.notes||{})) {
        if (!notes[s] || (v.ts||0) > (notes[s].ts||0)) { notes[s] = v; n++; }
      }
      persistFav(); renderFavList(); applyFilter();
      alert(`导入完成：合并了 ${n} 条记录`);
    } catch(err) { alert("导入失败：文件不是有效的导出JSON"); }
  };
  rd.readAsText(f, "utf-8");
  e.target.value = "";
});

document.getElementById("plistRows").addEventListener("click", e=>{

document.getElementById("catList").addEventListener("click", e=>{

document.getElementById("verList").addEventListener("click", e=>{

fSearch.addEventListener("input", ()=>{ state.q = fSearch.value; applyFilter(); });
fSearch.addEventListener("search", ()=>{ state.q = fSearch.value; applyFilter(); }); // 搜索框✕清空按钮
fSearch.addEventListener("search", ()=>{ state.q = fSearch.value; applyFilter(); }); // 搜索框✕清空按钮
document.getElementById("compList").addEventListener("click", e=>{

  applyFilter();
});
document.getElementById("prevBtn").onclick = ()=>step(-1);
document.getElementById("nextBtn").onclick = ()=>step(1);
document.getElementById("vswRow").addEventListener("click", e=>{
  const b = e.target.closest(".vsw"); if(!b) return;
  const c = bySeq[state.sel]; if(!c) return;
  state.vIdx = +b.dataset.i;
  const vid = document.getElementById("dvid");
  try{ vid.pause(); }catch(_){}
  vid.src = "videos/" + c.videos[state.vIdx];
  document.querySelectorAll(".vsw").forEach(x=>x.classList.toggle("on", x===b));
});
document.getElementById("btnSb").onclick = ()=>{
  document.body.classList.toggle("filters-off");
};
document.getElementById("mobileBack").onclick = ()=>document.body.classList.remove("detail-open");
document.querySelectorAll(".filter-toggle").forEach(btn=>{
  btn.onclick = e=>{
    e.stopPropagation();
    const menu = document.getElementById(btn.dataset.filter);
    const open = menu.classList.toggle("open");
    document.querySelectorAll(".filter-menu").forEach(other=>{ if(other!==menu) other.classList.remove("open"); });
    document.querySelectorAll(".filter-toggle").forEach(other=>other.classList.toggle("on", other===btn && open));
  };
});
document.addEventListener("click", e=>{
  if (!e.target.closest(".filterbar")) {
    document.querySelectorAll(".filter-menu").forEach(menu=>menu.classList.remove("open"));
    document.querySelectorAll(".filter-toggle").forEach(btn=>btn.classList.remove("on"));
  }
});
document.getElementById("btnHelp").onclick = ()=>openModal("modalHelp");
document.querySelectorAll("[data-close]").forEach(b=>
  b.onclick = ()=>b.closest(".modal-mask").classList.remove("open"));
document.querySelectorAll(".modal-mask").forEach(m=>
  m.addEventListener("click", e=>{ if(e.target===m) m.classList.remove("open"); }));
function openModal(id){ document.getElementById(id).classList.add("open"); }

document.addEventListener("keydown", e=>{
  const tag = (e.target.tagName||"").toLowerCase();
  if (tag==="input"||tag==="select"||tag==="textarea") {
    if (e.key==="Escape") e.target.blur();
    return;
  }
  if (e.key==="/"){ e.preventDefault(); fSearch.focus(); return; }
  if (e.key==="Escape"){ document.querySelectorAll(".modal-mask.open")
      .forEach(m=>m.classList.remove("open")); return; }
  if (e.key==="ArrowDown"){ e.preventDefault(); step(1); }
  if (e.key==="ArrowUp"){ e.preventDefault(); step(-1); }
});

// ---------- 统计弹层 ----------
const hasRed = t => (t||[]).includes("红牌");
const hasPen = t => (t||[]).includes("点球");
{

     <td>${sW+sG+sP}</td><td>${sV}</td><td>${sR}</td><td>${sPen}</td></tr>`;

{

applyFilter();
{ // 支持 #case-N 锚点（来自 stats.html 的跳转或刷新恢复）
  const target = initialHashSeq ? bySeq[+initialHashSeq] : null;
