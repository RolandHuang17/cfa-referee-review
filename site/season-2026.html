，云南玉昆VS大连英博海发。比赛第72分钟，云南玉昆踢角球，随后由9号队员进球。裁判员判进球有效，VAR未介入。","appeal":"大连英博海发俱乐部申诉意见认为：对方34号队员处在越位位置，干扰了本方守门员，应判罚越位犯规，进球无效。","conclusion":"对于此判例，评议组多数成员认为：云南玉昆9号头顶球时，云南玉昆34号处于越位位置，但并未遮挡大连英博海发守门员视线，也未做出试图触球、争抢球或影响对方处理球能力的明显举动，不构成越位犯规。裁判员判进球有效的决定正确。VAR未介入正确。","videos":["2026/i18c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260819/1787142146676661.mp4"],"category":"offside","tags":["越位位置","干扰对方不成立"],"v":"correct","var":"correct"},{"seq":202,"issue":18,"no":2,"comp":"中超联赛","round":"第23轮","home":"云南玉昆","away":"大连英博","minute":"75","match_info":"中超联赛第23轮，云南玉昆VS大连英博海发","desc":"判例二：中超联赛第23轮，云南玉昆VS大连英博海发。比赛第75分钟，大连英博海发38号队员在对方罚球区内与云南玉昆19号队员接触后倒地。裁判员未判罚犯规，VAR未介入。","appeal":"大连英博海发俱乐部申诉意见认为：对方19号肘击本方38号面部，应判罚球点球并因暴力行为将对方19号红牌罚令出场。","conclusion":"对于此判例，评议组首先一致认为：云南玉昆19号不存在用手臂主动发力击打大连英博海发38号头部的情况，不构成严重犯规或暴力行为，在俱乐部申诉的核心问题之一（红牌）上，裁判员决定正确，并非红牌。其次，评议组多数成员认为：双方队员均有使用手臂争抢有利位置的动作，云南玉昆19号在争抢位置时，手臂与大连英博海发38号肩颈部有接触，以及后续对对方有轻微拉扯，均力度轻微，并非造成大连英博海发38号倒地或失去控球权的主要原因，未构成犯规。评议组支持裁判员未判罚犯规的决定。VAR未介入正确。","videos":["2026/i18c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260819/1787142167280123.mp4"],"category":"sfp_vc","tags":["轻微接触","暴力行为不成立"],"v":"correct","var":"correct"},{"seq":203,"issue":18,"no":3,"comp":"中超联赛","round":"第23轮","home":"云南玉昆","away":"大连英博","minute":"43","match_info":"中超联赛第23轮，云南玉昆VS大连英博海发","desc":"判例三：中超联赛第23轮，云南玉昆VS大连英博海发。比赛第43分钟，大连英博海发30号队员在与云南玉昆8号队员接触后倒地。裁判员判罚云南玉昆8号犯规，未出示红黄牌。VAR未介入。","appeal":"大连英博海发俱乐部申诉意见认为：对方8号踩踏本方30号，应予以红牌罚令出场。","conclusion":"对于此判例，评议组首先一致认为：云南玉昆8号的犯规不构成严重犯规或暴力行为，在俱乐部申诉的核心问题（红牌）上，裁判员决定正确，并非红牌。其次，评议组多数成员认为：云南玉昆8号在正常跑动过程中，意外踩中大连英博海发30号脚背，并很快刮擦脱离，无故意犯规意图，应视为草率犯规，不应出示黄牌。裁判员判云南玉昆8号犯规以及未出示红黄牌的决定正确。VAR未介入正确。","videos":["2026/i18c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260819/1787142193515697.mp4"],"category":"sfp_vc","tags":["草率犯规","红牌不成立"],"v":"correct","var":"correct"},{"seq":204,"issue":18,"no":4,"comp":"中超联赛","round":"第23轮","home":"浙江俱乐部绿城","away":"成都蓉城","minute":"45","match_info":"中超联赛第23轮，浙江俱乐部绿城VS成都蓉城","desc":"判例四：中超联赛第23轮，浙江俱乐部绿城VS成都蓉城。比赛第45分钟，成都蓉城踢角球，并由9号队员进球。裁判员初始判进球有效，经VAR介入，裁判员在场回看后，最终判罚成都蓉城20号队员处在越位位置并干扰对方守门员，构成越位犯规，进球无效。","appeal":"","conclusion":"此判例无参赛队申诉，但部分媒体和观众对于竞赛规则中关于越位位置认定的理解存在误区，简单认为“发角球时无越位犯规”。评议组特此作出说明：按照竞赛规则，队员直接接本方角球时，不存在越位犯规；但在此判例中，成都蓉城20号在本方9号头顶球时处于越位位置，不属于直接接本方角球的情况。成都蓉城20号当时作出与浙江俱乐部守门员接触的明显举动，影响了后者处理球的能力，构成了干扰对方队员的越位犯规。经VAR介入，裁判员判成都蓉城越位犯规进球无效的决定正确。VAR介入正确。","videos":["2026/i18c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260819/1787142214268978.mp4"],"category":"offside","tags":["越位位置","干扰对方","VAR介入正确","规则说明"],"v":"correct","var":"correct"},{"seq":205,"issue":18,"no":5,"comp":"中乙联赛","round":"第21轮","home":"江西庐山","away":"厦门飞鹭","minute":"66","match_info":"中乙联赛第21轮，江西庐山VS厦门飞鹭","desc":"判例五：中乙联赛第21轮，江西庐山VS厦门飞鹭。比赛第66分钟，厦门飞鹭踢前场任意球，随后由10号队员进球，裁判员判进球有效。","appeal":"江西庐山俱乐部申诉意见认为：对方头球射门时，其7号队员处于越位位置，本方守门员扑出射门后，对方7号得球并传球助攻10号队友进球，应判对方7号越位犯规，进球无效。","conclusion":"对于此判例，评议组一致认为：厦门飞鹭11号队员头球射门时，其7号队员处于越位位置，并在对方守门员救球后得球并传球，构成在越位位置获利的越位犯规，后续进球无效。裁判员判进球有效的决定错误，漏判越位犯规。","videos":["2026/i18c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260819/1787142258855882.mp4"],"category":"offside","tags":["越位位置获利","进球有效"],"v":"wrong","var":"none"},{"seq":206,"issue":18,"no":6,"comp":"中乙联赛","round":"第21轮","home":"江西庐山","away":"厦门飞鹭","minute":"80","match_info":"中乙联赛第21轮，江西庐山VS厦门飞鹭","desc":"判例六：中乙联赛第21轮，江西庐山VS厦门飞鹭。比赛第80分钟，江西庐山27号队员在对方罚球区内与厦门飞鹭17号队员接触后倒地，裁判员未判罚犯规。","appeal":"江西庐山俱乐部申诉意见认为：对方17号对本方27号犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：从现有视频看，双方队员腿部接触较为轻微，但视频无法清晰证明具体接触情况以及是否存在犯规，评议组支持裁判员未判罚犯规的决定。","videos":["2026/i18c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260819/1787142287180881.mp4"],"category":"penalty_area","tags":["证据不足","轻微接触"],"v":"correct","var":"none"},{"seq":207,"issue":19,"no":1,"comp":"中甲联赛","round":"第20轮","home":"宁波俱乐部","away":"延边龙鼎","minute":"60","match_info":"中甲联赛第20轮，宁波俱乐部VS延边龙鼎可喜安","desc":"判例一：中甲联赛第20轮，宁波俱乐部VS延边龙鼎可喜安。比赛第60分钟，延边龙鼎可喜安进球，裁判员判进球有效。","appeal":"宁波俱乐部申诉意见认为：对方向前直传时，其30号队员处于越位位置，随后得球传中，对方37号进球。应判对方30号越位犯规，后续进球无效。","conclusion":"对于此判例，评议组一致认为：从现有视频看，可能存在由于拍摄角度和空间透视关系造成的视觉误差，无法完全证明延边龙鼎可喜安向前传球时，其30号队员是否处于越位位置。视频中也未显示出助理裁判员处于具有说服力的观察位置。评议组对此判例不予认定。","videos":["2026/i19c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260826/1787737493324060.mp4"],"category":"offside","tags":["证据不足"],"v":"pending","var":"none"},{"seq":208,"issue":19,"no":2,"comp":"中甲联赛","round":"第20轮","home":"定南赣联","away":"石家庄功夫","minute":"39","match_info":"中甲联赛第20轮，定南赣联VS石家庄功夫","desc":"判例二：中甲联赛第20轮，定南赣联VS石家庄功夫。比赛第39分钟，裁判员判定南赣联16号队员在争抢高球时对石家庄功夫12号队员犯规，并出示黄牌。","appeal":"石家庄功夫俱乐部申诉意见认为：对方16号动作属于暴力行为，应予红牌罚令出场。","conclusion":"对于此判例，评议组一致认为：定南赣联16号能够观察到石家庄功夫12号的位置，其争抢高球的同时，发力蹬踹对方队员胸腹部，属于用野蛮方式的附加犯规动作，危及对方安全，应视为严重犯规并予以红牌罚令出场。裁判员向定南赣联16号出示黄牌的决定错误，漏判红牌。","videos":["2026/i19c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260826/1787737546336401.mp4"],"category":"sfp_vc","tags":["红牌","严重犯规","蹬踹"],"v":"wrong","var":"none"},{"seq":209,"issue":19,"no":3,"comp":"中甲联赛","round":"第20轮","home":"定南赣联","away":"石家庄功夫","minute":"","match_info":"中甲联赛第20轮，定南赣联VS石家庄功夫","desc":"判例三：中甲联赛第20轮，定南赣联VS石家庄功夫。比赛第90+3分钟，定南赣联进攻时，石家庄功夫队队员在本方罚球区内倒地，裁判员未判罚犯规。","appeal":"石家庄功夫俱乐部申诉意见认为：对方队员在非争抢球情况下故意踢本方队员，属于暴力行为，应予红牌罚令出场。","conclusion":"对于此判例，评议组一致认为：石家庄功夫队员在本方罚球区内防守时，无犯规动作。定南赣联进攻队员在非争抢球的情况下，故意向后撩踹对方队员，并且具有一定力度，应视为暴力行为并给予红牌罚令出场。裁判员决定错误，漏判定南赣联队员红牌。","videos":["2026/i19c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260826/1787737564923682.mp4"],"category":"sfp_vc","tags":["红牌","暴力行为"],"v":"wrong","var":"none"},{"seq":210,"issue":19,"no":4,"comp":"中乙联赛","round":"第22轮","home":"海门珂缔缘","away":"山东泰山B队","minute":"40","match_info":"中乙联赛第22轮，海门珂缔缘VS山东泰山B队","desc":"判例四：中乙联赛第22轮，海门珂缔缘VS山东泰山B队。比赛第40分钟，山东泰山B队43号队员进球，助理裁判员示意越位，裁判员判山东泰山B队43号越位犯规，进球无效。","appeal":"山东泰山俱乐部申诉意见认为：本方43号不越位。","conclusion":"对于此判例，评议组一致认为：现有视频的拍摄角度无法清晰证明山东泰山B队43号在本方传球时是否处于越位位置。视频中能够看到助理裁判员的临场观察位置较好。评议组支持助理裁判员的判断，以及裁判员作出的山东泰山B队43号越位犯规进球无效的决定。","videos":["2026/i19c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260826/1787737581556123.mp4"],"category":"offside","tags":["证据不足","越位位置"],"v":"correct","var":"none"},{"seq":211,"issue":19,"no":5,"comp":"中乙联赛","round":"第22轮","home":"海门珂缔缘","away":"山东泰山B队","minute":"76","match_info":"中乙联赛第22轮，海门珂缔缘VS山东泰山B队","desc":"判例五：中乙联赛第22轮，海门珂缔缘VS山东泰山B队。比赛第76分钟，海门珂缔缘16号队员在对方罚球区内与山东泰山B队5号接触后倒地。裁判员最终判山东泰山B队5号犯规，判罚球点球，并出示黄牌警告山东泰山B队5号。","appeal":"山东泰山俱乐部申诉意见认为：裁判员在作出决定的过程中存在改判，改判程序不符合规则规定。","conclusion":"对于此判例，评议组多数成员认为：山东泰山B队5号防守时伸腿绊摔海门珂缔缘16号并造成后者倒地，裁判员判山东泰山B队5号犯规并判罚球点球的主要决定正确，但无需向山东泰山B队5号出示黄牌。另外，评议组指出：根据竞赛规则，在比赛恢复前，裁判员可以更改判罚（包括在其他比赛官员的协助下），并作出最终的判罚决定。此判例中裁判员最终判罚球点球，符合判罚程序。","videos":["2026/i19c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260826/1787737708331586.mp4"],"category":"penalty_area","tags":["点球","黄牌不成立"],"v":"wrong","var":"none"},{"seq":212,"issue":19,"no":6,"comp":"中乙联赛","round":"第22轮","home":"广州蒲公英","away":"贵州贵阳竞技","minute":"17","match_info":"中乙联赛第22轮，广州蒲公英VS贵州贵阳竞技","desc":"判例六：中乙联赛第22轮，广州蒲公英VS贵州贵阳竞技。比赛第17分钟，贵州贵阳竞技踢角球，双方队员在广州蒲公英罚球区内争抢位置时倒地。裁判员未判罚犯规。","appeal":"贵州贵阳竞技俱乐部申诉意见认为：在无球状态下，对方22号挥拳击打本方35号并致其倒地，属于暴力行为，应向对方22号出示红牌罚令出场，并应判罚球点球。\n广州蒲公英俱乐部申诉意见认为：在无球状态下，对方35号肘击并挥拳击打本方22号，导致本方22号作出过激行为。对方35号属于暴力犯规。","conclusion":"对于此判例，评议组首先一致认为：广州蒲公英22号挥臂故意击打贵州贵阳竞技35号头部，属于暴力行为，应给予红牌罚令出场。其次，评议组多数成员认为：贵州贵阳竞技35号手臂有击打广州蒲公英22号的犯规动作，但现有视频无法看到具体接触情况，无法认定是否应给予贵州贵阳竞技35号红黄牌处罚。由于贵州贵阳竞技35号存在犯规，且发生于广州蒲公英22号的暴力行为之前，因此不应判罚球点球。综上，评议组认定：贵州贵阳竞技35号犯规，但是否构成红牌或者黄牌不予认定；广州蒲公英22号暴力行为，应予红牌罚令出场；比赛应以广州蒲公英队踢直接任意球恢复。在贵州贵阳竞技俱乐部申诉的核心问题（红牌及罚球点球）上，裁判员漏判红牌，但未漏判罚球点球；在广州蒲公英俱乐部申诉的核心问题（红牌）上，评议组不予认定。","videos":["2026/i19c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260826/1787737746522043.mp4"],"category":"sfp_vc","tags":["红牌","暴力行为","证据不足"],"v":"wrong","var":"none"},{"seq":213,"issue":19,"no":7,"comp":"中超联赛","round":"第24轮","home":"深圳新鹏城","away":"浙江俱乐部绿城","minute":"80","match_info":"中超联赛第24轮，深圳新鹏城vs浙江俱乐部绿城","desc":"判例七：中超联赛第24轮，深圳新鹏城vs浙江俱乐部绿城。比赛第80分钟，深圳新鹏城替换队员，因替换下场的11号队员未在10秒内离场，造成替换上场的17号队员暂时不能上场，之后深圳新鹏城15号队员受伤下场，未能作出替换。随后比赛恢复，深圳新鹏城场上队员暂时为9人，深圳新鹏城踢直接任意球恢复比赛后，浙江俱乐部绿城队得到控球权，发起进攻并取得进球。裁判员判进球有效。","appeal":"深圳新鹏城俱乐部申诉意见认为：本队在队员受伤后，已提交换人申请，但第四官员拒绝执行换人程序，导致本方在只有9名场上队员的情况下，被对方进球。","conclusion":"对于此判例，经调查和了解现场情况，评议组作出如下认定和说明：\n第一，深圳新鹏城17号替换11号时，因后者未能在10秒限时内离开比赛场地，按照竞赛规则，替换上场的17号暂时不能上场，需在比赛恢复后再经过1分钟，之后的首次比赛停止时，得到裁判员的示意，方可上场。\n第二，在比赛恢复前，深圳新鹏城15号受伤倒地，随后由担架抬出场地。在此过程中，深圳新鹏城再次提出替换申请，由6号和25号，替换场上的2号和受伤的15号。第四官员未执行替换前的有关检查。此时比赛具备恢复条件，裁判员决定恢复比赛，该程序并不违反竞赛规则。球队提出替换申请，并不意味着替换程序即刻开始，第四官员必须先进行一系列检查核对程序（包括检查核对替换单据、换人牌、本场报名名单、确认队员号码和参赛资格、检查替补队员装备等），所有程序就绪后，才可通知裁判员，并在比赛停止时进行替换。在上述检查完成前，如果比赛具备继续或恢复的条件，裁判员应先允许比赛继续或恢复。\n第三，此判例中，在深圳新鹏城15号受伤倒地时，比赛已具备恢复条件。但裁判员因深圳新鹏城15号受伤而延迟比赛恢复，此时如果球队提出替换申请，并且递交资料齐备，从管理角度出发，第四官员应优先启动替换前的检查程序（无论是否能够在比赛恢复前完成替换），其次再兼顾（或由其他比赛官员兼顾）暂不允许上场的深圳新鹏城17号的管理与计时（如果比赛恢复）。\n综上，此判例中，比赛在深圳新鹏城场上暂时只有9名队员时恢复，符合竞赛规则。但裁判组在比赛管理和工作程序处理上存在不足。","videos":["2026/i19c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260826/1787737900340738.mp4"],"category":"other_program","tags":["换人程序","规则说明"],"v":"correct","var":"none"},{"seq":214,"issue":20,"no":1,"comp":"中甲联赛","round":"第21轮","home":"佛山南狮","away":"深圳青年人","minute":"83","match_info":"中甲联赛第21轮，佛山南狮VS深圳青年人","desc":"中甲联赛第21轮，佛山南狮VS深圳青年人。比赛第83分钟，佛山南狮将球传至对方罚球区内，佛山南狮24号队员与深圳青年人33号队员争抢后倒地，裁判员未判罚犯规，VAR未介入。","appeal":"佛山南狮俱乐部申诉意见认为：对方33号对本方24号犯规，应判罚球点球。","conclusion":"对于此判例，评议组多数成员认为：双方队员争抢球机会基本均等，佛山南狮24号勉强先触球，但身体重心靠后，难以继续控球；深圳青年人33号争抢球动作合理，与对方脚部的接触较为轻微，并非摆腿踢倒对方。该接触属于比赛中可以接受的程度，不构成犯规。裁判员未判罚犯规正确。VAR未介入正确。","videos":["2026/i20c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260909/1788939422605105.mp4"],"category":"penalty_area","tags":["正常接触"],"v":"correct","var":"correct"},{"seq":215,"issue":20,"no":2,"comp":"中国足协杯","round":"第6轮","home":"山东泰山","away":"上海海港","minute":"3","match_info":"中国足协杯赛第6轮，山东泰山vs上海海港","desc":"判例二：中国足协杯赛第6轮，山东泰山vs上海海港。比赛第3分钟，山东泰山8号队员在对方罚球区线附近位置与上海海港10号接触后倒地，裁判员未判罚犯规，VAR未介入。","appeal":"山东泰山俱乐部申诉意见认为：对方10号对本方8号犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：山东泰山8号右脚扣球变向，手臂与对方队员身体有接触，且左脚支撑脚落 "石家庄功夫","away":"深圳青年人","minute":"77","match_info":"中甲联赛第23轮，石家庄功夫VS深圳青年人","desc":"判例四：中甲联赛第23轮，石家庄功夫VS深圳青年人。比赛第77分钟，石家庄功夫31号队员在对方罚球区内与深圳青年人20号队员接触后倒地，裁判员未判罚犯规。","appeal":"石家庄功夫俱乐部申诉意见认为：对方20号对本方31号犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：石家庄功夫31号与深圳青年人20号在争夺位置时互相拉扯对方球衣。之后深圳青年人20号手臂接触石家庄功夫31号肩部，未达到犯规程度；石家庄功夫31号触球后已无法控球，有主动倒地夸大接触程度的成分。裁判员未判罚犯规的决定正确。","videos":["2026/i21c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260916/1789549336716587.mp4"],"category":"penalty_area","tags":["拉扯","主动倒地"],"v":"correct","var":"none"},{"seq":220,"issue":21,"no":5,"comp":"中乙联赛","round":"第23轮","home":"上海海港富盛经开","away":"江西庐山","minute":"54","match_info":"中乙联赛第23轮，上海海港富盛经开VS江西庐山","desc":"判例五：中乙联赛第23轮，上海海港富盛经开VS江西庐山。比赛第54分钟，上海海港富盛经开14号队员疑似在本方罚球区内手臂触球，裁判员未判罚手球犯规。","appeal":"江西庐山俱乐部申诉意见认为：对方14号手球犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：江西庐山队员脚跟磕球，球经上海海港富盛经开队员脚部近距离阻挡变线后，意外接触上海海港富盛经开14号手臂，其手臂位置靠近身体，不构成手球犯规。裁判员未判罚手球犯规的决定正确。","videos":["2026/i21c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260916/1789549393180991.mp4"],"category":"handball","tags":["意外手球","自然位置"],"v":"correct","var":"none"},{"seq":221,"issue":22,"no":1,"comp":"中甲联赛","round":"第24轮","home":"南通支云","away":"广西恒宸","minute":"55","match_info":"中甲联赛第24轮，南通支云VS广西恒宸","desc":"判例一：中甲联赛第24轮，南通支云VS广西恒宸。比赛第55分钟，在广西恒宸罚球区内，南通支云19号队员传中，广西恒宸6号疑似手臂触球。裁判员未判罚手球犯规。VAR未介入。","appeal":"南通支云俱乐部申诉意见认为：对方6号手球犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：广西恒宸6号队员在倒地封堵传球时，球击中置于身后作为合理支撑且未扩大防守面积的手臂，不构成手球犯规。裁判员未判罚手球犯规的决定正确。VAR未介入正确。","videos":["2026/i22c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260923/1790166625268107.mp4"],"category":"handball","tags":["自然位置"],"v":"correct","var":"correct"},{"seq":222,"issue":22,"no":2,"comp":"中甲联赛","round":"第24轮","home":"南通支云","away":"广西恒宸","minute":"66","match_info":"中甲联赛第24轮，南通支云VS广西恒宸","desc":"判例二：中甲联赛第24轮，南通支云VS广西恒宸。比赛第66分钟，南通支云10号队员将球传中至对方罚球区内，广西恒宸3号疑似手臂触球。裁判员未判罚手球犯规。VAR未介入。","appeal":"南通支云俱乐部申诉意见认为：对方3号手球犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：现有视频无法清晰展现球与手臂的接触点，结合球员身体与手臂位置、助理裁判的观察视角及动作分析，广西恒宸3号队员为手臂紧贴身体，支持裁判员未判罚其手球犯规的决定。VAR未介入正确。","videos":["2026/i22c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260923/1790166674673098.mp4"],"category":"handball","tags":["证据不足","自然位置"],"v":"correct","var":"correct"},{"seq":223,"issue":22,"no":3,"comp":"中甲联赛","round":"第24轮","home":"南通支云","away":"广西恒宸","minute":"11","match_info":"中甲联赛第24轮，南通支云VS广西恒宸","desc":"判例三：中甲联赛第24轮，南通支云VS广西恒宸。比赛第11分钟，广西恒宸18号队员在与南通支云10号队员争抢时发生接触。裁判员未判罚犯规。VAR未介入。","appeal":"南通支云足球俱乐部申诉意见认为：对方18号队员构成严重犯规，应予以红牌罚令出场。","conclusion":"对于此判例，评议组一致认为：广西恒宸18号队员在与南通支云10号队员争抢空中球时脚底触碰对方，随后立即屈膝收腿，属于剐蹭动作，未达到严重犯规强度，应出示黄牌警告。在南通支云足球俱乐部申诉的核心问题（红牌）上，裁判员决定正确，但未判罚犯规错误，漏判犯规和黄牌。VAR未介入正确。","videos":["2026/i22c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260923/1790166706524262.mp4"],"category":"sfp_vc","tags":["黄牌","红牌不成立"],"v":"wrong","var":"correct"},{"seq":224,"issue":22,"no":4,"comp":"中甲联赛","round":"第24轮","home":"南京城市","away":"无锡吴钩","minute":"9","match_info":"中甲联赛第24轮，南京城市VS无锡吴钩","desc":"判例四：中甲联赛第24轮，南京城市VS无锡吴钩。比赛第9分钟，南京城市罚球区内，南京城市20号队员在与无锡吴钩7号队员争抢时发生接触。裁判员判南京城市20号队员犯规并向其出示黄牌，判罚球点球。","appeal":"南京城市俱乐部申诉意见认为：本方20号不构成犯规，不应判罚球点球。","conclusion":"对于此判例，评议组多数成员认为：在进攻方拥有明显进球得分机会的情况下，双方争抢球时，南京城市20号队员的左脚绊到无锡吴钩7号队员的右脚并造成对方倒地，构成草率绊摔犯规。按照竞赛规则，在罚球区内针对此类犯规的纪律处罚应当降格为黄牌，应当判罚球点球。裁判员判罚球点球并出示黄牌的决定正确。","videos":["2026/i22c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260923/1790166751284501.mp4"],"category":"penalty_area","tags":["点球","绊摔","黄牌","DOGSO降格"],"v":"correct","var":"none"},{"seq":225,"issue":22,"no":5,"comp":"中乙联赛","round":"第24轮","home":"杭州临平吴越","away":"上海海港B队","minute":"32","match_info":"中乙联赛第24轮，杭州临平吴越VS上海海港B队","desc":"判例五：中乙联赛第24轮，杭州临平吴越VS上海海港B队。比赛第32分钟，杭州临平吴越56号队员进攻时与上海海港B队53号队员争抢时发生接触。裁判员判56号队员进攻犯规。","appeal":"杭州临平吴越俱乐部申诉意见认为：对方53号对本方56号恶意犯规，且破坏本方明显进球得分机会，应出示红牌罚令出场。","conclusion":"对于此判例，评议组一致认为：双方队员均以争抢球的目的争抢高空来球，且都未顶到球，随后发生正常的身体碰撞，期间无任何附加动作，属于不可避免的接触，双方队员均不构成犯规。在杭州临平吴越俱乐部申诉的核心问题（红牌）上，裁判员决定正确，但裁判员判罚攻方犯规的决定错误。","videos":["2026/i 角球）。","freekick_foul":"统一尺度要点：直接任意球犯规（踢、绊、推、拉、冲撞、跳向、铲球）按「草率—鲁莽—过分用力」三档把握纪律尺度：草率犯规不出示牌；鲁莽犯规黄牌警告；过分用力危及对方安全为严重犯规红牌。以危险方式比赛（如争抢高球时抬脚过高危及对方）判间接任意球。","spa_tactical":"统一尺度要点：破坏有希望的进攻（SPA）→黄牌。判断要素：犯规地点与对方球门的距离、进攻方向、控球或控球可能性、防守队员人数与位置。拉扯、抱拽、背后冲撞、鲁莽冲撞破坏快攻/突破均属典型战术犯规。","dogso":"统一尺度要点：破坏明显进球得分机会（DOGSO）四要素：①犯规地点与球门距离；②进攻大致朝向球门；③控球或可争得控球；④防守队员人数与位置（通常含守门员在内仅一名防守队员时成立）。以争抢球为目的且判罚球点球→黄牌；否则红牌。守门员在罚球区外犯规破坏明显得分机会→红牌。拉扯、推搡同样可构成DOGSO。","sfp_vc":"统一尺度要点：①严重犯规（SFP）：争抢球中使用过分力量或野蛮方式危及对方安全——鞋钉蹬踹、直腿踩踏小腿跟腱、飞铲、抬脚触头等。②暴力行为（VC）：非争抢球时（或球不在可争抢范围时）击打、挥拳、肘击头面部；比赛停止时的攻击性行为同样可罚；「试图击打」即使未触及也属暴力行为。③挥臂接触但未达过分力量的，按鲁莽犯规黄牌处理。④轻微触碰面部示意对方起身，不构成暴力行为。","simulation":"统一尺度要点：佯装被犯规（假摔）、夸大接触程度、挑衅与欺骗行为→以非体育行为黄牌警告。接触轻微且未影响平衡的主动倒地，既不判对方犯规，也应警示佯装行为。","goal_decision":"统一尺度要点：①进球前提：球整体越过球门线，且进球前攻方无犯规（推搡、拉扯、冲撞守门员等）；裁判员鸣哨停止比赛后的进球无效。②有利条款：被犯规方即将形成明显进球得分机会时，必须掌握有利让进攻完成后再处理犯规——不可提前鸣哨剥夺进球机会；守门员犯规球即将进门时同样先掌握有利。③球出界（整体离开比赛场地）判定：助理裁判员应延迟举旗、裁判员延迟鸣哨，给VAR保留介入空间。","other_program":"统一尺度要点：①VAR介入原则：仅限清晰明显的错漏判以及严重事件（红牌、点球、进球、认错人）；VAR查看≠介入，介入的标志是裁判员做出「电视信号」手势；VAR介入后裁判员可不回看而直接采纳结论，但仍须做出电视手势。②裁判员选位跑位影响判罚质量，虽不构成改判依据，但应持续改进。③耳麦通讯受干扰时，对讲机等备用通讯设备的使用符合VAR操作要求。④球队官员在技术区域外实施暴力行为可被红牌罚令出场。"},"issueNotes":{"3":"本期标题认定7例；合集另计入2例「申诉问题支持原判但漏判黄牌」的纪律处罚漏判（判例四、判例十五），官方标题口径未计入。","4":"本期标题认定5例；合集另计入点球重罚程序错误与越位误判等纪律/程序类错误。","5":"本期标题认定3例；合集另计入1例漏判黄牌与1例漏判越位进球。","6":"本期标题认定6例；合集另计入1例漏判黄牌。","7":"本期标题认定8例；合集另计入3例纪律处罚漏判与越位误判类错误。","8":"本期标题认定5例；合集另计入1例漏判黄牌。","10":"本期标题认定5例；合集另计入1例多余黄牌。","11":"本期标题口径为「本轮中超无错漏判」（本期中超判例均支持原判）；合集另计入本期中甲/中乙错漏判6例。","13":"本期标题认定5例；合集另计入1例多余黄牌。","14":"本期标题认定2例；合集另计入1例漏判黄牌。","16":"本期标题认定4例；合集另计入1例漏判黄牌。","19":"本期标题认定3例；合集另计入1例多余黄牌。","22":"本期标题口径为「本轮中超无错漏判」（本期无中超判例）；合集计入中甲/中乙错漏判2例。"},"verdictNames":{"wrong":"错漏判","correct":"支持原判","pending":"不予认定"},"varNames":{"correct":"VAR正确","wrong":"VAR错误","none":""},"built":"2026-10-03"};

const CATS = DATA.categories;
const VN = {wrong:"错漏判", correct:"支持原判", pending:"不予认定"};
const VCLS = {wrong:"wrong", correct:"correct", pending:"pending"};
const bySeq = {};
DATA.cases.forEach(c => bySeq[c.seq] = c);
// 必须在applyFilter的自动选中改写hash之前捕获初始锚点
const initialHashSeq = (location.hash.match(/^#case-(\d+)$/)||[])[1];
// 轻量版（cfa.lite，theme.py 首帧前设置 dataset.lite）：纯文字+官方链接笔记本模式，无视频窗口
let LITE = document.documentElement.dataset.lite === "1";

// ---------- 收藏与笔记（localStorage 持久化，键按赛季隔离） ----------
const CFG = DATA.cfg;
const FAV_KEY = CFG.favKey, NOTE_KEY = CFG.noteKey;
const TAG_PRESETS = ["精选", "有疑问", "尺度标杆", "易错点", "课堂讨论"];
let fav = {}, notes = {};
try { fav = JSON.parse(localStorage.getItem(FAV_KEY) || "{}") || {}; } catch(_) { fav = {}; }
try { notes = JSON.parse(localStorage.getItem(NOTE_KEY) || "{}") || {}; } catch(_) { notes = {}; }
function persistFav() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(fav));
        localStorage.setItem(NOTE_KEY, JSON.stringify(notes)); } catch(_) {}
}
function isFav(seq) { return !!fav[seq]; }
function hasNote(seq) { return !!(notes[seq] && notes[seq].text && notes[seq].text.trim()); }
function crest(team, h, mark) {
  const item = DATA.teams && DATA.teams[team];
  if (!item) return `<span class="team-badge" title="${esc(team)}：未登记">?</span>`;
  if (item.status === "verified" && item.path)
    return `<img class="crest" style="height:${h}px" src="${item.path}" alt="${esc(team)}队徽">`;
  // fallback 文字徽章：与完整队名相邻时用色块标记，避免首字与队名重复（如"黑龙黑龙江冰城"）
  if (mark)
    return `<span class="team-dot" style="width:${h}px;height:${h}px;background:${item.bg};border:1px solid ${item.fg}" title="${esc(team)}：队徽待核验" aria-label="${esc(team)}"></span>`;
  const scale = Math.max(16, h);
  return `<span class="team-badge" style="width:${scale}px;height:${scale}px;--badge-fg:${item.fg};--badge-bg:${item.bg}" title="${esc(team)}：文字徽章（队徽待核验）" aria-label="${esc(team)}文字徽章">${esc(item.initials)}</span>`;
}

// 预聚合搜索串
for (const c of DATA.cases) {
  const match = [c.comp, c.round, (c.home&&c.away)?`${c.home} VS ${c.away}`:"", c.minute?`第${c.minute}分钟`:""]
    .filter(Boolean).join(" · ");
  c.search = (match+" "+c.desc+" "+c.appeal+" "+c.conclusion+" "+(c.tags||[]).join(" ")).toLowerCase();
}

// ---------- 侧栏 ----------
const catCount = {}, catWrong = {};
for (const c of DATA.cases) {
  catCount[c.category] = (catCount[c.category]||0)+1;
  if (c.v==="wrong") catWrong[c.category] = (catWrong[c.category]||0)+1;
}
const verCount = {all:DATA.cases.length, wrong:0, correct:0, pending:0};
for (const c of DATA.cases) verCount[c.v]++;

    `<button class="cat-item" data-cat="${k.id}"><span class="nm">${k.name}</span>` +

document.getElementById("verList").innerHTML =
  `<button class="ver-item on" data-v=""><span class="dot" style="background:var(--muted)"></span><span class="nm">全部</span><b>${verCount.all}</b></button>` +
  `<button class="ver-item" data-v="wrong"><span class="dot wrong"></span>错漏判<b>${verCount.wrong}</b></button>` +
  `<button class="ver-item" data-v="correct"><span class="dot correct"></span>支持原判<b>${verCount.correct}</b></button>` +
  `<button class="ver-item" data-v="pending"><span class="dot pending"></span>不予认定<b>${verCount.pending}</b></button>`;

// ---------- 状态与筛选 ----------
const state = {cat:"", v:"", issue:"", q:"", sel:null, vIdx:0, fav:null,
               comp:"", team:""};
const fSearch = document.getElementById("fSearch");

const COMP_ORDER = [["中超联赛","中超"],["中甲联赛","中甲"],["中乙联赛","中乙"],
                    ["女超联赛","女超"],["女甲联赛","女甲"],["中国足协杯","足协杯"],
                    ["全运会","全运会"],["三大球运动会","三大球"]];
const COMP_SHORT = Object.fromEntries(COMP_ORDER);
const teamComps = {};
for (const c of DATA.cases) {
  for (const t of new Set([c.home, c.away].filter(Boolean))) {
    (teamComps[t] = teamComps[t] || new Set()).add(c.comp);
  }
}
function teamBadge(t){
  return crest(t, 18, true);
}

// 除 skip 维度外的全部筛选（用于分面计数；skip 可为字符串或数组）
function baseMatch(c, skip){
  skip = Array.isArray(skip) ? skip : (skip ? [skip] : []);
  const sk = k => skip.includes(k);
  if (!sk("cat") && state.cat && c.category!==state.cat) return false;
  if (!sk("v") && state.v && c.v!==state.v) return false;
  if (!sk("issue") && state.issue && String(c.issue)!==state.issue) return false;
  if (!sk("comp") && state.comp && c.comp!==state.comp) return false;
  if (!sk("team") && state.team && c.home!==state.team && c.away!==state.team) return false;
  if (!sk("fav")){
    if (state.fav==="all" && !isFav(c.seq)) return false;
    if (state.fav==="note" && !hasNote(c.seq)) return false;
    if (state.fav && state.fav.startsWith("tag:")) {
      const t = state.fav.slice(4);
      if (!(fav[c.seq] && (fav[c.seq].tags||[]).includes(t))) return false;
    }
  }
  if (!sk("q")){ const q=state.q.trim().toLowerCase(); if(q && !c.search.includes(q)) return false; }
  return true;
}

function visibleCases(){
  return DATA.cases.filter(c => baseMatch(c, null));
}

// ---------- 侧栏：赛事/球队/期数（计数随其他筛选联动） ----------
function renderSidebar(){
  document.getElementById("compList").innerHTML =
    `<button class="cat-item ${state.comp===""?"on":""}" data-comp=""><span class="nm">全部赛事</span><b>${DATA.cases.filter(c=>baseMatch(c,["comp","team"])).length}</b></button>` +
    COMP_ORDER.map(([full,short])=>{
      const n = DATA.cases.filter(c=>baseMatch(c,["comp","team"]) && c.comp===full).length;
      return {full, short, n};
    }).filter(x=>x.n>0 || state.comp===x.full)
      .map(x=>`<button class="cat-item ${state.comp===x.full?"on":""}" data-comp="${x.full}"><span class="nm">${x.short}</span><b>${x.n}</b></button>`).join("");
  const teams = {};
  for (const c of DATA.cases) {
    if (!baseMatch(c,"team")) continue;
    if (state.comp && c.comp!==state.comp) continue;
    for (const t of new Set([c.home,c.away].filter(Boolean))) teams[t]=(teams[t]||0)+1;
  }
  document.getElementById("teamList").innerHTML =
    Object.entries(teams).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([t,n])=>
      `<button class="cat-item ${state.team===t?"on":""}" data-team="${esc(t)}">${teamBadge(t)}<span class="nm">${esc(t)}</span><b>${n}</b></button>`).join("") ||
    `<div style="font-size:12.5px;color:var(--muted);padding:6px 8px">该赛事下无判例</div>`;
  document.getElementById("issueList").innerHTML =
    Array.from({length:CFG.issueCount},(_,k)=>k+1).map(i=>{
      const n = DATA.cases.filter(c=>baseMatch(c,"issue") && String(c.issue)===String(i)).length;
      return `<button class="cat-item ${String(state.issue)===String(i)?"on":""}" data-issue="${i}" title="第${i}期 · ${n}例"><span class="nm">${i}</span><b>${n}</b></button>`;
    }).join("");
}

function renderList(){
  const list = visibleCases();
  const issueTitle = document.getElementById("issueTitle");
  if (state.issue) {
    const iss = DATA.issues[state.issue];
    issueTitle.innerHTML = `第${state.issue}期 · ${esc(iss.title)} · ${iss.date.slice(0,4)}-${iss.date.slice(4,6)}-${iss.date.slice(6,8)}发布 · `;
  } else {
    issueTitle.innerHTML = "";
  }
  document.getElementById("shownCount").textContent = list.length;
  const groups = {};
  list.forEach(c => (groups[c.category] = groups[c.category]||[]).push(c));
  const rows = CATS.filter(k=>groups[k.id]).map(k =>
    `<div class="ph">${k.name} <b>${groups[k.id].length} 例</b></div>` +
    groups[k.id].map(c=>{
      const short = (c.comp||"").replace("联赛","");
      const varChip = c.var==="none" ? "" :
        `<span class="rv ${c.var==="wrong"?"bad":""}">V${c.var==="wrong"?"✗":"✓"}</span>`;
      return `<div class="prow ${state.sel===c.seq?"sel":""}" data-seq="${c.seq}" aria-current="${state.sel===c.seq}">
        <span class="dot ${c.v}"></span>
        <span class="ptxt"><b>${crest(c.home,16,true)}${esc(c.home)} <span class="vs">vs</span> ${crest(c.away,16,true)}${esc(c.away)}</b>
        <i>${esc(short)}${c.round?esc(c.round):""}${c.minute?" · 第"+c.minute+"分钟":""} · 第${c.issue}期-判例${c.no} · ${VN[c.v]}</i></span>
        <span class="pmark">${isFav(c.seq)?IC["star-f"]:""}${hasNote(c.seq)?IC.note:""}</span>
        ${varChip}</div>`;
    }).join("")).join("");
  document.getElementById("plistRows").innerHTML = rows ||
    `<div class="plist-empty">没有符合条件的判例，请调整筛选。</div>`;
}

function applyFilter(){
  renderSidebar();
  renderFavList();
  renderList();
  const list = visibleCases();
  if (!list.some(c=>c.seq===state.sel)) {
    if (list.length) select(list[0].seq, false); else clearDetail();
  }
}

function clearDetail(){
  state.sel = null;
  document.getElementById("dcard").style.display = "none";
  document.getElementById("detailEmpty").style.display = "flex";
  const v = document.getElementById("dvid");
  try{ v.pause(); }catch(_){}
  v.removeAttribute("src"); v.load();
}

function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

// ---------- 视频源与回退（完整版：本地缺失 → 官方直链在线播放） ----------
let vidsMissing = false;  // 会话级：本地视频目录不可用（404 过一次后全程直连官方直链）
let ossTried = false;     // 当前 <video> 是否已在官方直链上
function hasVideos(c){ return !!(c.videos && c.videos.length); }
function videoSrc(c, i){
  const url = (c.video_urls || [])[i];
  if (vidsMissing && url) return url;
  return "videos/" + c.videos[i];
}
let vfailDismissed = false;
try { vfailDismissed = sessionStorage.getItem("cfa.vfail") === "1"; } catch(_) {}
function showVFailTip(msg, offerLite){
  if (offerLite && vfailDismissed) return;
  const tip = document.getElementById("vfailTip");
  tip.innerHTML = `<span>${esc(msg)}</span>` +
    (offerLite ? `<button id="vfailGoLite">切换轻量版</button>` +
      `<button class="vx" id="vfailX" title="本次会话不再提示">✕</button>` : "");
  tip.style.display = "flex";
}
document.getElementById("vfailTip").addEventListener("click", e=>{
  if (e.target.id === "vfailGoLite") { goLite(); return; }
  if (e.target.id === "vfailX") {
    vfailDismissed = true;
    try { sessionStorage.setItem("cfa.vfail", "1"); } catch(_) {}
    document.getElementById("vfailTip").style.display = "none";
  }
});
document.getElementById("dvid").addEventListener("error", ()=>{
  if (LITE) return;
  const c = bySeq[state.sel];
  if (!c || !hasVideos(c)) return;
  if (!ossTried) {
    const url = (c.video_urls || [])[state.vIdx];
    if (url) {
      vidsMissing = true; ossTried = true;
      document.getElementById("dvid").src = url;
      showVFailTip("本地视频缺失，已自动改用官方直链在线播放。");
      return;
    }
  }
  showVFailTip("视频无法播放（本地缺失且官方直链不可达）。可切换轻量版：纯文字 + 官方链接，无需视频。", true);
});

// ---------- 轻量版切换 ----------

  document.getElementById("detailEmpty").innerHTML = LITE

    : `<svg class="ic" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg><span>从中间列表选择判例开始学习</span>`;
}
function stopVideo(){
  const vid = document.getElementById("dvid");
  try { vid.pause(); } catch(_) {}
  vid.removeAttribute("src"); vid.load();
}
function applyLite(){  // 模式切换后原地重渲染（无需刷新页面）
  LITE = document.documentElement.dataset.lite === "1";
  stopVideo();
  document.getElementById("vfailTip").style.display = "none";
  syncEmptyState();
  if (state.sel) select(state.sel, false); else clearDetail();
}
function goLite(){
  document.documentElement.dataset.lite = "1";
  try { localStorage.setItem("cfa.lite", "1"); } catch(_) {}
  applyLite();
}
document.addEventListener("cfa:lite", applyLite);  // theme.py 顶栏 #btnLite 切换时派发

// ---------- 选中判例 ----------
function select(seq, scrollRow=true){
  const c = bySeq[seq]; if (!c) return;
  if (window.matchMedia && window.matchMedia("(max-width:1080px)").matches)
    document.body.classList.add("detail-open");
  state.sel = seq;
  const iss = DATA.issues[c.issue];
  document.getElementById("detailEmpty").style.display = "none";
  document.getElementById("dcard").style.display = "block";
  const match = [c.comp, c.round, (c.home&&c.away)?`${c.home} VS ${c.away}`:"", c.minute?`第${c.minute}分钟`:""]
    .filter(Boolean).join(" · ");
  const matchHTML = match
    .replace(c.home, `${crest(c.home,22,true)}${esc(c.home)}`)
    .replace(c.away, `${crest(c.away,22,true)}${esc(c.away)}`);
  const varBadge = c.var==="none" ? "" :
    `<span class="badge ${c.var==="wrong"?"wrong":"info"}">VAR${c.var==="wrong"?"错误":"正确"}</span>`;
  document.getElementById("dHead").innerHTML =
    `<span class="cid">第${c.issue}期 · 判例${c.no}</span>
     <span class="badge ${VCLS[c.v]}">${VN[c.v]}</span>${varBadge}
     <button class="favbtn ${isFav(c.seq)?"on":""}" id="favBtn" title="收藏该判例" aria-pressed="${isFav(c.seq)}">${isFav(c.seq)?IC["star-f"]+" 已收藏":IC.star+" 收藏"}</button>
     <h2 class="match">${matchHTML}</h2>`;
  renderFavUI(c);
  renderNoteUI(c);
  // 视频区：轻量版无视频窗口，改放官方链接；完整版唯一播放器，切换即替换
  state.vIdx = 0;
  const vid = document.getElementById("dvid");
  const srcActs = document.getElementById("srcActions");
  const vfail = document.getElementById("vfailTip");
  const dvidWrap = document.querySelector(".d-video");
  const vsr = document.getElementById("vswRow");
  if (LITE) {
    stopVideo();
    dvidWrap.style.display = "none";
    vsr.style.display = "none"; vsr.innerHTML = "";
    document.getElementById("dNote").textContent = "";
    vfail.style.display = "none";
    srcActs.style.display = "flex";
    srcActs.innerHTML =
      `<a class="srcbtn" href="${esc(iss.url)}" target="_blank" rel="noopener">${IC.external} 打开官方评议页</a>` +
      (c.video_urls||[]).map((u,i)=>
        // 官方 CDN 拒绝带 Referer 的请求（403），直链必须免 Referer 打开
        `<a class="srcbtn" href="${esc(u)}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">${IC.play} 官方视频${i+1}</a>`).join("") +
      `<span class="srcsub">轻量版：到官方页面观看视频，收藏与笔记两种模式共用</span>`;
  } else {
    srcActs.style.display = "none"; srcActs.innerHTML = "";
    vfail.style.display = "none";
    if (!hasVideos(c)) {
      dvidWrap.style.display = "none";
      vsr.style.display = "none"; vsr.innerHTML = "";
      document.getElementById("dNote").textContent = "该判例无视频片段";
    } else {
      dvidWrap.style.display = "";
      try{ vid.pause(); }catch(_){}
      ossTried = !!(vidsMissing && (c.video_urls||[])[0]);
      vid.src = videoSrc(c, 0);
      if (c.videos.length > 1) {
        vsr.style.display = "flex";
        vsr.innerHTML = c.videos.map((f,i)=>
          `<button class="vsw ${i===0?"on":""}" data-i="${i}">${/-(2|3)\.mp4$/.test(f)&&i>0?"补充角度":"视频"+(i+1)}</button>`).join("");
      } else { vsr.style.display = "none"; vsr.innerHTML = ""; }
      document.getElementById("dNote").textContent =
        c.videos.length>1 ? "同判例存在多个角度视频，可切换：" : "";
    }
  }
  // 正文
  document.getElementById("dText").innerHTML =
    `<p>${esc(c.desc.replace(/^判例[一二三四五六七八九十百]+[：:]/,"").trim())}</p>` +
    (c.appeal?`<p><span class="lbl">申诉意见：</span>${esc(c.appeal.replace(/^[^：]*申诉意见认为：/,"").trim())}</p>`:"") +
    `<p class="concl"><span class="lbl">评议组认定：</span>${esc(c.conclusion
      .replace(/^对于此判[例罚]，评议组[^：]*认为：/,"").trim())}</p>`;
  const catMeta = CATS.find(k=>k.id===c.category);
  document.getElementById("dCatNote").querySelector("summary").textContent =
    `📏 ${catMeta ? catMeta.name : ""} · 统一尺度要点`;
  document.getElementById("dCatNote").querySelector("div").textContent =
    DATA.notes[c.category] || "";
  document.getElementById("dTags").innerHTML =
    (c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  document.getElementById("dFoot").innerHTML =
    `来源：<a href="${iss.url}" target="_blank" rel="noopener">${esc(iss.title)}</a>（${iss.date.slice(0,4)}-${iss.date.slice(4,6)}-${iss.date.slice(6,8)}发布）`;
  document.getElementById("detail").scrollTop = 0;
  // 列表高亮
  document.querySelectorAll(".prow.sel").forEach(e=>e.classList.remove("sel"));
  const row = document.querySelector(`.prow[data-seq="${seq}"]`);
  if (row && scrollRow) row.scrollIntoView({block:"nearest"});
  if (row) row.classList.add("sel");
  history.replaceState(null, "", "#case-"+seq);
}

function step(dir){
  const list = visibleCases();
  if (!list.length) return;
  let i = list.findIndex(c=>c.seq===state.sel);
  i = i<0 ? 0 : Math.min(list.length-1, Math.max(0, i+dir));
  select(list[i].seq);
}

// ---------- 收藏与笔记 ----------
function toggleFav(seq){
  const c = bySeq[seq]; if(!c) return;
  if (isFav(seq)) delete fav[seq];
  else fav[seq] = {tags: [], ts: Date.now()};
  persistFav();
  renderFavUI(c); renderFavList();
  const row = document.querySelector(`.prow[data-seq="${seq}"] .pmark`);
  if (row) row.textContent = (isFav(seq)?"★":"") + (hasNote(seq)?"📝":"");
}
function renderFavUI(c){
  const btn = document.getElementById("favBtn");
  if (!btn) return;
  btn.classList.toggle("on", isFav(c.seq));
  btn.innerHTML = isFav(c.seq) ? "★ 已收藏" : "☆ 收藏";
  const box = document.getElementById("favTags");
  if (!isFav(c.seq)) { box.style.display = "none"; return; }
  box.style.display = "flex";
  const cur = (fav[c.seq].tags||[]);
  const customs = cur.filter(t=>!TAG_PRESETS.includes(t));
  box.innerHTML =
    `<span style="font-size:13px;color:var(--muted)">收藏标签:</span>` +
    TAG_PRESETS.map(t=>`<span class="ftag ${cur.includes(t)?"on":""}" data-tag="${t}">${t}</span>`).join("") +
    customs.map(t=>`<span class="ftag on" data-tag="${esc(t)}">${esc(t)} <b data-del="${esc(t)}" style="cursor:pointer">✕</b></span>`).join("") +
    `<input id="customTag" placeholder="自定义标签"><button class="ftag" id="addTag">添加</button>`;
}
document.getElementById("favTags").addEventListener("click", e=>{
  const del = e.target.closest("[data-del]");
  if (del) {
    const c = bySeq[state.sel]; if(!c) return;
    const arr = fav[c.seq]?.tags || [];
    fav[c.seq].tags = arr.filter(t=>t!==del.dataset.del);
    persistFav(); renderFavUI(c); renderFavList();
    return;
  }
  if (e.target.id === "addTag") {
    const c = bySeq[state.sel]; if(!c) return;
    const inp = document.getElementById("customTag");
    const t = (inp.value||"").trim();
    if (!t) return;
    if (!fav[c.seq]) fav[c.seq] = {tags:[], ts:Date.now()};
    fav[c.seq].tags = fav[c.seq].tags||[];
    if (!fav[c.seq].tags.includes(t)) fav[c.seq].tags.push(t);
    persistFav(); renderFavUI(c); renderFavList();
    return;
  }
  const chip = e.target.closest(".ftag[data-tag]");
  if (chip) {
    const c = bySeq[state.sel]; if(!c) return;
    if (!fav[c.seq]) fav[c.seq] = {tags:[], ts:Date.now()};
    fav[c.seq].tags = fav[c.seq].tags||[];
    const t = chip.dataset.tag;
    if (fav[c.seq].tags.includes(t)) fav[c.seq].tags = fav[c.seq].tags.filter(x=>x!==t);
    else fav[c.seq].tags.push(t);
    persistFav(); renderFavUI(c); renderFavList();
  }
});
document.getElementById("dHead").addEventListener("click", e=>{
  if (e.target.closest("#favBtn")) toggleFav(state.sel);
});
function renderNoteUI(c){
  const wrap = document.getElementById("noteWrap");
  wrap.style.display = "block";
  document.getElementById("noteBox").value = (notes[c.seq]&&notes[c.seq].text)||"";
  document.getElementById("noteStatus").textContent =
    hasNote(c.seq) ? "已保存" : "自动保存，无需手动确认";
}
let noteTimer = null;
document.getElementById("noteBox").addEventListener("input", ()=>{
  const seq = state.sel; if(!seq) return;
  document.getElementById("noteStatus").textContent = "正在保存…";
  clearTimeout(noteTimer);
  noteTimer = setTimeout(()=>{
    const t = document.getElementById("noteBox").value;
    if (t.trim()) notes[seq] = {text: t, ts: Date.now()};
    else delete notes[seq];
    persistFav();
    const d = new Date();
    document.getElementById("noteStatus").textContent =
      "已保存 " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    renderFavList();
    const row = document.querySelector(`.prow[data-seq="${seq}"] .pmark`);
    if (row) row.textContent = (isFav(seq)?"★":"") + (hasNote(seq)?"📝":"");
  }, 800);
});
function renderFavList(){
  const tags = {};
  for (const f of Object.values(fav)) for (const t of (f.tags||[])) tags[t]=(tags[t]||0)+1;
  const nAll = Object.keys(fav).length;
  const nNote = Object.values(notes).filter(n=>n.text&&n.text.trim()).length;
  const cur = state.fav;
  const item = (val, label, n) =>
    `<button class="ver-item ${cur===val?"on":""}" data-fav="${val}"><span class="nm">${label}</span><b>${n}</b></button>`;
  let h = item("", "全部", DATA.cases.length) + item("all", IC["star-f"]+" 收藏", nAll) + item("note", IC.note+" 笔记", nNote);
  for (const t of TAG_PRESETS) h += item("tag:"+t, t, tags[t]||0);
  for (const t of Object.keys(tags)) if (!TAG_PRESETS.includes(t)) h += item("tag:"+t, t, tags[t]);
  document.getElementById("favList").innerHTML = h;
}
document.getElementById("favList").addEventListener("click", e=>{
  const b = e.target.closest("[data-fav]"); if(!b) return;
  state.fav = (state.fav === b.dataset.fav) ? null : b.dataset.fav;
  renderFavList();
  applyFilter();
});
document.getElementById("btnExport").onclick = ()=>{
  const blob = new Blob([JSON.stringify({fav, notes, exported: new Date().toISOString(), app:"cfa-referee-review-"+CFG.season}, null, 1)],
    {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = CFG.season + "赛季-收藏与笔记.json";
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("btnImport").onclick = ()=>document.getElementById("importFile").click();
document.getElementById("importFile").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      let n = 0;
      for (const [s, v] of Object.entries(d.fav||{})) {
        if (!fav[s] || (v.ts||0) > (fav[s].ts||0)) { fav[s] = v; n++; }
      }
      for (const [s, v] of Object.entries(d.notes||{})) {
        if (!notes[s] || (v.ts||0) > (notes[s].ts||0)) { notes[s] = v; n++; }
      }
      persistFav(); renderFavList(); applyFilter();
      alert(`导入完成：合并了 ${n} 条记录`);
    } catch(err) { alert("导入失败：文件不是有效的导出JSON"); }
  };
  rd.readAsText(f, "utf-8");
  e.target.value = "";
});

document.addEventListener("keydown", e=>{
  const tag = (e.target.tagName||"").toLowerCase();
  if (tag==="input"||tag==="select"||tag==="textarea") {
    if (e.key==="Escape") e.target.blur();
    return;
  }
  if (e.key==="/"){ e.preventDefault(); fSearch.focus(); return; }
  if (e.key==="Escape"){ document.querySelectorAll(".modal-mask.open")
      .forEach(m=>m.classList.remove("open")); return; }
  if (e.key==="ArrowDown"){ e.preventDefault(); step(1); }
  if (e.key==="ArrowUp"){ e.preventDefault(); step(-1); }
});

{ // 支持 #case-N 锚点（来自 stats.html 的跳转或刷新恢复）

      x.classList.toggle("on", x.dataset.v===""));
