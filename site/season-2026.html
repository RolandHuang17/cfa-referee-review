<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026赛季中国足协裁判评议全集 · 新裁判教学合集</title>
<style>
/* ===== season 页专属布局 (颜色/组件来自 data-cfa-theme 设计系统,此处只管结构) ===== */
body{overflow:hidden}
.workspace{display:grid;grid-template-columns:276px minmax(0,356px) minmax(0,1fr);
  height:calc(100vh - var(--top-h));min-height:0}
body.sb-off .workspace{grid-template-columns:0 minmax(0,356px) minmax(0,1fr)}
body.sb-off .sidebar{display:none}

/* ---- 侧栏筛选 ---- */
.sidebar{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-scroll{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 18px}
.side-h{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:2px;margin:15px 4px 7px;display:flex;align-items:center;gap:6px}
.side-h:first-child{margin-top:2px}
#verList,#favList,#compList{display:flex;flex-wrap:wrap;gap:6px}
.ver-item{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);
  border-radius:999px;background:var(--card);color:var(--ink2);font-size:12.5px;cursor:pointer;
  font-family:inherit;transition:.15s;text-align:left}
.ver-item:hover{border-color:var(--brand);color:var(--brand)}
.ver-item.on{background:var(--info-bg);border-color:var(--brand);color:var(--brand);font-weight:600}
.ver-item b{font-size:11px;color:var(--muted);font-weight:600}
.ver-item.on b{color:var(--brand)}
#catList{display:flex;flex-direction:column;gap:2px}
.cat-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6.5px 9px;
  border:1px solid transparent;background:none;border-radius:var(--r-sm);cursor:pointer;
  font-size:13px;color:var(--ink2);font-family:inherit;transition:.12s}
.cat-item:hover{background:var(--card2);color:var(--ink)}
.cat-item.on{background:var(--info-bg);color:var(--brand);font-weight:600}
.cat-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-item b{font-weight:600;font-size:11.5px;color:var(--muted)}
.cat-item small{color:var(--red);font-size:10.5px}
.cat-item.on b{color:var(--brand)}
#issueList{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
#issueList .cat-item{flex-direction:column;gap:1px;padding:5px 2px;text-align:center;justify-content:center;
  border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm)}
#issueList .cat-item .nm{flex:none;font-size:11.5px}
#issueList .cat-item b{font-size:10px}
#issueList .cat-item.on{background:var(--brand-strong);color:var(--on-brand)}
#issueList .cat-item.on b{color:var(--on-brand);opacity:.85}
#teamList{display:flex;flex-direction:column;gap:1px;max-height:232px;overflow-y:auto;
  border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--card);padding:3px}
#teamList .cat-item{padding:4.5px 7px;font-size:12.5px}
#teamList .crest{height:16px}
.team-empty{font-size:12px;color:var(--muted);padding:7px 9px}
.side-actions{display:flex;gap:7px;margin-top:9px}
.side-actions .btn{flex:1;padding:6px 8px;font-size:12.5px}
.side-link{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:14px;
  padding:8px;border-radius:var(--r-sm);border:1px dashed var(--line);background:none;
  color:var(--brand);cursor:pointer;font-size:13px;font-weight:600;font-family:inherit}
.side-link:hover{border-color:var(--brand);background:var(--info-bg)}

/* ---- 播放列表 ---- */
.plist{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--bg2)}
.plist-head{flex:none;display:flex;flex-direction:column;gap:2px;padding:9px 14px 8px;
  border-bottom:1px solid var(--line);background:var(--bg2)}
.plist-head .iss{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist-head .cnt{font-size:12px;color:var(--muted)}
.plist-head .cnt b{color:var(--brand);font-weight:700}
.plist-rows{flex:1;min-height:0;overflow-y:auto;background:var(--card)}
.ph{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:8px;padding:6px 14px;
  font-family:var(--font-display);font-size:12.5px;font-weight:700;letter-spacing:.8px;
  color:var(--ink);background:var(--card2);border-bottom:1px solid var(--line2)}
.ph b{color:var(--brand);font-weight:600}
.prow{display:flex;align-items:center;gap:9px;padding:8px 13px;cursor:pointer;
  border-bottom:1px solid var(--line2);transition:background .12s}
.prow:hover{background:var(--card2)}
.prow.sel{background:var(--info-bg);box-shadow:inset 3px 0 0 var(--brand)}
.prow .ptxt{flex:1;min-width:0}
.prow .ptxt b{display:flex;align-items:center;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden}
.prow .ptxt .vs{color:var(--faint);font-weight:400;font-size:11.5px;margin:0 2px}
.prow .ptxt i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .rv{flex:none;font-size:10.5px;border-radius:5px;padding:1px 6px;background:var(--info-bg);color:var(--info);font-weight:600}
.prow .rv.bad{background:var(--red-bg);color:var(--red)}
.prow .pmark{flex:none;display:inline-flex;color:var(--amber);gap:2px}
.prow .pmark .ic{vertical-align:0}
.plist-empty{padding:48px 16px;text-align:center;color:var(--muted)}

/* ---- 详情区 ---- */
.detail{min-width:0;min-height:0;overflow-y:auto;padding:16px 20px 44px}
.detail-empty{height:70vh;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;color:var(--faint);font-size:14.5px}
.d-card{max-width:1120px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px 22px 16px;box-shadow:var(--shadow-sm)}
.d-head{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:2px}
.cid{color:var(--muted);font-size:12.5px;background:var(--card2);border:1px solid var(--line);
  border-radius:6px;padding:2px 10px;white-space:nowrap}
.d-head .match{flex-basis:100%;display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:2px 0 0;
  font-family:var(--font-display);font-size:21px;font-weight:700;line-height:1.5;letter-spacing:.3px}
.d-head .match .crest{height:24px}
.d-video{max-width:960px;margin:13px auto 6px}
.d-video video{width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--r-md);display:block}
.vsw-row{display:flex;gap:8px;margin:9px 0 2px}
.vsw{padding:3px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card2);
  cursor:pointer;font-size:12.5px;color:var(--muted);font-family:inherit}
.vsw.on{background:var(--brand-strong);border-color:var(--brand-strong);color:var(--on-brand)}
.d-note{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.txt{font-size:15px;margin-top:10px;max-width:960px;margin-left:auto;margin-right:auto}
.txt .lbl{color:var(--brand);font-weight:700}
.txt p{margin:9px 0;white-space:pre-wrap}
.txt .concl{background:var(--card2);border-left:3px solid var(--brand);
  padding:11px 15px;border-radius:0 var(--r-md) var(--r-md) 0;font-size:15.5px}
.d-note-box{margin-top:13px;font-size:13.5px;background:var(--card2);border:1px solid var(--line);
  border-radius:var(--r-md);padding:9px 14px;max-width:960px;margin-left:auto;margin-right:auto}
.d-note-box summary{cursor:pointer;color:var(--brand);font-weight:600;user-select:none}
.d-note-box div{margin-top:7px;color:var(--ink2);line-height:1.8}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:12px;color:var(--muted);background:var(--card2);border:1px solid var(--line2);
  border-radius:5px;padding:2px 9px}
.d-foot{font-size:13px;margin-top:13px;color:var(--muted)}
.d-foot a{color:var(--brand);text-decoration:none}
.d-foot a:hover{text-decoration:underline}
.d-nav{display:flex;gap:10px;margin-top:15px;max-width:960px}
.d-nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;
  border-radius:var(--r-md);border:1px solid var(--line);background:var(--card2);cursor:pointer;
  font-size:14px;color:var(--ink2);font-family:inherit}
.d-nav button:hover{border-color:var(--brand);color:var(--brand)}
.favbtn{display:inline-flex;align-items:center;gap:5px;padding:3.5px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--card2);cursor:pointer;font-size:13px;color:var(--muted);font-family:inherit}
.favbtn.on{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);font-weight:700}
.favtags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.ftag{padding:3px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card2);
  cursor:pointer;font-size:12.5px;color:var(--muted);font-family:inherit}
.ftag.on{background:var(--info-bg);border-color:var(--brand);color:var(--brand);font-weight:600}
.ftag b{cursor:pointer;font-weight:400;margin-left:3px}
.favtags input{padding:4px 9px;border:1px solid var(--line);border-radius:var(--r-sm);
  font-size:12.5px;width:110px;background:var(--card2);color:var(--ink)}
.notewrap{margin-top:14px;max-width:960px}
.notewrap textarea{width:100%;min-height:76px;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--r-md);font-size:14px;font-family:inherit;resize:vertical;background:var(--card2);color:var(--ink)}
.notewrap .nstatus{font-size:12px;color:var(--muted)}
.mobile-back{display:none}

/* ---- 轻量版(html[data-lite]) 与 视频回退提示 ---- */
.src-actions{display:none;flex-wrap:wrap;align-items:center;gap:8px;margin:11px auto 0;max-width:960px}
.src-actions .srcbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:999px;
  border:1px solid var(--brand);background:var(--info-bg);color:var(--brand);
  font-size:13.5px;font-weight:600;text-decoration:none}
.src-actions .srcbtn:hover{background:var(--brand-strong);border-color:var(--brand-strong);color:var(--on-brand)}
.src-actions .srcsub{font-size:12px;color:var(--muted)}
.vfail-tip{display:none;flex-wrap:wrap;align-items:center;gap:9px;margin:13px auto 0;max-width:960px;
  padding:9px 14px;border:1px solid var(--amber-line);background:var(--amber-bg);
  border-radius:var(--r-md);font-size:13px;color:var(--ink2)}
.vfail-tip button{padding:4px 13px;border-radius:999px;border:1px solid var(--brand);
  background:var(--card);color:var(--brand);font-size:12.5px;font-weight:600;cursor:pointer}
.vfail-tip .vx{margin-left:auto;border:none;background:none;color:var(--muted);font-size:14px;padding:2px 6px;cursor:pointer}
html[data-lite] .src-actions{display:flex}
html[data-lite] .d-video,html[data-lite] .vsw-row,html[data-lite] .d-note,
html[data-lite] .vfail-tip{display:none!important}
html[data-lite] .txt{font-size:15.5px;line-height:1.95}
html[data-lite] .txt .concl{font-size:16px}
html[data-lite] .notewrap textarea{min-height:180px;font-size:14.5px;line-height:1.8}

/* ---- 统计矩阵 / 帮助 / 回顶 ---- */
.matrix table{border-collapse:collapse;width:100%;font-size:13.5px}
.matrix th,.matrix td{border-bottom:1px solid var(--line2);padding:6px 10px;text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix tr:hover td{background:var(--card2)}
.matrix .w{color:var(--red);font-weight:600}.matrix .g{color:var(--green);font-weight:600}
.matrix .p{color:var(--amber);font-weight:600}
.matrix tfoot td{font-weight:700;background:var(--card2)}
.help p{margin:9px 0;font-size:14px;line-height:1.8}
.help b{color:var(--brand)}
.top-btn{position:fixed;right:20px;bottom:22px;display:none;align-items:center;gap:6px;
  background:var(--brand-strong);color:var(--on-brand);border:none;border-radius:999px;
  padding:9px 16px;font-size:13px;cursor:pointer;z-index:30;box-shadow:var(--shadow-sm)}

/* ---- 响应式: 统一断点 1280 / 1080 / 640 ---- */
@media (max-width:1280px){.workspace{grid-template-columns:244px minmax(0,320px) minmax(0,1fr)}}
@media (max-width:1080px){
  .workspace{grid-template-columns:minmax(0,1fr)}
  .detail{display:none}
  body.detail-open .workspace{grid-template-columns:minmax(0,1fr)}
  body.detail-open .detail{display:block}
  .sidebar{position:fixed;left:0;top:var(--top-h);bottom:0;width:284px;z-index:70;
    transform:translateX(-105%);transition:transform .18s;box-shadow:var(--shadow)}
  body.sb-open .sidebar{transform:none}
  body.detail-open .plist{display:none}
  .mobile-back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;
    color:var(--brand);padding:2px 0 10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px}
  body.detail-open .top-btn{display:inline-flex}
}
@media (max-width:640px){
  .detail{padding:12px 12px 40px}
  .d-card{padding:14px 14px 12px}
  .d-head .match{font-size:17px}
  .d-video video{max-height:44vh}
  #issueList{grid-template-columns:repeat(5,1fr)}
}
</style>
<style data-cfa-theme>
/* ============================================================
   裁判学习平台 · 全站设计系统 (唯一权威样式层)
   风格: 暖纸色编辑排版 (Anthropic 式) —— 米白纸底/墨色文字/
   衬线大标题/陶土色点缀/发丝线边框/平面卡片
   - 深色为暖炭色, [data-theme="light"] 切换浅色纸面
   - 本文件由 scripts/theme.py 内联注入全部生成页 <head>
   - 各 builder 的 <style> 只允许写页面专属布局, 禁止重定义
     :root 颜色 token / 顶栏 / 按钮 / 徽章等共享组件
   ============================================================ */

/* ---------- 设计 tokens ---------- */
:root{
  /* 主题色: 陶土(clay)为品牌色, 红/绿/黄为判定语义色 */
  --brand:#a3502b; --brand-strong:#8f401f; --on-brand:#fdf6ef;
  --red:#b23a2e; --red-bg:rgba(178,58,46,.09); --red-line:rgba(178,58,46,.32);
  --green:#3e7b49; --green-bg:rgba(62,123,73,.1); --green-line:rgba(62,123,73,.32);
  --amber:#946d1b; --amber-bg:rgba(148,109,27,.11); --amber-line:rgba(148,109,27,.34);
  --info:#a3502b; --info-bg:rgba(163,80,43,.09); --info-line:rgba(163,80,43,.3);

  /* 表面与文字 (暖炭深色) */
  --bg:#191813; --bg2:#201e18; --card:#242219; --card2:#2b2820;
  --ink:#ece8dd; --ink2:#cfc9ba; --muted:#9c9585; --faint:#6e6759;
  --line:#3a362c; --line2:#2e2b22;
  --shadow:0 14px 40px rgba(10,9,6,.5);
  --shadow-sm:0 2px 10px rgba(10,9,6,.35);

  /* 顶栏 (与页面同底色 + 发丝线, 编辑风导航) */
  --top-bg:#191813; --top-ink:#ece8dd; --top-muted:#9c9585;
  --top-line:#3a362c; --top-chip:rgba(236,232,221,.07); --top-chip-on:rgba(224,139,98,.16);
  --top-input-bg:#242219; --top-input-line:#3a362c;

  /* 几何与字体 */
  --r-sm:6px; --r-md:10px; --r-lg:13px;
  --top-h:56px;
  --font:"Segoe UI",system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-display:Georgia,"Times New Roman","Noto Serif SC","Source Han Serif SC","STZhongsong","STSong","SimSun",serif;
}
[data-theme="light"]{
  --brand:#a3502b; --brand-strong:#8f401f; --on-brand:#fdf6ef;
  --red:#b23a2e; --red-bg:#f7e8e2; --red-line:#e6c3b6;
  --green:#3e7b49; --green-bg:#e8f0e4; --green-line:#c3d6be;
  --amber:#946d1b; --amber-bg:#f5edda; --amber-line:#e2d3a4;
  --info:#a3502b; --info-bg:#f4e7dd; --info-line:#e3c8b2;

  --bg:#f3f1ea; --bg2:#eceade; --card:#fbfaf5; --card2:#f1eee3;
  --ink:#211e1a; --ink2:#46423a; --muted:#7a7466; --faint:#a49d8c;
  --line:#ddd8ca; --line2:#e9e5d9;
  --shadow:0 14px 40px rgba(48,42,30,.12);
  --shadow-sm:0 1px 4px rgba(48,42,30,.06);

  --top-bg:#f3f1ea; --top-ink:#211e1a; --top-muted:#7a7466;
  --top-line:#ddd8ca; --top-chip:rgba(33,30,26,.05); --top-chip-on:rgba(163,80,43,.12);
  --top-input-bg:#fbfaf5; --top-input-line:#cfc9b8;
}

/* ---------- 基础 ---------- */
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:14.5px;line-height:1.65;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,a,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
::selection{background:rgba(163,80,43,.25)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
:focus:not(:focus-visible){outline:none}
.skip-link{position:absolute;left:-999px;top:0;z-index:200;background:var(--brand);
  color:var(--on-brand);padding:8px 14px;border-radius:0 0 8px 0}
.skip-link:focus{left:0}
h1,h2{font-variant-numeric:tabular-nums}

/* 滚动条 */
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- 图标 ---------- */
.ic{vertical-align:-2.5px;flex:none}
.ic.f{fill:currentColor;stroke:none}

/* ---------- 顶栏(全站统一) ---------- */
.topbar{height:var(--top-h);display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--top-bg);color:var(--top-ink);border-bottom:1px solid var(--top-line);
  position:sticky;top:0;z-index:60}
.topbar .brand{display:flex;align-items:center;gap:9px;text-decoration:none;
  color:var(--top-ink);white-space:nowrap;min-width:0}
.topbar .brand .ic{color:var(--brand)}
.topbar .brand b{font-family:var(--font-display);font-size:16.5px;letter-spacing:.4px;font-weight:700}
.topbar .brand .brand-sub{font-size:11.5px;color:var(--top-muted);padding:1px 9px;
  border:1px solid var(--top-line);border-radius:999px;white-space:nowrap}
.topbar .nav{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.topbar .nav::-webkit-scrollbar{display:none}
.topbar .top-right{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.topbar .tbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;
  border:1px solid transparent;border-radius:var(--r-sm);background:none;
  color:var(--top-muted);font-size:13.5px;text-decoration:none;cursor:pointer;
  white-space:nowrap;transition:.15s}
.topbar .tbtn:hover{background:var(--top-chip);color:var(--top-ink)}
.topbar .tbtn.cur{color:var(--top-ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--brand)}
.topbar input[type=search]{height:34px;min-width:130px;padding:0 12px 0 34px;
  border:1px solid var(--top-input-line);border-radius:var(--r-sm);
  background:var(--top-input-bg);color:var(--ink);font-size:13.5px}
.topbar .search-wrap{position:relative;display:flex;align-items:center;flex:1;max-width:480px;min-width:120px}
.topbar .search-wrap .ic{position:absolute;left:10px;color:var(--top-muted);pointer-events:none}

/* 主题切换按钮: 图标随主题互换 */
#btnTheme .when-light{display:none}
[data-theme="light"] #btnTheme .when-dark{display:none}
[data-theme="light"] #btnTheme .when-light{display:inline-flex}

/* 轻量版开关(#btnLite)激活态: 陶土描边 + 浅 chip 底 */
html[data-lite] #btnLite{background:var(--top-chip-on);color:var(--brand);
  box-shadow:inset 0 0 0 1px var(--brand)}

/* ---------- 通用组件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 14px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--card);color:var(--ink2);font-size:13.5px;cursor:pointer;
  white-space:nowrap;transition:.15s;text-decoration:none}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.btn.primary:hover{opacity:.88;color:var(--bg)}
.btn.iconbtn{padding:7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;
  border:1px solid var(--line);border-radius:999px;background:var(--card);
  color:var(--ink2);font-size:12.5px;cursor:pointer;white-space:nowrap;transition:.15s}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--info-bg);border-color:var(--brand);color:var(--brand);font-weight:600}
.chip b{font-weight:600;font-size:11.5px;color:var(--muted)}
.chip.on b{color:var(--brand)}

/* 判定徽章 */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2.5px 11px;
  border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.badge.wrong{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line)}
.badge.correct{background:var(--green-bg);color:var(--green);border:1px solid var(--green-line)}
.badge.pending{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-line)}
.badge.info{background:var(--info-bg);color:var(--info);border:1px solid var(--info-line);font-weight:500}
.badge.wrong,.badge.correct,.badge.pending,.badge.info{letter-spacing:.3px}

/* 队徽 (跨页共用, JS 注入) */
.crest{width:auto;border-radius:3px;vertical-align:-3px;margin-right:4px;background:#fff}
.team-dot{display:inline-block;border-radius:3px;vertical-align:-3px;margin-right:4px;flex:none}
.team-badge{display:inline-flex;align-items:center;justify-content:center;
  border-radius:4px;margin-right:4px;vertical-align:-4px;font-size:8px;font-weight:700;
  line-height:1;color:var(--badge-fg,#0b4c8c);background:var(--badge-bg,#e9f2fb)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.wrong{background:var(--red)}.dot.correct{background:var(--green)}.dot.pending{background:var(--amber)}
.kbd{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:0 5px;margin:0 2px;line-height:1.5}

/* ---------- 弹层 ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(20,17,12,.55);backdrop-filter:blur(3px);
  z-index:90;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:44px 16px}
.modal-mask.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  max-width:980px;width:100%;padding:22px 26px;box-shadow:var(--shadow)}
.modal h3{margin:0 0 14px;font-size:17px;font-family:var(--font-display)}
.modal .close{float:right;border:1px solid var(--line);background:var(--card2);color:var(--muted);
  border-radius:var(--r-sm);padding:4px 10px;cursor:pointer;font-size:12.5px}
.modal .close:hover{color:var(--ink);border-color:var(--muted)}

/* ---------- 通用响应式辅助 ---------- */
@media (max-width:760px){
  .topbar{gap:8px;padding:0 10px}
  .topbar .brand .brand-sub{display:none}
  .topbar .tbtn span{display:none}
  .topbar .tbtn{padding:6px 8px}
}

const DATA = {"cfg":{"season":"2026","favKey":"cfa2026.fav","noteKey":"cfa2026.notes","issueCount":22,"issueDesc":"2026赛季第1—22期（赛季进行中，持续更新）","stats":"stats-2026.html"},"cases":[{"seq":1,"issue":1,"no":1,"comp":"中超联赛","round":"第2轮","home":"山东泰山","away":"北京国安","minute":"34","match_info":"中超联赛第2轮，山东泰山VS北京国安","desc":"判例一：中超联赛第2轮，山东泰山VS北京国安。比赛第34分钟，北京国安队员在对方罚球区内顶球后，球疑似接触山东泰山8号队员手臂。裁判员未判手球犯规，VAR未介入。","appeal":"北京国安俱乐部申诉意见认为：对方队员手球犯规，本方应获得罚球点球。","conclusion":"对于此判例，评议组一致认为：山东泰山8号队员手臂抬起，手臂位置使身体不自然扩大，冒了手球犯规风险，此情形下球接触手臂，应判罚山东泰山8号手球犯规，并判罚球点球。裁判员决定错误，漏判手球犯规和罚球点球，VAR未介入错误。","videos":["2026/i01c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260318/1773819160913162.mp4"],"category":"handball","tags":["点球","漏判","手臂不自然扩大","VAR未介入错误"],"v":"wrong","var":"wrong"},{"seq":2,"issue":1,"no":2,"comp":"中甲联赛","round":"第1轮","home":"深圳青年人","away":"陕西联合","minute":"69","match_info":"中甲联赛第1轮，深圳青年人VS陕西联合","desc":"判例二：中甲联赛第1轮，深圳青年人VS陕西联合。比赛第69分钟，陕西联合7号队员在对方罚球区内带球，深圳青年人42号队员铲球防守，陕西联合7号倒地。裁判员判陕西联合7号佯装（假摔），并向其出示黄牌。","appeal":"陕西联合俱乐部申诉意见认为：本方7号带球突破，对方42号铲球防守犯规，本方应获得罚球点球。","conclusion":"对于此判例，评议组一致认为：深圳青年人42号队员铲球防守中草率绊倒陕西联合7号队员，其接触清晰，应判深圳青年人42号犯规，并判罚球点球。裁判员判攻方陕西联合7号佯装并出示黄牌的决定错误，并且漏判深圳青年人42号犯规和罚球点球。","videos":["2026/i01c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260318/1773819222194233.mp4"],"category":"penalty_area","tags":["点球","绊摔","假摔不成立"],"v":"wrong","var":"none"},{"seq":3,"issue":2,"no":1,"comp":"中超联赛","round":"第3轮","home":"河南俱乐部","away":"武汉三镇","minute":"76","match_info":"中超联赛第3轮，河南俱乐部彩陶坊VS武汉三镇","desc":"判例一：中超联赛第3轮，河南俱乐部彩陶坊VS武汉三镇。比赛第76分钟，裁判员判武汉三镇8号队员在本方罚球区附近对河南俱乐部22号队员犯规，犯规地点在罚球区外，由河南俱乐部踢直接任意球恢复比赛，并向武汉三镇队8号出示黄牌，VAR未介入。","appeal":"河南俱乐部申诉意见认为：对方犯规地点在罚球区内，本方应获得罚球点球。","conclusion":"对于此判例，评议组一致认为：武汉三镇8号对河南俱乐部22号犯规，犯规接触点在罚球区内，该接触造成了后者倒地，应判武汉三镇8号犯规，并判罚球点球。裁判员判犯规地点在罚球区外并判直接任意球的决定错误，漏判罚球点球。VAR未介入错误。","videos":["2026/i02c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260408/1775635981990743.mp4"],"category":"penalty_area","tags":["点球","犯规地点","VAR未介入错误"],"v":"wrong","var":"wrong"},{"seq":4,"issue":2,"no":2,"comp":"中超联赛","round":"第4轮","home":"辽宁铁人","away":"北京国安","minute":"58","match_info":"中超联赛第4轮，辽宁铁人楠波湾VS北京国安","desc":"判例二：中超联赛第4轮，辽宁铁人楠波湾VS北京国安。比赛第58分钟，北京国安进球。裁判员在球进入球门前鸣哨停止比赛，并判北京国安37号队员在之前的争抢时对对方守门员犯规，进球无效，由辽宁铁人踢直接任意球恢复比赛。VAR未介入。","appeal":"北京国安俱乐部申诉意见认为：应判本方进球有效，裁判员应先允许进球后，再通过VAR确认。","conclusion":"对于此判例，评议组多数成员认为：北京国安37号在进攻跑位时，对方队员对其有手部动作。辽宁铁人21号守门员触球后倒地，双方发生接触，北京国安37号有减速躲避动作。该接触属于双方争抢时不可避免的接触，双方均不犯规。裁判员判北京国安37号犯规的决定错误。另外，评议组指出：裁判员在球发展至边路，攻方再次突破传中形成头球射门前鸣哨停止比赛，时机不当，应延迟鸣哨。由于球越过球门线前，比赛已停止，因此此判例不能认定为进球有效。按照竞赛规则及VAR操作规范，在此情况下VAR无法介入。","videos":["2026/i02c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260408/1775636065870701.mp4"],"category":"goal_decision","tags":["冲撞守门员","进球无效","延迟鸣哨"],"v":"wrong","var":"none"},{"seq":5,"issue":2,"no":3,"comp":"中超联赛","round":"第4轮","home":"辽宁铁人","away":"北京国安","minute":"1","match_info":"中超联赛第4轮，辽宁铁人楠波湾VS北京国安","desc":"判例三：中超联赛第4轮，辽宁铁人楠波湾VS北京国安。比赛第1分钟，辽宁铁人21号守门员在本方罚球区外手触球。裁判员判辽宁铁人21号守门员手球犯规，由北京国安队踢直接任意球恢复比赛，并向辽宁铁人21号守门员出示黄牌警告。VAR未介入。","appeal":"","conclusion":"此判例无俱乐部提出申诉，但广受社会关注与讨论。对此，评议组作出意见一致的说明：按照竞赛规则，守门员在本方罚球区外手球犯规，并非一定会被出示红牌，而是需要按照考量战术犯规的标准去衡量是否需要出示红黄牌。在判断该犯规是否破坏了对方明显进球得分机会（DOGSO）时，需要同时满足攻方队员获得控球权的可能性、犯规发生地点与球门间的距离、比赛发展的大致方向、防守队员的位置和人数等四个因素和条件，必须全部满足DOGSO的条件时，才应出示红牌罚令出场。此判例中，球处于空中，双方均有队员对控球权进行争抢，攻方北京国安队员并非已经控球或清晰明显地将要获得控球权，此情形不符合DOGSO的判断标准。裁判员判辽宁铁人守门员手球犯规，并以阻止对方有希望的进攻（SPA）为由出示黄牌警告的决定正确。VAR未介入正确。","videos":["2026/i02c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260408/1775636101931763.mp4"],"category":"dogso","tags":["守门员","手球","SPA","黄牌","DOGSO不成立"],"v":"correct","var":"none"},{"seq":6,"issue":2,"no":4,"comp":"中乙联赛","round":"第2轮","home":"兰州陇原竞技","away":"长春喜都","minute":"57","match_info":"中乙联赛第2轮，兰州陇原竞技VS长春喜都","desc":"判例四：中乙联赛第2轮，兰州陇原竞技VS长春喜都。比赛第57分钟，长春喜都27号队员与兰州陇原竞技39号队员在边线附近有接触，长春喜都27号倒地，裁判员未判罚犯规。","appeal":"长春喜都俱乐部申诉意见认为：对方39号击打本方27号面部，应视为暴力行为并出示红牌将对方39号罚令出场。","conclusion":"对于此判例，评议组多数成员认为：兰州队39号故意挥臂击打长春队27号，应以鲁莽犯规为由出示黄牌警告；或以暴力行为为由出示红牌罚令出场，则取决于击打不同部位的严重程度。但从现有视频来看，无法确定其击打的具体接触部位，评议组对此（红牌或是黄牌）不予认定。但裁判员未判罚犯规的决定错误，漏判兰州队39号犯规，并且漏判黄牌或者红牌。","videos":["2026/i02c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260408/1775636116253847.mp4"],"category":"sfp_vc","tags":["挥臂","漏判","证据不足"],"v":"wrong","var":"none"},{"seq":7,"issue":2,"no":5,"comp":"中甲联赛","round":"第3轮","home":"宁波俱乐部","away":"无锡吴钩","minute":"","match_info":"中甲联赛第3轮，宁波俱乐部VS无锡吴钩","desc":"判例五：中甲联赛第3轮，宁波俱乐部VS无锡吴钩。比赛第90+4分钟，无锡吴钩队员在对方罚球区内与对方队员身体接触后倒地，裁判员未判罚犯规。","appeal":"无锡吴钩俱乐部申诉意见认为：本方队员在对方罚球区内被对方队员犯规，本方应获得罚球点球。","conclusion":"对于此判例，评议组一致认为：双方队员有相互争抢位置的接触动作，但从现有视频看，宁波俱乐部队员在本方罚球区内对对方队员实施了拉扯犯规，应判罚球点球。裁判员决定错误，漏判宁波俱乐部队员犯规和罚球点球。","videos":["2026/i02c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260408/1775636168374166.mp4"],"category":"penalty_area","tags":["点球","拉扯"],"v":"wrong","var":"none"},{"seq":8,"issue":3,"no":1,"comp":"中超联赛","round":"第5轮","home":"青岛西海岸","away":"辽宁铁人","minute":"79","match_info":"中超联赛第5轮，青岛西海岸VS辽宁铁人楠波湾","desc":"判例一：中超联赛第5轮，青岛西海岸VS辽宁铁人楠波湾。比赛第79分钟，辽宁铁人楠波湾47号队员进球。裁判员判辽宁铁人楠波湾47号队员手球犯规在先（进球前鸣哨），进球无效。VAR未介入。","appeal":"辽宁铁人楠波湾俱乐部申诉意见认为：本方47号队员并非手臂触球，应判本方进球有效。","conclusion":"对于此判例，评议组一致认为：根据视频画面，球接触了辽宁铁人楠波湾47号手臂，之后球直接进入对方球门，按照竞赛规则，应判辽宁铁人楠波湾47号手球犯规，进球无效。裁判员决定正确。VAR未介入正确。","videos":["2026/i03c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260415/1776242403316455.mp4"],"category":"handball","tags":["手球","进球无效"],"v":"correct","var":"correct"},{"seq":9,"issue":3,"no":2,"comp":"中超联赛","round":"第5轮","home":"青岛西海岸","away":"辽宁铁人","minute":"","match_info":"中超联赛第5轮，青岛西海岸VS辽宁铁人楠波湾","desc":"判例二：中超联赛第5轮，青岛西海岸VS辽宁铁人楠波湾。比赛第90+5分钟，辽宁铁人楠波湾进球。裁判员判进球前辽宁铁人楠波湾9号队员对青岛西海岸13号队员犯规在先，进球无效，由青岛西海岸踢直接任意球恢复比赛。VAR未介入。","appeal":"辽宁铁人楠波湾俱乐部申诉意见认为：本方不构成犯规，进球应有效。","conclusion":"对于此判例，评议组一致认为：辽宁铁人楠波湾9号推人犯规，随后裁判员判辽宁铁人楠波湾进球无效，裁判员决定正确。VAR未介入正确。","videos":["2026/i03c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260415/1776242450986806.mp4"],"category":"goal_decision","tags":["推搡","进球无效"],"v":"correct","var":"none"},{"seq":10,"issue":3,"no":3,"comp":"中超联赛","round":"第5轮","home":"北京国安","away":"成都蓉城","minute":"14","match_info":"中超联赛第5轮，北京国安VS成都蓉城","desc":"判例三：中超联赛第5轮，北京国安VS成都蓉城。比赛第14分钟，成都蓉城7号队员铲抢北京国安20号队员。裁判员判成都蓉城7号犯规并出示黄牌，VAR未介入。","appeal":"北京国安俱乐部申诉意见认为：对方7号队员应被红牌罚令出场。","conclusion":"对于此判例，评议组一致认为：成都蓉城7号铲球时主要力度和速度在其左脚，其左脚与球及北京国安20号均未接触或接触不明显，其右脚与对方队员的接触是该犯规的主要接触。成都蓉城7号右腿弯曲，脚背部位接触对方，虽然力度较大、速度较快，仍属于鲁莽犯规，不构成严重犯规。裁判员判成都蓉城7号犯规并出示黄牌的决定正确。VAR未介入正确。","videos":["2026/i03c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260415/1776242493927939.mp4"],"category":"sfp_vc","tags":["黄牌","铲球","红牌不成立"],"v":"correct","var":"correct"},{"seq":11,"issue":3,"no":4,"comp":"中超联赛","round":"第5轮","home":"北京国安","away":"成都蓉城","minute":"27","match_info":"中超联赛第5轮，北京国安VS成都蓉城","desc":"判例四：中超联赛第5轮，北京国安VS成都蓉城。比赛第27分钟，成都蓉城10号队员与北京国安26号队员争抢球。裁判员判成都蓉城10号犯规，未出示红黄牌。VAR未介入。","appeal":"北京国安俱乐部申诉意见认为：对方10号队员应被红牌罚令出场。","conclusion":"对于此判例，评议组一致认为：成都蓉城10号左脚鞋钉踩到北京国安26号脚踝略靠上部分，脚跟在地面支撑，身体重心主要在右脚，结合犯规力度强度，构成鲁莽犯规，应出示黄牌，不构成严重犯规，不应出示红牌。在俱乐部申诉的主要问题（红牌）上，裁判员决定正确，并非红牌。VAR未介入正确。但裁判员在判罚成都蓉城10号犯规的同时，漏判黄牌。","videos":["2026/i03c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260415/1776242522363736.mp4"],"category":"sfp_vc","tags":["黄牌","踩踏","红牌不成立"],"v":"wrong","var":"correct"},{"seq":12,"issue":3,"no":5,"comp":"中超联赛","round":"第5轮","home":"北京国安","away":"成都蓉城","minute":"84","match_info":"中超联赛第5轮，北京国安VS成都蓉城","desc":"判例五：中超联赛第5轮，北京国安VS成都蓉城。比赛第84分钟，成都蓉城进球。裁判员判进球有效。VAR未介入。","appeal":"北京国安俱乐部申诉意见认为：对方23号队员进球前手球在先，应判进球无效。","conclusion":"对于此判例，评议组首先作出规则说明：如果球接触攻方队员手臂后直接进入球门，按照竞赛规则，无论手臂是否处于自然位置，均构成手球犯规、进球无效。对于此判例，评议组一致认为：根据赛事官方转播视频以及VAR查看视频，无法清晰证明球在接触成都蓉城23号时，是否与其手臂有接触。因此支持临场裁判员作出的不是手球犯规、进球有效的决定。在VAR可查看的视频镜头中无清晰证据证明球接触手臂的情况下，VAR未介入正确。另外，评议组关注到并查看了相关俱乐部和社会媒体平台流传的各个角度拍摄的非官方视频，其来源以及可靠性无法证实和鉴定，且视频中也并无绝对清晰和一致的证据，因此评议组对于此判例以官方转播视频和VAR查看视频为依据作出认定。","videos":["2026/i03c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260415/1776242623841210.mp4"],"category":"handball","tags":["证据不足","进球有效"],"v":"correct","var":"correct"},{"seq":13,"issue":3,"no":6,"comp":"中超联赛","round":"第5轮","home":"深圳新鹏城","away":"云南玉昆","minute":"5","match_info":"中超联赛第5轮，深圳新鹏城VS云南玉昆","desc":"判例六：中超联赛第5轮，深圳新鹏城VS云南玉昆。比赛第5分钟，深圳新鹏城4号队员在对方罚球区内与云南玉昆7号队员接触后倒地。裁判员未判罚犯规。VAR未介入。","appeal":"深圳新鹏城俱乐部申诉意见认为：对方7号犯规，本方应获得罚球点球。","conclusion":"对于此判例，评议组一致认为：攻方深圳新鹏城4号在争抢中率先触球，云南玉昆7号未触球，但仅在摆腿动作的末端接触对方队员，其力度较轻微，并未构成深圳新鹏城4号随后倒地的主要原因。支持裁判员未判罚犯规的决定。VAR未介入正确。","videos":["2026/i03c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260415/1776242684156206.mp4"],"category":"penalty_area","tags":["轻微接触"],"v":"correct","var":"correct"},{"seq":14,"issue":3,"no":7,"comp":"中超联赛","round":"第5轮","home":"深圳新鹏城","away":"云南玉昆","minute":"26","match_info":"中超联赛第5轮，深圳新鹏城VS云南玉昆","desc":"判例七：中超联赛第5轮，深圳新鹏城VS云南玉昆。比赛第26分钟，云南玉昆34号队员进球。裁判员初始判进球有效，经VAR介入，裁判员在场回看后，维持进球有效的初始决定。","appeal":"深圳新鹏城俱乐部申诉意见认为：对方34号队员处于越位位置，应判越位犯规在先，进球无效。","conclusion":"对于此判例，评议组一致认为：云南玉昆34号处于越位位置时，是由深圳新鹏城队员主动将球踢来，并不是队友传球，不构成越位的基本条件。裁判员判云南玉昆进球有效以及在场回看后维持进球有效的决定均正确。VAR介入错误。","videos":["2026/i03c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260415/1776242749432834.mp4"],"category":"offside","tags":["越位位置","对方主动处理球","VAR介入错误"],"v":"correct","var":"wrong"},{"seq":15,"issue":3,"no":8,"comp":"中超联赛","round":"第5轮","home":"深圳新鹏城","away":"云南玉昆","minute":"","match_info":"中超联赛第5轮，深圳新鹏城VS云南玉昆","desc":"判例八：中超联赛第5轮，深圳新鹏城VS云南玉昆。比赛第90+3分钟，深圳新鹏城队射门，球接触云南玉昆34号队员手臂。裁判员未判罚手球犯规。VAR未介入。","appeal":"深圳新鹏城俱乐部申诉意见认为：应判罚对方手球犯规，本方应获得罚球点球。","conclusion":"对于此判例，评议组多数成员认为：云南玉昆34号手臂扩张，使身体不自然扩大，其手臂接触来球，应判手球犯规，并判罚球点球。裁判员决定错误，漏判手球犯规，漏判罚球点球。VAR未介入错误。","videos":["2026/i03c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260415/1776242791861448.mp4"],"category":"handball","tags":["点球","手臂不自然扩大","VAR未介入错误"],"v":"wrong","var":"wrong"},{"seq":16,"issue":3,"no":9,"comp":"中甲联赛","round":"第4轮","home":"长春亚泰","away":"陕西联合","minute":"66","match_info":"中甲联赛第4轮，长春亚泰VS陕西联合","desc":"判例九：中甲联赛第4轮，长春亚泰VS陕西联合。比赛第66分钟，陕西联合队员进攻中在对方罚球区内与对方队员接触后倒地，裁判员未判罚犯规。","appeal":"陕西联合俱乐部申诉意见认为：对方队员在罚球区内对本方队员犯规，本方应获得罚球点球。","conclusion":"对于此判例，评议组一致认为：长春亚泰队员在本方罚球区内防守时草率犯规，绊倒对方队员，应判罚球点球。裁判员决定错误，漏判长春亚泰队员犯规，漏判罚球点球。","videos":["2026/i03c09-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260415/1776242841250532.mp4"],"category":"penalty_area","tags":["点球","绊摔"],"v":"wrong","var":"none"},{"seq":17,"issue":3,"no":10,"comp":"中甲联赛","round":"第4轮","home":"大连鲲城","away":"延边龙鼎","minute":"73","match_info":"中甲联赛第4轮，大连鲲城VS延边龙鼎","desc":"判例十：中甲联赛第4轮，大连鲲城VS延边龙鼎。比赛第73分钟，在延边龙鼎罚球区内，双方队员争抢高空球，球疑似接触延边龙鼎队员手臂，裁判员未判罚手球犯规。","appeal":"大连鲲城俱乐部申诉意见认为：对方队员手球犯规，本方应获得罚球点球。","conclusion":"对于此判例，评议组一致认为：延边龙鼎队员在防守时手臂上扬，使身体不自然扩大，并接触球，应判手球犯规，并判罚球点球。裁判员决定错误，漏判手球犯规，漏判罚球点球。","videos":["2026/i03c10-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260415/1776242891169778.mp4"],"category":"handball","tags":["点球","手臂不自然扩大"],"v":"wrong","var":"none"},{"seq":18,"issue":3,"no":11,"comp":"中甲联赛","round":"第4轮","home":"石家庄功夫","away":"佛山南狮","minute":"38","match_info":"中甲联赛第4轮，石家庄功夫VS佛山南狮","desc":"判例十一：中甲联赛第4轮，石家庄功夫VS佛山南狮。比赛第38分钟，在佛山南狮罚球区内，双方队员争抢球后，石家庄 功夫队员倒地，裁判员未判罚犯规。","appeal":"石家庄功夫俱乐部申诉意见认为：对方队员犯规，本方应获得罚球点球。","conclusion":"对于此判例，评议组一致认为：石家庄功夫31号争抢球时将右腿伸至佛山南狮8号行进和争抢球路线上，造成双方接触，并借助该接触倒地。佛山南狮8号不构成犯规。裁判员未判罚犯规正确。","videos":["2026/i03c11-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260415/1776242947136797.mp4"],"category":"penalty_area","tags":["主动倒地"],"v":"correct","var":"none"},{"seq":19,"issue":3,"no":12,"comp":"中甲联赛","round":"第4轮","home":"石家庄功夫","away":"佛山南狮","minute":"75","match_info":"中甲联赛第4轮，石家庄功夫VS佛山南狮","desc":"判例十二：中甲联赛第4轮，石家庄功夫VS佛山南狮。比赛第75分钟，在佛山南狮罚球区内，球疑似接触佛山南狮队员手臂，裁判员未判罚手球犯规。","appeal":"石家庄功夫俱乐部申诉意见认为：对方队员手球犯规，本方应获得罚球点球。","conclusion":"对于此判例，评议组一致认为：佛山南狮队员手臂触球，使身体不自然扩大，应判手球犯规，并判罚球点球。裁判员决定错误，漏判手球犯规，漏判罚球点球。","videos":["2026/i03c12-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260415/1776242995715378.mp4"],"category":"handball","tags":["点球","手臂不自然扩大"],"v":"wrong","var":"none"},{"seq":20,"issue":3,"no":13,"comp":"中乙联赛","round":"第3轮","home":"泰安天贶","away":"北京理工","minute":"4","match_info":"中乙联赛第3轮，泰安天贶VS北京理工","desc":"判例十三：中乙联赛第3轮，泰安天贶VS北京理工。比赛第4分钟，泰安天贶29号队员铲抢北京理工10号队员，裁判员判泰安天贶29号犯规，并出示黄牌警告。","appeal":"北京理工俱乐部申诉意见认为：对方29号应以严重犯规或暴力行为被出示红牌罚令出场。","conclusion":"对于此判例，评议组多数成员认为：泰安天贶29号铲球犯规，并使用了过分的力量，危及对方队员安全，构成严重犯规，应出示红牌罚令出场。裁判员出示黄牌的决定错误，漏判红牌。","videos":["2026/i03c13-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260415/1776243037649176.mp4"],"category":"sfp_vc","tags":["红牌","严重犯规","铲球"],"v":"wrong","var":"none"},{"seq":21,"issue":3,"no":14,"comp":"中乙联赛","round":"第3轮","home":"泰安天贶","away":"北京理工","minute":"69","match_info":"中乙联赛第3轮，泰安天贶VS北京理工","desc":"判例十四：中乙联赛第3轮，泰安天贶VS北京理工。比赛第69分钟，北京理工队进攻传球，泰安天贶39号队员疑似手球，裁判员未判罚手球犯规。","appeal":"北京理工俱乐部申诉意见认为：对方39号手球犯规，破坏本方明显进球得分机会，应被出示红牌罚令出场。","conclusion":"对于此判例，评议组首先一致认为：对于俱乐部申诉的主要意见（红牌），即使泰安天贶39号手臂与球接触并构成手球犯规，但因北京理工进攻队员在此高球长传的情况下并非已控球或绝对即将控球，此犯规并不满足破坏明显进球得分机会的标准，不构成红牌，仅应以阻止有希望的进攻为由出示黄牌。其次，评议组多数成员认为：现有视频无法清晰展示球是否接触泰安天贶39号手臂部位，以及接触的具体情况，因此评议组对于泰安天贶39号是否手球犯规不予认定。","videos":["2026/i03c14-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260415/1776243068698989.mp4"],"category":"handball","tags":["DOGSO不成立","证据不足"],"v":"pending","var":"none"},{"seq":22,"issue":3,"no":15,"comp":"中乙联赛","round":"第3轮","home":"泰安天贶","away":"北京理工","minute":"88","match_info":"中乙联赛第3轮，泰安天贶VS北京理工","desc":"判例十五：中乙联赛第3轮，泰安天贶VS北京理工。比赛第88分钟，在北京理工队罚球区内，泰安天贶20号试图使用凌空动作踢球，并接触到北京理工9号队员，裁判员判泰安天贶20号犯规，无纪律处罚。","appeal":"北京理工俱乐部申诉意见认为：对方20号应被出示红牌罚令出场。","conclusion":"对于此判例，评议组一致认为：泰安天贶20号转身凌空踢球动作合理，但未顾及对方队员的位置，腿部横向踢到对方队员躯干部位，属于鲁莽犯规，应出示黄牌，不构成严重犯规，不应出示红牌。在俱乐部申诉的主要问题（红牌）上，裁判员决定正确，并非红牌。但裁判员在判罚泰安天贶20号犯规的同时，漏判黄牌。","videos":["2026/i03c15-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260415/1776243118645507.mp4"],"category":"sfp_vc","tags":["黄牌","凌空踢","红牌不成立"],"v":"wrong","var":"none"},{"seq":23,"issue":3,"no":16,"comp":"中乙联赛","round":"第3轮","home":"厦门飞鹭","away":"广东铭途","minute":"","match_info":"中乙联赛第3轮，厦门飞鹭VS广东铭途","desc":"判 规则精神，在使用脑震荡替换规则的比赛中，球队有权决定本方场上队员是否需要以脑震荡替换名义被换下，无论该队员当时头部是否受到了明显的伤害或撞击。裁判员及其他官员临场无权进行鉴定和干涉。国际足球理事会制定该条款主要是为了顾及球员头部受伤存在潜伏期的潜在风险以及保护运动员的健康权益。同时，作为约束和平衡，竞赛规则规定，一方球队使用脑震荡替换权限时，对方球队即相应增加一个额外替换名额以及一次额外替换程序机会。","videos":["2026/i03c19-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260415/1776243329987686.mp4"],"category":"penalty_area","tags":["点球","铲球"],"v":"correct","var":"none"},{"seq":27,"issue":4,"no":1,"comp":"中超联赛","round":"第6轮","home":"青岛海牛","away":"青岛西海岸","minute":"32","match_info":"中超联赛第6轮，青岛海牛VS青岛西海岸","desc":"判例一：中超联赛第6轮，青岛海牛VS青岛西海岸。比赛第32分钟，青岛海牛7号队员在对方罚球区内与青岛西海岸22号队员接触后倒地。裁判员初始未判罚犯规。经VAR介入，裁判员在场回看后，维持初始决定。","appeal":"青岛海牛俱乐部申诉意见认为：对方队员对本方队员犯规，本方应获得罚球点球。","conclusion":"对于此判例，评议组一致认为：青岛西海岸22号铲球犯规，应判罚球点球。VAR介入正确。裁判员经在场回看后，维持不犯规的初始判罚的决定错误，漏判犯规和罚球点球。","videos":["2026/i04c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260422/1776861757626111.mp4"],"category":"penalty_area","tags":["点球","铲球","VAR回看错误"],"v":"wrong","var":"correct"},{"seq":28,"issue":4,"no":2,"comp":"中超联赛","round":"第6轮","home":"青岛海牛","away":"青岛西海岸","minute":"60","match_info":"中超联赛第6轮，青岛海牛VS青岛西海岸","desc":"判例二：中超联赛第6轮，青岛海牛VS青岛西海岸。比赛第60分钟，青岛西海岸23号队员在本方罚球区内疑似手臂触球。裁判员未判罚手球犯规， VAR未介入。","appeal":"青岛海牛俱乐部申诉意见认为：对方手球犯规，本方应获得罚球点球。","conclusion":"对于此判例，评议组一致认为：青岛西海岸23号队员起跳后手臂处于与对方互相争抢位置过程中的自然位置，属于意外手球，不应视为犯规。裁判员未判罚手球犯规正确。VAR未介入正确。","videos":["2026/i04c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260422/1776861799819165.mp4"],"category":"handball","tags":["自然位置","意外手球"],"v":"correct","var":"correct"},{"seq":29,"issue":4,"no":3,"comp":"中超联赛","round":"第6轮","home":"山东泰山","away":"上海海港","minute":"13","match_info":"中超联赛第6轮，山东泰山VS上海海港","desc":"判例三：中超联赛第6轮，山东泰山VS上海海港。比赛第13分钟，山东泰山7号队员进球。裁判员判山东泰山7号越位犯规，进球无效。VAR未介入。","appeal":"山东泰山俱乐部申诉意见认为：本方7号是在对方23号主动处理球后得球，不构成越位犯规。","conclusion":"对于此判例，评议组一致认为：通过VAR查看画面可以看到，在守方队员铲球后，球又接触了攻方山东泰山队员脚部，随后处于越位位置的山东泰山7号得球射门，属于越位犯规，进球无效。裁判员决定正确。VAR未介入正确。","videos":["2026/i04c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/vi 方应获得罚球点球。","conclusion":"对于此判例，评议组一致认为：长春亚泰守门员出击并触到球，之后双方队员因惯性发生不可避免的接触，长春亚泰守门员无其他附加犯规动作，不构成犯规。裁判员取消罚球点球判罚的最终决定正确。在此情况下，只能以坠球恢复比赛。","videos":["2026/i04c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260422/1776862026343211.mp4"],"category":"penalty_area","tags":["守门员","坠球"],"v":"correct","var":"none"},{"seq":34,"issue":4,"no":8,"comp":"中甲联赛","round":"第5轮","home":"佛山南狮","away":"长春亚泰","minute":"37","match_info":"中甲联赛第5轮，佛山南狮VS长春亚泰","desc":"判例八：中甲联赛第5轮，佛山南狮VS长春亚泰。比赛第37分钟，佛山南狮队员在对方罚球区内与对方队员接触后倒地，裁判员未判罚犯规。","appeal":"佛山南狮俱乐部申诉意见认为：对方队员对本方队员犯规，本方应获得罚球点球。","conclusion":"对于此判例，评议组一致认为：长春亚泰队员争抢位置动作合理，无明显犯规动作，佛山南狮进攻队员跑动中进入对方行进线路造成双方接触。双方均不犯规。裁判员未判罚犯规的决定正确。","videos":["2026/i04c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260422/1776862050354444.mp4"],"category":"penalty_area","tags":["争抢位置"],"v":"correct","var":"none"},{"seq":35,"issue":4,"no":9,"comp":"中甲联赛","round":"第5轮","home":"南京城市","away":"深圳青年人","minute":"","match_info":"中甲联赛第5轮，南京城市VS深圳青年人","desc":"判例九：中甲联赛第5轮，南京城市VS深圳青年人。比赛第90+1分钟，双方在边线附近争抢，之后深圳青年人25号队员在比赛停止时疑似踩踏倒地的南京城市22号队员。裁判员向深圳青年人25号出示黄牌。","appeal":"南京城市俱乐部申诉意见认为：对方25号在比赛停止期间，踩踏和踢本方22号，属于暴力行为，应予红牌罚令出场。","conclusion":"对于此判例，评议组多数成员认为：南京城市22号在争抢过程中手臂持续拉扯深圳青年人25号腿部，直至倒地后仍有抬手控制对方腿部的动作。综合考量事件的发展过程、深圳青年人25号挣脱和踩踏对方队员手臂的严重程度、以及后续双方再次的相互接触等情况，深圳青年人25号行为相对较收敛，并非使用野蛮方式和过分力量。属于非体育行为，不属于暴力行为。认可裁判员向深圳青年人25号出示黄牌的决定。","videos":["2026/i04c09-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260422/1776862099172561.mp4"],"category":"sfp_vc","tags":["黄牌","踩踏","暴力行为不成立"],"v":"correct","var":"none"},{"seq":36,"issue":4,"no":10,"comp":"中甲联赛","round":"第5轮","home":"无锡吴钩","away":"大连鲲城","minute":"43","match_info":"中甲联赛第5轮，无锡吴钩VS大连鲲城","desc":"判例十：中甲联赛第5轮，无锡吴钩VS大连鲲城。比赛第43分钟，大连鲲城踢角球，之后裁判员判无锡吴钩队员在本方罚球区内手球犯规，并判罚球点球。","appeal":"无锡吴钩俱乐部申诉意见认为：对方队员手球犯规，不应判本方手球犯规，不应判罚球点球。","conclusion":"对于此判例，评议组多数成员认为：现有视频无法清晰显示球是否与双方队员手臂接触的具体情况。评议组对此判例不予认定。","videos":["2026/i04c10-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260422/1776862128593748.mp4"],"category":"handball","tags":["证据不足"],"v":"pending","var":"none"},{"seq":37,"issue":4,"no":11,"comp":"中甲联赛","round":"第5轮","home":"无锡吴钩","away":"大连鲲城","minute":"45","match_info":"中甲联赛第5轮，无锡吴钩VS大连鲲城","desc":"判例十一：中甲联赛第5轮，无锡吴钩VS大连鲲城。比赛第45分钟，大连鲲城踢罚球点球，球被无锡吴钩守门员扑出，大连鲲城另一名队员补射进球。裁判员判进球有效。","appeal":"无锡吴钩俱乐部申诉意见认为：对方补射进球的队员，在罚球点球时提前进入，不应判进球有效，应重踢罚球点球。","conclusion":"对于此判例，评议组一致认为：在罚球点球踢出前，无锡吴钩守门员已违规提前离开球门线，并且将球点球扑出。按照竞赛规则，应重罚球点球，并劝诫该守门员。大连鲲城补射的队员也提前进入罚球区，并且补射进球，也构成违规，并应重罚球点球，不可判进球有效。无锡吴钩守门员违规在先，构成应重罚球点球的主要原因。裁判员判进球有效的决定错误。","videos":["2026/i04c11-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260422/1776862150170645.mp4"],"category":"penalty_area","tags":["点球重罚","提前进入"],"v":"wrong","var":"none"},{"seq":38,"issue":4,"no":12,"comp":"中甲联赛","round":"第5轮","home":"无锡吴钩","away":"大连鲲城","minute":"70","match_info":"中甲联赛第5轮，无锡吴钩VS大连鲲城","desc":"判例十二：中甲联赛第5轮，无锡吴钩VS大连鲲城。比赛第70分钟，双方队员在大连鲲城罚球区内争抢后，无锡吴钩队员倒地，裁判员未判罚犯规。","appeal":"无锡吴钩俱乐部申诉意见认为：对方队员对本方19号拉扯犯规，本队应获得罚球点球。","conclusion":"对于此判例，评议组多数成员认为：现有视频无法清晰展示大连鲲城队员对无锡吴钩队员手臂拉扯的动作，以及无锡吴钩队员试图主动触球的具体情况。评议组对此判例不予认定。","videos":["2026/i04c12-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260422/1776862178798706.mp4"],"category":"penalty_area","tags":["证据不足"],"v":"pending","var":"none"},{"seq":39,"issue":4,"no":13,"comp":"中甲联赛","round":"第5轮","home":"石家庄功夫","away":"定南赣联","minute":"27","match_info":"中甲联赛第5轮，石家庄功夫VS定南赣联","desc":"判例十三：中甲联赛第5轮，石家庄功夫VS定南赣联。比赛第27分钟，石家庄功夫进球，助理裁判员示意越位，裁判员判石家庄功夫队员越位在先，进球无效。","appeal":"石家庄功夫俱乐部申诉意见认为：本方队员不越位，进球应有效。","conclusion":"对于此判例，评议组一致认为：石家庄功夫7号队员未处于越位位置，后续进球应有效。助理裁判员判断错误，裁判员判石家庄功夫越位犯规进球无效的决定错误。","videos":["2026/i04c13-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260422/1776862235913491.mp4"],"category":"offside","tags":["越位误判","进球有效"],"v":"wrong","var":"none"},{"seq":40,"issue":4,"no":14,"comp":"中乙联赛","round":"第4轮","home":"江西庐山","away":"贵州贵阳竞技","minute":"59","match_info":"中乙联赛第4轮，江西庐山VS贵州贵阳竞技","desc":"判例十四：中乙联赛第4轮，江西庐山VS贵州贵阳竞技。比赛第59分钟，江西庐山22号队员射门，球疑似接触贵州贵阳竞技44号队员手臂，裁判员判贵阳竞技44号手球犯规，并认定犯规地点处于罚球区内，判罚球点球。","appeal":"贵州贵阳竞技俱乐部申诉意见认为：本方44号手球犯规位置处于罚球区外，应判罚直接任意球，不应判罚球点球。","conclusion":"对于此判例，评议组多数成员认为：通过现有视频判断，贵州贵阳竞技44号队员手臂接触球的位置在罚球区外，应判手球犯规和直接任意球。裁判员判罚球点球的决定错误。","videos":["2026/i04c14-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260422/1776862289793682.mp4"],"category":"handball","tags":["手球","犯规地点","直接任意球"],"v":"wrong","var":"none"},{"seq":41,"issue":4,"no":15,"comp":"中乙联赛","round":"第4轮","home":"长春喜都","away":"泰安天贶","minute":"35","match_info":"中乙联赛第4轮，长春喜都VS泰安天贶","desc":"判例十五：中乙联赛第4轮，长春喜都VS泰安天贶。比赛第35分钟，泰安天贶踢任意球，球传至对方罚球区内，泰安天贶7号队员与对方守门员接触后倒地。裁判员未判罚犯规。","appeal":"泰安天贶俱乐部申诉意见认为：对方守门员对本方7号犯规，本方应获得罚球点球，对方守门员应被黄牌警告。","conclusion":"对于此判例，评议组一致认为：从现有视频看，长春喜都守门员出击动作合理，成功触球，且无其他犯规动作。支持裁判员未判罚犯规的决定。","videos":["2026/i04c15-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260422/1776862346717348.mp4"],"category":"penalty_area","tags":["守门员"],"v":"correct","var":"none"},{"seq":42,"issue":4,"no":16,"comp":"中乙联赛","round":"第4轮","home":"长春喜都","away":"泰安天贶","minute":"76","match_info":"中乙联赛第4轮，长春喜都VS泰安天贶","desc":"判例十六：中乙联赛第4轮，长春喜都VS泰安天贶。比赛第76分钟，在长春喜都罚球区内，双方队员争抢球后，泰安天贶33号队员倒地，裁判员判泰安天贶队员越位犯规。","appeal":"泰安天贶俱乐部申诉意见认为：本方队员不越位，且对方3号对本方33号实施暴力行为，本方应获得罚球点球，对方3号应被红牌罚令出场。","conclusion":"对于此判罚，评议组首先一致认为：泰安天贶队未出现越位犯规，裁判员与助理裁判员沟通出现失误，不应判罚越位犯规；双方接触中也不存在暴力行为或其他应出示红牌的情形。其次，评议组多数成员认为：泰安天贶33号率先触球后，腿部下落过程中与长春喜都3号接触，现有视频无法证明长春喜都3号是否构成犯规，支持裁判员未判罚犯规的决定。","videos":["2026/i04c16-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260422/1776862379319672.mp4"],"category":"offside","tags":["越位误判","暴力行为不成立"],"v":"wrong","var":"none"},{"seq":43,"issue":4,"no":17,"comp":"中乙联赛","round":"第4轮","home":"温州俱乐部","away":"杭州临平吴越","minute":"74","match_info":"中乙联赛第4轮，温州俱乐部VS杭州临江吴越","desc":"判例十七：中乙联赛第4轮，温州俱乐部VS杭州临江吴越。比赛第74分钟，裁判员先判罚杭州临江吴越队员在本方罚球区内手球犯规，后改判温州俱乐部越位犯规，由守方杭州临江吴越踢间接任意球恢复比赛。","appeal":"温州俱乐部申诉意见认为：本方踢任意球时，本方稍后头顶球的队员并不处于越位位置，不是越位犯规，裁判员不应改变已作出的罚球点球的决定。","conclusion":"对于此判例，评议组一致认为：温州俱乐部踢任意球时，其一名队员疑似处于越位位置（并非随后头顶球者）并在随后与对方队员争抢头球，构成干扰对方队员。现有视频无法证明其在本方踢任意球触球时是否处于越位位置，助理裁判员位置较好，评议组支持助理裁判员的判断，以及裁判员作出的温州俱乐部越位犯规的最终决定。因此不存在后续手球犯规与否的认定。","videos":["2026/i04c17-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260422/1776862415475669.mp4"],"category":"offside","tags":["越位位置","干扰对方","证据不足"],"v":"correct","var":"none"},{"seq":44,"issue":4,"no":18,"comp":"中乙联赛","round":"第4轮","home":"兰州陇原竞技","away":"山东泰山B队","minute":"3","match_info":"中乙联赛第4轮，兰州陇原竞技VS山东泰山B队","desc":"判例十八：中乙联赛第4轮，兰州陇原竞技VS山东泰山B队。比赛第3分钟，兰州陇原竞技17号队员铲抢山东泰山B队57号队员，后者倒地。裁判员判兰州陇原竞技17号犯规，未出示红黄牌。","appeal":"山东泰山俱乐部申诉意见认为：对方17号严重犯规，应予红牌罚令出场。","conclusion":"对于此判例，评议组一致认为：兰州陇原竞技17号严重犯规，应予出示红牌罚令出场。裁判员决定错误，漏判红牌。","videos":["2026/i04c18-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260422/1776862452652504.mp4"],"category":"sfp_vc","tags":["红牌","严重犯规","铲球"],"v":"wrong","var":"none"},{"seq":45,"issue":4,"no":19,"comp":"中乙联赛","round":"第4轮","home":"武汉三镇B队","away":"成都蓉城B队","minute":"18","match_info":"中乙联赛第4轮，武汉三镇B队VS成都蓉城B队","desc":"判例十九：中乙联赛第4轮，武汉三镇B队VS成都蓉城B队。比赛第18分钟，武汉三镇B队55号队员与成都蓉城B队45号队员在成都蓉城B队罚球区附近接触后倒地，裁判员判成都蓉城B队45号犯规，并认定犯规地点在罚球区外，由武汉三镇B队踢直接任意球恢复比赛。","appeal":"武汉三镇俱乐部申诉意见认为：对方犯规地点在罚球区内，本方应获得罚球点球。","conclusion":"对于此判例，评议组一致认为：成都蓉城B队45号防守时率先触球，并无附加犯规动作，不构成犯规。因此不存在犯规地点及是否应判罚球点球的认定。","videos":["2026/i04c19-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260422/1776862483574555.mp4"],"category":"penalty_area","tags":["误判","先触球"],"v":"wrong","var":"none"},{"seq":46,"issue":4,"no":20,"comp":"中乙联赛","round":"第4轮","home":"武汉三镇B队","away":"成都蓉城B队","minute":"41","match_info":"中乙联赛第4轮，武汉三镇B队VS成都蓉城B队","desc":"判例二十：中乙联赛第4轮，武汉三镇B队VS成都蓉城B队。比赛第41分钟，双方倒地争抢球，武汉三镇B队48号队员将球踢出，随后与成都蓉城B队队员接触，裁判员判罚成都蓉城B队队员犯规，并出示黄牌。","appeal":"武汉三镇俱乐部申诉意见认为：对方队员使用过分力量犯规，应予红牌罚令出场。","conclusion":"对于此判例，评议组一致认为：从现有视频看，武汉三镇B队48号将球踢出，成都蓉城B队队员沿地面铲球，接触对方队员时有屈膝动作，应视为鲁莽犯规，并出示黄牌，不构成严重犯规，不应出示红牌。裁判员判成都蓉城B队队员犯规并出示黄牌的决定正确。","videos":["2026/i04c20-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260422/1776862513573642.mp4"],"catego ，属于鲁莽犯规，不属于严重犯规。应出示黄牌，不应出示红牌。裁判员判重庆铜梁龙38号犯规并出示黄牌的决定正确。VAR未介入正确。","videos":["2026/i05c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260429/1777457921598861.mp4"],"category":"sfp_vc","tags":["黄牌","红牌不成立"],"v":"correct","var":"correct"},{"seq":54,"issue":5,"no":8,"comp":"中超联赛","round":"第8轮","home":"大连英博","away":"云南玉昆","minute":"9","match_info":"中超联赛第8轮，大连英博海发VS云南玉昆","desc":"判例八：中超联赛第8轮，大连英博海发VS云南玉昆。比赛第9分钟，大连英博海发16号队员在对方罚球区内与云南玉昆34号队员接触后倒地。裁判员未判罚犯规。VAR未介入。","appeal":"大连英博海发俱乐部申诉意见认为：对方34号对本方16号犯规，应被判罚球点球。","conclusion":"对于此判例，评议组一致认为：双方在球门前争抢时，云南玉昆34号试图触球，因双方相互争抢的干扰而未触到球，大连英博海发16号未作出试图触球动作，双方顺势出现身体接触，不构成犯规。裁判员未判罚犯规的决定正确。VAR未介入正确。","videos":["2026/i05c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260429/1777457942735541.mp4"],"category":"penalty_area","tags":["争抢球"],"v":"correct","var":"correct"},{"seq":55,"issue":5,"no":9,"comp":"中超联赛","round":"第8轮","home":"大连英博","away":"云南玉昆","minute":"12","match_info":"中超联赛第8轮，大连英博海发VS云南玉昆","desc":"判例九：中超联赛第8轮，大连英博海发VS云南玉昆。比赛第12分钟，云南玉昆11号队员进球。裁判员判进球有效。VAR未介入。","appeal":"大连英博海发俱乐部申诉意见认为：对方11号在进球前对本方38号犯规在先，应判进球无效。","conclusion":"对于此判例，评议组一致认为：云南玉昆11号向前跳起争抢落点，大连英博海发38号向后移动争抢位置，双方共同造成接触，云南玉昆11号无附加犯规动作，不构成犯规。裁判员未判罚犯规，并判进球有效的决定正确。VAR未介入正确。","videos":["2026/i05c09-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260429/1777457976775401.mp4"],"category":"goal_decision","tags":["争抢位置","进球有效"],"v":"correct","var":"correct"},{"seq":56,"issue":5,"no":10,"comp":"中乙联赛","round":"第5轮","home":"杭州临平吴越","away":"广州蒲公英","minute":"40","match_info":"中乙联赛第5轮，杭州临平吴越VS广州蒲公英","desc":"判例十：中乙联赛第5轮，杭州临平吴越VS广州蒲公英。比赛第40分钟，广州蒲公英队员在本方罚球区内手臂触球，经助理裁判员协助提示，裁判员判广州蒲公英队员手球犯规，并判罚球点球。","appeal":"广州蒲公英俱乐部申诉意见认为：本方队员不是手球犯规，不应被判罚球点球。","conclusion":"对于此判例，评议组多数成员认为：广州蒲公英手臂触球的队员背向来球，但其手臂平举打开，扩张程度高，使身体不自然变大，并非此情形下的自然位置，构成手球犯规。裁判员判广州蒲公英队员手球犯规并判罚球点球的决定正确。","videos":["2026/i05c10-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260429/1777458011218701.mp4"],"category":"handball","tags":["点球","手臂不自然扩大"],"v":"correct","var":"none"},{"seq":57,"issue":5,"no":11,"comp":"中乙联赛","round":"第5轮","home":"上海赛更达","away":"大连可为","minute":"80","match_info":"中乙联赛第5轮，上海赛更达VS大连可为","desc":"判例十一：中乙联赛第5轮，上海赛更达VS大连可为。比赛第80分钟，大连可为23号队员带球进攻，并在对方罚球区附近试图踢球时倒地，裁判员未判罚犯规。","appeal":"大连可为俱乐部申诉意见认为：对方队员在罚球区内绊倒本方队员犯规，本队应获得罚球点球，并应向对方队员出示黄牌警告。","conclusion":"对于此判例，评议组首先一致认为：上海赛更达队员从背后争抢球时草率绊倒大连可为23号，构成犯规，从现有视频看，犯规接触地点在罚球区外，应判直接任意球，不应判罚球点球。其次评议组多数成员认为：该犯规应因阻止对方有希望进攻被出示黄牌警告。在俱乐部申诉的主要问题（罚球点球）上，裁判员决定正确，不判罚球点球。但裁判员漏判上海赛更达队员犯规、直接任意球及黄牌。","videos":["2026/i05c11-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260429/1777458053765435.mp4"],"category":"freekick_foul","tags":["绊摔","SPA","黄牌","罚球区外"],"v":"wrong","var":"none"},{"seq":58,"issue":5,"no":12,"comp":"中乙联赛","round":"第5轮","home":"江西庐山","away":"湖北青年星","minute":"21","match_info":"中乙联赛第5轮，江西庐山VS湖北青年星","desc":"判例十二：中乙联赛第5轮，江西庐山VS湖北青年星。比赛第21分钟，江西庐山踢角球，角球踢出后，江西庐山33号队员在对方罚球区内与湖北青年星14号队员接触后倒地。裁判员未判罚犯规。","appeal":"江西庐山俱乐部申诉意见认为：对方14号抱摔本方33号，应判犯规并判罚球点球。","conclusion":"对于此判例，评议组多数成员认为：湖北青年星14号过度拉扯抱摔江西庐山33号，应判犯规和罚球点球，并出示黄牌警告。裁判员决定错误，漏判罚球点球和黄牌。","videos":["2026/i05c12-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260429/1777458084764896.mp4"],"category":"penalty_area","tags":["点球","拉扯","黄牌"],"v":"wrong","var":"none"},{"seq":59,"issue":5,"no":13,"comp":"中乙联赛","round":"第5轮","home":"海门珂缔缘","away":"北京理工","minute":"81","match_info":"中乙联赛第5轮，海门珂缔缘VS北京理工","desc":"判例十三：中乙联赛第5轮，海门珂缔缘VS北京理工。比赛第81分钟，北京理工进球，助理裁判员示意越位，裁判员与助理裁判员商议后认定北京理工未越位犯规，进球有效。","appeal":"海门珂缔缘俱乐部申诉意见认为：对方越位犯规在先，进球应无效。","conclusion":"对于此判例，评议组一致认为：在北京理工长传球触球时，有一名北京理工队员（6号）处于越位位置，随后该队员与对方队员接触并影响了其争抢球的能力，此时已构成干扰对方的越位犯规。后续进球无效。裁判员未判罚越位犯规，以及判进球有效的决定错误。","videos":["2026/i05c13-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260429/1777458161543047.mp4"],"category":"offside","tags":["越位位置","干扰对方","进球有效"],"v":"wrong","var":"none"},{"seq":60,"issue":5,"no":14,"comp":"中乙联赛","round":"第5轮","home":"泰安天贶","away":"兰州陇原竞技","minute":"33","match_info":"中乙联赛第5轮，泰安天贶VS兰州陇原竞技","desc":"判例十四：中乙联赛第5轮，泰安天贶VS兰州陇原竞技。比赛第33分钟，双方队员在中场边线附近争抢，裁判员未判罚犯规。","appeal":"泰安天贶俱乐部申诉意见认为：对方10号队员在双方身体接触后，挥拳报复本队3号队员，即使未击打接触到本方队员，也应因暴力行为将对方10号红牌罚令出场。","conclusion":"对于此判例，评议组一致认为：从现有视频看，兰州陇原竞技10号队员在双方争抢位置的身体接触后，有挥臂动作，但未接触对方队员，视频中也未能证明其试图对对方队员实施恶意野蛮动作。其动作不构成暴力行为，不应出示红牌，也不构成犯规。裁判员未判罚犯规的决定正确。","videos":["2026/i05c14-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260429/1777458204826177.mp4"],"category":"sfp_vc","tags":["挥臂","暴力行为不成立"],"v":"correct","var":"none"},{"seq":61,"issue":5,"no":15,"comp":"中乙联赛","round":"第5轮","home":"泰安天贶","away":"兰州陇原竞技","minute":"65","match_info":"中乙联赛第5轮，泰安天贶VS兰州陇原竞技","desc":"判例十五：中乙联赛第5轮，泰安天贶VS兰州陇原竞技。比赛第65分钟，双方队员在兰州陇原竞技罚球区内接触后，泰安天贶33号队员倒地，裁判员未判罚犯规。之后泰安天贶33号推搡兰州陇原竞技6号队员，裁判员向泰安天贶33号出示红牌罚令出场。","appeal":"泰安天贶俱乐部申诉意见认为：对方队员在罚球区内对本方队员犯规，本方应获得罚球点球。","conclusion":"对于此判例，评议组一致认为：兰州陇原竞技队员在防守封堵时已站好位置，且无附加犯规动作。泰安天贶33号完成扣球动作后并未继续控球，并有借双方的接触主动倒地的成分。兰州陇原竞技队员不构成犯规。裁判员未判罚犯规的决定正确。另外，评议组一致认为：随后泰安天贶33号在无球状态下肢体攻击兰州陇原竞技6号，应视为暴力行为并出示红牌。裁判员向泰安天贶33号出示红牌罚令出场的决定正确。","videos":["2026/i05c15-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260429/1777458241857771.mp4"],"category":"sfp_vc","tags":["红牌","暴力行为","无球状态"],"v":"correct","var":"none"},{"seq":62,"issue":6,"no":1,"comp":"中超联赛","round":"第9轮","home":"天津津门虎","away":"武汉三镇","minute":"","match_info":"中超联赛第9轮，天津津门虎VS武汉三镇","desc":"判例一：中超联赛第9轮，天津津门虎VS武汉三镇。比赛第90+14分钟，天津津门虎31号队员在对方罚球区内与武汉三镇19号队员争抢球后倒地。裁判员未判罚犯规，VAR未介入。","appeal":"天津津门虎俱乐部申诉意见认为：对方19号对本方31号犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：武汉三镇19号争抢球时未踢到球，踢倒天津津门虎31号，犯规程度属于鲁莽犯规，应判武汉三镇19号犯规，判罚球点球，并向武汉三镇19号出示黄牌警告。裁判员决定错误，漏判犯规和罚球点球，漏判黄牌。VAR未介入错误。","videos":["2026/i06c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260506/1778074639598658.mp4"],"category":"penalty_area","tags":["点球","黄牌","VAR未介入错误"],"v":"wrong","var":"wrong"},{"seq":63,"issue":6,"no":2,"comp":"中超联赛","round":"第9轮","home":"青岛海牛","away":"上海海港","minute":"28","match_info":"中超联赛第9轮，青岛海牛VS上海海港","desc":"判例二：中超联赛第9轮，青岛海牛VS上海海港。比赛第28分钟，上海海港49号队员在对方罚球区内与青岛海牛4号队员接触后倒地。裁判员未判罚犯规，VAR未介入。","appeal":"上海海港俱乐部申诉意见认为：对方4号对本方49号犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：双方队员在跑位中发生接触，球未传至双方跑位路线，守方有试图避免接触的动作，双方均不构成犯规。裁判员未判罚犯规正确。VAR未介入正确。","videos":["2026/i06c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260506/1778074660892313.mp4"],"category":"penalty_area","tags":["正常接触"],"v":"correct","var":"correct"},{"seq":64,"issue":6,"no":3,"comp":"中超联赛","round":"第9轮","home":"青岛海牛","away":"上海海港","minute":"56","match_info":"中超联赛第9轮，青岛海牛VS上海海港","desc":"判例三：中超联赛第9轮，青岛海牛VS上海海港。比赛第56分钟，上海海港38号队员与青岛海牛6号队员有接触。裁判员停止比赛，向青岛海牛6号出示黄牌，VAR未介入。","appeal":"上海海港俱乐部申诉意见认为：对方6号故意挥臂击打本方38号，应向对方6号出示红牌罚令出场。","conclusion":"对于此判例，评议组多数成员认为：青岛海牛6号在被对方铲球倒地队员干扰后，有手臂顺势向后甩并击打对方的动作，但其力度和故意程度尚未构成严重犯规或暴力行为，不应出示红牌，应出示黄牌。裁判员向青岛海牛6号出示黄牌的决定正确。VAR未介入正确。","videos":["2026/i06c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260506/1778074701160925.mp4"],"category":"sfp_vc","tags":["黄牌","挥臂","红牌不成立"],"v":"correct","var":"correct"},{"seq":65,"issue":6,"no":4,"comp":"中甲联赛","round":"第7轮","home":"定南赣联","away":"陕西联合","minute":"42","match_info":"中甲联赛第7轮，定南赣联VS陕西联合","desc":"判例四：中甲联赛第7轮，定南赣联VS陕西联合。比赛第42分钟，在定南赣联罚球区内，双方队员争抢倒地，裁判员判定南赣联守门员对对方队员犯规，并判罚球点球。","appeal":"定南赣联俱乐部申诉意见认为：对方进攻队员先推搡本方28号并致其倒地，犯规在先，且随后本方守门员倒地后扑救触球，不应被判犯规和罚球点球。","conclusion":"对于此判例，评议组多数成员认为：双方队员跑动中的接触为正常接触，双方均不犯规，随后定南赣联守门员出击并且触到球，无附加犯规动作，不构成犯规，不应判罚球点球。裁判员判定南赣联守门员犯规并判罚球点球的决定错误。","videos":["2026/i06c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260506/1778074756246663.mp4"],"category":"penalty_area","tags":["守门员","误判"],"v":"wrong","var":"none"},{"seq":66,"issue":6,"no":5,"comp":"中甲联赛","round":"第7轮","home":"定南赣联","away":"陕西联合","minute":"71","match_info":"中甲联赛第7轮，定南赣联VS陕西联合","desc":"判例五：中甲联赛第7轮，定南赣联VS陕西联合。比赛第71分钟，定南赣联队员在对方罚球区内带球进攻时倒地，裁判员未判罚犯规。","appeal":"定南赣联俱乐部申诉意见认为：对方队员在罚球区内对本方队员犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：陕西联合防守队员手臂与对方进攻队员有接触，但程度未构成犯规。在随后双方的腿部接触中，现有视频无法证实陕西联合队员对对方队员犯规并导致其倒地，支持裁判员作出的不犯规的决定。","videos":["2026/i06c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260506/1778074785611895.mp4"],"category":"penalty_area","tags":["轻微接触"],"v":"correct","var":"none"},{"seq":67,"issue":6,"no":6,"comp":"中乙联赛","round":"第6轮","home":"赣州瑞狮","away":"厦门飞鹭","minute":"79","match_info":"中乙联赛第6轮，赣州瑞狮VS厦门飞鹭","desc":"判例六：中乙联赛第6轮，赣州瑞狮VS厦门飞鹭。比赛第79分钟，厦门飞鹭15号队员争抢球时疑似抬脚踢到方队员头部，裁判员判其犯规并出示黄牌，后经助理裁判员协助，裁判员最终决定向厦门飞鹭15号出示红牌罚令出场。","appeal":"厦门飞鹭俱乐部申诉意见认为：本方15号收脚未踢到对方队员头部，随后其它部位接触，不构成严重犯规，不应被出示红牌罚令出场。","conclusion":"对于此判例，评议组多数成员认为：厦门飞鹭15号抬腿并未踢到对方队员头部，腿部下落过程中身体接触对方队员，考虑到冲撞的部位、力度和强度，属于鲁莽犯规，应出示黄牌，不属于严重犯规或暴力行为，不应出示红牌。裁判员向厦门飞鹭15号出示红牌的最终决定错误。","videos":["2026/i06c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260506/1778074837233802.mp4"],"category":"sfp_vc","tags":["黄牌","红牌不成立"],"v":"wrong","var":"none"},{"seq":68,"issue":6,"no":7,"comp":"中乙联赛","round":"第6轮","home":"成都蓉城希拉谷","away":"杭州临平吴越","minute":"14","match_info":"中乙联赛第6轮，成都蓉城希拉谷VS杭州临平吴越","desc":"判例七：中乙联赛第6轮，成都蓉城希拉谷VS杭州临平吴越。比赛第14分钟，成都蓉城希拉谷31号队员在对方罚球区内抢断球后倒地，裁判员判杭州临平吴越4号队员犯规，并判罚球点球。","appeal":"杭州临平吴越俱乐部申诉意见认为：本方4号未犯规，不应判罚球点球。","conclusion":"对于此判例，评议组一致认为：杭州临平吴越4号踢球准备较充足，并先触球，之后收脚试图躲避接触，成都蓉城希拉谷31号上前冲抢并造成双方接触。杭州临平吴越4号不犯规，不应判罚球点球。裁判员判杭州临平吴越4号犯规以及判罚球点球的决定错误。","videos":["2026/i06c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260506/1778074905183548.mp4"],"category":"penalty_area","tags":["先触球","误判"],"v":"wrong","var":"none"},{"seq":69,"issue":6,"no":8,"comp":"中乙联赛","round":"第6轮","home":"成都蓉城希拉谷","away":"杭州临平吴越","minute":"63","match_info":"中乙联赛第6轮，成都蓉城希拉谷VS杭州临平吴越","desc":"判例八：中乙联赛第6轮，成都蓉城希拉谷VS杭州临平吴越。比赛第63分钟，杭州临平吴越进球，助理裁判员示意越位，裁判员判杭州临平吴越20号队员越位犯规，进球无效。","appeal":"杭州临平吴越俱乐部申诉意见认为：本方20号未处于越位位置，进球应有效。","conclusion":"对于此判例，评议组一致认为：杭州临平吴越20号队员在本方传球时未处于越位位置，助理裁判员判断错误，裁判员判杭州临平吴越越位犯规的决定错误。","videos":["2026/i06c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260506/1778074935402358.mp4"],"category":"offside","tags":["越位误判"],"v":"wrong","var":"none"},{"seq":70,"issue":6,"no":9,"comp":"中乙联赛","round":"第6轮","home":"成都蓉城希拉谷","away":"杭州临平吴越","minute":"","match_info":"中乙联赛第6轮，成都蓉城希拉谷VS杭州临平吴越","desc":"判例九：中乙联赛第6轮，成都蓉城希拉谷VS杭州临平吴越。比赛第90+3分钟，杭州临平吴越进球，裁判员判杭州临平吴越23号队员手球犯规，进球无效。","appeal":"杭州临平吴越俱乐部申诉意见认为：本方23号并未主动用手臂触球，不应判本方手球犯规，进球应有效。","conclusion":"对于此判例，评议组一致认为：从现有视频看，杭州临平吴越射门后，球接触了杭州临平吴越23号队员手臂，之后直接进入球门。对此评议组作出说明，按照竞赛规则，球接触攻方队员手臂后直接进入球门，无论何种情形，均属于攻方手球犯规。裁判员判杭州临平吴越23号队员手球犯规及进球无效的决定正确。","videos":["2026/i06c09-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260506/1778074974536551.mp4"],"category":"handball","tags":["手球","进球无效"],"v":"correct","var":"none"},{"seq":71,"issue":6,"no":10,"comp":"中乙联赛","round":"第6轮","home":"青岛红狮","away":"泰安天贶","minute":"82","match_info":"中乙联赛第6轮，青岛红狮VS泰安天贶","desc":"判例十：中乙联赛第6轮，青岛红狮VS泰安天贶。比赛第82分钟，泰安天贶11号队员在对方罚球区内进攻时对对方守门员犯规。裁判员停止比赛后，双方队员有身体接触。裁判员未出示红黄牌。","appeal":"泰安天贶俱乐部申诉意见认为：比赛停止时，对方32号冲撞本方11号，应判对方32号暴力行为，并予以红牌罚令出场。","conclusion":"对于此判例，评议组首先一致认为：泰安天贶11号对对方守门员犯规后，青岛红狮32号对泰安天贶11号的犯规行为有不满情绪，但其与对方的身体接触有所克制，未构成暴力行为，不应出示红牌。其次，评议组多数成员认为：应因非体育行为向青岛红狮32号出示黄牌。在俱乐部申诉的主要问题（红牌）上，裁判员决定正确，并非红牌。但裁判员漏判青岛红狮32号黄牌。","videos":["2026/i06c10-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260506/1778075004327204.mp4"],"category":"sfp_vc","tags":["黄牌","非体育行为","红牌不成立"],"v":"wrong","var":"none"},{"seq":72,"issue":6,"no":11,"comp":"中乙联赛","round":"第6轮","home":"广东铭途","away":"江西庐山","minute":"19","match_info":"中乙联赛第6轮，广东铭途VS江西庐山","desc":"判例十一：中乙联赛第6轮，广东铭途VS江西庐山。比赛第19分钟，江西庐山踢角球，随后进球，裁判员判罚江西庐山3号队员对对方守门员犯规，进球无效。","appeal":"江西庐山俱乐部申诉意见认为：本方3号未犯规，应判进球有效。","conclusion":"对于此判例，评议组多数成员认为：江西庐山3号队员手臂与广东铭途守门员有接触和推搡，影响了后者的扑救动作，现有视频无法清晰展现双方接触具体情况，支持裁判员作出的攻方犯规和进球无效的决定。","videos":["2026/i06c11-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260506/1778075032603354.mp4"],"category":"goal_decision","tags":["冲撞守门员","证据不足","进球无效"],"v":"correct","var":"none"},{"seq":73,"issue":6,"no":12,"comp":"中乙联赛","round":"第6轮","home":"广东铭途","away":"江西庐山","minute":"","match_info":"中乙联赛第6轮，广东铭途VS江西庐山","desc":"判例十二：中乙联赛第6轮，广东铭途VS江西庐山。比赛第90+6分钟，江西庐山33号队员在对方罚球区内争抢位置时与对方队员接触后倒地，裁判员未判罚犯规。","appeal":"江西庐山俱乐部申诉意见认为：对方队员在罚球区内拉扯本方33号致其倒地，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：广东铭途队员在本方罚球区内对江西庐山33号实施拉扯并致其失去重心倒地，应判罚球点球。裁判员决定错误，漏判罚球点球。","videos":["2026/i06c12-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260506/1778075053187236.mp4"],"category":"penalty_area","tags":["点球","拉扯"],"v":"wrong","var":"none"},{"seq":74,"issue":7,"no":1,"comp":"中超联赛","round":"第10轮","home":"北京国安","away":"大连英博","minute":"44","match_info":"中超联赛第10轮，北京国安VS大连英博海发","desc":"判例一：中超联赛第10轮，北京国安VS大连英博海发。比赛第44分钟，北京国安37号队员踩踏到大连英博海发4号队员腿部。裁判员未判罚犯规，经VAR介入，裁判员在场回看后，判北京国安37号严重犯规，并出示红牌罚令出场。","appeal":"北京国安俱乐部申诉意见认为：本方37号动作是正常跑动中无法避免的接触，不应被出示红牌。","conclusion":"对于此判例，评议组一致认为：考虑到北京国安37号踩踏对方的部位、力度、直腿等因素，而且踩踏前可以观察到对方队员铲球情况，并非完全无可避免。该犯规构成严重犯规。裁判员判北京国安37号严重犯规并出示红牌罚令出场的最终决定正确。VAR介入正确。","videos":["2026/i07c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260513/1778670034220291.mp4"],"category":"sfp_vc","tags":["红牌","严重犯规","踩踏"],"v":"correct","var":"correct"},{"seq":75,"issue":7,"no":2,"comp":"中超联赛","round":"第11轮","home":"青岛西海岸","away":"武汉三镇","minute":"86","match_info":"中超联赛第11轮，青岛西海岸VS武汉三镇","desc":"判例二：中超联赛第11轮，青岛西海岸VS武汉三镇。比赛第86分钟，武汉三镇10号队员在对方罚球区内与对方守门员接触后倒地。裁判员判青岛西海岸守门员犯规，并判罚球点球，经VAR介入，裁判员在场回看后，维持罚球点球的决定。","appeal":"青岛西海岸俱乐部申诉意见认为：双方身体接触发生前，武汉三镇10号身体已开始向前自然倒地，不应判罚球点球。","conclusion":"对于此判例，评议组一致认为：武汉三镇10号在接触对方守门员之前，脚部已经离地，身体向前倾倒，随后与对方守门员的接触并非其倒地主要原因。在其倒地前青岛西海岸防守队员在其身后对其进行的手臂接触也属于可以接受的程度，没有明显推击犯规。青岛西海岸守门员对身体动作有所控制和试图规避冲撞，无附加犯规动作。此判例守方不犯规，VAR介入正确。裁判员维持罚球点球的决定错误。","videos":["2026/i07c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260513/1778670065348885.mp4"],"category":"penalty_area","tags":["主动倒地","误判","VAR回看错误"],"v":"wrong","var":"correct"},{"seq":76,"issue":7,"no":3,"comp":"中超联赛","round":"第11轮","home":"青岛海牛","away":"大连英博","minute":"","match_info":"中超联赛第11轮，青岛海牛VS大连英博海发","desc":"判例三：中超联赛第11轮，青岛海牛VS大连英博海发。比赛第45+8分钟，在青岛海牛罚球区内，助理裁判员示意大连英博海发进攻中越位，裁判员停止比赛判越位犯规，之后大连英博海发22号队员射门，双方队员随后出现冲突并有肢体接触，青岛海牛28号守门员与大连英博海发22号有接触，后者倒地；随后青岛海牛28号守门员手部接触大连英博海发38号队员。裁判员未向双方队员出示红黄牌，VAR未介入。","appeal":"大连英博海发俱乐部申诉意见认为：对方28号守门员故意撞倒本方22号，构成暴力行为，应红牌罚令出场；随后其又用手部锁喉推搡本方38号，再次构成暴力行为，也符合罚令出场条件。","conclusion":"对于此判例，评议组首先一致认为：在比赛停止后，青岛海牛28号守门员与大连英博海发22号的身体接触，以及手部与大连英博海发38号的接触，均未达到暴力行为程度。在俱乐部申诉的主要问题（红牌）上，裁判员决定正确，并非红牌。但应因非体育行为出示黄牌警告青岛海牛28号守门员。其次，评议组一致认为：之前大连英博海发队员未处于越位位置，助理裁判员越位判断错误，裁判员判大连英博海发越位犯规的决定错误。","videos":["2026/i07c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260513/1778670106734550.mp4"],"category":"sfp_vc","tags":["黄牌","非体育行为","红牌不成立","越位误判"],"v":"wrong","var":"none"},{"seq":77,"issue":7,"no":4,"comp":"中超联赛","round":"第11轮","home":"浙江俱乐部绿城","away":"天津津门虎","minute":"73","match_info":"中超联赛第11轮，浙江俱乐部绿城VS天津津门虎","desc":"判例四：中超联赛第11轮，浙江俱乐部绿城VS天津津门虎。比赛第73分钟，浙江俱乐部绿城14号队员进球。裁判员判进球有效，经VAR介入，裁判员在场回看后，裁判员改判进球前浙江俱乐部绿城36号队员手球犯规在先，进球无效。","appeal":"浙江俱乐部申诉意见认为：本方36号不构成手球犯规，进球应为有效。","conclusion":"对于此判例，评议组一致认为：浙江俱乐部绿城36号跳起争抢球，下落过程中，手臂处于此时的合理位置，球经对方队员近距离接触变线后接触浙江俱乐部绿城36号手臂，随后浙江俱乐部绿城另一名队员（14号）进球，因此浙江俱乐部绿城36号不构成手球犯规，后续进球有效。裁判员改判浙江俱乐部绿城36号手球犯规和进球无效的决定错误。VAR介入错误。","videos":["2026/i07c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260513/1778670185231295.mp4"],"category":"handball","tags":["自然位置","近距离变线","进球有效","VAR介入错误"],"v":"wrong","var":"wrong"},{"seq":78,"issue":7,"no":5,"comp":"中超联赛","round":"第11轮","home":"浙江俱乐部绿城","away":"天津津门虎","minute":"","match_info":"中超联赛第11轮，浙江俱乐部绿城VS天津津门虎","desc":"判例五：中超联赛第11轮，浙江俱乐部绿城VS天津津门虎。比赛第90+6分钟，天津津门虎进攻中将球传至对方罚球区内，浙江俱乐部绿城1号守门员与天津津门虎9号队员发生接触。裁判员未判罚犯规，经VAR介入，裁判员在场回看后，判浙江俱乐部绿城1号守门员犯规，判罚球点球，并向浙江俱乐部绿城1号守门员出示黄牌。","appeal":"浙江俱乐部申诉意见认为：该接触为双方自然惯性产生，本方守门员不犯规，不应判罚球点球。","conclusion":"对于此判例，评议组多数成员认为：浙江俱乐部绿城1号守门员出击争抢球，但并未触到球，冲撞正常跑位的天津津门虎9号并致其倒地，构成犯规。裁判员判浙江俱乐部绿城1号守门员犯规并判罚球点球的最终决定正确，VAR介入正确。","videos":["2026/i07c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260513/1778670266765470.mp4"],"category":"penalty_area","tags":["守门员","冲撞","点球"],"v":"correct","var":"correct"},{"seq":79,"issue":7,"no":6,"comp":"中甲联赛","round":"第8轮","home":"大连鲲城","away":"广州豹","minute":"1","match_info":"中甲联赛第8轮，大连鲲城VS广东广州豹","desc":"判例六：中甲联赛第8轮，大连鲲城VS广东广州豹。比赛第1分钟，大连鲲城10号队员进球，裁判员判进球有效。","appeal":"广东广州豹俱乐部申诉意见认为：对方21号队员手球犯规在先，随后对方10号的进球应无效。","conclusion":"对于此判例，评议组多数成员认为：大连鲲城传中球至对方罚球区内，大连鲲城21号队员手臂扩张，使身体不自然扩大，手臂触球，构成手球犯规在先，随后进球无效。裁判员判大连鲲城进球有效的决定错误，漏判手球犯规。","videos":["2026/i07c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260513/1778670365169311.mp4"],"category":"handball","tags":["手球","手臂不自然扩大","进球无效"],"v":"wrong","var":"none"},{"seq":80,"issue":7,"no":7,"comp":"中甲联赛","round":"第8轮","home":"大连鲲城","away":"广州豹","minute":"46","match_info":"中甲联赛第8轮，大连鲲城VS广东广州豹","desc":"判例七：中甲联赛第8轮，大连鲲城VS广东广州豹。比赛第46分钟，大连鲲城3号队员在本方罚球区线附近对广东广州豹17号队员犯规，裁判员认定犯规位置在罚球区外，并判直接任意球。","appeal":"广东广州豹俱乐部申诉意见认为：对方3号对本方17号持续拉扯，导致本方17号在对方罚球区内倒地，应判罚球点球。","conclusion":"对于此判例，评议组首先一致认为：大连鲲城3号对广东广州豹17号有持续拉扯动作，并在进入罚球区前停止拉扯。在俱乐部申诉的主要问题（罚球点球）上，裁判员决定正确，不应判罚球点球。其次，评议组多数成员认为：大连鲲城3号的拉扯动作构成犯规，并阻止了对方有希望的进攻，应判直接任意球并出示黄牌。裁判员判直接任意球的决定正确，但漏判大连鲲城3号黄牌。","videos":["2026/i07c07-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260513/1778670404194169.mp4"],"category":"freekick_foul","tags":["拉扯","SPA","黄牌"],"v":"wrong","var":"none"},{"seq":81,"issue":7,"no":8,"comp":"中乙联赛","round":"第7轮","home":"杭州临平吴越","away":"厦门飞鹭","minute":"50","match_info":"中乙联赛第7轮，杭州临平吴越VS厦门飞鹭","desc":"判例八：中乙联赛第7轮，杭州临平吴越VS厦门飞鹭。比赛第50分钟，杭州临平吴越33号队员进球，裁判员判进球有效。","appeal":"厦门飞鹭俱乐部申诉意见认为：对方33号在之前的争抢中对本方13号队员犯规在先，后续进球应无效。","conclusion":"对于此判例，评议组首先一致认为：杭州临平吴越33号在与厦门飞鹭13号争抢时犯规。其次，评议组多数成员认为：杭州临平吴越33号犯规后，双方队员又经过争抢和建立进攻，杭州临平吴越33号随后射门进球，在此情形下，可以认定为进球无效。裁判员判进球有效的决定错误，漏判杭州临平吴越33号犯规。","videos":["2026/i07c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260513/1778670456349122.mp4"],"category":"goal_decision","tags":["犯规在先","进球无效"],"v":"wrong","var":"none"},{"seq":82,"issue":7,"no":9,"comp":"中乙联赛","round":"第7轮","home":"杭州临平吴越","away":"厦门飞鹭","minute":"66","match_info":"中乙联赛第7轮，杭州临平吴越VS厦门飞鹭","desc":"判例九：中乙联赛第7轮，杭州临平吴越VS厦门飞鹭。比赛第66分钟，裁判员判罚厦门飞鹭7号队员争抢犯规，并与队员沟通交流，在裁判员尚未示意比赛恢复前，杭州临平吴越20号队员快发任意球，传给本队21号队员，随后厦门飞鹭19号队员铲抢杭州临平吴越21号，裁判员向厦门飞鹭队19号出示红牌。","appeal":"厦门飞鹭俱乐部申诉意见认为：对方任意球未在犯规地点发出，裁判员未及时停止比赛，之后本队19号的铲球不构成暴力行为或严重犯规，不应被红牌罚令出场。","conclusion":"对于此判例，评议组首先一致认为：裁判员在进行管理、未示意可以恢复比赛时，杭州临平吴越20号快发任意球，其发球位置未在犯规地点，快发任意球不合规，比赛暂未恢复。随后厦门飞鹭19号的铲球动作构成红牌。裁判员向厦门飞鹭队19号出示红牌罚令出场的决定正确。其次，评议组多数成员认为红牌原因为暴力行为。","videos":["2026/i07c09-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260513/1778670507501585.mp4"],"category":"sfp_vc","tags":["红牌","暴力行为","快发任意球"],"v":"correct","var":"none"},{"seq":83,"issue":7,"no":10,"comp":"中乙联赛","round":"第7轮","home":"杭州临平吴越","away":"厦门飞鹭","minute":"","match_info":"中乙联赛第7轮，杭州临平吴越VS厦门飞鹭","desc":"判例十：中乙联赛第7轮，杭州临平吴越VS厦门飞鹭。比赛第90+12分钟，厦门飞鹭17号队员在对方罚球区内带球突破后倒地。裁判员未判罚犯规。","appeal":"厦门飞鹭俱乐部申诉意见认为：对方20号在防守本方17号时犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：杭州临平吴越20号队员防守时的争抢动作和接触力度正常，从现有视频的角度和拍摄距离看，无守方犯规的其他证据，支持裁判员未判罚犯规的决定。","videos":["2026/i07c10-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260513/1778670553271040.mp4"],"category":"penalty_area","tags":["正常接触"],"v":"correct","var":"none"},{"seq":84,"issue":7,"no":11,"comp":"中乙联赛","round":"第8轮","home":"武汉三镇B队","away":"广州蒲公英","minute":"41","match_info":"中乙联赛第8轮，武汉三镇B队VS广州蒲公英","desc":"判例十一：中乙联赛第8轮，武汉三镇B队VS广州蒲公英。比赛第41分钟，武汉三镇B队55号在对方罚球区内倒地，裁判员未判罚犯规。","appeal":"武汉三镇俱乐部申诉意见认为：对方48号对本方55号犯规，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：武汉三镇B队55号扣球后，广州蒲公英48号草率绊人犯规，应判罚球点球。裁判员决定错误，漏判罚球点球。","videos":["2026/i07c11-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260513/1778670587517967.mp4"],"category":"penalty_area","tags":["点球","绊摔"],"v":"wrong","var":"none"},{"seq":85,"issue":7,"no":12,"comp":"中乙联赛","round":"第8轮","home":"武汉三镇B队","away":"广州蒲公英","minute":"49","match_info":"中乙联赛第8轮，武汉三镇B队VS广州蒲公英","desc":"判例十二：中乙联赛第8轮，武汉三镇B队VS广州蒲公英。比赛第49分钟，裁判员判广州蒲公英3号队员犯规后，后者将球拿起，武汉三镇B队6号队员要求其归还球，广州蒲公英3号手部疑似接触对方6号面部，裁判员对此未出示红黄牌。","appeal":"武汉三镇俱乐部申诉意见认为：应向对方3号出示红牌罚令出场。","conclusion":"对于此判例，评议组一致认为：广州蒲公英3号队员争抢球时的犯规动作，不构成鲁莽犯规，无需出示黄牌。之后在比赛停止期间，广州蒲公英3号手臂与对方队员的接触不清晰，无法认定构成击打面部的暴力行为。在俱乐部申诉的主要问题（红牌）上，裁判员决定正确，并非红牌。但应因非体育行为向广州蒲公英3号出示黄牌，裁判员漏判黄牌。","videos" sue":10,"no":8,"comp":"中乙联赛","round":"第11轮","home":"温州俱乐部","away":"厦门飞鹭","minute":"21","match_info":"中乙联赛第11轮，温州俱乐部VS厦门飞鹭","desc":"判例八：中乙联赛第11轮，温州俱乐部VS厦门飞鹭。比赛第21分钟，裁判员判温州俱乐部28号队员对厦门飞鹭5号队员犯规，并出示黄牌。","appeal":"厦门飞鹭俱乐部申诉意见认为：对方8号队员也对本方5号实施了犯规，并且属于恶意严重犯规，应向对方8号出示红牌。","conclusion":"对于此判例，首先评议组多数成员认为：现有视频不能清晰证明温州俱乐部8号与厦门飞鹭5号的接触部位和力度，从视频上看应视为鲁莽犯规并出示黄牌，不应出示红牌。在俱乐部申诉的核心问题（红牌）上，裁判员决定正确，不是红牌。但裁判员漏判温州俱乐部8号黄牌。其次评议组多数成员认为：温州俱乐部28号对厦门飞鹭5号的拉扯不构成阻止对方有希望的进攻的犯规，不应出示黄牌，裁判员向温州俱乐部28号出示黄牌的决定错误。","videos":["2026/i10c08-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260618/1781744552947499.mp4"],"category":"sfp_vc","tags":["黄牌","拉扯","SPA不成立"],"v":"wrong","var":"none"},{"seq":126,"issue":10,"no":9,"comp":"中乙联赛","round":"第11轮","home":"温州俱乐部","away":"厦门飞鹭","minute":"46","match_info":"中乙联赛第11轮，温州俱乐部VS厦门飞鹭","desc":"判例九：中乙联赛第11轮，温州俱乐部VS厦门飞鹭。比赛第46分钟，裁判员判厦门飞鹭7号队员与温州俱乐部6号队员争抢时严重犯规，并出示红牌。","appeal":"厦门飞鹭俱乐部申诉意见认为：本方7号不构成严重犯规，不应被出示红牌。","conclusion":"对于此判例，评议组一致认为：厦门飞鹭7号非法使用手臂与对方接触争抢球，属于鲁莽犯规，应出示黄牌；但不属于使用手臂作为武器击打对方队员头面部，不应出示红牌。裁判员向厦门飞鹭7号出示红牌的决定错误。","videos":["2026/i10c09-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260618/1781744637247384.mp4"],"category":"sfp_vc","tags":["黄牌","手臂","红牌不成立"],"v":"wrong","var":"none"},{"seq":127,"issue":11,"no":1,"comp":"中超联赛","round":"第16轮","home":"重庆铜梁龙","away":"天津津门虎","minute":"90","match_info":"中超联赛第16轮，重庆铜梁龙VS天津津门虎","desc":"判例一：中超联赛第16轮，重庆铜梁龙VS天津津门虎。比赛第90分钟，天津津门虎8号队员进球。助理裁判员示意天津津门虎7号队员越位犯规，裁判员判天津津门虎7号越位犯规在先，进球无效。随后裁判员主动发起在场回看，经在场回看后，最终判定越位犯规在先，进球无效。","appeal":"天津津门虎俱乐部申诉意见认为：本方7号未阻挡守门员视线及影响扑救动作，不应视为越位犯规，进球应有效。","conclusion":"对于此判例，评议组一致认为：处于越位位置的天津津门虎7号队员虽未触及球，但其做出的明显举动对重庆铜梁龙守门员处理球能力造成了影响，应视为干扰对方队员的越位犯规。裁判员经在场回看确认后，判定天津津门虎7号越位犯规在先、进球无效的决定正确。","videos":["2026/i11c01-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260701/1782903580495482.mp4"],"category":"offside","tags":["越位位置","干扰对方","VAR回看"],"v":"correct","var":"none"},{"seq":128,"issue":11,"no":2,"comp":"中超联赛","round":"第16轮","home":"北京国安","away":"武汉三镇","minute":"52","match_info":"中超联赛第16轮，北京国安VS武汉三镇","desc":"判例二：中超联赛第16轮，北京国安VS武汉三镇。比赛第52分钟，武汉三镇7号队员在对方罚球区线附近与北京国安8号队员接触后倒地。裁判员判北京国安8号在本方罚球区内犯规，并判罚球点球。VAR介入后，裁判员最终认定犯规地点在罚球区外，改判由武汉三镇队踢直接任意球。","appeal":"武汉三镇俱乐部申诉意见认为：对方8号犯规接触点在罚球区内，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：从VAR检查视频中的相关画面看，北京国安8号犯规的接触点在罚球区外，不构成罚球点球。经VAR介入后，裁判员判由武汉三镇队踢直接任意球的决定正确。VAR介入正确。","videos":["2026/i11c02-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260701/1782903603881328.mp4"],"category":"penalty_area","tags":["犯规地点","VAR介入正确"],"v":"correct","var":"correct"},{"seq":129,"issue":11,"no":3,"comp":"中超联赛","round":"第16轮","home":"北京国安","away":"武汉三镇","minute":"","match_info":"中超联赛第16轮，北京国安VS武汉三镇","desc":"判例三：中超联赛第16轮，北京国安VS武汉三镇。比赛第90+4分钟，武汉三镇队员进攻中将球传至北京国安罚球区内，球接触北京国安7号队员身体后弹到距离较近的北京国安8号队员手臂上。裁判员未判罚手球犯规，VAR未介入。","appeal":"武汉三镇俱乐部申诉意见认为：对方8号手臂不在自然位置，应判手球犯规和罚球点球。","conclusion":"对于此判例，评议组一致认为：球经北京国安队7号身体近距离折射后意外接触北京国安8号手臂，其手臂位置不属于使身体不自然扩大并冒手球犯规风险的情形，不构成手球犯规。裁判员未判罚手球犯规正确。VAR未介入正确。","videos":["2026/i11c03-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260701/1782903628471252.mp4"],"category":"handball","tags":["意外手球","自然位置"],"v":"correct","var":"correct"},{"seq":130,"issue":11,"no":4,"comp":"中超联赛","round":"第16轮","home":"大连英博","away":"上海申花","minute":"19","match_info":"中超联赛第16轮，大连英博海发VS上海申花","desc":"判例四：中超联赛第16轮，大连英博海发VS上海申花。比赛第19分钟，上海申花19号队员在对方罚球区内与大连英博海发6号队员接触后倒地，裁判员未判罚犯规，VAR介入，裁判员经在场回看后，判大连英博海发6号犯规并判罚球点球。","appeal":"大连英博海发俱乐部申诉意见认为：本方6号不犯规，不应被判罚球点球，应判罚对方19号亮鞋钉危险动作违规。","conclusion":"对于此判例，评议组多数成员认为：上海申花19号在争抢中率先触球，且属于合理动作。大连英博海发6号试图踢球时踢到上海申花19号，并具有一定力度，属于草率踢人犯规。裁判员经在场回看后判大连英博海发6号犯规并判罚球点球的最终决定正确。VAR介入正确。","videos":["2026/i11c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260701/1782903647929826.mp4"],"category":"penalty_area","tags":["点球","踢人"],"v":"correct","var":"correct"},{"seq":131,"issue":11,"no":5,"comp":"中甲联赛","round":"第12轮","home":"石家庄功夫","away":"南京城市","minute":"16","match_info":"中甲联赛第12轮，石家庄功夫VS南京城市","desc":"判例五：中甲联赛第12轮，石家庄功夫VS南京城市。比赛第16分钟，裁判员判罚石家庄功夫16号队员在防 ":["https://videooss.thecfa.cn/upload/video/20260722/1784708804452552.mp4"],"category":"handball","tags":["点球","手臂不自然扩大"],"v":"correct","var":"none"},{"seq":162,"issue":14,"no":4,"comp":"中甲联赛","round":"第15轮","home":"定南赣联","away":"宁波俱乐部","minute":"","match_info":"中甲联赛第15轮，定南赣联VS宁波俱乐部","desc":"判例四：中甲联赛第15轮，定南赣联VS宁波俱乐部。比赛第90+5分钟，定南赣联4号队员在与宁波俱乐部5号队员争抢高空球后倒地，裁判员认为宁波俱乐部5号草率犯规，并掌握有利，比赛继续进行。","appeal":"定南赣联俱乐部申诉意见认为：对方5号使用手肘击打本方4号头部，应向对方5号出示红牌。","conclusion":"对于此判例，评议组首先一致认为：从现有视频看，宁波俱乐部5号跳起争抢头球时违规使用手臂接触对方队员，但并非以手臂作为武器故意击打对方队员头面部，不属于严重犯规或暴力行为。在俱乐部申诉的主要问题（红牌）上，裁判员决定正确，并非红牌。其次评议组多数成员认为：在掌握有利完成后，应以鲁莽犯规原因，向宁波俱乐部5号出示黄牌。","videos":["2026/i14c04-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260722/1784708855505336.mp4"],"category":"sfp_vc","tags":["黄牌","手臂","红牌不成立"],"v":"wrong","var":"none"},{"seq":163,"issue":14,"no":5,"comp":"中甲联赛","round":"第15轮","home":"定南赣联","away":"宁波俱乐部","minute":"","match_info":"中甲联赛第15轮，定南赣联VS宁波俱乐部","desc":"判例五：中甲联赛第15轮，定南赣联VS宁波俱乐部。比赛第90+7分钟，定南赣联进攻中将球传中至对方罚球区内，定南赣联11号在与宁波俱乐部16号争抢位置时倒地。裁判员未判罚犯规。","appeal":"定南赣联俱乐部申诉意见认为：对方16号拉扯本方11号并致其倒地，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：双方队员的接触属于比赛中移动和争抢位置时的正常接触，球也并未传至双方队员争抢范围内，双方均不犯规。裁判员未判罚犯规的决定正确。","videos":["2026/i14c05-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260722/1784708881236370.mp4"],"category":"penalty_area","tags":["正常接触"],"v":"correct","var":"none"},{"seq":164,"issue":14,"no":6,"comp":"女超联赛","round":"第11轮","home":"山东体彩女足","away":"北京城建女足","minute":"","match_info":"女超联赛第11轮，山东体彩女足VS北京城建女足","desc":"判例六：女超联赛第11轮，山东体彩女足VS北京城建女足。比赛第90+5分钟，北京城建27号队员前插跑动至对方罚球区内，与山东体彩队员发生接触后倒地。裁判员未判罚犯规。","appeal":"北京城建女足申诉意见认为：对方队员拉扯本方27号并致其倒地，应判罚球点球。","conclusion":"对于此判例，评议组一致认为：北京城建27号前插跑位时，山东体彩6号队员试图使用手臂阻拦未果，之后在罚球区内对北京城建27号实施拉扯犯规，并阻止了对方有希望的进攻。应判山东体彩6号犯规、判罚球点球并出示黄牌警告。裁判员决定错误，漏判罚球点球和黄牌。","videos":["2026/i14c06-1.mp4"],"video_urls":["https://videooss.thecfa.cn/upload/video/20260722/1784708908935833.mp4"],"category":"penalty_area","tags":["点球","拉扯","SPA","黄牌"],"v":"wrong","var":"none"},{"seq"
